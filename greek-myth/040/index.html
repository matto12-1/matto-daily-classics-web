  <noscript><article class="ns-text"><h1>가져오라는 것이 하필</h1><h2>그물 깁는 아침</h2><p>페르세우스는 그물코 하나를 입에 물고 있었어요. 두 손이 다 바빴거든요. 한 손으로 찢어진 자리를 잡고 다른 손으로 실을 돌려 감았지요.</p><p>옆에 앉은 어부가 그것을 곁눈으로 보았어요. 열여덟 해 전에 모래밭에서 상자 뚜껑을 열어 준 사람이 바로 그 어부였어요.</p><p>“매듭이 헐거워.” 어부가 말했어요.</p><p>페르세우스는 실을 풀고 다시 감았어요. 어부는 말이 아주 적은 사람이었어요. 하루에 하는 말이 열 마디를 넘지 않았지요. 그런데 그 열 마디는 하나도 버릴 것이 없었어요.</p><p>다나에는 마당에서 생선을 널고 있었어요. 열여덟 해 동안 다나에는 그 집에서 지냈어요. 처음 얼마간은 밤마다 바다 쪽을 보고 앉아 있었지만, 언젠가부터는 보지 않게 되었지요.</p><p>페르세우스는 자기가 어디서 왔는지 대강만 알고 있었어요. 상자에 실려 왔다는 것, 그 상자를 이 집 어른이 열었다는 것까지요. 그 이상은 어머니가 말해 주지 않았어요. 물어도 손을 젓기만 했지요.</p><p>그 섬에는 왕이 있었어요. 그리고 그 왕은 어부의 형이었어요. 형제였지만 사는 데가 아주 달랐어요. 하나는 언덕 위 흰 집에, 하나는 바닷가 낮은 집에요.</p><p>그날 낮에 언덕에서 사람이 하나 내려왔어요. 왕의 심부름꾼이었지요.</p><p>“왕께서 다나에 님과 저녁을 함께하자고 하십니다.” 심부름꾼이 말했어요.</p><p>다나에는 손에 든 생선을 마저 널었어요. 그러고는 못 간다고 했어요. 심부름꾼은 사흘 뒤에 또 왔어요. 그다음 주에도 왔고요. 그렇게 봄이 다 갔지요.</p><p>여름이 시작될 무렵에는 왕이 직접 내려왔어요. 흰 옷자락에 모래가 묻는 것도 개의치 않고요. 왕은 낮은 집 문 앞에 서서 안을 들여다보았어요.</p><p>“이런 낮은 집에서 지낼 분이 아닙니다. 언덕 위 제 집으로 오십시오.” 왕이 말했어요.</p><p>“저는 이 집이 좋습니다.” 다나에가 대답했어요.</p><p>왕은 웃었어요. 그러고는 방 안을 천천히 둘러보았어요. 그 눈길이 어디에 오래 머물렀는지는 다나에도 알았지요. 흙바닥과 낡은 그물과 소금 항아리요.</p><p>“제 집으로 오는 일을 생각해 보십시오. 저는 급할 것이 없습니다.”</p><p>그때 문간이 어두워졌어요. 페르세우스가 그물을 어깨에 걸친 채 서 있었어요. 열여덟 살이었고, 왕보다 머리 하나가 더 컸지요.</p><p>“어머니는 왕의 집에 안 가십니다.” 페르세우스가 말했어요.</p><p>왕은 처음 보는 사람처럼 페르세우스를 위아래로 훑어보았어요. 그러고는 아주 천천히 고개를 끄덕였어요.</p><p>“많이 컸구나.”</p><p>“가실 일이 있으면 제가 대신 가겠습니다.”</p><p>왕은 대답하지 않고 문을 나섰어요. 나서다 말고 한 번 돌아보았지요. 왕이 언덕을 다 올라간 뒤에도 다나에는 한참 동안 소금 항아리 뚜껑을 열었다 닫았다 했어요. 페르세우스가 무슨 일이냐고 물었어요. 다나에는 아무 일도 아니라고 했지요.</p><p>그날 이후로 심부름꾼은 오지 않았어요. 다나에는 그것이 좋은 일인 줄 알았어요.</p><h2>말이 앞선 저녁</h2><p>가을에 왕이 잔치를 열었어요. 왕이 장가를 든다고 했어요. 바다 건너 어느 집안의 딸이라고요. 섬 사람들은 어리둥절했지만 잔치는 잔치였지요. 언덕 위 마당에 자리가 깔리고 불이 여러 개 놓였어요.</p><p>그런데 그 잔치에는 조건이 하나 있었어요. 오는 사람마다 선물을 하나씩 가져오라는 것이었어요. 그것도 말 한 마리씩요.</p><p>섬에는 말이 흔하지 않았어요. 그래도 있는 집은 있었지요. 그날 저녁 마당 옆 울타리에는 말이 열몇 마리 매여 있었어요. 갈기를 빗겨 온 말도 있었고요.</p><p>페르세우스는 빈손으로 갔어요. 어부의 집에 말이 있을 리 없었으니까요.</p><p>왕이 자리를 돌며 한 사람씩 이름을 불렀어요. 이름이 불린 사람은 일어서서 자기가 끌고 온 말을 말했지요. 밤색이니 흰 점이 있느니 두 살이니 하는 이야기가 한참 오갔어요. 왕은 그때마다 고개를 끄덕이며 좋다고 했어요. 어느 말이 좋고 어느 말이 덜한지는 한 번도 가리지 않았고요.</p><p>옆자리에 앉은 사람이 페르세우스에게 귓속말을 했어요. 그냥 앉아 있으라고요. 아무도 어부의 아들에게 말을 바라지는 않는다고요.</p><p>“그리고 저 아래 어부 집 아이. 너는 무슨 말을 가져왔느냐?”</p><p>왕이 마지막으로 페르세우스 쪽을 보았어요. 마당이 조용해졌어요.</p><p>“저는 가져온 말이 없습니다.” 페르세우스가 일어서며 말했어요.</p><p>어디선가 누가 웃었어요. 페르세우스의 귀가 붉어졌지요.</p><p>“없으면 없는 대로 되었다.” 왕이 말했어요.</p><p>왕은 벌써 다른 데를 보고 있었어요. 페르세우스는 도로 앉지 않았어요. 마당 저쪽에서 누가 또 웃었지요.</p><p>“말 말고 다른 것이면 됩니다. 무엇이든 말씀만 하십시오.”</p><p>페르세우스가 말했어요. 그 말을 하고 나서야 페르세우스는 자기가 무슨 말을 했는지 알았어요. 그런데 이미 늦었지요.</p><p>왕은 잔을 내려놓았어요. 그러고는 아주 천천히 웃었어요. 그 웃음은 아까 웃던 것과 달랐어요.</p><p>“무엇이든 가져오겠다는 말이냐?”</p><p>“네, 무엇이든지요.”</p><p>마당이 완전히 조용해졌어요. 왕이 자리에서 일어섰어요.</p><p>“그러면 서쪽 끝에 사는 그 괴물의 머리를 가져오너라.”</p><p>사람들이 웅성거렸어요. 누군가 잔을 떨어뜨렸고요.</p><p>보는 사람을 돌로 만든다는 괴물이었어요. 눈이 마주치면 그 자리에서 돌이 된다고요. 그 괴물을 찾아간 사람 가운데 돌아온 사람은 아직 하나도 없었어요. 아무도 그 얼굴을 본 적이 없다는 말은, 본 사람은 이제 말을 할 수 없게 되었다는 뜻이었지요.</p><p>페르세우스는 대답하지 않았어요. 왕이 한 번 더 물었어요.</p><p>“그 괴물의 머리는 못 가져오겠느냐?”</p><p>“그 머리를 가져오겠습니다.” 페르세우스가 말했어요.</p><p>그러고는 마당을 걸어 나왔어요. 등 뒤에서 아무 소리도 나지 않았어요. 울타리에 매인 말 열몇 마리는 그날 밤이 다 가도록 아무도 풀어 가지 않았어요. 이튿날 아침에도 그대로 매여 있었고, 그다음 날에도 그대로였지요. 그건 어른이 할 짓이 아니었어요.</p><h2>자루를 싸는 새벽</h2><p>다나에는 그 이야기를 그날 밤에 들었어요. 아무 말도 하지 않았어요. 대신 밤새 부엌에 불을 켜 두었지요.</p><p>새벽에 페르세우스가 나왔을 때 다나에는 이미 자루를 하나 싸 두었어요. 빵과 마른 생선과 소금이 들어 있었어요. 다나에는 자루 끈을 묶었다가 풀고 다시 묶었어요.</p><p>“그 괴물이 어디 사는지는 아느냐?”</p><p>“서쪽 끝이라고만 들었습니다.”</p><p>“서쪽은 넓다. 그것만 알고는 찾기 어렵다.” 다나에가 말했어요.</p><p>페르세우스는 대답하지 않았어요. 다나에도 더 말하지 않았고요. 두 사람은 마당 한가운데에 한참 서 있었어요.</p><p>다나에가 자루를 열고 무언가를 하나 더 넣었어요. 아주 작은 천 조각이었어요. 손바닥에 올려놓으면 다 덮이는 크기였지요.</p><p>“이 천 조각은 뭡니까?”</p><p>“옛날에 짠 거다.”</p><p>다나에는 그 말만 했어요. 어디서 짰는지도, 무엇을 만들다 남은 것인지도 말하지 않았고요. 페르세우스는 그것을 자루 맨 밑에 밀어 넣었어요.</p><p>어부는 문간에 서서 보고만 있었어요. 페르세우스가 인사를 하자 고개를 한 번 끄덕였지요. 그러고는 허리에서 자기가 쓰던 칼집을 풀어 건넸어요. 열 마디 가운데 한 마디도 쓰지 않았고요.</p><p>다나에는 마당 끝까지 따라 나왔어요. 거기서 멈췄어요. 페르세우스는 뒤를 돌아보지 않았어요. 언덕을 다 올라가서야 한 번 돌아보았는데, 다나에는 아직 그 자리에 서 있었어요.</p><h2>길에서 만난 둘</h2><p>섬을 벗어나 뭍에 닿은 뒤로 페르세우스는 사흘을 걸었어요. 서쪽으로요. 만나는 사람마다 물었어요. 다들 서쪽을 가리켰어요. 그런데 얼마나 가야 하는지는 아무도 몰랐지요. 사흘째 저녁에 페르세우스는 길가 돌에 앉았어요. 신발 밑창이 벌써 얇아져 있었어요.</p><p>그때 길 저쪽에서 두 사람이 걸어왔어요. 하나는 젊은 남자였어요. 걸음이 이상했어요. 천천히 걷는 것 같은데 자꾸 앞서 있었거든요. 발목에 작은 날개가 달려 있었어요.</p><p>다른 하나는 여자였어요. 청동 투구를 썼고, 어깨에 부엉이가 한 마리 앉아 있었어요. 팔에는 둥근 방패를 걸고 있었고요.</p><p>아테나와 헤르메스였어요. 페르세우스는 일어섰어요. 무릎이 저절로 굽었지요.</p><p>“앉아 있어라.” 아테나가 말했어요.</p><p>다나에가 열여덟 해 동안 딱 한 번 해 준 이야기가 있었어요. 네모난 하늘에서 황금빛 비가 내렸다는 이야기였지요. 페르세우스는 그 이야기를 한 번도 믿은 적이 없었어요. 그날 저녁까지는요.</p><p>아테나가 방패를 풀어 페르세우스 앞에 세웠어요. 방패 안쪽이 거울처럼 닦여 있었어요. 얼굴이 다 비쳤지요. 페르세우스는 자기 얼굴을 그렇게 또렷하게 본 적이 없었어요.</p><p>“그 괴물의 얼굴을 직접 보면 안 된다.”</p><p>“얼굴을 보지 않고 어떻게 그 머리를 벱니까?”</p><p>“괴물을 보지 말고 이 방패에 비친 모습을 보아라.” 아테나가 말했어요.</p><p>페르세우스는 방패를 이리저리 돌려 보았어요. 방패 안에서는 세상이 뒤집혀 있었어요. 오른손이 왼손이 되고 왼손이 오른손이 되었지요. 그 안을 보면서 무언가를 겨눈다는 것이 어떤 일일지 페르세우스는 짐작이 가지 않았어요.</p><p>“방패를 보고 겨누는 연습을 해라.” 아테나가 말했어요. “가는 동안 내내.”</p><p>헤르메스는 그동안 발목에서 신발을 벗고 있었어요. 날개 달린 신발이었어요.</p><p>“이 신발은 빌려주는 거야. 일이 끝나면 돌려받을 거고.” 헤르메스가 말했어요.</p><p>페르세우스가 그 신발을 신자 발이 저절로 떴어요. 페르세우스는 균형을 잃고 돌 뒤로 넘어졌지요. 헤르메스가 웃었어요.</p><p>헤르메스는 자루도 하나 주었어요. 낡은 가죽 자루였어요. 무엇을 넣어도 무겁지 않고, 안에 든 것이 밖에서 보이지 않는 자루라고 했지요. 마지막으로 낫처럼 안으로 굽은 칼을 하나 건넸어요. 곧은 칼로는 안 된다면서요.</p><p>“왜 저를 도와주십니까?”</p><p>페르세우스가 물었어요. 두 신은 서로를 한 번 보았어요.</p><p>“네 아버지의 뜻이라서 돕는 거다.” 헤르메스가 말했어요.</p><p>페르세우스는 더 묻지 않았어요. 대신 방패 안에 비친 자기 얼굴을 다시 한번 내려다보았지요.</p><p>“괴물에게 가는 길은 우리가 알려 줄 수 없다. 그 길은 세 노파만 안다.” 아테나가 말했어요.</p><p>세 노파는 해가 넘어가는 쪽 끝, 빛이 닿지 않는 바닷가 바위에 앉아 있다고 했어요.</p><p>“하나 더 알아 둬.” 헤르메스가 말했어요. “그 셋은 순순히 말해 주지 않을 거야.”</p><p>두 신이 사라지자 페르세우스는 일어나 방패를 들었어요. 등 뒤에 있는 나무를 방패 안에서 찾고, 고개를 돌리지 않은 채로 그쪽에 손을 뻗어 보았어요. 처음에는 열 번에 아홉 번을 헛짚었어요. 사흘이 지나자 열 번에 두 번은 맞았고요.</p><h2>눈이 하나뿐인 셋</h2><p>그 바닷가는 낮인지 밤인지 알 수가 없었어요. 해가 넘어가다 만 것처럼 하늘 끝만 붉었지요. 파도 소리는 나는데 물은 보이지 않았어요.</p><p>노파 셋이 바위에 나란히 앉아 있었어요. 셋 다 아주 늙었어요. 머리도 셋 다 하얬고요. 눈은 하나뿐이었어요.</p><p>가운데 노파가 그 눈을 손바닥에 올려놓고 무언가를 보고 있었어요. 다 보고 나면 옆으로 넘겼어요. 받은 노파가 그것을 눈자리에 끼우고 한참 보다가 또 옆으로 넘겼지요. 눈이 손에서 손으로 건너가는 동안에는 셋 다 아무것도 보지 못했어요.</p><p>페르세우스는 바위 뒤에 앉아 그것을 오래 지켜보았어요. 넘기는 자리가 늘 같았어요. 손에서 손으로 건너가는 그 짧은 동안이요.</p><p>페르세우스는 신발을 벗었어요. 소리가 나지 않게요. 그리고 기다렸어요.</p><p>기다리는 동안 페르세우스는 손바닥을 두 번 폈다가 오므렸어요. 늙은 사람들에게서 눈을 빼앗는 일이었으니까요. 그런데 물어서 알려 줄 것 같지는 않았어요. 페르세우스는 눈을 감았다가 떴어요.</p><p>눈이 손에서 손으로 건너가는 순간, 페르세우스가 손을 뻗었어요. 세 노파가 동시에 멈췄어요.</p><p>“이번엔 내가 눈을 받을 차례인데.”</p><p>“눈이 나한테 안 왔는데.”</p><p>“누가 우리 눈을 가져갔다.”</p><p>셋이 한꺼번에 떠들었어요. 페르세우스는 손바닥 위의 것을 내려다보았어요. 따뜻했어요. 페르세우스는 그것을 얼른 옷자락으로 감쌌지요.</p><p>“눈은 제 손에 있습니다.” 페르세우스가 말했어요.</p><p>세 노파가 소리 나는 쪽으로 얼굴을 돌렸어요. 여섯 개의 눈꺼풀이 다 감겨 있었어요.</p><p>“우리 눈을 돌려다오.”</p><p>“한 가지만 알려 주십시오. 그 괴물이 사는 곳을 알려 주시면 돌려드리겠습니다.”</p><p>노파들은 한참 조용했어요.</p><p>“어리석은 것.” 맨 왼쪽 노파가 말했어요.</p><p>“괴물 사는 곳을 안 가르쳐 주면 못 가겠지. 가르쳐 주면 가서 못 돌아올 테고.”</p><p>오른쪽 노파가 그 말을 받았어요. 가운데 노파는 아무 말도 하지 않다가 손을 내밀었어요.</p><p>“눈부터 먼저 다오.”</p><p>페르세우스는 잠깐 망설였어요. 그러고는 눈을 가운데 노파의 손바닥에 올려놓았어요. 노파는 그것을 눈자리에 끼웠어요. 그러고는 페르세우스를 한참 보았지요.</p><p>“길을 듣기도 전에 눈을 돌려주는구나.”</p><p>“돌려드리겠다고 약속했으니까요.”</p><p>노파는 다른 둘에게 무어라 소곤거렸어요. 셋이 한참을 소곤거렸어요. 그러고는 가운데 노파가 팔을 들어 한쪽을 가리켰지요.</p><p>“저쪽으로 사흘을 가면 물이 끝나고 돌이 시작된다. 서 있는 돌이 많아지면 다 온 것이다.”</p><p>페르세우스는 그 말을 속으로 두 번 되뇌었어요. 그리고 고맙다고 했어요. 돌아서는 등 뒤에서 왼쪽 노파가 한 마디를 보탰어요.</p><p>“그 괴물도 원래는 그런 무서운 얼굴이 아니었단다.”</p><p>페르세우스는 걸음을 멈췄어요. 무슨 뜻이냐고 물으려고 돌아섰지요. 그런데 바위 위에는 아무도 없었어요.</p><p>페르세우스는 신발을 다시 신었어요. 끈을 단단히 조였지요. 방패를 등에 지고, 자루를 허리에 매고, 굽은 칼을 옆구리에 찼어요.</p><p>발이 땅에서 떨어졌어요. 이번에는 넘어지지 않았어요. 바람이 찼어요. 아래로 검은 물이 지나갔어요. 페르세우스는 방패를 앞으로 돌려 그 안을 한 번 들여다보았어요. 뒤집힌 하늘이 거기 들어 있었지요.</p><p>그리고 서쪽으로 날아갔어요. 하늘 끝이 아직 붉었어요.</p></article></noscript>
