  <noscript><article class="ns-text"><h1>세상의 시작, 카오스에서 태어난 것들</h1><h2>아무것도 없던 시절</h2><p>쿵. 세상에서 처음 난 소리였어요. 그런데 그 소리를 들은 것은 아무도 없었어요. 소리를 들어 줄 귀가 아직 하나도 없었거든요.</p><p>방금 무엇이 떨어졌느냐고요? 떨어진 게 아니에요. 무언가가 처음으로 단단해진 소리였어요. 그게 무엇인지 이야기하려면 조금 앞으로 돌아가야 해요. 발밑에 디딜 바닥도 없고, 머리 위에 지붕도 없고, 해도 달도 별도 없던 시절까지요.</p><p>아주 먼 옛날, 세상이 아직 세상이 되기 전이었어요. 그저 끝없이 넓고 텅 빈 것이 있었을 뿐이지요. 옛 그리스 사람들은 그 텅 빈 상태를 카오스라고 불렀어요. 카오스는 누구의 이름도 아니고 어떤 신도 아니에요. 위도 아래도, 이쪽도 저쪽도 아직 정해지지 않은 상태를 가리키는 말이었어요.</p><p>카오스 안에서는 무엇이 무엇인지 나눌 수가 없었어요. 물도 흙도 바람도 한데 뒤섞여 있어서, 손을 뻗어 잡아 보려 해도 잡히는 것이 없었어요. 시간도 흐르지 않았어요. 어제와 오늘이 없으니 기다릴 일도, 자랄 일도 없었지요. 그래서 카오스는 무섭다기보다 심심한 곳에 가까웠어요. 아무 일도 일어나지 않았고, 무슨 일이 일어날지 궁금해할 누구도 아직 없었으니까요.</p><p>그런데 언젠가부터 그 안에서 무언가가 아주 천천히 모이기 시작했어요. 가벼운 것은 위로, 무거운 것은 아래로 갔어요. 그리고 아래로 아래로 가라앉은 것들이 서로를 꼭 껴안더니, 마침내 단단한 무언가가 되었어요. 쿵. 처음에 들려 드린 그 소리가 바로 이것이었어요. 세상의 첫 번째 것이 태어나는 순간이었지요.</p><p>가장 먼저 태어난 것은 넓고 단단한 땅이었어요. 사람들은 그 땅을 가이아라고 불렀어요. 가이아는 그냥 흙덩이가 아니었어요. 숨을 쉬고, 마음이 있고, 무엇이든 품어 낼 수 있는 어머니였지요. 가이아는 자기가 어디에서 왔는지 알지 못했어요. 눈을 떠 보니 자기가 여기에 있었고, 자기 말고는 아무도 없었을 뿐이에요.</p><p>가이아가 몸을 쭉 펴자 골짜기가 파이고 언덕이 솟았어요. 가이아가 한숨을 쉬자 그 자리에 강이 흘렀어요. 아직 그 위에 자라는 풀 한 포기 없었지만 땅은 조용히 기다렸어요. 언젠가 여기에서 무엇이든 자라리라는 것을 이미 알고 있는 것처럼요.</p><p>가이아 곁에는 밤도 함께 태어났어요. 밤은 검고 부드러운 옷자락 같아서 세상을 살며시 덮어 주었어요. 그리고 밤 다음에는 낮도 태어났지요. 밤과 낮은 사이좋게 번갈아 가며 세상을 지켰어요. 하나가 물러나면 다른 하나가 나오고, 그 하나가 물러나면 또 다른 하나가 나왔어요. 그렇게 세상에 처음으로 시간이 흐르기 시작했어요.</p><p>그중에서도 가장 신기한 것이 하나 있었어요. 사랑이었어요. 사랑은 눈에 보이지도 않고 손에 잡히지도 않았지만, 멀리 떨어져 있던 것들을 서로에게로 끌어당겼어요. 사랑이 태어난 뒤부터 세상에는 둘이 만나 하나가 되는 일이 생기기 시작했어요.</p><p>가이아는 넓은 몸을 이리저리 뒤척여 보았어요. 아무리 굴러 보아도 부딪히는 것이 없었어요. 그것이 조금 쓸쓸했지요. 어느 날 가이아는 가만히 생각했어요. 나는 이렇게 넓은데, 나를 덮어 줄 것이 아무것도 없구나.</p><p>그래서 가이아는 혼자 힘으로 하늘을 낳았어요. 별이 촘촘히 박힌, 끝이 보이지 않는 커다란 하늘이었지요. 그 하늘의 이름이 바로 우라노스예요. 우라노스는 그때까지 태어난 것 가운데 가장 아름다웠어요. 낮에는 티 없이 맑고, 밤에는 셀 수 없을 만큼 많은 별을 매달았으니까요.</p><p>우라노스는 태어나자마자 가이아의 위로 넓게 넓게 펼쳐졌어요. 땅의 끝에서 끝까지, 모자라지도 남지도 않게 꼭 맞았어요. 그럴 수밖에 없었어요. 우라노스는 가이아에게서 나왔으니까요.</p><p>가이아는 처음으로 위를 올려다보았어요. 낮에는 파랗고 밤에는 별로 가득한 지붕이 자기를 덮고 있었어요. 가이아는 마음이 따뜻해졌어요. 이제 혼자가 아니었으니까요.</p><p>우라노스도 아래를 내려다보았어요. 굽이치는 언덕과 깊은 골짜기가 보였어요. 사랑이 그 둘 사이를 조용히 지나갔고, 하늘과 땅은 부부가 되었어요. 그리고 얼마 지나지 않아 세상에서 가장 큰 아이들이 태어나기 시작했지요.</p><h2>하늘과 땅의 아이들</h2><p>가이아와 우라노스 사이에서 태어난 첫 아이들은 티탄이라고 불렸어요. 모두 열두 명이었지요.</p><p>티탄들은 산처럼 컸어요. 한 걸음을 걸으면 골짜기가 하나 생기고, 크게 웃으면 온 땅이 울렸어요. 어떤 아이는 세상을 빙 두르는 커다란 강이 되었고, 어떤 아이는 훗날 해와 달의 아버지가 되었어요. 어떤 아이는 한 번 본 것을 결코 잊지 않는 힘을 지녔지요. 티탄들은 넓은 땅을 마음껏 뛰어다녔어요. 저희끼리 힘을 겨루다가 바위를 굴리면 그 자리에 커다란 호수가 생겼어요.</p><p>그리고 가장 마지막에 태어난 아이가 있었어요. 이름은 크로노스였어요. 크로노스는 형들처럼 몸집이 크지도 않고, 누나들처럼 눈에 띄지도 않았어요. 대신 말이 적고 눈이 깊었어요. 무슨 일이 생기면 가장 먼저 입을 여는 대신 가장 오래 생각하는 아이였지요. 형들이 시끄럽게 웃을 때에도 크로노스는 저만치 떨어져 앉아 하늘을 올려다보곤 했어요.</p><p>가이아는 아이들이 자라는 것을 보며 기뻤어요. 텅 비어 있던 세상이 드디어 북적북적해졌으니까요. 하지만 우라노스는 그렇지 않았어요. 아이들이 하루가 다르게 커 가는 모습을 볼 때마다 마음이 이상하게 서늘해졌어요. 저 아이들이 다 자라면 나보다 커지겠구나. 우라노스는 그 생각을 좀처럼 지울 수 없었어요.</p><p>티탄들 다음에도 아이들이 태어났어요. 이번에는 조금 다르게 생긴 아이들이었어요.</p><p>먼저 이마 한가운데에 커다란 눈이 하나만 있는 삼 형제가 태어났어요. 사람들은 이 형제를 키클롭스라고 불렀어요. 외눈박이 거인이라는 뜻이지요. 키클롭스 형제는 손재주가 놀라웠어요. 불을 다루고 쇠를 두드려서 세상에 없던 물건을 척척 만들어 냈어요. 훗날 온 세상을 뒤흔들 무서운 무기도 이 형제의 손에서 나오게 돼요. 가이아는 그 아이들이 자랑스러웠어요. 눈이 하나뿐이어도 그 눈은 누구보다 밝게 빛났으니까요.</p><p>그다음에는 팔이 백 개나 되고 머리가 쉰 개나 되는 거인 삼 형제가 태어났어요. 백 개의 손을 가진 거인들, 백수거인이었어요. 이 형제가 한 번 팔을 휘두르면 바위 백 개가 한꺼번에 날아갔어요. 세상에서 가장 힘센 아이들이었지요. 그렇지만 이 형제는 그 힘을 함부로 쓰지 않았어요. 어머니가 부르면 백 개의 손을 모두 내려놓고 조용히 다가왔거든요.</p><p>그런데 우라노스는 이 여섯 아이를 보고 얼굴을 잔뜩 찡그렸어요.</p><p>“흉하구나. 내 아이라고 하기가 부끄럽다.”</p><p>“무슨 말씀이세요. 우리 아이들이에요.”</p><p>가이아가 놀라서 말했지만 우라노스는 듣지 않았어요. 아버지가 자기 아이에게 할 말은 아니었어요. 그건 정말 너무했지요.</p><p>우라노스는 그 아이들을 세상에 그냥 두고 볼 수 없다고 했어요. 그래서 아이들을 하나씩 붙잡아 땅속 깊은 곳에 가두어 버렸어요. 빛도 바람도 닿지 않는, 아주아주 깊은 곳이었어요. 아이들은 발버둥을 쳤지만 소용이 없었어요. 우라노스의 손은 하늘만큼이나 넓었으니까요.</p><p>그런데 땅속이 어디인가요. 바로 가이아의 몸속이었어요.</p><p>가이아는 자기 몸 안에 갇힌 아이들의 울음소리를 밤낮으로 들어야 했어요. 아이들이 벽을 두드리면 가이아의 가슴이 함께 울렸어요. 아이들이 흐느끼면 가이아의 골짜기마다 물이 차올랐어요. 그것이 세상에 처음 생긴 슬픔이었지요. 가이아는 잠을 잘 수 없었어요. 아무리 귀를 막아도 그 소리는 몸 안쪽에서 들려왔거든요.</p><p>가이아는 우라노스에게 몇 번이나 말했어요.</p><p>“저 아이들도 우리 아이예요. 제발 풀어 주세요.”</p><p>하지만 우라노스는 고개를 저었어요.</p><p>“안 된다. 저것들이 밖으로 나오면 언젠가 내 자리를 넘볼 테니까.”</p><p>“당신도 어머니에게서 태어나지 않았나요?”</p><p>우라노스는 아무 대답도 하지 않았어요. 가이아는 하늘을 올려다보았어요. 늘 따뜻하게만 보이던 그 지붕이 그날은 몹시 무겁게 느껴졌어요. 슬픔이 너무 오래 이어지면, 그 슬픔은 다른 것으로 바뀌기도 해요.</p><h2>가이아의 낫</h2><p>가이아는 자기 몸속 가장 깊은 곳으로 내려갔어요. 그리고 거기에서 세상에서 가장 단단한 쇠를 찾아냈어요. 아직 아무도 써 본 적 없는 회색 쇠였지요.</p><p>가이아는 그 쇠를 두드리고 또 두드려서 커다란 낫을 만들었어요. 날이 초승달처럼 휘어진 낫이었어요. 쇠를 두드릴 때마다 땅속에서 불꽃이 튀었지만, 그 소리는 갇힌 아이들의 울음소리에 묻혀 우라노스에게까지 닿지 않았어요. 다 만들고 나서 가이아는 한참 동안 그것을 내려다보았어요. 어머니가 이런 것을 만들게 될 줄은 자기도 몰랐거든요.</p><p>가이아는 티탄 아이들을 모두 불러 모았어요. 아이들은 어머니가 왜 부르는지도 모른 채 하나둘 모여들었어요. 열두 아이가 둘러서자 그 그늘이 골짜기를 통째로 덮었지요. 가이아는 낫을 내밀며 말했어요.</p><p>“너희 동생들이 지금도 땅속에서 울고 있단다. 너희 아버지가 한 일이야. 이 일을 멈춰 줄 아이가 있느냐?”</p><p>티탄들은 아무 말도 하지 못했어요. 맏이는 발끝만 내려다보았어요. 다른 형은 하늘을 힐끗 올려다보더니 얼른 고개를 돌렸어요. 아버지 우라노스가 무서웠던 거예요. 하늘은 언제나 머리 위에 있었으니까요.</p><p>가이아는 아무도 재촉하지 않았어요. 그저 낫을 든 채 아이들의 얼굴을 하나하나 바라보았지요. 무거운 침묵이 아주 길게 이어졌어요.</p><p>그때 맨 뒷줄에서 한 아이가 앞으로 걸어 나왔어요. 가장 어린 크로노스였어요.</p><p>“제가 하겠습니다, 어머니.”</p><p>형들이 웅성거렸어요. 저 어린 것이 무슨 소리냐고, 누군가 작게 중얼거렸어요. 가이아는 막내를 가만히 내려다보았어요. 형들보다 한참 작은 아이였어요. 그런데 그 눈은 조금도 흔들리지 않았지요.</p><p>“무섭지 않으냐?”</p><p>“무섭습니다. 그런데 동생들이 우는 소리가 더 무섭습니다.”</p><p>가이아는 한참 말이 없다가 조용히 고개를 끄덕였어요. 그러고는 낫을 크로노스의 손에 쥐여 주었어요. 낫날은 얼음처럼 차가웠어요. 크로노스는 그 차가움을 손바닥으로 꾹 눌러 보았어요. 낫은 크로노스의 키만큼이나 컸지만, 크로노스는 그것을 어렵지 않게 들어 올렸어요.</p><p>“오늘 밤이다.” 가이아가 낮은 목소리로 말했어요. “밤이 되면 네 아버지가 나에게 내려온단다. 그때까지 숨어 있다가 나오너라.”</p><p>크로노스는 고개를 끄덕였어요. 그러고는 낫을 품에 안고 어두운 골짜기 안으로 들어가 몸을 숨겼어요. 골짜기 안은 캄캄했고, 자기 심장 뛰는 소리만 크게 들렸어요.</p><p>형들은 아무도 크로노스를 따라가지 않았어요. 다만 멀리서 오래오래 바라보았지요. 그날따라 해는 유난히 천천히 지는 것 같았어요.</p><p>해가 지고 밤이 왔어요. 밤은 검고 부드러운 옷자락으로 세상을 조용히 덮었어요. 골짜기 안에서 크로노스는 두 손으로 낫자루를 꼭 붙들었어요. 손바닥이 축축했어요. 이윽고 별들이 하나씩 가까워졌어요. 우라노스가 내려오고 있다는 뜻이었지요.</p><p>우라노스는 천천히 내려왔어요. 별을 잔뜩 두른 채, 언제나처럼 땅에게 다가왔어요. 저 골짜기 안에 무엇이 숨어 있는지 아무것도 모르고 있었지요.</p><p>그때 골짜기에서 크로노스가 걸어 나왔어요. 손에는 어머니의 낫이 들려 있었어요. 크로노스는 숨을 한 번 크게 들이쉬고 낫을 높이 들어 올렸어요. 그리고 그 낫으로 아버지의 힘을 빼앗았어요. 단 한 번이었어요. 그리고 그것으로 충분했어요.</p><p>우라노스는 크게 소리를 질렀어요. 그 소리에 온 세상이 흔들렸어요. 산이 울리고 바다가 출렁였어요. 우라노스는 더 이상 땅으로 내려올 수 없게 되었고, 저 높은 곳으로 물러나고 말았어요. 지금 우리가 올려다보는 그 자리, 아무리 손을 뻗어도 닿지 않는 그 높이까지요.</p><p>가이아는 아무 말 없이 그 모습을 지켜보았어요. 기쁘지도 슬프지도 않은 얼굴이었지요. 그날부터 하늘과 땅은 다시는 맞닿지 않았어요. 우리 머리 위에 하늘이 저렇게 멀리 있는 것은 그때부터라고, 옛사람들은 이야기했어요.</p><p>티탄들이 막내 앞으로 우르르 모여 섰어요. 조금 전까지만 해도 아무도 나서지 않던 형과 누나들이었어요. 누군가는 크게 환호했고, 누군가는 얼른 무릎을 꿇었어요. 이제 그들은 크로노스를 왕이라고 불렀어요. 세상의 왕이 처음으로 바뀐 거예요. 크로노스는 낫을 내려놓고 아버지가 앉았던 자리에 앉았어요.</p><p>가이아는 그 소란을 지나 아들에게 다가갔어요.</p><p>“이제 땅을 열어 다오. 네 동생들이 아직 저 아래에 있단다. 키클롭스도, 백수거인도.”</p><p>크로노스는 바로 대답하지 않았어요. 한참 뒤에야 짧게 말했어요.</p><p>“어머니, 동생들을 꺼내 주는 일은 조금 뒤에 하지요.”</p><p>“조금 뒤가 언제냐?”</p><p>“때가 되면요.”</p><p>가이아는 아들의 얼굴을 오래 들여다보았어요. 낫을 받아 들 때는 조금도 흔들리지 않던 눈이, 지금은 어머니를 똑바로 보지 못하고 있었어요. 가이아는 문득 서늘해졌어요. 어디선가 본 적 있는 얼굴이었거든요. 아이들을 가두던 날의 우라노스가 꼭 그런 얼굴이었어요.</p><p>그때 저 멀고 높은 곳에서, 물러난 우라노스의 목소리가 밤하늘을 타고 천천히 내려왔어요.</p><p>“크로노스야. 너는 아버지를 몰아내고 왕이 되었구나. 그러니 잘 들어라. 너도 언젠가 네 아들의 손에 똑같이 그 자리를 빼앗기게 될 것이다.”</p><p>목소리는 그것으로 끝이었어요. 하늘은 다시 조용해졌어요. 크로노스는 아무 대답도 하지 않았어요. 다만 발밑에서 올라오는 동생들의 울음소리가, 그날따라 유난히 크게 들렸어요.</p></article></noscript>
