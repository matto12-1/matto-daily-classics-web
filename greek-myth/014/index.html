  <noscript><article class="ns-text"><h1>열두 번째 자리</h1><h2>산 아래에서 온 소문</h2><p>그해 봄, 헤르메스가 이상한 소문을 하나 물고 올라왔어요. 헤르메스는 하루에도 몇 번씩 땅 위를 오르내렸으니까, 사람들 사이에 도는 이야기를 가장 먼저 듣는 이가 늘 헤르메스였지요.</p><p>그날도 헤르메스는 발목의 날개가 젖은 채로 올라왔어요. 산 아래에 비가 오고 있었거든요. 헤르메스는 모자를 벗어 툭툭 털고는 곧장 이야기를 꺼냈어요.</p><p>“산 아래에 이상한 젊은이가 하나 돌아다녀요.”</p><p>헤르메스가 말했어요. 신들이 하나둘 고개를 들었어요.</p><p>“마을마다 들어가서 마른 땅에 나뭇가지를 꽂고 다닌대요. 그러고는 아무 값도 안 받고 그냥 간다는데요.”</p><p>“마른 땅에 나뭇가지를 꽂는다고?”</p><p>아폴론이 되물었어요.</p><p>“네. 그런데 그 가지에서 열매가 열린대요.”</p><p>“무슨 열매인데?”</p><p>아르테미스가 기둥 뒤에서 물었어요. 사냥을 다니느라 산 아래 일이라면 아르테미스도 아는 것이 많았거든요.</p><p>“저도 못 봤어요. 그런데 그걸 심은 마을 사람들이 그해 겨울을 났대요.”</p><p>제우스가 잔을 내려놓았어요.</p><p>“그 젊은이는 누구의 아이냐?”</p><p>헤르메스는 그 질문에 바로 대답하지 못했어요. 아까부터 그 대목이 마음에 걸렸거든요.</p><p>“사람들 말로는, 어머니가 사람이었대요.”</p><p>산꼭대기가 조용해졌어요. 데메테르가 손에 쥐고 있던 밀 이삭을 무릎에 내려놓았어요. 아테나는 아무 말 없이 제우스 쪽을 보았고요.</p><p>헤라는 아무 데도 보지 않았어요. 다만 팔짱을 낀 손에 힘이 들어갔지요. 신과 사람 사이에서 아이가 태어나는 일이 아주 없지는 않았어요. 그런데 그런 아이는 대개 땅 위에서 살다가 땅 위에서 생을 마쳤지요. 산 위로 올라오는 일은 없었어요.</p><p>그래서 그날 산꼭대기에는 아무도 입 밖에 내지 않은 물음이 하나 떠 있었어요. 저 아이를 어떻게 할 것인가 하는 물음이었지요.</p><p>“내려가서 보고 오너라.”</p><p>제우스가 말했어요. 헤르메스는 그날로 다시 내려갔어요.</p><h2>마른 언덕의 덩굴</h2><p>헤르메스가 찾아간 마을은 산기슭에 있었어요. 땅이 좋지 않은 마을이었어요. 언덕은 온통 돌투성이였고, 흙은 손으로 쥐면 부슬부슬 흩어졌지요. 밀을 심어도 반도 자라지 않았어요.</p><p>사람들은 그 언덕을 오래전에 포기했어요. 아무것도 안 되는 땅이라고요. 젊은 사람들은 하나둘 마을을 떠났어요. 남은 사람들은 언덕 아래 좁은 밭뙈기에 매달려 살았지요. 비가 조금만 늦어도 그해 겨울이 길어졌어요.</p><p>그런데 그 언덕에 낯선 젊은이가 앉아 있었어요. 검은 곱슬머리에 포도 덩굴을 감아 쓰고 있었어요. 손에는 나무 지팡이를 들었는데, 끝에 솔방울이 하나 달려 있었지요. 어깨에는 자줏빛 띠를 둘렀고요.</p><p>젊은이는 마을 사람들이 다가와도 놀라지 않았어요. 오히려 먼저 웃으며 손을 흔들었지요.</p><p>“여기 뭐 하러 왔소?”</p><p>한 농부가 물었어요.</p><p>“이 언덕에 나무를 심으려고요.”</p><p>“그 땅에는 아무것도 안 자라오. 삼십 년을 해 봤소.”</p><p>젊은이는 대답 대신 자기가 들고 온 자루를 열었어요. 안에는 마른 나뭇가지 같은 것들이 잔뜩 들어 있었어요. 잎도 없고 뿌리도 시원찮은, 정말 볼품없는 가지들이었지요.</p><p>사람들이 웃었어요. 저런 걸 심는다고요. 젊은이는 같이 웃었어요. 그러고는 무릎을 꿇고 돌 사이를 팠어요. 손톱 밑에 흙이 새까맣게 끼도록 팠지요.</p><p>“이 땅은 물을 오래 담아 두지 못해요.”</p><p>젊은이가 말했어요.</p><p>“밀은 그걸 못 견뎌요. 그런데 제가 가져온 이 나무는 견뎌요. 뿌리를 아주 깊이 내리거든요.”</p><p>“목이 마르면 더 깊이 파고들어요. 물을 찾을 때까지요. 그래서 자갈밭에서도 살아요.”</p><p>그날 젊은이는 해가 질 때까지 가지를 꽂았어요. 마을 아이들이 옆에 쭈그리고 앉아 구경했어요. 나중에는 아이들도 같이 흙을 팠지요.</p><p>저녁이 되자 농부의 아내가 보리떡을 가져다주었어요. 젊은이는 그것을 반으로 갈라 옆에 있던 아이에게 먼저 주었어요.</p><p>일이 끝나자 젊은이는 손을 털고 일어섰어요. 그러고는 값을 받지 않고 그냥 언덕을 내려갔어요.</p><p>“이름이 뭐요?”</p><p>농부가 뒤에서 물었어요. 젊은이가 돌아보며 대답했어요.</p><p>“디오니소스요.”</p><p>그해 여름, 마른 언덕이 온통 초록으로 덮였어요. 덩굴이 돌 위를 기어 올라가 서로 손을 잡았어요. 넓은 잎이 그늘을 만들었고, 그 그늘 아래로 바람이 지나갔지요. 그리고 잎 사이에 열매가 매달렸어요.</p><p>처음에는 딱딱하고 파랬어요. 아이 하나가 몰래 따 먹었다가 얼굴을 잔뜩 찡그렸지요. 농부는 매일 아침 언덕에 올라갔어요. 처음에는 못 미더워서 올라갔고, 나중에는 궁금해서 올라갔지요. 마지막에는 그냥 보고 싶어서 올라갔어요.</p><p>그런데 가을이 되자 그 열매가 검붉게 익었어요. 알알이 붙어서 한 송이가 어른 주먹만 했어요. 톡 터뜨리면 단물이 손목까지 흘러내렸고요.</p><p>마을 사람들은 그 언덕에 올라가 한참 서 있었어요. 아무것도 안 되는 땅이라고 삼십 년을 말해 온 언덕이었으니까요.</p><p>그해부터 그 마을은 굶지 않았어요. 이웃 마을 사람들이 가지를 얻으러 찾아왔고, 그 마을도 곧 언덕이 초록으로 덮였지요.</p><p>사람들은 겨울에도 그 열매를 말려 두고 먹었어요. 아이들 주머니에 마른 포도가 몇 알씩 들어 있었지요. 사람들은 그 열매를 포도라고 불렀어요.</p><p>헤르메스는 그 모든 것을 지켜보고 산으로 올라왔어요. 그리고 본 대로 전했지요. 제우스는 이야기를 다 듣고 한참 아무 말이 없었어요. 그러고는 짧게 말했어요.</p><p>“그 젊은이를 이리 데려오너라.”</p><p>며칠 뒤 디오니소스가 올림포스산으로 올라왔어요. 신들이 산꼭대기에 모였어요. 올라오는 이를 보려고 저마다 목을 뺐지요.</p><p>디오니소스는 옷에 흙이 묻은 채였어요. 신발도 한쪽이 헐어 있었고요. 산 위에 처음 올라온 사람치고는 하나도 주눅 들지 않았어요. 오히려 기둥이며 화로며 신기하게 둘러보았지요.</p><p>디오니소스는 화로 앞을 지나다가 걸음을 멈췄어요. 그러고는 불에 손을 쬐었어요. 산 위가 생각보다 춥다고 중얼거리면서요. 헤스티아가 그 모습을 보고 나뭇가지를 하나 더 넣어 주었지요.</p><p>제우스 앞에 서자 디오니소스가 고개를 숙였어요.</p><p>“네가 마른 땅에 가지를 심고 다닌다는 그 아이냐?”</p><p>“그런 것 같습니다.”</p><p>“네 어머니는 어디 계시냐?”</p><p>“오래전에 돌아가셨어요.”</p><p>디오니소스는 그 말을 담담하게 했어요. 슬퍼 보이지도, 원망하는 것 같지도 않았어요. 다만 그 말을 하는 동안 지팡이를 쥔 손에 힘이 들어갔지요.</p><p>헤라는 그때 자리에서 일어나 창가 쪽으로 걸어갔어요. 아무도 그 뒷모습에 대해 묻지 않았어요.</p><h2>열두 자리와 한 사람</h2><p>산꼭대기가 술렁이는 소리가 잦아들자 제우스가 헤르메스를 돌아보았어요. 신들이 저마다 자기 자리 팔걸이를 만지작거리고 있었지요.</p><p>“여기 놓인 자리가 몇 개인지 세어 보아라.”</p><p>헤르메스는 산꼭대기를 한 바퀴 돌며 손가락을 꼽았어요. 돌을 깎아 만든 자리들이 둥글게 놓여 있었지요.</p><p>“하나 왕좌, 둘 왕비 자리. 셋 바다, 넷 들판과 곡식.”</p><p>왕좌와 그 옆자리는 제우스와 헤라의 것이었어요. 포세이돈은 삼지창을 무릎에 걸치고 앉아 있었고, 데메테르는 밀 이삭 한 줌을 손에 쥐고 있었지요.</p><p>“다섯 화로, 여섯 올빼미, 일곱 리라, 여덟 은빛 활.”</p><p>헤스티아의 화로 앞자리에는 그날도 불이 조용히 타고 있었어요. 아테나의 어깨에는 올빼미가 앉아 있었고, 아폴론의 무릎에는 리라가 놓여 있었지요. 아르테미스는 자리에 앉지 않고 기둥에 기대서 있었어요. 아르테미스는 늘 그랬어요.</p><p>“아홉 창, 열 꽃, 열하나 망치.”</p><p>아레스가 창날을 만지작거리던 손을 잠깐 멈췄어요. 아프로디테는 소리 없이 웃었고요. 헤파이스토스는 그날도 손끝에 검댕이 묻어 있었어요.</p><p>“열둘…….”</p><p>헤르메스가 말을 멈췄어요. 마지막 자리가 자기 자리였거든요.</p><p>“열둘, 저요.”</p><p>제우스가 고개를 끄덕였어요.</p><p>“열둘이구나. 그리고 오늘 한 사람이 더 왔다.”</p><p>산꼭대기가 술렁였어요. 자리를 하나씩 늘려 오다 보니 어느새 열둘이 되어 있었어요. 그보다 많으면 말이 모이지 않고, 그보다 적으면 세상을 다 살피지 못한다고들 했지요. 그렇게 열둘이 굳어진 숫자였어요.</p><p>그래서 열셋이라는 말은 그 자리에서 아주 낯선 말이었어요. 신들이 서로 눈치를 보았어요. 다만 누구도 자기 자리를 내놓겠다고 하지는 않았지요.</p><p>아레스가 먼저 입을 열었어요.</p><p>“자리는 열둘입니다. 하나 더 놓으면 열셋이 되고요.”</p><p>“하나쯤 더 놓는다고 산이 무너지지는 않을 텐데.”</p><p>아폴론이 말했어요.</p><p>“오늘 한 자리를 늘리면 내일은 두 자리를 늘리게 됩니다. 그러다 보면 자리를 세는 것도 그만두게 되지요.”</p><p>아레스가 대꾸했어요. 두 신 사이에 잠깐 침묵이 흘렀지요. 그러자 이번에는 헤파이스토스가 조용히 입을 열었어요.</p><p>“돌로 자리를 하나 더 깎을까요? 돌은 넉넉합니다.”</p><p>“돌이 모자라서가 아니야. 열둘이라는 숫자가 깨지는 게 문제야.”</p><p>아레스가 말했어요. 헤파이스토스는 더 말하지 않았어요. 디오니소스는 그동안 아무 말도 없었어요. 자기 이야기인데도 한 발 물러나 서 있었지요.</p><p>제우스가 디오니소스를 보았어요.</p><p>“너는 무엇을 맡고 싶으냐?”</p><p>디오니소스는 잠깐 생각했어요.</p><p>“마른 땅이요.”</p><p>아무도 그 대답을 알아듣지 못했어요.</p><p>“밀이 안 되는 땅이 세상에 아주 많거든요. 사람들은 그런 땅을 버려요. 저는 그런 땅을 맡고 싶습니다.”</p><p>제우스가 오래 그 얼굴을 보았어요.</p><h2>자리에서 일어선 이</h2><p>그때 화로 쪽에서 옷자락 스치는 소리가 났어요. 헤스티아가 일어선 것이었어요.</p><p>헤스티아는 좀처럼 회의에서 말을 하지 않았어요. 늘 화로 앞에 앉아 불을 보다가, 이야기가 끝나면 조용히 나무를 한 개비 더 넣곤 했지요. 그래서 헤스티아가 일어서자 모두가 그쪽을 보았어요. 아무도 먼저 입을 열지 못했지요.</p><p>“제 자리를 디오니소스에게 드리면 되겠네요.”</p><p>헤스티아가 말했어요. 산꼭대기가 아주 조용해졌어요. 제우스가 자리에서 반쯤 일어섰지요. 아무도 예상하지 못한 말이었거든요.</p><p>“누나, 그게 무슨 말이에요?”</p><p>“나는 어차피 앉아 있을 시간이 별로 없어.”</p><p>헤스티아가 말했어요.</p><p>“불은 잠깐만 눈을 떼도 사그라들거든. 저 자리는 하루 종일 비어 있는 날이 많았어.”</p><p>“그래도 누나 자리예요.”</p><p>“내 자리는 저기야.”</p><p>헤스티아가 화로를 가리켰어요. 마른 나뭇가지가 가지런히 쌓여 있는, 아무 무늬도 없는 돌바닥이었지요.</p><p>“나는 저기에 앉아 있을 때가 제일 좋아. 그건 양보하는 게 아니라 바꾸는 거야. 손해 보는 게 아니라고.”</p><p>제우스는 무슨 말을 하려다가 그만두었어요. 헤라를 한 번 보았는데 헤라도 아무 말이 없었어요. 헤스티아가 한 번 정한 것을 되돌린 적이 없다는 걸 둘 다 알고 있었거든요.</p><p>아무도 반대하지 못했어요. 아레스도요. 디오니소스가 앞으로 걸어 나왔어요. 그러고는 헤스티아 앞에 무릎을 굽혔어요.</p><p>“무릎 꿇지 마세요.”</p><p>헤스티아가 말했어요.</p><p>“대신 한 가지만 해 줘요. 그 자리에 앉거든, 자리가 없는 사람을 먼저 생각해 줘요.”</p><p>디오니소스는 고개를 들었어요. 그러고는 그러겠다고 대답했어요.</p><p>“약속합니다.”</p><p>그날부터 올림포스산의 열두 자리 가운데 하나는 디오니소스의 것이 되었어요. 그리고 헤스티아는 그 뒤로 한 번도 그 일을 입에 올리지 않았지요.</p><p>다만 그날 저녁부터 헤스티아의 화로에는 나무 대신 마른 포도 덩굴이 섞여 들어갔어요. 누가 가져다 놓았는지는 모두가 알았지만 아무도 말하지 않았어요.</p><p>나중에 사람들이 올림포스산의 열두 신을 손꼽을 때, 헤스티아의 이름은 자주 빠지게 돼요. 그런데 그 열두 자리를 채워 준 것은 헤스티아였지요.</p><p>그날 밤 올림포스산에서 잔치가 열렸어요. 열두 신이 둥글게 모였어요. 열두 자리에 임자가 다 있는 것은 그날이 처음이었지요.</p><p>디오니소스가 산 아래에서 가져온 포도를 내놓았어요. 커다란 바구니로 셋이었어요. 신들이 하나씩 집어 먹었어요.</p><p>포세이돈이 한 알을 먹더니 두 번째 알로 손을 뻗었어요. 아레스는 한 송이를 통째로 들고 갔지요. 아르테미스는 기둥에 기대서서 먹었고요.</p><p>아폴론이 리라를 꺼냈어요. 헤르메스가 손뼉으로 박자를 맞췄어요. 아프로디테가 웃었고, 그 웃음소리에 헤파이스토스도 따라 웃었어요.</p><p>데메테르는 포도알을 손바닥에 굴려 보다가 이렇게 말했어요.</p><p>“이걸 심을 데가 아주 많겠구나.”</p><p>아테나는 잔치 내내 말을 아꼈어요. 대신 디오니소스가 하는 이야기를 오래 들었지요. 어느 마을 흙이 어떻고, 어느 언덕은 바람이 어느 쪽에서 부는지 같은 이야기였어요.</p><p>헤라도 그 자리에 있었어요. 웃지는 않았지만 자리를 뜨지도 않았어요. 왕비의 자리란 그런 것이라고 헤라는 생각했거든요.</p><p>화로 앞에서는 헤스티아가 불을 보고 있었어요. 잔치 소리가 등 뒤에서 들려왔지요. 헤스티아는 가끔 고개를 돌려 그쪽을 보았어요. 그러고는 다시 불을 보았어요. 표정이 아주 편안했어요.</p><p>디오니소스가 자리에서 일어나 포도 한 송이를 들고 화로 쪽으로 걸어갔어요. 그러고는 헤스티아 옆에 앉았지요. 두 사람은 아무 말도 하지 않고 나란히 불을 보았어요.</p><p>밤이 깊어졌어요. 잔치는 새벽까지 이어졌어요. 올림포스산에서 그렇게 오래 웃음소리가 이어진 밤은 오랜만이었지요.</p><p>제우스는 잔을 들고 자리에서 일어섰어요. 그러고는 기둥 사이로 걸어 나가 산 끝에 섰어요. 발아래로 세상이 다 보였어요. 어두운 들판과 검은 바다, 그리고 그 사이사이에 아주 작은 불빛들이 있었어요. 사람들이 사는 마을이었지요.</p><p>불빛 하나하나 아래에 사람이 있었어요. 저녁을 먹고, 그물을 손질하고, 아이를 재우는 사람들이요. 그 가운데 어떤 마을은 언덕에 올리브나무를 심었고, 어떤 마을은 포도 덩굴을 심었어요.</p><p>그런데 그 사람들 가운데 이 산 위에 누가 앉아 있는지 아는 이는 거의 없었어요. 언덕에 올리브나무를 심은 마을 말고는, 한둘의 이름을 겨우 들어 본 정도였지요.</p><p>뒤에서는 웃음소리와 리라 소리가 계속 들려왔어요. 제우스는 그 소리를 등에 지고 한참 아래를 내려다보았어요. 그러고는 혼잣말처럼 말했어요.</p><p>“저 아래 사람들은 아직 우리를 모르는구나.”</p></article></noscript>
