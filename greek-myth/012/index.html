        <div class="recap"><h3>지난 이야기</h3><ol><li>태어난 지 하루밖에 안 된 헤르메스가 아폴론의 소 떼를 몰래 끌고 갔어요.</li><li>들킨 헤르메스가 거북 등딱지로 만든 리라를 건네자 아폴론이 웃으며 화를 풀었지요.</li><li>제우스는 그 영리한 막내에게 신들의 심부름꾼 자리를 맡기고 날개 달린 신발을 신겨 주었어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>바다 거품에서 온 여신</h1><h2>바다 거품 속에서</h2><p>그날 아침 바다는 이상할 만큼 잔잔했어요. 바람이 한 점도 없었지요. 그런데 먼바다 한가운데에서 하얀 거품이 크게 일었어요. 파도도 없는데 거품만 자꾸 부풀어 올랐어요.</p><p>바닷새 한 마리가 놀라 물 위를 스치듯 날아올랐어요.</p><p>거품은 점점 커졌어요. 나중에는 작은 섬만 해졌지요. 그러다 그 속에서 무언가가 천천히 일어섰어요. 어깨가 먼저 보이고, 그다음에 얼굴이 보였어요. 다 자란 여인이었어요. 긴 머리카락이 젖은 채로 어깨를 타고 흘러내렸어요. 아침 해가 그 머리에 닿자 붉은빛과 금빛이 한꺼번에 반짝였지요.</p><p>여인은 놀라지 않았어요. 자기가 어디에서 왔는지 묻지도 않았고요. 그저 뭍 쪽을 한 번 바라보고는 가만히 웃었어요.</p><p>커다란 조개껍데기 하나가 물살을 타고 다가왔어요. 여인은 그 위에 올라섰어요. 조개껍데기는 배처럼 물살을 갈랐지요.</p><p>조개껍데기가 지나간 자리마다 물이 잔잔해졌어요. 물고기들이 떼를 지어 따라왔어요. 갈매기가 낮게 날며 그 뒤를 따랐고요.</p><p>여인이 뭍에 발을 디뎠어요. 젖은 모래에 발자국이 하나 찍혔어요. 그런데 그 발자국 안에서 곧 풀이 돋았어요. 풀은 자라서 꽃이 되었지요. 하얗고 작은 꽃이었어요.</p><p>두 걸음째에도, 세 걸음째에도 그랬어요. 모래밭에 꽃길이 하나 생겼어요. 바닷가에 살던 님프들이 달려 나왔어요. 님프들은 그 꽃길을 따라 걸어오는 이를 보고 걸음을 멈췄어요. 아무도 먼저 말을 걸지 못했지요. 이 여신이 어디에서 왔는지는 이야기마다 조금씩 달라요. 이 이야기에서는 어느 날 바다 거품 속에서 다 자란 모습으로 태어나, 조개껍데기를 타고 뭍으로 올라왔다고 해 두지요.</p><p>가장 어린 님프가 겨우 물었어요.</p><p>“당신은 누구세요?”</p><p>여인은 잠깐 생각하다가 대답했어요.</p><p>“아직 이름이 없어요.”</p><p>님프들은 서로 얼굴을 마주 보았어요. 이름이 없는 이를 무어라 불러야 할지 몰랐거든요. 결국 아무도 부르지 못한 채 뒤를 졸졸 따라갔지요.</p><p>여인은 바닷가를 따라 천천히 걸었어요. 조금 가니 사람들이 사는 마을이 나왔어요. 그물을 손질하던 어부들이 하던 일을 멈췄어요.</p><p>한 아이가 여인의 발자국 위로 달려가 보았어요. 발자국 안에서 막 올라온 꽃잎이 아이의 발등을 간질였지요. 아이가 까르르 웃었어요.</p><p>그날 그 마을에서는 오래 말을 섞지 않던 두 사람이 나란히 앉아 저녁을 먹었다고 해요. 그게 우연이었는지는 아무도 몰라요.</p><p>그 이야기는 하루도 안 되어 올림포스산까지 올라갔어요. 바닷가에 하룻밤 사이 꽃길이 생겼다는 소문이었지요. 신들이 하나둘 산 아래를 내려다보았어요.</p><p>제우스가 그 여인을 산 위로 불렀어요. 여인이 하얀 기둥 사이로 걸어 들어왔어요. 걸음이 아주 느렸어요. 서두르는 법이 없는 걸음이었지요. 지나간 자리마다 돌바닥 틈에서 꽃이 올라왔어요.</p><p>산꼭대기가 조용해졌어요. 신들이 하던 이야기를 멈췄어요. 어떤 신은 들고 있던 잔을 내려놓는 것도 잊었어요. 어떤 신은 괜히 헛기침을 했지요. 헤라만 자세를 바꾸지 않았어요. 다만 눈을 한 번 가늘게 떴어요.</p><p>제우스가 물었어요.</p><p>“너는 어디에서 왔느냐?”</p><p>“바다에서요.”</p><p>“너는 누구의 아이냐?”</p><p>여인은 고개를 저었어요. 모른다는 뜻이었지요. 그러고는 이렇게 덧붙였어요.</p><p>“그게 그렇게 중요한가요?”</p><p>몇몇 신이 작게 웃었어요. 제우스도 웃었어요. 그날 제우스는 그 여인에게 올림포스산의 자리를 하나 내어 주었어요. 이름도 그때 정해졌지요. 아프로디테였어요.</p><p>아프로디테라는 이름은 바다 거품을 가리키는 옛말에서 왔어요. 태어난 자리를 그대로 이름으로 삼은 셈이지요.</p><p>아프로디테는 그 이름을 듣고 고개를 끄덕였어요. 마음에 든다고도, 마음에 들지 않는다고도 하지 않았어요.</p><p>그날 저녁 올림포스산의 기둥 사이로 처음 보는 향기가 지나갔어요. 신들은 그 향기가 어디에서 오는지 알면서도 서로 묻지 않았지요.</p><p>아프로디테는 산꼭대기에 오래 앉아 있지 않았어요. 며칠에 한 번은 바닷가로 내려갔지요. 자기가 처음 올라온 그 모래밭에 서서 물을 한참 바라보다 오곤 했어요.</p><p>왜 자꾸 내려가느냐고 누가 물으면 아프로디테는 이렇게 대답했어요.</p><p>“저기가 제 고향이니까요.”</p><h2>산이 시끄러워진 날</h2><p>아프로디테가 온 뒤로 올림포스산은 전과 같지 않았어요. 나쁜 뜻으로 하는 말이 아니에요. 산은 오히려 환해졌어요. 기둥마다 덩굴이 감기고, 계단 틈마다 꽃이 피었지요. 아침이면 어디선가 좋은 냄새가 났어요.</p><p>그런데 신들이 이상해졌어요. 회의 시간에 늦는 이가 생겼어요. 서로 아프로디테 옆자리에 앉으려고 눈치를 봤지요. 바다를 맡은 이는 산에 올라오는 날이 부쩍 늘었고요.</p><p>어느 날은 두 신이 같은 자리를 두고 서로 노려보다가 회의가 통째로 멈추기도 했어요. 한번은 저녁상에 올릴 과일을 두 신이 동시에 집었어요. 둘 다 손을 놓지 않았지요. 그릇이 기울어져 과일이 바닥으로 데굴데굴 굴러떨어졌어요.</p><p>아프로디테는 그 소동을 말리지 않았어요. 말릴 생각도 없어 보였지요. 그저 턱을 괴고 구경했어요. 헤라는 그게 더 마음에 걸렸어요.</p><p>그런데 아프로디테가 나쁜 마음으로 그런 것은 아니었어요. 아프로디테는 누구에게나 똑같이 다정했거든요. 문제는 그 다정함을 받은 쪽이 저마다 자기만 특별하다고 여겼다는 데 있었지요.</p><p>덕분에 산 아래도 달라졌어요. 오래 다투던 이웃이 화해하고, 말을 못 붙이던 사람들이 나란히 걷기 시작했어요. 좋은 일이 훨씬 많았지요. 다만 올림포스산 위가 시끄러웠을 뿐이에요.</p><p>헤라는 그 모습을 팔짱을 낀 채 지켜보았어요. 아무 말도 하지 않았지요. 다만 그날 저녁 제우스를 따로 불렀어요.</p><p>“신들이 아프로디테 옆자리를 두고 다투는데, 이대로 둘 거야? 다투는 소리가 아침마다 여기까지 들려. 어제는 회의가 반나절이나 멈췄어.”</p><p>제우스는 대답하지 못했어요. 헤라의 말이 틀리지 않았거든요.</p><p>“아프로디테의 짝을 정해 줘.” 헤라가 말했어요. “그러면 다들 조용해질 거야.”</p><p>“누구를 짝으로 정할까요?”</p><p>“이 산에서 소란과 가장 먼 사람으로.”</p><p>헤라는 그 말만 하고 일어섰어요. 문 앞에서 한 번 멈췄다가 이렇게 덧붙였지요.</p><p>“짝이 될 사람한테는 뜻을 물어봐. 아프로디테한테도.”</p><p>제우스는 한참 말이 없었어요. 그러고는 고개를 끄덕였어요. 다음 날 회의에서 제우스가 그 이야기를 꺼냈어요. 산꼭대기가 술렁였어요.</p><p>여러 신이 손을 들었어요. 저마다 자기를 내세웠지요. 목소리가 점점 커졌어요. 나중에는 누가 무슨 말을 하는지도 알아들을 수 없었어요.</p><p>그때 제우스가 손을 들어 조용히 시켰어요. 그러고는 뜻밖의 이름을 불렀어요.</p><p>“헤파이스토스.”</p><p>산꼭대기가 조용해졌어요. 헤파이스토스는 그 자리에 없었어요. 그날도 대장간에 있었거든요. 망치 소리가 저 아래에서 희미하게 올라왔지요.</p><p>누군가 왜냐고 물었어요. 제우스는 이렇게 대답했어요.</p><p>“이 산에서 남의 것을 탐내지 않는 손이 하나뿐이라서요.”</p><p>아무도 더 따지지 못했어요. 그런데 아프로디테에게는 아무도 묻지 않았어요. 아프로디테는 바로 그 자리에 앉아 있었는데도요.</p><p>그때 아프로디테가 자리에서 일어섰어요.</p><p>“저한테는 왜 안 물으세요?”</p><p>산꼭대기가 한 번 더 조용해졌어요. 제우스는 잔을 들다 말았어요. 헤라는 자세를 바꾸지 않았고요.</p><p>“네 짝은 내가 정할 일이다.”</p><p>“그러면 제가 스스로 정할 수 있는 건 무엇입니까?”</p><p>제우스는 대답하지 않았어요. 아프로디테는 더 묻지 않았어요. 다만 그날 아프로디테가 지나간 자리에는 꽃이 피지 않았어요. 하루 종일 그랬지요.</p><p>아무리 신들의 왕이라 해도, 본인에게 한마디도 묻지 않고 정하는 건 너무했지요. 헤파이스토스는 그 소식을 대장간에서 들었어요. 망치가 손에서 미끄러졌어요. 헤파이스토스는 그것을 주워 들고 한참 서 있었어요. 그러고는 아무 말 없이 다시 불을 지폈지요.</p><p>그날부터 헤파이스토스는 사흘 동안 대장간에서 나오지 않았어요. 님프들이 문 앞에 밥을 놓고 갔지만 그대로 식어 있었지요.</p><p>사흘째 되던 날 아침, 헤파이스토스가 무언가를 들고 산으로 올라왔어요. 가느다란 금띠였어요. 어찌나 얇은지 손끝에 걸면 바람에 흔들릴 정도였지요.</p><p>그 위에는 아주 작은 꽃이 수백 송이 새겨져 있었어요. 꽃은 하나하나 모양이 달랐어요. 헤파이스토스가 바닷가에서 본 꽃들이었지요. 그 띠를 햇빛에 들면 꽃 그림자가 바닥에 어른거렸어요.</p><p>아프로디테는 그것을 오래 들여다보았어요.</p><p>“이렇게 고운 띠를 사흘 만에 만드셨어요?”</p><p>“사흘이면 넉넉합니다.”</p><p>아프로디테가 처음으로 소리 내어 웃었어요. 헤파이스토스는 그 웃음을 보고 얼굴이 조금 붉어졌어요. 검댕 때문에 잘 보이지는 않았지만요.</p><p>혼인날 아침, 헤파이스토스는 새 앞치마를 두르고 산으로 올라왔어요. 손톱 밑의 검댕은 아무리 씻어도 지워지지 않았지요. 헤파이스토스는 그 손을 자꾸 뒤로 감추었어요.</p><p>아프로디테가 그 손을 잡아 앞으로 끌어냈어요.</p><p>“이 손이 그 띠를 만들었잖아요.”</p><p>헤파이스토스는 아무 대꾸도 못 했어요. 그날 하루 종일 말이 없었지만, 내내 웃는 얼굴이었지요. 그렇게 두 사람은 부부가 되었어요. 올림포스산은 다시 조용해졌지요. 헤라가 바란 그대로였어요.</p><p>두 사람이 서로를 미워한 것은 아니었어요. 다만 잘 맞지도 않았지요. 헤파이스토스는 하루의 대부분을 불 앞에서 보냈어요. 아프로디테는 불 앞에 오래 앉아 있는 것을 견디지 못했고요.</p><p>저녁이면 아프로디테는 밖으로 나가 산길을 걸었어요. 헤파이스토스는 그때까지도 망치를 놓지 않았지요. 둘은 하루에 몇 마디를 나누었어요. 그 몇 마디는 나쁘지 않았어요. 다만 몇 마디뿐이었지요.</p><p>아프로디테는 가끔 대장간 문 앞에 서서 안을 들여다보았어요. 불빛에 비친 그 등이 넓어 보였지요. 무슨 말을 걸어야 할지 몰라서 그냥 서 있다가, 아무 말 없이 돌아섰어요. 헤파이스토스도 끝내 뒤를 돌아보지 않았고요. 그 산에서 아프로디테에게 무엇을 하고 싶으냐고 물어본 사람은 아직 아무도 없었어요.</p><h2>쇠 냄새를 몰고 온 이</h2><p>그 무렵 올림포스산에 또 한 사람이 자리를 잡았어요. 제우스와 헤라의 아들이었어요. 헤파이스토스의 동생이기도 했지요. 이름은 아레스였어요.</p><p>헤라는 이 아들만은 산 아래로 보내지 않았어요. 아레스는 팔다리가 곧고 힘이 셌거든요. 헤라는 아레스가 지나갈 때마다 그 어깨를 한 번씩 짚었어요. 그러면서도 잘한다는 말은 한 번도 하지 않았지요.</p><p>아레스가 산꼭대기로 걸어 들어오던 날, 신들이 저도 모르게 한 걸음씩 물러섰어요.</p><p>키가 크고 어깨가 딱 벌어진 젊은이였어요. 검은 머리는 짧게 잘랐고, 청동 투구를 옆구리에 끼고 있었지요. 한 손에는 창, 다른 손에는 둥근 방패를 들었고요. 걸을 때마다 쇠가 부딪히는 소리가 났어요.</p><p>그리고 냄새가 났어요. 달군 쇠 냄새 같기도 하고 마른 흙 냄새 같기도 한, 그런 냄새였지요. 제우스가 물었어요.</p><p>“너는 무엇을 맡고 싶으냐?”</p><p>“싸움을 맡고 싶어요.”</p><p>산꼭대기가 조용해졌어요. 헤라조차 아들을 한 번 돌아보았지요.</p><p>“왜 하필 싸움이냐?”</p><p>“누군가는 맡아야 하니까요. 세상에서 싸움이 없어질 리는 없잖아요.”</p><p>그 말은 맞는 말이었어요. 그런데 듣고 나서 마음이 편해지는 말은 아니었지요. 제우스는 오래 생각했어요. 그리고 그 자리를 아레스에게 주었어요. 다만 한 가지를 덧붙였지요.</p><p>“이기고 지는 것은 네가 맡아라. 왜 싸우는지는 네가 정하지 마라.”</p><p>아레스는 그 말이 무슨 뜻인지 묻지 않았어요. 그냥 고개를 한 번 숙이고 자기 자리로 걸어가 앉았지요. 아레스는 앉자마자 창을 무릎 위에 눕혔어요. 손이 심심한 사람처럼 창날을 자꾸 만지작거렸지요. 옆자리에 앉은 신이 슬그머니 의자를 조금 옮겼어요.</p><p>그 자리에 헤파이스토스는 없었어요. 형제가 산 위에 나란히 앉는 일은 그때도 지금도 좀처럼 없었지요.</p><p>헤라는 아무 말도 하지 않았어요. 다만 두 아들을 나란히 떠올렸어요. 한 아들은 산 아래에서 자랐고, 다른 아들은 산 위에서 자랐지요. 그 차이를 만든 사람이 누구인지는 헤라 자신이 가장 잘 알았어요.</p><p>그날 밤 화로 앞에 앉아 있던 이들은 잠을 설쳤어요. 어디선가 쇠가 부딪히는 소리가 자꾸 들리는 것 같았거든요.</p><h2>꽃이 피는 자리, 마른 자리</h2><p>두 사람이 처음 마주친 것은 그해 여름이었어요. 아프로디테가 산길을 걸어 내려오고 있었어요. 반대편에서 아레스가 올라오고 있었고요. 길이 좁아서 둘 중 하나는 비켜서야 했지요.</p><p>아레스가 먼저 걸음을 멈췄어요. 그러고는 옆으로 비켜섰어요. 아무 말도 하지 않았어요. 아프로디테가 그 앞을 지나가다가 멈춰 섰어요.</p><p>“당신에게서는 쇠 냄새가 나네요.”</p><p>“당신에게서는 꽃 냄새가 납니다.”</p><p>둘은 잠깐 서로를 보았어요. 그러고는 각자 가던 길을 갔지요. 그날은 그게 전부였어요. 아레스는 산 위로 올라가면서 한 번 뒤를 돌아보았어요. 아프로디테는 돌아보지 않았어요.</p><p>그 여름 내내 두 사람은 산길에서 몇 번 더 마주쳤어요. 늘 짧은 말 한두 마디가 오갔지요. 아무도 그것을 눈여겨보지 않았어요. 그런데 그 여름이 다 가기 전에 아프로디테는 아레스를 사랑하게 되었어요. 누가 정해 주지 않은 사람을 아프로디테가 스스로 고른 것은 그때가 처음이었지요.</p><p>그날 저녁, 그 산길을 지나가던 님프 하나가 이상한 것을 보았어요. 길 한쪽에는 꽃이 잔뜩 피어 있었어요. 하얗고 노란 작은 꽃들이 돌 틈마다 올라와 있었지요. 아프로디테가 내려온 쪽이었어요.</p><p>그런데 길 다른 쪽에는 아무것도 없었어요. 원래 거기에는 풀이 있었거든요. 이끼도 있었고요. 그런데 마르고 단단한 흙만 남아 있었어요.</p><p>님프는 두 자리를 번갈아 보았어요. 그리고 아무에게도 그 이야기를 하지 않았어요. 그날부터 올림포스산에는 두 갈래 길이 생겼어요. 걸을 때마다 꽃이 피어나는 길과, 걸을 때마다 아무것도 자라지 않는 길이요.</p><p>꽃이 피는 길에는 벌과 나비가 모였어요. 마른 길에는 아무것도 오지 않았지요. 그런데 이상하게도 신들은 마른 길 쪽을 더 자주 힐끔거렸어요.</p><p>산 아래 대장간에서는 그 무렵 망치 소리가 한 번씩 끊겼어요. 끊겼다가 다시 이어졌지요. 그 소리를 세어 본 사람은 아무도 없었어요.</p><p>올림포스산에 사는 이들은 그날부터 걸을 때마다 발밑을 한 번씩 내려다보게 되었어요. 오늘 자기가 걸어온 길이 꽃이 핀 쪽이었는지 마른 쪽이었는지 궁금했거든요.</p></article></noscript>
