  <noscript><article class="ns-text"><h1>석류 씨 여섯 알</h1><h2>연기가 오르지 않는 땅</h2><p>쟁기 한 대가 밭 가운데 그대로 놓여 있었어요. 손잡이에 이슬이 앉았다가 마른 자국이 여러 겹이었지요. 그렇게 버려진 쟁기를 그해에는 어느 마을에서나 볼 수 있었어요.</p><p>밭은 두 해째 비어 있었어요. 사람들은 처음에는 곳간을 헐었어요. 곳간이 비자 씨앗으로 둔 것까지 먹었지요. 씨앗까지 먹고 나면 그다음은 없었어요.</p><p>밭을 갈던 사람들이 밭을 버렸어요. 마을에서 마을로 사람들이 옮겨 다녔어요. 저쪽은 좀 낫다더라, 하는 말을 따라서요. 가 보면 거기도 똑같았어요. 어느 마을에서는 사람들이 밭 앞에 모여 앉아 흙을 손으로 헤쳐 보았어요. 흙은 멀쩡했어요. 촉촉하고 부드러웠지요. 그런데 아무것도 나지 않았어요.</p><p>“땅이 삐쳤나 보오.” 한 노인이 말했어요. 사람들은 웃지 않았어요. 그 말이 맞는 것 같았거든요.</p><p>올림포스산에서는 신들이 그것을 다 보고 있었어요. 처음에는 곧 끝날 일이라고 생각했어요. 두 해째가 되자 아무도 그런 말을 하지 않았지요.</p><p>제우스는 여러 신을 데메테르에게 보냈어요. 곡식이 없으면 사람이 없어지고, 사람이 없어지면 신들에게 바치는 것도 없어진다고요.</p><p>먼저 간 이는 아무 말도 듣지 못하고 돌아왔어요. 문이 열리지 않았거든요. 그다음에 간 이는 문 앞에서 한나절을 서 있다가 돌아왔어요. 안에서 아무 소리도 나지 않았다고 했어요.</p><p>세 번째로 간 이는 딱 한 마디를 듣고 왔어요.</p><p>“내 딸을 데려오세요.”</p><p>그것뿐이었어요. 문은 다시 열리지 않았고요. 돌아온 이가 그 말을 그대로 전했어요. 산꼭대기에 있던 신들이 서로를 쳐다보았지요.</p><p>누군가 그건 안 될 일이라고 말했어요. 한번 아래로 간 것을 도로 올리는 법은 없다고요. 제우스는 그 말을 듣고도 아무 대답을 하지 않았어요. 대신 자리에서 일어나 창가로 걸어갔지요.</p><p>제우스는 산꼭대기 끝에 서서 아래를 오래 내려다보았어요. 굴뚝에서 연기가 오르는 집이 몇 채 되지 않았어요.</p><p>그러고는 헤르메스를 불렀어요.</p><p>“네가 한 번 내려가야겠다.”</p><p>“어디로 말입니까?”</p><p>제우스는 산 아래가 아니라 발밑을 가리켰어요. 헤르메스는 그 손끝을 보고 잠깐 아무 말도 하지 않았어요.</p><p>“큰형님께 가서 전해라. 그 아이를 어머니에게 돌려보내라고.”</p><p>“큰형님이 그 아이를 순순히 보내 주실까요?”</p><p>“보내야 한다.” 제우스가 말했어요. “땅 위 들판이 저렇게 비었으니.”</p><p>헤르메스는 고개를 끄덕였어요. 그러고는 한마디 했어요.</p><p>“그동안은 데려다주기만 했는데요. 데리고 올라오는 건 처음입니다.”</p><p>제우스는 대답하지 않았어요. 헤르메스가 돌아서는데 등 뒤에서 목소리가 들렸어요.</p><p>“한 가지만 살펴라. 그 아이가 그 나라에서 무엇을 먹었는지.”</p><p>헤르메스가 걸음을 멈췄어요.</p><p>“그건 왜 살펴야 합니까?”</p><p>“저승의 것을 한 입이라도 먹은 이는 저승의 몫이 된다.” 제우스가 말했어요. “내가 정한 규칙이 아니다. 처음부터 있던 규칙이지.”</p><p>“그럼 아무것도 안 드셨기를 바라야겠네요.”</p><p>헤르메스는 그렇게 말하면서 웃었어요. 그런데 웃음이 끝까지 가지 않았어요. 두 해나 아래에 있었으면서 아무것도 안 먹었을 리가 없다는 생각이 들었거든요.</p><p>제우스는 그 말에도 대답하지 않았어요. 헤르메스는 그 말을 품에 넣고 아래로 내려갔어요.</p><h2>한 방향으로만 열리는 문</h2><p>내려가는 길은 헤르메스에게 익숙했어요. 그동안 수없이 오르내렸으니까요. 다만 그날은 길에 사람이 많았어요. 위에서 내려오는 이들이었지요. 헤르메스는 그 사이를 거슬러 내려갔어요.</p><p>강가에서는 늙은 사공이 삿대를 짚고 서 있었어요. 헤르메스가 혼자 온 것을 보고 사공이 고개를 갸웃했어요. 헤르메스가 빈손으로 오는 일은 없었거든요.</p><p>“오늘은 누굴 데려온 게 아니라, 데리러 왔어요.”</p><p>사공은 그 말을 못 알아들은 얼굴이었어요. 이 강에서 그런 말을 들어 본 적이 없었으니까요. 사공은 아무 말도 하지 않았어요. 그저 배를 대 주었지요.</p><p>건너편 문 앞에는 개가 엎드려 있었어요. 세 머리가 한꺼번에 들렸다가, 아는 얼굴인 것을 알고 도로 내려갔어요. 헤르메스는 가운데 머리를 한 번 쓸어 주고 문을 지났어요.</p><p>문 안쪽 들판은 여전했어요. 잿빛이었고, 향기 없는 하얀 꽃이 피어 있었고, 사람들이 여기저기 앉아 있었지요.</p><p>그런데 앉아 있는 이가 전보다 훨씬 많았어요. 물가에도, 언덕에도, 좁은 물길 옆에도요. 헤르메스는 그 사이를 걸으면서 얼굴을 하나씩 보았어요. 그 얼굴들을 여기까지 데려온 것이 자기였으니까요.</p><p>달라진 것도 하나 있었어요. 들판 저쪽 낮은 언덕에 꽃이 피어 있었어요. 잿빛이 아닌 꽃이었어요. 붉은 것도 있고 노란 것도 있었지요. 누가 심어 놓은 것 같았어요.</p><p>앉아 있던 사람들 몇이 그쪽을 보고 있었어요. 이 나라에 온 뒤로 무언가를 바라보는 것은 처음이었지요. 검은 돌로 지은 궁 앞 계단에 두 사람이 앉아 있었어요. 하데스와 페르세포네였어요.</p><p>페르세포네는 무릎에 아무것도 올려놓지 않고 앞만 보고 있었어요. 두 해 전 들판에서 보았던 그 아이가 맞나 싶을 만큼 야위어 있었지요.</p><p>하데스는 그 옆에서 나무판에 무언가를 적고 있었어요. 둘은 나란히 앉아 있었는데, 서로 말을 하지는 않았어요.</p><p>헤르메스가 다가가자 하데스가 고개를 들었어요.</p><p>“오늘은 네가 데려온 이가 아무도 없구나.”</p><p>“오늘은 페르세포네 님을 데리러 왔습니다.”</p><p>하데스는 붓을 내려놓았어요. 페르세포네가 천천히 고개를 돌렸지요.</p><p>“제우스가 보냈습니다.” 헤르메스가 말했어요. “어머니에게 돌려보내라고 하셨습니다.”</p><p>한동안 아무도 말을 하지 않았어요. 저승은 원래 조용한 곳인데, 그날은 그 조용함이 유난히 크게 들렸어요.</p><p>“땅 위가 어떻게 되었느냐?” 하데스가 물었어요.</p><p>“두 해째 아무것도 나지 않습니다. 사람이 줄고 있어요.”</p><p>하데스는 자기 들판을 둘러보았어요. 요즘 들어 새로 오는 이가 부쩍 많아졌다는 것을 하데스도 이미 알고 있었지요. 나무판에 적힌 줄이 전보다 훨씬 촘촘했거든요.</p><p>“가거라.” 하데스가 페르세포네에게 말했어요.</p><p>페르세포네는 곧바로 일어서지 않았어요. 언덕에 심어 놓은 꽃 쪽을 한 번 보았지요.</p><p>“저 언덕의 꽃은 누가 심었습니까?” 헤르메스가 물었어요.</p><p>아무도 대답하지 않았어요. 하데스는 나무판을 내려다보았고, 페르세포네는 언덕을 보고 있었지요. 수레가 준비되는 동안 페르세포네는 계단에 그대로 앉아 있었어요.</p><p>이 나라에 온 뒤로 페르세포네는 아무것도 먹지 않았어요. 처음에는 목이 메어 못 먹었고, 나중에는 먹지 않기로 했거든요.</p><p>여기 것을 먹으면 여기 사람이 된다는 말을 알고 있었으니까요. 하데스는 날마다 상을 들여보냈어요. 날마다 그대로 물려 나왔지요. 그러다가 언제부턴가 상을 들여보내지 않았어요.</p><p>대신 하데스는 다른 것을 했어요. 어느 날 위에서 씨앗 몇 알을 얻어다가 언덕에 심었지요. 저승의 흙에서 그것이 자랄 리 없었는데, 이상하게도 자랐어요.</p><p>페르세포네는 그 언덕에 물을 주러 다녔어요. 하루에 한 번씩요. 그것 말고는 하는 일이 없었어요. 꽃이 피던 날, 앉아 있던 사람들이 하나둘 그쪽으로 고개를 돌렸어요. 이 나라에서 무언가가 새로 피어난 것은 그때가 처음이었거든요.</p><p>페르세포네는 그 꽃들에 이름을 붙이지 않았어요. 이름을 붙이면 여기 것이 되어 버릴 것 같았으니까요. 수레에 말이 매어졌을 때, 하데스가 궁 안으로 들어갔다가 손에 무언가를 들고 나왔어요.</p><p>석류였어요. 반으로 쪼갠 석류였지요. 붉은 알이 촘촘히 박혀 있었어요.</p><p>“올라가는 길이 길다. 가다가 목이 마를 게다.”</p><p>페르세포네는 그것을 보았어요. 손을 뻗지는 않았고요.</p><p>“저는 이 나라의 것은 안 먹습니다.”</p><p>하데스는 고개를 끄덕였어요. 그 대답을 두 해 동안 들어 왔으니까요.</p><p>“알고 있다.” 하데스가 말했어요. 그러고는 그것을 페르세포네의 손바닥에 그냥 놓아 주었어요.</p><p>“가져가거라. 먹고 안 먹고는 네가 정해라.”</p><p>페르세포네는 석류를 든 채 수레에 올랐어요. 헤르메스가 앞에서 고삐를 잡았지요. 수레가 움직이기 시작했어요. 문을 지나고, 강을 건너고, 위로 올라가는 길로 접어들었어요.</p><p>올라가는 동안 헤르메스가 몇 번 말을 걸었어요. 위에는 어머니가 기다리고 계시다고요. 들판이 어떻게 되었는지도 이야기해 주었지요.</p><p>페르세포네는 한 번도 뒤를 돌아보지 않았어요.</p><h2>올라오는 길</h2><p>길은 아주 길었어요. 페르세포네는 손안의 석류를 계속 내려다보았어요. 목이 말랐어요. 두 해 동안 한 번도 마르지 않던 목이었는데, 위로 올라갈수록 자꾸 말랐지요.</p><p>페르세포네는 눈을 감았다가 떴어요. 석류는 그대로 손안에 있었어요. 저 위에 닿으면 어머니가 물을 주실 거야, 하고 생각했어요. 그런데 저 위가 아직 멀었어요. 얼마나 먼지 아무도 말해 주지 않았고요.</p><p>그러다가 알 하나를 떼어 입에 넣었어요. 달았어요. 아주 달았어요. 두 해 만에 처음 맛보는 것이었으니까요.</p><p>페르세포네는 하나를 더 떼었어요. 그리고 또 하나를요. 정신을 차리고 세어 보니 여섯 자리가 비어 있었어요.</p><p>빛이 보이기 시작했어요. 처음에는 실금만 했다가, 손바닥만 했다가, 나중에는 문만 해졌지요. 내려갈 때 좁아지던 그 순서를 거꾸로 되짚는 것 같았어요.</p><p>헤르메스가 뒤를 돌아보았어요.</p><p>“이제 곧 땅 위로 나갑니다.”</p><p>페르세포네는 대답 대신 웃었어요. 두 해 만에 처음 웃는 얼굴이었지요. 헤르메스는 그 얼굴을 보고 마음이 놓였어요. 그러다가 문득 제우스가 마지막에 한 말이 떠올랐어요.</p><p>“한 가지만 여쭙겠습니다.”</p><p>“네.”</p><p>“혹시 아래에서 무얼 드셨습니까?”</p><p>페르세포네의 손이 멈췄어요. 무릎 위에 반으로 쪼갠 석류가 놓여 있었어요. 알이 여섯 자리만큼 비어 있었지요.</p><p>헤르메스는 그것을 보았어요. 그리고 고삐를 잡은 손에 힘이 들어갔어요.</p><p>“석류를 몇 알 드셨습니까?”</p><p>“여섯 알이요.”</p><p>페르세포네는 그제야 헤르메스의 얼굴을 보았어요. 헤르메스는 웃고 있지 않았어요. 늘 웃는 얼굴이던 이가 웃지 않으니 그게 대답이었지요.</p><p>헤르메스는 아무 말도 하지 않았어요. 여기서 돌아설 수도 없었어요. 위에서는 어머니가 두 해째 문을 닫고 있었으니까요.</p><p>“여섯 알을 먹었으면 저는 어떻게 되는 건데요?” 페르세포네가 물었어요.</p><p>헤르메스는 잠깐 고르다가 대답했어요.</p><p>“그건 제가 말씀드릴 수가 없습니다. 위에 가서 제우스께 여쭈어 보지요.”</p><p>수레가 마지막 어둠을 지났어요. 그리고 빛 속으로 나갔어요. 햇빛이 눈을 찔렀어요. 페르세포네는 손등으로 눈을 가렸다가 천천히 내렸어요. 풀 냄새가 났어요. 두 해 동안 아무 냄새도 나지 않는 곳에 있었거든요.</p><h2>다시 손을 얹은 날</h2><p>들판에는 데메테르가 서 있었어요. 두 해 동안 문을 닫고 있던 사람이 어떻게 그날 그 자리에 나와 있었는지는 아무도 몰라요. 어머니들은 가끔 그런 것을 알아요.</p><p>들판은 마른 흙뿐이었어요. 그런데 그 마른 들판 한가운데에 데메테르가 서 있었지요. 수레가 멈추기도 전에 페르세포네가 뛰어내렸어요. 두 사람은 들판 한가운데에서 만났어요.</p><p>한참 동안 아무 말도 오가지 않았어요. 데메테르는 딸의 얼굴을 두 손으로 감싸고 몇 번이나 들여다보았어요.</p><p>“아래에서 무얼 먹은 건 있니?”</p><p>이상한 첫마디였지요. 그런데 데메테르는 그것부터 물었어요. 페르세포네는 대답하지 못했어요. 대신 손에 든 것을 내밀었어요. 반으로 쪼갠 석류였어요.</p><p>데메테르의 얼굴이 굳었어요. 그때 하늘에서 소리가 내려왔어요. 제우스였어요. 산에서 내려오지는 않고 목소리만 들판까지 보냈지요.</p><p>“저승의 것을 한 알이라도 먹었으면 규칙대로라면 온전히 아래 사람이 된다. 그런데 먹은 것이 여섯 알뿐이더구나. 그러니 한 알에 한 달씩, 여섯 달만 아래에 있게 하겠다.”</p><p>데메테르는 하늘을 올려다보았어요.</p><p>“한 해 가운데 여섯 달은 어머니 곁에 있고, 여섯 달은 아래에 있는다. 그 이상은 나도 못 한다.”</p><p>데메테르는 오래 서 있었어요. 딸의 손을 놓지 않은 채로요. 여섯 달을 얻은 것인지 여섯 달을 잃은 것인지, 그때는 알 수 없었지요.</p><p>그러고는 아주 천천히 고개를 끄덕였어요.</p><p>“여섯 달.” 데메테르가 그 말을 소리 내어 한 번 되뇌었어요. 그 말을 자기 입으로 말해 보아야 견딜 수 있을 것 같았거든요.</p><p>데메테르가 무릎을 굽혀 땅에 손을 얹었어요. 두 해 만이었어요. 마른 흙 사이로 초록이 올라왔어요. 처음에는 한 줄기, 그다음에는 열 줄기, 그다음에는 셀 수 없이요.</p><p>들판이 한꺼번에 일어섰어요. 밀이 패고, 보리가 서고, 밭두렁마다 꽃이 돋았어요. 페르세포네가 예전에 땅 위에서 이름을 붙여 둔 그 꽃들도 제자리에 다시 피었지요.</p><p>멀리서 사람들이 밭으로 뛰어나왔어요. 무릎을 꿇고 흙을 만져 보는 사람도 있었어요. 그날 저녁에는 아주 오랜만에 굴뚝마다 연기가 올랐지요.</p><p>데메테르는 그 연기를 보지 않았어요. 딸의 손만 보고 있었어요. 손톱 밑에 저승의 흙이 조금 끼어 있었는데, 그것을 자기 옷자락으로 닦아 주었지요.</p><p>그날 이후로 세상에는 이런 일이 생겼어요. 해마다 여섯 달이 지나면 페르세포네가 아래로 내려가요. 그러면 데메테르가 손을 거두고, 땅은 잠이 들지요.</p><p>찬 바람이 부는 철은 그전에도 있었어요. 그런데 그때부터 사람들은 그 철을 두고 이렇게 말하게 되었어요. 데메테르가 딸을 기다리는 동안이라고요.</p><p>그리고 여섯 달이 지나면 페르세포네가 올라와요. 그러면 땅도 같이 깨어나지요. 그래서 봄에 처음 돋는 싹을 보면, 사람들은 누가 돌아왔구나 하고 생각하게 되었어요.</p><p>그런데 그 첫날에, 아무도 눈여겨보지 않은 것이 하나 있었어요. 페르세포네가 어머니 품에 안기던 그 순간이요. 페르세포네는 안기면서 고개를 살짝 돌려 뒤를 한 번 보았어요.</p><p>방금 닫힌 땅 쪽이었어요. 아주 짧았어요. 데메테르도 못 봤고, 헤르메스도 못 봤지요. 그 눈빛이 무엇이었는지는 아무도 읽지 못했어요.</p></article></noscript>
