  <noscript><article class="ns-text"><h1>꽃밭에서 사라진 아이</h1><h2>꽃 이름을 다 아는 아이</h2><p>데메테르는 이삭을 하나하나 손으로 만져 보았어요. 잘 여문 것은 그냥 두었어요. 덜 여문 것은 옆의 잎을 조금 젖혀 볕이 들게 해 주었지요. 그 들판을 데메테르는 날마다 걸었어요.</p><p>물이 빠진 뒤로 땅은 다시 넉넉해졌어요. 새로 생긴 사람들이 밭을 갈고 씨를 뿌렸지요. 몇 해가 지나자 들판은 다시 누렇게 물들었고요.</p><p>사람들은 데메테르가 지나간 밭이 유난히 잘된다고 말했어요. 그래서 밭 가장자리에 물그릇 하나를 늘 떠 놓았어요. 누가 시킨 것도 아닌데요.</p><p>밭에서 일하던 이들은 데메테르가 오면 허리를 폈어요. 인사를 하지는 않았어요. 그이가 누구인지 몰랐으니까요. 그저 밭을 잘 보는 사람이 지나간다고만 생각했지요.</p><p>데메테르 곁에는 늘 딸이 붙어 다녔어요. 페르세포네였어요. 어머니가 이삭을 보는 동안 페르세포네는 밭두렁에 앉아 꽃을 보았지요.</p><p>“어머니, 이건 이름이 뭐예요?”</p><p>“그건 이름이 없단다.” 데메테르가 허리를 펴며 말했어요.</p><p>“그럼 제가 붙일게요. 종지꽃이요. 안이 오목하잖아요.”</p><p>데메테르는 웃었어요. 페르세포네가 붙인 이름이 벌써 스무 개가 넘었거든요. 게다가 한 번 붙인 이름을 잊는 법이 없었어요. 이듬해 같은 자리에 그 꽃이 다시 피면 어김없이 그 이름으로 불렀지요.</p><p>“꽃 이름만 알면 배가 부르니?” 데메테르가 놀리듯 물었어요.</p><p>“어머니는 이삭 이름만 아시잖아요.”</p><p>“이삭은 이름이 하나야. 밀은 밀이고 보리는 보리지.”</p><p>“그러니까 이삭 보는 일은 심심하지요.”</p><p>데메테르가 이삭 하나를 톡 쳤어요. 페르세포네는 그것을 피하면서도 웃었지요.</p><p>“밀은 심어야 나는데, 꽃은 아무도 안 심어도 나잖아요.”</p><p>“누가 안 심었다고 그러니.”</p><p>“그럼 누가 심었는데요?”</p><p>데메테르는 대답 대신 딸의 머리에 붙은 풀씨를 하나 떼어 주었어요. 데메테르는 웃기만 하고 다시 이삭 쪽으로 돌아섰어요. 저녁이면 두 사람은 나란히 집으로 걸어갔어요. 페르세포네가 그날 꺾은 꽃을 문 앞 항아리에 꽂았고요.</p><p>데메테르는 그 뒷모습을 보면서 생각했어요. 이 아이는 어디를 가든 내 걸음 안에 있구나 하고요. 그때는 그게 당연한 일인 줄 알았지요.</p><p>그 무렵 땅 밑에서도 누군가 자기 들판을 걷고 있었어요. 하데스였어요. 잿빛 들판은 그날도 조용했어요. 발끝에 향기 없는 하얀 꽃이 스쳤지요. 하데스는 그중 하나를 꺾어 손바닥에 올려놓아 보았어요.</p><p>아무리 두어도 시들지 않는 꽃이었어요. 시들지 않으니 피어난 것 같지도 않았어요. 하데스는 그 꽃을 도로 풀밭에 내려놓았어요.</p><p>들판에는 그날도 사람들이 앉아 있었어요. 다투는 이도 없고, 굶는 이도 없었어요. 잘 다스려진 나라였지요. 다만 아무 소리도 나지 않았어요.</p><p>그날 하데스는 오랜만에 문밖으로 나갔어요. 검은 말 네 마리에 수레를 매었지요. 문 앞의 개가 세 머리를 한꺼번에 들었다가, 주인이 위로 가는 것을 보고 도로 엎드렸어요.</p><p>땅 위는 한낮이었어요. 하데스는 눈이 부셔 한참 손차양을 하고 서 있었어요. 빛이 이렇게 밝은 것이었나 싶었지요.</p><p>그러다가 아래쪽 들판에서 소리를 들었어요. 웃음소리였어요. 여자아이 하나가 밭두렁을 뛰어다니고 있었어요. 꽃을 한 아름 안고, 그것을 놓칠까 봐 두 팔로 감싸고요. 뛰다가 한 송이를 떨어뜨리자 되돌아가서 그것을 주웠어요.</p><p>하데스는 그 자리에 오래 서 있었어요. 저 아이는 무엇이 저렇게 좋을까. 아무리 보아도 알 수 없었어요. 그날 하데스는 아무 일도 하지 않고 돌아왔어요. 문을 지나 들판으로 들어서는데, 잿빛이 전보다 더 잿빛으로 보였어요.</p><p>밤에 하데스는 궁 앞 계단에 오래 앉아 있었어요. 그러고는 오래전에 혼자 했던 말을 다시 했어요. 여기는 너무 조용하다고요.</p><p>며칠 뒤 하데스는 올림포스산으로 올라갔어요. 제우스는 형이 온 것을 보고 놀랐어요. 하데스가 산에 오른 것은 형제들이 자리를 나눈 그날 뒤로 처음이었거든요.</p><p>“형님이 여기까지 어쩐 일이십니까?”</p><p>“들판에 아이가 하나 있더구나.” 하데스가 말했어요. “데메테르의 딸이라던데.”</p><p>제우스는 아무 대답도 하지 않았어요.</p><p>“그 아이를 내 나라로 데려가고 싶다. 내 곁에 두고 함께 다스리고 싶구나.”</p><p>제우스는 창밖을 보았어요. 산 아래로 들판이 아주 넓게 펼쳐져 있었어요. 어디쯤에 그 아이가 있는지 여기서는 보이지 않았지요.</p><p>“데메테르는 딸을 놓아주지 않을 겁니다.” 제우스가 말했어요.</p><p>“그러니 너에게 허락을 받으러 온 것이다.”</p><p>제우스는 한참 말이 없었어요. 손가락으로 창틀을 두어 번 두드리기도 했어요. 그러고는 이렇게 말했어요.</p><p>“저는 된다고도, 안 된다고도 말하지 않겠습니다.”</p><p>“그 말을 허락으로 듣겠다.” 하데스가 말했어요.</p><p>제우스는 그 말을 고치지 않았어요. 하데스가 돌아간 뒤에도 오래 창가에 서 있었지요. 그런데 데메테르를 부르지는 않았어요. 그날도, 그다음 날도요.</p><p>그 뒤로 하데스는 한 번 더 땅 위로 올라갔어요. 이번에는 손에 꽃씨 한 알을 쥐고 있었지요.</p><h2>여태 본 적 없는 꽃</h2><p>이튿날 아침이었어요. 데메테르는 남쪽 밭에 다녀올 일이 있었어요. 그해 남쪽은 비가 적어서 이삭이 잘 여물지 않았거든요.</p><p>“해 지기 전에 올게.” 데메테르가 문간에서 말했어요.</p><p>“저는 들판에 있을게요.”</p><p>“너무 멀리 가지 말고.”</p><p>“어머니는 늘 그 말씀만 하세요.”</p><p>데메테르는 딸의 머리를 한 번 쓸어 주고 길을 나섰어요. 언덕을 넘다가 한 번 돌아보았는데, 페르세포네가 아직 문간에 서서 손을 흔들고 있었어요.</p><p>들판 저쪽에서 소 한 마리가 느리게 울었어요. 그것 말고는 여느 날과 똑같은 아침이었어요. 그날은 님프들도 함께 나왔어요. 물가에 사는 님프 셋이 들판까지 올라왔지요. 넷이 나란히 앉아 꽃을 골랐어요.</p><p>바구니가 금세 찼어요. 붓꽃도 있고, 이름 모를 노란 것도 있고, 페르세포네가 지난해에 이름을 붙여 둔 것도 있었어요.</p><p>“이건 종지꽃이야.” 페르세포네가 말했어요. “내가 붙였어.”</p><p>“그런 이름이 어디 있어.”</p><p>“없으니까 붙였지.”</p><p>님프들이 웃었어요. 바람이 한 번 지나가면서 풀이 한쪽으로 누웠다가 도로 섰어요. 들판 끝에서 새 몇 마리가 날아올랐고요.</p><p>페르세포네는 바구니를 무릎에 올려놓고 꽃을 다시 골랐어요. 시든 것은 빼고, 줄기가 너무 긴 것은 아래를 잘랐지요. 문 앞 항아리에 꽂으려면 길이를 맞춰야 했거든요.</p><p>그때 페르세포네가 고개를 들었어요. 들판 한가운데에 처음 보는 꽃이 한 송이 서 있었거든요. 줄기가 팔뚝만큼 굵었어요. 꽃송이는 백 개쯤 달려 있었어요. 어제까지 그 자리에 그런 것은 없었어요.</p><p>향기가 들판 끝까지 갔어요. 페르세포네는 그 향기를 맡고 자기도 모르게 일어섰어요. 님프들은 아무 냄새도 맡지 못했어요. 그런데 페르세포네에게는 그 향기가 자기 이름을 부르는 것처럼 또렷했지요.</p><p>“저기 저 큰 꽃은 뭐지?”</p><p>님프 하나가 고개를 들었어요. 그런데 그 님프의 눈에는 아무것도 보이지 않았어요. 풀만 있는 빈 들판이었지요.</p><p>“뭐가 있다는 거야?”</p><p>페르세포네는 대답하지 않고 걸어갔어요. 열 걸음쯤 갔을까요. 바구니를 든 손이 무거워서 그것을 풀밭에 내려놓았어요.</p><p>가까이 갈수록 향기가 짙어졌어요. 이런 꽃이면 이름을 아주 좋은 것으로 붙여 주어야겠다고 페르세포네는 생각했어요.</p><p>꽃 앞에 서서 두 손으로 줄기를 잡았어요. 그리고 힘을 주어 당겼지요. 땅이 갈라졌어요. 소리가 먼저 났어요. 아주 낮고 긴 소리였어요. 그다음에 발밑이 열렸지요.</p><p>갈라진 자리에서 검은 말 네 마리가 솟아올랐어요. 말들은 콧김도 뿜지 않았고 발굽 소리도 내지 않았어요. 그 뒤에 수레가 있었고, 수레 위에 잿빛 망토를 두른 이가 서 있었어요.</p><p>하데스는 페르세포네를 저승으로 데려갔어요. 페르세포네는 어머니를 부르며 오래오래 울었어요. 아무리 신이라 해도, 묻지도 않고 데려가는 건 납치였지요.</p><p>갈라진 땅은 곧 다시 닫혔어요. 흙 한 줌 흐트러지지 않았어요. 방금까지 그 자리에 서 있던 큰 꽃도 함께 사라졌고요.</p><p>님프들이 소리가 난 쪽으로 뛰어왔어요. 그런데 들판에는 아무것도 없었어요. 풀밭에 바구니 하나가 놓여 있을 뿐이었지요.</p><p>셋은 서로를 쳐다보았어요. 방금 무엇을 보았는지 말할 수 있는 이가 하나도 없었어요. 하나가 바구니 쪽으로 다가가려다가 멈췄어요. 저것을 건드리면 정말로 무슨 일이 일어난 것이 되어 버릴 것 같았거든요.</p><p>아래로 가는 길은 캄캄했어요. 페르세포네는 수레 난간을 두 손으로 붙잡았어요. 붙잡지 않으면 어디로 떨어질지 알 수 없었으니까요.</p><p>위쪽에서 빛이 점점 좁아졌어요. 처음에는 문만 했다가, 손바닥만 했다가, 나중에는 실금만 해졌지요.</p><p>“어디로 가는 거예요?”</p><p>하데스는 대답하지 않았어요. 고삐만 한 번 고쳐 쥐었지요.</p><p>“저를 어디로 데려가는 거냐고요?”</p><p>“땅 밑에 있는 내 나라로 간다.” 하데스가 겨우 말했어요.</p><p>페르세포네는 그 말을 알아듣지 못했어요. 땅 밑에 무슨 나라가 있다는 건지, 왜 자기가 거기로 가야 하는지 아무도 말해 준 적이 없었으니까요.</p><p>그 뒤로 페르세포네는 묻지 않았어요. 대신 어머니를 불렀어요. 한 번 부르고, 또 한 번 부르고, 목이 쉴 때까지 불렀어요.</p><p>수레는 멈추지 않았어요. 하데스는 그 소리를 하나도 빠짐없이 다 들었어요. 그런데도 멈추지 않았지요. 수레는 흔들리지도 않았어요. 아래로 내려가는데 내려가는 느낌이 없었어요. 그게 더 무서웠지요.</p><p>한참 뒤에 하데스가 입을 열었어요.</p><p>“거기서는 아무도 너를 해치지 않는다.”</p><p>페르세포네는 대답하지 않았어요. 그건 하데스가 아는 말 가운데 가장 좋은 말이었는데, 그 말로는 아무것도 되지 않았어요.</p><p>땅 위에서 그 울음소리를 들은 이가 둘 있었어요. 하나는 물가에 앉아 있던 어느 님프였고, 하나는 그때 하늘 한가운데를 지나가던 이였지요. 그렇지만 그날은 둘 다 아무 말도 하지 않았어요.</p><p>얼마나 갔는지 몰라요. 수레가 강 하나를 건넜어요. 물빛이 아주 검었어요. 물살이 있는데도 아무 소리가 나지 않았지요.</p><p>강가에 나룻배가 한 척 매여 있었어요. 삿대를 짚은 늙은 사공이 수레를 보고 옆으로 비켜섰어요. 이 수레에서는 뱃삯을 받지 않았거든요.</p><p>건너편에 돌로 만든 문이 하나 서 있었어요. 담장도 울타리도 없이 문만 덩그러니 서 있었지요. 문 앞에 엎드려 있던 개가 일어섰어요. 머리가 셋인 아주 큰 개였어요. 세 머리가 한꺼번에 수레 쪽을 보았지요.</p><p>페르세포네는 무섭지 않았어요. 무서울 자리가 이미 다 차 있었거든요. 문 안쪽에는 아주 넓은 들판이 있었어요. 하늘은 없었어요. 대신 아주 높은 곳에 희끄무레한 빛이 넓게 깔려 있었지요. 아침도 저녁도 아닌 빛이었어요.</p><p>사람들이 여기저기 앉아 있었어요. 수레가 지나가는데도 아무도 고개를 들지 않았어요. 수레가 검은 돌로 지은 궁 앞에 멈췄어요. 하데스가 먼저 내려서 손을 내밀었어요. 페르세포네는 그 손을 잡지 않고 혼자 내렸지요.</p><p>“여기가 네 자리다.” 하데스가 말했어요.</p><p>페르세포네는 궁을 올려다보았어요. 기둥에 무늬가 하나도 없었어요. 문에도 장식이 없었고요.</p><p>“여기에는 무엇이 있습니까?”</p><p>“여기에는 배고픔이 없고, 추위도 없고, 서두를 일도 없다.”</p><p>“없는 것 말고요. 무엇이 있느냐고 여쭈었습니다.”</p><p>하데스는 대답하지 못했어요. 그런 질문은 받아 본 적이 없었거든요. 저녁에 상이 들어왔어요. 은쟁반에 잘 익은 것들이 담겨 있었어요. 페르세포네는 손을 대지 않았어요.</p><p>어디선가 들은 말이 하나 있었거든요. 저승의 것을 한 입이라도 먹은 이는 저승의 몫이 된다는 말이요. 상은 그대로 물려 나갔어요.</p><p>밤이 되었는지 아침이 되었는지도 알 수 없었어요. 그 나라에는 해가 뜨고 지는 것이 없었으니까요. 페르세포네는 계단에 앉아 위쪽을 올려다보았어요. 아무리 올려다봐도 천장 같은 것은 보이지 않았지요.</p><h2>풀밭에 남은 바구니</h2><p>땅 위에서는 아직 그날 해가 지지 않았어요. 데메테르는 해가 기울 무렵 남쪽 밭에서 돌아왔어요. 어깨에 마른 이삭을 한 다발 메고 있었지요.</p><p>들판 어귀에서 데메테르는 걸음을 늦추었어요. 조용했거든요. 여느 날 같으면 딸이 저 끝에서부터 손을 흔들었어요. 그날은 손을 흔드는 사람이 없었어요.</p><p>님프들이 풀밭에 모여 앉아 있었어요. 데메테르를 보고도 아무도 일어서지 않았지요.</p><p>“페르세포네는 어디 갔니?”</p><p>님프 하나가 입을 열었다가 다물었어요. 그러고는 풀밭 가운데를 가리켰어요. 거기 바구니가 놓여 있었어요. 꽃이 가득 담긴 채로, 넘어지지도 않고 똑바로요.</p><p>데메테르는 이삭 다발을 내려놓았어요. 그리고 바구니 앞으로 걸어가 무릎을 굽혔어요. 손을 대 보니 꽃이 아직 시들지 않았어요.</p><p>“그 아이가 언제 없어졌니?”</p><p>“조금 전에요.” 님프가 아주 작게 말했어요. “소리가 났는데, 돌아보니까 없었어요.”</p><p>“무슨 소리가 났는데?”</p><p>“땅이 우는 소리 같았어요.”</p><p>데메테르는 일어섰어요. 그리고 들판을 한 바퀴 둘러보았어요. 풀은 그대로였고 흙도 그대로였어요. 파헤쳐진 자리도, 발자국도 없었지요.</p><p>그래서 더 이상했어요. 사람이 사라졌는데 아무 흔적도 없다는 것이요. 데메테르는 님프들에게 다시 물었어요. 셋 다 같은 말만 되풀이했지요. 소리가 났고, 돌아보니 없었다고요.</p><p>“그 아이가 어느 쪽으로 갔니?”</p><p>“어느 쪽으로도 가지 않았어요.”</p><p>“그게 무슨 말이니?”</p><p>“그 자리에서 그냥 없어졌어요.”</p><p>데메테르는 그 말을 알아듣지 못했어요. 사람은 어느 쪽으로든 가는 법이니까요. 데메테르는 이삭 다발도 바구니도 그 자리에 두고 들판 쪽으로 돌아섰어요. 그러고는 딸의 이름을 불렀어요.</p><p>한 번 불렀어요. 소리가 들판을 지나 산기슭에 부딪혔다가 되돌아왔어요. 두 번 불렀어요. 이번에는 아무것도 돌아오지 않았어요.</p></article></noscript>
