  <noscript><article class="ns-text"><h1>세상 끝의 바위</h1><h2>부르기 전에 올라온 이</h2><p>다음 날 아침, 올림포스산 문 앞에 프로메테우스가 서 있었어요. 아무도 부르지 않았어요. 제우스는 사람을 보낼 참이었는데, 보내기도 전에 프로메테우스가 먼저 올라온 거예요. 옷차림도 어제 그대로였고, 산길 흙이 발에 그대로 묻어 있었지요.</p><p>신들이 하나둘 모여들었어요. 아무도 말을 하지 않았어요. 산꼭대기가 아주 조용했어요. 바람도 그날은 자는 것 같았어요.</p><p>제우스가 왕좌에서 일어섰어요. 손에 번개는 들려 있지 않았어요. 그런데도 산꼭대기 공기가 팽팽하게 당겨졌지요.</p><p>“저 아래에 불을 가져다준 것이 너냐?”</p><p>“제가 했습니다.”</p><p>프로메테우스는 곧바로 대답했어요. 변명도 하지 않았고 고개를 숙이지도 않았어요. 그 대답이 오히려 제우스를 더 화나게 했어요. 감추려고 들었다면 차라리 나았을 거예요.</p><p>“나는 안 된다고 했다. 분명히 그렇게 말했다.”</p><p>“들었습니다. 그런데도 가져갔습니다.”</p><p>프로메테우스가 말했어요. 제우스는 잠깐 말을 멈추었어요. 그러고는 짧게 물었어요.</p><p>“왜 불을 가져다주었느냐?”</p><p>프로메테우스는 산 아래를 한 번 내려다보았어요. 낮이라 불빛은 보이지 않았어요. 대신 마을마다 가느다란 연기가 곧게 올라오고 있었지요. 하나, 둘, 셋. 세다가 그만두었어요. 너무 많았거든요.</p><p>“저 사람들에게는 아무것도 없었으니까요. 하나도 없었어요.”</p><p>“자루를 비운 것은 네 동생이 한 일이다. 네가 대신 갚을 일이 아니야.”</p><p>“동생이 한 일이니까 형인 제가 갚으러 온 것입니다.”</p><p>제우스는 그 말에 아무 대꾸도 하지 않았어요. 한참 뒤에야 낮은 목소리로 말했어요.</p><p>“불은 이제 거둬들일 수가 없다. 사람 손에서 사람 손으로 옮겨 갔으니까.”</p><p>“압니다. 다시 거둬들일 수 없게 하려고 그렇게 옮겨 주었습니다.”</p><p>제우스가 프로메테우스를 오래 보았어요. 그 말이 무슨 뜻인지 알아들었거든요. 나뭇대도, 천천히 타는 심도, 옮겨 붙는 불도, 다 미리 생각해 둔 것이라는 뜻이었지요.</p><p>“불은 거둘 수 없으니, 벌을 받을 것은 너 하나로구나.”</p><p>모여 선 신들 가운데 누구도 나서지 않았어요. 프로메테우스를 편들 만한 이가 없어서가 아니었어요. 무슨 말을 해야 편드는 것이 되는지 아무도 몰랐거든요.</p><p>프로메테우스는 그 자리에서 딱 한 가지만 물었어요.</p><p>“사람들에게서 불을 다시 빼앗지는 않으실 거지요?”</p><p>제우스는 대답하지 않았어요. 대답하지 않은 것이 대답이었어요. 프로메테우스는 그제야 어깨에서 힘을 뺐어요.</p><p>그날 제우스는 헤파이스토스를 불렀어요. 헤파이스토스가 앞치마를 두른 채 올라왔어요. 손에는 아직 검댕이 묻어 있었지요. 걸음이 느려서 산꼭대기까지 오는 데 시간이 걸렸어요.</p><p>“끊어지지 않는 사슬을 만들어라.”</p><p>헤파이스토스는 곧바로 대답하지 않았어요. 앞치마 자락을 한 번 쥐었다 놓았어요.</p><p>“누구를 묶는 사슬입니까?”</p><p>제우스가 프로메테우스 쪽을 보았어요. 헤파이스토스도 그쪽을 보았어요. 그러고는 다시 고개를 돌렸어요.</p><p>“저 말고 다른 이에게 시키시면 안 될까요?”</p><p>“네가 만든 사슬은 아무도 못 끊는다. 그래서 너에게 맡기는 것이다.”</p><p>헤파이스토스는 한참 서 있다가 고개를 숙였어요. 그러고는 대장간으로 내려갔어요. 그날 밤 대장간에서는 망치 소리가 났어요. 여느 때와 달랐어요. 한 번 치고 오래 쉬고, 또 한 번 치고 오래 쉬었지요. 소리가 자꾸 끊겼어요.</p><p>화로 앞에 앉아 있던 이가 그 소리를 오래 들었다고 해요. 그날은 아무도 그 대장간 쪽으로 가지 않았어요. 헤파이스토스는 밤새 그 사슬을 만들었어요. 그리고 만들면서 자꾸 손을 멈췄어요. 자기가 만든 것 가운데 처음으로, 다 만들지 않았으면 하는 물건이었거든요.</p><p>그래도 헤파이스토스는 대충 만들지 않았어요. 대충 만들면 다른 이가 다시 만들게 될 테니까요. 그건 더 나쁜 일이라고 생각했어요.</p><p>새벽에 사슬이 완성되었어요. 헤파이스토스는 그것을 어깨에 걸치고 한참 앉아 있었어요.</p><h2>세상의 서쪽 끝에서</h2><p>세상의 서쪽 끝은 아주 멀었어요.</p><p>걸어서 여러 날이 걸렸어요. 프로메테우스는 앞서 걸었고, 사슬을 멘 헤파이스토스가 조금 뒤에서 따라갔어요. 두 사람은 그 여러 날 동안 거의 말을 하지 않았어요. 할 말이 없어서가 아니라, 할 말이 너무 많으면 사람은 도리어 입을 다물게 되거든요.</p><p>길에서 마을을 몇 군데 지났어요. 마당마다 돌을 둥글게 놓고 그 안에 불을 피워 두었더군요. 어느 마을에서는 아이가 불 앞에 앉아 젖은 나뭇가지를 말리고 있었어요. 프로메테우스는 걸음을 늦추지 않았어요. 다만 그 마당을 조금 오래 보았지요.</p><p>나무가 점점 낮아지더니 아예 없어졌어요. 풀도 사라졌어요. 마지막에는 잿빛 돌뿐이었지요. 바람이 한 방향으로만 불었어요.</p><p>그곳에 커다란 바위 하나가 서 있었어요. 사람 키의 몇 배는 되는 바위였어요. 그리고 그 옆에, 무릎을 꿇은 채 두 팔로 하늘을 떠받치고 있는 이가 있었어요.</p><p>아틀라스였어요. 아틀라스는 프로메테우스의 형이었어요. 형제 가운데 맏이였지요. 아주 오래전 아틀라스는 티탄 편에 서서 끝까지 물러서지 않았고, 그 때문에 하늘을 어깨에 얹게 되었어요.</p><p>형이 고개를 조금 돌렸어요. 목이 거기까지밖에 돌아가지 않았거든요.</p><p>“너도 왔구나.”</p><p>아틀라스가 말했어요. 목소리가 낮고 갈라져 있었어요. 오래 말을 하지 않은 사람의 목소리였지요.</p><p>“형은 그대로시네요.”</p><p>“그대로지. 여기서는 아무것도 안 바뀐다.”</p><p>프로메테우스는 형의 어깨 위를 올려다보았어요. 별들이 아주 천천히 돌고 있었어요. 그 무게가 어느 정도일지 프로메테우스는 짐작조차 할 수 없었어요.</p><p>“하늘이 무겁지요?”</p><p>“처음에만 무거웠어. 지금은 그냥 내 일이야.”</p><p>아틀라스가 그렇게 말하고 다시 앞을 보았어요. 그러고는 한마디를 덧붙였어요.</p><p>“너는 무슨 일을 했길래 여기까지 왔니?”</p><p>“아래에 불을 가져다주었어요.”</p><p>아틀라스는 한참 아무 말이 없었어요. 그러다 아주 작게 웃었어요. 웃을 때 어깨가 흔들려서 하늘도 조금 흔들렸지요. 그 바람에 별 하나가 자리를 옮겼다가 되돌아왔어요.</p><p>“너답구나. 어릴 때도 너는 늘 남의 걱정을 먼저 했지.”</p><p>아틀라스가 말했어요. 그러고는 한참 뒤에 다시 물었어요. 서두르지 않는 목소리였어요. 여기서는 서두를 일이 아무것도 없었으니까요.</p><p>“불을 가져다준 일을 후회하니?”</p><p>프로메테우스는 잠깐 생각했어요. 여기까지 오는 여러 날 동안 그 물음을 스스로에게도 여러 번 해 보았거든요. 그때마다 답은 같았어요.</p><p>“아니요. 하나도요.”</p><p>“나도 티탄 편에 섰던 일을 후회 안 해. 그때 물러섰으면 지금 여기 없었겠지만, 그래도 안 해.”</p><p>아틀라스가 말했어요. 그 말이 서쪽 끝에서 형제가 나눈 마지막 긴 이야기였어요. 그다음부터는 둘 다 말수가 아주 줄었거든요.</p><p>헤파이스토스가 어깨에서 사슬을 내려 잿빛 돌바닥에 놓았어요. 쇳덩이가 바닥에 닿으며 둔한 소리를 냈어요. 사슬은 무거웠어요. 고리 하나가 사람 손목만 했지요. 그런데 이상하리만치 매끄러웠어요. 어디에도 거친 데가 없었어요. 만든 사람이 마지막까지 손을 놓지 않았다는 뜻이었지요.</p><p>프로메테우스는 바위 앞에 등을 대고 섰어요. 그러고는 두 팔을 벌렸어요. 시키기 전에 먼저요. 헤파이스토스가 사슬을 들었어요. 그런데 손이 떨렸어요. 여러 해 동안 뜨거운 쇠를 다뤄 온 손이었는데도요. 아테나가 태어나던 날 제우스의 머리를 도끼로 칠 때도 떨지 않던 손이었는데요.</p><p>“미안합니다. 제가 만든 것이라 더 미안합니다.”</p><p>헤파이스토스가 말했어요. 목소리가 아주 작았어요.</p><p>“네 잘못이 아니야. 네가 안 만들었으면 다른 사람이 만들었을 거야.”</p><p>프로메테우스가 대답했어요. 헤파이스토스는 그 말에 더 오래 손을 떨었어요. 차라리 나무라 주었으면 나았을 거예요.</p><p>사슬이 채워졌어요. 두 번, 소리가 났어요. 헤파이스토스는 사슬을 채우고 나서도 한참 고개를 들지 못했어요. 그러고는 돌아서서 왔던 길로 걸어갔어요. 한 번도 뒤를 돌아보지 않았어요.</p><p>이튿날 아침에 큰 독수리 한 마리가 날아왔어요. 제우스가 보낸 새였지요. 독수리는 프로메테우스의 몸을 쪼고 갔어요. 밤이 되면 상처가 아물었고, 다음 날 아침이면 독수리가 또 왔어요. 날마다 같은 일이 되풀이되었어요. 프로메테우스는 그 오랜 세월을 견뎠지요. 그건 정말 너무한 일이었어요. 프로메테우스는 그동안 딱 하나만 세었어요. 저 아래 마을에서 연기가 몇 줄이나 올라오는지요. 세다가 놓치면 처음부터 다시 세었어요.</p><p>바위 아래로는 파도가 밀려왔다 물러갔어요. 여름이 오고 겨울이 가고, 또 여름이 왔어요. 프로메테우스는 그 자리에서 세상이 조금씩 달라지는 것을 보았지요.</p><p>저녁마다 아래 마을에서 피어오르는 연기도 그 자리에서 다 보였어요. 연기는 해마다 조금씩 늘었어요.</p><p>저 아래 사람들은 그 일을 몰랐어요. 누가 불을 가져다주었는지도 차츰 잊었고요. 다만 불을 꺼뜨리지 말라는 말만은 대를 이어 지켰어요. 그것이 어디에서 온 말인지도 모른 채로요.</p><p>바위 앞으로 계절이 지나갔어요. 눈이 왔다가 녹고, 마른 풀이 돋았다가 다시 시들었어요. 서쪽 끝에는 그런 것을 세어 줄 사람이 없었어요.</p><p>프로메테우스는 가끔 고개를 들어 동쪽을 보았어요. 아주 맑은 밤이면 저 멀리 아래쪽에 아주 작은 빛들이 보이는 것 같았어요. 정말 보였는지, 보인다고 믿었는지는 프로메테우스만 알겠지요.</p><p>그동안 옆에서 아틀라스가 하늘을 떠받치고 있었어요. 둘은 말을 많이 하지 않았어요. 다만 밤이 되면 한쪽에서 사슬이 절그럭거렸고, 그러면 다른 쪽에서도 어깨를 고쳐 세우는 소리가 났지요.</p><h2>말을 전하러 온 이</h2><p>세월이 흘렀어요. 얼마나 흘렀는지는 아무도 세지 않았어요. 저 아래에서는 사람들이 불을 몇 대째 이어 가고 있었지요.</p><p>어느 날 서쪽 끝에 날개 달린 신발 소리가 났어요. 헤르메스였어요. 제우스의 말을 전하러 온 것이지요. 헤르메스는 바위 앞에 내려서서 잠깐 숨을 골랐어요. 여기까지 오는 길이 멀었거든요. 심부름꾼 노릇을 오래 했지만 이런 데는 처음이었어요.</p><p>“아버지의 말씀을 전하러 왔습니다.”</p><p>헤르메스가 말했어요. 프로메테우스는 고개를 들었어요.</p><p>“한마디만 하면 됩니다. 잘못했다고요. 그 한마디면 사슬을 풀어 주겠다고 하셨어요.”</p><p>바람이 한 번 지나갔어요. 프로메테우스는 한참 동안 아무 말도 하지 않았어요. 그러고는 고개를 저었어요.</p><p>“잘못했다는 말은 못 하겠어요.”</p><p>헤르메스는 잠깐 자기 귀를 의심했어요. 잘못 들었나 싶어서 되물었지요.</p><p>“한마디면 됩니다. 딱 한마디요. 그러면 오늘 여기서 나가실 수 있어요.”</p><p>“그 한마디를 하면, 저 아래 불이 잘못 켜진 게 되잖아요.”</p><p>헤르메스는 무슨 말을 더 해야 할지 몰랐어요. 이런 대답은 처음 들었거든요. 헤르메스는 여태 사람이든 신이든, 풀어 준다면 무엇이든 하는 것만 보아 왔으니까요.</p><p>“여기 오래 계셨잖아요. 얼마나 되셨는지 세어 보기는 하셨어요?”</p><p>“세지 않았어요. 오래 있었지요. 그런데 저 아래는 그동안 따뜻했잖아요.”</p><p>헤르메스는 저도 모르게 동쪽을 돌아보았어요. 여기에서는 아무것도 보이지 않았어요. 그런데도 무언가 보이는 것 같았지요.</p><p>헤르메스는 태어난 지 하루 만에 소를 몰고 나갔던 신이에요. 겁이 없는 쪽이었지요. 그런 헤르메스가 그날은 어쩐지 말을 고르게 되었어요.</p><p>“그 말씀을 그대로 전하면 아버지가 화를 내실 텐데요.”</p><p>“그래도 그대로 전해 주세요. 고쳐서 전하면 제 말이 아니게 되잖아요.”</p><p>프로메테우스가 말을 이었어요.</p><p>“대신 두 가지를 전해 주세요.”</p><p>“말씀하세요. 그대로 전하겠습니다.”</p><p>“하나는 제 동생에게요. 에피메테우스에게, 제우스가 주는 선물은 무엇이든 받지 말라고 전해 주세요. 아무리 좋아 보여도요. 특히 좋아 보이면 더요.”</p><p>헤르메스가 고개를 끄덕였어요. 그러고는 물었어요.</p><p>“또 하나는 누구에게 전할까요?”</p><p>프로메테우스는 사슬에 매인 채 고개를 들어 헤르메스를 똑바로 보았어요.</p><p>“제우스에게 전해 주세요. 당신도 언젠가 그 왕좌를 잃을까 걱정하게 될 거라고요.”</p><p>헤르메스는 올림포스산으로 돌아왔어요. 돌아오는 길이 갈 때보다 더 멀게 느껴졌어요. 첫 번째 말은 그대로 전했어요. 두 번째 말도 그대로 전했지요. 헤르메스는 심부름꾼이라, 들은 말을 고치지 않았거든요. 고쳐서 전하면 그때부터 심부름꾼이 아니니까요.</p><p>제우스는 왕좌에 앉은 채 그 말을 들었어요. 얼굴에는 아무 표정이 없었어요. 손가락 하나 움직이지 않았지요.</p><p>그런데 제우스는 그 말을 어디선가 들은 적이 있었어요. 아주 오래전, 크로노스도 자기 아버지에게서 꼭 같은 말을 들었거든요. 그리고 그 말은 그대로 되었지요.</p><p>제우스는 잠깐 크로노스의 얼굴을 떠올렸어요. 아주 오래전, 돌덩이를 삼키고 흡족해하던 그 얼굴을요. 그러고는 얼른 다른 생각을 했어요.</p><p>제우스는 손끝으로 왕좌의 팔걸이를 두어 번 두드렸어요. 그러고는 자리에서 일어섰어요.</p><p>“이제 저 아래 사람들 이야기를 해 보자.”</p><p>제우스가 혼잣말처럼 말했어요. 곁에 있던 신들이 서로를 쳐다보았어요. 무슨 말인지 아무도 몰랐거든요.</p><p>“불을 쥐었으니 이제 저희끼리 잘 살겠지. 우리를 아쉬워할 일이 없겠구나.”</p><p>신들은 그 말에 아무도 대꾸하지 않았어요. 제우스가 저런 말투로 말할 때는 이미 무언가를 정한 뒤라는 걸 다들 알았거든요.</p><p>제우스는 잠깐 아래를 내려다보았어요. 낮이라 불빛은 보이지 않았어요. 대신 연기가 아까보다 더 늘어 있었지요.</p><p>그러고는 산 아래로 걸어 내려갔어요. 제우스가 걸어간 곳은 대장간이었어요. 헤파이스토스는 그날도 모루 앞에 있었어요. 아버지가 문간에 서 있는 것을 보고 망치를 내려놓았어요.</p><p>“사람에게 줄 선물을 하나 만들어라.”</p><p>헤파이스토스가 고개를 들었어요. 잘못 들은 줄 알았거든요.</p><p>“선물이요? 사람에게요?”</p><p>“그래, 사람에게 줄 선물이다. 아주 아름다운 것으로 만들어라.”</p><p>제우스는 그 말만 하고 돌아섰어요. 화덕 속 숯이 한 번 붉게 밝아졌어요.</p></article></noscript>
