  <noscript><article class="ns-text"><h1>하루만 몰아 본 수레</h1><h2>우리 아버지가 누군지 알면</h2><p>강가에서 아이들이 물수제비를 뜨고 있었어요. 파에톤이 던진 돌이 일곱 번을 뛰었지요. 그 강에서 일곱 번을 뛴 돌은 그때까지 없었어요.</p><p>“내 돌이 일곱 번 뛰는 거 봤지?” 파에톤이 손을 털며 말했어요.</p><p>아이들이 저마다 납작한 돌을 골랐어요. 넷이 던졌는데 셋은 두 번, 하나는 네 번이었지요. 파에톤은 강가에 쭈그리고 앉아 그것을 보고 있었어요. 그러다가 한마디를 보탰어요.</p><p>“우리 아버지가 누군지 알면 놀라지도 않을걸.”</p><p>“너희 아버지가 누군데?”</p><p>“하늘에서 해 수레를 모는 분이야.”</p><p>아이들이 웃었어요. 한참을 웃었어요. 웃다가 하나는 배를 잡고 강가에 주저앉기까지 했지요.</p><p>“그러면 너희 집에는 언제 오시는데?”</p><p>파에톤은 대답하지 못했어요. 물수제비를 뜨려고 쥐고 있던 돌만 손안에서 굴렸지요. 그 아이가 강 건너 밭 쪽을 턱으로 가리켰어요. 보리가 반쯤 누렇게 익은 밭이었어요. 그 가운데에서 어른 하나가 허리를 굽히고 있었지요.</p><p>“우리 아버지는 저기 있어.” 그 아이가 말했어요. “네 아버지는 어디 있어?”</p><p>파에톤은 그 밭을 보았어요. 허리를 굽히고 있던 어른이 몸을 펴더니 이쪽을 보고 손을 한 번 흔들었어요. 그 아이가 마주 흔들었지요.</p><p>파에톤도 손을 들어 보았어요. 그런데 흔들 데가 없어서 그냥 머리를 한 번 긁고 내렸지요. 파에톤은 손에 든 돌을 그냥 물에 떨어뜨렸어요. 돌은 한 번도 뛰지 않고 가라앉았지요.</p><p>파에톤은 집으로 뛰었어요. 뛰는 동안 뒤에서 웃음소리가 한참 따라왔어요. 마당에 들어서면서 파에톤은 무릎에 손을 짚고 숨을 몰아쉬었지요.</p><p>어머니는 마당에 앉아 콩을 고르고 있었어요. 파에톤이 그 앞에 섰어요. 어머니는 고개를 들지 않고 물었지요.</p><p>“왜 그렇게 뛰어왔니?”</p><p>“제 아버지가 해를 모는 분이라는 말, 정말이에요?”</p><p>어머니의 손이 멈췄어요. 콩 몇 알이 손가락 사이로 굴러떨어졌어요. 어머니는 그것을 줍지 않았지요.</p><p>“정말이란다. 네 아버지는 해를 모는 헬리오스란다.”</p><p>어머니는 아들이 아주 어릴 때부터 그 이야기를 해 주었어요. 잠들기 전에 몇 번이나요. 그런데 그 이야기를 밖에 나가서 하라고는 한 번도 하지 않았지요.</p><p>“그럼 아이들한테 보여 줄 증거를 주세요.”</p><p>“증거는 나한테 없다.”</p><p>어머니는 그제야 고개를 들어 동쪽을 가리켰어요. 마당 담 너머로 낮은 산줄기가 보였지요.</p><p>“저쪽으로 계속 가면 세상의 동쪽 끝이 나온다.” 어머니가 말했어요. “거기 가서 직접 물어보아라.”</p><p>어머니가 그쪽을 보는 아들의 옆얼굴을 한참 보다가 다시 입을 열었지요.</p><p>“먼 길이다. 며칠이 걸릴지는 나도 모른다.”</p><p>“거기 가면 아버지를 만날 수 있어요?”</p><p>“해가 나오는 문 앞까지는 갈 수 있을 거다. 아버지가 만나 주실지는 모르겠구나.”</p><p>어머니는 마른 빵 몇 조각과 물을 챙겨 주었어요. 챙기는 손이 자꾸 멈췄지요. 파에톤은 그것을 못 본 척했어요. 빨리 떠나고 싶었거든요.</p><p>파에톤은 그날로 떠났어요. 어머니는 문 앞에 서서 아들이 산모퉁이를 돌아 사라질 때까지 보았어요. 그러고는 마당으로 돌아와 떨어진 콩을 하나씩 주웠지요. 다 줍고 나서도 한참을 그대로 앉아 있었어요.</p><h2>세상의 동쪽 끝</h2><p>파에톤은 동쪽으로만 걸었어요. 해가 뜨는 쪽으로 가면 된다고 생각했지요. 그런데 걸어도 걸어도 해는 늘 앞에 있었어요. 만나는 사람마다 동쪽 끝이 어디냐고 물었는데, 다들 그냥 저쪽이라고만 했고요.</p><p>세상의 동쪽 끝에는 바다에서 곧장 솟아오른 문 같은 것이 있었어요. 문이라기보다 빛이 나오는 자리였지요. 파에톤은 몇 밤을 걸어 그 앞에 닿았어요.</p><p>가까이 갈수록 눈을 뜨기가 어려웠어요. 파에톤은 손등으로 눈을 가리고 걸었어요. 그래도 발밑은 보였어요. 바닥이 온통 금빛이었거든요.</p><p>안쪽에 한 사람이 앉아 있었어요. 머리카락이 금빛으로 길게 흘러내렸고, 머리 위에는 둥근 해가 얹혀 있었어요. 헬리오스였어요.</p><p>헬리오스는 파에톤이 오는 것을 아주 멀리서부터 보고 있었어요. 아침에 동쪽에서 올라와 저녁에 서쪽으로 내려가는 동안, 헬리오스는 땅 위의 일을 하나도 빠짐없이 내려다보거든요. 그러니 저 아이가 며칠째 걷고 있는지도 알고 있었지요.</p><p>“가까이 오너라.” 헬리오스가 말했어요. “눈이 아프거든 반쯤 감아도 된다.”</p><p>파에톤은 그 앞까지 걸어갔어요. 무릎이 조금 떨렸지요.</p><p>“무슨 일로 여기까지 왔느냐?”</p><p>“여쭤볼 게 있어서요.”</p><p>“말해 보아라.”</p><p>“제가 정말 아드님이 맞습니까?”</p><p>헬리오스는 머리 위의 해를 벗어 옆에 내려놓았어요. 방 안이 조금 어두워졌어요. 파에톤은 그제야 그 얼굴을 똑바로 볼 수 있었지요.</p><p>“맞다. 너는 내 아들이다.” 헬리오스가 말했어요.</p><p>파에톤은 아무 말도 하지 못했어요. 여기까지 오는 동안 몇 밤을 걸었는데, 막상 그 대답을 듣고 나니 발끝만 내려다보게 되었지요.</p><p>파에톤은 그 말을 한 번 더 듣고 싶었어요. 그런데 다시 물어볼 수는 없었지요. 헬리오스가 자리에서 일어나 아들 앞으로 걸어왔어요.</p><p>“믿기 어려운 모양이구나.” 헬리오스가 말했어요. “무엇이든 하나 말해 보아라. 네가 달라는 것을 주마. 저승을 흐르는 강에 걸고 맹세하마.”</p><p>그 강은 스틱스강이라고 해요. 물빛이 검고, 물살이 있는데도 소리가 나지 않는 강이지요. 신들이 그 강에 걸고 한 말은 무슨 일이 있어도 되돌릴 수 없었어요.</p><p>파에톤은 그 말을 기다렸다는 듯이 대답했어요.</p><p>“하루만 아버지의 해 수레를 몰게 해 주세요.”</p><p>헬리오스가 걸음을 멈췄어요. 바닥에 내려놓았던 둥근 해가 한 번 흔들렸지요.</p><p>“그것 말고 다른 것을 말해라.”</p><p>“무엇이든 주겠다고 스틱스강에 걸고 맹세하셨잖아요.”</p><p>“그 맹세를 되돌릴 수 없으니 지금 무섭다.”</p><p>헬리오스가 문밖의 하늘길을 가리켰어요. 그쪽에는 아직 아무것도 없었어요. 새벽이 오려면 시간이 남아 있었거든요.</p><p>“저 길은 처음이 가파르다. 아침에는 말들이 언덕을 오르듯 올라간다. 한가운데에서는 아래를 내려다보면 바다가 접시만 하게 보인다. 나도 거기서는 아래를 안 본다.”</p><p>“그래도 저는 괜찮아요.”</p><p>“내려올 때는 더 가파르다. 고삐를 놓치면 수레가 앞말을 밀어 버린다.”</p><p>“조심할게요.”</p><p>“그 말들은 나 말고 아무도 태워 본 적이 없다.” 헬리오스가 말했어요. “네가 가벼운 것을 말들이 먼저 안다. 저 수레는 제우스도 몰지 않는다.”</p><p>“제우스 신도 안 모는 수레라면 저는 더 몰아 보고 싶은데요.”</p><p>헬리오스는 아들의 어깨에 손을 얹었어요. 그러고는 곧 뗐지요. 그 어깨가 얼마나 좁은지 알아 버렸거든요.</p><p>파에톤은 물러서지 않았어요. 그 자리에 그대로 서 있었지요. 헬리오스는 아들의 얼굴을 오래 보았어요. 턱에 힘이 들어가 있었고, 두 주먹이 꽉 쥐어져 있었어요.</p><p>“내가 한 말 가운데 하나만 물릴 수 있다면, 나는 오늘 맹세한 말을 물리겠다.” 헬리오스가 말했어요.</p><p>파에톤은 그 말을 못 들은 척했어요. 벌써 수레가 있는 쪽으로 걸어가고 있었거든요.</p><h2>고삐를 넘겨받은 손</h2><p>새벽이 오고 있었어요. 동쪽 문이 조금씩 벌어졌어요. 말 네 마리가 끌려 나왔어요. 갈기가 불처럼 일렁이는 말이었어요. 말들은 코를 벌름거리며 수레 앞에 나란히 섰지요.</p><p>수레는 생각보다 작았어요. 파에톤은 그 앞에 서서 손잡이를 한 번 잡아 보았어요. 차가울 줄 알았는데 따뜻했지요.</p><p>헬리오스가 아들의 얼굴과 팔에 무언가를 발라 주었어요. 뜨거운 것을 막아 주는 것이라고 했어요. 그러고는 바닥에 내려놓았던 둥근 해를 아들의 머리에 얹었지요. 그것은 파에톤에게 조금 컸어요.</p><p>“고삐를 몸에 감지 마라. 채찍은 아예 쓰지 마라. 저 말들은 채찍을 모른다.” 헬리오스가 말했어요.</p><p>파에톤이 고개를 끄덕였어요.</p><p>“그리고 길에서 벗어나지 마라. 하늘에는 바퀴 자국이 나 있다. 그 자국만 따라가면 된다. 자국이 안 보이거든 말들이 아는 대로 두어라.”</p><p>파에톤이 또 고개를 끄덕였어요. 몇 번이나 끄덕였지요. 그런데 그 눈은 벌써 말들을 보고 있었어요.</p><p>“한 가지만 더.” 헬리오스가 아들의 손등에 자기 손을 얹었어요. “네가 달라고 한 것은 상으로 받는 선물이 아니다. 해내야 하는 일이다.”</p><p>문이 활짝 열렸어요. 수레가 나갔어요. 처음 얼마 동안은 아무 일도 없었어요. 파에톤은 웃었어요. 발밑으로 구름이 흘러가고, 저 아래 바다가 하얗게 반짝였지요. 한 번 뒤를 돌아보니 문 앞에 선 아버지가 점만 하게 작아져 있었어요.</p><p>아래에서는 사람들이 아침을 맞고 있었어요. 문을 열고 나오는 사람, 물을 길으러 가는 사람, 소를 몰고 나가는 사람. 파에톤은 그것을 다 내려다보았어요. 저 아이들도 지금 이걸 보고 있을까, 그런 생각을 했지요.</p><p>파에톤은 강을 하나하나 찾아보았어요. 물수제비를 뜨던 그 강이 어디쯤인지는 알 수 없었어요. 위에서 보니 강이 다 비슷하게 생겼거든요.</p><p>그런데 언덕이 시작되는 자리에서 말들이 고개를 들었어요. 네 마리가 거의 동시에요. 수레가 너무 가벼웠거든요.</p><p>말들은 그것을 곧바로 알았어요. 뒤에 매달린 것이 늘 매달리던 무게가 아니라는 것을요. 한 마리가 옆으로 빠졌어요. 그러자 나머지 셋이 따라 빠졌지요.</p><p>수레가 바퀴 자국에서 벗어났어요. 하늘길 옆은 아무것도 없었어요. 딛는 것도 없고 붙잡을 것도 없었지요. 바퀴가 헛돌면서 수레가 옆으로 기울었어요.</p><p>“이쪽이야! 바퀴 자국으로 돌아가!” 파에톤이 소리쳤어요.</p><p>말들은 듣지 않았어요. 그 소리를 알아듣는 말이 한 마리도 없었지요. 파에톤이 아는 말이라고는 마을에서 짐수레를 끌던 늙은 말 한 마리뿐이었거든요.</p><p>파에톤이 고삐를 당겼어요. 두 손으로 당겼어요. 말들은 더 빨라졌지요. 파에톤은 아버지가 하지 말라던 것을 하나씩 떠올려 보려고 했어요. 그런데 하나도 생각나지 않았어요.</p><p>수레가 위로 솟았어요. 별들이 가까워졌어요. 파에톤은 그때 아래를 내려다보고 말았어요. 바다가 접시만 했어요. 아버지가 보지 말라던 바로 그것이었지요.</p><p>손에서 힘이 빠졌어요. 고삐 한쪽이 손가락 사이로 미끄러졌어요. 머리에 얹혀 있던 둥근 해가 기울어졌어요. 파에톤이 한 손으로 그것을 붙잡았어요. 그러느라 남은 고삐마저 놓쳤지요.</p><p>수레가 이번에는 아래로 쏠렸어요. 땅이 가까워졌어요. 산꼭대기가 먼저 마르기 시작했어요. 풀이 눕고, 눕자마자 하얗게 셌지요.</p><p>강이 줄었어요. 어제까지 어른 허리에 오던 물이 무릎으로 내려갔어요. 사람들이 지붕 밑으로 들어가 문틈으로 밖을 내다보았어요. 낮인데 하늘이 너무 밝아서 아무것도 보이지 않았지요.</p><p>땅이 갈라진 틈으로 뜨거운 김이 올라왔어요. 갈라진 틈은 자꾸 늘어났고요.</p><p>“아버지!”</p><p>파에톤이 뒤를 돌아보며 불렀어요. 동쪽 문은 벌써 보이지 않았어요. 하늘 어느 쪽에도 아버지가 없었지요.</p><p>파에톤은 소리를 질렀어요. 말들의 이름을 몰라서 그냥 소리만 질렀어요. 아버지가 일러 줄 때 듣지 않았거든요.</p><h2>빛이 없는 하루</h2><p>제우스는 그날 산 끝에 나와 아래를 내려다보고 있었어요. 밤에 하던 버릇인데 그날은 낮이었지요. 연기가 여기저기서 올라왔어요. 한 군데가 아니었어요. 제우스는 오래 서 있지 않았어요.</p><p>손을 들어 번개를 쥐었어요. 그런데 던지려다가 팔이 아주 잠깐 멈췄지요. 저 위에 누가 타고 있는지 제우스도 알고 있었거든요.</p><p>그때 아래에서 연기가 또 한 줄기 올라왔어요. 제우스는 하늘을 가로질러 달아나는 수레를 향해 번개를 던졌어요.</p><p>번개가 수레에 닿았어요. 말 네 마리가 우뚝 섰어요. 수레가 멈췄지요. 파에톤은 하늘에서 미끄러졌어요. 별이 하나 떨어지는 것 같았어요. 아주 멀리, 어느 강물 위로요.</p><p>강가에 사는 님프들이 그 아이를 물에서 건져 강가에 눕혔어요. 파에톤은 다시 일어나지 않았어요.</p><p>“어느 집 아이일까?”</p><p>님프 하나가 물었어요. 아무도 대답하지 못했어요. 님프들은 그 자리에 돌을 하나 세웠어요. 이름은 새기지 않았어요. 그 아이가 누구의 아들인지 님프들도 몰랐거든요.</p><p>그날은 누구를 탓해야 할지 알기 어려운 날이었어요. 남쪽 어느 마당에서는 그 며칠 동안 문 앞에 사람이 서 있었어요. 아침마다 산모퉁이 쪽을 보면서요.</p><p>말 네 마리는 저희끼리 동쪽 문으로 돌아왔어요. 수레는 한쪽 바퀴가 깨져 있었지요. 헬리오스가 문 앞에 나와 그것을 받았어요. 말들의 목을 하나씩 쓸어 주고, 깨진 바퀴를 오래 들여다보았어요.</p><p>말 한 마리가 문 안으로 들어가지 않고 자꾸 뒤를 돌아보았어요. 헬리오스가 그 목을 한 번 더 쓸어 주었어요. 그러고는 문을 닫았지요.</p><p>그다음 날 아침, 동쪽 문이 열리지 않았어요. 닭이 울었는데 하늘은 그대로 검었어요. 사람들이 마당에 나와 서 있었어요. 한참을 기다렸지만 아무 일도 일어나지 않았지요.</p><p>낮이 와야 할 시간에 낮이 오지 않았어요. 밭에 나갔던 사람들이 되돌아왔어요. 소들은 외양간에서 나오려 하지 않았고요.</p><p>아이들이 어른들에게 물었어요. 오늘은 왜 아침이 안 오느냐고요. 어른들도 그런 것은 처음이라 대답을 못 했지요.</p><p>신들이 세상의 동쪽 끝으로 찾아왔어요. 문 앞에서 헬리오스를 불렀어요. 여러 번 불렀지요. 헬리오스는 안에 있었어요. 깨진 수레 옆에 앉아 있었지요. 옆에는 둥근 해가 굴러다니고 있었어요. 아무도 그것을 집어 들지 않았어요.</p><p>“아들을 잃은 날이니, 한 번은 해를 띄우지 않고 쉬어도 되지 않겠습니까?” 헬리오스가 문 안쪽에서 말했어요.</p><p>밖에서는 아무 대답이 없었어요. 누군가 문을 두드렸어요. 두드리다가 그만두었지요. 신들도 그 안에 대고 할 말을 찾지 못했어요.</p><p>“나는 하루도 늦은 적이 없습니다.” 헬리오스가 말했어요. “하루쯤은 늦어도 되지 않겠습니까?”</p><p>그날 세상은 캄캄했어요. 사람들은 불을 켜 놓고 그 앞에 모여 앉았어요. 낮에 불을 켜 본 것은 그날이 처음이었지요.</p><p>어떤 마을에서는 사람들이 언덕에 올라가 동쪽을 보고 섰어요. 아무것도 안 보이는데도 오래 서 있었지요. 바닷가에서는 배가 한 척도 나가지 않았어요. 어디가 동쪽인지 알 수 없었으니까요.</p><p>밤이 오는 것도 알 수 없었어요. 낮이 안 왔으니 밤이 온 것도 아니었지요. 사람들은 그냥 불 앞에 앉아 서로 얼굴만 보았어요.</p><p>그 캄캄한 낮에, 바다 건너 어느 성의 탑 꼭대기에서 아기 울음소리가 났어요. 울음소리는 오래 이어졌어요. 그런데 그 소리를 들은 사람은 몇 되지 않았지요.</p></article></noscript>
