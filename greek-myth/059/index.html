  <noscript><article class="ns-text"><h1>용이 끄는 수레</h1><h2>부두에 다시 건 판</h2><p>나무판이 도로 부두에 걸렸어요. 떠날 때 떼어 갔던 그 판이었지요. 이아손이 못을 두 개 박아 걸었어요. 판에는 이름이 쉰 개 적혀 있었고요.</p><p>사람들이 그 앞에 모였어요. 자기 식구 이름을 손가락으로 짚어 보는 사람도 있었고, 짚어 놓고 한참 손을 떼지 않는 사람도 있었어요.</p><p>“판에 적힌 사람이 다 돌아온 겁니까?” 누가 물었어요.</p><p>“쉰이 갔고 쉰이 왔습니다.” 이아손이 말했어요.</p><p>부두 끝에는 아르고호가 매여 있었어요. 밧줄을 두 번 감아 두었지요. 돛은 내려서 접어 두었고요. 메데이아는 배에서 제일 나중에 내렸어요. 발이 부두 널에 닿았을 때 널이 한 번 삐걱였어요. 사람들이 그 소리에 고개를 돌렸지요.</p><p>“저 여자가 이아손을 도왔다는 콜키스 공주래.”</p><p>말은 그렇게만 오갔어요. 아무도 메데이아 쪽으로 걸어오지는 않았고요. 부두에 나와 있던 사람 하나가 아들 이름을 손가락으로 짚고 있었어요. 이아손이 그 옆에 가서 섰지요.</p><p>“이 사람은 노를 아주 잘 저었습니다.”</p><p>“압니다. 어릴 때부터 그랬어요.”</p><p>그 사람은 손을 내리고 아들을 찾으러 갔어요. 이아손은 그날 양털을 궁으로 가져갔어요. 왕은 그것을 상 위에 펴 놓게 했어요. 낮이라 빛나지 않았지요. 그냥 털이 길고 촘촘한 양털로 보였어요.</p><p>“이게 그 황금 양털이냐?”</p><p>“네, 황금 양털입니다.”</p><p>왕은 손으로 그것을 한 번 쓸어 보았어요. 그러고는 손을 옷에 문질렀지요.</p><p>“밤에 보면 빛납니다.” 이아손이 말했어요.</p><p>“밤에는 자야지.”</p><p>왕은 자리에서 일어서지 않았어요. 자리를 내주겠다는 말도 하지 않았고요. 이아손은 그 앞에 서서 기다렸어요. 한참 기다렸지요. 창으로 들어온 빛이 바닥에서 한 뼘쯤 옮겨 갔어요.</p><p>“이제 그만 가 보아라.”</p><p>이아손은 궁 문을 나오면서 뒤를 한 번 돌아보았어요. 문지기가 문을 닫고 있었고요. 메데이아는 궁 밖에서 기다리고 있었어요. 담장 그늘에 서 있었지요. 이아손이 나오는 것을 보고 아무것도 묻지 않았어요. 둘은 나란히 부두까지 걸었어요. 걷는 동안 이아손이 두 번 걸음을 늦췄고, 메데이아가 두 번 다 맞춰 주었지요.</p><p>배에 탔던 사람들은 그해 안에 다 흩어졌어요. 어떤 사람은 사흘 만에 갔고, 어떤 사람은 겨울을 나고 갔지요. 가면서 다들 부두의 나무판 앞에 잠깐 섰다가 갔어요.</p><p>마지막으로 남은 사람이 이아손에게 물었어요.</p><p>“부두에 건 나무판은 어떻게 합니까?”</p><p>“떼어서 배에 싣고 가겠습니다.”</p><p>그렇게 나무판은 다시 배에 실렸어요. 이번에는 탄 사람이 둘뿐이었어요. 노가 쉰인데 저을 사람이 둘이라, 돛으로만 갔지요.</p><h2>바다 건너 도시</h2><p>배가 닿은 데는 바다 건너 다른 도시였어요. 언덕이 낮고 부두가 둘인 도시였지요. 아르고호는 그 도시 부두 끝에 매였어요. 나무판은 뱃전 안쪽에 세워 두었고요. 두 사람은 그 도시에서 부부가 되었어요. 부두에서 조금 떨어진 집에 살았어요. 마당이 있고 우물이 있는 집이었어요. 메데이아는 마당 한쪽에 마른 풀을 널어 말렸지요. 콜키스에서 가져온 나무 상자는 문간방에 두었어요.</p><p>처음 몇 해는 사람들이 문을 두드렸어요. 손을 데었다고, 아이가 밤에 기침을 한다고요. 메데이아는 상자를 열어 잎을 꺼내 주었어요. 값은 받지 않았고요. 고쳐 준 사람들은 고맙다고 했어요. 그런데 다음에 길에서 만나면 인사만 하고 지나갔지요. 마당 안까지 들어오는 사람은 없었어요.</p><p>어느 해 겨울에는 이웃집 아이가 밤새 열이 났어요. 그 집 사람이 문을 두드린 것은 자정이 넘어서였지요. 메데이아는 상자를 들고 건너갔어요. 메데이아는 그 아이 옆에 밤새 앉아 있었어요. 물수건을 갈고, 잎을 달인 물을 숟가락으로 조금씩 넣어 주었지요. 새벽에 아이가 눈을 떴어요.</p><p>“아이가 다 나았습니까?” 아이 어머니가 물었어요.</p><p>“오늘 하루는 더 봐야 합니다.”</p><p>아침에 그 집 사람들이 대문 밖까지 나와서 고맙다고 했어요. 대문 안으로 들어오라는 말은 하지 않았고요.</p><p>“저 집 안주인은 어디서 왔대?”</p><p>“바다 저쪽이래.”</p><p>“바다 저쪽 어디래?”</p><p>거기까지 아는 사람은 없었어요. 그 도시에서 콜키스까지 가 본 사람이 없었으니까요. 이아손은 그 도시의 궁에 자주 갔어요. 처음에는 부두 일을 맡았고, 나중에는 배 짓는 일을 맡았지요. 배 짓는 일은 이아손이 잘 아는 일이었어요. 널을 바닷물에 담갔다 써야 잘 휜다는 것도 알았고요.</p><p>그 도시 왕은 이아손을 아꼈어요. 상 옆자리에 앉히기도 했지요. 이아손이 아르고호 이야기를 하면 사람들이 조용해졌어요. 부딪히는 두 바위 이야기를 할 때가 제일 조용했고요. 이아손은 그 이야기를 여러 번 했어요. 할 때마다 조금씩 짧아졌지요. 나중에는 바위 이야기만 하고 밭 이야기는 하지 않았어요.</p><p>메데이아는 그 자리에 가지 않았어요. 처음에는 함께 갔는데, 사람들이 메데이아 쪽을 보다가 말을 멈추는 일이 두 번 있고 나서부터는 가지 않았지요.</p><p>이아손은 그 집에서 자는 날이 줄었어요. 배를 짓는 데 밤일이 있다고 했지요. 마당의 마른 풀은 그대로 널려 있었어요. 메데이아는 비가 오면 그것을 걷었다가 날이 개면 도로 널었고요. 여러 해가 그렇게 지났어요. 우물가 돌이 닳아서 가운데가 오목해질 만큼요.</p><h2>궁에서 나온 말</h2><p>어느 날 저녁에 이아손이 늦게 들어왔어요. 마당에 들어와 신을 벗다가 한 짝을 손에 든 채로 한참 서 있었지요. 메데이아가 부엌에서 나와 그것을 보았어요.</p><p>“밥 차릴까요?”</p><p>“먹고 왔습니다.”</p><p>이아손은 그날 밤 아무 말도 하지 않았어요. 이튿날 밤에도요. 사흘째 되는 날, 메데이아는 우물에서 그 말을 들었어요. 물을 긷던 사람들이 저희끼리 하는 말이었지요.</p><p>“왕이 딸을 시집보낸다더라.”</p><p>“누구한테 보낸대?”</p><p>“그 배 타고 왔다는 사람한테.”</p><p>메데이아는 두레박을 내렸어요. 두레박이 물에 닿는 소리가 났지요. 그러고는 줄을 잡고만 있었어요. 줄이 손에서 미끄러져 두레박이 우물 안으로 떨어졌어요.</p><p>그날 저녁에 메데이아가 먼저 물었어요.</p><p>“궁에서 무슨 말을 들으셨습니까?”</p><p>이아손은 손을 씻고 있었어요. 손을 다 씻고 나서 수건을 찾았지요. 수건은 늘 걸려 있던 자리에 걸려 있었고요.</p><p>“왕에게 딸이 하나 있습니다.”</p><p>“압니다.”</p><p>“그 딸과 혼인하면 이 도시를 물려주겠다고 했습니다.”</p><p>“그래서 뭐라고 하셨습니까?”</p><p>“아직 대답하지 않았습니다.”</p><p>“아직 대답하지 않았다고 하셨습니까?”</p><p>이아손은 수건을 접었어요. 접어서 도로 걸었지요. 접은 자리가 맞지 않아서 다시 접었고요.</p><p>“여기서 저는 아무것도 아닙니다. 배를 지어 주고 삯을 받는 사람입니다.”</p><p>“저도 여기서 아무것도 아닙니다.”</p><p>“당신은 저와 다릅니다.”</p><p>“무엇이 다릅니까?”</p><p>이아손은 대답하지 못했어요. 마당에서 바람이 한 번 지나갔어요. 널어 둔 풀이 조금 날렸지요. 메데이아가 그것을 주우러 나갔어요. 주워서 도로 널고, 돌을 하나 얹어 두었어요.</p><p>“당신은 이 도시 사람들 손을 고쳐 주지 않았습니까.” 이아손이 말했어요.</p><p>“그 사람들이 저를 뭐라고 부르는지 아십니까?”</p><p>이아손은 몰랐어요. 물어본 적이 없었으니까요.</p><p>“콜키스 여자라고 합니다.” 메데이아가 말했어요. “이름을 부르는 사람은 없고요.”</p><p>“배에서 하신 말씀을 기억하십니까.” 메데이아가 마당에서 말했어요.</p><p>“기억합니다.”</p><p>“제 자리는 당신 옆이라고 하셨지요.”</p><p>“그랬습니다.”</p><p>“그런데 그 옆자리는 이제 어디로 갔습니까?”</p><p>이아손은 문지방 안쪽에 서 있었어요. 마당으로 내려오지는 않았고요.</p><p>“저는 당신을 내보내지 않습니다. 이 집은 그대로 있을 겁니다. 우물도요.”</p><p>“이 집만 남겨 두시겠다고요?”</p><p>“제가 저 궁에 들어가면 당신도 편해집니다. 아무도 당신을 두고 뭐라 하지 못할 겁니다.”</p><p>메데이아는 마당 한가운데에 서 있었어요. 발밑에 마른 풀이 밟혔지요.</p><p>“쉬운 말이라도 해야 할 때가 있다고 하셨지요.”</p><p>“했습니다.”</p><p>“이번에 하신 말도 그런 쉬운 말입니까?”</p><p>묻지도 않고 혼자 정해 놓는 건, 신이 아니라 사람이라 해도 너무했지요. 이아손은 그날 저녁을 먹지 않았어요. 상은 차려져 있었고 수저도 놓여 있었지요. 그날 밤에 이아손은 집에서 자지 않았어요. 궁에서 부르는 사람이 왔다고 했지요.</p><p>메데이아는 문간방으로 갔어요. 나무 상자를 열었어요. 놋쇠 걸쇠가 손에 익어서 소리도 나지 않았지요. 상자 안에는 아직 여러 가지가 들어 있었어요. 마른 잎, 뿌리, 작은 병들이요. 그 가운데에는 콜키스에서 가져온 것도 있었어요. 여러 해가 지났는데 냄새는 그대로였지요.</p><p>메데이아는 그것을 하나씩 꺼내 마루에 늘어놓았어요. 늘어놓고 보니 마루 한쪽이 다 찼어요.</p><h2>상자를 비운 아침</h2><p>이튿날 아침에 메데이아는 그것을 나눠 주었어요. 문을 두드린 적이 있는 집을 하나씩 찾아갔지요. 손을 데었던 사람에게는 잎을, 아이가 기침하던 집에는 뿌리를요. 쓰는 법도 일러 주었어요. 두 번씩 일러 주었고요.</p><p>“어디 가십니까?” 한 사람이 물었어요.</p><p>“이건 두 번 달여야 합니다.” 메데이아가 말했어요.</p><p>그 집 사람들이 문간까지 따라 나왔어요. 그날은 다들 그랬지요. 밤에 기침하던 아이는 이제 키가 메데이아만 했어요. 그 아이가 뿌리를 받아 들고 이게 뭐냐고 물었지요.</p><p>“네가 아주 어릴 때 먹은 거란다.”</p><p>“그런데 이걸 왜 저한테 주세요?”</p><p>“너도 언젠가 아이를 볼 테니까.”</p><p>메데이아는 마지막으로 부두에 갔어요. 아르고호는 그 자리에 있었어요. 밧줄에 조개가 붙어 있었고요. 뱃전 안쪽에 세워 둔 나무판도 그대로였지요. 이름 쉰 개가 아직 읽혔어요. 메데이아는 그 판을 들여다보았어요. 거기에 메데이아의 이름은 없었어요. 그 판은 노를 저은 사람들의 판이었으니까요.</p><p>집에 돌아와 보니 이아손이 마당에 와 있었어요. 옷이 달라져 있었어요. 궁에서 지어 준 옷이었지요.</p><p>“혼인은 내일입니다.” 이아손이 말했어요.</p><p>“압니다.”</p><p>메데이아는 마당 한쪽에 널어 둔 풀을 걷었어요. 다 걷고 나서 널었던 자리를 손으로 한 번 쓸었지요. 그 자리에 풀 자국이 남아 있었어요.</p><p>“저는 그 밭에 들어간 사람을 걸어 나오게 했습니다.” 메데이아가 말했어요.</p><p>이아손은 아무 말도 하지 않았어요.</p><p>“저는 눈꺼풀 없는 것을 재웠고요.”</p><p>“압니다.”</p><p>“다 아신다고요?”</p><p>메데이아는 그러고는 더 말하지 않았어요. 이아손도 마당에서 바로 나가지는 못하고 한참 서 있었지요. 그날 밤 메데이아는 마당에 나와 앉아 있었어요. 궁 쪽에 불이 여러 개 켜져 있었어요. 잔치 채비를 하느라 밤일을 하는 것이었지요. 부두 쪽은 캄캄했고요.</p><p>메데이아는 그 두 쪽을 번갈아 보았어요. 그러다 자리에서 일어나 문간방으로 들어갔지요. 등잔은 켜지 않았고요. 그 방에서 낮은 소리가 한참 났어요. 숲에서 눈꺼풀 없는 것을 재우던 그 소리였지요.</p><p>이튿날 아침은 맑았어요. 궁 쪽에서 북소리가 났어요. 도시 사람들이 다 그쪽으로 갔지요. 부두에도 사람이 없었고요.</p><p>메데이아는 마당에 서 있었어요. 자루 하나를 들고 있었지요. 나무 상자는 비어서 두고 가기로 했어요. 자루 안에는 세 가지만 들어 있었어요. 겉옷 하나와, 마른 잎 한 줌과, 놋쇠 걸쇠 하나였지요. 걸쇠는 상자에서 떼어 낸 것이었어요.</p><p>문간방 문은 열어 두었어요. 상자 뚜껑도 열어 둔 채였고요. 누가 들어와도 가져갈 것이 없었으니까요. 그때 마당에 그늘이 졌어요. 구름이 지나간 것이 아니었어요. 하늘에서 무언가가 내려오고 있었거든요.</p><p>수레였어요. 바퀴가 둘 달린 수레였는데, 끄는 것이 말이 아니었어요. 목이 길고 몸이 굵은 것 둘이 앞에 매여 있었어요. 날개는 접혀 있었고, 발은 땅에 닿지 않았어요. 그 수레가 어디에서 왔는지는 이 이야기가 말해 주지 않아요. 메데이아도 그것을 보고 놀라지 않았고요.</p><p>이아손이 마당으로 뛰어 들어왔어요. 북소리가 나는 쪽에서 온 것이었어요. 숨이 차 있었지요.</p><p>“거기 서십시오.”</p><p>메데이아는 벌써 수레에 올라가 있었어요. 난간을 한 손으로 잡고요. 배 난간을 잡던 그 손이었어요.</p><p>“어디로 가십니까?”</p><p>“말은 쉽습니다.” 메데이아가 말했어요.</p><p>그게 마지막 말이었어요. 이아손이 무슨 말을 하려고 입을 열었는데, 그때는 벌써 수레가 마당 위로 떠올라 있었지요.</p><p>메데이아는 용이 끄는 수레를 타고 하늘 저편으로 떠났어요. 다른 이야기에서는 더 슬픈 결말도 전해져요.</p><h2>부두 끝에 매인 배</h2><p>이아손은 마당에 한참 서 있었어요. 풀을 널었던 자리에 자국이 아직 있었지요. 문간방 상자는 뚜껑이 열린 채였고, 안은 비어 있었어요. 궁에서 사람이 왔어요. 다들 기다린다고요. 이아손은 알겠다고 했어요. 그러고는 궁 쪽으로 가지 않고 부두 쪽으로 걸었지요.</p><p>아르고호는 그 자리에 있었어요. 밧줄에 조개가 붙어 있었고, 널 사이가 벌어져 있었어요. 뱃전에는 새똥이 말라붙어 있었고요. 아이들이 그 배 위에서 놀다가 이아손을 보고 내려갔어요. 이아손은 배에 올라갔어요. 널이 발밑에서 물렁했어요. 왼쪽 셋째 자리에 앉아 보았지요. 노가 아직 그 자리에 걸려 있었어요. 손잡이가 반들반들했고요.</p><p>이아손은 뱃머리 쪽도 보았어요. 배를 지을 때 끼워 넣은 나무 조각이 거기 그대로 있었어요. 이아손은 그 앞에 서서 기다렸어요. 나무 조각은 아무 말도 하지 않았어요. 오래 기다려도요.</p><p>아까 내려갔던 아이 하나가 다시 올라왔어요.</p><p>“이 배는 어디까지 갔댔어요?”</p><p>“해가 뜨는 쪽 끝까지요.”</p><p>아이는 그 말을 알아듣지 못한 얼굴로 뱃전을 타고 도로 내려갔어요.</p><p>뱃전 안쪽에 세워 둔 나무판이 한쪽으로 기울어 있었어요. 못 하나가 빠져 있었거든요. 이아손은 그것을 바로 세우려고 손을 댔다가 그냥 두었어요. 판에는 이름이 쉰 개 적혀 있었어요. 이아손은 그 가운데에서 자기 이름을 찾았어요. 찾는 데 한참 걸렸지요. 그 판에 이름을 하나하나 적어 넣은 사람이 이아손이었는데도요.</p><p>이아손은 그 이름 위에 손가락을 얹었어요. 그러고는 오래 떼지 않았어요. 부두 저쪽 궁에서는 아직 북소리가 났고요.</p></article></noscript>
