  <noscript><article class="ns-text"><h1>올림포스산의 살림</h1><h2>자리를 나누는 날</h2><p>왕좌에 앉은 다음 날 아침, 신들이 모두 산꼭대기로 모였어요. 티폰 앞에서 달아났던 이들도 슬그머니 자리를 찾아 앉았지요. 아무도 그 이야기를 꺼내지 않았어요.</p><p>산꼭대기에는 돌을 깎아 만든 자리가 여럿 놓여 있었어요. 아직 주인이 정해지지 않은 자리들이었지요. 제우스는 왕좌에 앉지 않고 그 앞에 서 있었어요.</p><p>“오늘부터 각자 맡을 것을 정하려고 해요.”</p><p>제우스가 말했어요.</p><p>“왕이 다 정하는 게 아니에요. 하고 싶은 일을 먼저 말해 보세요.”</p><p>처음에는 아무도 입을 열지 않았어요. 열 해 동안 싸우기만 하던 이들이라, 무엇을 하고 싶으냐는 질문 자체가 낯설었거든요.</p><p>그러다 하나씩 손을 들기 시작했어요. 바다를 맡은 형이 물고기와 뱃길을 함께 맡겠다고 했어요. 곡식을 좋아하는 누나는 들판과 씨앗을 맡겠다고 했지요. 저승을 맡은 형은 이미 아래로 내려간 뒤라 그 자리에 없었어요. 대신 누군가 그 몫을 대신 말해 주었어요.</p><p>말이 오갈수록 목소리가 커졌고, 나중에는 서로 웃기도 했어요. 열 해 만에 처음 있는 일이었어요. 그렇게 하루 만에 세상의 살림이 나뉘었어요. 하늘과 날씨, 바다와 강, 들판과 곡식, 물가와 바람, 그리고 저승까지요.</p><p>그런데 아직 아무도 맡지 않은 것이 하나 있었어요. 그것은 불이었어요. 정확히 말하면 집 한가운데에서 타는 불, 화로였지요.</p><p>화로는 대단해 보이는 자리가 아니었어요. 번개처럼 번쩍이지도 않고, 파도처럼 힘차지도 않으니까요. 그저 꺼지지 않게 지켜보는 일이 전부였어요.</p><p>불은 늘 그 자리에 있어서 아무도 고마운 줄 모르는 것이기도 했어요. 신들이 하나둘 서로를 돌아보았어요.</p><p>“제가 하겠습니다.”</p><p>헤스티아가 조용히 말했어요. 헤스티아는 여섯 남매의 맏이였어요. 가장 먼저 삼켜져서 가장 오래 갇혀 있던 사람이기도 했지요. 그런데도 헤스티아는 한 번도 그 이야기를 꺼내지 않았어요.</p><p>“누나, 화로를 지키는 건 너무 작은 일이에요.”</p><p>제우스가 말했어요. 헤스티아는 고개를 저었어요.</p><p>“작지 않아. 불이 꺼지면 집이 집이 아니게 되거든.”</p><p>그날부터 헤스티아는 올림포스산 한가운데에 화로를 놓고 그 앞에 앉았어요. 곁에는 마른 나뭇가지를 늘 가지런히 쌓아 두었지요. 밤이면 그 불빛이 기둥 사이로 길게 뻗어 나갔어요. 아침에도 밤에도 불이 꺼지지 않았어요. 신들은 밖에 나갔다가 돌아오면 그 불빛을 보고 아, 집에 왔구나 하고 생각했지요.</p><p>올림포스산은 그렇게 조금씩 집이 되어 갔어요. 하얀 기둥이 늘어나고, 그 사이로 웃음소리가 오갔어요.</p><h2>왕과 왕비</h2><p>그 무렵 제우스는 헤라를 자주 찾아갔어요. 헤라는 여섯 남매 가운데 셋째였어요. 아버지 앞에서 처음 걸어 나오던 날, 턱을 들고 왕좌를 똑바로 바라보던 바로 그 사람이었지요.</p><p>헤라는 그날 정해진 것을 하나도 빠뜨리지 않고 돌판에 새겼어요. 누가 무엇을 맡기로 했는지, 어느 날 다시 모이기로 했는지까지요.</p><p>다음 모임에 하나가 늦게 왔어요. 헤라는 아무 말도 하지 않았어요. 다만 그 이름 옆에 금을 하나 그었지요. 그 돌판은 그 뒤로도 오래 그 자리에 있었어요.</p><p>헤라는 아무 데나 앉지 않았어요. 늘 문이 보이는 자리에 앉았지요. 제우스는 그 앞에 서서 그날 있었던 일을 이야기하곤 했어요. 헤라는 듣는 동안 한 번도 딴 데를 보지 않았어요.</p><p>제우스가 무슨 말을 걸면 헤라는 늘 짧게 대답했어요. 그러면서도 자리를 뜨지는 않았어요.</p><p>“왜 자꾸 나한테 오는 거야?”</p><p>“이 산에서 나를 제일 무섭게 보는 사람이라서요.”</p><p>“나를 무섭게 보는 사람이 좋아?”</p><p>“왕 곁에는 나를 그렇게 엄하게 봐 주는 사람이 하나는 있어야 할 것 같아서요.”</p><p>헤라는 그 말에 아무 대꾸도 하지 않았어요. 그런데 다음 날에도 제우스가 오자 자리를 하나 더 놓아 두었지요. 그 자리는 그 뒤로 늘 그대로 있었어요.</p><p>그러다 두 사람은 부부가 되었어요. 둘은 남매였지만, 세상이 막 시작되던 그 시절 신들에게는 그런 일이 이상하지 않았어요.</p><p>혼인날 올림포스산은 온통 꽃으로 덮였어요. 땅에서 저절로 꽃이 올라왔거든요. 신들이 모두 모여 축하했고, 헤스티아의 화로에는 그날따라 불이 더 크게 타올랐어요. 산 아래 골짜기에서도 그날은 하루 종일 무언가 울리는 소리가 들렸다고 해요.</p><p>그렇게 제우스는 왕이 되고 헤라는 왕비가 되었어요. 왕비가 된 뒤로 헤라는 새벽에 가장 먼저 일어났어요. 누가 어느 자리에 앉는지, 누가 무엇을 맡았는지 헤라는 전부 기억하고 있었지요.</p><p>헤라는 올림포스산의 살림을 하나하나 챙겼어요. 약속한 날짜도, 지켜야 할 것들도 전부 기억했지요. 신들 사이에 다툼이 생기면 누가 옳은지는 대개 헤라 앞에서 정해졌어요.</p><p>한번은 어느 신이 헤라의 자리에 잘못 앉은 적이 있었어요. 헤라는 아무 말도 하지 않았어요. 다만 그 신이 일어설 때까지 문간에 서 있었지요.</p><p>제우스는 헤라에게 살림을 맡기고 산을 자주 비웠어요.</p><p>그해 봄, 헤라가 아기를 낳았어요. 산 아래 들판이 유난히 푸르른 봄이었어요. 올림포스산 전체가 들썩였어요. 왕과 왕비의 첫아이였으니까요. 신들이 저마다 선물을 들고 줄을 섰어요. 선물이 문 앞에 수북이 쌓였지요.</p><p>“아기 이름은 정하셨습니까?”</p><p>헤라는 아직이라고만 했어요. 봄바람이 기둥 사이로 들어왔어요. 헤스티아는 화로 앞에 자리를 하나 더 만들어 두었고요.</p><p>헤라는 아기를 안고 문 앞으로 나갔어요. 밖에는 신들이 잔뜩 모여 있었어요. 그때 누군가 아기의 다리를 보았어요.</p><h2>다리를 저는 아기</h2><p>아기의 한쪽 다리가 조금 굽어 있었어요. 그것뿐이었어요. 아기는 건강했고, 잘 먹었고, 울음소리도 우렁찼어요. 다만 두 다리의 모양이 서로 달랐지요. 아기는 손가락이 열 개였고 발가락도 열 개였어요. 어느 하나 모자란 데가 없었지요.</p><p>누군가 작게 숨을 들이쉬는 소리가 났어요. 모여 있던 신들이 조용해졌어요. 누구도 큰 소리로 말하지는 않았어요. 그런데 조용해지는 것만으로도 충분히 들리는 말이 있어요.</p><p>헤라의 얼굴이 굳었어요. 헤라는 아기를 감싼 천을 조금 끌어올렸어요. 그러고는 아기를 안고 안으로 들어갔어요. 그러고는 문을 닫았어요. 그날 저녁 잔치는 열리지 않았어요.</p><p>헤라는 밤새 아기를 내려다보았어요. 아기는 어머니의 손가락을 꼭 쥐고 잠들어 있었어요. 쥐는 힘이 여느 아기보다 훨씬 셌지요.</p><p>헤라는 문 쪽을 몇 번이나 돌아보았어요. 밖에서는 아직 발소리가 오갔어요. 누군가 낮게 웃는 소리도 한 번 났지요. 헤라는 아기를 감싼 천을 다시 여몄어요.</p><p>저 아래에서는 화롯불만 조용히 타고 있었어요. 그것 말고는 불빛이 없었지요. 밤이 아주 길었어요. 헤라는 한 번도 눕지 않았어요. 아기는 아무것도 모르고 잘 자고 있었어요. 그건 아기의 잘못이 아니었어요.</p><p>새벽이 되었을 때, 헤라는 아기를 안고 산 끝으로 걸어갔어요. 그 새벽에는 안개가 짙어서 발밑도 잘 보이지 않았어요. 올림포스산 끝에는 구름이 걸려 있었어요. 그 아래로는 아무것도 보이지 않았지요.</p><p>구름은 아무 소리도 내지 않았어요. 헤라는 그 자리에 오래 서 있었어요. 아기가 잠결에 몸을 뒤척였어요. 헤라의 손이 한 번 떨렸어요.</p><p>헤라가 아주 작게 물었어요.</p><p>“너는 왜 하필 나한테 왔니?”</p><p>아기는 대답 대신 어머니의 손가락을 더 꼭 쥐었어요. 헤라는 아기의 이마에 손을 얹었다가 뗐어요. 그리고 헤라는 아기를 산 아래로 내려보냈어요. 그건 정말 너무한 일이었어요.</p><p>아기가 눈을 떴는지 감고 있었는지는 아무도 몰라요. 아기는 구름을 지나 아래로, 아래로 떨어졌어요. 하루가 걸렸는지 이틀이 걸렸는지 아무도 몰라요. 다만 아주 오래 떨어졌다고 전해져요.</p><p>헤라는 그날 아무것도 먹지 않았어요. 그 자리에서 돌아선 뒤로, 뒤도 돌아보지 않았어요. 그런데 그날 이후로 헤라는 산 끝 쪽으로는 다시 걸어가지 않았어요. 아무리 급한 일이 있어도 늘 빙 둘러 갔지요.</p><p>제우스는 뒤늦게 그 일을 알았어요. 아무 말도 하지 않았어요. 무슨 말을 해야 할지 몰랐던 거예요. 어떤 어른들은 그렇게, 아무 말도 하지 않는 것으로 그냥 지나가 버려요.</p><p>그날 화롯불이 유난히 작게 타올랐다고, 나중에 누군가 말했어요. 올림포스산에서 그 아기 이야기는 곧 아무도 하지 않는 이야기가 되었어요.</p><h2>바닷가에서 자란 아이</h2><p>아기는 바다에 떨어졌어요. 풍덩, 하는 소리와 함께 물기둥이 솟았어요. 그런데 아기는 가라앉지 않았어요. 바다에 사는 님프들이 그 소리를 듣고 헤엄쳐 왔거든요.</p><p>님프들은 아기를 건져 올렸어요. 짠물이 흘러내리는 얼굴로도 아기는 울지 않았어요. 아기는 짠물을 조금 먹고 캑캑거리더니, 곧 눈을 뜨고 님프들을 빤히 올려다보았어요. 그러고는 손을 뻗어 님프의 목걸이를 잡았어요.</p><p>님프들은 아기를 바닷가 동굴로 데려갔어요. 마른 해초를 두툼하게 깔아 자리를 만들고 번갈아 가며 안아 주었지요. 파도 소리가 바로 앞에서 들리는 굴이었어요. 아기는 거기에서 자랐어요. 동굴 앞에는 늘 젖은 발자국이 나 있었어요.</p><p>그 아기의 이름은 헤파이스토스였어요. 헤파이스토스는 걸음이 느렸어요. 한쪽 다리를 조금 끌었거든요. 대신 손이 아주 빨랐어요. 님프들이 눈을 떼면 어느새 무언가를 만들고 있었지요.</p><p>바닷가에는 파도가 실어다 놓은 것들이 늘 널려 있었어요. 헤파이스토스에게는 그게 다 재료였지요.</p><p>조개껍데기를 이어 붙여 그릇을 만들었어요. 산호 조각으로 목걸이를 엮었어요. 파도에 밀려온 나뭇조각을 깎아 작은 배를 만들기도 했어요. 손끝에서 나온 것들이 어찌나 야무진지, 님프들이 서로 갖겠다고 다툴 정도였지요.</p><p>헤파이스토스는 그럴 때마다 웃었어요.</p><p>헤파이스토스는 아무것도 묻지 않는 아이였어요. 자기가 어디에서 왔는지, 어머니가 누구인지 한 번도 묻지 않았어요. 님프들은 그 아이에게 궁금한 게 없나 보다고 생각했어요. 그런데 헤파이스토스는 밤마다 하늘을 아주 오래 올려다보았어요. 님프들은 그게 오히려 마음에 걸렸어요.</p><p>어느 날 저녁, 가장 나이 많은 님프가 조심스럽게 말을 꺼냈어요.</p><p>“너는 저 위 올림포스산에서 왔단다.”</p><p>헤파이스토스는 하던 일을 멈추지 않았어요. 조개껍데기를 다듬던 손도 그대로였지요.</p><p>“알아요.”</p><p>“……그걸 어떻게 알았니?”</p><p>“떨어지면서 봤거든요. 구름 위쪽이 아주 환했어요.”</p><p>파도 소리가 두 사람 사이를 채웠어요. 님프는 무슨 말을 더 해야 할지 몰라서 그냥 옆에 앉아 있었어요. 헤파이스토스는 한참 뒤에 이렇게 덧붙였어요.</p><p>“그런데요, 여기가 훨씬 좋아요. 여기에는 바다가 있고, 나무가 떠내려오고, 뜨거운 돌도 있거든요.”</p><p>헤파이스토스가 고개를 들고 씩 웃었어요. 손끝에 굳은살이 잔뜩 박여 있었어요.</p><p>그러고는 다시 손을 놀렸어요. 밤이 깊도록 손을 멈추지 않았어요. 님프는 그 옆에서 조용히 등불을 밝혀 주었어요. 그날 헤파이스토스가 만들던 것은 조개껍데기 그릇이 아니었어요. 돌을 쌓아 만든, 조금 이상하게 생긴 상자였어요.</p><p>그 상자는 화덕이었어요.</p><p>헤파이스토스는 바닷가에서 뜨거운 돌이 나오는 자리를 알고 있었어요. 그 근처에서는 모래도 따뜻하고, 물이 김을 뿜었지요. 헤파이스토스는 그 자리에 돌을 쌓았어요. 돌 사이에는 진흙을 발라 틈을 메웠지요. 님프들은 그 이상하게 생긴 상자를 신기하게 바라보았어요.</p><p>님프들이 왜 그러느냐고 물으면 헤파이스토스는 이렇게 대답했어요.</p><p>“조개껍데기는 쉽게 깨져요. 안 깨지는 걸 만들고 싶어요.”</p><p>헤파이스토스는 여러 번 실패했어요. 쌓은 돌이 무너지고, 불이 붙지 않고, 겨우 붙은 불이 금세 꺼졌어요. 열 번쯤 무너뜨리고 다시 쌓았지요. 실패할 때마다 헤파이스토스는 무너진 자리를 오래 들여다보았어요. 화를 내는 대신에요.</p><p>그러면서 헤파이스토스는 조금씩 알아 갔어요. 어느 돌이 열을 견디는지, 바람이 어느 쪽에서 들어와야 불이 잘 붙는지, 숯을 얼마나 넣어야 하는지를요.</p><p>그동안 계절이 몇 번이나 바뀌었어요. 헤파이스토스도 자랐어요. 어깨가 벌어지고 팔이 굵어졌어요. 걸음은 여전히 느렸지만, 무거운 돌을 옮기는 데에는 아무 문제가 없었어요.</p><p>마지막으로 헤파이스토스는 커다란 돌 하나를 골라 평평하게 다듬었어요. 그 위에 쇠를 올려놓고 두드릴 참이었지요.</p><p>그리고 어느 밤, 준비가 다 끝났어요. 밤바다는 아주 잔잔했어요. 헤파이스토스는 화덕 앞에 앉았어요. 손이 조금 떨렸어요. 여러 해를 기다린 밤이었으니까요.</p><p>숯을 넣고, 마른 나뭇가지를 얹고, 부싯돌을 쳤어요. 한 번, 두 번. 세 번째에 작은 불씨가 옮겨붙었어요.</p><p>불이 살아났어요. 동굴 안이 대낮처럼 환해졌어요. 헤파이스토스는 그 앞에 가만히 앉아 있었어요. 얼굴이 붉게 물들었어요. 굴 안쪽까지 따뜻해졌어요. 파도 소리 위로 불 타는 소리가 겹쳐졌지요.</p><p>그러고는 쇳조각 하나를 집게로 집어 불 속에 넣었어요. 쇠가 천천히 붉어졌어요. 꺼냈을 때는 저녁 해 같은 빛깔이었어요.</p><p>님프들이 동굴 입구에 모여 그 모습을 지켜보았어요. 헤파이스토스가 망치를 들었어요. 첫 번째 망치질에 불꽃이 사방으로 튀었어요.</p><p>쨍. 그 소리가 동굴 벽에 부딪혔다가 바다 위로 퍼져 나갔어요. 파도를 타고 멀리, 아주 멀리요. 쇠가 조금씩 모양을 바꾸기 시작했어요. 불꽃이 어둠 속에서 별처럼 흩어졌어요.</p><p>두 번째 망치질. 쨍. 세 번째. 쨍. 그 밤에 올림포스산에서는 신들이 잠들어 있었어요. 그런데 누군가 눈을 떴어요. 아주 멀리서, 아주 작게, 규칙적으로 무언가를 두드리는 소리가 들려왔거든요.</p><p>화로 앞에 앉아 있던 헤스티아가 고개를 들었어요. 그리고 소리가 나는 쪽을 오래 바라보았어요.</p></article></noscript>
