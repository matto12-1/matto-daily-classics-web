  <noscript><article class="ns-text"><h1>황금 사과 세 알</h1><h2>마당에 그은 금</h2><p>마당 흙에 금이 하나 그어져 있었어요. 막대기로 그은 금이었지요. 그 금에서 마을 어귀 느티나무까지 갔다가 돌아오는 것이 오늘 달릴 길이었어요.</p><p>아탈란테는 그 금 앞에 앉아 신끈을 매고 있었어요. 손바닥에 굳은살이 두 군데 박여 있었지요. 배에서 노를 젓던 자리였어요.</p><p>아침 흙은 아직 축축했어요. 신을 디디면 자국이 깊게 났지요. 담장 밖에 사람들이 서 있었어요. 오늘도 하나가 달린다고 해서 모인 것이었지요.</p><p>담장은 사람 가슴께까지 오는 돌담이었어요. 앞줄은 아이들이 차지했지요. 아이들은 담 위에 팔을 걸치고 턱을 얹었어요.</p><p>아탈란테의 아버지는 마루에 앉아 있었어요. 무릎에 나무 그릇을 얹어 놓고요. 그릇 안에는 콩이 들어 있었어요. 한 사람이 달릴 때마다 콩을 하나씩 꺼내 마루에 놓았지요. 마루에 놓인 콩은 벌써 여럿이었어요.</p><p>“오늘 달리는 사람이 몇째냐?” 아버지가 물었어요.</p><p>“열두째입니다.” 아탈란테가 말했어요.</p><p>아버지가 아탈란테를 혼인시키려고 한 것은 아탈란테가 배에서 돌아온 다음 해부터였어요. 사람이 오면 마루에 앉히고 이야기를 했지요. 아탈란테는 그때마다 마당으로 나갔어요.</p><p>그러다 어느 날 아탈란테가 막대기를 들고 마당에 금을 하나 그었어요.</p><p>“저를 이기는 사람과 혼인하겠습니다.”</p><p>“무엇으로 이기느냐?”</p><p>“달리기로요.”</p><p>“그 사람이 지면 어떻게 하느냐?”</p><p>“지면 다시는 이 집에 오지 않기로 하지요.”</p><p>아버지는 그 자리에서 아무 말도 하지 않았어요. 대신 이튿날 나무 그릇을 하나 꺼내 왔지요.</p><p>그날부터 사람들이 왔어요. 발이 빠르다는 사람들이었어요. 옆 마을에서도 오고, 사흘 길을 걸어서 오기도 했지요. 오는 사람마다 마당의 금을 한 번 내려다보고 나서 신을 고쳐 신었어요.</p><p>지금까지 달린 사람은 열하나였어요. 열하나가 다 졌지요. 어떤 사람은 느티나무까지 가지도 못했고, 어떤 사람은 돌아오다가 걸음을 늦추고 말았어요.</p><p>가장 가까이 왔던 사람은 일곱째였어요. 그 사람은 느티나무를 아탈란테와 나란히 돌았지요. 그런데 돌아오는 길에서 벌어졌어요. 아탈란테는 돌고 나서 빨라지는 사람이었으니까요.</p><p>아탈란테는 아침마다 혼자 그 길을 달렸어요. 해가 뜨기 전에요. 마을 사람들이 일어나 나와 보면 마당 흙에 발자국이 벌써 두 줄 나 있었지요.</p><p>열두 번째 사람이 금 앞에 섰어요. 아탈란테는 그 옆에 섰고요. 아버지가 그릇을 무릎에서 내려놓았어요. 열두 번째 사람은 소를 모는 사람이었어요. 아침에 소를 몰고 왔다가 담장에 매어 놓고 금 앞에 선 것이었지요.</p><p>“제가 이기면 어떻게 됩니까?”</p><p>“저와 혼인합니다.”</p><p>“지면요?”</p><p>“다시 오지 않으시면 됩니다.”</p><p>“자, 달려라.” 아버지가 말했어요.</p><p>둘이 뛰었어요. 처음 열 걸음은 나란했어요. 그다음부터는 나란하지 않았고요. 아탈란테가 느티나무를 돌아 나올 때, 그 사람은 아직 나무에 닿지도 못했어요.</p><p>아탈란테는 금을 넘고 나서 숨을 두 번 골랐어요. 그게 다였지요. 아버지가 콩을 하나 더 마루에 놓았어요. 콩을 세어 보지는 않았어요. 마루에 놓인 콩을 보면 알 수 있었으니까요.</p><p>진 사람은 담장 쪽으로 걸어갔어요. 걸어가면서 한 번 뒤를 돌아보았고요. 아버지가 마루에서 아탈란테를 불렀어요.</p><p>“열둘이면 이 마을에서 발 빠르다는 사람은 다 온 셈이다.”</p><p>“그러면 이제 제 혼인 이야기는 그만두시겠습니까?”</p><p>“혼인을 안 하면 너는 뭘 하며 살겠느냐?”</p><p>아탈란테는 마루 끝에 앉았어요. 신끈을 풀지는 않았고요.</p><p>“배에서는 아무도 그걸 묻지 않았습니다.”</p><p>“그 배는 이제 돌아왔고, 탔던 사람들도 다 흩어지지 않았느냐?”</p><p>“돌아왔지요.”</p><p>아탈란테는 마당 저쪽을 보았어요. 흙에 그은 금이 그대로 있었어요. 발자국이 여럿 지나가서 가운데가 흐려져 있었지요. 아탈란테는 일어나서 그 흐려진 자리를 막대기로 다시 그었어요.</p><h2>담장 밖에서 본 것</h2><p>그 담장 밖에 젊은이가 하나 서 있었어요. 그날 처음 온 사람이었어요. 이름을 적으러 온 것이었지요. 그런데 적지 않았어요. 아탈란테가 달리는 것을 보고 나서요.</p><p>젊은이는 담장에 손을 얹고 한참 서 있었어요. 손을 뗐을 때 담장 흙이 손바닥에 묻어 있었지요. 젊은이는 그것을 털지 않고 그냥 걸었어요.</p><p>젊은이는 마을로 내려가면서 사람들에게 물었어요. 저 집 딸이 누구냐고요.</p><p>“바다 끝까지 갔다 온 배에 탔던 사람이오.”</p><p>“그 배에 여자가 탔습니까?”</p><p>“쉰 자리 가운데 한 자리가 저 사람 자리였답디다.”</p><p>젊은이는 그 말을 듣고 걸음이 느려졌어요. 젊은이는 그날 하루를 그 길에서 다 보냈어요. 해가 담장 그림자를 마당 안까지 밀어 넣을 때까지요.</p><p>돌아가는 길에 작은 신전이 하나 있었어요. 바닷가로 내려가는 길목이었지요. 문 앞에 조개껍데기가 쌓여 있었어요. 오가는 사람들이 하나씩 놓고 간 것이었어요.</p><p>젊은이는 그 앞에 앉았어요. 앉아서 한참 아무 말도 하지 않았어요. 그러다 이렇게 말했지요.</p><p>“저는 저 사람보다 빠를 수가 없습니다.”</p><p>그 말이 전부였어요. 무엇을 해 달라는 말은 하지 않았어요. 젊은이는 조개껍데기를 하나 놓고 일어섰지요.</p><p>아프로디테는 그 신전에 자주 가지 않았어요. 바닷가로 내려가는 길목이라 사람이 많지 않았거든요. 그래도 그 앞에 놓인 조개껍데기는 하나씩 다 세어 두었지요.</p><h2>올림포스산의 마당</h2><p>올림포스산 마당에서 아프로디테가 그 말을 들었어요. 마당 한쪽에는 나무가 한 그루 서 있었어요. 잎이 두껍고 열매가 굵은 나무였지요. 그 열매는 익으면 금빛이 되었어요.</p><p>에로스가 그 나무 밑에 앉아 있었어요. 손에 공을 하나 들고요.</p><p>“그 금 공은 언제 받았니?” 아프로디테가 물었어요.</p><p>“받은 지 오래됐어요.”</p><p>에로스는 그 공을 마당 저쪽으로 던졌어요. 공이 지나간 자리에 빛이 한 줄 남았지요. 에로스가 걸어가서 공을 주워 왔고요.</p><p>“콜키스에 다녀온 값이에요.” 에로스가 말했어요.</p><p>“기억하고 있었구나.”</p><p>“저는 다 기억해요.”</p><p>아프로디테는 나무 쪽을 보았어요. 그러고는 난간에서 아래를 내려다보았어요. 마을이 손톱만 했어요. 마당에 그은 금은 보이지도 않았지요. 그래도 어디쯤인지는 알았어요.</p><p>“저 나무에서 금빛 열매를 세 개만 따 오렴.”</p><p>“그걸로 뭐 하시게요?”</p><p>“저 아래 마을에 달리기에서 지게 생긴 사람이 있구나. 그 사람한테 줄 거란다.”</p><p>에로스는 나무에 올라갔어요. 열매 세 개를 땄지요. 딴 자리에서 흰 진이 조금 나왔어요. 에로스는 그것을 두 손으로 받쳐 들고 내려왔어요.</p><p>“이건 공보다 무거워요.”</p><p>“그래도 잘 구른단다.”</p><p>“왜 그 사람을 도우세요?” 에로스가 물었어요.</p><p>“그 사람이 아무것도 달라고 하지 않아서란다.”</p><p>“달라고 하지 않았는데도 도와주세요?”</p><p>“달라고 하지 않는 소원은 잘 안 들린단다. 오늘은 들렸구나.”</p><p>“그 사람은 왜 여태 이름을 안 적었대요?”</p><p>“이름을 적고 달리면 질 테니까.”</p><p>에로스는 그 세 알을 마당에 한 번 굴려 보았어요. 정말 잘 굴렀어요. 돌 위에서도 튀지 않고 굴렀지요. 굴러가다가 저 혼자 멎었고요.</p><p>“이걸 그 사람한테 주면, 그 사람이 이기는 거예요?”</p><p>“그건 다른 사람이 정한단다.”</p><p>에로스는 무슨 말인지 몰라서 다시 물으려다가 그만두었어요. 어머니가 벌써 난간 쪽으로 걸어가고 있었거든요.</p><p>그날 저녁 신전 앞에 무언가가 놓여 있었어요. 젊은이가 놓고 간 조개껍데기 위에요. 사과 세 알이었어요. 금빛이었고, 손에 드니 차가웠지요.</p><p>젊은이는 그것을 옷자락에 싸서 들고 갔어요. 가면서 하나를 길에 굴려 보았어요. 사과는 잘 굴렀어요. 자갈길에서도 튀지 않고 굴렀지요.</p><p>젊은이는 그날 밤에 잠을 자지 않았어요. 사과 세 알을 나란히 놓고 앉아 있었지요. 새벽에 하나를 집어 들었다가 도로 놓았어요.</p><p>밤새 바깥에서 개가 두 번 짖었어요. 젊은이는 그때마다 사과 위에 손을 얹었지요.</p><p>젊은이는 그 세 알을 어디에 넣고 달릴지 정해야 했어요. 옷자락 안에 넣어 보고, 허리띠에 매어 보고, 손에 들어 보았지요. 손에 들면 팔을 흔들 수가 없었어요. 팔을 못 흔들면 발이 늦고요. 그래서 옷자락으로 정했어요.</p><p>이튿날 아침에 젊은이가 아탈란테의 집 마당에 왔어요. 아버지는 그릇을 무릎에 얹고 있었지요. 젊은이는 마당에 들어서기 전에 옷자락을 한 번 여며 보았어요. 사과가 셋 다 그 안에 있었지요. 하나씩 만져 보고 나서 손을 내렸어요.</p><p>“이름을 적겠습니다.”</p><p>“어제 담장 밖에 서 있던 사람이지?”</p><p>“그렇습니다.”</p><p>“어제는 왜 이름을 안 적었나?”</p><p>“어제는 이길 방법이 없었습니다.”</p><p>“오늘은 방법이 있나?”</p><p>젊은이는 대답하지 않았어요. 옷자락 안에서 무언가가 서로 부딪는 소리가 났고요. 아탈란테가 마당으로 나왔어요. 젊은이를 한 번 보았지요.</p><p>“발이 빠르십니까?”</p><p>“아닙니다.”</p><p>“그런데도 달리겠습니까?”</p><p>“달리겠습니다.”</p><p>아탈란테는 금 앞으로 걸어갔어요. 걸어가면서 신끈을 한 번 당겨 보았어요.</p><h2>세 번 구른 것</h2><p>아버지가 손을 들었어요. 손을 내리자 둘이 뛰었어요. 젊은이는 처음부터 힘껏 달렸어요. 아탈란테는 그러지 않았고요. 아탈란테는 늘 느티나무를 돌고 나서부터 빨라졌거든요.</p><p>그런데도 열 걸음 만에 나란해졌어요. 스무 걸음에서는 아탈란테가 앞이었고요. 젊은이는 숨소리가 벌써 컸어요. 아탈란테는 숨소리가 나지 않았고요.</p><p>그때 앞쪽 땅으로 금빛이 하나 굴러갔어요. 젊은이가 옷자락에서 꺼내 던진 것이었어요. 사과는 아탈란테 앞을 가로질러 굴러가다가 길가 풀 앞에서 멎었어요.</p><p>아탈란테가 걸음을 멈췄어요. 사과를 주웠지요. 주워서 손에 들고 다시 뛰었어요. 멈췄다가 다시 달리기까지는 얼마 걸리지 않았어요. 그런데 그동안 젊은이가 앞으로 나갔지요.</p><p>느티나무를 도는 데서 아탈란테가 다시 앞이 되었어요. 사과 하나를 한 손에 든 채로요. 담장 밖에서 누가 소리를 질렀어요.</p><p>두 번째 사과는 아까보다 멀리 굴러갔어요. 길 밖으로요. 아탈란테는 그쪽으로 세 걸음 나갔다가 그것을 주웠어요. 이번에는 손이 하나밖에 남지 않았지요.</p><p>담장 밖 사람들이 이번에는 소리를 내지 않았어요. 다들 서서 보기만 했지요. 아버지도 마루에서 일어나 마당 끝까지 나와 있었어요.</p><p>아탈란테는 사과 두 알을 한쪽 팔에 안고 달렸어요. 팔이 몸에 붙으니 걸음이 아까 같지 않았지요. 그때 담장 밖에서 누가 소리쳤어요.</p><p>“그냥 두고 가요!”</p><p>아탈란테에게 한 말인지 젊은이에게 한 말인지는 알 수 없었어요. 젊은이는 뒤를 보지 않고 달렸어요. 뒤를 보면 발이 느려지니까요.</p><p>세 번째는 마지막 곧은 길에서 굴렀어요. 마당의 금이 저쪽에 보이는 데였지요. 젊은이는 그 사과를 아주 세게 던졌어요. 사과가 길 밖으로 굴러가서 도랑 가까이에서 멎었어요.</p><p>아탈란테가 그것을 보았어요. 보고도 두 걸음을 더 달렸어요. 그러고는 멈췄지요. 젊은이는 그때 한 번 뒤를 보았어요. 아탈란테가 길 밖에 서 있었지요.</p><p>담장 밖에서 소리가 났어요. 여럿이 한꺼번에 내는 소리였어요. 아탈란테는 도랑 쪽으로 걸어갔어요. 뛰지 않고 걸어갔어요. 사과를 주울 때는 두 손을 다 썼어요. 앞의 두 알을 먼저 겨드랑이에 끼워야 했으니까요.</p><h2>금 위에 선 사람</h2><p>젊은이가 금을 넘었어요. 넘고 나서 무릎에 손을 짚고 한참 숨을 골랐지요. 아탈란테가 금을 넘은 것은 그다음이었어요. 세 걸음쯤 뒤였어요.</p><p>마당이 조용해졌어요. 아버지가 콩을 하나 꺼내려다가 그릇에 도로 넣었지요. 아탈란테는 금 위에 서 있었어요. 손에 사과 세 알이 있었고요. 하나는 오른손에, 둘은 왼팔에 안겨 있었어요.</p><p>“제가 이겼습니다.” 젊은이가 말했어요.</p><p>“네, 당신이 이겼습니다.”</p><p>아탈란테는 그러고 나서 젊은이를 보았어요. 오래 보았어요. 웃는 것 같기도 하고 아닌 것 같기도 한 얼굴이었지요.</p><p>“이 사과는 어디서 났습니까?”</p><p>“바닷가 길목 신전 앞, 조개껍데기 위에 놓여 있었습니다.”</p><p>“누가 놓았습니까?”</p><p>젊은이는 이번에도 대답하지 못했어요. 정말로 몰랐거든요.</p><p>아탈란테는 사과 한 알을 젊은이 쪽으로 내밀었어요. 젊은이가 손을 내밀자, 아탈란테는 그 손 위에 놓지 않고 도로 거두었지요.</p><p>“세 번 다 주울 수도 있었고, 세 번 다 지나칠 수도 있었습니다.”</p><p>“그런데 왜 세 번 다 주웠습니까?”</p><p>“주울지 말지는 제가 정한 겁니다.”</p><p>젊은이는 아무 말도 하지 않았어요. 손은 아직 내민 채였고요. 젊은이는 그제야 옷자락을 폈어요. 안에는 아무것도 없었어요. 세 알이 다 나갔으니까요. 젊은이는 그 빈 옷자락을 손으로 한 번 쓸었어요.</p><p>담장 밖에 있던 사람 하나가 아탈란테에게 물었어요.</p><p>“사과는 왜 주웠습니까?”</p><p>“제 앞으로 굴러왔으니까요.”</p><p>“그냥 지나가면 되지 않습니까?”</p><p>“금빛 사과가 굴러오는데 그냥 지나가 보신 적 있습니까?”</p><p>그 사람은 대답하지 못했어요. 아탈란테는 담장 밖으로 걸어 나갔어요. 아까 사과가 멎었던 자리를 발로 짚어 보았지요. 풀이 눌린 자국이 아직 있었어요.</p><p>담장 밖 사람들이 하나둘 흩어졌어요. 아버지는 마루에서 일어났어요. 그릇을 들고 안으로 들어가기 전에 그것을 한 번 내려다보았지요. 콩이 아직 여럿 남아 있었어요. 아버지는 그것을 세어 보지는 않았고요. 마루에 내놓은 콩도 그대로 두고 들어갔어요.</p><p>담장 밖에는 아이 둘이 아직 남아 있었어요. 담 위에 팔을 걸친 채로요. 아탈란테가 그쪽을 보자 둘 다 내려가서 뛰어갔지요.</p><p>아탈란테는 사과 세 알을 마루 끝에 나란히 놓았어요. 셋 다 흙이 조금씩 묻어 있었지요. 아탈란테는 그것을 닦지 않았어요.</p><p>그러고는 마루 끝에 앉아 그것을 한참 보았어요. 셋이 다 같아 보였는데, 들어 보면 무게가 조금씩 달랐지요.</p><p>그날 저녁에 아탈란테는 느티나무까지 혼자 한 번 더 달렸어요. 아무도 보지 않는 데서요. 돌아왔을 때는 숨이 차 있었어요. 아침에도 그랬고요.</p><p>그러고는 마당의 금을 발로 문질러 지웠어요. 다 지우지는 않았어요. 느티나무 쪽으로 향한 한쪽 끝이 조금 남았지요.</p></article></noscript>
