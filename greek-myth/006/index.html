        <div class="recap"><h3>지난 이야기</h3><ol><li>열 해가 지나도 싸움이 끝나지 않자, 제우스는 땅속 깊은 곳으로 내려가 오래 갇혀 있던 여섯 거인을 풀어 주었어요.</li><li>대장장이 삼 형제는 삼지창과 보이지 않는 투구, 그리고 손에 쥘 수 있는 번개를 만들어 주었지요.</li><li>아주 오래전 물러나던 우라노스는 크로노스에게, 너도 언젠가 네 아들의 손에 그 자리를 빼앗기게 될 거라고 말했어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>티탄의 끝</h1><h2>번개가 떨어진 날</h2><p>들판에는 아직 서리가 앉아 있었어요. 티탄들 쪽 진영에서는 새벽까지 불이 꺼지지 않았지요. 그 불빛은 건너편에서도 다 보였어요.</p><p>해가 뜨자 두 산 사이의 들판에 다시 양쪽이 마주 섰어요. 티탄들은 여느 때처럼 앞줄부터 천천히 걸어 나왔어요. 열 해 동안 늘 그래 왔으니까요. 오늘도 밀고 밀리다가 저녁이면 물러나겠지, 하고 다들 생각했어요.</p><p>그런데 그날은 달랐어요. 올림포스산 쪽에서 젊은이 하나가 앞으로 걸어 나왔어요. 손에 든 것에서 파란빛이 새어 나오고 있었지요. 그것을 본 티탄들의 걸음이 저절로 느려졌어요.</p><p>제우스가 팔을 뒤로 젖혔다가 앞으로 뻗었어요. 번개가 날아갔어요.</p><p>무엇을 맞혔는지는 아무도 보지 못했어요. 그저 온 세상이 하얘졌다가, 잠시 뒤 눈앞이 돌아왔을 때 들판 한가운데에 시커먼 자국이 길게 나 있었을 뿐이에요. 흙에서 김이 올라왔어요. 아무도 소리를 내지 않았어요.</p><p>두 번째 번개가 날아갔어요. 세 번째도요. 제우스는 번개를 던질 때마다 손이 떨리는 것을 느꼈어요. 무서워서가 아니었어요. 그 물건이 너무 뜨거웠거든요. 한 번 던지고 나면 손바닥이 한참 얼얼했어요.</p><p>하늘이 몇 번이나 낮과 밤을 뒤바꾸었어요. 천둥이 잇달아 울려서 나중에는 소리와 소리 사이에 틈이 없어졌어요. 열 해 동안 한 발짝도 물러나지 않던 티탄들이 그날 처음으로 뒷걸음질을 쳤어요.</p><p>그때 산기슭에서 다른 소리가 났어요. 백수거인 삼 형제가 걸어 나오고 있었어요. 밤새 쌓아 둔 바위 무더기가 산기슭에 언덕처럼 솟아 있었지요. 삼 형제는 그 앞에 서서 백 개의 손을 한꺼번에 펼쳤어요.</p><p>“바위를 던져라.”</p><p>가운데 선 이가 그렇게 말하자, 삼백 개의 손이 한꺼번에 움직였어요. 바위들이 하늘을 새까맣게 덮으며 날아갔어요. 그 그림자가 들판 위로 구름처럼 지나갔지요. 바위가 떨어질 때마다 땅이 통째로 흔들렸어요.</p><p>제우스가 던진 번개와 백수거인이 던진 바위가 하늘 한가운데에서 엇갈렸어요. 들판은 온통 흙먼지로 뒤덮였지요. 티탄들은 서로의 이름을 크게 불러 댔지만, 그 소리마저 곧 바위 떨어지는 소리에 묻혔어요.</p><p>티탄들은 팔로 머리를 가리며 물러났어요. 앞줄이 무너지자 뒷줄이 밀렸고, 뒷줄이 밀리자 진영 전체가 흐트러졌어요.</p><p>포세이돈이 삼지창으로 땅을 내리쳤어요. 들판이 쩍 갈라지면서 골이 생겼어요. 티탄들은 그 골을 건널 수 없었어요.</p><p>하데스는 아무 데도 보이지 않았어요. 그런데 티탄들의 무기가 자꾸 사라졌어요. 창을 짚고 있다가 문득 손이 허전해지는 거예요. 보이지 않는 투구를 쓴 이가 그 사이를 걸어 다니고 있었으니까요.</p><p>그날은 저녁이 되어도 어느 쪽도 물러나지 않았어요. 열 해 동안 꿈쩍도 하지 않던 싸움이, 하루 만에 기울기 시작했어요.</p><h2>끝까지 버틴 티탄</h2><p>그런 가운데에도 물러나지 않는 이가 하나 있었어요. 어깨가 유난히 넓고 머리가 짧게 곱슬거리는 티탄이었어요. 볕에 오래 그을린 얼굴에 흉터가 몇 개 나 있었지요. 이름은 아틀라스였어요. 티탄들이 산을 옮길 일이 있으면 늘 부르던 이였지요.</p><p>아틀라스는 바위가 쏟아지는 한가운데에 버티고 서 있었어요. 날아오는 바위를 두 손으로 쳐 냈어요. 어깨로 받아 내기도 했어요. 아틀라스의 발이 땅에 반쯤 묻혔어요. 그래도 뒤로는 한 발짝도 가지 않았어요. 뒤로 물러나던 티탄들이 아틀라스를 보고 다시 자리를 잡았어요.</p><p>제우스는 번개를 던지려다가 손을 내렸어요. 바위 한가운데에 버티고 선 티탄을 한참 보다가 말했어요.</p><p>“저 사람은 왜 저렇게까지 버티지?”</p><p>포세이돈이 어깨를 으쓱했어요.</p><p>“지고 있는 걸 저도 알 텐데.”</p><p>아틀라스는 알고 있었어요. 알면서도 버텼어요. 뒤에 있는 이들이 물러날 시간을 벌어 주고 있었거든요.</p><p>어깨에 바위에 맞은 자국이 잔뜩 남았지만 아틀라스는 소리를 지르지 않았어요. 그날 해가 질 때까지 아틀라스는 그 자리를 지켰어요. 어깨가 다 헐고 무릎이 꺾였을 때에야 붙잡혔지요.</p><p>싸움은 그다음 날 저녁에 끝났어요. 티탄들의 진영은 텅 비었어요. 부러진 창이 들판에 널려 있었고, 여기저기에서 아직 연기가 올라왔어요. 그날 많은 이가 쓰러졌어요. 이긴 쪽도 진 쪽도 그 들판을 오래 바라보았지요.</p><p>저녁 해가 부러진 창끝마다 붉게 걸렸어요. 제우스는 건너편 산으로 올라갔어요. 혼자였어요. 아무도 데려가지 않았어요. 이 이야기는 둘이서만 해야 한다고 생각했거든요.</p><p>산꼭대기 바위에 크로노스가 앉아 있었어요. 왕관도 갑옷도 없었어요. 그저 나이 든 티탄 하나가 무릎에 팔을 얹고 앉아 있을 뿐이었지요.</p><p>크로노스의 손등에 오래된 흉터가 보였어요. 아주 오래전 낫을 쥐던 날 생긴 것이었지요. 두 사람은 한동안 아무 말도 하지 않았어요. 아래쪽 들판에서 바람이 올라와 두 사람 사이를 지나갔어요.</p><p>“아버지.”</p><p>“그렇게 부르지 마라. 나는 너를 아들로 여긴 적이 없다.”</p><p>“저를 아들로 여기지 않은 건 아버지 사정이고요. 저한테는 아버지예요.”</p><p>크로노스가 짧게 웃었어요. 그러고는 하늘을 올려다보았어요. 아주 오래전, 그 하늘에서 목소리 하나가 내려왔던 날을 떠올렸겠지요.</p><p>“내 아버지가 나한테 뭐라고 했는지 아느냐?”</p><p>“아버지도 아들에게 자리를 빼앗길 거라고 하셨다지요. 어머니께 들었어요.”</p><p>“그 말이 오늘 그대로 이루어졌구나.”</p><p>제우스는 대답하지 않았어요. 크로노스가 천천히 일어섰어요.</p><p>“나를 어떻게 할 셈이냐?”</p><p>크로노스가 물었어요. 제우스는 잠깐 생각하다가 말했어요.</p><p>“아버지가 끝내 열어 주지 않았던 땅속 깊은 곳, 타르타로스로 가시게 될 거예요. 다만 사슬은 채우지 않겠어요.”</p><p>크로노스는 그 말을 듣고 눈을 잠깐 감았어요.</p><p>“사슬을 채우지 않는 건 벌이냐, 봐주는 것이냐?”</p><p>“그건 아버지가 정하실 일이지요.”</p><p>크로노스는 더 묻지 않았어요. 그러고는 산을 내려갔어요. 걸음이 느렸지만 누구의 부축도 받지 않았어요. 물러나는 뒷모습을 제우스는 끝까지 지켜보았어요.</p><p>크로노스와 함께 싸운 티탄들도 땅속 깊은 곳으로 내려갔어요. 그 문은 아주 무거워서 닫히는 데 한나절이 걸렸어요. 제우스는 문이 닫히는 소리를 끝까지 들었어요. 그 소리가 오래도록 귀에 남았지요. 그 문 앞을 백수거인 삼 형제가 지키기로 했어요. 자기들이 갇혀 있던 그 자리를 이제는 자기들이 지키게 된 거예요. 삼 형제는 아무 불평도 하지 않았어요. 다만 문 앞에 앉아 백 개의 손을 무릎에 가지런히 올려놓았지요.</p><p>산 아래에서는 아무 소리도 나지 않았어요. 누구도 환호하지 않았어요. 이겼는데도 그랬어요. 그날 저녁은 유난히 길었어요.</p><p>모든 티탄이 벌을 받은 것은 아니었어요. 처음부터 싸움에 나서지 않은 이들도 있었거든요. 그들은 제 자리에서 하던 일을 계속했어요.</p><p>그렇지만 아틀라스는 달랐어요.</p><h2>하늘을 떠받치는 벌</h2><p>아틀라스는 끝까지 버틴 이였어요. 그래서 벌도 가장 무거웠어요. 제우스는 아틀라스를 세상의 서쪽 끝으로 데려갔어요. 거기는 땅이 끝나고 하늘이 시작되는 곳이었어요. 마른 바람과 붉은 흙 말고는 아무것도 없는 자리였지요.</p><p>“여기서 하늘을 떠받치고 있어라.”</p><p>아틀라스는 아무 말도 하지 않았어요. 다만 두 팔을 들어 올렸어요. 하늘이 그 어깨 위로 내려앉았어요. 별이 촘촘히 박힌, 끝이 보이지 않는 무게였지요. 아틀라스의 무릎이 한 번 크게 꺾였다가 다시 펴졌어요.</p><p>발밑의 돌이 아틀라스의 무게에 눌려 조금씩 갈라졌어요.</p><p>“언제까지 떠받치고 있어야 하나요?”</p><p>아틀라스가 물었어요. 목소리가 눌려 있었어요. 제우스는 대답하지 않았어요. 그건 대답할 수 없는 질문이었으니까요.</p><p>그 뒤로 아틀라스는 그 자리에 서 있게 되었어요. 낮에도 밤에도요. 별들이 어깨를 지나 하나씩 서쪽으로 넘어갔어요. 그건 정말 무거운 벌이었지요.</p><p>제우스는 돌아서면서 한 번 뒤를 보았어요. 그 뒤로 아주 오랜 세월이 흘러도 그 자리는 그대로였어요.</p><p>지나가는 사람이 있으면 아틀라스는 가끔 말을 걸었어요. 세상은 요즘 어떠냐고요. 그러면서도 어깨는 한 번도 내려놓지 않았어요. 하늘이 내려앉으면 그 아래 있는 것들이 어떻게 되는지 아틀라스는 알고 있었거든요.</p><p>싸움이 끝나자 세상이 아주 조용해졌어요. 무너진 산이 그대로 있었고, 갈라진 들판도 그대로 있었어요. 강물은 아직 제 길을 찾지 못한 채 엉뚱한 데로 흐르고 있었지요. 누군가 이 모든 것을 다시 제자리에 놓아야 했어요.</p><p>여섯은 무너진 산과 갈라진 들판을 며칠 동안 함께 돌아보았어요. 어디부터 손을 대야 할지 아무도 몰랐어요. 누나 하나가 곡식 씨앗을 한 줌 쥐고 흙을 만져 보기도 했지요.</p><p>올림포스산에 여섯 남매가 모였어요. 여섯 남매의 그림자가 불빛에 길게 흔들렸어요.</p><p>“싸움이 끝났으니 이제 어떻게 하지?”</p><p>포세이돈이 물었어요. 아무도 얼른 대답하지 못했어요. 열 해 동안 싸우기만 해서, 싸움이 끝난 다음을 생각해 본 사람이 없었거든요.</p><p>제우스가 오래 생각한 사람처럼 천천히 말했어요.</p><p>“세상은 아주 넓어요. 하늘도 있고 바다도 있고, 죽은 이들이 가는 자리도 있어요. 한 사람이 다 맡을 수는 없어요.”</p><p>“그럼 나누자는 거야?” 포세이돈이 물었어요.</p><p>“나눠야 해요. 한 사람이 다 쥐면, 우리가 아버지랑 다를 게 없어지니까요.”</p><p>그 말에 아무도 대꾸하지 않았어요. 다들 같은 얼굴을 떠올리고 있었거든요. 밤이 깊도록 이야기가 이어졌어요. 산 위로 별이 하나씩 돋았어요.</p><p>“그럼 누가 무엇을 맡지?”</p><p>하데스가 처음으로 입을 열었어요. 그게 그날의 가장 어려운 질문이었어요.</p><p>“나는 화롯가에 있을게. 하늘도 바다도 땅 아래 저승도 내 자리는 아니야.” 맏누나가 말했어요. 다른 두 누나도 고개를 끄덕였어요.</p><h2>투구 속의 제비</h2><p>누가 무엇을 맡을지 정하는 방법을 놓고 세 형제는 한참 이야기했어요. 열 해를 나란히 싸웠지만 이런 이야기는 처음이었어요. 잘못 정하면 오늘 밤에 새 싸움이 시작될 수도 있었지요.</p><p>나이순으로 하자는 말이 나왔어요. 그러면 가장 어린 제우스가 마지막이 되지요. 힘센 순서로 하자는 말도 나왔어요. 그러면 번개를 가진 이가 가장 먼저가 되고요. 어느 쪽도 세 사람 모두를 만족시키지 못했어요.</p><p>한참 뒤에 하데스가 말했어요.</p><p>“제비를 뽑자.”</p><p>“제비를 뽑자고?”</p><p>“그러면 아무도 억울할 게 없잖아. 아무도 정한 게 아니니까.”</p><p>포세이돈이 먼저 고개를 끄덕였어요. 제우스도 끄덕였어요. 정하고 나니 오히려 아무도 얼른 움직이지 못했어요.</p><p>세 형제는 돌 세 개를 골랐어요. 하나에는 물결무늬를, 하나에는 구름무늬를, 하나에는 아무 무늬도 새기지 않았어요. 아무 무늬도 없는 것이 땅 아래 자리였지요.</p><p>무늬를 새기는 데에도 한참이 걸렸어요. 서로 자기가 새기겠다고 했거든요.</p><p>하데스가 쓰고 있던 투구를 벗어 가운데에 놓았어요. 안쪽에 아직 온기가 남아 있었지요. 세 사람의 그림자가 그 위에서 겹쳤어요. 돌 세 개를 그 안에 넣고 흔들었어요. 달그락거리는 소리가 유난히 크게 들렸어요.</p><p>“누가 먼저 뽑지?”</p><p>“내가 먼저 뽑을게.”</p><p>포세이돈이 손을 넣었어요. 셋 다 숨을 죽였어요. 세상이 어떻게 나뉠지가 그 손끝에 달려 있었으니까요. 포세이돈이 꺼낸 돌에는 물결무늬가 있었어요.</p><p>포세이돈은 돌을 하늘 높이 던졌다가 다시 받았어요. 그러고는 씩 웃었어요. 사실 그 말고는 아무도 바다를 원하지 않았을 거예요. 포세이돈은 갇혀 있던 시절부터 파도 소리를 그리워했으니까요.</p><p>다음은 제우스였어요. 제우스가 꺼낸 돌에는 구름무늬가 새겨져 있었어요. 하늘이었지요. 제우스는 자기 돌을 오래 들여다보았어요. 하늘이라는 것이 어떤 자리인지 아직 잘 몰랐거든요.</p><p>그러면 남은 하나는 뻔했어요. 저승은 조용하고 넓고 어두운 곳이었어요. 아무도 가 본 적이 없는 곳이기도 했지요.</p><p>하데스는 투구에 손을 넣지도 않았어요. 그냥 투구를 기울여 마지막 돌을 손바닥에 굴려 냈어요. 아무 무늬도 없는 돌이었어요. 하데스는 그것을 한참 들여다보았어요.</p><p>“저승이 싫으면 다시 뽑자.”</p><p>제우스가 말했어요. 하데스는 고개를 저었어요.</p><p>“아니. 한번 뽑은 제비는 되돌리지 않아.”</p><p>그러고는 돌을 주머니에 넣었어요.</p><p>“대신 하나만 기억해 둬. 나는 저승을 맡는 거지, 저승으로 쫓겨나는 게 아니야.”</p><p>“알아요.” 제우스가 말했어요.</p><p>포세이돈이 뭐라고 말하려다가 그냥 입을 다물었어요. 하데스는 그날 저녁 조용히 길을 떠났어요. 배웅하는 사람은 두 형제뿐이었어요. 하데스는 뒤를 돌아보지 않았어요.</p><p>그날 밤 올림포스산에서는 잔치가 열렸어요.</p><p>열 해 만에 처음으로 아무도 무기를 들지 않은 밤이었어요. 불을 크게 피우고, 상을 길게 차렸어요. 누나들이 상 위에 그해 처음 여문 곡식을 올렸어요. 백수거인 삼 형제도 문 앞을 잠깐 비우고 올라와 자리 한쪽을 차지했지요.</p><p>밤이 깊을수록 불빛이 산을 붉게 물들였어요. 누군가 노래를 부르기 시작했어요. 가락이 서툴렀지만 아무도 그만두라고 하지 않았어요.</p><p>포세이돈은 삼지창을 세워 두고 바다 이야기를 늘어놓았어요. 아직 가 보지도 않은 바다 밑에 무엇이 있을지 벌써 다 아는 것처럼 말했어요. 웃음소리가 산 아래까지 내려갔어요.</p><p>제우스는 불에서 조금 떨어진 데 앉아 있었어요. 손에 쥔 번개가 이따금 파랗게 깜빡였어요. 쥐는 건 쉽고 내려놓기는 어렵다던 말이 자꾸 떠올랐지요.</p><p>그때 산 아래 어둠 속에 누군가 서 있는 것이 보였어요. 가이아였어요. 가이아는 잔치 쪽으로 올라오지 않았어요. 대신 발밑을 내려다보고 있었어요. 아주 오래, 아무 말도 없이요. 그 아래 땅속 깊은 곳에는 이제 자기 아들과 아이들이 갇혀 있었어요.</p><p>가이아는 한 번 손을 들어 흙을 쓸어 보았어요. 그러고는 어둠 속으로 걸어 들어갔어요. 제우스가 자리에서 일어섰어요. 그런데 다시 보았을 때 그 자리에는 아무도 없었어요.</p></article></noscript>
