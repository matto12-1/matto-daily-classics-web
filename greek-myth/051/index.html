  <noscript><article class="ns-text"><h1>아홉 해마다 떠나는 배</h1><h2>이름을 넣는 항아리</h2><p>사람들이 조가비를 하나씩 손에 쥐고 광장을 가로질러 줄을 서 있었어요. 줄 맨 앞에 큰 항아리가 하나 놓여 있었지요. 어른 허리께까지 오는 붉은 항아리였어요. 평소에는 신전 안쪽에 들어가 있는 것인데, 그날은 밖에 나와 있었어요. 항아리 옆에는 상이 하나 놓여 있었고요.</p><p>손에 쥔 것은 바닷가에서 주워 온 조개껍데기였어요. 조가비마다 이름이 하나씩 새겨져 있었지요. 열여섯 살에서 스무 살 사이인 사람의 이름만요.</p><p>조가비에 이름을 새기는 일은 며칠 전부터 했어요. 집집마다 돌아다니며 나이를 물었고, 나이가 맞으면 그 자리에서 새겼지요. 숨긴 집도 있었어요. 숨겨도 이웃이 알았고요. 그해 항아리에 들어간 조가비는 이백스물여섯 개였어요.</p><p>줄은 조금씩 앞으로 갔어요. 자기 조가비를 항아리에 넣고 나면 뒤로 물러섰고요. 줄에서는 아무도 서로 이야기를 하지 않았어요.</p><p>테세우스는 광장 가장자리에 서서 그것을 보았어요. 성문을 지나온 지 반나절밖에 되지 않았을 때였지요.</p><p>“사람들이 줄을 서서 무엇을 하는 겁니까?” 테세우스가 옆에 선 사람에게 물었어요.</p><p>“크레타섬에 보낼 젊은이를 뽑는 겁니다. 아홉 해에 한 번 하지요.”</p><p>그 사람은 그러고 나서 묻지도 않은 이야기를 이어서 했어요. 오래 참고 있던 이야기 같았지요. 옛날에 크레타섬의 왕에게 아들이 하나 있었어요. 그 아들이 아테네에 왔다가 돌아가지 못했지요. 무슨 일이 있었는지는 아테네 사람들끼리도 말이 달랐어요.</p><p>이듬해 봄에 크레타섬의 배가 아테네 항구를 가득 메웠어요. 싸움은 길지 않았고요. 그때 정해진 것이 이거예요. 아홉 해마다 젊은이 열넷을 크레타섬으로 보낸다.</p><p>“일곱과 일곱입니다. 남자 일곱, 여자 일곱.” 그 사람이 말했어요.</p><p>“크레타섬에 가면 어떻게 됩니까?”</p><p>그 사람은 그 물음에는 목소리를 낮췄어요.</p><p>“크레타섬 궁 아래에 돌로 지은 길이 있답니다. 한번 들어가면 나오는 길을 못 찾는대요. 그 한가운데에 무언가가 있고요.”</p><p>“그 한가운데에 무엇이 있습니까?”</p><p>“거기까지는 아무도 모릅니다. 돌아온 사람이 없으니까요.”</p><p>그때 항아리 앞에 선 사람이 손을 넣어 조가비를 하나 꺼냈어요. 그러고는 새겨진 이름을 소리 내어 읽었지요.</p><p>이름을 읽는 사람은 목소리를 크게 내지 않았어요. 그런데도 광장 끝까지 다 들렸지요. 그만큼 조용했으니까요.</p><p>광장 어디쯤에서 무언가 떨어지는 소리가 났어요. 물동이였어요. 물이 돌바닥에 넓게 퍼졌고요. 불린 사람은 그 자리에서 앞으로 나와야 했어요. 나온 사람들은 상 옆에 한 줄로 섰지요. 열넷 가운데 둘은 서로 아는 사이였어요. 손을 잡았다가 곧 놓았고요.</p><p>제일 나중에 불린 이름은 아주 어린 목소리에 걸렸어요. 열여섯이 갓 된 아이였거든요. 그 아이는 앞으로 나오면서 자기 이름을 한 번 되물었어요. 잘못 들었기를 바랐나 봐요.</p><p>이름은 열넷째까지 불렸어요. 마지막 이름이 불리고 나서도 사람들은 한참 흩어지지 않았어요.</p><h2>칼을 알아본 사람</h2><p>궁은 광장에서 언덕을 조금 올라간 데에 있었어요. 문 앞에 사람이 여럿 서 있었지요. 왕을 만나겠다는 사람은 다 저녁때 오라는 대답을 들었어요.</p><p>테세우스는 저녁때까지 기다렸어요. 아이게우스는 늙어 있었어요. 열여섯 해 전보다 훨씬요. 눈이 침침해서 사람을 알아보려면 가까이 와야 했지요. 테세우스가 상 앞에 서자 아이게우스는 눈을 조금 찡그렸어요.</p><p>“무슨 일로 왔소?”</p><p>테세우스는 대답 대신 망토 안쪽에서 칼을 꺼내 상 위에 올려놓았어요. 아이게우스는 그 칼을 보았어요. 손을 뻗다가 닿기 전에 멈췄고요. 멈춘 손이 한참 그대로 있었어요.</p><p>“이 칼이 어디서 났소?”</p><p>“어머니 마을 밭 가운데 있는 바위 밑에서 꺼냈습니다.”</p><p>아이게우스가 자리에서 일어섰어요. 상을 짚고 일어서느라 상이 한 번 크게 흔들렸지요. 칼이 상 위에서 조금 미끄러졌어요.</p><p>“신발도 있었소?”</p><p>“여기 있습니다.”</p><p>테세우스가 자루에서 신발을 꺼냈어요. 밑창만 남고 가죽은 삭은 신발이었어요. 새 가죽끈이 꿰어져 있었고, 그 끈에는 매듭이 하나 더 있었지요. 길에서 끊어져 이어 묶은 자리였어요.</p><p>아이게우스는 그 매듭을 오래 보았어요.</p><p>“거기서 여기까지 걸어왔소?”</p><p>“네. 걸어서 이레 걸렸습니다.”</p><p>그 길로 왔느냐고 아이게우스가 물었어요. 테세우스는 그렇다고 대답했지요. 아이게우스는 창 쪽으로 걸어갔어요. 그러고는 등을 돌린 채로 물었지요.</p><p>“그대 어머니는 살아 계시오?”</p><p>“살아 계십니다.”</p><p>아이게우스는 고개만 끄덕였어요. 어머니 이야기는 그것 말고는 더 묻지 않았고요.</p><p>“그 무거운 바위를 어떻게 밀었소?”</p><p>“바위 밑을 사흘 동안 파서 기울게 했습니다.”</p><p>아이게우스는 고개를 천천히 끄덕였어요. 그러고는 혼잣말처럼 한마디를 했지요.</p><p>“나는 그 바위를 굴려 칼을 덮어 놓고 사흘을 앓았소.”</p><p>아이게우스는 칼을 상 위로 밀어 테세우스 앞에 놓았어요. 그러고는 자리에 도로 앉았지요. 앉고 나서 한참 뒤에 사람을 불러 상을 하나 더 들이라고 했어요.</p><p>상이 들어왔어요. 아이게우스는 거의 먹지 않고 테세우스가 먹는 것을 보았어요. 한 그릇을 다 비우자 아이게우스가 사람을 불러 한 그릇 더 가져오라고 했어요.</p><p>그날 밤 아이게우스는 테세우스를 옆방에 재웠어요. 두 방 사이 문은 열어 놓고요.</p><p>“아직 아무한테도 말하지 마시오.” 아침에 아이게우스가 말했어요.</p><p>“제가 왔다는 걸 왜 말하면 안 됩니까?”</p><p>“내게는 조카가 쉰이나 있소. 다들 내 자리를 노리고 있소. 내 아들이 왔다는 걸 오늘 알면 오늘 안에 그대를 해치려 들 것이오. 며칠만 시간을 주시오. 사람들 앞에서 제대로 세워 줄 테니.”</p><p>테세우스는 알겠다고 했어요. 그러고는 창밖의 항구를 보았지요. 검은 돛이 아직 그 자리에 있었고요.</p><h2>제비 하나를 대신 뽑다</h2><p>이튿날 아침에 두 사람은 같은 상에 앉았어요. 창밖으로 항구가 보이는 자리였지요.</p><p>“항구에 있는 검은 돛 배는 언제 떠납니까?”</p><p>“내일 아침에 크레타섬으로 떠난다.”</p><p>“저도 그 배를 타고 크레타섬에 가겠습니다.”</p><p>아이게우스의 손에서 물잔이 기울었어요. 물이 상에 조금 쏟아졌지요. 아이게우스는 그것을 닦지 않았어요.</p><p>“너는 이제 막 왔다. 오자마자 떠나겠다는 거냐?”</p><p>“막 왔으니까 가야 합니다.”</p><p>“그게 무슨 소리냐?”</p><p>“제 이름은 그 항아리에 없었습니다.” 테세우스가 말했어요.</p><p>“이름이 있었으면 저도 뽑혔을지 모릅니다. 이름이 빠진 사람은 저뿐입니다.”</p><p>아이게우스는 바로 대답하지 못했어요.</p><p>“제가 대신 가면 뽑힌 열넷 가운데 하나는 안 가도 됩니다. 제일 어린 사람을 집에 남기겠습니다.”</p><p>“누가 남는지도 네가 정하겠다는 거냐?”</p><p>“누가 가는지는 저 항아리가 정했습니다. 그건 아무도 못 고쳤고요.”</p><p>아이게우스는 상에 쏟아진 물을 손바닥으로 밀어 보았어요. 물이 상 끝에서 다 떨어지고 나서야 입을 열었어요.</p><p>“나는 저 배를 두 번 보냈다. 스물여덟이 갔고 아무도 돌아오지 않았어.”</p><p>“이번이 세 번째군요.”</p><p>“그래.”</p><p>제일 어린 사람을 집으로 돌려보내는 일은 그날 저녁에 했어요. 그 아이의 어머니가 궁 앞까지 왔는데 문 안으로는 들어오지 못했지요. 아이가 문을 나서자 그 어머니는 아이를 붙잡고 한참 서 있었어요. 두 사람이 그 자리에서 비켜 주는 데 시간이 꽤 걸렸고요.</p><p>테세우스는 그것을 안뜰에서 보았어요. 다 보고 나서 안으로 들어갔지요. 아이게우스는 그날 하루 종일 아무 말도 하지 않았어요. 저녁이 되어서야 사람을 시켜 흰 천을 한 필 가져오게 했지요. 한 번도 쓰지 않은 새 천이었어요. 접힌 자국이 그대로 있는 천이었고요.</p><p>“돛으로 쓸 만한 천이다.” 아이게우스가 말했어요.</p><p>아이게우스는 그 천을 손수 개어 자루에 넣었어요. 그러고는 뱃사람 우두머리를 불렀지요.</p><p>“돌아올 때 저 아이가 살아 있거든 검은 돛을 내리고 이걸 올려라. 멀리서도 보이게.”</p><p>“나는 날마다 벼랑에 나가 흰 돛을 기다릴 것이다. 날마다.”</p><p>뱃사람 우두머리가 고개를 숙였어요. 아이게우스는 그 자루를 테세우스에게 주지 않고 뱃사람에게 주었어요. 그게 더 확실하다고 여겼나 봐요.</p><p>배는 이튿날 아침에 떠났어요. 부두에 사람이 아주 많았는데도 조용했어요. 노 젓는 소리가 하나하나 다 들릴 만큼요.</p><p>부두에는 열셋의 식구들이 나와 있었어요. 우는 사람도 있고 울지 않는 사람도 있었지요. 울지 않는 쪽이 더 많았어요. 아홉 해에 한 번씩 겪는 일이라 다들 우는 법도 알고 있었거든요.</p><p>아이게우스는 배가 만을 빠져나갈 때까지 부두에 서 있었어요. 검은 돛은 바람을 잘 받았어요.</p><h2>크레타섬의 항구</h2><p>크레타섬까지는 사흘 뱃길이었어요. 바람이 좋아서 노를 많이 젓지 않아도 되었어요. 배 한가운데에는 자루가 하나 묶여 있었어요. 흰 천이 든 자루였어요. 뱃사람 우두머리가 그것을 하루에 한 번씩 손으로 짚어 보았고요.</p><p>배 안에서는 처음에 아무도 말을 하지 않았어요. 그런데 이틀째부터는 조금씩 하기 시작했지요. 사람은 사흘을 내리 말없이 있기가 어렵거든요.</p><p>열셋 가운데 제일 나이가 많은 사람이 테세우스에게 물었어요.</p><p>“뽑히지도 않았는데 왜 이 배를 탔어요?”</p><p>“제 이름만 항아리에 없어서, 뽑힌 사람 하나 대신 왔어요.”</p><p>그 사람은 더 묻지 않았어요. 대신 자리를 옆으로 조금 옮겨 앉았지요. 테세우스가 앉을 자리를 내준 거예요.</p><p>둘째 날 저녁에는 열넷이 뱃전에 나란히 앉았어요. 누가 먼저 시작했는지는 모르겠어요. 한 사람이 자기 집 이야기를 하니까 옆 사람도 했지요. 그렇게 한 바퀴가 돌았어요.</p><p>테세우스 차례가 되었을 때 테세우스는 바위 이야기를 했어요. 열여섯 해 동안 못 밀던 바위를 나흘 만에 민 이야기요. 어떻게 밀었느냐고 누가 묻자 밑을 팠다고 대답했지요. 그 말에 몇이 웃었어요. 배를 탄 뒤로 처음 난 웃음이었고요.</p><p>사흘째 아침에 섬이 보였어요. 산이 먼저 보이고 한참 뒤에 항구가 보였지요. 항구가 아테네 것보다 훨씬 컸어요. 배가 셀 수 없이 많았고요.</p><p>궁은 항구에서 올려다보였어요. 언덕 하나를 통째로 덮은 것처럼 컸지요. 지붕이 몇 겹으로 겹쳐 있고, 그 아래로 계단이 여러 줄 내려왔어요. 그 가운데 한 줄은 아주 깊은 데로 내려가는 것 같았어요. 끝이 보이지 않았거든요.</p><p>부두에 사람들이 나와 있었어요. 구경하러 나온 사람들이었어요. 그 앞쪽에 미노스 왕이 서 있었지요.</p><p>미노스는 손에 나무판을 들고 있었어요. 배에서 내리는 사람을 하나씩 세면서 나무판에 표시를 했어요. 세는 손이 아주 익숙했지요. 처음 하는 일이 아니었으니까요.</p><p>열넷째에서 그 손이 멈췄어요.</p><p>“너는 이 판에 없는 얼굴이구나.” 미노스가 말했어요.</p><p>“뽑힌 사람 하나와 자리를 바꿨습니다.”</p><p>“누구와 바꿨느냐?”</p><p>“이름은 말하지 않겠습니다.”</p><p>미노스는 나무판을 내려다보았어요. 그러고는 곁에 선 사람에게 무언가를 짧게 일렀지요. 그 사람이 언덕 쪽으로 뛰어갔어요.</p><p>미노스는 테세우스를 위에서 아래까지 한 번 보았어요. 신발께에서 눈이 조금 오래 머물렀고요.</p><p>“발이 상했구나.”</p><p>“아테네까지 먼 길을 걸어왔습니다.”</p><p>“여기서는 더 걸을 데가 없다. 내일 아침에 너희는 돌길로 들어간다.” 미노스가 말했어요.</p><p>미노스가 돌아섰어요. 그 뒤로 세 걸음쯤 떨어진 데에 젊은 여자가 서 있었어요. 미노스의 딸 아리아드네였어요.</p><p>아리아드네는 아버지가 세는 것을 보고 있지 않았어요. 내리는 사람들의 발을 보고 있었지요. 열넷의 발을 하나씩요.</p><p>테세우스가 그 앞을 지나갈 때 아리아드네는 고개를 들지 않았어요. 다만 소맷자락을 한 번 고쳐 쥐었지요.</p><p>그날 낮에 열넷은 궁 안뜰을 가로질러 갔어요. 안뜰 바닥에 소 뿔 무늬가 크게 그려져 있었어요. 기둥마다 같은 무늬가 새겨져 있었고요. 그런데 사람들은 그 무늬를 밟지 않고 돌아서 걸었어요.</p><h2>밤에 온 실타래</h2><p>열넷은 궁 아래쪽 방 하나에 들어갔어요. 창이 높은 데에 하나 있고, 문 밖에 지키는 사람이 둘 있었지요. 방은 춥지 않았어요. 밥도 넉넉히 들어왔고요. 그게 더 이상했어요.</p><p>아무도 잠들지 못했어요. 한 사람은 벽에 기대앉아 무릎에 얼굴을 묻고 있었어요. 옆 사람이 그 등에 손을 얹고 있었고요.</p><p>테세우스는 창 아래에 앉아 있었어요. 창으로 별이 두 개 보였어요. 자리를 조금 옮기면 세 개가 보였고요. 방 안에는 열넷이 있었어요. 열셋은 조가비에 이름이 있던 사람들이고, 하나는 아니었지요.</p><p>밤이 깊어지자 누가 아주 작게 흥얼거렸어요. 노래라기보다 숨 쉬는 소리에 가까웠지요. 그 소리가 그치자 방이 더 조용해졌어요.</p><p>한밤중에 문이 열렸어요. 소리가 거의 나지 않았어요. 지키는 사람도 아무 말을 하지 않았고요. 들어온 사람은 아리아드네였어요.</p><p>아리아드네는 방 안을 한 번 둘러보았어요. 그리고 곧장 테세우스 앞으로 왔지요.</p><p>“당신이군요.”</p><p>“저를 아십니까?”</p><p>“부두에서 봤어요. 아버지의 나무판에 없던 사람이잖아요.”</p><p>아리아드네가 손을 내밀었어요. 손바닥 위에 실타래가 하나 놓여 있었어요. 어른 주먹보다 조금 작은 것이었지요. 실은 아주 가늘었는데 만져 보니 질겼어요.</p><p>“이 실로 무엇을 합니까?”</p><p>“돌길 입구에 실 끝을 묶으세요.”</p><p>테세우스는 실타래를 받았어요. 생각보다 무거웠어요. 실이 얼마나 길지는 가늠이 되지 않았어요.</p><p>“풀면서 들어가고 감으면서 나오세요. 갈림길에서 오래 서 있지 마세요. 서 있으면 실이 모자랍니다.”</p><p>“왜 저를 돕습니까?”</p><p>아리아드네는 그 물음에는 대답하지 않았어요. 대신 문 쪽을 한 번 보았지요.</p><p>“당신을 돕는 게 아닙니다.”</p><p>“그럼 누구를 돕는 겁니까?”</p><p>아리아드네는 문고리를 잡은 채 잠깐 서 있었어요.</p><p>“아홉 해 전에도 돌길 문 앞에 있었어요. 그때 들어간 이들은 못 도왔어요.”</p><p>그러고는 나갔어요. 방 안의 열셋이 테세우스를 보고 있었어요. 아무도 그게 무엇이냐고 묻지 않았고요.</p><p>실타래에서 실 끝이 조금 풀려 바닥에 늘어져 있었어요. 테세우스는 그 끝을 손가락에 두 번 감았어요.</p></article></noscript>
