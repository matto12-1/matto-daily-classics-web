  <noscript><article class="ns-text"><h1>만지면 금이 되는 손</h1><h2>장미밭에서 잠든 노인</h2><p>뜰에 장미가 예순 가지나 피어 있었어요. 빛깔도 다르고 향도 달랐어요. 미다스는 아침마다 그 사이를 천천히 걸으며 새로 핀 것을 세었지요.</p><p>산 하나를 넘어가면 있는 나라였어요. 넓지 않은 나라였지만 왕궁만은 소문이 나 있었어요. 소문이 난 것은 두 가지였어요. 하나는 이 뜰이고 하나는 창고였지요.</p><p>뜰을 걸을 때 미다스 옆에는 늘 딸이 붙어 다녔어요. 아직 무릎께밖에 오지 않는 아이였지요. 아이는 새로 핀 꽃을 먼저 찾아내는 것을 좋아했어요.</p><p>“여기 하나 더 폈어요!”</p><p>“그러면 오늘은 예순한 가지구나.” 미다스가 아이를 번쩍 안아 올리며 말했어요.</p><p>창고에는 금이 있었어요. 잔, 접시, 사슬, 조각상. 미다스는 사흘에 한 번씩 창고에 내려가 등불을 들고 그것들을 둘러보았어요.</p><p>둘러보고 나오면 늘 같은 생각을 했어요. 조금만 더 있으면 좋겠다고요. 미다스는 가난했던 적이 없었어요. 그런데도 창고 문을 닫을 때마다 어쩐지 허전했지요. 세어 본 것이 언제나 어제와 같았으니까요.</p><p>어느 여름날 아침이었어요. 뜰을 손보던 사람들이 장미 덤불 사이에서 웬 노인을 하나 발견했어요. 처음에는 덤불이 눌린 자국을 보고 짐승이 들어왔나 했지요.</p><p>머리가 하얗고 배가 둥근 노인이었어요. 장미 가시에 옷이 걸린 채로 코를 골며 자고 있었지요.</p><p>“여기서 뭐 하시는 겁니까?” 뜰지기가 어깨를 흔들며 물었어요.</p><p>노인은 눈을 반쯤 뜨더니 다시 감았어요. 그러고는 뭐라고 웅얼거렸는데, 알아들을 수 있는 말은 하나도 없었어요.</p><p>노인의 옷자락에서는 포도 냄새가 났어요. 허리춤에는 다 낡은 가죽 자루가 하나 매달려 있었고, 그 안에서 마른 덩굴 조각이 삐져나와 있었지요.</p><p>사람들이 노인을 들쳐 업고 왕에게 데려갔어요. 미다스는 노인의 얼굴을 보더니 자리에서 벌떡 일어섰어요.</p><p>“이분이 누구신지 아느냐?” 미다스가 신하들에게 물었어요.</p><p>아무도 몰랐어요. 미다스만 그 얼굴을 알아보았어요. 미다스가 왕자이던 시절 산에서 한 번 본 얼굴이었지요. 미다스는 노인의 손을 두 손으로 감싸 쥐었어요. 젊은 신을 어릴 적부터 업어 키운 늙은 스승이었거든요. 산길에서 무리를 놓치고 여기까지 흘러든 것이 틀림없었지요.</p><p>미다스는 노인을 손님방에 눕혔어요. 노인은 꼬박 사흘을 잤어요.</p><p>사흘째 되던 날 노인이 자리에서 일어나 앉았어요. 그러고는 자기가 어디 있는지 몰라 한참을 두리번거렸지요.</p><p>“여기가 어딥니까?” 노인이 물었어요.</p><p>“이 나라 왕궁입니다. 제 집이니 편히 계십시오.” 미다스가 물그릇을 내밀며 대답했어요.</p><p>그 뒤로 미다스는 열흘 동안 노인을 극진히 대접했어요. 아침에는 갓 구운 빵과 꿀을, 낮에는 뜰의 그늘자리를, 저녁에는 이야기 들어 줄 사람을 내어 주었지요. 노인은 이야기하기를 아주 좋아했거든요.</p><p>신하 하나가 조심스럽게 물었어요. 언제까지 모실 거냐고요. 미다스는 저분이 갈 데가 생각날 때까지라고 대답했지요.</p><p>노인의 이야기는 끝이 없었어요. 산을 넘던 이야기, 강을 건너던 이야기, 마른 언덕에 덩굴을 심던 이야기.</p><p>미다스는 그 이야기를 다 들어 주었어요. 하품이 나와도 손으로 가리고 들었지요. 딸도 옆에 앉아 들었어요. 아이는 산 이야기가 나올 때마다 눈이 커졌어요. 노인은 그런 아이가 마음에 들어서 이야기를 더 길게 늘였지요.</p><p>미다스가 노인을 잘 모신 데에는 다른 뜻이 없었어요. 어려운 사람을 문 앞에서 돌려보내지 않는 것, 그게 그 나라의 오래된 버릇이었거든요.</p><p>열흘째 되는 날, 왕궁 문 앞에 젊은 신이 찾아왔어요. 검은 곱슬머리에 포도 덩굴을 감아 쓰고, 솔방울이 달린 나무 지팡이를 든 디오니소스였어요.</p><p>노인이 그 앞으로 달려 나갔어요. 달려 나가다가 문지방에 걸려 넘어질 뻔했지요. 두 사람은 한참을 마주 보고 서 있었어요.</p><p>디오니소스는 값을 받지 않고 마른 땅에 덩굴을 심어 주며 다니는 신이었어요. 그 길에 늘 이 늙은 스승이 따라다녔지요. 열흘 전 산길에서 무리를 놓친 뒤로 디오니소스는 밥도 제대로 먹지 않고 산을 뒤졌어요.</p><p>“스승님을 열흘이나 찾았습니다.” 디오니소스가 노인의 어깨를 잡으며 말했어요.</p><p>노인은 아무 말도 못 하고 웃기만 했어요. 디오니소스가 미다스 쪽으로 몸을 돌렸어요.</p><p>“이분을 잘 모셔 주셨다고 들었습니다.” 디오니소스가 고개를 숙였어요.</p><p>“귀한 분인 줄 알았을 뿐입니다.” 미다스가 손을 저으며 대답했어요.</p><p>“열흘이면 짧은 날이 아닙니다. 문 앞에서 돌려보내는 집이 훨씬 많았을 겁니다.” 디오니소스가 말했어요.</p><p>“그러면 무엇이든 하나 말씀하십시오.” 디오니소스가 지팡이를 고쳐 잡았어요. “들어 드리겠습니다. 무엇이든지요.”</p><h2>소원 하나를 고르는 밤</h2><p>미다스는 그 자리에서 대답하지 못했어요. 심장이 크게 뛰었지요.</p><p>“무엇을 청할지 하루만 생각해 봐도 되겠습니까?” 미다스가 겨우 물었어요.</p><p>“그러십시오.” 디오니소스가 뜰의 그늘자리에 앉았어요.</p><p>그날 미다스는 창고로 내려갔어요. 등불을 들고 금붙이 사이를 걸었지요. 잔을 들었다 놓고, 접시를 들었다 놓았어요.</p><p>등불에 비친 금은 낮에 보는 것과 달랐어요. 빛이 안에서 배어 나오는 것 같았지요. 미다스는 그 앞에 쪼그리고 앉아 오래 들여다보았어요.</p><p>창고는 넓었지만 벽이 있었어요. 미다스는 그 벽이 늘 마음에 걸렸어요. 등불을 벽에 가까이 대 보았어요. 그림자가 크게 흔들렸어요. 저 벽만 없으면 얼마나 좋을까, 미다스는 그런 생각을 했지요.</p><p>밤에는 뜰에 나가 앉았어요. 장미 향이 짙었어요. 그런데 그날 밤에는 그 향이 잘 느껴지지 않았어요. 머릿속이 온통 창고 생각이었거든요.</p><p>그때 뜰 저쪽에서 딸의 웃음소리가 들렸어요. 미다스는 그쪽을 잠깐 보았어요. 그러고는 다시 창고 쪽으로 고개를 돌렸지요.</p><p>미다스는 여러 가지를 떠올렸어요. 더 넓은 땅, 더 긴 목숨, 앓지 않는 몸. 그런데 떠올릴 때마다 마지막에는 늘 같은 것으로 돌아왔지요.</p><p>다음 날 아침 미다스는 디오니소스 앞에 섰어요. 두 손을 앞으로 모으고요.</p><p>“무엇을 청할지 정하셨습니까?” 디오니소스가 물었어요.</p><p>“정했습니다.” 미다스가 침을 삼켰어요. “제 손에 닿는 것마다 금이 되게 해 주십시오.”</p><p>뜰이 조용해졌어요. 신하들이 서로를 쳐다보았어요. 노인은 눈을 크게 떴지요. 디오니소스는 곧바로 대답하지 않았어요. 지팡이 끝으로 흙바닥을 두어 번 두드렸어요.</p><p>“정말 그것으로 하시겠습니까?” 디오니소스가 되물었어요.</p><p>“그것이면 됩니다.” 미다스가 얼른 대답했어요.</p><p>“한 번만 더 생각해 보셔도 됩니다.” 디오니소스가 말했어요. “저는 급하지 않습니다.”</p><p>“이미 열흘을 생각했습니다.” 미다스가 웃으며 말했어요. 사실은 하룻밤이었지요.</p><p>디오니소스는 미다스의 얼굴을 오래 보았어요. 그러고는 고개를 끄덕였어요.</p><p>“원하신 대로 해 드리겠습니다.”</p><p>지팡이 끝의 솔방울이 한 번 흔들렸어요. 그것뿐이었어요. 아무 소리도 나지 않았고 빛도 나지 않았지요. 미다스는 자기 손을 내려다보았어요. 아무 일도 일어나지 않은 것 같아서 잠깐 서운했어요.</p><p>노인이 미다스의 소매를 잡아당겼어요. 무슨 말을 하려는 것 같았는데, 디오니소스가 조용히 노인의 어깨에 손을 얹었지요.</p><p>디오니소스는 노인을 데리고 왕궁을 나갔어요. 문을 나서면서 뒤를 한 번 돌아보았어요. 무어라 말하려다가 그만두었지요. 이미 들어 드리기로 한 소원이었으니까요.</p><h2>금이 되는 아침</h2><p>미다스는 뜰로 나갔어요. 아무것도 달라진 것 같지 않았어요. 손을 들어 보아도 그냥 자기 손이었지요. 혹시나 하고 문설주에 손을 대 보았어요.</p><p>손이 닿은 자리부터 나무결이 사라졌어요. 누런빛이 위아래로 번져 나갔어요. 잠깐 사이에 문설주 하나가 통째로 금이 되었지요.</p><p>미다스는 소리를 질렀어요. 그러고는 뜰로 뛰어나갔어요. 미다스는 손끝을 들여다보았어요. 손톱 밑까지 살펴보았지만 달라진 데는 하나도 없었어요. 그냥 아침마다 보던 자기 손이었지요.</p><p>올리브나무 가지를 잡았어요. 가지가 금이 되었어요. 잎사귀 하나하나가 얇은 금판이 되어 햇빛에 반짝였지요.</p><p>돌을 주웠어요. 금덩이가 되었어요. 흙 한 줌을 쥐었어요. 손을 펴 보니 금 알갱이가 손바닥 가득 쏟아졌어요.</p><p>미다스는 그것을 다시 쥐었다 펴 보았어요. 알갱이가 손가락 사이로 흘러내리면서 아침 볕에 잘게 반짝였지요.</p><p>미다스는 웃음을 멈추지 못했어요. 어릴 적에 처음 강에서 헤엄을 친 날 이후로 이렇게 웃어 본 적이 없었지요.</p><p>미다스는 뜰을 뛰어다녔어요. 걸상을 만지고, 물동이를 만지고, 대문 빗장을 만졌어요. 만지는 것마다 뒤에서 반짝였지요.</p><p>“이걸 보아라!” 미다스가 신하들을 불렀어요. “이제 이 나라에 모자란 것은 없다!”</p><p>신하들은 웃으며 손뼉을 쳤어요. 몇은 조금 뒤로 물러섰지요. 왕이 어깨를 두드릴까 봐서요. 이층 창가에서 딸이 그 광경을 내려다보고 있었어요. 아버지가 뜰을 뛰어다니는 것은 처음 보았거든요.</p><p>뜰 한가운데에는 물이 솟는 자리가 있었어요. 미다스는 거기에 손을 담가 보았어요. 손이 닿은 데서부터 물결이 굳었어요. 솟던 물줄기가 그대로 멈춰 서서, 공중에 금으로 된 나무처럼 서 있었지요.</p><p>그 뒤로 뜰이 조용해졌어요. 물소리가 그쳤으니까요. 벌들도 어느새 보이지 않았어요. 미다스는 장미 덤불 앞에 섰어요. 예순 가지 장미 가운데 제일 아끼는 붉은 것이었어요. 미다스는 그 한 송이를 살며시 잡았어요.</p><p>꽃잎이 뻣뻣해졌어요. 향이 뚝 끊겼어요. 손을 놓자 금으로 된 장미 한 송이가 가지 끝에서 무겁게 흔들렸지요.</p><p>미다스는 잠깐 그것을 들여다보았어요. 그러고는 어깨를 으쓱하고 돌아섰어요. 아까워할 겨를이 없었거든요.</p><h2>다 차려진 아침상</h2><p>해가 높이 올라갈 무렵 미다스는 배가 고팠어요. 아침부터 뛰어다녔으니까요. 뜰은 이제 절반이 누렇게 반짝였어요. 걸어 다니기가 조금 불편할 정도였지요. 미다스는 그 사이를 조심조심 지나 안으로 들어갔어요.</p><p>“상을 차려라. 오늘은 크게 차려라.” 미다스가 이르며 자리에 앉았어요.</p><p>곧 상이 들어왔어요. 갓 구운 빵, 구운 고기, 삶은 콩, 무화과, 포도 한 송이, 그리고 물이 담긴 잔. 미다스는 빵부터 집었어요. 손끝이 닿는 순간 빵이 딱딱해졌어요. 미다스는 그것을 입으로 가져갔어요.</p><p>이가 부딪히는 소리가 났어요. 빵은 금덩이였어요. 미다스는 그것을 상 위에 내려놓았어요. 소리가 무겁게 났지요.</p><p>“금으로 굳지 않은 다른 음식을 가져와라.” 미다스가 말했어요.</p><p>곧 김이 오르는 고기가 들어왔어요. 미다스는 이번에는 아주 조심스럽게 손을 뻗었어요. 손가락 끝만 살짝 대었지요. 그것으로 충분했어요.</p><p>무화과를 집었어요. 무화과도 금이 되었어요. 포도 한 알을 떼어 입에 넣어 보았어요. 혀에 닿은 것은 차갑고 단단한 것이었어요.</p><p>미다스는 물잔을 들었어요. 잔이 금이 되는 것은 상관없었어요. 안에 든 물만 마시면 되니까요. 잔을 기울였어요. 물이 입술에 닿았어요.</p><p>그 순간 물이 굳었어요. 입술에 닿은 자리에서 금빛 알갱이가 흘러내려 상 위로 떨어졌지요. 미다스는 잔을 내려놓았어요. 손이 떨리고 있었어요.</p><p>“마실 것을 다른 것으로 가져와라.” 미다스가 말했어요. 목소리가 아까와 달랐지요.</p><p>시중드는 사람이 숟가락으로 죽을 떠서 입에 넣어 주려고 했어요. 숟가락은 금이 되지 않았어요. 그런데 죽이 입술에 닿자마자 굳었어요.</p><p>미다스는 입 안의 그것을 손바닥에 뱉어 냈어요. 노란 알갱이 몇 개가 굴러떨어졌지요. 목이 아까보다 더 말랐어요.</p><p>상 위에는 금으로 된 것들이 하나씩 늘어 갔어요. 빵도, 무화과도, 포도송이도요. 상다리가 그 무게에 조금씩 눌렸어요.</p><p>미다스는 그제야 창고 생각을 했어요. 그 안의 것들을 다 꺼내 와도 물 한 모금과 바꿀 수 없다는 것을요. 아무도 말을 하지 않았어요. 상 아래에서 누군가 숨을 삼키는 소리만 났어요.</p><p>“다들 나가 있어라.” 미다스가 낮게 말했어요.</p><p>사람들이 조용히 물러났어요. 문이 닫히자 방 안에 미다스 혼자 남았지요. 미다스는 상 앞에 한참 앉아 있었어요. 그러고는 손을 뻗어 금이 된 빵을 들어 보았어요. 아까보다 무거웠어요.</p><p>창고에 있는 것들이 떠올랐어요. 잔, 접시, 사슬, 조각상. 그것들을 다 모아도 오늘 아침 상 위의 이 빵 한 덩이만 못하다는 생각이 처음으로 들었지요.</p><p>미다스는 두 손을 무릎 위에 올려놓았어요. 손바닥이 하얗게 되도록 무릎을 눌렀지요. 그때 안뜰 쪽에서 발소리가 났어요. 가볍고 빠른 발소리였어요.</p><p>“아버지!”</p><p>미다스의 딸이었어요. 아침 내내 뜰이 시끄러웠으니 궁금했던 거예요. 아이가 문지방을 넘어 들어왔어요. 금이 된 장미를 한 송이 들고서요. 어디서 주웠는지 두 손으로 안고 있었지요.</p><p>“이거 보세요. 장미꽃이 금으로 변했어요.”</p><p>미다스는 자리에서 일어섰어요. 아이는 아버지의 얼굴을 보고 걸음을 조금 늦추었어요. 그러다가 다시 웃었어요. 아버지가 장난을 치는 줄로 안 거예요.</p><p>“아버지, 이거 아버지가 그러신 거예요?”</p><p>미다스는 대답하지 못했어요. 아이가 웃으며 달려왔어요. 늘 하던 대로요. 아버지가 앉아 있으면 목을 끌어안고, 서 있으면 허리를 안는 아이였어요.</p><p>미다스는 두 손을 등 뒤로 감추었어요. 그러고는 한 걸음 물러섰어요. 또 한 걸음 물러섰어요. 등이 벽에 닿을 때까지요.</p><p>미다스는 벽에 등을 붙인 채로 입을 열었어요. 아침에 뜰을 뛰어다니며 지르던 그 목소리가 아니었지요.</p><p>“오지 마라. 내 손에 닿으면 안 된다.”</p><p>아이는 걸음을 멈추지 않았어요. 그 말이 무슨 뜻인지 알 리가 없었으니까요.</p></article></noscript>
