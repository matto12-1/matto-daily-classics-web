  <noscript><article class="ns-text"><h1>바위 밑에 놓인 것</h1><h2>구덩이에 넣은 것</h2><p>구덩이 바닥에 칼 한 자루가 놓였어요. 아이게우스가 무릎을 꿇고 그것을 내려놓았어요. 칼집은 낡았지만 자루 끝에 새겨진 무늬는 아직 또렷했지요. 그 옆에 신발 한 켤레도 나란히 놓았어요. 밑창이 두꺼운 가죽 신발이었어요.</p><p>그 칼은 아이게우스가 아테네에서부터 차고 온 것이었어요. 왕이 되고 나서는 한 번도 뽑아 본 적이 없는 칼이었지요.</p><p>“칼과 신발을 왜 땅에 묻습니까?”</p><p>물은 사람은 그 집 딸이었어요. 남쪽 바닷가에 있는 작은 나라, 그 나라 왕의 딸이었지요. 아이게우스는 그 나라에 한동안 머물렀고, 떠날 무렵 둘은 부부가 되었어요. 이제 항구에서 배가 기다리고 있었고요.</p><p>아이게우스는 대답 대신 일어섰어요. 그리고 옆에 있는 둥근 바위에 어깨를 댔지요. 사람 키의 절반쯤 되는 바위였어요. 어깨로 밀자 바위가 천천히 굴러 구덩이를 덮었어요.</p><p>굴리고 나서 아이게우스는 한참 숨을 골랐어요. 손바닥에 흙이 잔뜩 묻어 있었지요.</p><p>“아이가 태어나거든, 저 바위를 혼자 밀어낼 수 있게 될 때까지는 내 이야기를 하지 마시오.” 아이게우스가 말했어요.</p><p>“왜 아이한테 당신 이야기를 하면 안 되지요?”</p><p>“아테네에는 내 자리를 기다리는 조카가 쉰 명이오.” 아이게우스가 말했어요.</p><p>“그 애들은 나에게 아들이 없다는 것만 믿고 삽니다. 아들이 있다는 말만 돌아도 여기까지 배를 띄울 사람들이오.”</p><p>여자는 바위를 내려다보았어요. 그러고는 발끝으로 바위 옆의 흙을 꾹 눌러 보았지요.</p><p>“아이가 끝내 저 바위를 못 밀면요?”</p><p>“그러면 그 아이는 여기서 살면 됩니다. 여기도 좋은 나라요.” 아이게우스가 말했어요.</p><p>“언젠가 다시 오십니까?”</p><p>아이게우스는 그 물음에는 바로 대답하지 못했어요. 저 아래 항구에서 뱃사람이 손을 들어 보였거든요. 그쪽에 손을 들어 보이고 나서야 대답했지요.</p><p>“아테네 일이 나를 놓아 주면 오겠소.”</p><p>배가 떠난 것은 그날 저녁이었어요. 여자는 항구까지 나가지 않았어요. 대신 바위 옆에 서서 돛이 작아지는 것을 보았지요.</p><p>돛은 흰색이었어요. 그때는 아테네에서 온 배가 다 흰 돛을 달았거든요.</p><h2>해마다 밀어 본 바위</h2><p>아이는 사내아이였어요. 이름은 테세우스라고 지었지요. 어머니는 약속을 지켰어요. 아버지 이야기를 한 번도 하지 않았어요. 그런데 봄이 되면 해마다 그 바위 옆에 한참 서 있었지요. 아무것도 하지 않고 그냥 서 있기만 했어요.</p><p>마을 사람들은 그 바위를 대수롭지 않게 여겼어요. 밭 가운데 놓인 큰 돌 하나일 뿐이었으니까요. 소를 매어 두는 사람도 있었고, 그 그늘에 앉아 밥을 먹는 사람도 있었지요.</p><p>테세우스만 그 바위를 다르게 보았어요. 다섯 살에 처음 밀어 보았어요. 두 손을 바위에 대고 발로 땅을 굴렀지요. 바위는 꿈쩍도 하지 않았어요. 발만 뒤로 밀렸고요.</p><p>“그건 그냥 바위란다.” 어머니가 말했어요.</p><p>테세우스는 고개를 끄덕였어요. 그리고 다음 날 또 밀어 보았어요. 여덟 살에는 나무 막대를 가져와 바위 밑에 끼우고 눌러 보았어요. 막대가 뚝 부러졌지요. 부러진 자리가 하얬어요.</p><p>열 살에는 어깨를 대고 밀다가 발이 미끄러져 무릎이 까졌어요. 그날은 밀던 자리에 그대로 앉아서 무릎을 한참 들여다보았지요.</p><p>열두 살 여름에는 하루에 스무 번씩 밀었어요. 스무 번을 다 밀고 나면 손바닥이 벌게졌어요. 그 손을 우물물에 담그면 따가웠고요.</p><p>테세우스는 무거운 것을 자꾸 들었어요. 물통을 두 개씩 들고 언덕을 올랐고, 겨울에는 장작을 남보다 두 배씩 졌지요. 배에서 짐을 부릴 때는 부르지 않아도 가서 거들었고요.</p><p>바위는 한 번도 움직이지 않았어요. 한번은 마을 아이들 넷이 같이 밀어 준 적이 있어요. 넷이 한꺼번에 밀자 바위가 조금 흔들리기는 했지요. 테세우스는 그날 아이들에게 고맙다고 했어요. 그리고 다음 날 혼자 다시 밀었어요.</p><p>“저 바위를 왜 자꾸 미느냐?” 어머니가 물었어요.</p><p>“어머니가 봄마다 저 바위 옆에 서 계시니까요.”</p><p>어머니는 아무 대답도 하지 않았어요. 그날 저녁상에는 테세우스가 좋아하는 것이 두 가지 올라왔지요. 테세우스는 그 두 가지를 남기지 않고 다 먹었어요. 어머니는 밥을 뜨는 둥 마는 둥 했고요.</p><p>그해 겨울에는 그 나라 왕이 세상을 떠났어요. 테세우스의 외할아버지였어요. 장례를 치르고 돌아오는 길에 어머니가 바위 옆에서 걸음을 멈췄어요. 그러고는 아무 말도 없이 다시 걸었지요.</p><h2>열여섯 살의 어깨</h2><p>열여섯 살이 된 봄에 테세우스는 밀지 않았어요. 대신 바위 둘레를 한 바퀴 돌았어요. 두 바퀴를 돌았고, 세 바퀴째에는 쭈그리고 앉았지요.</p><p>바위가 놓인 자리는 조금 기울어 있었어요. 아래쪽으로 갈수록 낮았지요. 테세우스는 그 아래쪽 흙을 손으로 파 보았어요. 흙 밑에 잔돌이 잔뜩 박혀 있었어요.</p><p>그날부터 사흘을 팠어요. 잔돌을 하나씩 뽑아내고, 뽑은 자리를 또 팠지요. 손톱이 두 개 깨졌어요. 사흘째 저녁에는 바위 아래쪽에 어른 팔뚝만 한 골이 생겼어요. 테세우스는 그 골에 손을 넣어 보고 나서 흙을 털고 집으로 갔어요.</p><p>나흘째 아침에 테세우스는 바위 위쪽에 어깨를 댔어요. 발은 아래쪽이 아니라 위쪽 흙을 밟았고요. 이번에는 밀지 않고 눌렀어요. 몸무게를 전부 어깨 한쪽에 실었지요.</p><p>바위가 손가락 두 마디만큼 미끄러졌어요. 테세우스는 멈추지 않았어요. 어깨를 조금 옮겨 대고 다시 눌렀어요. 바위가 골 쪽으로 기울더니 통째로 굴러 내려갔지요. 굴러가다가 나무뿌리에 걸려 멈췄어요.</p><p>구덩이 바닥에 흙이 앉아 있었어요. 테세우스가 두 손으로 그 흙을 쓸어냈지요. 딱딱한 것이 손끝에 닿았어요.</p><p>칼집이었어요. 뒤에서 발소리가 났어요. 어머니가 언제부터 거기 서 있었는지는 모르겠어요.</p><p>테세우스는 칼과 신발을 꺼내 무릎 위에 올려놓았어요. 신발 가죽은 삭아서 누르면 부스러졌어요. 밑창만 성했지요. 칼은 녹이 슬었는데도 칼집에서 쑥 빠졌어요. 칼날에는 이가 하나 빠진 자리가 있었어요. 테세우스는 그 자리에 손가락을 대 보았지요.</p><p>어머니가 무릎을 굽히고 옆에 앉았어요.</p><p>“이 칼과 신발은 뭡니까?”</p><p>“네 아버지 것이다.” 어머니가 말했어요.</p><p>테세우스는 고개를 들었어요. 어머니는 테세우스를 보고 있지 않았어요. 바위가 굴러간 자리를 보고 있었지요.</p><p>“아테네의 왕이시다. 열여섯 해 전에 이걸 묻고 가셨어. 네가 저 바위를 혼자 밀어내면 그때 말하라고 하셨고.”</p><p>테세우스는 칼자루 끝의 무늬를 손가락으로 문질러 보았어요. 흙이 묻어 나왔지요.</p><p>“제가 바위를 밀어냈으니, 오늘이 그 말씀을 하실 날입니까?”</p><p>“그래, 오늘이 그날이구나.”</p><p>어머니는 일어서면서 무릎에 묻은 흙을 털었어요. 그러고는 신발을 집어 들고 앞서 걸었지요. 테세우스는 칼을 두 손으로 안고 뒤를 따라갔어요.</p><p>그 나라에서 아테네까지 가는 길은 두 가지였어요. 배로 만을 가로지르면 하루면 닿았어요. 걸어서 바닷가를 빙 돌아가면 엿새가 걸렸고요.</p><p>어머니는 배를 준비시켰어요. 이튿날 아침에 떠나는 배였지요. 테세우스는 항구까지 따라갔어요. 그런데 배에는 오르지 않았어요.</p><p>“저는 배를 안 타고 걸어가겠습니다.”</p><p>“바닷가를 도는 그 길은 못 쓰는 길이다.” 어머니가 말했어요.</p><p>“위험한 길인 줄 압니다.”</p><p>“길목마다 사람이 앉아 있어. 지나가는 사람을 그냥 보내지 않는 사람들이야. 그 길로 아테네까지 간 사람이 몇 해째 없다.”</p><p>“그것도 압니다.”</p><p>“그 길에는 사람 하나 없는 데가 반이 넘는다.”</p><p>“밤에는 걷지 않겠습니다.”</p><p>어머니는 테세우스의 얼굴을 오래 보았어요. 그러고는 한마디만 더 물었지요.</p><p>“그런데도 왜 굳이 걸어가려느냐?”</p><p>테세우스는 칼을 자루에서 조금 뽑았다가 도로 밀어 넣었어요.</p><p>“이 칼을 들고 배에서 내리면 아버지는 칼을 보고 저를 아들이라 하시겠지요. 저는 저를 보고 그러시게 하고 싶습니다.”</p><p>어머니는 그 자리에 한참 서 있었어요. 그러고는 집으로 돌아가 삭은 신발을 가져왔어요. 밑창에 새 가죽끈을 꿰기 시작했지요.</p><p>끈을 꿰는 데 한나절이 걸렸어요. 구멍이 삭아서 자꾸 찢어졌거든요. 찢어지면 그 옆에 구멍을 새로 뚫었어요.</p><p>다 꿰고 나서 어머니는 그것을 테세우스 앞에 내려놓았어요. 신어 보라고는 하지 않았지요. 테세우스가 발을 넣어 보니 조금 컸어요. 아버지 발이 더 컸던 거예요.</p><p>“발이 아프면 배를 타라.”</p><p>“네.”</p><p>테세우스는 그러겠다고 대답했어요. 그런데 그 말은 지키지 않게 돼요. 어머니는 테세우스가 언덕 위로 올라가 보이지 않게 될 때까지 항구에 서 있었어요. 그 자리는 열여섯 해 전에 흰 돛이 작아지는 것을 보던 자리와 멀지 않았지요.</p><h2>길 위에서 만난 사람들</h2><p>첫 번째 사람은 이튿날 낮에 만났어요. 좁은 벼랑길 한가운데에 앉아 쇠몽둥이를 무릎에 얹고 있었지요.</p><p>“지나가려면 값을 내라.”</p><p>“값이 얼마입니까?”</p><p>“네가 가진 것 전부다.”</p><p>테세우스는 자루를 내려놓았어요. 그 안에는 마른 빵과 신발 한 켤레와 칼 한 자루가 들어 있었어요. 그 사람이 자루 쪽으로 손을 뻗었어요. 뻗는 순간 테세우스가 쇠몽둥이 자루를 잡았지요. 둘이 그것을 잠깐 서로 당겼어요.</p><p>테세우스가 이겼어요. 그 사람은 벼랑길 옆 풀밭에 한참 앉아 있었어요. 테세우스가 다 내려갈 때까지 일어나지 않았고요.</p><p>벼랑길을 내려갈 때 테세우스의 손에는 쇠몽둥이가 들려 있었어요. 그날부터 테세우스는 그것을 지팡이처럼 짚고 걸었지요.</p><p>그날 밤에는 바닷가 바위 밑에서 잤어요. 자면서도 쇠몽둥이는 손에서 놓지 않았고요. 아침에 일어나 보니 손가락이 잘 펴지지 않았어요. 한참 주무르고 나서야 펴졌지요.</p><p>두 번째 사람은 소나무 숲에서 만났어요. 그 사람은 젊은 소나무를 휘어 놓고, 지나가는 사람에게 그것을 붙잡고 있으라고 시켰어요. 붙잡고 있으면 재미있는 것을 보여 주겠다면서요.</p><p>붙잡은 사람들이 그 뒤에 어떻게 되었는지는 그 숲만 알았어요. 그 숲에서 걸어 나온 사람이 없었거든요.</p><p>“이 나무를 붙잡아라.”</p><p>테세우스는 휘어진 나무를 두 손으로 붙잡았어요. 붙잡은 채로 그 사람을 보았지요.</p><p>“같이 잡으시지요.”</p><p>“뭐?”</p><p>“힘이 모자라서 혼자서는 못 붙잡고 있겠습니다.”</p><p>그 사람이 웃으면서 나무를 같이 잡았어요. 그때 테세우스가 손을 놓았어요. 소나무가 곧게 펴지면서 그 사람을 숲 밖으로 던져 버렸지요.</p><p>테세우스는 소나무가 흔들림을 멈출 때까지 서 있었어요. 그러고는 다시 걸었어요.</p><p>나흘째와 닷새째에는 아무도 만나지 않았어요. 대신 새 가죽끈이 한 번 끊어졌지요. 테세우스는 길가에 앉아 끊어진 끈을 이어 묶었어요. 어머니가 꿴 그대로는 되지 않아서 매듭이 하나 더 생겼고요.</p><p>발이 아팠어요. 그래도 배를 타지는 않았어요. 그 길에는 배를 탈 만한 항구도 없었지만요.</p><p>세 번째 사람은 엿새째 저녁에 만났어요. 아테네가 하루 거리밖에 남지 않은 곳이었지요. 길가에 집이 한 채 있고, 문 앞에 사람이 나와 있었어요. 이번에는 웃는 얼굴이었어요.</p><p>“들어와 자고 가시오. 침대가 있소.”</p><p>방 안에 쇠 침대가 하나 놓여 있었어요. 반듯하고 잘 닦여 있었지요. 그 사람이 침대를 손바닥으로 쓸어 보였어요.</p><p>“여기 눕는 사람은 다들 딱 맞더군.”</p><p>“침대에 안 맞으면 어떻게 합니까?” 테세우스가 물었어요.</p><p>“맞게 해 주지.”</p><p>테세우스는 침대를 보았어요. 그다음에 문간 쪽을 보았지요. 신발이 열 켤레도 넘게 쌓여 있었어요. 큰 것도 있고 아주 작은 것도 있었고요.</p><p>딱 맞을 리가 없는 크기들이었어요. 제일 위에 놓인 것은 아이 신발이었고요.</p><p>“주인께서 먼저 누워 보시지요.”</p><p>“내가 왜 먼저 누워?”</p><p>“주인이 눕지 않은 침대에는 안 눕습니다. 저희 나라 법입니다.”</p><p>그런 법은 없었어요. 그런데 그 사람은 그것을 몰랐지요. 그 사람은 웃으면서 침대에 누웠어요. 눕고 나서야 웃음을 멈췄고요.</p><p>그 침대는 그날 밤에 없어졌어요. 테세우스가 부수었거든요. 문간에 쌓여 있던 신발은 한 켤레씩 길가에 내놓았어요. 누가 찾으러 올지도 모르니까요.</p><h2>아테네 성문 앞</h2><p>이레째 아침에 아테네가 보였어요. 성벽은 생각보다 낮았어요. 대신 그 뒤로 바위 언덕이 하나 솟아 있었고, 그 위에 지붕들이 얹혀 있었지요.</p><p>길에는 사람이 많았어요. 그런데 아무도 성문 쪽으로 걷지 않았어요. 다들 반대쪽을 보고 서 있었지요. 항구 쪽이었어요.</p><p>테세우스도 그쪽을 보았어요. 항구에 배가 한 척 있었어요. 돛이 벌써 올라가 있었는데, 그 돛이 검었어요. 아침 해가 다른 데는 다 걸렸는데 그 돛에만 걸리지 않았지요.</p><p>배에 오르는 것은 짐이 아니었어요. 사람이었어요. 한 사람씩, 아주 천천히 올랐지요. 부두에 선 사람들은 아무도 손을 흔들지 않았고요.</p><p>“저 배는 어디로 갑니까?” 테세우스가 옆에 선 노인에게 물었어요.</p><p>노인은 대답하지 않았어요. 대신 손가락을 하나씩 꼽았어요. 아홉까지 꼽고 나서 손을 내렸지요.</p><p>“아홉 해가 또 지났구먼.”</p><p>“무엇이 아홉 해가 됐다는 겁니까?”</p><p>노인은 그 말에는 대답하지 않았어요. 그러고는 항구 쪽으로 걸어 내려갔어요. 부두 끝에서 누가 울고 있었어요. 소리는 나지 않고 어깨만 흔들렸지요. 그 옆에 선 사람이 그 어깨를 두 손으로 붙잡고 있었어요.</p><p>조금 떨어진 데에는 나이 든 사람 몇이 서 있었어요. 그 사람들은 배를 보지 않았어요. 땅만 보고 있었지요. 테세우스는 자루에서 칼을 꺼내 망토 안쪽으로 밀어 넣었어요. 자루 끝이 보이지 않을 때까지요. 그러고는 성문 쪽으로 걸었어요.</p><p>성문 앞에 지키는 사람이 둘 서 있었어요. 한 사람이 테세우스의 발을 내려다보았어요. 밑창만 남은 낡은 신발에 새 가죽끈이 꿰어져 있었지요.</p><p>“어디서 왔소?”</p><p>“남쪽 바닷가에서 걸어서 왔습니다.”</p><p>지키는 사람은 더 묻지 않고 옆으로 비켜섰어요. 성문 안쪽은 조용하지 않았어요. 물건 파는 소리, 수레 소리, 아이 부르는 소리가 다 났지요. 항구가 보이지 않는 자리까지 들어오자 사람들은 아무 일도 없는 것처럼 걸어 다녔어요.</p><p>테세우스는 걸음을 멈추고 뒤를 돌아보았어요. 성문 사이로 아직 그 돛이 보였어요. 검은 돛이 아침 바람에 한 번 부풀었다가 도로 가라앉았지요.</p></article></noscript>
