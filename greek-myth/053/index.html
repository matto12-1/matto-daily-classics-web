  <noscript><article class="ns-text"><h1>검은 돛</h1><h2>물을 실으러 든 섬</h2><p>물통 여섯 개가 다 비어 있었어요. 뱃사람 우두머리가 하나씩 기울여 보고 나서 뱃머리를 섬 쪽으로 돌렸지요. 크레타섬을 떠난 지 이틀째 되는 날 저녁이었어요.</p><p>섬은 크지 않았어요. 산이 하나 있고, 그 산에서 내려온 물이 모래밭 끝에서 바다로 들어갔지요. 배를 대기 좋은 자리였어요. 바람을 등지고 있어서 밤에도 파도가 세지 않았거든요.</p><p>열넷이 물통을 들고 내렸어요. 아리아드네도 내렸고요. 모래가 낮의 볕을 아직 품고 있어서 발바닥이 따뜻했어요.</p><p>물은 산 밑 바위 틈에서 났어요. 가늘게 나와 모래를 적시며 흘렀지요. 물통 하나를 채우는 데 시간이 꽤 걸렸어요. 그래서 사람들은 그 옆에 불을 피워 놓고 차례를 기다렸어요.</p><p>불가에서 누가 웃었어요. 웃고 나서 스스로 놀란 것처럼 입을 다물었지요. 그런데 조금 있다가 옆 사람이 또 웃었어요. 그다음부터는 아무도 입을 다물지 않았어요.</p><p>테세우스는 불가에 앉지 않았어요. 물이 나는 바위 옆에 앉아 물통이 차는 것을 보고 있었지요. 아리아드네가 와서 그 옆에 앉았어요.</p><p>“아직 제 물음에 대답 안 했어요.”</p><p>“무슨 물음 말입니까?”</p><p>“돌길 안에서 뭘 봤는지요.”</p><p>테세우스는 물통을 조금 기울여 물이 잘 들어가게 했어요. 그러고 나서야 입을 열었지요.</p><p>“바닥에 줄이 그어져 있었습니다.”</p><p>“바닥에 무슨 줄이요?”</p><p>“다섯 개씩 묶어서요. 손톱으로 그은 줄이었습니다.”</p><p>아리아드네는 아무 말도 하지 않았어요. 한참 뒤에 무릎을 안고 그 위에 턱을 얹었지요.</p><p>“그 줄이 몇 개였어요?”</p><p>“스무 묶음까지 세다가 그만두었습니다.”</p><p>“왜 그만두었어요?”</p><p>“끝까지 세면 그 줄이 모두 몇 개인지 알게 될 테니까요. 그걸 알고 싶지 않았습니다.”</p><p>아리아드네는 모래를 한 줌 쥐었다가 손가락 사이로 흘려보냈어요.</p><p>“제가 아홉 해 전에도 돌길 문 앞에 서 있었다고 했지요? 그때 들어가던 사람 하나가 제 손을 잡았습니다. 잡고는 놓지를 않았어요. 지키는 사람이 떼어 냈고요.” 아리아드네가 말했어요.</p><p>테세우스는 아무 말도 하지 않았어요. 물통이 다 차서 물이 넘치는데도 그대로 두었지요. 넘친 물이 모래에 스며 검은 자국을 냈어요.</p><p>불가에서는 집 이야기가 오가고 있었어요. 아테네에 닿으면 무엇부터 먹겠다는 이야기였지요. 누구는 어머니가 끓이는 것을 말했고, 누구는 그냥 물을 실컷 마시겠다고 했어요.</p><p>“저 사람들은 갈 데가 있군요.” 아리아드네가 말했어요.</p><p>“공주님은 어디로 가십니까?”</p><p>“당신이 가는 데로요.”</p><p>아리아드네는 그렇게 말하고 테세우스를 보았어요. 테세우스는 이미 다 찬 물통 쪽을 보고 있었어요.</p><p>밤이 깊었을 때 뱃사람 우두머리가 배 한가운데에 묶여 있던 자루를 들고 왔어요.</p><p>“이걸 언제 돛대에 올릴까요?”</p><p>“자루에 든 게 무엇입니까?”</p><p>“흰 천입니다. 살아 돌아오면 올리라고 아버님이 손수 개어 주셨습니다.”</p><p>테세우스는 자루를 받아 매듭을 풀었어요. 그러고는 안을 들여다보았지요. 접힌 자국이 그대로 있는 천이었어요. 손바닥으로 눌러 보니 뻣뻣했고요.</p><p>“이 자루는 제가 갖고 있겠습니다.”</p><p>“아버님이 저에게 맡기신 것입니다.”</p><p>“아버지는 저를 기다리시는 거지 천을 기다리시는 게 아닙니다.”</p><p>뱃사람 우두머리는 잠깐 그대로 서 있다가 손을 놓았어요. 아이게우스가 그 자루를 아들이 아니라 뱃사람에게 준 것은 그편이 더 확실하다고 여겼기 때문이었어요. 자루는 그날 밤에 테세우스의 무릎으로 옮겨 갔지요.</p><p>사람들은 모래밭에서 잤어요. 배 안보다 넓었으니까요. 불은 밤중에 저절로 꺼졌어요. 아무도 다시 지피지 않았고요.</p><h2>아침의 모래</h2><p>아리아드네가 눈을 뜬 것은 해가 산 위로 올라온 뒤였어요. 뺨 한쪽에 모래가 눌린 자국이 나 있었지요. 모래밭에는 아무도 없었어요.</p><p>불을 피웠던 자리가 있었어요. 재는 아직 미지근했고요. 물통을 굴려 놓았던 자국이 모래에 여섯 줄 나 있었어요. 그 줄이 물가까지 이어졌다가 거기서 끊겼지요.</p><p>배를 밀어낸 자국은 넓었어요. 배 밑이 모래를 밀고 지나간 자리였어요. 그 자국 안에 발자국이 잔뜩 찍혀 있었고요. 발자국은 전부 바다 쪽으로만 나 있었어요.</p><p>아리아드네는 물가까지 걸어갔어요. 그러고는 바다를 보았지요. 아주 작은 점이 하나 있었어요. 돛이었어요. 검은색이었고요.</p><p>아리아드네는 그 자리에 서서 이름을 불렀어요.</p><p>“테세우스.”</p><p>한 번 부르고, 한 번 더 불렀어요. 세 번째는 부르지 않았어요. 물이 발목까지 올라왔다가 내려갔어요. 올라올 때마다 발밑의 모래가 조금씩 파였지요. 아리아드네는 발을 옮기지 않았어요. 그래서 발이 조금씩 모래에 묻혔어요.</p><p>점이 언제 없어졌는지는 아리아드네도 몰랐어요. 한참 보다가 눈을 깜빡였는데, 그때는 이미 없었거든요.</p><p>말 한마디 없이 두고 가는 건 정말 너무했지요. 갈매기 두 마리가 재 위로 내려앉았어요. 먹을 것이 있는 줄 알았나 봐요. 아리아드네가 손을 젓지 않았는데도 곧 날아갔어요.</p><p>아리아드네는 산 쪽으로 올라가 보았어요. 높은 데서 보면 더 멀리 보일 테니까요. 올라가 보니 바다가 사방으로 넓었어요. 배는 어디에도 없었고요.</p><p>섬에는 사람이 살지 않았어요. 집도 밭도 없었지요. 다만 물이 나는 자리에 돌이 몇 개 둥글게 놓여 있었어요. 전에도 누가 여기서 물을 실어 갔던 거예요.</p><p>재가 남은 자리로 돌아왔을 때 아리아드네는 모래 위에서 실타래를 보았어요. 아리아드네가 준 그 실이었어요. 모래가 조금 묻어 있었고요. 두고 간 것인지 흘린 것인지는 알 수 없었어요.</p><p>아리아드네는 그것을 주워 손에 쥐었어요. 그러고는 하루 종일 놓지 않았지요.</p><h2>덩굴을 지고 온 사람</h2><p>오후에 배가 한 척 들어왔어요. 작은 고기잡이배였어요. 뱃전에 짐이 실려 있었는데 짐이 전부 나뭇가지였지요. 마르고 비틀린 가지 다발이었어요.</p><p>내린 사람은 젊었어요. 검은 곱슬머리에 덩굴을 감아 쓰고 있었고, 솔방울이 달린 나무 지팡이를 짚고 있었지요. 그 사람이 모래밭을 한 번 둘러보았어요. 그러고는 산 밑을 한참 보았어요. 물이 나는 자리였어요.</p><p>“여기는 물이 나는군요.”</p><p>아리아드네는 대답하지 않았어요. 그 사람은 지고 온 가지 다발을 모래에 내려놓았어요. 그러고는 지팡이 끝으로 흙을 파기 시작했지요. 한 뼘쯤 파고, 가지 하나를 세워 넣고, 흙을 덮었어요. 그것을 여러 번 되풀이했어요.</p><p>“땅에 심는 그게 뭡니까?” 아리아드네가 물었어요.</p><p>“포도나무 가지예요.”</p><p>“이런 섬에서도 자랍니까?”</p><p>“마른 데서 잘 자라요.”</p><p>그 사람은 심는 손을 멈추지 않았어요. 열 자루쯤 심고 나서야 허리를 폈지요.</p><p>“당신을 두고 간 배는 언제 떠났어요?”</p><p>“새벽에요.”</p><p>“그 배를 따라가고 싶어요?”</p><p>아리아드네는 바로 대답하지 않았어요. 물가에 난 자국을 한참 보았지요. 아침에 있던 자국은 물이 여러 번 오르내려서 거의 지워져 있었어요.</p><p>“따라가면 뭐가 달라집니까?”</p><p>“아무것도 안 달라져요.”</p><p>“그럼 안 따라가겠습니다.”</p><p>“당신도 여기 혼자 계실 겁니까?” 아리아드네가 물었어요.</p><p>“저는 심고 나면 갑니다. 그런데 오래 걸려요. 이 섬은 마른 데가 많거든요.”</p><p>밤이 되자 그 사람이 불을 피웠어요. 아리아드네는 불가에 앉았어요. 앉고 나서야 하루 종일 아무것도 먹지 않았다는 것을 알았지요. 그 사람이 마른 무화과를 몇 개 건넸어요.</p><p>“이름이 뭐예요?”</p><p>“아리아드네입니다.”</p><p>“저는 마른 땅에 이걸 심으러 다녀요. 값은 받지 않고요.” 그 사람이 말했어요.</p><p>아리아드네는 그제야 그 사람이 누구인지 알았어요. 마른 언덕마다 덩굴을 심고 다니는 이가 있다는 이야기를 들은 적이 있었거든요. 디오니소스였어요.</p><p>디오니소스는 머리에 감았던 덩굴을 풀었어요. 그러고는 그것을 하늘 쪽으로 던져 올렸지요. 아리아드네가 고개를 들었어요.</p><p>던진 것이 내려오지 않았어요. 하늘 한쪽에 별이 둥글게 걸렸지요. 여덟 개나 아홉 개쯤 되었어요. 세어 보려고 하면 자꾸 하나가 더 보였고요.</p><p>“저 별은 하늘에서 안 없어져요.” 디오니소스가 말했어요.</p><p>아리아드네는 그 별을 오래 보았어요. 보면서 쥐고 있던 실타래를 무릎에 내려놓았지요. 손이 그제야 펴졌어요.</p><h2>뒤를 보고 앉은 사람</h2><p>배는 북쪽으로 갔어요. 바람이 좋아서 노를 많이 젓지 않아도 되었지요. 사흘이면 아테네에 닿을 바람이었어요.</p><p>테세우스는 고물에 앉아 있었어요. 무릎 위에 자루를 얹고요. 자루는 다시 풀지 않았어요. 첫날에는 아무도 왜 하나가 줄었는지 묻지 않았어요. 이튿날에 하나가 물었지요.</p><p>“공주님은 어디 계십니까?”</p><p>“물을 실었던 섬에 있습니다.”</p><p>“왜 공주님만 섬에 두고 왔습니까?”</p><p>테세우스는 대답하지 않았어요. 물었던 사람도 다시 묻지 않았고요. 배 안이 도로 조용해졌어요.</p><p>둘째 날 저녁에 열셋이 뱃전에 나란히 앉았어요. 크레타섬으로 갈 때도 그렇게 앉았던 자리였지요. 그런데 이번에는 한 사람씩 돌아가며 이야기하지 않았어요. 다들 앞만 보고 있었어요.</p><p>한 사람이 테세우스 옆으로 와서 앉았어요. 배 안에서 자리를 옆으로 옮겨 주었던 그 사람이었지요. 아무 말도 하지 않고 한참 앉아 있다가 도로 갔어요.</p><p>뱃사람 우두머리는 하루에 한 번씩 자루 쪽을 보았어요. 손으로 짚어 보지는 않았어요. 그 자루는 이제 자기가 맡은 것이 아니었으니까요.</p><p>밤에는 별이 잘 보였어요. 뱃사람 우두머리가 별을 보고 뱃길을 잡았거든요. 열셋 가운데 하나가 하늘 한쪽을 가리키며 저기 저건 뭐냐고 물었어요. 우두머리는 자기가 아는 별이 아니라고 했지요.</p><p>사흘째 아침에 뭍이 보였어요. 노를 젓던 사람이 먼저 보고 소리를 냈지요.</p><p>“아테네가 보입니다.”</p><p>열셋이 다 뱃머리 쪽으로 몰렸어요. 배가 한쪽으로 기울 만큼요. 우두머리가 자리로 돌아가라고 소리쳤어요.</p><p>테세우스는 고물에 그대로 앉아 있었어요. 뱃머리 쪽으로 가지 않았어요. 앉은 자리에서는 지나온 물만 보였지요. 배가 지나간 자리에 흰 줄이 길게 남았다가 조금씩 지워졌어요. 테세우스는 그 줄이 지워지는 데를 보고 있었어요.</p><p>우두머리가 돛 쪽으로 갔어요. 그러고는 뒤를 돌아보았지요. 테세우스는 등을 보이고 앉아 있었어요. 무릎에 자루가 그대로 얹혀 있었고요.</p><p>우두머리는 아무 말도 하지 않았어요. 자루가 이제 왕자의 무릎에 있으니 왕자가 알아서 올리리라 여겼거든요. 그런데 테세우스는 섬에 두고 온 아리아드네 생각에 흰 돛 약속을 까맣게 잊고 있었어요.</p><p>검은 돛이 그대로 올라가 있었어요. 바람을 잘 받았고요.</p><h2>날마다 내려간 자리</h2><p>아테네에서는 사람들이 날을 세고 있었어요. 사흘 가고 하루 있고 사흘 오면 이레였지요. 그런데 이레가 지나도 배는 오지 않았어요. 아홉 해 전에도 그랬고, 그 앞의 아홉 해 전에도 그랬거든요.</p><p>아이게우스는 그 여드레를 날마다 벼랑에 나갔어요. 아침에 올라가 저녁에 내려왔지요. 사람은 따라오지 못하게 했어요.</p><p>눈이 침침해서 먼 것은 잘 보이지 않았어요. 그래서 며칠 지나고부터는 벼랑에서 내려와 바닷가 바위까지 걸어 내려갔지요. 거기서는 배가 조금 더 크게 보였거든요.</p><p>그다음에는 바위에서 모래밭까지 내려갔어요. 그다음에는 물이 발에 닿는 데까지요. 날마다 조금씩 앞으로 나갔어요.</p><p>지나가는 배는 여러 척이었어요. 고기잡이배도 있고 짐배도 있었지요. 아이게우스는 그것들을 다 보았어요. 하나가 지나가면 다음 것을 기다렸고요.</p><p>저녁마다 사람이 하나 물가로 내려왔어요. 아이게우스를 데리러 오는 사람이었지요.</p><p>“들어가시지요.”</p><p>“조금만 더.”</p><p>그 대답도 날마다 같았어요. 그러면 그 사람은 몇 걸음 뒤에 서서 같이 기다렸어요. 아이게우스가 돌아설 때까지요.</p><p>여드레째 되는 날 아침에 배가 하나 들어왔어요. 아이게우스는 그것이 어느 배인지 곧 알았어요. 아홉 해에 한 번 보내는 그 배는 돛대가 하나뿐이라 다른 배와 달랐거든요.</p><p>아이게우스는 물속으로 몇 걸음 걸어 들어갔어요. 더 잘 보려고요. 물이 무릎까지 왔어요. 돛은 검었어요. 아침 볕이 다른 데는 다 걸리는데 그 돛에만 걸리지 않았어요. 여드레 내내 아이게우스가 기다린 것은 그 돛이 아니었지요.</p><p>아이게우스는 한참 그대로 서 있었어요. 물이 무릎께에서 오르내렸지요. 그러고는 한 걸음 더 걸었어요. 아이게우스가 바다 쪽으로 걸어 들어갔고, 사람들은 그 바다를 에게해라 불렀어요.</p><p>그날 물가에 나와 있던 사람이 몇 있었어요. 그 사람들은 나중에 서로 다르게 말했어요. 누구는 왕이 뭐라고 한마디 했다고 하고, 누구는 아무 말도 없었다고 했지요.</p><p>배가 항구에 닿은 것은 그날 낮이었어요. 부두에 사람이 아주 많았어요. 아홉 해마다 아무도 태우고 오지 않던 배가 사람을 태우고 들어왔으니까요.</p><p>부두에서 사람들이 소리를 질렀어요. 그런데 배에서 내리는 사람들은 웃지 않았어요. 부두에 있어야 할 사람이 없었거든요.</p><p>열셋은 저마다 식구들에게 갔어요. 어떤 집은 그 자리에서 주저앉았고, 어떤 집은 아무 소리도 내지 않았지요. 부두 한쪽에서는 아이 하나가 어머니를 못 알아보고 두 번 지나쳤어요.</p><p>테세우스가 마지막으로 내렸어요. 무릎에 얹고 있던 자루를 그때까지 안고 있었지요. 부두에 내려서고 나서야 그것을 내려다보았어요.</p><p>“아버지는 어디 계십니까?”</p><p>아무도 대답하지 않았어요. 옆에 서 있던 사람이 고개를 돌렸고, 그 옆 사람도 고개를 돌렸어요. 매듭을 풀었어요. 안에 흰 천이 접힌 그대로 들어 있었어요. 접힌 자국이 아직 또렷했고요.</p><p>테세우스는 그 천을 두 손으로 들고 서 있었어요. 아무도 그것을 받아 가지 않았어요. 흰 천은 그날 어디에도 걸리지 않았어요. 테세우스가 그것을 개어 자루에 도로 넣었거든요. 접힌 자국 위에 접힌 자국이 하나 더 생겼지요.</p><p>그날 저녁에 사람들이 아이게우스가 서 있던 자리를 알려 주었어요. 물가 모래에 발자국이 남아 있었어요. 발자국은 물 쪽으로만 나 있었고요.</p><p>아테네 사람들은 그해에 그 붉은 항아리를 신전 안쪽으로 도로 들여놓았어요. 다시 꺼낼 일이 없었으니까요.</p><p>그해 가을에 테세우스가 아테네의 왕이 되었어요. 자리를 기다리던 쉰 명의 조카들은 아무 말도 하지 못했지요.</p><p>테세우스는 궁에 오래 앉아 있지 않았어요. 날이 맑으면 벼랑까지 걸어 올라갔거든요. 아버지가 날마다 나가 있던 그 자리였어요.</p><p>벼랑 끝에 서면 바다가 아주 넓게 보였어요. 물빛이 자리마다 달랐지요. 테세우스는 그 가운데 한 자리를 오래 보았어요. 어디를 보는 것인지는 아무도 묻지 않았고요.</p></article></noscript>
