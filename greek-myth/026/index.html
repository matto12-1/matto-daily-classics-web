  <noscript><article class="ns-text"><h1>아라크네의 베틀</h1><h2>북이 보이지 않는 손</h2><p>북이 실 사이를 오가는데 손이 잘 보이지 않았어요. 너무 빨라서요. 실을 감아 둔 나무통을 북이라고 하는데, 보고 있으면 그 북이 저 혼자 왔다 갔다 하는 것 같았지요. 베틀 앞에 앉은 사람은 검은 머리를 위로 틀어 올린 젊은이였어요.</p><p>바닷가에서 그리 멀지 않은 곳에 작은 마을이 하나 있었어요. 그 마을에서 제일 이름난 것은 물들이는 솜씨였어요. 사람들은 소라 껍데기를 가마에 넣고 오래 삶아 자줏빛 물을 얻었지요. 그 마을에 아라크네라는 젊은 사람이 살았어요. 아버지가 양털을 물들이는 사람이었고, 아라크네는 그 물들인 실로 베를 짰어요.</p><p>어머니는 아라크네가 아주 어릴 적에 세상을 떠났어요. 그래서 아라크네는 아버지가 가마 앞에 서 있는 동안 혼자 실을 감으며 자랐지요.</p><p>아라크네는 한번 베틀 앞에 앉으면 좀처럼 일어서지 않았어요. 해가 지면 등잔을 당겨 놓고 계속 앉아 있었지요.</p><p>짜 놓은 천을 볕에 널면 지나가던 사람들이 걸음을 멈추었어요. 자줏빛이 햇빛을 받는 각도에 따라 붉어졌다가 푸르러졌거든요.</p><p>그 무렵 아라크네가 짜던 것은 바다를 담은 천이었어요. 자줏빛 실 사이에 회색 실을 아주 조금씩 섞어서, 멀리서 보면 물결이 천천히 밀려오는 것처럼 보였지요.</p><p>소문이 나면서 구경꾼이 늘었어요. 이웃 마을에서도 왔고, 배를 타고 건너오는 사람도 있었어요. 산에 사는 님프들까지 내려와 문가에 기대섰지요.</p><p>사람들은 다 짜인 천만 보러 온 게 아니었어요. 아라크네가 실을 고르고, 감고, 베틀에 거는 그 처음부터가 볼거리였거든요.</p><p>“저 손 좀 봐. 실이 어디로 들어가는지 하나도 안 보이잖아.” 앞줄에 앉은 사람이 옆 사람을 툭 쳤어요.</p><p>“나는 사흘째 오는데 아직도 모르겠어.” 옆 사람이 눈을 떼지 않고 대답했어요.</p><p>한번은 마당에 앉아 있던 아이가 아라크네에게 물었어요. 어떻게 하면 그렇게 빨라지느냐고요.</p><p>“빨라지려고 한 적은 없어.” 아라크네가 북을 놓지 않고 대답했어요. “느리게 하지 않으려고 십 년을 앉아 있었을 뿐이지.”</p><p>아이는 그 말을 알아듣지 못한 얼굴로 한참 서 있다가 돌아갔어요. 아라크네는 아이가 나간 뒤에도 그 자리를 한 번 보았지요.</p><p>아라크네는 구경꾼이 뭐라고 하든 좀처럼 고개를 들지 않았어요. 다만 사람들이 감탄하는 소리가 나면 입꼬리가 아주 조금 올라갔지요.</p><p>어느 날 한 노부인이 구경을 왔다가 이렇게 말했어요.</p><p>“이건 사람 솜씨가 아니야. 여신께 배웠나 보구나.” 노부인이 두 손을 모으며 감탄했어요.</p><p>그 말에 아라크네의 손이 딱 멈추었어요. 베틀 소리가 그쳤어요. 구경하던 사람들이 서로를 쳐다보았지요.</p><p>아라크네가 천천히 고개를 들었어요. 그런 말을 들은 것이 처음은 아니었어요. 다만 그날은 그 말을 그냥 넘기지 못했지요.</p><p>“누구한테도 배우지 않았어요.” 아라크네가 또박또박 말했어요.</p><p>“그거야 여신께서 손끝에 넣어 주셨다는 뜻이지.” 노부인이 웃으며 손을 저었어요.</p><p>“이 손은 제 손이에요.” 아라크네가 손바닥을 펴 보이며 말했어요.</p><p>손가락 마디마다 굳은살이 박여 있었어요. 실에 쓸린 자국이 손바닥을 가로질러 하얗게 나 있었지요. 엄지 옆에는 북에 눌린 자리가 움푹 들어가 있었어요.</p><p>“열 살 적부터 앉아 있었어요. 겨울에는 손이 터서 실에 피가 묻은 날도 있었고요. 그걸 여신이 넣어 주셨다고 하면, 제가 앉아 있던 그 세월은 뭐가 되나요?”</p><p>노부인은 대답하지 못했어요. 구경꾼들도 아무 말이 없었지요. 마당에는 바람에 천 널린 소리만 났어요. 아라크네는 다시 북을 잡았어요. 그런데 그날은 손이 평소 같지 않았어요. 자꾸 그 말이 걸렸거든요.</p><p>한참 뒤에 아라크네가 혼잣말처럼 말했어요. 아주 작은 소리였는데도 마당 끝까지 들렸지요.</p><p>“여신께서 겨루자고 하시면 베 짜기로 겨뤄 볼 텐데.”</p><p>베틀 앞이 조용해졌어요. 누군가 문가에서 숨을 들이켜는 소리가 났어요.</p><p>“그런 말은 하는 게 아니야.” 문가의 님프 하나가 낮게 말렸어요.</p><p>“왜요? 제 천이 지면 지는 거고, 안 지면 안 지는 거지요.” 아라크네는 북을 도로 잡았어요.</p><p>그 말은 그날 저녁에 벌써 이웃 마을까지 갔어요. 다음 날에는 산 위까지 올라갔지요. 말이라는 것은 언제나 짠 천보다 빨리 퍼지거든요.</p><h2>문 앞에 선 노파</h2><p>며칠 뒤 아침이었어요. 아라크네의 집 문 앞에 등이 굽은 노파가 서 있었어요. 지팡이를 짚고, 잿빛 두건을 눈썹까지 내려썼지요.</p><p>“들어가도 되겠나?” 노파가 문설주를 짚으며 물었어요.</p><p>“들어오세요. 자리는 좁지만요.” 아라크네가 북을 놓지 않은 채 대답했어요.</p><p>노파는 베틀 옆의 낮은 걸상에 앉았어요. 한참을 아무 말 없이 천을 보았어요. 실이 오가는 것을 눈으로 따라가면서요.</p><p>“솜씨가 참 좋구먼.” 노파가 마침내 입을 열었어요.</p><p>“고맙습니다.” 아라크네가 짧게 대답했어요.</p><p>“그런데 요즘 사람들이 이상한 말을 옮기더구나. 네가 여신에게 겨루자고 했다고 말이다.”</p><p>아라크네의 북이 잠깐 느려졌다가 다시 빨라졌어요.</p><p>“말이 그렇게 돌았나 보네요.” 아라크네가 대수롭지 않게 대꾸했어요.</p><p>“나이를 먹으면 좋은 게 하나 있단다. 물러설 자리를 안다는 것이지.” 노파가 지팡이를 고쳐 쥐며 말했어요.</p><p>노파는 몸을 앞으로 조금 기울였어요. 두건 그림자 밑에서 눈만 보였어요. 늙은 사람의 눈치고는 지나치게 맑았지요.</p><p>“사람 중에서 제일이면 그것으로 넉넉하지 않으냐. 여신께 한마디만 여쭈어라. 잘못했다고, 그 말만 하면 여신께서도 그만두실 것이다.”</p><p>아라크네는 북을 놓았어요. 그러고는 걸상 쪽으로 몸을 돌려 노파를 마주 보았지요.</p><p>“할머니.” 아라크네가 불렀어요.</p><p>“그래.” 노파가 고개를 들었어요.</p><p>“저는 여신을 욕한 적이 없어요. 겨뤄 보고 싶다고 했을 뿐이에요.” 아라크네가 조용히 말했어요.</p><p>“사람들 귀에는 그게 같은 말로 들린단다.”</p><p>“아니에요. 그건 제 천을 걸겠다는 말이에요.”</p><p>아라크네는 무릎 위의 실밥을 하나하나 털어 냈어요. 그러고는 다시 노파를 보았지요.</p><p>“제 천이 못하면 저도 압니다. 못한 줄도 모르고 짜는 사람은 아니에요. 저는 그저 재 보고 싶은 거예요.”</p><p>“그리고 하나만 더 말씀드릴게요.” 아라크네가 덧붙였어요. “저는 여신께서 저보다 잘 짜신다면 그걸 보고 싶어요. 지는 것이 무서웠으면 애초에 이 말을 안 했지요.”</p><p>노파는 한동안 아무 말이 없었어요. 방 안에서는 등잔 심지가 타는 소리만 났지요. 그러다가 노파가 천천히 일어섰어요. 굽었던 등이 펴졌어요. 지팡이가 손에서 미끄러져 흙바닥에 떨어졌지요.</p><p>두건이 어깨 뒤로 흘러내렸어요. 잿빛 옷 아래에서 청동 투구가 드러났어요. 어깨에는 작은 올빼미가 앉아 있었어요.</p><p>아테나였어요. 마당에 있던 사람들이 그 자리에 엎드렸어요. 아라크네는 엎드리지 않았어요. 다만 자기도 모르게 한 걸음 물러섰지요. 떨리는 무릎을 감추려고 베틀 기둥을 잡았어요.</p><p>“나와 베 짜기를 겨루고 싶다고 했다지?” 아테나가 물었어요.</p><p>아라크네는 마른침을 삼켰어요. 여기서 아니라고 하면 끝나는 일이라는 것을 아라크네도 알았어요. 마당의 사람들이 모두 그 대답을 기다리고 있었지요.</p><p>“……네, 그렇게 말했습니다.” 아라크네가 말했어요.</p><p>“그러면 베틀을 하나 더 걸어라.” 아테나가 마당 쪽으로 걸어 나갔어요.</p><h2>나란히 선 두 베틀</h2><p>그날 저녁부터 마당에 등이 켜졌어요. 아라크네는 밤새 실을 골랐어요. 가마 옆에 쌓인 실타래를 하나하나 들어 빛에 비춰 보고, 쓸 것과 안 쓸 것을 갈랐지요.</p><p>마당에 베틀 두 대가 나란히 섰어요. 하나는 아라크네가 십 년을 앉아 온 낡은 베틀이었고, 하나는 아테나가 손짓 한 번으로 세운 베틀이었지요.</p><p>소문을 들은 사람들이 담 너머까지 들어찼어요. 아라크네의 아버지는 가마 앞을 떠나 마당 구석에 서 있었어요. 아무 말도 하지 못하고요.</p><p>두 사람은 실을 걸기 시작했어요. 자줏빛, 붉은빛, 노란빛, 그리고 그 사이사이의 이름 없는 빛깔들이 걸렸어요.</p><p>실은 한 빛깔에서 다음 빛깔로 넘어갈 때 어디서 넘어갔는지 알 수 없게 이어졌어요. 마치 저녁 하늘이 붉은빛에서 남빛으로 넘어가는 것처럼요.</p><p>북이 오가기 시작하자 마당이 조용해졌어요. 사람들은 숨소리도 죽였어요. 들리는 것은 베틀 두 대가 내는 소리뿐이었지요.</p><p>아테나의 천에는 신들이 사람들에게 준 것이 짜였어요. 언덕에 뿌리내린 올리브나무, 익어 가는 밀, 언덕을 덮은 포도 덩굴, 물 위에 뜬 배 한 척.</p><p>사람들은 그 천을 보면서 자기 마을의 언덕을 떠올렸어요. 어떤 사람은 자기도 모르게 고개를 끄덕였지요. “저기 저 나무, 우리 언덕에 있는 그거 아니야?” 담 위에 올라앉은 사람이 속삭였어요.</p><p>“쉿.” 옆 사람이 얼른 팔을 잡아당겼어요.</p><p>네 귀퉁이에는 작은 그림이 하나씩 들어갔어요. 신에게 겨루자고 나섰던 이들이 어떻게 되었는지를 보여 주는 그림이었어요. 그건 천에 짜 넣은 경고였지요.</p><p>짜는 손이 어찌나 고른지, 천을 뒤집어도 앞면과 뒷면을 가릴 수 없었어요. 아테나는 짜는 내내 옆 베틀을 한 번도 보지 않았어요. 그런데 북이 오가는 소리는 듣고 있었지요. 옆에서 나는 소리가 자기 소리와 거의 같은 빠르기로 이어지고 있었거든요.</p><p>그 옆에서 아라크네의 북도 쉬지 않았어요. 한 번도 어깨를 펴지 않고, 물 한 모금 마시지 않고요. 아라크네의 천에는 다른 것이 짜였어요. 신들이 사람들 앞에서 부끄러웠던 일들이었지요.</p><p>묻지도 않고 데려간 일, 약속을 지키지 않은 일, 화를 참지 못해 애먼 사람을 벌한 일. 하나같이 사람들이 알면서도 소리 내어 말하지 않던 것들이었어요.</p><p>짜인 사람들의 얼굴이 살아 있었어요. 놀란 얼굴, 우는 얼굴, 뒤를 돌아보는 얼굴. 담 너머에서 그것을 본 사람들이 하나둘 눈을 내리깔았지요.</p><p>“저 얼굴 좀 봐.” 담 너머에서 누군가 아주 작은 소리로 말했어요.</p><p>그다음 말은 나오지 않았어요. 무슨 말을 해야 할지 아무도 몰랐거든요. 천 가장자리에는 담쟁이 덩굴과 작은 꽃들이 촘촘하게 둘려 있었어요. 그 덩굴은 어디가 시작이고 어디가 끝인지 알 수 없게 이어져 있었어요.</p><p>그것을 짜는 아라크네의 얼굴에는 아무 표정도 없었어요. 자기가 무엇을 짜고 있는지 다 알면서 짰지요. 한낮이 지나면서 담 너머 사람들의 다리가 저려 왔어요. 그래도 아무도 자리를 뜨지 않았어요. 물을 떠 와서 나눠 마시고는 도로 서서 지켜보았지요.</p><p>해가 기울 무렵 두 베틀이 거의 동시에 멈추었어요. 아테나가 자리에서 일어나 아라크네의 천 앞으로 걸어갔어요. 마당에 있던 사람들이 길을 비키며 고개를 숙였어요.</p><p>아테나는 천을 위에서 아래로 훑어보았어요. 그러고는 한 발 물러서서 다시 보았어요. 실을 세는 사람처럼 아주 오래 보았지요.</p><p>흠을 찾고 있었어요. 그런데 찾지 못했어요. 실 한 올도 어긋난 데가 없었어요. 색이 뭉친 자리도, 눌린 자리도, 손이 흔들린 자리도 없었어요. 아라크네의 천은 아테나의 천에 조금도 뒤지지 않았어요.</p><p>마당이 아주 조용해졌어요. 아무도 어느 쪽이 이겼다고 말하지 못했어요. 말하지 않아도 다들 알고 있었으니까요.</p><p>아테나는 천 앞에 한참 서 있었어요. 어깨의 올빼미가 날개를 한 번 접었다 폈지요. 그러다가 아테나가 손을 뻗었어요. 그리고 그 천을 위에서 아래로 죽 찢었어요.</p><p>천이 갈라지는 소리가 마당을 가로질렀어요. 짜인 얼굴들이 반으로 나뉘었지요. 아라크네는 그 자리에서 움직이지 못했어요. 손이 아직 북을 쥔 모양 그대로 굳어 있었어요.</p><p>아라크네가 잘못한 게 있다면 솜씨가 너무 좋았다는 것뿐이었어요.</p><h2>처마 밑의 그물</h2><p>찢긴 천 조각이 바람에 흔들렸어요. 아라크네는 그것을 주우려고 손을 뻗었어요. 그러다가 손을 도로 내렸지요.</p><p>아테나가 아라크네를 내려다보았어요. 화가 난 얼굴은 아니었어요. 그게 더 무서웠지요.</p><p>“그래도 앞으로 베를 짜고 싶으냐?” 아테나가 물었어요.</p><p>아라크네는 대답하지 않았어요. 다만 찢어진 천에서 눈을 떼지 못했어요. 반으로 갈라진 자리에서 실 끝이 몇 올 삐져나와 흔들리고 있었지요.</p><p>“그러면 앞으로도 짜거라. 다만 사람들 앞에서 볕에 널지는 못할 것이다.”</p><p>아테나가 손을 뻗어 아라크네의 이마를 스쳤어요. 그러자 아라크네의 몸이 조금씩 작아지기 시작했어요. 키가 줄고, 어깨가 줄고, 틀어 올린 검은 머리가 사라졌어요. 팔이 가늘어지면서 그 수가 늘었어요. 여덟 개가 되었지요.</p><p>마당에 있던 사람들이 소리를 질렀어요. 몇은 눈을 가렸어요. 아라크네가 서 있던 자리에는 이제 아주 작은 것이 하나 남아 있었어요.</p><p>그것은 잠깐 가만히 있었어요. 그러다가 흙바닥을 가로질러 벽 쪽으로 기어갔어요. 그러고는 벽을 타고 처마 밑까지 올라갔지요.</p><p>아테나는 그것을 끝까지 지켜보았어요. 그러고는 아무 말 없이 마당을 나갔어요. 세워 두었던 베틀도 함께 사라졌어요.</p><p>사람들은 오래 흩어지지 않았어요. 그러다 하나둘 담을 넘어 돌아갔지요. 돌아가면서 아무도 아까 본 천 이야기를 꺼내지 않았어요.</p><p>그날 밤 아라크네의 아버지가 마당에 나와 오래 서 있었어요. 찢어진 천을 걷어 반듯하게 접고, 딸이 앉던 자리를 손으로 쓸어 보았지요.</p><p>그리고 처마 밑을 올려다보았어요. 어둠 속에서 무언가가 움직이고 있었어요. 아주 작은 것이 처마 끝에서 서까래로 실을 걸고, 걸고, 또 걸었어요.</p><p>실은 눈에 보이지도 않을 만큼 가늘었어요. 그런데 걸리는 자리마다 어긋남이 없었어요. 밤이 깊도록 그 일은 멈추지 않았지요.</p><p>아버지는 등잔을 든 채로 그것을 한참 올려다보았어요. 무어라 부르려다가 그만두었지요. 이제 무슨 이름으로 불러야 할지 몰랐거든요.</p><p>그러다가 등잔을 끄고 방으로 들어갔어요. 그날 밤 아버지는 좀처럼 잠들지 못했어요. 아침에 이슬이 내려앉자 그것이 보였어요. 처마 밑에 완벽한 그물이 하나 걸려 있었어요. 이슬방울이 실마다 하나씩 맺혀서, 햇빛을 받는 각도에 따라 붉어졌다가 푸르러졌지요.</p></article></noscript>
