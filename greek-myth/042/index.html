  <noscript><article class="ns-text"><h1>바위에 묶인 공주</h1><h2>어깨에서 자꾸 도는 자루</h2><p>자루가 자꾸 어깨에서 앞으로 돌아왔어요. 페르세우스는 그것을 도로 등 쪽으로 밀었어요. 조금 있으면 또 앞에 와 있었지요. 무겁지는 않았어요. 무겁지 않은데도 거기 있는 줄은 늘 알았어요.</p><p>이틀 동안 페르세우스는 아무 데도 내려앉지 않았어요. 사람이 사는 데는 특히요. 잘 때는 사람이 없는 바위를 골랐어요. 자루는 팔 하나 뻗으면 닿는 데에 두었고요. 그보다 멀면 자꾸 신경이 쓰이고, 그보다 가까우면 잠이 오지 않았거든요.</p><p>뒤에서 나던 날개 소리는 첫날 밤에 끊겼어요. 그래도 페르세우스는 사흘째까지 뒤를 돌아보지 않았어요. 그 첫 밤에는 자다가 세 번 깼어요. 깰 때마다 손이 먼저 자루 쪽으로 갔지요.</p><p>날개 달린 신발에는 이제 익숙해졌어요. 발끝을 내리면 내려가고 턱을 들면 올라갔지요. 처음에 그렇게 넘어지던 것이 우스울 정도였어요. 다만 오래 날면 발목이 시렸어요.</p><p>자루에는 마른 생선이 한 마리 남아 있었어요. 페르세우스는 그것을 꺼내지 않았어요. 꺼내려면 자루 안에 손을 넣어야 하는데 그러기가 싫었거든요. 그래서 이틀을 물만 마시고 날았어요.</p><p>동쪽으로 도는 길에 바닷가 하나가 눈에 들어왔어요. 붉은 바위가 물가까지 내려온 데였지요. 그 바위 하나에 흰 것이 있었어요. 페르세우스는 처음에 새인 줄 알았어요. 그런데 새치고는 너무 오래 움직이지 않았어요.</p><p>페르세우스는 내려갔어요.</p><h2>바위 위의 사람</h2><p>사람이었어요. 젊은 여자였지요. 바위에 등을 대고 서 있었는데, 두 손목이 바위 뒤로 돌아가 있었어요. 쇠고리가 손목을 물고 있었고, 그 고리가 굵은 사슬로 바위에 박힌 다른 고리에 매여 있었어요.</p><p>물이 무릎까지 올라와 있었어요. 물이 빠지면 발목까지 내려갔다가 조금 있으면 도로 올라왔지요. 머리가 다 젖어 있었어요. 검고 곱슬곱슬한 머리였어요. 목에는 붉은 산호 목걸이가 걸려 있었고요. 그것만 잔칫날 차림이었지요.</p><p>페르세우스가 다가가자 그 사람이 고개를 들었어요.</p><p>“가까이 오지 마세요.”</p><p>페르세우스는 멈췄어요.</p><p>“왜 가까이 가면 안 되지요?”</p><p>“곧 그게 물 위로 올라와요.”</p><p>“무엇이 올라온다는 겁니까?”</p><p>“물속에 사는 괴물이요. 저를 데려가러 와요.”</p><p>페르세우스는 물 쪽을 보았어요. 파도가 여느 바다와 다르지 않았어요. 갈매기 두 마리가 물 위에 떠 있다가 날아올랐지요.</p><p>“왜 이렇게 바위에 묶여 계십니까?”</p><p>그 사람은 절벽 위를 한 번 올려다보았어요. 페르세우스도 따라 보았지요. 절벽 위에 사람들이 서 있었어요. 스무 명은 되어 보였어요. 아무도 내려오지 않았고요.</p><p>“어머니가 하지 말았어야 할 말을 했대요. 그 말 때문에 바다가 화가 났고요.”</p><p>“어머님이 무슨 말을 하셨는데요?”</p><p>“제가 바다에 사는 누구보다도 곱다고요.”</p><p>그 사람은 그 말을 아주 짧게 했어요. 자랑도 아니고 원망도 아니었어요. 울지는 않았어요. 눈이 붉기는 했지만 그건 소금물 때문일 수도 있었지요.</p><p>“그래서 신관이 그랬대요. 바다를 달래려면 왕과 왕비의 딸을 저 바위에 매어 두라고요.”</p><p>절벽 위에서 누가 손짓을 했어요. 내려오라는 것 같기도 하고 올라가라는 것 같기도 했지요. 그 사람은 그쪽을 보지 않았어요.</p><p>바위에 묶인 사람은 하나인데, 미안해하는 사람은 아주 많았어요.</p><p>“여기 묶인 지 오래되셨습니까?”</p><p>“어제 아침부터요.”</p><p>그 사람이 물속에서 발을 조금 옮겼어요. 발가락을 폈다 오므리는 것 같았어요.</p><p>“밤에는 물이 여기까지 왔어요.” 그 사람이 턱으로 자기 어깨쯤을 가리켰어요. “그런데 아무것도 안 올라왔어요. 그래서 오늘이겠구나 했어요.”</p><p>페르세우스는 바위 뒤로 돌아갔어요. 사슬을 두 손으로 잡고 당겼어요. 사슬은 꿈쩍도 하지 않았어요. 고리가 바위 속으로 한 뼘은 들어가 있었거든요.</p><p>페르세우스는 고리 안쪽에 손가락을 넣어 보았어요. 손목과 쇠 사이에 손가락 하나가 겨우 들어갔지요. 그 사람이 잠깐 얼굴을 찡그렸어요. 페르세우스는 얼른 손을 뺐어요.</p><p>“이름이 어떻게 되십니까?”</p><p>“안드로메다요.”</p><p>“페르세우스입니다.”</p><p>안드로메다는 그 이름을 따라 말해 보지 않았어요. 대신 물 쪽을 보고 있었지요.</p><p>“이제 그만 가세요. 아까부터 물이 좀 이상해요.”</p><p>페르세우스도 물을 보았어요. 밀려오던 파도가 어느 선에서 멈췄다가 도로 물러났어요. 한 번이 아니었어요. 무언가가 그 아래에서 물을 밀어내고 있었지요.</p><h2>물속의 그림자</h2><p>그림자가 지나갔어요. 배 한 척만 한 그림자였어요. 그림자가 지나간 자리에서 물이 위로 부풀었다가 도로 가라앉았지요.</p><p>안드로메다가 눈을 감았어요. 절벽 위에서 누가 소리를 질렀어요. 페르세우스는 신발 끈을 조였어요. 그리고 안드로메다 쪽으로 한 걸음 갔지요.</p><p>“눈 감고 계십시오. 뜨지 마시고요.”</p><p>“말씀 안 하셔도 벌써 감고 있었어요.”</p><p>페르세우스는 하늘로 올라갔어요. 물 위로 괴물의 등이 먼저 나왔어요. 검고 젖은 등이었어요. 이끼가 낀 배 밑바닥 같았지요. 그다음에 머리가 나왔어요. 머리는 물 밖으로 다 나오지 않았어요. 그런데도 바위보다 컸어요.</p><p>괴물이 바위 쪽으로 몸을 돌렸어요. 물이 그쪽으로 밀려갔어요. 안드로메다의 허리까지 물이 올라왔지요.</p><p>페르세우스는 소리를 질러 보았어요. 괴물은 돌아보지 않았어요. 소리로는 안 되는 것이었지요.</p><p>페르세우스는 방패를 기울였어요. 해가 등 뒤에 있었거든요. 방패에 부딪힌 빛이 물 위에 하얀 점을 만들었어요. 페르세우스가 손목을 조금 움직이자 그 점도 움직였지요.</p><p>괴물이 그 점 쪽으로 머리를 돌렸어요. 페르세우스는 점을 바위에서 먼 쪽으로 끌고 갔어요. 더 먼 쪽으로요. 괴물이 물을 가르며 따라왔어요. 물이 양옆으로 갈라졌다가 뒤에서 다시 붙었지요.</p><p>깊은 데까지 나오자 페르세우스는 방패를 접고 내려갔어요. 그런데 거기서 괴물이 멈췄어요. 하얀 점이 사라졌거든요. 해가 구름에 들어간 거예요. 괴물이 아주 천천히 몸을 돌리기 시작했어요. 바위 쪽으로요.</p><p>구름이 지나가기를 기다릴 시간이 없었어요. 페르세우스는 굽은 칼로 그 괴물을 물리쳤어요. 아주 큰 파도가 한 번 왔어요. 절벽 중턱까지 물이 튀었지요. 그러고는 조용해졌어요. 물이 판판해졌어요. 아까 부풀던 자리도 이제 부풀지 않았고요.</p><p>페르세우스는 물 위에 한참 떠 있었어요. 페르세우스는 바위로 돌아갔어요. 안드로메다는 아직 눈을 감고 있었어요.</p><p>“괴물은 물리쳤습니다. 이제 끝났습니다.”</p><p>안드로메다는 눈을 뜨지 않았어요.</p><p>“눈을 떴는데 아직 안 끝났으면 어떡해요?”</p><p>“안 끝났으면 제가 여기 와서 이렇게 말하고 있지 못하겠지요.”</p><p>안드로메다가 눈을 떴어요. 페르세우스는 칼끝을 고리 밑에 넣고 지렛대처럼 눌렀어요. 두 번 만에 고리가 뽑혔어요. 사슬이 물속으로 떨어졌지요. 안드로메다는 팔을 앞으로 가져오는 데 한참 걸렸어요. 너무 오래 뒤로 돌아가 있었으니까요.</p><p>손목이 다 벗겨져 있었어요. 안드로메다는 그 손목을 눈으로 보고도 별말을 하지 않았어요. 대신 두 손을 몇 번 쥐었다 폈지요. 손가락이 잘 움직이는지 확인하는 것 같았어요.</p><p>페르세우스는 자루를 열었어요. 아주 조금만요. 그리고 손을 넣어 맨 밑을 더듬었지요. 손끝에 부드러운 것이 잡혔어요.</p><p>작은 천 조각이었어요. 떠나는 날 아침에 어머니가 자루에 넣어 준 것이었지요. 페르세우스는 그것을 안드로메다의 손목 한쪽에 감아 주었어요. 다른 쪽에는 감을 것이 없었어요.</p><p>“이건 뭐예요?”</p><p>“무슨 천인지는 모릅니다. 떠나는 날 어머니가 넣어 주셨어요.”</p><p>절벽 위에서 사람들이 내려오기 시작했어요. 왕과 왕비가 앞장서서 뛰어 내려왔지요. 왕비가 딸을 안고 울었어요. 왕은 페르세우스의 두 손을 잡고 놓지 않았어요. 잔치를 열겠다고 했어요. 열흘이든 스무 날이든 하겠다고요.</p><p>“잔치는 하루면 됩니다.” 페르세우스가 말했어요. “집에 급한 일이 있습니다.”</p><p>이튿날 아침에 배가 뜰 때 안드로메다가 짐을 들고 나왔어요.</p><p>“저도 당신과 같이 가겠어요.”</p><p>왕비가 무어라 말하려다 말았어요. 왕은 아무 말도 하지 않았고요. 안드로메다는 붉은 산호 목걸이를 풀어 어머니 손에 쥐여 주었어요.</p><h2>섬으로 돌아간 날</h2><p>배는 나흘 만에 그 섬에 닿았어요. 페르세우스는 곧장 바닷가 낮은 집으로 갔어요. 문이 열려 있었어요. 안은 비어 있었어요. 그물이 마당에 널브러져 있었어요. 소금 항아리는 깨져 있었고요.</p><p>이웃집 사람이 담 너머로 얼굴을 내밀었다가 얼른 도로 들어갔어요. 페르세우스가 부르자 한참 만에 다시 나왔지요.</p><p>“어머니와 어부 아저씨는 어디 계십니까?”</p><p>“두 분 다 신전에 피해 계세요.”</p><p>왕이 잔치를 연다고 했어요. 오늘이 혼례라고요. 신부는 페르세우스의 어머니 다나에라고요. 어부가 제 형인 왕에게 그러면 안 된다고 했다가 함께 신전으로 피했다고요. 신전 기둥을 붙잡고 있으면 아무도 끌어내지 못한다는 옛 법이 있었거든요. 그래서 왕은 사람을 세워 두고 기다리는 중이라고 했어요. 나올 때까지요.</p><p>“신전에 피하신 지 며칠이나 됐습니까?”</p><p>“오늘로 나흘이요.”</p><p>페르세우스는 안드로메다를 그 집에 두고 나왔어요. 안드로메다가 따라나서려 하자 고개를 저었지요.</p><p>“여기 계십시오.”</p><p>“왜 저는 따라가면 안 돼요?”</p><p>“제가 가서 할 일은 보실 만한 것이 못 됩니다.”</p><p>언덕 위 흰 집 마당에 자리가 깔려 있었어요. 불도 여러 개 놓여 있었고요.</p><p>페르세우스가 마당으로 들어섰어요. 사람들이 말을 멈췄어요. 왕이 잔을 든 채로 자리에서 일어섰지요.</p><p>“살아 왔구나.”</p><p>“왕께 약속한 그 괴물의 머리를 가져왔습니다.”</p><p>왕이 웃었어요. 마당에 있던 사람 몇이 따라 웃었어요. 웃지 않는 사람이 더 많았고요.</p><p>“네가 그걸 가져왔을 리가 없다.”</p><p>“직접 보시겠습니까?”</p><p>페르세우스는 마당을 한 번 둘러보았어요. 그러고는 큰 소리로 말했어요.</p><p>“제 편이면 눈을 감으십시오. 지금요.”</p><p>여러 사람이 눈을 감았어요. 왕은 감지 않았어요. 그러고는 잔을 상 위에 내려놓았지요. 페르세우스는 고개를 옆으로 돌린 채 자루에서 그것을 꺼냈어요.</p><p>왕은 그 자리에서 돌이 되었어요. 잔칫상 위의 잔이 하나도 넘어지지 않았어요. 돌이 된 것은 왕 하나였어요. 곁에 있던 사람들은 눈을 감고 있었거든요.</p><p>페르세우스는 그것을 도로 자루에 넣고 아가리를 묶었어요. 매듭을 두 번 지었지요. 그러고 나서야 눈을 떠도 된다고 했어요.</p><p>신전 기둥 뒤에 두 사람이 있었어요. 어부는 문 쪽을 보고 앉아 있었고, 다나에는 그 뒤에 있었어요. 나흘 동안 둘 다 거의 먹지 못했지요.</p><p>다나에가 아들을 보았어요. 그러고는 아들 얼굴이 아니라 어깨에 걸린 자루를 먼저 보았어요.</p><p>“왕에게 약속한 그 머리를 가져왔느냐?”</p><p>“예.”</p><p>다나에는 더 묻지 않았어요. 대신 아들의 팔을 두 손으로 잡았어요. 한참을 그러고 있었지요.</p><p>섬 사람들이 어부에게 섬을 맡아 달라고 했어요. 어부는 싫다고 했어요. 사람들이 세 번을 청하자 그제야 고개를 끄덕였지요. 그러고도 언덕 위 흰 집으로 올라가지는 않았어요. 바닷가 낮은 집에 그대로 살았어요.</p><h2>배 위에서</h2><p>사흘 뒤에 배가 떠났어요. 아르고스로 가는 배였어요. 다나에와 페르세우스와 안드로메다가 탔지요. 섬이 멀어질 무렵 갑판에 아테나가 서 있었어요.</p><p>“방패와 자루는 이제 다 썼느냐?”</p><p>“예.”</p><p>“그러면 이리 다오.”</p><p>페르세우스는 방패를 풀어 건넸어요. 자루도 함께요. 아테나는 자루에서 그것을 꺼내 방패 한가운데에 붙였어요. 페르세우스는 그동안 뱃전만 보고 있었지요.</p><p>“이 방패는 이제 내가 가지고 있으마.”</p><p>“여쭐 것이 있습니다.”</p><p>“말해라.”</p><p>“돌밭의 그 사람은 원래 어떤 얼굴이었습니까?”</p><p>아테나는 대답하지 않았어요. 배가 한 번 크게 흔들렸어요. 아테나가 방패를 고쳐 잡았지요.</p><p>“헤르메스에게 빌린 신발과 자루와 칼은 내가 돌려주마.”</p><p>그 말이 끝나자 신발이 저절로 발에서 풀렸어요. 자루와 굽은 칼도 갑판 위에 놓였고요. 페르세우스는 맨발이 되었어요.</p><p>아테나가 사라진 뒤에도 페르세우스는 한참 그 자리에 서 있었어요. 어깨가 가벼웠어요. 가벼운 것이 좋지만은 않았지요.</p><p>안드로메다가 옆에 와서 섰어요. 손목에 감은 천이 바람에 조금 들렸지요.</p><p>“그 신은 왜 아무 대답도 안 해요?”</p><p>“저도 모르겠습니다.”</p><p>두 사람은 한참 바다만 보았어요. 다나에가 배 뒤쪽에서 그 둘을 보고 있었어요. 페르세우스가 돌아보자 얼른 다른 데를 보았지요.</p><p>저녁에 다나에가 안드로메다 옆에 앉았어요. 안드로메다의 손목에 아직 그 천 조각이 감겨 있었지요. 다나에는 그것을 한참 보았어요.</p><p>“손목에 감은 그 천은 어디서 났느냐?”</p><p>“아드님이 감아 주셨어요.”</p><p>다나에는 천 끝을 손가락으로 만져 보았어요. 그러고는 페르세우스를 불렀어요.</p><p>“이 천이 무엇인지 아느냐?”</p><p>“모릅니다.”</p><p>“내가 갇혀 있던 탑에서 짠 천이다.”</p><p>다나에가 말했어요. 그러고는 그 뒤를 이었지요. 배냇저고리를 짜고 포대기를 짜고 발싸개까지 짜고도 실이 조금 남았다고요. 그 남은 실로 마지막에 이것을 짰다고요.</p><p>“상자 안에서 네가 이걸 쥐고 있었다. 나흘 내내 놓지 않았지.”</p><p>안드로메다가 손목을 내려다보았어요. 페르세우스는 아무 말도 하지 않았어요. 그날 밤에 다나에는 나머지를 다 이야기했어요. 열여덟 해 동안 하지 않던 이야기였지요.</p><p>아르고스에 왕이 있었다고요. 그 왕이 델포이에 가서 아들이 있겠느냐고 물었다고요. 그런데 돌아온 대답은 아들 이야기가 아니었다고요.</p><p>“다만 네 딸이 낳은 아들이 언젠가 네 자리에 앉을 것이다.”</p><p>다나에는 그 말을 그대로 옮겼어요. 한 글자도 바꾸지 않고요.</p><p>“그 딸이 나였다.”</p><p>페르세우스는 한참 있다가 물었어요.</p><p>“그러면 그 왕은 지금 어떻게 됐습니까?”</p><p>“아직 아르고스 왕의 자리에 있겠지.”</p><p>페르세우스는 뱃전으로 나갔어요. 바람이 뒤에서 불었어요. 돛이 팽팽했지요. 뱃머리가 향한 쪽에는 아직 아무것도 보이지 않았어요.</p><p>“아르고스까지 며칠이나 걸립니까?”</p><p>키를 잡은 사람이 손가락을 펴 보였어요. 다섯을 펴고, 다시 둘을 폈지요. 이레였어요.</p><p>“아르고스에 아는 분이 계십니까?”</p><p>페르세우스는 바로 대답하지 않았어요. 한참 뒤에 있다고만 했지요. 배 뒤쪽에서는 안드로메다가 손목에 감긴 천 조각을 바람에 눌러 잡고 있었어요.</p></article></noscript>
