  <noscript><article class="ns-text"><h1>하데스의 나라</h1><h2>제우스가 맡긴 새 일</h2><p>헤르메스가 산꼭대기에 내려섰을 때 발목의 날개는 아직 파닥거리고 있었어요. 아침에 받은 소식을 바다 끝까지 갖다주고 막 돌아온 참이었지요. 신발을 벗을 새도 없었어요. 벌써 다음 심부름이 기다리고 있었거든요.</p><p>날개 달린 신발을 신은 뒤로 헤르메스는 하루도 가만히 있어 본 적이 없었어요. 신들은 무슨 일이 생기면 무조건 헤르메스부터 찾았거든요.</p><p>어느 아침 제우스가 헤르메스를 따로 불렀어요.</p><p>“일을 하나 더 맡아 주어야겠다.”</p><p>“오늘도요?”</p><p>제우스는 웃지 않았어요. 대신 산 아래가 아니라 발밑을 가리켰어요.</p><p>“이번 심부름은 땅 아래로 내려가는 길이다.”</p><p>헤르메스는 그 손끝을 따라 시선을 내렸어요. 돌바닥 말고는 아무것도 없었지요.</p><p>제우스가 이야기를 시작했어요. 땅 위에는 사람들이 살고 있어요. 그런데 사람은 신과 달라서, 언젠가 숨이 다하는 날이 와요. 그러면 몸은 땅에 남고 그 사람의 나머지는 아래로 내려가지요.</p><p>헤르메스는 그 말을 들으면서 발끝을 내려다보았어요. 심부름이라면 자신 있었어요. 아무리 먼 데라도 갈 수 있었지요. 그런데 이번 심부름은 어쩐지 무게가 달랐어요.</p><p>“그런데 길을 아는 이가 없다. 다들 처음 가는 길이니까.” 제우스가 말했어요.</p><p>“그래서 어떤 이는 자기 집 앞을 며칠씩 맴돈다. 어떤 이는 엉뚱한 곳으로 걸어가 헤매고.”</p><p>“왜 하필 저입니까?”</p><p>“너는 위와 아래를 다 갈 수 있는 몇 안 되는 아이니까.” 제우스가 말했어요.</p><p>“그리고 너는 처음 만난 사람하고도 금방 말을 트지 않느냐. 그 길에는 그런 사람이 필요하다.”</p><p>헤르메스는 아무 말도 하지 않았어요. 심부름을 맡길 때마다 늘 농담을 하나씩 하던 아이였는데 그날은 그러지 않았지요.</p><p>“문 앞까지만 데려다주면 된다. 그 안쪽은 내 형이 맡은 곳이니까.”</p><p>헤르메스는 고개를 끄덕였어요. 그러고는 하나만 물었어요.</p><p>“그 아래는 무서운 곳입니까?”</p><p>“나도 가 본 적이 없어서 모른다.”</p><p>그 대답을 듣고 헤르메스는 오히려 웃었어요. 그리고 그날 저녁 처음으로 아래를 향해 날았어요. 가는 길에 헤르메스는 자기 신발을 한 번 내려다보았어요. 발목의 날개가 평소보다 천천히 팔랑거리는 것 같았어요.</p><p>그날 저녁, 어느 언덕 마을에 해가 지고 있었어요. 집 앞 걸상에 할아버지 한 사람이 앉아 있었어요. 아주 오래 산 사람이었어요. 손등에 주름이 깊었고, 무릎에는 손질하다 만 그물이 놓여 있었지요.</p><p>할아버지는 저물어 가는 하늘을 한참 바라보았어요. 그리고 조용히 눈을 감았지요. 잠시 뒤 할아버지는 자기가 아주 가벼워진 것을 알았어요. 걸상에서 일어서는 데 힘이 하나도 들지 않았거든요. 무릎도 아프지 않았고요.</p><p>할아버지는 어리둥절해서 마당을 한 바퀴 돌았어요. 마당 끝에 서 있던 감나무 잎이 흔들리지 않았어요. 바람이 부는데도요.</p><p>그때 뒤에서 목소리가 들렸어요.</p><p>“놀라지 마세요.”</p><p>돌아보니 젊은이가 하나 서 있었어요. 챙이 둥근 모자를 썼고, 발목에 작은 날개가 달린 신발을 신고 있었지요. 어깨에는 아무것도 메지 않았어요.</p><p>“누구시오?”</p><p>“할아버지가 가실 길을 아는 사람이에요. 길을 안내하러 왔어요.”</p><p>할아버지는 자기 집 문을 한 번 돌아보았어요. 안에서는 아직 불빛이 새어 나오고 있었어요. 저녁 준비를 하는 소리도 들렸고요.</p><p>문틈으로 아이 목소리가 들렸어요. 밥이 다 되었느냐고 묻는 소리였지요. 할아버지의 손녀였어요.</p><p>“오늘 저녁에 저 아이한테 그물 매듭 짓는 법을 가르쳐 주기로 했는데.” 할아버지가 말했어요. 그러고는 잠깐 웃었어요. 웃는데 눈은 웃지 않았어요.</p><p>“나는 이제 떠나야 하오?”</p><p>“네.”</p><p>“지금 말고, 조금 뒤에 가면 안 되겠소?”</p><p>헤르메스는 잠깐 대답하지 못했어요. 이런 질문을 받게 될 줄은 몰랐거든요.</p><p>“조금 뒤에 가셔도 똑같이 떠나셔야 해요.” 헤르메스가 겨우 말했어요. 할아버지는 고개를 끄덕였어요. 그러고는 손질하던 그물을 걸상 위에 개어 놓았어요.</p><p>“그물을 다 못 고쳤는데.” 할아버지가 중얼거렸어요.</p><p>헤르메스는 그 그물을 한 번 보았어요. 매듭이 반쯤 이어져 있었어요. 나머지 반은 누군가 이어야 할 몫으로 남아 있었지요.</p><p>언덕을 내려가는 동안 할아버지는 아무것도 묻지 않았어요. 헤르메스도 아무 말 하지 않았고요. 발소리가 났는데, 그마저도 하나뿐이었어요.</p><h2>검은 강의 나룻배</h2><p>가는 길은 생각보다 멀지 않았어요. 언덕 뒤편으로 돌아가니 골짜기 하나가 나왔거든요. 낮에는 여러 번 지나다녔던 골짜기였는데, 그날은 안쪽이 훨씬 깊어 보였어요.</p><p>두 사람은 아래로, 아래로 걸어 내려갔어요. 걸을수록 소리가 줄었어요. 처음에는 새소리가 사라졌고, 그다음에는 바람 소리가 사라졌어요. 나중에는 자기 발소리도 잘 들리지 않았지요.</p><p>“이상하네. 여긴 내가 아는 골짜기인데.” 할아버지가 주위를 둘러보며 중얼거렸어요.</p><p>“맞아요. 그런데 오늘은 이 골짜기가 아래로 가는 길이에요.”</p><p>얼마쯤 갔을까요. 길이 갑자기 넓어졌어요. 잿빛 들판이 끝없이 펼쳐져 있었어요. 하늘은 없었어요. 대신 아주 높은 곳에 희끄무레한 빛이 넓게 깔려 있었지요. 아침도 저녁도 아닌 빛이었어요.</p><p>들판에는 하얀 꽃이 잔뜩 피어 있었어요. 향기가 나지 않는 꽃이었어요. 할아버지가 하나를 꺾어 보려다가 그만두었어요.</p><p>“이건 무슨 꽃이오?”</p><p>“이름은 저도 몰라요. 여기에만 핀대요.”</p><p>그리고 그 앞에 강이 있었어요. 물빛이 아주 검었어요. 물살이 있는데 소리가 나지 않았지요. 강 건너편은 안개에 가려 잘 보이지 않았어요. 이 강의 이름이 스틱스강이에요.</p><p>강가에 나룻배가 한 척 매여 있었어요. 배 옆에는 늙은 사공이 삿대를 짚고 서 있었고요. 삿대는 물 밑바닥을 밀어 배를 나아가게 하는 긴 장대예요. 사공은 두 사람이 다가오는 것을 보고도 아무 말이 없었어요.</p><p>헤르메스가 인사를 건넸어요. 사공은 고개만 까딱했어요. 사공은 뱃삯을 받아야만 사람을 태웠어요. 빈손으로 온 이는 강가에 오래 앉아 있어야 했지요. 그런데 헤르메스가 함께 온 날에는 사공이 아무것도 묻지 않았어요.</p><p>할아버지가 배에 올랐어요. 배가 조금 기울었다가 다시 바로 섰어요.</p><p>“같이 안 가시오?” 할아버지가 물었어요. 헤르메스는 배에 한 발만 걸치고 서 있었어요.</p><p>“저도 강 건너 문 앞까지는 같이 가요.”</p><p>사공이 삿대를 밀었어요. 배가 미끄러지듯 나아갔어요. 물 위로 아무 무늬도 남지 않았어요. 강물에서는 아무 냄새도 나지 않았어요. 물에 손을 담가 보려던 할아버지가 손을 도로 거두었어요. 물이 너무 차가웠거든요.</p><p>강 한가운데쯤에서 할아버지가 뒤를 돌아보았어요. 방금 떠나온 강가가 벌써 안개에 묻혀 있었어요.</p><p>“이 강을 다시 건너 돌아갈 수 있소?” 할아버지가 물었어요.</p><p>“아니요. 이 배는 한쪽으로만 가요. 돌아가는 배는 없어요.”</p><p>헤르메스가 솔직하게 대답했어요. 할아버지는 한참 앞만 보았어요. 그러고는 무릎 위에 두 손을 모았어요. 그물을 개어 놓던 그 손이었지요.</p><h2>머리가 셋인 개</h2><p>건너편 강가에는 커다란 문이 하나 서 있었어요. 돌로 만든 문이었어요. 담장도 울타리도 없이 문만 덩그러니 서 있었지요. 그런데 그 문을 지나지 않고는 아무도 안으로 들어갈 수 없었어요.</p><p>문 앞에 무언가가 엎드려 있었어요. 처음에는 검은 바위인 줄 알았어요. 그런데 그것이 천천히 일어섰어요.</p><p>개였어요. 아주 큰 개였지요. 앉은키가 어른 키만 했어요. 털은 숯처럼 검었어요. 목덜미에는 갈기가 있었는데, 털이 아니라 검은 연기 같았어요. 가만히 있어도 그 갈기가 조금씩 흔들렸지요.</p><p>그리고 머리가 셋이었어요. 머리 셋이 저마다 다른 곳을 보고 있었어요. 하나는 강 쪽을, 하나는 문 안쪽을, 하나는 하늘이 있어야 할 자리를 올려다보고 있었지요. 눈은 여섯 개 다 호박빛이었어요.</p><p>할아버지가 저도 모르게 한 걸음 물러섰어요.</p><p>“괜찮아요.” 헤르메스가 말했어요.</p><p>“이 아이 이름은 케르베로스예요.”</p><p>케르베로스가 이름을 듣고 고개를 돌렸어요. 세 머리가 한꺼번에 두 사람을 보았어요. 그러다 꼬리를 살랑살랑 흔들었어요.</p><p>할아버지는 어리둥절했어요. 무서운 짐승인 줄 알았는데 꼬리를 흔들고 있었으니까요. 케르베로스는 문 앞으로 다가와 할아버지의 손등에 코를 대고 냄새를 맡았어요. 그러고는 가운데 머리를 슬쩍 들이밀었어요. 쓰다듬어 달라는 뜻이었지요.</p><p>할아버지가 조심스럽게 손을 올려놓았어요. 털이 따뜻했어요. 헤르메스가 품에서 마른 빵 한 조각을 꺼내 던져 주었어요. 왼쪽 머리가 그것을 받아먹었어요. 나머지 두 머리가 억울하다는 듯 그쪽을 돌아보았지요.</p><p>“하나밖에 없어. 다음에 세 개 가져올게.” 헤르메스가 말했어요. 케르베로스는 알아들었는지 못 알아들었는지 꼬리만 더 크게 흔들었어요.</p><p>케르베로스는 들어오는 이에게는 늘 이랬어요. 반가워하고, 냄새를 맡고, 문 옆으로 비켜서 주었지요. 그런데 나가려는 이에게는 달랐어요.</p><p>한번은 강을 건넜다가 마음이 바뀐 이가 문 앞에서 뒤로 돌아선 적이 있었어요. 그러자 세 머리가 동시에 일어났어요. 갈기의 연기가 부풀어 올랐고, 여섯 개의 눈이 한꺼번에 그 사람을 보았지요.</p><p>짖지도 않았어요. 그저 바라보기만 했어요. 그런데 그 사람은 도로 문 안쪽으로 걸어 들어갔어요. 문 안쪽에서 흘러나오는 공기는 서늘했어요. 그런데 나쁜 냄새는 나지 않았어요. 비 오기 전 돌에서 나는 냄새 같은 것이 났지요.</p><p>케르베로스는 사나운 개가 아니에요. 문을 지키는 개일 뿐이지요. 다만 그 문은 한 방향으로만 열려 있었어요.</p><h2>문 안쪽의 나라</h2><p>문 안쪽은 조용했어요. 아주 넓은 들판이 펼쳐져 있었어요. 낮은 언덕이 몇 개 있고, 그 사이로 좁은 물길이 흘렀어요. 어디에도 담이 없었어요. 어디로든 갈 수 있는데 아무도 서두르지 않았지요.</p><p>사람들이 여기저기 앉아 있었어요. 어떤 이는 물가에 발을 담그고 있었고, 어떤 이는 언덕에 누워 있었어요. 서로 이야기를 나누는 이들도 있었는데, 목소리가 아주 낮았어요.</p><p>할아버지가 물었어요.</p><p>“다들 무얼 기다리는 거요?”</p><p>“기다리는 게 아니에요. 여기서는 그냥 있는 거예요.”</p><p>헤르메스는 그렇게 말하면서도 자기 말이 좀 이상하다고 생각했어요. 그냥 있는 것이 어떤 것인지 헤르메스는 몰랐거든요. 한 번도 가만히 있어 본 적이 없었으니까요.</p><p>들판 저쪽에 궁이 하나 서 있었어요. 검은 돌로 지은 궁이었어요. 크기는 컸지만 꾸민 데가 하나도 없었어요. 기둥에 무늬도 없고, 문에 장식도 없었지요.</p><p>궁 앞 계단에 한 사람이 앉아 있었어요. 잿빛 망토를 두른 사람이었어요. 곧은 검은 머리에 짧게 다듬은 수염, 두 갈래로 갈라진 지팡이. 하데스였어요.</p><p>하데스는 무릎 위에 나무판을 하나 올려놓고 무언가를 세고 있었어요. 두 사람이 다가오자 고개를 들었지요.</p><p>“오늘 새로 온 사람이구나.” 하데스가 말했어요. 목소리가 낮고 조용했어요. 무섭게 하려는 목소리가 아니었어요.</p><p>할아버지는 무릎이 후들거렸어요. 뭐라고 인사를 해야 할지 몰라 그냥 고개를 깊이 숙였지요.</p><p>“여기서는 그러지 않아도 된다.” 하데스가 말했어요.</p><p>“여기서는 아무도 누구 앞에서도 무릎을 꿇지 않는다.”</p><p>할아버지가 조심스럽게 물었어요.</p><p>“그럼 여기서는 무엇을 하며 지냅니까?”</p><p>“아무것도 하지 않아도 된다. 그것이 여기 규칙이다.”</p><p>“정말 아무것도 안 해도 됩니까?”</p><p>“여기에는 배고픔이 없고, 추위도 없고, 서두를 일도 없다. 대신 돌아가는 길도 없지.”</p><p>하데스는 그 말을 아주 담담하게 했어요. 겁을 주려는 것도 아니고 위로하려는 것도 아니었어요. 그냥 있는 그대로 말한 것이었지요.</p><p>하데스는 누구에게나 똑같이 말했어요. 왕이 와도 그랬고, 하루도 배부른 날이 없던 사람이 와도 그랬어요. 이 나라에서는 문 안쪽에 들어오는 순간 모두 같아졌거든요.</p><p>할아버지는 들판을 한 번 둘러보았어요. 둘러보고 나서 작게 말했지요.</p><p>“손녀가 아직 어린데, 이제 다시는 못 보는 겁니까?”</p><p>하데스는 대답하지 않았어요. 나무판에 무언가를 적던 손도 잠깐 멈췄지요. 한참 뒤에 하데스가 말했어요.</p><p>“여기서 기다려도 된다. 그 아이도 아주 오래 산 뒤에는 이리로 온다. 여기서는 기다리는 것도 일이 아니니까.”</p><p>할아버지는 고개를 끄덕였어요. 그러고는 들판 쪽으로 천천히 걸어갔어요. 물가에 앉아 있던 누군가가 자리를 조금 비켜 주었어요.</p><p>헤르메스는 문 앞까지만 갔어요. 돌아서려는데 하데스가 계단에서 일어나 걸어왔어요. 두 사람은 문을 사이에 두고 마주 섰어요.</p><p>“앞으로는 네가 사람들을 이리로 데려오게 되었느냐?”</p><p>“네.”</p><p>“자주 오겠구나.”</p><p>헤르메스는 대답하려다가 말았어요. 그 말이 무슨 뜻인지 알아들었거든요. 땅 위에는 사람이 아주 많았으니까요.</p><p>“한 가지만 여쭤도 됩니까?” 헤르메스가 물었어요. 하데스가 고개를 끄덕였어요.</p><p>“큰아버지는 왜 이 자리를 그냥 받으셨어요? 제비를 뽑아 하늘과 바다와 이 아래를 나누던 날에, 다시 뽑자고 할 수도 있었잖아요.”</p><p>하데스는 잠깐 문 안쪽을 돌아보았어요. 들판에 앉아 있는 이들이 보였어요.</p><p>“누가 뽑혔어도 누군가는 맡아야 하는 자리다.”</p><p>그러고는 이렇게 덧붙였어요.</p><p>“그리고 여기 있는 이들은 이제 갈 데가 없다. 그러면 누군가는 문 앞에 있어 주어야지.”</p><p>헤르메스는 그 말을 오래 기억했어요. 나중에 아주 많은 심부름을 하고 아주 많은 문 앞에 서게 되었을 때에도요.</p><p>문 안쪽에서 아주 작은 소리가 났어요. 누군가 낮게 노래를 흥얼거리는 소리였지요. 그 소리는 금세 그쳤어요.</p><p>헤르메스가 위로 올라갔어요. 발목의 작은 날개가 어둠 속에서 잠깐 반짝였어요. 하데스는 그 자리에 남았어요.</p><p>케르베로스가 다가와 옆에 앉았어요. 하데스는 가운데 머리에 손을 얹었어요. 케르베로스가 눈을 반쯤 감았지요.</p><p>하데스는 자기 나라를 천천히 둘러보았어요. 잿빛 들판, 향기 없는 하얀 꽃, 소리 나지 않는 강, 낮게 이야기하는 사람들.</p><p>부족한 것은 하나도 없었어요. 다투는 이도 없고, 굶는 이도 없고, 우는 이도 거의 없었지요. 잘 다스려진 나라였어요.</p><p>가끔 강 건너에서 새로 온 이가 들어왔어요. 그때만 문 쪽이 잠깐 부산했지요. 곧 다시 조용해졌고요. 하데스는 한참 서 있었어요. 그러고는 아무에게도 들리지 않게 혼잣말을 했어요.</p><p>“여기는 너무 조용하구나.”</p></article></noscript>
