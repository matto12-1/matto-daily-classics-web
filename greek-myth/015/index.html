  <noscript><article class="ns-text"><h1>형제에게 맡겨진 선물 자루</h1><h2>북쪽에서 내려온 바람</h2><p>그날 아침 올림포스산의 화로가 이상했어요. 불이 한쪽으로 확 눕더니 좀처럼 다시 서지 못했어요. 헤스티아가 나뭇가지를 한 개비 더 넣었어요. 그래도 불은 자꾸 눕기만 했지요.</p><p>기둥 사이로 들어온 바람이 북쪽에서 오고 있었어요. 여태 없던 찬 바람이었어요. 제우스가 신들을 불러 모았어요. 손에는 아무것도 들려 있지 않았어요. 제우스는 산 아래 들판을 한참 내려다보다가 입을 열었어요.</p><p>“저 찬 바람이 어디까지 내려올 것 같으냐?”</p><p>신들이 서로를 쳐다보았어요. 그때까지 세상에 그만한 추위는 온 적이 없었거든요. 겨울이면 바람이 차가워지고 물가에 살얼음이 앉기는 했지요. 그런데 이번 바람은 결이 달랐어요. 지나간 자리마다 땅이 돌처럼 굳었으니까요.</p><p>바다를 맡은 이가 먼저 대답했어요. 북쪽 바다 끝이 이미 단단하게 굳었다고요. 배를 대던 자리가 하얗게 얼어붙어서 노가 들어가지 않는다고요.</p><p>“그러면 이번 추위는 며칠로 끝나지 않겠구나.”</p><p>제우스가 말했어요. 산꼭대기가 잠깐 조용해졌어요. 신들은 그 말을 그리 무겁게 듣지 않았어요. 신들은 추위를 타지 않으니까요. 찬 바람이 불면 그냥 부는가 보다 하는 거지요. 몇몇은 벌써 다른 이야기를 하고 있었어요.</p><p>그런데 한 사람만 아래를 계속 내려다보고 있었어요. 아테나였어요. 아테나는 늘 남들이 다 본 뒤에 한 번 더 보는 쪽이었지요.</p><p>“그러면 저 아래는 어떻게 되나요?”</p><p>아테나가 물었어요. 신들이 아테나가 보는 쪽을 따라 보았어요. 들판이 있고, 숲이 있고, 강이 있었어요. 그 사이사이에 사람들이 세운 마을이 흩어져 있었지요. 낮은 돌담이 둘려 있고, 지붕들이 다닥다닥 붙어 있었어요.</p><p>“저기 사는 것들은 이번 추위를 날 채비가 없어요. 짐승도 사람도요. 여태 이만한 추위는 겪어 본 적이 없으니까요.”</p><p>제우스가 눈을 가늘게 떴어요. 정말 그랬어요. 숲속의 것들은 털이 얇았고, 물가의 것들은 껍데기가 무르고 얇았어요. 사람들은 짐승 가죽 한 장을 어깨에 걸치고 다녔지요. 그 한 장으로 여름을 났고, 여태 그걸로 충분했고요.</p><p>“저 추위가 여기까지 내려오면 저것들은 못 견뎌요. 지금 그대로는요.”</p><p>아테나가 덧붙였어요. 산꼭대기가 조용해졌어요.</p><p>“그럼 채비를 시켜 주면 된다. 무엇이 있어야 저 바람을 견디는지 하나씩 챙겨 주면 될 일이다.”</p><p>제우스가 말했어요. 그러고는 주위를 둘러보았어요.</p><p>“누가 그 채비를 맡겠느냐?”</p><p>신들은 서로 눈치만 보았어요. 하늘이며 바다며 저승이며, 다들 자기 몫으로도 벅찼거든요. 게다가 그 일은 손이 아주 많이 가는 일이었어요. 땅 위에 사는 것이 몇인지 세어 본 사람조차 없었으니까요.</p><p>그때 아테나가 두 사람의 이름을 말했어요.</p><h2>먼저와 나중, 두 형제</h2><p>티탄 가운데에는 제우스와 싸우지 않은 이들도 있었어요. 그 오랜 싸움에 아예 끼지 않고 조용히 지낸 형제였지요. 형의 이름은 프로메테우스, 동생의 이름은 에피메테우스였어요.</p><p>두 이름에는 뜻이 있었어요. 프로메테우스는 먼저 생각하는 사람이라는 뜻이고, 에피메테우스는 나중에 생각하는 사람이라는 뜻이에요. 그리고 이 형제는 정말로 그런 형제였어요.</p><p>형은 무슨 일이든 오래 들여다보았어요. 남들이 다 끝내고 자리를 뜬 뒤에도 혼자 서서 보고 있는 일이 많았지요. 무언가를 시작하기 전에 먼저 앉아서 한참을 생각했고, 그래서 답답하다는 소리를 자주 들었어요.</p><p>반대로 동생은 몸이 먼저 움직였어요. 좋아 보이면 일단 시작하고, 아차 하는 것은 늘 그다음이었지요. 그래도 미워할 수가 없었어요. 웃는 얼굴이었고, 남이 부탁하면 거절할 줄을 몰랐거든요.</p><p>두 형제가 올림포스산으로 올라왔어요. 형은 걸음이 느렸고, 동생은 계단을 두 개씩 뛰어 올라왔어요. 동생은 올라오자마자 산꼭대기를 두리번거렸어요. 여기에 처음 와 본 거였거든요.</p><p>제우스가 커다란 가죽 자루 하나를 앞에 내놓았어요. 자루는 어른 키만 했고 아래쪽이 불룩했어요. 끈이 단단히 매여 있었고, 겉으로도 안에 든 것들이 울퉁불퉁 비쳐 보였지요.</p><p>“땅 위에 사는 것들에게 하나씩 나눠 주어라. 이 자루 안에 저 바람을 견딜 것들이 들어 있다.”</p><p>프로메테우스가 자루 앞에 쭈그리고 앉았어요. 그러고는 손바닥으로 자루를 몇 번 눌러 보았어요.</p><p>“몇 개나 들어 있습니까?”</p><p>“자루에 든 것은 세어 보지 않았다. 다만 땅 위에 사는 것들에게 한 번씩 돌아가면 넉넉할 것이다.”</p><p>“한 번씩이라면, 받을 것이 몇인지부터 알아야겠네요.”</p><p>프로메테우스가 말했어요. 제우스는 그 말에 잠깐 웃었어요. 역시 저 사람이구나 싶었거든요.</p><h2>자루를 연 동생</h2><p>그사이 동생은 벌써 자루 끈을 붙잡고 있었어요. 당장이라도 매듭을 풀 기세였지요.</p><p>“나눠 주는 일은 제가 할게요. 형은 원래 오래 들여다보잖아요.”</p><p>에피메테우스가 말했어요. 프로메테우스는 자루를 한 번 보고, 동생을 한 번 보았어요.</p><p>“세어 보고 나눠라. 받을 것이 몇인지부터 세는 거야.”</p><p>“알았어요.”</p><p>“정말 알았어?”</p><p>“정말요. 세고 나서 나눌게요.”</p><p>동생은 그렇게 대답하면서 벌써 자루를 끌고 산을 내려가고 있었어요. 프로메테우스는 그 뒷모습을 잠깐 보다가 반대쪽으로 걸음을 옮겼어요.</p><p>에피메테우스는 들판 한가운데에 자루를 내려놓고 끈을 풀었어요. 자루 입에서 따뜻한 김이 훅 올라왔어요. 안을 들여다보니 온갖 것이 뒤엉켜 있었어요. 털뭉치, 깃털, 반질반질한 껍데기 조각, 뾰족한 것들.</p><p>짐승들이 하나둘 모여들었어요. 처음에는 멀찍이 서서 구경만 하다가, 곧 자루 앞으로 줄을 섰지요. 줄은 들판을 가로질러 숲 가장자리까지 이어졌어요. 털 짧은 것과 발 빠른 것이 앞뒤로 섞여 섰고, 뒤쪽에서는 서로 밀지 말라고 툴툴거리는 소리도 났어요. 에피메테우스는 그 줄을 한 번 훑어보고는 씩 웃었어요.</p><p>“자, 하나씩 오세요!”</p><p>에피메테우스가 소리쳤어요. 그러고는 자루 안에 팔을 쑥 집어넣었어요. 맨 먼저 온 것은 산에 사는 짐승이었어요. 에피메테우스는 두툼한 털을 한 아름 꺼내 등에 덮어 주었어요. 얇던 털 위에 그 털이 겹으로 얹히면서 그 짐승의 것이 되었어요.</p><p>“이만하면 눈밭에서도 끄떡없겠네요.”</p><p>에피메테우스가 흐뭇하게 말했어요. 다음은 다리가 가는 것들이었어요. 에피메테우스는 그 다리에 힘줄을 한 겹 더 넣어 주었어요. 그것들은 그 자리에서 껑충 뛰더니 들판 저쪽까지 갔다가 되돌아왔지요. 발이 빠르면 추운 밤에도 몸이 식지 않으니까요.</p><p>그다음은 이빨과 발톱이었어요. 큰 짐승에게는 더 날카로운 것을 주고, 작은 짐승에게는 언 땅도 파고 들어갈 수 있는 앞발을 주었어요. 굴을 깊이 팔 줄 알면 추운 철 내내 땅 밑에서 지낼 수 있거든요.</p><p>물가에 사는 것들에게는 더 단단한 껍데기를 주었어요. 등에 얹어 주자 그것이 저절로 몸에 맞게 오므라들었지요. 하늘을 나는 것들에게는 깃털을 한 겹 더 얹어 주었어요. 찬 바람이 불어도 속까지 시리지 않게요.</p><p>밤에 다니는 것들에게는 어둠 속에서도 보이는 눈을 주었어요. 굴에서 겨울을 나는 것들에게는 봄까지 내처 자는 잠을 주었고요. 물속에 사는 것들에게는 얼음 아래에서도 숨 쉬는 법을 주었지요.</p><p>에피메테우스는 정말 신이 났어요. 하나를 줄 때마다 그 짐승이 달라지는 것이 눈에 보였거든요. 방금 전까지 떨고 있던 것이 털을 얻고 나서 몸을 한 번 부르르 털고 숲으로 걸어 들어갈 때, 에피메테우스는 저도 모르게 웃었어요.</p><p>“이건 정말 좋은 일이야.”</p><p>에피메테우스가 혼잣말을 했어요. 자루는 조금씩 홀쭉해지고 있었어요. 그런데 동생은 그것을 보지 못했어요. 앞에 늘어선 줄만 보였거든요. 줄이 아직 길게 남아 있으니 자루도 아직 넉넉하려니 했지요.</p><p>그때 프로메테우스는 어디 있었을까요. 형은 그동안 땅을 걷고 있었어요. 산등성이를 넘고, 강을 건너고, 바닷가까지 갔다가 되돌아왔어요. 걸으면서 세었지요. 숲에 사는 것이 몇, 물가에 사는 것이 몇, 굴에 사는 것이 몇.</p><p>그리고 마지막으로 사람들이 사는 마을에 들렀어요. 마을은 낮은 언덕 아래에 있었어요. 돌담이 둘려 있고, 가운데에는 마당이 있었어요. 아이들이 마당에서 돌멩이를 던지며 놀고 있었지요.</p><p>프로메테우스는 담 밖에 서서 그것을 오래 보았어요.</p><p>사람들은 짐승보다 느렸어요. 이빨은 작았고, 손톱은 무디었고, 살갗은 얇았어요. 밤에는 앞을 못 보았고, 물에 들어가면 금세 지쳤어요. 나무를 잘 타는 것도 아니고 헤엄을 잘 치는 것도 아니었어요. 어느 쪽으로 보아도 남달리 잘하는 것이 하나도 없었지요.</p><p>그런데 프로메테우스는 한 가지를 보았어요. 어떤 아이가 뾰족한 돌을 주워 다른 돌에 대고 갈고 있었어요. 한참을 갈더니 그것으로 나뭇가지를 깎았어요. 깎은 가지를 다른 아이에게 건넸고, 그 아이는 그걸로 땅에 그림을 그렸어요.</p><p>“이거 봐. 아까보다 잘 들어.”</p><p>돌을 갈던 아이가 옆 아이에게 말했어요. 두 아이가 머리를 맞대고 그 돌을 들여다보았어요. 손이었어요. 사람에게 있는 것은 손이었어요. 손은 무언가를 쥐게 되어 있었지요.</p><p>프로메테우스는 담 밖에서 고개를 끄덕였어요. 그러고는 들판 쪽으로 걸음을 돌렸어요. 이제 동생에게 셈을 알려 주면 되니까요.</p><p>그런데 들판 쪽이 이상했어요. 사람들이 웅성거리는 소리가 바람을 타고 들려왔거든요.</p><h2>줄 끝에 남은 차례</h2><p>해가 기울 무렵, 들판에 남은 것은 사람들뿐이었어요. 사람들이 줄 끝에 서 있었어요. 어른들이 앞에, 아이들이 그 뒤에 섰지요. 아침부터 기다렸는데도 아무도 자리를 뜨지 않았어요. 저 자루에서 좋은 것이 나온다는 걸 온종일 보았으니까요.</p><p>에피메테우스가 자루에 팔을 넣었어요. 팔이 자루 바닥에 닿았어요. 손끝에 아무것도 걸리지 않았어요. 에피메테우스는 자루를 두 손으로 들어 흔들었어요. 그러고는 뒤집었어요. 마른 부스러기 몇 개가 툭툭 떨어졌어요.</p><p>자루는 비어 있었어요. 에피메테우스는 그 자리에 굳어 섰어요. 뒤집힌 자루가 손에서 스르르 미끄러졌어요.</p><p>사람들은 아직 무슨 일인지 몰랐어요. 앞줄에 선 사람이 목을 빼고 자루 쪽을 들여다보았어요. 아이 하나가 어머니에게 우리 차례는 언제냐고 물었어요.</p><p>그때 프로메테우스가 들판으로 내려왔어요. 형은 자루를 보고, 사람들을 보고, 동생을 보았어요. 그러고는 아무 말도 하지 않았어요.</p><p>“형.”</p><p>에피메테우스가 겨우 입을 열었어요.</p><p>“자루에 하나도 안 남았어요.”</p><p>“받을 것이 몇인지 먼저 세어 보라고 했잖아.”</p><p>“세려고 했는데, 줄이 자꾸 길어져서요. 앞에서 기다리는데 어떻게 안 주고 세고 있어요.”</p><p>동생의 목소리가 떨렸어요. 프로메테우스는 동생을 나무라지 않았어요. 나무란다고 자루가 다시 차는 것도 아니니까요.</p><p>프로메테우스는 사람들 쪽으로 걸어갔어요. 그리고 맨 앞에 선 사람 앞에 쭈그리고 앉았어요. 그 사람이 얼떨결에 손을 내밀었어요.</p><p>손이었어요. 손가락이 다섯 개, 그것뿐이었어요. 발톱도 없고 두꺼운 털도 없었어요. 껍데기도 없었고요. 살갗은 얇아서 눌러 보면 자국이 남았어요. 이빨은 작고 반듯했지요.</p><p>프로메테우스는 그 손을 한참 들여다보았어요. 그러고는 일어섰어요.</p><p>“잠깐만 기다려 보세요.”</p><p>프로메테우스가 사람들에게 말했어요. 그리고 산 쪽으로 걸음을 옮겼어요. 산꼭대기에서 제우스가 아래를 보고 있었어요. 프로메테우스가 올라오는 것을 벌써 보았지요.</p><p>“자루가 비어서 사람들 몫이 없어요.”</p><p>프로메테우스가 말했어요. 제우스는 고개를 끄덕였어요.</p><p>“나도 여기서 보았다.”</p><p>“사람들에게 줄 것을 하나만 더 주세요. 무엇이든 좋습니다.”</p><p>“나눠 줄 것은 그 자루가 전부였다. 한 번씩만 돌아가게 되어 있었고.”</p><p>제우스가 말했어요. 화가 난 목소리는 아니었어요. 다만 조금도 물러설 것 같지 않았지요.</p><p>“그럼 아무것도 못 받은 저 사람들은 어떻게 합니까?”</p><p>“사람들에게는 손이 있지 않으냐. 그리고 서로가 있고. 그만하면 적지 않다.”</p><p>프로메테우스는 그 말에 곧바로 대꾸하지 못했어요. 틀린 말이 아니었으니까요. 다만 오늘 밤 당장 얼어붙는 손에게 그 말이 무슨 소용일까 싶었지요.</p><p>프로메테우스는 산꼭대기를 천천히 둘러보았어요. 기둥 사이로 불빛이 새어 나오고 있었어요. 올림포스산에는 밤에도 꺼지지 않는 불이 있었거든요. 그 빛이 돌바닥 위에 길게 누워 있었어요.</p><p>프로메테우스의 눈이 그 빛에 오래 머물렀어요.</p><p>“그럼 저 불을 사람들에게 주세요.”</p><p>제우스가 프로메테우스를 돌아보았어요. 목소리가 한 뼘쯤 낮아졌어요.</p><p>“불은 안 된다. 불은 우리 신들의 것이다.”</p><p>“왜 안 되지요?”</p><p>“불을 가진 것은 우리 신들뿐이어야 하니까. 저것들 손에 불이 들어가면, 다음에는 무엇을 달라고 할 것 같으냐?”</p><p>프로메테우스는 더 묻지 않았어요. 고개를 한 번 숙이고 돌아섰어요. 내려가는 그 뒷모습을 아테나가 기둥 뒤에서 보고 있었어요. 아테나도 아무 말을 하지 않았어요. 부르려다 만 사람처럼 한 발을 내디뎠다가, 그대로 도로 물러섰지요.</p><p>그날 밤 그 추위가 산 아래까지 내려왔어요.</p><p>바람이 북쪽에서 내려왔어요. 풀잎 끝이 하얗게 얼었어요. 웅덩이에는 살얼음이 앉았지요. 숲에서는 아무 소리도 나지 않았어요. 털을 얻은 것들은 벌써 굴로 들어갔고, 깃털을 얻은 것들은 서로 몸을 붙이고 나뭇가지 위에 앉아 있었으니까요.</p><p>사람들만 밖에 있었어요.</p><p>사람들은 돌담 안에 모여 앉았어요. 짐승 가죽을 나눠 덮고, 서로 등을 맞대고, 아이들을 가운데에 앉혔어요. 그러고도 이가 딱딱 부딪혔어요. 어떤 아이는 어머니 품에 얼굴을 묻었어요. 우는 소리는 얼마 못 가 잦아들었어요. 울 힘도 아까웠거든요.</p><p>에피메테우스는 담 밖 마른 풀밭에 웅크리고 앉아 있었어요. 빈 자루를 아직도 손에 쥐고 있었지요. 동생은 그날 밤 한 번도 마을 쪽을 쳐다보지 못했어요.</p><p>산 중턱 바위에는 프로메테우스가 앉아 있었어요.</p><p>프로메테우스는 무릎에 팔을 얹고 아래를 내려다보았어요. 마을 하나하나가 다 보였어요. 어느 담 안에서 누가 몸을 뒤척이는지까지 보였지요. 바람이 방향을 바꿀 때마다 사람들이 조금씩 자리를 옮기는 것도, 아이를 안쪽으로 밀어 넣는 것도요.</p><p>밤이 아주 길었어요. 프로메테우스는 한 번도 자리에서 일어나지 않았어요. 저 아래 어디에도, 작은 빛 하나가 없었거든요.</p></article></noscript>
