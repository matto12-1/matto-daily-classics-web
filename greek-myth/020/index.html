  <noscript><article class="ns-text"><h1>큰 물, 그리고 돌</h1><h2>세상 끝 바위 앞에서</h2><p>그해 여름이 끝날 무렵이었어요. 데우칼리온은 아침 일찍 길을 나섰어요. 아내 피라가 물병과 마른 빵을 자루에 넣어 주었지요. 두 사람은 이 길을 여러 번 걸어 보았어요. 세상 끝 바위까지 가려면 꼬박 사흘이 걸렸거든요.</p><p>데우칼리온은 프로메테우스의 아들이었어요. 아버지가 바위에 묶인 뒤로, 해마다 몇 번씩 그 앞까지 걸어가 하루를 앉았다 오곤 했어요.</p><p>피라는 에피메테우스의 집안 사람이었어요. 그러니까 두 사람은 먼 사촌이면서 부부였지요. 세상이 아직 좁던 때라, 지금 우리가 아는 것과는 사뭇 달랐어요.</p><p>가는 길에 두 사람은 마을 몇 개를 지났어요. 담이 높아진 마을이었어요. 어느 집 앞에서는 두 사람이 서로 밀치며 다투고 있었지요.</p><p>“요즘은 어딜 가나 저래요.”</p><p>피라가 낮게 말했어요. 데우칼리온은 고개만 끄덕였어요. 사흘째 되던 날 오후에 두 사람은 바위에 닿았어요.</p><p>바위는 하늘과 바다가 맞닿는 자리에 있었어요. 바람이 늘 한쪽으로만 불었어요. 풀 한 포기 자라지 않는 곳이었지요.</p><p>프로메테우스는 눈을 뜨고 있었어요. 두 사람이 언덕을 올라오는 것을 아주 멀리서부터 보고 있었거든요. 묶인 뒤로 세월이 얼마나 흘렀는지 데우칼리온도 세지 않았어요. 그동안 독수리는 하루도 거르지 않았고, 프로메테우스는 그 오랜 세월을 견뎠지요.</p><p>“왔구나.”</p><p>“아버지.”</p><p>“오래 있지 마라.” 프로메테우스가 말했어요. “내가 할 말만 듣고 어서 가거라.”</p><p>피라가 물병을 꺼내 아버지의 입에 대어 주었어요. 프로메테우스는 두어 모금을 마시고 고개를 돌렸어요. 그러고는 아들의 얼굴을 오래 보았어요. 무슨 말을 먼저 해야 할지 고르는 얼굴이었지요.</p><p>“배를 만들어라.”</p><p>데우칼리온은 무슨 말인지 알아듣지 못했어요. 두 사람이 사는 곳은 산기슭이었어요. 바다까지는 걸어서 며칠이었지요.</p><p>“산기슭에 사는 저희가 배는 왜 만듭니까?”</p><p>“큰 배가 아니어도 된다. 둘이 들어가 누울 만하면 된다. 뚜껑을 덮을 수 있게 만들어라. 틈마다 송진을 발라라. 그리고 아흐레치 먹을 것을 실어라.”</p><p>“아버지, 무슨 일이 있는 겁니까?”</p><p>“큰비가 온다. 세상이 다 잠길 만큼.”</p><p>프로메테우스는 그 말만 했어요. 먼저 생각하는 사람이었으니까요. 데우칼리온은 하늘을 올려다보았어요. 구름 한 점 없었어요. 그해 여름은 유난히 볕이 좋았거든요.</p><p>“비가 얼마나 옵니까?”</p><p>“아흐레 동안 온다.”</p><p>피라가 앞으로 나섰어요.</p><p>“다른 사람들에게도 알려야 하지 않을까요?”</p><p>“알려라.” 프로메테우스가 말했어요. “믿는 사람이 하나라도 있으면 좋겠구나.”</p><p>목소리가 아주 조용했어요. 바람이 한 번 지나가면서 그 말을 거의 지워 버렸어요. 두 사람이 언덕을 내려갈 때 프로메테우스가 등 뒤에서 한마디를 더 했어요.</p><p>“물이 빠지거든, 신들이 하는 말을 곧이곧대로 듣지 마라.”</p><p>데우칼리온은 돌아보았어요. 아버지는 이미 눈을 감고 있었어요. 집으로 돌아온 두 사람은 그날부터 배를 만들기 시작했어요.</p><p>데우칼리온은 마을을 돌며 그 이야기를 했어요. 큰 비가 올 거라고, 배를 만들라고요. 사람들은 웃었어요. 어떤 사람은 화를 냈어요. 밀이 한창 여물어 가는 때였거든요.</p><p>“산기슭에 배를 지어 놓고 뭘 하겠다는 거요?”</p><p>한 사람이 그렇게 물었어요. 데우칼리온은 대답하지 못했어요. 자기도 잘 몰랐으니까요. 다만 아버지가 한 말을 믿었을 뿐이에요.</p><p>“비가 온다고 누가 그럽디까?”</p><p>“제 아버지가 그러셨어요.”</p><p>“바위에 묶여 있다는 그분 말이오?”</p><p>사람들이 서로 눈짓을 했어요. 데우칼리온은 더 말하지 않고 돌아섰어요. 피라는 아무에게도 따지지 않았어요. 대신 밤늦게까지 널빤지를 다듬었지요. 손바닥에 물집이 잡히면 헝겊을 감고 또 다듬었어요.</p><p>“사람들이 비웃는데 억울하지 않아요?”</p><p>어느 밤에 데우칼리온이 물었어요.</p><p>“억울할 시간에 하나라도 더 붙이는 게 낫지요.”</p><p>배는 열이레 만에 다 되었어요. 배라기보다는 커다란 궤짝에 가까웠어요. 뚜껑이 달려 있었고, 틈마다 송진을 두껍게 발랐지요.</p><p>안에는 마른 곡식과 물독을 실었어요. 담요도 넣고, 불씨를 담은 작은 그릇도 넣었어요. 마을 아이들이 담 너머로 그것을 구경했어요. 어른들은 이제 웃지도 않았어요. 웃지 않는 대신 눈길도 주지 않았지요.</p><p>다 만든 날 저녁, 두 사람은 궤짝 옆에 앉아 하늘을 보았어요. 별이 아주 많았어요.</p><p>“비가 정말 올까요?”</p><p>“아버지 말씀이니 오겠지요.”</p><p>“안 오면요?”</p><p>“안 오면 좋고요.” 데우칼리온이 말했어요. “안 오면 이걸 헛간으로 쓰면 되지요.”</p><p>피라가 웃었어요. 그날 밤 두 사람이 웃은 것은 그게 마지막이었어요.</p><h2>아흐레 동안 내린 비</h2><p>비는 어느 날 아침에 시작되었어요. 처음에는 반가운 비였어요. 여름내 마른 밭에 물이 들었으니까요. 사람들이 마당에 나와 하늘을 올려다보았지요.</p><p>그런데 그 비가 그치지 않았어요. 하루가 지나고 이틀이 지나도 하늘은 똑같은 잿빛이었어요. 사흘째 되던 날 개울이 넘쳤어요. 나흘째에는 강이 길을 삼켰어요.</p><p>닷새째 되던 날 아침, 데우칼리온과 피라는 궤짝에 올랐어요. 물이 벌써 마당까지 들어와 있었지요.</p><p>뚜껑을 덮기 전에 두 사람은 마을 쪽을 한 번 돌아보았어요. 빗줄기 때문에 지붕들이 뿌옇게 보였어요. 누군가 이쪽으로 뛰어오고 있는 것 같았는데, 다시 보니 아니었어요.</p><p>“누가 오는지 조금만 더 기다려 볼까요?”</p><p>피라가 물었어요. 데우칼리온은 대답 대신 마을 쪽을 한참 더 보았어요. 그러고는 뚜껑을 덮었어요. 그 뒤로 두 사람은 그날 이야기를 서로 꺼내지 않았어요.</p><p>물은 하루가 다르게 높아졌어요. 낮은 밭이 먼저 잠기고, 그다음에 마을이 잠겼어요. 언덕이 섬이 되었다가, 섬이 점이 되었다가, 마침내 점도 보이지 않게 되었어요.</p><p>산꼭대기까지 물이 올라왔어요. 세상에 마른땅이라고는 남지 않았어요. 물 위에 뜬 것은 궤짝 하나뿐이었어요.</p><p>아무리 신들의 왕이라 해도, 온 세상을 통째로 지우는 건 너무했지요. 궤짝 안은 캄캄했어요. 뚜껑 틈으로 빗물이 조금씩 새어 들어왔어요. 피라가 그것을 헝겊으로 받아 짜냈지요.</p><p>두 사람은 날을 셌어요. 널빤지에 손톱으로 금을 그었어요. 하루에 하나씩요. 빗소리 말고는 아무 소리도 들리지 않았어요. 새소리도, 사람 소리도요.</p><p>“바깥에 아직 살아 있는 사람이 있을까요?”</p><p>엿새째 밤에 피라가 물었어요.</p><p>“우리 말고 다른 사람 말이에요?”</p><p>“네, 누구든요. 한 사람이라도요.”</p><p>데우칼리온은 대답하지 못했어요. 대신 피라의 손을 잡았어요. 두 사람 다 손이 차가웠어요. 이레째에는 궤짝이 무언가에 세게 부딪혔어요. 나무가 우지끈 소리를 냈지요. 물이 조금 들어왔지만 송진 덕분에 크게 새지는 않았어요.</p><p>이레째 밤에 데우칼리온이 물었어요.</p><p>“아버지는 물에 잠기지 않고 바위 위에 계실까요?”</p><p>“그 바위는 아주 높은 곳에 있잖아요.”</p><p>“그래도 물이 그 바위보다 높이 차오르면요?”</p><p>피라는 대답하지 않았어요. 어둠 속에서 널빤지에 금 하나를 더 그었을 뿐이에요. 여드레째에 불씨 그릇이 꺼졌어요. 피라가 한참 들여다보다가 뚜껑을 덮었어요.</p><p>“불씨는 다시 붙이면 돼요.”</p><p>피라가 말했어요. 어디에 가서 붙이겠다는 것인지는 말하지 않았어요. 아흐레째 되던 날 아침, 빗소리가 멎었어요.</p><p>너무 조용해서 오히려 잠이 깼어요. 데우칼리온이 뚜껑을 조금 밀어 보았어요. 빛이 들어왔어요. 궤짝은 어느 높은 산의 꼭대기에 걸려 있었어요. 두 사람이 아는 산이었어요. 맑은 날이면 집 마당에서도 그 봉우리가 보였거든요.</p><p>하늘은 씻은 듯이 갰어요. 그런데 아래를 내려다보니 온통 물이었어요. 물은 아무 소리도 내지 않고 가만히 있었어요.</p><p>물이 천천히 빠지기 시작했어요. 하루가 다르게 낮아졌어요. 봉우리가 하나둘 물 밖으로 올라왔어요. 그러고는 능선이, 골짜기가, 마침내 들판이 드러났어요.</p><p>물이 다 빠진 세상은 온통 진흙이었어요. 나무는 뿌리째 뽑혀 누워 있었고, 집이 있던 자리에는 아무것도 없었어요.</p><p>두 사람은 궤짝에서 내려 걸었어요. 하루를 걸었어요. 이틀을 걸었어요. 아무도 만나지 못했어요. 에피메테우스의 집 앞도 지나갔어요. 흰 벽도 붉은 지붕도 남아 있지 않았어요.</p><p>“여보세요!”</p><p>피라가 골짜기를 향해 소리쳐 보았어요. 소리가 되돌아왔어요. 그것뿐이었어요. 저녁이면 두 사람은 마른자리를 찾아 앉았어요. 말수가 점점 줄었지요. 할 말이 없어서가 아니라, 말을 하면 이 조용함이 더 크게 들렸기 때문이에요.</p><p>둘째 날 밤에 피라가 물었어요.</p><p>“신들이 우리 둘만 남으라고 살려 주신 걸까요?”</p><p>“그건 아닐 거예요.”</p><p>“그럼 왜 우리만 살려 주셨을까요?”</p><p>데우칼리온은 대답하지 못했어요. 다만 아버지가 마지막에 한 말을 자꾸 되새겼지요. 물이 빠지거든 신들이 하는 말을 곧이곧대로 듣지 말라던 그 말이요.</p><h2>무너진 신전 앞에서</h2><p>사흘째 되던 날, 두 사람은 언덕 위에서 낡은 신전을 하나 찾았어요. 지붕은 반쯤 무너졌고 기둥에는 진흙이 허리까지 말라붙어 있었어요. 그래도 서 있었어요. 그 넓은 세상에서 유일하게 서 있는 것이었지요.</p><p>두 사람은 신전 앞에 무릎을 꿇었어요. 피라가 먼저 말했어요.</p><p>“우리 둘만 남았습니다. 어떻게 해야 하는지 알려 주세요.”</p><p>한참 아무 소리도 나지 않았어요. 그러다가 무너진 기둥 사이로 바람이 지나가면서 소리가 났어요. 바람 소리 같기도 하고 사람 목소리 같기도 했지요.</p><p>“머리에 쓴 것을 벗어라. 옷의 띠를 풀어라. 그리고 어머니의 뼈를 등 뒤로 던져라.”</p><p>그것이 전부였어요. 소리는 다시 나지 않았어요. 피라가 벌떡 일어섰어요.</p><p>“어머니의 뼈를 던지는 건 못 해요.”</p><p>얼굴이 하얗게 질려 있었어요.</p><p>“어머니의 뼈라니요. 신들이 그런 걸 시킬 리가 없어요.”</p><p>피라는 그렇게 말하고 신전에서 몇 걸음 물러섰어요. 어깨가 떨리고 있었어요. 데우칼리온은 아무 말도 하지 않았어요. 신전 앞에 앉아 오래 생각했어요. 해가 기울 때까지요.</p><p>그러다가 데우칼리온이 천천히 말했어요.</p><p>“아버지가 그러셨어요. 신들이 하는 말은 곧이곧대로 듣는 게 아니라고요.”</p><p>“그게 무슨 뜻이에요?”</p><p>“우리 어머니 말고요.” 데우칼리온이 발밑을 내려다보았어요. “우리 모두의 어머니요.”</p><p>피라도 발밑을 보았어요. 진흙이 마르면서 쩍쩍 갈라진 땅이었어요.</p><p>“땅이요?”</p><p>“그럼 뼈는…….”</p><p>두 사람은 동시에 고개를 들었어요. 언덕에는 돌이 잔뜩 널려 있었어요. 물이 쓸고 간 자리마다 흙이 씻겨 나가 돌이 그대로 드러나 있었지요.</p><p>피라가 돌 하나를 집어 들었어요. 매끈하고 둥근 돌이었어요. 손안에서 아직 서늘했어요.</p><p>“이 돌을 던지라는 걸까요?”</p><p>“땅이 어머니라면, 땅속의 돌이 어머니의 뼈니까요.”</p><p>“맞는지는 던져 봐야 알지요.”</p><p>두 사람은 머리에 쓴 것을 벗고 띠를 풀었어요. 그러고는 돌을 하나씩 주웠어요. 데우칼리온이 먼저 던졌어요. 뒤를 돌아보지 않고, 등 뒤로요.</p><p>돌이 진흙에 툭 떨어지는 소리가 났어요. 그것 말고는 아무 소리도 나지 않았어요. 피라는 잠깐 망설였어요. 그러다가 눈을 질끈 감고 돌을 등 뒤로 던졌어요.</p><p>하나, 둘, 셋. 두 사람은 걸으면서 계속 던졌어요. 언덕을 내려가며 던지고, 들판을 지나며 던졌어요. 한참 뒤에, 등 뒤에서 이상한 소리가 들리기 시작했어요. 데우칼리온이 걸음을 멈추었어요. 그리고 돌아보았어요.</p><p>던진 돌들이 부풀어 오르고 있었어요. 돌이 물러지고, 모양이 잡히고, 빛깔이 돌았어요. 데우칼리온이 던진 돌에서는 남자가 일어섰고, 피라가 던진 돌에서는 여자가 일어섰어요.</p><p>진흙을 털며 몸을 일으키는 사람들이 들판 여기저기에 있었어요. 어떤 사람은 앉아서 두리번거렸고, 어떤 사람은 벌써 걷고 있었어요.</p><p>피라는 그 자리에 주저앉았어요. 무섭기도 하고 기쁘기도 해서, 어느 쪽인지 자기도 알 수 없었지요. 그들은 아무 말도 하지 않았어요. 다만 두 사람을 한 번씩 보고는 사방으로 걸어갔어요. 골짜기 쪽으로, 강 쪽으로, 바다 쪽으로요.</p><p>피라가 데우칼리온의 손을 잡았어요. 손이 떨리고 있었어요. 새로 일어선 사람들은 서로를 알아보지 못했어요. 그래도 부딪히면 비켜 주었고, 넘어진 사람이 있으면 잡아 일으켰어요. 누가 가르쳐 준 것도 아닌데요.</p><p>“우리는 이제 뭘 하지요?”</p><p>“살아야지요.”</p><p>“그것뿐이에요?”</p><p>“살아가는 것부터 해야지요.”</p><p>데우칼리온이 말했어요. 그러고는 남은 돌 하나를 손에서 놓았어요. 그날 이후로 사람들은 자기들이 돌에서 왔다는 이야기를 하게 되었어요. 그래서 마음이 단단하고, 잘 견디고, 좀처럼 울지 않는다고요.</p><p>세상은 다시 채워졌어요. 항아리에서 나왔던 것들도 그대로 있었어요. 병도, 슬픔도, 미움도요. 큰 물이 그것들까지 씻어 가지는 못했거든요.</p><p>그렇지만 판도라의 손바닥에 남았던 그 작은 것도 함께 있었어요. 새 사람들의 마음속에도 한 알씩 들어앉았지요.</p><p>새 사람들은 물러난 물을 따라 낮은 곳으로 걸어갔어요. 가다가 서로 만나면 나란히 걸었지요.</p><p>멀리 세상 끝 바위에서는 프로메테우스가 여전히 그 자리에 있었어요. 그런데 그날은 눈을 감지 않았어요. 아들이 던진 돌에서 사람이 일어서는 것을 처음부터 끝까지 다 보았거든요.</p><p>올림포스산에서는 제우스가 아래를 내려다보고 있었어요. 이번에도 얼굴에는 아무 표정이 없었어요. 다만 비를 다시 부르지는 않았지요.</p><p>진흙이 마르는 동안 숲에서도 부스럭거리는 소리가 나기 시작했어요. 물에 밀려 갔던 것들이 하나둘 제자리로 돌아오고 있었지요. 이렇게 해서 사람들의 시대가 다시 시작되었어요.</p><p>새로 생긴 사람들이 들판으로 흩어져 걸어갔어요. 진흙이 마르고, 그 위로 풀이 돋았어요. 그리고 그 사람들이 걸어간 자리마다, 그때까지 아무도 본 적 없는 봄꽃이 하나둘 피어났어요.</p></article></noscript>
