        <div class="recap"><h3>지난 이야기</h3><ol><li>제우스와 헤라가 부부가 되고, 신들은 올림포스산에 저마다 자리를 잡았어요.</li><li>다리를 저는 아기 헤파이스토스는 산 아래로 밀려나 바닷가 님프들의 손에서 자랐지요.</li><li>어느 밤 헤파이스토스가 손수 지은 대장간에서 첫 불꽃이 튀었고, 그 망치 소리가 올림포스산까지 들려왔어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>머리에서 태어난 아테나</h1><h2>산으로 올라온 대장장이</h2><p>한밤중에 제우스가 눈을 떴어요. 또 그 소리였어요. 아주 멀리서 쨍, 쨍 하고 무언가를 두드리는 소리가 올라왔어요. 처음에는 파도 소리인 줄 알았지요. 그런데 파도는 그렇게 규칙적으로 울리지 않아요. 그 소리는 여러 날 밤 동안 이어졌어요.</p><p>그러다 어느 아침 제우스는 사람을 보내 알아보게 했어요. 돌아온 이가 이렇게 전했지요. 바닷가 동굴에 대장간이 하나 생겼는데, 거기서 나오는 물건들이 여태 본 적 없는 것들이라고요.</p><p>제우스는 그 대장장이를 올림포스산으로 불렀어요. 올라온 이는 어깨가 넓고 팔이 굵은 젊은이였어요. 걸음이 조금 느렸어요. 한쪽 다리를 살짝 끌었거든요. 수염에는 검댕이 묻어 있었고, 가죽 앞치마에는 불똥 자국이 잔뜩 나 있었어요.</p><p>산꼭대기가 잠깐 조용해졌어요. 신들이 그 젊은이를 힐끔거렸어요. 기둥 뒤에 서 있던 헤라는 그 다리를 한 번 보고는 들고 있던 돌판으로 눈을 내렸어요. 제우스는 그 얼굴을 조금 오래 보았어요. 어디선가 본 것 같았거든요.</p><p>산 아래에서 올라온 이가 왕좌 앞에 선 것은 그날이 처음이었어요. 헤파이스토스는 아무 말 없이 왕좌 앞으로 걸어갔어요. 그러고는 들고 온 것을 내려놓았어요. 손잡이가 은빛으로 빛나는 잔이었어요. 어디에도 이음매가 보이지 않는, 아주 얇고 단단한 잔이었지요.</p><p>“이 잔을 네가 만들었느냐?”</p><p>“이보다 나은 것도 만들 수 있습니다.”</p><p>그날부터 헤파이스토스의 대장간이 올림포스산에도 하나 생겼어요. 그런데 그 무렵부터 제우스는 머리가 아프기 시작했어요.</p><p>처음에는 대수롭지 않았어요. 관자놀이가 조금 지끈거리는 정도였지요. 밤에 잘 자고 나면 괜찮아졌어요. 제우스는 그냥 요즘 일이 많아서 그러려니 했어요.</p><p>제우스는 관자놀이를 손가락으로 몇 번 눌러 보았어요. 낮에는 견딜 만했어요. 그런데 해가 지면 다시 심해졌지요.</p><p>그런데 며칠이 지나자 아픔이 달라졌어요. 머리 안쪽에서 무언가가 조금씩 자라는 것 같았어요. 자라면서 벽을 밀어내는 느낌이었지요. 제우스는 이마를 짚었어요. 눌러 보면 안쪽에서 무언가가 툭, 하고 마주 미는 것 같았어요.</p><p>헤라가 곁으로 다가와 이마를 짚어 보았어요. 이마가 뜨거웠어요.</p><p>“얼굴이 안 좋아 보이는데, 어디 아파?”</p><p>헤라가 물었어요.</p><p>“머리가 좀 아파서요.”</p><p>“번개를 너무 많이 던졌나 보지.”</p><p>제우스는 웃으려고 했지만 웃음이 잘 나오지 않았어요. 그날 밤 제우스는 한숨도 자지 못했어요. 눈을 감으면 머릿속이 더 시끄러웠어요. 정말로 소리가 났거든요. 아주 작게, 무언가 부딪히는 소리 같은 것이요.</p><p>제우스는 어둠 속에서 눈을 뜨고 그 소리를 들었어요. 쨍, 쨍. 아주 낯익은 소리였지요. 그런데 제우스는 아무에게도 그 소리 이야기를 하지 않았어요. 그날 밤 하늘에서 번개가 저 혼자 몇 번 번쩍였어요.</p><p>다음 날 아침, 제우스는 왕좌에 앉아 있지 못했어요. 아픔이 아주 커졌거든요. 관자놀이가 쿵쿵 뛰었고, 눈앞이 자꾸 하얘졌어요. 제우스는 기둥을 짚고 몸을 지탱했어요.</p><p>제우스는 눈을 꼭 감고 숨을 골랐어요. 이마에 땀이 맺혔어요. 신들이 하나둘 모여들었어요. 누군가 시원한 물을 떠 왔어요. 누군가는 이마에 젖은 천을 얹어 주었어요. 아무 소용이 없었어요. 데메테르가 잠을 부르는 풀을 달여 왔지만 그것도 듣지 않았지요.</p><p>화로 앞에 앉아 있던 헤스티아가 불을 크게 돋우었어요. 그래도 누구 하나 무엇을 해야 할지 몰랐어요.</p><p>“이런 아픔은 본 적이 없어요.”</p><p>“신이 아프다니, 그런 일이 있을 수 있나요?”</p><p>신들끼리 웅성거렸어요. 헤라는 팔짱을 낀 채 아무 말도 하지 않고 남편을 지켜보았어요.</p><p>오후가 되자 제우스는 무릎을 꿇었어요. 티폰 앞에서 무릎을 꿇었던 그날 이후 처음이었어요. 손에 쥐고 있던 번개가 바닥에 굴러떨어졌어요. 파랗게 깜빡이던 빛이 잠깐 꺼졌다가 다시 들어왔어요.</p><p>산꼭대기 전체가 흔들렸어요. 제우스가 아프면 하늘도 함께 아팠으니까요. 구름이 사방으로 흩어지고, 저 아래 들판에 우박이 쏟아졌어요. 땅 위의 사람들이 무슨 일인가 하고 하늘을 올려다보았지요.</p><p>제우스가 이를 악물고 말했어요.</p><p>“대장장이를 불러 주세요.”</p><h2>도끼 한 번</h2><p>헤파이스토스는 아무도 부르러 가기 전에 이미 산꼭대기로 올라오고 있었어요. 그 소리를 자기도 들었거든요.</p><p>헤파이스토스가 산꼭대기에 올라섰어요. 손에는 아무것도 들려 있지 않았어요. 제우스는 바닥에 앉은 채로 헤파이스토스를 올려다보았어요.</p><p>“네 연장 가운데 가장 잘 드는 걸 가져와라.”</p><p>“무엇에 쓰시려고요?”</p><p>“내 머리를 열어야겠다.”</p><p>주위에 있던 신들이 한꺼번에 소리를 질렀어요. 몇몇은 뒤로 물러섰어요. 안 된다고, 그건 말도 안 된다고요. 헤라마저 한 발짝 앞으로 나섰지요.</p><p>헤파이스토스만 아무 말도 하지 않았어요. 그러고는 조용히 물었어요.</p><p>“안에서 무언가가 나오려는 겁니까?”</p><p>제우스가 고개를 끄덕였어요. 헤파이스토스는 대장간으로 내려갔어요. 그리고 곧 도끼 하나를 들고 올라왔어요. 손잡이가 짧고 날이 얇은 도끼였어요. 나무를 패는 도끼가 아니라, 아주 조심스럽게 다루어야 하는 물건처럼 보였지요.</p><p>도끼날에 불빛이 한 번 스쳤어요. 헤파이스토스의 손은 조금도 떨리지 않았어요. 여러 해 동안 뜨거운 쇠를 다뤄 온 손이었으니까요.</p><p>헤파이스토스는 제우스 앞에 무릎을 굽혔어요.</p><p>“한 번만 치겠습니다. 움직이지 마세요.”</p><p>제우스는 눈을 감았어요. 산꼭대기가 아주 조용해졌어요. 아무도 숨을 쉬지 않는 것 같았어요. 도끼가 내려왔어요.</p><p>딱, 하는 소리가 났어요. 아주 짧은 소리였어요. 그다음에 일어난 일을 본 신들은 그날 일을 평생 잊지 못했어요.</p><p>제우스의 이마가 갈라지면서 빛이 쏟아져 나왔어요. 빛이 어찌나 밝은지 신들이 모두 눈을 가렸어요. 그리고 그 빛 속에서 누군가가 뛰어나왔어요.</p><p>아기가 아니었어요. 다 자란 여신이었어요. 청동 투구를 쓰고, 둥근 방패를 들고, 갑옷을 다 갖춘 채로요. 뛰어나오면서 한 번 크게 소리를 질렀는데, 그 소리에 하늘이 울리고 바다가 출렁였어요. 저 멀리 서쪽 끝에서 하늘을 떠받치던 이도 그 소리를 들었지요.</p><p>갑옷은 갓 두드려 낸 것처럼 반짝였고, 창끝은 하늘을 향해 곧게 서 있었어요. 헤파이스토스가 도끼를 내려놓고 한 걸음 물러섰어요.</p><p>여신은 사뿐히 내려서서 방패를 옆으로 내렸어요. 그러고는 주위를 천천히 둘러보았어요. 놀란 기색이 하나도 없었어요. 마치 이 자리를 오래전부터 알고 있었던 것처럼요.</p><p>그 어깨에 조그만 올빼미 한 마리가 내려앉았어요. 어디에서 날아왔는지는 아무도 못 봤어요. 제우스가 이마를 짚고 일어섰어요. 아픔이 씻은 듯이 사라져 있었어요.</p><p>“너는 누구냐? 이름이 무엇이냐?”</p><p>“아직 이름은 없어요. 아버지가 지어 주시면 되지요.”</p><p>제우스는 잠깐 웃었어요. 그러고는 이름을 지었어요.</p><p>“아테나.”</p><p>아테나는 태어난 그날 아무것도 묻지 않았어요. 여기가 어디냐고도, 나는 누구냐고도요. 대신 산꼭대기를 한 바퀴 걸으면서 어느 기둥이 기울었는지, 어느 문이 잘 닫히지 않는지를 보았지요.</p><p>그날 저녁 신 둘이 자리를 두고 다투었어요. 아테나는 양쪽 말을 끝까지 들었어요. 그러고는 아무도 생각하지 못한 세 번째 자리를 손으로 가리켰어요. 두 신은 그 자리를 한참 보다가 그렇게 하기로 했지요.</p><p>그 뒤로 신들은 아테나 앞에서 함부로 말하지 않게 되었어요. 손재주도 좋았어요. 실을 잣고 베를 짜는 일에서 아테나를 따라올 이가 없었어요. 헤파이스토스와 나란히 앉아 하루 종일 무언가를 만들기도 했어요. 둘은 말이 별로 없었는데, 그래서 오히려 잘 맞았어요.</p><p>올빼미는 늘 아테나의 어깨에 앉아 있었어요.</p><p>“태어나자마자 갑옷을 입고 계셨잖아요. 싸움이 무섭지 않으세요?”</p><p>어느 날 헤파이스토스가 물었어요.</p><p>아테나는 잠깐 생각하다가 대답했어요.</p><p>“싸우려고 입은 게 아니야. 지키려고 입은 거지.”</p><p>그 무렵 땅 위에서는 새로운 일이 생기고 있었어요. 거기엔 신들처럼 오래 살지 못하는 사람들이 살았는데, 그 사람들이 바닷가 가까운 언덕에 마을을 세우고 있었거든요. 돌을 쌓아 담을 만들고, 그 안에 집을 짓고 있었어요. 그 마을에는 아직 이름이 없었어요.</p><h2>한 도시를 두고</h2><p>그 마을은 빠르게 자랐어요. 사람들이 하나둘 모여들어 집이 늘어났어요. 언덕 위에 세워져서 멀리까지 내다보였고, 바로 아래에는 배를 댈 만한 바닷가가 있었어요. 땅은 기름지고 물은 맑았어요. 누가 봐도 좋은 자리였지요.</p><p>언덕 위에서는 바다가 한눈에 내려다보였어요. 올림포스산에서도 그 마을이 보였지요. 어느 날 포세이돈이 말했어요.</p><p>“저 마을은 내가 맡겠어. 바다 바로 옆이잖아. 배가 드나들려면 내가 있어야지.”</p><p>그러자 아테나가 말했어요.</p><p>“저는 저 언덕이 마음에 들어요. 사람들이 저기에서 무언가를 만들 것 같거든요.”</p><p>두 신의 눈이 마주쳤어요. 포세이돈이 팔짱을 꼈어요. 아테나는 아무 말도 하지 않고 언덕 쪽을 보고 있었어요.</p><p>누구도 먼저 물러서겠다고 하지 않았어요. 신들이 자기가 지킬 곳을 정할 때는 겹치지 않는 것이 규칙이었어요. 한 도시에 두 신이 있으면 사람들이 누구에게 기도해야 할지 몰라 헷갈리니까요.</p><p>제우스가 두 사람을 불렀어요. 그러고는 두 얼굴을 번갈아 보았어요.</p><p>“그럼 이렇게 하지요. 두 분이 저 사람들에게 선물을 하나씩 주세요. 그리고 사람들에게 고르게 하는 거예요.”</p><p>“사람들에게 고르게 하자고요?”</p><p>포세이돈이 되물었어요. 조금 어이없다는 얼굴이었지요.</p><p>“저 마을에 사는 건 그 사람들이니까요.” 제우스가 말했어요. 포세이돈은 더 따지지 않았어요.</p><p>약속한 날은 바람 한 점 없는 맑은 날이었어요. 두 신이 그 언덕 위에 내려섰어요. 마을 사람들이 전부 모였어요. 언덕 아래까지 줄이 늘어섰어요. 아이들은 어른들 다리 사이로 고개를 내밀었어요. 신을 이렇게 가까이에서 보는 건 처음이었으니까요.</p><p>언덕 위에 두 신의 그림자가 나란히 섰어요. 사람들이 숨을 죽였어요. 포세이돈이 먼저 앞으로 나섰어요. 키가 크고 어깨가 넓은 신이었어요. 머리카락과 수염이 바닷물처럼 푸르스름했지요. 손에는 세 갈래로 갈라진 창이 들려 있었어요.</p><p>포세이돈은 삼지창을 높이 들었어요. 그리고 언덕 한가운데 바위를 내리쳤어요. 발밑의 흙이 파도처럼 흔들렸어요. 쩡, 하고 바위가 갈라졌어요. 갈라진 틈에서 물이 솟구쳐 올랐어요. 물기둥이 사람 키보다 높이 치솟았다가 떨어져 내렸지요.</p><p>물이 언덕 아래로 주르르 흘러내려 갔어요. 사람들이 함성을 질렀어요. 마을 한가운데에 샘이 생긴 거예요. 이보다 좋은 선물이 어디 있겠어요.</p><p>한 아이가 달려가 손으로 물을 떠 마셨어요. 그런데 그 아이가 얼굴을 잔뜩 찡그렸어요. 그러고는 입에 든 것을 도로 뱉었어요.</p><p>짠물이었어요. 사람들이 서로를 쳐다보았어요. 아무도 먼저 말하지 못했지요. 바다의 신이 만든 샘이었으니까요. 사람들의 함성이 조금씩 잦아들었어요.</p><p>다음은 아테나였어요. 아테나는 사람들 쪽으로 한 걸음 다가섰어요. 아테나는 창도 들지 않았고, 방패도 뒤로 물려 두었어요. 대신 손바닥을 펴 보였어요. 거기에는 아주 작은 씨앗 하나가 놓여 있었어요.</p><p>사람들이 서로를 쳐다보았어요. 저게 뭐냐고 수군거렸지요. 아테나는 무릎을 굽히고 앉아 흙을 조금 팠어요. 그리고 그 씨앗을 넣고 흙을 덮었어요. 손바닥으로 흙을 두어 번 다독였지요.</p><p>흙냄새가 확 올라왔어요. 곧 흙이 들썩였어요. 초록 싹이 올라왔어요. 싹은 자라서 줄기가 되고, 줄기는 굵어져 나무가 되었어요. 잎이 은빛으로 뒤집히는 나무였어요. 그리고 그 가지에 작고 까만 열매가 조롱조롱 달렸어요.</p><p>바람이 잎을 흔들자 나무 전체가 은빛으로 반짝였어요. 아이들이 나무 밑으로 몰려들었지요. 올리브나무였어요.</p><p>사람들이 한 걸음씩 다가왔어요.</p><p>“이 열매는 먹을 수 있어요.”</p><p>아테나가 말했어요.</p><p>“짜서 기름을 내면 등불을 켤 수 있고요. 나무는 단단해서 배도 만들고 집도 지을 수 있어요. 그리고 이 나무는 아주 오래 살아요. 여러분의 손자의 손자도 이 그늘에 앉게 될 거예요.”</p><p>사람들이 아무 말도 하지 못했어요. 몇 사람은 나무를 만져 보았어요. 누군가 열매 하나를 따서 조심스럽게 깨물어 보았어요. 떫은맛에 얼굴을 찡그렸지만 뱉지는 않았지요.</p><p>사람들은 그날 저녁까지 이야기를 나누었어요. 샘은 눈부셨어요. 물기둥이 솟구치던 그 장면을 잊을 수가 없었지요. 그런데 마실 수가 없었어요. 나무는 조용했어요. 그런데 그 앞에서 사람들은 자꾸 내일 이야기를 하게 되었어요.</p><p>언덕 위로 저녁 바람이 불어왔어요. 올리브나무 잎이 다시 한 번 뒤집혔어요. 해가 질 무렵, 가장 나이 많은 사람이 앞으로 나와 말했어요.</p><p>“우리는 나무를 고르겠습니다.”</p><p>언덕 위가 잠깐 조용해졌어요. 그러고는 사람들이 이렇게 덧붙였어요. 이 도시의 이름을 저 여신의 이름에서 따오겠다고요. 그렇게 그 도시는 아테네가 되었어요. 여신의 이름은 아테나, 도시의 이름은 아테네. 한 글자만 다른 두 이름이 그날 생긴 거예요.</p><p>아테나는 고개를 한 번 숙였어요. 그게 전부였어요. 기뻐서 웃지도 않았고, 사람들에게 무엇을 더 약속하지도 않았어요. 다만 올리브나무 아래에 잠깐 서 있었지요.</p><p>포세이돈은 아무 말도 하지 않았어요. 삼지창을 어깨에 걸치고 천천히 언덕을 내려갔어요. 사람들이 길을 비켰어요. 아무도 감히 눈을 마주치지 못했지요.</p><p>바닷가에 닿자 포세이돈은 물속으로 걸어 들어갔어요. 어깨가 잠기고, 머리가 잠기고, 마침내 아무것도 보이지 않게 되었어요.</p><p>그날 밤 그 바닷가에는 파도가 유난히 높았어요.</p></article></noscript>
