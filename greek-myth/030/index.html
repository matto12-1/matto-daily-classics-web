  <noscript><article class="ns-text"><h1>상아를 깎는 사람</h1><h2>혼자 일하는 작업실</h2><p>바닥에 돌가루가 발목까지 쌓여 있었어요. 창이 하나뿐이라 낮에도 어둑한 작업실이었지요. 항구에서 조금 떨어진 언덕에 있었고요.</p><p>그 방에서 일하는 사람의 머리카락은 늘 그 가루를 뒤집어써서 하얗게 세어 보였어요. 바닷가 마을의 조각가였어요. 이름은 피그말리온이었지요.</p><p>피그말리온은 아침 일찍 일을 시작해서 해가 다 지도록 끌을 놓지 않았어요. 사람들이 문을 두드려도 잘 나오지 않았어요. 나와서도 말수가 적었지요.</p><p>“주문한 조각상 어깨는 언제 다 됩니까?”</p><p>“됐을 때요.”</p><p>주문을 하러 온 사람들은 대개 그런 대답을 듣고 돌아갔어요. 그래도 다들 다시 왔어요. 그 마을에서 피그말리온만큼 잘 깎는 사람이 없었거든요.</p><p>마을 사람들은 피그말리온을 이상한 사람이라고 했어요. 나쁜 사람이라는 뜻은 아니었어요. 그냥 다른 사람들과 잘 어울리지 못하는 사람이라는 뜻이었지요.</p><p>저녁이면 항구 쪽에서 노랫소리가 올라왔어요. 배가 들어온 날에는 밤늦게까지 소리가 났지요. 피그말리온은 그 소리를 들으면서 혼자 빵을 씹었어요.</p><p>한번은 이웃 사람이 잔치에 오라고 부르러 온 적이 있었어요. 피그말리온은 옷을 갈아입고 언덕을 내려가다가, 마당에 사람들이 가득한 것을 보고 그냥 돌아섰어요. 무슨 말을 해야 할지 몰라서요.</p><p>그날 밤 피그말리온은 작업실에 앉아 오래 생각했어요. 자기가 왜 저 마당으로 못 들어갔는지를요. 답이 나오지 않아서 그냥 끌을 들었지요.</p><p>돌은 말을 걸지 않아요. 돌은 웃지도 않고요. 그렇지만 깎는 대로 되어 주지요. 피그말리온은 그것이 좋았어요.</p><p>그해 겨울에 피그말리온은 신전에 세울 여신상을 하나 깎았어요. 사람들이 그 앞에 서서 오래 보고 갔어요. 어떤 사람은 눈물을 글썽였고 어떤 사람은 이유도 모르는 채 옷깃을 여몄지요.</p><p>“어떻게 이런 걸 만듭니까?” 신관이 물었어요.</p><p>“돌 안에 이미 있습니다.” 피그말리온이 말했어요. “저는 둘레만 걷어 냅니다.”</p><p>신관은 그 말을 듣고 고개를 갸웃했어요. 겸손해서 하는 말인 줄 알았거든요. 그런데 피그말리온은 정말 그렇게 생각하고 있었어요.</p><p>어느 봄에 배 한 척이 낯선 짐을 싣고 들어왔어요. 상아였어요. 코끼리라는 짐승의 이빨이라고 했지요. 피그말리온은 그것을 보러 항구까지 내려갔어요. 사람들이 뱃전에 둘러서서 구경하고 있었어요. 그렇게 큰 이빨을 가진 짐승이 정말 있느냐고 다들 물었지요.</p><p>상아는 사람 키만큼 길고 부드럽게 휘어 있었어요. 겉은 우유를 굳혀 놓은 것 같은 빛깔이었어요. 손을 대어 보니 돌보다 따뜻했어요. 피그말리온은 그 자리에서 한동안 손을 떼지 못했어요.</p><p>“이 상아로는 뭘 만들 겁니까?” 뱃사람이 물었어요.</p><p>“아직 모르겠습니다.”</p><p>피그말리온은 가진 돈을 다 주고 그 상아를 샀어요. 그러고는 수레에 실어 언덕으로 올라갔지요. 그날 밤에는 상아 옆에 앉아 그것을 들여다보기만 했어요.</p><p>이튿날부터 피그말리온은 그것을 깎기 시작했어요. 여름이 지나고 가을이 지났어요. 피그말리온은 그동안 다른 일을 하나도 받지 않았어요. 사람들이 찾아와도 문을 열어 주지 않았어요.</p><p>처음에는 어깨선이 나왔어요. 그다음에는 목이 나왔고, 목이 나오니 얼굴이 따라 나왔어요. 손은 가장 나중이었어요. 손가락 열 개를 깎는 데만 스무날이 걸렸지요.</p><p>피그말리온은 손톱 밑의 아주 작은 홈까지 파냈어요. 손등에 살짝 도드라진 힘줄도요. 그것을 새기던 날 저녁에는 자기 손등을 등불에 비춰 가며 한참을 들여다보았어요.</p><p>중간에 한 번 크게 어긋난 적이 있었어요. 턱 아래를 깎다가 끌이 미끄러진 거예요. 상아가 한 조각 떨어져 나갔어요.</p><p>피그말리온은 그 조각을 주워 들고 문간에 한참 앉아 있었어요. 그날은 다시 끌을 잡지 않았어요. 이튿날 아침에 와서 보니, 떨어져 나간 자리가 오히려 목선을 부드럽게 만들어 놓았더래요.</p><p>다 깎은 뒤에는 문질렀어요. 고운 천에 기름을 묻혀서요. 몇 날 며칠을 문지르니 상아에서 은은한 윤이 났어요. 어두운 데서 보면 사람의 살빛 같았지요.</p><p>겨울이 시작될 무렵에 조각상이 완성되었어요. 피그말리온은 끌을 내려놓고 뒤로 물러나 그것을 보았어요. 그러고는 그 자리에 오래 서 있었어요. 기쁜 얼굴은 아니었어요.</p><p>이웃 사람들이 소문을 듣고 구경하러 왔어요. 문간에서 안을 들여다본 사람들은 하나같이 걸음을 멈추었어요.</p><p>“이게 상아라고요?”</p><p>“그렇습니다.”</p><p>“지금 숨을 쉬는 것 같은데요.”</p><p>피그말리온은 대답하지 않고 웃기만 했어요. 어떤 아주머니는 조각상 앞에서 목례를 하고 나서, 자기가 방금 무슨 짓을 했는지 깨닫고 얼굴이 빨개졌어요.</p><p>“조각상 이름은 뭐라고 붙일 겁니까?” 이웃집 아이가 물었어요.</p><p>“이름이요?”</p><p>“이름이 있어야지요.”</p><p>피그말리온은 한참 생각하다가 고개를 저었어요.</p><p>“이름은 못 붙이겠구나.”</p><p>아이는 그 말을 이해하지 못하고 돌아갔어요. 사실 피그말리온도 자기가 왜 그렇게 말했는지 몰랐어요. 다만 아무 이름이나 붙이면 안 될 것 같았지요.</p><p>그날 밤 피그말리온은 등불을 든 채 조각상 앞에 서 있었어요. 불빛이 흔들릴 때마다 조각상의 얼굴에 그림자가 옮겨 다녔어요. 그러면 표정이 바뀌는 것처럼 보였지요.</p><p>피그말리온은 등불을 내려놓았어요. 그러고는 그 자리에서 한 번 웃었어요. 저 혼자 무슨 생각을 하고 있는지 스스로도 우스웠거든요.</p><h2>말을 거는 사람</h2><p>겨울이 깊어지면서 피그말리온은 이상한 버릇이 생겼어요. 아침에 작업실에 들어서면 조각상 쪽을 보고 인사를 했어요. 처음에는 고개만 끄덕였는데, 나중에는 소리를 내어 말하게 되었지요.</p><p>“오늘은 바람이 셉니다.”</p><p>일을 하다가도 자꾸 말을 걸었어요. 끌이 미끄러지면 미끄러졌다고 말했고, 손님이 값을 깎으면 그 이야기를 했어요. 조각상은 아무 말도 하지 않았어요. 그래도 듣고 있는 것 같았어요.</p><p>피그말리온은 언덕에서 꺾은 들꽃을 가져다 조각상의 손에 놓아 주었어요. 바닷가에서 주운 조개껍데기도요. 매끈하고 자잘한 것들만 골라 왔지요.</p><p>어깨에는 얇은 천을 덮어 주었어요. 겨울이라 작업실이 추웠거든요. 밤에 바람이 세게 부는 날에는 창 쪽으로 널빤지를 하나 더 세워 두었어요.</p><p>조각상은 상아라서 추위를 타지 않아요. 피그말리온도 그것을 알고 있었어요. 그런데도 매일 저녁 그 천을 여며 주었지요.</p><p>이웃집 아이가 그 모습을 보고 물었어요.</p><p>“왜 천을 덮어요? 그건 상아잖아요.”</p><p>“그렇지.”</p><p>“그럼 안 추운데요.”</p><p>“그렇지.”</p><p>아이는 아저씨가 자기 말을 안 듣는다고 생각하고 입을 삐죽 내밀었어요. 피그말리온은 천 자락을 한 번 더 여미고 나서 아이 쪽을 돌아보았어요.</p><p>“너는 왜 그 인형을 데리고 자니?”</p><p>아이는 대답하지 못했어요. 그러고는 한참 있다가 아주 작게 말했지요.</p><p>“그냥요.”</p><p>“그래. 나도 그냥이란다.”</p><p>아이는 그날 이후로 다시는 그것을 묻지 않았어요. 대신 가끔 들꽃을 한 줌 꺾어다 문간에 놓고 갔지요.</p><p>피그말리온은 그 꽃을 조각상의 손에 옮겨 놓았어요. 아이가 준 것이라고 일러 주면서요. 그러고는 조금 웃었어요. 이 작업실에 웃는 소리가 나는 것은 아주 오랜만이었어요.</p><h2>아프로디테의 축제</h2><p>겨울이 끝날 무렵에 마을에서 큰 축제가 열렸어요. 아프로디테의 축제였지요. 그날은 배도 뜨지 않고 대장간도 문을 닫았어요. 사람들이 아침부터 신전 앞 마당으로 모여들었어요. 제단에는 향나무가 쌓였고, 뿔에 금박을 입힌 흰 소가 끌려 나왔어요.</p><p>사람들은 차례대로 제단 앞에 나가 소원을 빌었어요. 소리 내어 비는 사람도 있고 속으로만 비는 사람도 있었지요.</p><p>어부는 그물이 무거워지기를 빌었어요. 어느 젊은이는 얼굴이 빨개진 채로 아무 말도 못 하고 내려왔어요. 사람들이 그것을 보고 웃었어요. 무엇을 빌러 나왔는지 다 알았거든요.</p><p>피그말리온도 그 자리에 있었어요. 사람들 맨 뒤에 서 있었지요. 그날 아침에 피그말리온은 축제에 갈 생각이 없었어요. 그런데 해가 뜨자 옷을 갈아입고 언덕을 내려왔어요. 왜 그랬는지는 자기도 설명하지 못했을 거예요.</p><p>마당에는 향 냄새가 가득했어요. 아이들이 사람들 다리 사이로 뛰어다녔어요. 이웃집 아이가 피그말리온을 알아보고 손을 흔들었어요. 피그말리온은 고개만 끄덕였지요.</p><p>줄이 조금씩 줄어들었어요. 피그말리온은 자기 차례가 가까워질수록 손바닥이 축축해지는 것을 느꼈어요.</p><p>차례가 돌아오자 피그말리온은 제단 앞으로 걸어 나갔어요. 손에 든 것은 비둘기 한 마리와 들꽃 한 다발이었어요.</p><p>피그말리온은 그것을 제단에 올려놓고 무릎을 꿇었어요. 그러고는 입을 열었어요.</p><p>“아프로디테님.”</p><p>거기서 말이 멈췄어요. 뒤에 사람들이 줄지어 서 있었어요. 다 아는 얼굴들이었어요. 피그말리온은 자기가 하려던 말을 그 사람들 앞에서 소리 내어 할 수 없다는 것을 깨달았어요.</p><p>제가 깎은 그 사람 같은 이를 만나게 해 주십시오. 그 말이었어요. 말로 하고 나면 우스워지는 소원이 있어요. 피그말리온은 그것을 알고 있었어요.</p><p>그래서 그 말을 끝내 하지 못했어요. 대신 이마를 제단 앞 돌바닥에 대고 아주 오래 엎드려 있었지요. 뒤에서 누가 헛기침을 했어요. 그래도 일어나지 않았어요.</p><p>엎드린 채로 피그말리온은 속으로 그 말을 했어요. 소리는 하나도 나지 않았어요. 그때 제단의 불꽃이 세 번 위로 솟았어요.</p><p>한 번, 두 번, 세 번이요. 바람도 없었는데요. 앞에 서 있던 사람들이 어어, 하고 소리를 냈어요. 피그말리온은 그것을 보지 못했어요. 여전히 엎드려 있었거든요. 조금 뒤에 일어나 뒤로 물러났고, 사람들 사이를 지나 마당 밖으로 나갔어요.</p><p>마당 한쪽 올리브나무 가지에 어린 신 하나가 걸터앉아 있었어요. 등에 옅은 파랑 날개가 달렸고, 무릎에는 작은 활이 놓여 있었지요. 에로스였어요.</p><p>에로스는 아까부터 그 자리에서 사람들이 비는 것을 듣고 있었어요. 소리 내어 빈 소원도 듣고, 소리 내지 않은 소원도 듣고요. 소리 내지 않은 쪽이 늘 더 잘 들렸어요.</p><p>에로스는 나뭇가지에서 뛰어내려 신전 안으로 들어갔어요. 아프로디테는 기둥 뒤에 서서 마당을 내려다보고 있었어요. 사람들 눈에는 보이지 않는 자리였지요.</p><p>“어머니.” 에로스가 말했어요. “아까 그 사람은 말을 하다 말았습니다.”</p><p>“나도 들었다.”</p><p>“끝까지 듣지 않으셨을까 봐서요.”</p><p>아프로디테가 아들을 내려다보았어요. 그러고는 조금 웃었어요.</p><p>“그 사람 소원은 입으로 말하기 전에 벌써 내게 닿았더구나.”</p><p>“그 사람은 조각상을 닮은 이를 만나게 해 달라고 빌지 않았습니까?”</p><p>“비는 말은 그랬지. 마음은 벌써 그 조각상에 가 있더구나.”</p><p>에로스는 더 묻지 않았어요. 어머니가 벌써 언덕 쪽으로 눈길을 옮겼거든요.</p><p>피그말리온이 언덕길을 혼자 올라가고 있었어요. 축제는 아직 한창인데 혼자 올라가는 사람은 그 사람뿐이었지요.</p><p>“어머니.” 에로스가 다시 불렀어요. “저 사람은 조각상한테 말을 겁니다. 마을 사람들이 다 웃습니다.”</p><p>“너도 그 사람을 보고 웃었느냐?”</p><p>“아니요.”</p><p>“왜 안 웃었느냐?”</p><p>에로스는 잠깐 생각했어요.</p><p>“그 사람 마음이 진심이어서요.”</p><p>아프로디테는 그 말에 대답하지 않았어요. 대신 기둥에서 몸을 떼고 마당 쪽으로 걸어 나갔어요. 제단의 불꽃이 그 걸음에 맞춰 한 번 더 흔들렸지요.</p><p>에로스는 활을 들지 않았어요. 그날은 화살이 필요한 날이 아니었거든요.</p><h2>집으로 돌아온 저녁</h2><p>언덕을 다 올라왔을 때는 해가 기울고 있었어요. 아래쪽 마당에서는 아직 노랫소리가 올라왔지요.</p><p>피그말리온은 문 앞에서 잠깐 서 있었어요. 오늘 아무 말도 못 하고 왔다는 것이 자꾸 마음에 걸렸거든요. 신 앞에서 말을 못 하는 사람이 어디 있느냐고, 스스로를 나무라기도 했어요.</p><p>작업실 문을 열자 익숙한 돌가루 냄새가 났어요. 피그말리온은 문을 닫고 등불에 불을 붙였어요. 조각상은 어제 세워 둔 그대로 있었어요. 어깨에 덮어 준 천도 그대로였고, 손에 놓아 준 들꽃은 조금 시들어 있었지요.</p><p>피그말리온은 시든 꽃을 치우고 축제에서 가져온 꽃을 대신 놓아 주었어요.</p><p>“오늘 축제에 다녀왔습니다.”</p><p>그렇게 말하고 나서 피그말리온은 잠깐 멈췄어요. 그다음에 할 말이 목에 걸렸거든요. 마당에서 못 한 말이 여기서도 안 나왔어요.</p><p>“꽃이 좋지요. 마당에서 나눠 주는 것을 얻어 왔습니다.”</p><p>피그말리온은 꽃대를 손가락 사이에 끼워 넣어 주었어요. 그러다가 손이 조각상의 손등에 스쳤어요. 피그말리온은 손을 멈췄어요.</p><p>그러고는 다시 그 자리에 손을 대어 보았어요. 상아는 늘 서늘했어요. 겨울에는 더 그랬지요. 그런데 그날 저녁에는 서늘하지 않았어요.</p><p>피그말리온은 자기 손이 잘못됐다고 생각했어요. 축제 마당에서 불 가까이 있었으니까요. 그래서 자기 이마에 손을 대어 보고, 벽에 손을 대어 보고, 창틀에 손을 대어 보았어요. 벽은 찼어요. 창틀도 찼고요.</p><p>다시 조각상의 손등에 손을 얹었어요. 따뜻했어요. 등불이 흔들렸어요. 피그말리온은 숨을 죽이고 손가락 하나를 조각상의 손목 안쪽에 대어 보았어요. 사람의 맥이 뛰는 자리였지요.</p><p>무언가가 아주 천천히, 아주 작게 뛰고 있었어요. 피그말리온은 뒤로 한 걸음 물러났어요. 그러고는 다시 다가갔어요. 손끝으로 조각상의 손가락을 살짝 눌러 보았어요. 상아는 눌리지 않아요. 그런데 눌렸어요.</p><p>피그말리온은 등불을 조각상 얼굴 가까이 들어 올렸어요. 손이 심하게 떨려서 불빛이 벽에서 흔들렸어요. 감겨 있던 것 같지도 않은 눈꺼풀이, 아주 천천히 한 번 깜박였어요.</p><p>피그말리온이 그 손을 두 손으로 감싸 쥐었어요. 차갑던 손가락이 천천히 움직이더니, 피그말리온의 손을 마주 쥐었어요.</p></article></noscript>
