  <noscript><article class="ns-text"><h1>미로 한가운데</h1><h2>문설주에 묶은 매듭</h2><p>실 끝이 문설주에 두 번 감겼어요. 문 옆에 선 돌기둥이었지요. 테세우스가 그 끝을 매듭지어 묶었어요. 한 번 묶고, 당겨 보고, 한 번 더 묶었지요. 두 번째 매듭은 첫 번째 매듭 위에 얹었어요. 어머니가 신발에 끈을 꿸 때 하던 식이었어요.</p><p>새벽에 문이 한 번 열렸었어요. 사람들이 들어와 열넷을 일으켜 세웠지요. 아무도 잠들지 못했으니 일어나는 데는 시간이 걸리지 않았어요. 밥이 들어왔는데 먹은 사람은 셋뿐이었고요. 테세우스는 먹었어요. 남기지 않고 다 먹었지요.</p><p>창밖은 아직 컴컴했어요. 밖에서 새가 한 마리 울었고요. 그 소리를 들은 사람이 몇이나 되는지는 모르겠어요.</p><p>문은 청동이었어요. 사람 키의 두 배쯤 되는 문이었지요. 궁 안뜰에서 계단을 한참 내려가면 그 문이 나왔어요. 내려가는 동안 공기가 한 계단마다 조금씩 차가워졌고요.</p><p>계단은 아주 길었어요. 한참 내려가도 다음 계단이 또 나왔지요. 내려갈수록 위쪽 소리가 멀어졌어요. 마지막 몇 계단에서는 아무 소리도 들리지 않았고요. 지키는 사람이 넷 서 있었어요. 그 가운데 하나가 테세우스의 손을 보았지요.</p><p>“손에 든 그게 뭐냐?”</p><p>“실타래입니다.”</p><p>칼은 배에서 내릴 때 빼앗겼어요. 저 문으로 들어가는 사람은 아무것도 들고 갈 수 없었거든요. 그런데 실은 아무도 무기라고 생각하지 않았어요.</p><p>지키는 사람은 그것을 빼앗지 않았어요. 웃지도 않았고요. 실 한 타래를 들고 저 문으로 들어간 사람이 여태 없었으니까, 그게 소용이 있는지 없는지 그 사람도 몰랐던 거예요.</p><p>실타래는 밤새 테세우스의 손 안에 있었어요. 손이 땀에 젖어서 겉의 실 몇 오라기가 손바닥에 붙었지요. 테세우스는 그것을 떼어 내지 않았어요. 떼다가 실이 끊길까 봐서요.</p><p>열넷이 문 앞에 한 줄로 섰어요. 아무도 서로 밀지 않았어요. 그 문 안쪽에서는 아무 소리도 나지 않았어요. 열넷은 그 조용함을 한참 들었지요.</p><p>“저 혼자 먼저 들어가겠습니다.” 테세우스가 말했어요.</p><p>“이 문으로는 열넷이 다 들어가야 한다.”</p><p>“열넷이 한꺼번에 들어가면 이 실이 열넷을 데리고 나올 수 없습니다.”</p><p>지키는 사람은 실을 다시 보았어요. 이번에는 조금 오래 보았지요.</p><p>“저 문틈으로 해가 들어옵니다. 해가 저 세 번째 돌에 닿을 때까지 제가 안 나오면, 그때 열셋을 들여보내십시오.”</p><p>지키는 사람은 계단 위쪽을 한 번 올려다보았어요. 위에는 아무도 없었지요. 미노스 왕은 그 문 앞에 나오지 않았거든요. 왕이 나오는 자리는 사람을 세는 자리뿐이었어요.</p><p>지키는 사람이 문을 조금만 열었어요. 사람 하나가 겨우 지나갈 만큼요. 열셋 가운데 하나가 테세우스의 소매를 잡았어요. 아무 말도 하지 않고 그냥 잡았다가 놓았지요. 배 안에서 자리를 옆으로 옮겨 주었던 그 사람이었어요.</p><p>테세우스는 실타래를 왼손에 쥐고 들어갔어요.</p><h2>실이 줄어드는 동안</h2><p>문이 닫혔어요. 닫히는 소리가 오래갔어요. 소리가 벽에 부딪고 또 부딪었거든요. 등 뒤에서 빗장이 걸리는 소리도 났어요. 그 소리는 아주 짧았고요.</p><p>안은 캄캄하지 않았어요. 아주 높은 데 어딘가에 구멍이 뚫려 있어서 빛이 실오라기처럼 들어왔지요. 그 빛으로 앞이 보이지는 않았어요. 다만 아주 캄캄하지는 않다는 것만 알 수 있었어요.</p><p>냄새가 났어요. 나쁜 냄새는 아니었어요. 오래 닫아 둔 창고에서 나는 냄새 같았지요. 그런데 아주 멀리서 다른 냄새가 조금 섞여 있었어요.</p><p>벽은 다듬은 돌이었어요. 손바닥으로 짚으면 이음매가 만져졌지요. 이음매가 아주 촘촘했어요. 이걸 지은 사람은 솜씨가 대단한 사람이었어요.</p><p>테세우스는 왼손으로 벽을 짚고 오른손으로 실을 풀면서 걸었어요. 걸음은 소리 내어 세었고요.</p><p>“스물셋.”</p><p>갈림길이 나왔어요. 왼쪽과 오른쪽이 똑같이 생겼어요. 테세우스는 오래 서 있지 않았어요. 왼쪽으로 갔지요.</p><p>“서른둘.”</p><p>두 번째 갈림길에서도 왼쪽으로 갔어요. 세 번째에서도요. 왼쪽으로만 가기로 미리 정해 두었거든요. 정해 두면 갈림길 앞에서 시간을 쓰지 않아도 되니까요.</p><p>길은 자꾸 꺾였어요. 곧게 뻗은 데가 열 걸음을 넘지 않았지요. 꺾일 때마다 어깨가 벽에 닿았어요. 나중에는 닿기 전에 미리 몸을 트는 법을 익히게 되었고요.</p><p>“백일곱.”</p><p>세다가 한 번 틀렸어요. 백일곱 다음에 백여덟이 아니라 백열을 말했거든요. 테세우스는 백여덟으로 돌아가서 다시 세었어요.</p><p>어디선가 물방울 떨어지는 소리가 났어요. 아주 규칙적이었어요. 걸음을 세다가 나중에는 그 소리에 맞춰 세게 되었지요.</p><p>바닥에 무언가가 놓여 있었어요. 발끝에 걸렸거든요. 테세우스는 쭈그리고 앉아 그것을 만져 보았어요. 신발 한 짝이었어요. 아주 오래된 것이었고요.</p><p>테세우스는 그것을 벽 쪽에 세워 놓았어요. 길가에 신발을 내놓던 때처럼요. 신발은 한 짝뿐이었어요. 나머지 한 짝은 아무 데도 없었고요.</p><p>실타래가 반으로 줄었어요. 반이 줄었다는 건 나갈 실이 딱 그만큼 남았다는 뜻이기도 했어요. 테세우스는 거기서 잠깐 섰어요. 그러고는 실을 조금 더 천천히 풀기 시작했지요.</p><p>그때 소리가 났어요. 물방울 소리가 아니었어요. 무언가 큰 것이 벽에 한 번 부딪는 소리였지요. 아주 멀리서요.</p><p>그 소리가 한 번 더 났어요. 아까보다 가까웠어요. 테세우스는 걸음을 멈췄어요. 세던 숫자도 멈췄고요. 한참 뒤에 다시 걸었어요. 이번에는 세지 않았어요.</p><h2>빛이 내려오는 자리</h2><p>길이 갑자기 넓어졌어요. 천장이 높았어요. 위쪽에 큰 구멍이 하나 뚫려 있어서 빛이 기둥처럼 내려왔지요. 바닥 한가운데에 그 빛이 둥글게 떨어져 있었어요.</p><p>넓이는 궁 안뜰만 했어요. 벽이 둥글게 돌아가고, 그 벽에 길이 네 개쯤 뚫려 있었지요. 어느 길로 들어왔는지는 실이 알고 있었어요.</p><p>바닥에는 줄이 그어져 있었어요. 손톱으로 긁어 그린 줄이었어요. 다섯 개씩 묶여 있었고요. 그 줄이 바닥을 거의 다 덮고 벽 아래까지 이어져 있었어요.</p><p>오래된 줄은 얕고 반들반들했어요. 새 줄은 깊고 가루가 남아 있었고요. 무언가를 세어 놓은 거예요. 무엇을 세었는지는 세어 놓은 쪽만 알겠지요.</p><p>빛 바깥쪽 어둠에서 무언가가 일어섰어요. 일어서는 데 시간이 걸렸어요. 앉아 있던 자세에서 한 번에 서지 못하고, 한쪽 손으로 바닥을 짚고 일어섰지요.</p><p>사람 몸이었어요. 어깨가 아주 넓었고요. 그런데 목 위는 사람이 아니었어요. 소의 머리였어요. 뿔이 둘 있고, 그 가운데 한쪽 뿔에 청동 고리가 끼워져 있었지요. 아주 어릴 때 끼운 것이라 이제는 빠지지 않는 고리였어요.</p><p>사람들은 그것을 미노타우로스라고 불렀어요. 미노스의 소라는 뜻이에요. 키는 테세우스보다 머리 하나가 더 컸어요. 서 있는 자세가 조금 이상했어요. 오래 낮은 데를 지나다닌 사람처럼 목을 앞으로 빼고 있었거든요. 이 안에는 천장이 낮은 길이 많았으니까요.</p><p>미노타우로스는 곧바로 달려들지 않았어요. 빛 앞에서 멈춰 섰지요. 눈을 조금 찡그렸어요. 위에서 내려오는 그 빛이 눈에 익지 않은 것 같았어요.</p><p>테세우스도 움직이지 않았어요.</p><p>“너는 이 안에 얼마나 오래 있었니?”</p><p>미노타우로스는 대답하지 않았어요. 말을 배운 적이 없었으니까요. 대신 소리를 냈어요. 짐승 소리도 아니고 사람 소리도 아닌 소리였지요.</p><p>소리는 길지 않았어요. 한 번 내고 그쳤지요. 그러고는 테세우스가 대답하기를 기다리는 것처럼 가만히 있었어요.</p><p>그러고는 손으로 바닥을 한 번 긁었어요. 새 줄이 하나 그어졌어요. 그게 무슨 뜻인지 테세우스는 알 것 같았어요. 오늘은 하나가 왔다는 뜻이었지요.</p><p>미노타우로스가 고개를 낮췄어요. 테세우스는 옆으로 비켰다가 두 손으로 뿔을 잡았어요. 둘이 한참 밀었어요. 빛 밖으로 밀려 나갔다가 다시 들어왔지요. 테세우스는 미노타우로스를 이겼어요. 그 자리에는 둘 말고 아무도 없었어요. 그 짐승이 그 어둠을 고른 것은 아니었지요.</p><p>테세우스는 바닥에 앉았어요. 숨이 돌아오는 데 시간이 걸렸어요. 팔이 떨렸어요. 떨리는 것을 멈추려고 무릎 위에 손을 얹었는데 무릎도 떨렸고요. 테세우스는 그냥 두었어요.</p><p>앉은 자리 옆에 그 줄들이 있었어요. 테세우스는 그것을 세어 보려고 했어요. 다섯 개씩 묶인 것을 손가락으로 짚어 가면서요.</p><p>스무 묶음쯤에서 그만두었어요. 끝까지 세면 끝이 나올 텐데, 그 끝을 알고 싶지 않았거든요.</p><p>위쪽 구멍으로 새 한 마리가 지나갔어요. 그림자가 바닥을 한 번 스쳤지요. 저 위에는 하늘이 있고, 하늘 아래에는 항구가 있고, 항구에는 배가 있었어요. 여기서는 그게 다 아주 멀게 느껴졌어요.</p><p>위에서 내려오는 빛이 조금 옮겨 가 있었어요. 밖에서 해가 움직인 거예요. 테세우스는 일어섰어요. 일어서면서 빛의 둘레 밖으로 한 걸음 나왔어요. 그러자 그 넓은 자리가 도로 어두워졌지요.</p><h2>실이 끊긴 자리</h2><p>실은 나갈 때가 더 어려웠어요. 돌아 나오는 길에 그 신발 한 짝을 다시 지나갔어요. 세워 둔 그대로 있었지요. 테세우스는 그것을 그냥 두고 지나갔어요.</p><p>들어올 때는 그냥 풀면 되었는데, 나갈 때는 감으면서 걸어야 했거든요. 감는 손이 걷는 발보다 느리면 실이 발에 걸렸고요. 테세우스는 몇 번 걸려 넘어질 뻔했어요.</p><p>갈림길이 나올 때마다 실이 가르쳐 주었어요. 실이 있는 쪽으로만 가면 되었지요. 고를 것이 없었어요. 고를 것이 없다는 게 그렇게 고마울 줄은 몰랐고요.</p><p>들어올 때 세어 둔 걸음이 있어서 어디쯤 왔는지 짐작이 되었어요. 그 자리를 지날 때 테세우스는 숫자를 소리 내어 말해 보았지요.</p><p>“백일곱.”</p><p>그러다 실이 갑자기 가벼워졌어요. 감기는 데 힘이 하나도 들지 않았어요. 테세우스는 감던 손을 멈추고 실을 당겨 보았어요. 실이 그냥 딸려 왔어요. 끝이 손에 왔고요.</p><p>끊겨 있었어요. 실 끝을 쥐고 테세우스는 한참 움직이지 않았어요. 앞도 뒤도 똑같이 생긴 길이었거든요. 왼쪽으로만 왔으니 나갈 때는 오른쪽으로만 가면 될 것 같은데, 그 생각이 맞는지 확인할 방법이 없었어요.</p><p>실을 눈앞에 바짝 대고 보았어요. 잘린 것이 아니라 닳아 있었어요. 돌 모서리에 쓸린 거예요. 들어올 때 그 모서리를 스치고 지나갔나 봐요.</p><p>테세우스는 그 자리에 앉았어요. 앉아서 바닥을 손으로 쓸었어요. 넓게, 반원을 그리면서요. 오른쪽으로 한 번, 왼쪽으로 한 번. 손끝에 걸리는 것이 없었어요.</p><p>조금 앞으로 나가서 다시 쓸었어요. 또 없었고요. 세 번째로 쓸었을 때 손가락 끝에 무언가가 걸렸어요. 머리카락보다 조금 굵은 것이었지요.</p><p>“끊긴 실이 여기 있구나.”</p><p>테세우스는 그것을 손가락에 감고 당겨 보았어요. 팽팽했어요. 저쪽 끝이 아직 문설주에 묶여 있다는 뜻이었지요.</p><p>두 끝을 이어 묶었어요. 매듭이 하나 더 생겼어요. 아테네로 가는 길에 신발끈에 생겼던 매듭처럼요. 그 뒤로는 빨랐어요. 실이 팽팽한 쪽으로만 걸으면 되었으니까요. 실이 짧아질수록 감는 손이 빨라졌어요. 실타래는 다시 커졌고요.</p><p>한참 뒤에 문틈으로 빛이 새어 들어오는 것이 보였어요. 실이 그 빛 쪽으로 이어져 있었지요. 문 앞에 다다랐을 때 실타래는 처음 받았을 때만큼 커져 있었어요. 실은 한 오라기도 버리지 않았고요.</p><h2>열린 문과 밀어낸 배</h2><p>문이 열렸어요. 계단에 앉아 있던 열셋이 한꺼번에 일어섰지요. 해는 세 번째 돌에 거의 닿아 있었어요. 손가락 하나만큼 남아 있었고요.</p><p>지키는 사람 넷은 아무 말도 하지 않았어요. 그 가운데 하나는 뒤로 한 걸음 물러섰어요. 열셋은 테세우스를 보았어요. 아무도 무슨 일이 있었느냐고 묻지 않았지요. 한 사람이 테세우스의 얼굴에 묻은 돌가루를 소매로 닦아 주었어요.</p><p>테세우스는 문설주의 매듭을 풀었어요. 두 번 감아 두었던 실이 스르르 풀렸지요. 그 실도 마저 감아서 품에 넣었어요.</p><p>아리아드네는 문 옆 기둥 뒤에 서 있었어요. 테세우스가 나오자 기둥 뒤에서 걸어 나왔지요.</p><p>“아테네에서 타고 온 배는 어느 쪽에 있습니까?”</p><p>“따라오세요.”</p><p>아리아드네가 앞장서서 걸었어요. 궁 뒤쪽으로 도는 길이었어요. 사람이 다니지 않는 길이었지요. 열셋이 그 뒤를 따라갔고요.</p><p>길이 좁아서 한 줄로 걸어야 했어요. 아리아드네는 고개를 돌리지 않고 걸었어요. 그런데 갈림길마다 잠깐씩 섰지요. 뒤에서 나는 발소리가 몇인지 세는 것 같았어요.</p><p>부두에 닿았을 때는 이미 어두웠어요. 아테네에서 온 배가 그대로 매여 있었어요. 뱃사람들이 배 안에서 자고 있었고요. 흰 천이 든 자루도 묶어 둔 자리에 그대로 있었어요.</p><p>아리아드네는 짐이 없었어요. 작은 자루 하나만 들고 있었지요. 그 안에 무엇이 들었는지는 아무도 묻지 않았고요.</p><p>배에 오를 때 아무도 아리아드네에게 왜 오느냐고 묻지 않았어요. 밧줄을 풀었어요. 밧줄이 젖어서 잘 풀리지 않았어요. 매듭 하나를 푸는 데 셋이 달라붙었지요.</p><p>열셋과 테세우스가 함께 배를 밀었어요. 배 밑이 모래에서 떨어지는 것이 발바닥으로 올라왔지요. 노를 저었어요. 처음에는 박자가 맞지 않았어요. 그런데 열 번쯤 젓고 나니 맞았고요.</p><p>열셋 가운데 노를 저어 본 사람은 넷뿐이었어요. 나머지는 옆 사람을 보면서 흉내를 냈지요. 그래도 배는 나아갔어요.</p><p>아리아드네가 뱃전에 앉았어요. 그러고는 섬 쪽을 보지 않고 물었어요.</p><p>“안에서 뭘 봤어요?”</p><p>테세우스는 대답하지 않았어요. 노를 한 번 더 저었을 뿐이었지요. 아리아드네도 다시 묻지 않았어요. 그때 궁 쪽 언덕에 불이 하나 켜졌어요.</p><p>조금 있다가 그 옆에 하나가 더 켜졌어요. 그다음에는 셋이 되었고요. 그다음부터는 세지 않았어요. 횃불이 언덕을 따라 내려오기 시작했어요. 불빛이 물 위에 길게 늘어졌지요. 그 늘어진 빛이 배를 따라왔어요.</p></article></noscript>
