        <div class="recap"><h3>지난 이야기</h3><ol><li>이아손은 메데이아가 준 약을 바르고 불을 뿜는 소 두 마리에 멍에를 씌워 밭 네 이랑을 갈았어요.</li><li>뿌린 이빨에서 사람들이 올라오자, 메데이아가 일러 준 대로 돌 하나를 그 한가운데로 던졌지요.</li><li>그날 밤 배부터 태우라는 아버지의 말을 벽 너머로 들은 메데이아는, 이아손을 데리고 숲으로 갔어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>황금 양털</h1><h2>눈을 감지 않는 것</h2><p>나무 밑동이 굵어 보였어요. 그런데 굵은 것은 나무가 아니었어요. 무언가가 밑동을 여러 겹 감고 있었지요. 이아손은 그것을 세어 보았어요. 아홉 겹이었어요.</p><p>세고 나서 위를 보았어요. 감긴 것이 위로도 올라가 있었어요. 가지가 갈라지는 자리까지요. 거기까지 세니 열둘이었지요.</p><p>길이가 얼마나 되는지는 셀 수가 없었어요. 감긴 것을 다 풀어 놓으면 이 숲을 가로지르고도 남겠구나 싶었지요.</p><p>빛은 그 위에 있었어요. 가지 사이에 걸린 양털이 등잔처럼 아래를 비추고 있었거든요. 그 빛에 감긴 것의 등이 보였어요. 비늘 하나가 손바닥만 했어요.</p><p>“저 양털은 왜 저 나무에 걸려 있습니까?” 이아손이 물었어요.</p><p>메데이아는 아버지에게 들은 이야기를 해 주었어요. 아주 옛날에 날개 달린 양이 한 마리 왔대요. 물을 건너지 못하던 아이 둘을 등에 태우고요. 그 양의 털이 금빛이었는데, 콜키스에 닿은 뒤에 그 털을 벗겨 저 나무에 걸었다고 했어요.</p><p>“양을 타고 온 그 아이들은 어떻게 됐습니까?”</p><p>“하나는 오는 길에 물에 빠졌고, 하나는 여기서 어른이 되었대요.”</p><p>이아손은 그 말을 듣고 위를 다시 보았어요. 저 위에 걸린 것이 아까보다 조금 다르게 보였지요. 숲에는 새가 울지 않았어요. 낮에도 울지 않는다고 메데이아가 말했지요.</p><p>나무 둘레에는 풀이 자라지 않는 자리가 둥글게 나 있었어요. 그 둥근 자리 밖으로는 풀이 있었고요. 스무 걸음쯤 되는 둘레였어요.</p><p>이아손은 그 경계 앞에서 걸음을 멈췄어요. 발끝이 선에 닿아 있었지요. 넘으면 안 될 것 같은데 왜 그런지는 몰랐어요.</p><p>이아손은 그 나무까지 몇 걸음인지 세어 보았어요. 스물여덟 걸음이었어요. 세고 나서도 발은 떼지 않았지요.</p><p>메데이아가 먼저 그 안으로 들어갔어요. 들어갔는데 아무 일도 일어나지 않았고요. 아탈란테는 숲 어귀 쪽을 보고 서 있었어요. 뒤에서 누가 오는지 보는 자리였지요. 활은 아직 등에 있었어요. 그 나무 밑의 것에게 화살이 소용없다는 것은 보기만 해도 알았거든요.</p><p>머리는 나무 반대쪽에 있었어요. 돌아가서 보니 그것은 이쪽을 벌써 보고 있었어요. 눈이 둘이었는데 둘 다 뜨고 있었지요.</p><p>“저것은 언제부터 저 나무를 감고 있습니까?” 이아손이 물었어요.</p><p>“제가 태어나기 전부터요.”</p><p>“누가 저것을 저기 두었습니까?”</p><p>“그것도 제가 태어나기 전 일이라 몰라요.”</p><p>그 머리가 조금 움직였어요. 이쪽으로 오는 것이 아니라 목을 조금 폈을 뿐이었어요. 그런데도 셋이 다 한 걸음씩 물러섰지요.</p><p>낙엽이 밟히는 소리가 났어요. 그 소리에 머리가 그쪽으로 돌아갔고요.</p><p>“소리를 내면 어떻게 됩니까?” 이아손이 아주 작게 물었어요.</p><p>“소리는 괜찮아요. 저것은 냄새로 사람을 가려요.”</p><p>“무슨 냄새를 가립니까?”</p><p>“처음 맡는 냄새요. 모르는 냄새가 가까이 오면 달려들어요.”</p><p>메데이아는 그러면서 자기 소매 냄새를 한 번 맡아 보았어요. 궁에서 나온 소매였으니까 저 나무가 아는 냄새였겠지요.</p><h2>그릇에 담아 온 것</h2><p>메데이아는 자루에서 나무 그릇을 꺼냈어요. 안에 무언가가 담겨 있었어요. 물 같기도 하고 기름 같기도 했지요. 그 위에 하얀 가루가 떠 있었어요.</p><p>메데이아는 그릇을 두 손으로 받쳐 들고 잠깐 서 있었어요. 그릇 안의 것이 조금 흔들렸지요. 흔들린 것은 그릇이 아니라 손이었고요.</p><p>메데이아는 노간주나무 가지를 하나 꺾어 그릇에 담갔어요. 그러고는 나무 쪽으로 걸어갔지요. 이아손이 앞을 막으려고 팔을 들었어요.</p><p>“가만히 계세요.” 메데이아가 말했어요.</p><p>“그럼 저는 무엇을 합니까?”</p><p>“제가 부르면 오세요. 그 전에는 오지 마세요.”</p><p>메데이아가 노래를 시작했어요. 노래라고 하기에는 이상한 노래였어요. 가락이 오르내리지 않았거든요. 한 소리를 길게 내다가 조금 낮추고, 다시 길게 내는 식이었지요.</p><p>목소리도 곱지 않았어요. 낮고 밋밋했어요. 그런데 그 소리가 나무 밑에서 조금씩 퍼졌어요. 숲이 그 소리를 되돌려 보내지 않았어요. 소리가 나무에 스며드는 것 같았지요.</p><p>감겨 있던 것이 처음에는 더 조여들었어요. 나무 껍질이 부스러져 떨어졌어요. 이아손이 한 걸음 나섰다가 도로 섰지요.</p><p>“지금 가시면 안 돼요.” 아탈란테가 아주 작게 말했어요.</p><p>“안 갑니다.”</p><p>메데이아는 멈추지 않았어요. 가지를 흔들어 그릇의 것을 조금씩 뿌리면서 앞으로 갔어요. 첫 번째 겹이 풀렸어요. 아주 천천히요. 그다음에 두 번째가 풀렸고요. 풀린 것이 바닥에 내려앉을 때마다 낙엽이 옆으로 밀렸어요.</p><p>아탈란테가 숨을 참고 있다가 한 번 크게 내쉬었어요. 그 소리에 메데이아가 잠깐 노래를 멈출 뻔했지요.</p><p>이아손은 아탈란테를 보았어요. 아탈란테도 이아손을 보았고요. 둘 다 아무것도 하지 않았어요. 할 수 있는 것이 없었으니까요. 이아손은 손가락을 하나씩 접어 세었다가 다시 폈어요. 그러기를 몇 번 했지요.</p><p>노래는 오래 걸렸어요. 나중에 이아손은 그것이 얼마나 걸렸는지 말하지 못했어요. 다만 하늘을 올려다보니 별이 손 한 뼘쯤 옮겨 가 있었지요.</p><p>세 번째 겹과 네 번째 겹은 한꺼번에 풀렸어요. 다섯 번째부터는 빨랐고요.</p><p>“몇 겹 남았습니까?” 이아손이 입만 움직여 물었어요.</p><p>아탈란테가 손가락 셋을 폈어요. 나무 밑동이 조금씩 가늘어졌어요. 원래 저만한 나무였구나 싶어질 만큼요.</p><p>머리는 마지막이었어요. 머리가 내려오는 데 제일 오래 걸렸어요. 나무 옆 이끼 위에 내려놓기까지요. 숲이 조용했어요. 아까부터 조용했는데, 이제야 그 조용함이 들렸어요.</p><p>눈은 그대로 뜨고 있었어요. 그런데 아무것도 보고 있지 않았어요. 이아손이 메데이아 쪽으로 두 걸음 갔다가 멈췄어요. 부르면 오라고 했으니까요. 메데이아는 아직 부르지 않았고요.</p><p>메데이아는 그릇을 내려놓았어요. 그러고는 이아손 쪽으로 손을 들었지요. 소리는 내지 않았어요. 목소리가 다 나가 버렸거든요.</p><h2>나무에서 걷어 낸 것</h2><p>메데이아가 손을 들었어요. 이아손이 걸어갔지요. 걸으면서 그 머리 옆을 지나야 했어요. 지나갈 때 숨이 얼굴에 닿았어요. 뜨겁지도 차갑지도 않았고요.</p><p>“이것이 아직 숨을 쉬고 있습니다.”</p><p>“죽은 게 아니라 잠든 겁니다.” 메데이아가 말했어요.</p><p>이아손은 나무에 올라갔어요. 가지가 갈라지는 자리까지요. 양털은 거기 걸려 있었어요. 걸어 놓은 것이 아니라 가지가 그 위로 자란 것이었어요. 오래됐다는 뜻이었지요.</p><p>가지 위에서는 숲이 다 내려다보였어요. 아래쪽에 메데이아가 서 있고, 그 옆에 굵고 긴 것이 늘어져 있었지요. 어귀 쪽에는 아탈란테가 서 있었고요. 이아손은 그것을 한 번 보고 나서 손을 뻗었어요.</p><p>이아손은 그것을 두 손으로 걷었어요. 생각보다 무거웠어요. 물에 젖은 담요만 했지요. 그리고 따뜻했어요. 방금 벗겨 낸 것처럼요.</p><p>양털은 겉이 뻣뻣하고 안쪽은 부드러웠어요. 손가락을 털 안으로 밀어 넣으면 손가락이 안 보였고요. 털 끝마다 빛이 맺혀 있었어요. 이슬이 맺힌 것처럼요.</p><p>내려올 때는 한 손으로만 내려와야 했어요. 다른 손에는 그것이 들려 있었으니까요. 발이 한 번 미끄러졌어요. 그때 나뭇가지가 크게 흔들렸지요.</p><p>이끼 위의 것은 움직이지 않았어요. 이아손은 내려와서 그 머리 앞에 잠깐 섰어요. 무슨 말을 하려다가 하지 않았지요. 할 말이 떠올랐는데 그 말을 들을 수 있는 상태가 아니었으니까요.</p><p>“이제 가요.” 메데이아가 말했어요. 목소리가 갈라져서 잘 들리지 않았어요.</p><p>메데이아는 나무를 한 번 올려다보았어요. 아무것도 걸려 있지 않은 가지였어요. 메데이아가 그 가지를 그런 모양으로 보는 것은 그날이 처음이었지요.</p><p>이아손은 그것을 접었어요. 접으니까 빛이 반으로 줄었어요. 한 번 더 접었더니 또 반으로 줄었지요. 셋은 숲을 빠져나왔어요. 이아손이 그것을 겨드랑이에 끼고 걷는데도 빛이 새어 나왔어요. 옷 속에 넣으니까 옷이 안에서 빛났고요.</p><p>아탈란테가 걷다가 뒤를 돌아보았어요.</p><p>“양털 빛에 우리 발자국이 다 보입니다.”</p><p>메데이아가 겉옷을 벗어 그 위에 씌웠어요. 그러자 어두워졌지요. 어두워지고 나서야 셋 다 걸음이 빨라졌어요.</p><p>뒤에서 나무가 한 번 크게 흔들렸어요. 바람은 없었는데요. 셋은 돌아보지 않았어요.</p><h2>메데이아가 아는 뱃길</h2><p>강가까지는 뛰었어요. 뛰다가 메데이아가 한 번 넘어졌어요. 이아손이 팔을 잡아 일으켰고요. 넘어진 자리에서 겉옷이 벗겨져 다시 빛이 새어 나왔는데, 아탈란테가 그것을 주워 도로 덮었지요.</p><p>배는 벌써 밧줄을 반쯤 풀어 놓고 있었어요. 셋이 오는 것을 보고 노를 물에 넣었지요. 그때 궁 쪽에서 뿔피리 소리가 났어요. 한 번 길게, 두 번 짧게요. 그 소리를 듣고 강 아래쪽에서 다른 뿔피리가 대답했어요.</p><p>“강 아래쪽을 배들이 막았다는 뜻입니다.” 메데이아가 말했어요.</p><p>키를 잡은 사람이 강 아래쪽을 보았어요. 물 위에 불빛이 몇 개 떠 있었어요. 그 불빛들이 나란히 서 있었고요.</p><p>“강 아래가 막혀서 바다로 못 갑니다.”</p><p>“큰 물길로는 안 갑니다.” 메데이아가 말했어요.</p><p>메데이아는 뱃머리로 갔어요. 강어귀에는 갈대밭이 넓게 퍼져 있었어요. 그 사이로 물길이 여러 갈래 나 있었지요. 큰 배는 들어갈 수 없는 길이었어요. 바닥이 얕았으니까요.</p><p>“노를 반만 쓰세요. 안쪽 노는 세우고요.”</p><p>배가 갈대 사이로 들어갔어요. 갈대가 뱃전을 긁었어요. 소리가 났지만 그 소리는 갈대가 바람에 스치는 소리와 같았지요.</p><p>물이 배 밑에서 얕게 긁혔어요. 모래 위를 지나는 소리였지요. 노 젓는 사람들이 그 소리가 날 때마다 어깨를 조금씩 올렸어요.</p><p>메데이아는 갈림길이 나올 때마다 손으로 한쪽을 가리켰어요. 세어 보지도 않고요. 어릴 때부터 그 물길에서 조개를 캐고 놀았거든요.</p><p>키를 잡은 사람이 메데이아에게 물었어요.</p><p>“이 길 끝이 어딥니까?”</p><p>“이 길 끝은 바다예요.”</p><p>“확실합니까?”</p><p>“여기까지는 확실해요. 어릴 때 조개 캐러 다니던 데니까요.”</p><p>갈대 사이로 가다가 한 번은 다른 배와 아주 가까이 지나갔어요. 갈대 한 겹 너머였지요. 저쪽 배에서 사람 목소리가 들렸어요. 무슨 말인지도 알아들을 만큼 가까웠고요.</p><p>아르고호 사람들은 노를 물속에 넣은 채로 멈췄어요. 아무도 숨을 크게 쉬지 않았지요. 저쪽 배가 지나가고 나서도 한참을 그러고 있었어요.</p><p>한 번은 배가 바닥에 닿았어요. 사람들이 다 한쪽으로 몰려 앉았지요. 배가 기울면서 조금 떴고, 노를 밀어 빠져나왔어요.</p><p>뒤쪽에서 뿔피리가 여러 번 울렸어요. 소리가 이쪽저쪽에서 났어요. 어디로 갔는지 모른다는 뜻이었지요.</p><p>그날 밤 배는 메데이아가 아는 뱃길로 빠져나갔어요. 새벽에 갈대가 끝났어요. 앞이 트이고 물이 짜졌어요. 뒤에서 오던 소리는 밤중에 그쳤고요.</p><p>“쫓아오던 배들한테서 다 빠져나온 겁니까?” 하나가 물었어요.</p><p>“네. 여기서부터는 바다입니다.” 키를 잡은 사람이 대답했어요.</p><p>날이 밝고 나서 사람들이 서로 얼굴을 보았어요. 다들 얼굴에 갈댓잎에 긁힌 자국이 나 있었어요. 하나가 웃으니까 다 웃었지요. 웃고 나서는 한참 아무 말도 하지 않았고요.</p><p>아탈란테가 노를 놓고 손바닥을 보았어요. 물집이 두 개 잡혀 있었어요. 그것을 한참 보다가 다시 노를 잡았지요.</p><p>양털은 갑판 한가운데에 놓였어요. 낮에는 그냥 양털 같았어요. 털이 길고 촘촘한 양털이요. 밤이 되어야 빛났지요.</p><p>그래서 낮에는 그냥 두었다가 해가 지면 돛 천으로 덮었어요. 빛이 새지 않게요. 그런데 덮어 두면 그 자리만 도드라져 보였지요. 배 안에 짐이 그것 하나뿐인 것처럼요.</p><p>뱃머리에 박힌 나무 조각은 그 물건에 대해 아무 말도 하지 않았어요. 사람들이 물어봐도요. 덮기 전에 사람들은 그 옆에 앉아 있었어요. 손을 대 보는 사람도 있었고요. 손을 대면 따뜻했는데, 대고 있어도 그 따뜻함이 늘지도 줄지도 않았어요.</p><p>“이 양털이 뭐라고 우리가 여기까지 왔을까요?” 아탈란테가 말했어요.</p><p>아무도 대답하지 않았어요. 대답할 말이 마땅치 않았거든요.</p><p>“그래도 왔으니까 돌아는 가야지요.” 아탈란테가 그 말도 자기가 했어요.</p><p>메데이아는 고물 쪽에 앉아 있었어요. 배 안에서 제일 뒤였지요. 사람들은 메데이아에게 말을 잘 걸지 않았어요. 무서워서가 아니라 무슨 말을 해야 할지 몰라서였어요.</p><p>아탈란테가 하루는 그 옆에 가서 앉았어요. 아무 말도 하지 않고 앉아만 있었지요. 한참 뒤에 일어설 때 겉옷 하나를 놓고 갔어요. 숲에서 발자국을 덮었던 그 겉옷이 아니라 다른 것이었어요.</p><p>노를 젓던 사람 하나가 손등이 갈라져서 피가 났어요. 메데이아가 그것을 보고 자루에서 마른 잎을 하나 꺼내 주었지요. 씹어서 붙이라고요. 그 사람은 시키는 대로 했어요. 이튿날 아침에 손등이 아물어 있었고요.</p><p>그다음부터는 사람들이 조금씩 말을 걸었어요. 대단한 말은 아니었어요. 바람이 좋다든가 물이 짜졌다든가 하는 말이었지요.</p><p>어느 밤에는 이아손이 고물 쪽으로 왔어요. 그러고는 메데이아 옆에 앉았지요.</p><p>“이올코스 항구에 닿으면 어떻게 됩니까?” 메데이아가 물었어요.</p><p>“왕에게 양털을 줍니다.”</p><p>“양털을 주고 난 다음에는요?”</p><p>이아손은 바로 대답하지 않았어요. 배 밑에서 물이 갈라지는 소리가 났지요.</p><p>“그다음에는 아버지 자리를 되찾습니다.”</p><p>“그러면 제 자리는 어디입니까?”</p><p>“당신 자리는 제 옆입니다.” 이아손이 말했어요.</p><p>메데이아는 손으로 난간을 한 번 문질렀어요. 나무에 소금이 말라붙어 있어서 손끝이 까끌까끌했지요.</p><p>“말은 쉽습니다.”</p><p>“쉬운 말이라도 해야 할 때가 있습니다.”</p><p>여러 날이 더 지났어요. 어느 아침에 뱃머리에 박힌 나무 조각이 말했어요.</p><p>“곧 이올코스가 보인다.”</p><p>사람들이 다 앞을 보았어요. 안개가 걷히자 산이 하나 나왔고, 그 아래에 항구가 있었어요. 떠날 때 보던 그 항구였지요.</p><p>배 안이 시끄러워졌어요. 노를 젓지 않는 사람들이 한쪽 뱃전으로 몰렸거든요. 어떤 사람은 웃었고 어떤 사람은 두 손으로 얼굴을 문질렀어요.</p><p>메데이아만 앞을 보지 않았어요. 난간을 두 손으로 잡고 뒤를 보고 있었지요. 뒤에는 물밖에 없었어요. 아주 오래 그렇게 있었어요.</p></article></noscript>
