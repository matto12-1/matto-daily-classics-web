  <noscript><article class="ns-text"><h1>문을 열어 준 노부부</h1><h2>문을 두드리는 두 나그네</h2><p>저녁 무렵에 두 사람이 언덕을 넘어왔어요. 앞서 걷는 사람은 수염이 하얗고 어깨가 넓었어요. 뒤따르는 사람은 젊었고 걸음이 아주 가벼웠지요.</p><p>둘 다 낡은 옷을 입고 있었어요. 옷자락에 흙먼지가 앉아서, 누가 보아도 먼 길을 걸어온 나그네였어요.</p><p>두 사람은 제우스와 헤르메스였어요. 그날 아침 올림포스산에서 내려올 때 헤르메스가 물었지요.</p><p>“왜 이런 낡은 옷을 입고 내려갑니까?”</p><p>“번개를 들고 가면 다들 문을 열 테니까. 가난한 나그네에게도 문을 열어 주는지 보려는 거다.” 제우스가 말했어요.</p><p>언덕 아래에는 제법 큰 마을이 있었어요. 지붕 낮은 집들 사이에 담이 높은 집도 몇 채 섞여 있었지요. 굴뚝마다 저녁 연기가 올라오고 있었어요.</p><p>두 사람은 마을로 내려가 첫 번째 집 문을 두드렸어요. 문이 조금 열렸어요. 안에서 사람 하나가 얼굴만 내밀었어요.</p><p>“하룻밤만 묵어 갈 수 있겠습니까?” 헤르메스가 물었어요.</p><p>“우리 집에는 재워 줄 자리가 없소.”</p><p>문이 닫혔어요. 안에서는 그릇 부딪히는 소리와 웃음소리가 계속 들려왔어요. 두 번째 집에서는 문을 열지도 않았어요. 세 번째 집에서는 개를 풀었어요. 네 번째 집에서는 문틈으로 저리 가라는 소리만 나왔지요.</p><p>다섯 번째 집은 마을에서 제일 큰 집이었어요. 마당에서 고기 굽는 냄새가 담을 넘어왔어요. 헤르메스가 대문의 놋쇠 고리를 두드렸어요.</p><p>하인이 나와서 두 사람을 위아래로 훑어보았어요.</p><p>“오늘은 손님이 많아서 들일 수 없소.”</p><p>“마당 한구석이면 됩니다.” 헤르메스가 말했어요. “짚만 좀 깔면 되겠습니다.”</p><p>하인은 대답 대신 대문을 닫았어요. 안에서 사람들이 뭐라고 하는 소리와 함께 웃음이 터졌어요. 헤르메스는 닫힌 대문을 잠깐 보다가 돌아섰어요.</p><p>담이 높은 집일수록 문이 빨리 닫혔어요. 어떤 집은 두드리기도 전에 안에서 빗장 지르는 소리가 났어요. 두 나그네가 골목을 걸어오는 것을 창으로 보고 있었던 거예요.</p><p>헤르메스가 손가락으로 집들을 세어 보았어요. 스물세 집이었어요.</p><p>“문을 닫은 집이 스물세 집입니다.” 헤르메스가 말했어요.</p><p>제우스는 아무 말도 하지 않았어요. 다만 마을 끝을 향해 계속 걸었어요.</p><p>마을을 다 지나자 길이 좁아지면서 언덕으로 이어졌어요. 그 언덕 중턱에 집이 한 채 더 있었어요. 집이라기보다 오두막이었지요. 지붕은 갈대와 짚을 엮어 얹었고, 벽은 진흙을 발라 세운 것이었어요.</p><p>어둠 속에서 창문 하나가 노랗게 빛나고 있었어요. 아주 작은 불빛이었어요.</p><p>“저 언덕 위 오두막까지 가 볼까요?” 헤르메스가 물었어요.</p><p>“가 보자.”</p><p>두 사람은 언덕을 올라갔어요. 길이 좁고 돌이 많았어요. 다 올라갔을 때는 이미 별이 나와 있었지요.</p><p>오두막 마당에는 거위 한 마리가 목을 길게 빼고 서 있었어요. 낯선 발소리를 듣고 꽥 하고 한 번 울었지요. 그것이 그 집의 문지기였어요.</p><p>헤르메스가 문을 두드렸어요. 안에서 곧바로 발소리가 났어요. 문이 활짝 열렸어요. 문 앞에 등이 굽은 할아버지가 서 있었어요. 흰 머리가 몇 가닥 남지 않았고 턱에는 짧은 흰 수염이 있었어요. 손에는 흙으로 빚은 물병을 들고 있었지요.</p><p>“어서 들어오세요.” 할아버지가 말했어요. “바람이 찹니다.”</p><p>할아버지의 이름은 필레몬이었어요. 그 뒤에서 할머니가 앞치마에 손을 닦으며 나왔어요. 은빛 머리를 수건으로 감싸고 있었고, 바랜 초록 숄을 어깨에 두르고 있었어요.</p><p>할머니의 이름은 바우키스였어요. 두 사람은 아주 어렸을 때 이 오두막에서 혼인해서, 그 뒤로 한 번도 다른 데서 살아 본 적이 없었어요. 그러니까 함께 늙은 사람들이었지요.</p><p>오두막 안은 좁았어요. 어른 넷이 들어서니 벽에 등이 닿았어요. 그래도 따뜻했어요. 필레몬은 나무 걸상을 두 개 끌어다 놓고 그 위에 낡은 천을 폈어요. 천은 아주 오래된 것이라 색이 다 바래 있었지요. 필레몬은 그것을 손바닥으로 몇 번이나 쓸어 폈어요.</p><p>“이게 우리 집에서 제일 좋은 것입니다.” 필레몬이 말했어요.</p><p>“고맙습니다.” 제우스가 말하고 앉았어요.</p><p>필레몬은 그다음에 물을 데워 왔어요. 나그네들의 발을 씻으라고요. 대야가 이가 빠져 있어서 물을 조금만 부어야 했지요.</p><h2>다리 하나가 짧은 식탁</h2><p>바우키스가 화덕 앞에 무릎을 꿇고 앉아 잿더미를 헤쳤어요. 어제 남은 불씨가 그 속에 있었거든요. 마른 잎을 얹고 입으로 후후 불자 불이 살아났어요.</p><p>필레몬은 밖으로 나가 텃밭에서 배추를 한 포기 뽑아 왔어요. 그러고는 굴뚝에 걸어 둔 돼지고기 한 덩이를 내렸어요. 아껴 두었던 것이었지만 조금도 아깝지 않은 얼굴이었지요.</p><p>바우키스는 그 고기를 얇게 저몄어요. 얇게 저미면 많아 보이니까요. 그러고는 냄비를 걸고 물을 부었어요. 물이 끓는 동안 두 사람은 눈짓을 몇 번 주고받았어요. 오랜 부부는 말을 안 해도 부엌에서 서로 무엇을 할지 안다니까요.</p><p>바우키스는 식탁을 닦았어요. 식탁은 다리 하나가 짧아서 자꾸 기우뚱거렸어요. 바우키스는 깨진 그릇 조각을 짧은 다리 밑에 끼워 넣었어요. 늘 하던 일이라 손이 알아서 움직였지요.</p><p>그러고는 그 위에 박하 잎을 문질러 닦았어요. 오두막 안에 풀 냄새가 퍼졌어요. 식탁에 오른 것은 이런 것들이었어요. 삶은 배추와 돼지고기 한 조각, 소금에 절인 올리브, 나무 그릇에 담은 무화과와 대추, 그리고 벌집에서 막 떼어 낸 꿀이요.</p><p>마지막으로 바우키스가 흙항아리를 안고 왔어요. 안에 포도주가 조금 남아 있었어요.</p><p>“많지 않습니다.” 바우키스가 잔에 따르며 말했어요. “그래도 목은 축이실 겁니다.”</p><p>두 나그네는 잘 먹었어요. 필레몬은 이야기를 좋아하는 사람이라 자꾸 말을 붙였어요. 어디서 오셨는지, 길에서 무엇을 보셨는지요.</p><p>헤르메스는 그때마다 재미있는 이야기를 하나씩 꺼냈어요. 바우키스는 웃다가 앞치마로 눈가를 닦았어요. 이 오두막에 손님이 온 것이 몇 해 만인지 몰랐거든요.</p><p>“두 분은 아이가 없으십니까?” 헤르메스가 물었어요.</p><p>“없습니다.” 바우키스가 말했어요. “그래서 둘이 서로 아이 노릇을 하며 삽니다.”</p><p>필레몬이 그 말에 웃으면서 항아리를 다시 기울였어요. 잔이 또 찼어요. 그때는 아무도 그것을 이상하게 여기지 않았어요.</p><p>그러다가 바우키스가 잔을 채우려고 항아리를 기울였어요. 그런데 이상했어요. 아까 따랐는데도 항아리가 그대로 무거웠어요.</p><p>바우키스는 항아리 안을 들여다보았어요. 포도주가 처음 그대로 차 있었어요. 손이 떨려서 항아리를 식탁에 내려놓았지요.</p><p>“여보.”</p><p>바우키스가 필레몬을 불렀어요. 목소리가 아주 작았어요. 필레몬이 와서 항아리 안을 들여다보았어요. 두 사람은 서로를 보았어요. 그리고 아무 말 없이 손님들 쪽으로 몸을 돌렸어요.</p><p>오두막 밖으로 나간 것은 그다음이었어요. 필레몬이 마당에서 거위를 쫓기 시작했거든요. 그 집에 하나 남은 거위였어요. 신을 대접하려면 그것밖에 없다고 생각한 거예요.</p><p>거위는 빨랐어요. 필레몬은 느렸어요. 거위가 마당을 돌고 텃밭을 지나 담을 따라 달아났어요. 바우키스도 앞치마를 펄럭이며 뛰었지만 소용없었지요.</p><p>두 노인은 숨이 차서 마당 한가운데에 멈춰 섰어요. 거위는 오두막 문 안으로 쏙 들어가더니, 앉아 있는 나그네의 무릎 뒤에 숨었어요.</p><p>“그만두세요.” 제우스가 말했어요. “그 거위는 살려 두시지요.”</p><p>필레몬이 허리를 펴고 나그네를 보았어요. 목소리가 조금 전과 달랐거든요. 그 목소리는 오두막 안에서 났는데, 마당에 있는 두 사람의 귀에는 언덕 전체에서 나는 것처럼 들렸어요.</p><p>바우키스가 먼저 무릎을 꿇었어요. 필레몬도 천천히 그 옆에 꿇어앉았지요.</p><p>“신이신 줄 몰라뵈었습니다. 그런 분께 배추나 내어 드렸습니다.” 필레몬이 말했어요.</p><p>무릎이 아파서 목소리가 떨렸는데, 그 떨림이 무서워서 나는 것인지 아파서 나는 것인지 본인도 알 수 없었어요.</p><h2>언덕 위에서 내려다본 것</h2><p>제우스와 헤르메스가 문간으로 걸어 나왔어요. 낡은 옷은 그대로였어요. 그런데 두 사람의 발밑에서 마당의 흙이 아주 조금 밝아 보였지요.</p><p>“일어나세요. 저희가 먼저 신세를 졌습니다.” 헤르메스가 말했어요.</p><p>“오늘 저녁 이 마을에서 문을 연 집은 이 집 하나였습니다.” 제우스가 말했어요.</p><p>필레몬은 무슨 말을 해야 할지 몰랐어요. 그래서 엉뚱한 말을 했어요.</p><p>“식탁 다리가 짧아서 죄송합니다.”</p><p>헤르메스가 웃음을 터뜨렸어요. 제우스도 수염 밑에서 조금 웃었어요.</p><p>“따라오세요.” 제우스가 말했어요. “보여 드릴 것이 있습니다.”</p><p>네 사람은 언덕 꼭대기까지 걸어 올라갔어요. 늙은 두 사람에게는 가파른 길이었어요. 필레몬이 자꾸 뒤처지자 바우키스가 손을 잡아 주었지요.</p><p>꼭대기에 서니 마을이 한눈에 내려다보였어요. 창마다 불빛이 켜져 있었어요. 아까 문을 닫았던 집들이었어요.</p><p>“저 아래 사람들은 오늘 저녁 문 앞에서 누구를 돌려보냈는지 모릅니다.” 제우스가 말했어요.</p><p>바우키스가 마을 쪽을 오래 보았어요. 그러고는 조심스럽게 물었어요.</p><p>“저 사람들을 어떻게 하실 겁니까?”</p><p>“저 사람들을 어떻게 하기를 바라십니까?”</p><p>바우키스는 대답하기 전에 필레몬을 보았어요. 필레몬이 아주 작게 고개를 저었어요.</p><p>“저 집들에도 아이들이 잡니다. 너그러이 봐주세요.”</p><p>바우키스가 한마디를 더 보탰어요.</p><p>“우리도 젊었을 때는 문을 늦게 연 적이 있습니다.”</p><p>제우스는 한참 동안 마을을 내려다보았어요. 바람이 언덕을 한 번 훑고 지나갔어요.</p><p>“알겠습니다. 저 마을은 그대로 두지요.”</p><p>제우스는 그 말만 했어요. 마을의 불빛은 하나도 꺼지지 않았어요. 헤르메스가 두 노인 쪽으로 몸을 돌렸어요. 지팡이를 한 손에 세워 짚고 있었지요.</p><p>“이제 두 분 차례입니다. 바라는 것을 무엇이든 하나 말씀해 보세요.”</p><p>바우키스가 눈을 크게 떴어요.</p><p>“소원을 말하라는 말씀입니까?”</p><p>“네, 소원입니다.”</p><p>두 사람은 한참 아무 말도 하지 못했어요. 평생 무엇을 달라고 빌어 본 적이 없는 사람들이었거든요. 필레몬은 발끝만 내려다보았고, 바우키스는 숄 자락을 손가락으로 말고 있었어요.</p><p>“잠깐만 기다려 주십시오.”</p><p>필레몬이 그렇게 말하고 바우키스를 몇 걸음 데리고 갔어요. 두 사람은 언덕 가장자리에 서서 머리를 맞대고 이야기했어요.</p><p>아주 오래 이야기하지는 않았어요. 오십 해쯤 같이 산 사람들은 그렇거든요. 한 사람이 반쯤 말하면 다른 사람이 이미 고개를 끄덕이고 있지요.</p><p>두 사람이 돌아왔어요. 필레몬이 먼저 입을 열었어요.</p><p>“소원을 두 가지 빌어도 됩니까?”</p><p>“말씀하세요.”</p><p>필레몬은 제우스에게 가까이 다가가 아주 작은 소리로 말했어요. 바우키스도 옆에서 한마디를 보탰지요. 무엇이라고 말했는지는 그 자리에 있던 넷만 들었어요. 바람이 나머지를 다 지워 버렸거든요.</p><p>제우스는 다 듣고 나서 천천히 고개를 끄덕였어요.</p><h2>아침에 눈을 뜨니</h2><p>네 사람은 언덕을 내려왔어요. 두 나그네는 오두막 앞에서 걸음을 멈추었어요.</p><p>“안으로 들어오지 않으십니까?” 바우키스가 물었어요.</p><p>“이제 가야 합니다.” 헤르메스가 말했어요. “두 분은 주무세요. 아침까지요.”</p><p>필레몬과 바우키스는 문간에 서서 두 사람이 내려가는 것을 보았어요. 어둠 속으로 걸어 들어가더니 어느 순간 보이지 않았어요. 발소리도 나지 않았지요.</p><p>두 사람은 오두막으로 들어가 문을 닫았어요. 식탁 위에는 빈 그릇들이 그대로 있었어요. 흙항아리만 여전히 묵직했지요.</p><p>바우키스는 그릇을 씻지 않고 그냥 두었어요. 그날 하루가 너무 커서, 손을 대면 어디가 무너질 것 같았거든요.</p><p>필레몬은 문에 빗장을 지르려다가 그만두었어요. 오늘 같은 밤에 빗장을 지르고 싶지 않았거든요. 문은 그냥 닫아만 두었어요.</p><p>두 사람은 짚 위에 나란히 누웠어요. 천장의 갈대 사이로 별이 한두 개 보였어요.</p><p>“그분들이 정말 신이었을까요?” 바우키스가 물었어요.</p><p>“신이셨겠지요.”</p><p>“우리 집에서 배추를 잡수셨는데요.”</p><p>필레몬이 웃었어요. 어둠 속에서 두 사람은 한참 웃었어요.</p><p>“여보.” 바우키스가 다시 불렀어요. “이 집을 지키게 해 달라는 거, 같은 날 함께 눈을 감게 해 달라는 거. 잘 빈 걸까요?”</p><p>“잘 빌었어요.”</p><p>“그렇지요?”</p><p>“그럼요.”</p><p>바우키스는 그 말을 듣고 눈을 감았어요. 밖에서 거위가 한 번 꽥 하고 울었어요. 그러고는 조용해졌지요. 두 사람은 손을 잡은 채로 잠이 들었어요.</p><p>아침이었어요. 필레몬이 먼저 눈을 떴어요. 빛이 너무 밝아서요. 오두막 창문으로 들어오던 빛이 아니었어요.</p><p>필레몬은 눈을 몇 번 깜박이고 천장을 올려다보았어요. 갈대가 없었어요. 대신 아주 높은 곳에 나무를 짜 맞춘 천장이 있었어요.</p><p>필레몬은 천천히 일어나 앉았어요. 그러고는 옆으로 고개를 돌렸어요. 진흙 벽이 있던 자리에 흰 돌기둥이 서 있었어요. 하나가 아니었어요. 기둥은 줄을 지어 저 안쪽까지 이어져 있었고, 그 사이로 아침 햇살이 길게 들어와 바닥에 무늬를 만들고 있었지요.</p><p>바닥은 반들반들한 돌이었어요. 다리 짧은 식탁이 그 한가운데에 그대로 놓여 있었어요. 깨진 그릇 조각도 그대로 끼워져 있었지요.</p><p>필레몬은 그 조각을 보고서야 여기가 자기 집이라는 것을 알았어요. 지붕이 저렇게 높아졌는데도요. 그러고는 자기 손을 내려다보았어요. 손은 어제와 똑같은 늙은 손이었어요. 그것이 이상하게 마음을 놓이게 했지요.</p><p>문이 있던 자리에는 커다란 청동 문이 달려 있었어요. 그 문이 반쯤 열려 있었고, 문턱 앞에 거위 한 마리가 앉아서 아침 볕을 쬐고 있었어요.</p><p>“여보.”</p><p>필레몬이 옆을 흔들었어요. 바우키스가 눈을 떴어요.</p></article></noscript>
