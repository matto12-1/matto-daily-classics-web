  <noscript><article class="ns-text"><h1>떠도는 어머니, 델로스섬</h1><p>그해 봄 어느 새벽, 헤라가 산 위를 한 바퀴 돌았어요. 새벽 순찰은 헤라의 오랜 버릇이었지요. 어젯밤에 누가 늦게 들어왔는지, 어느 자리가 비어 있었는지 헤라는 걸으면서 다 보았거든요.</p><p>그날 새벽에는 왕좌가 비어 있었어요. 헤라는 그 앞에 한참 서 있었어요. 기둥 사이로 찬 바람이 한 줄기 지나갔지요.</p><p>헤라는 그 빈자리에 손을 얹어 보았어요. 차가웠어요. 제우스가 밤새 산에 없었다는 뜻이었지요.</p><p>산 아래에 레토라는 여신이 살고 있었어요. 티탄 가운데 하나였지요. 티탄들 편에 서서 싸운 적도 없고, 올림포스산에 올라와 자리를 달라고 한 적도 없는 조용한 이였어요.</p><p>레토는 늘 걸어 다녔어요. 들판을 지나고, 강을 건너고, 바닷가를 따라 걸었지요. 흐린 잿빛 베일을 쓰고 있어서 멀리서 보면 안개 한 자락이 지나가는 것 같았어요.</p><p>그 레토가 제우스와 사랑에 빠졌어요. 제우스에게는 이미 헤라라는 아내가 있었는데도요. 곧 아이가 태어날 참이었지요. 그리고 헤라는 그것이 미웠어요.</p><p>헤라는 아무에게도 그 이야기를 하지 않았어요. 다만 그날 저녁, 산 끝으로 걸어 나가 아래를 오래 내려다보았어요. 아주 오랜만이었지요. 아기를 안고 그 자리에 섰던 새벽 뒤로 처음이었으니까요.</p><p>밤이 되자 구름이 발밑에서 천천히 흘러갔어요. 그 아래로 검은 땅이 넓게 펼쳐져 있었어요. 헤라는 그 땅을 향해 한마디를 했어요.</p><p>“해가 비치는 땅 어디에서도 레토가 아이를 낳게 하지 마라.”</p><p>목소리는 크지 않았어요. 그런데 그 말은 골짜기마다, 섬마다, 들판마다 닿았어요. 왕비의 말이었으니까요.</p><p>왕비라고 해서 남의 아이까지 막을 권리가 있는 건 아니었지요. 그날 밤부터 세상의 땅들이 서로 눈치를 보기 시작했어요. 골짜기는 골짜기끼리, 섬은 섬끼리요. 왕비의 말을 어겼다가 무슨 일을 당하는지는 아무도 몰랐고, 모르는 쪽이 더 무서웠거든요.</p><h2>받아 주지 않는 땅</h2><p>레토는 그날부터 걷기 시작했어요. 처음 찾아간 곳은 강가의 큰 마을이었어요. 밀밭이 넓고 물이 좋은 곳이었지요. 레토는 담 앞에 서서 문을 두드렸어요.</p><p>문이 손바닥만큼 열렸다가 곧 닫혔어요. 안에서 빗장을 지르는 소리가 났어요. 레토는 그 앞에 잠깐 서 있다가 돌아섰어요.</p><p>다음은 산 중턱의 작은 마을이었어요. 양을 치는 사람들이 사는 곳이었지요. 이번에는 나이 많은 사람 하나가 밖으로 나왔어요. 손에 물그릇을 들고 있었어요.</p><p>“물은 드리겠습니다.”</p><p>노인이 말했어요. 목소리가 떨렸어요.</p><p>“그런데 하룻밤은 못 재워 드립니다. 왕비님 말을 어겼다가 우리 마을 우물이라도 마르면 저 아이들은 어떻게 삽니까?”</p><p>레토는 물그릇을 두 손으로 받았어요. 그러고는 고맙다고 했어요. 화를 내지도 않았고, 한 번 더 부탁하지도 않았지요.</p><p>노인은 문을 닫으면서 뒤를 한 번 돌아보았어요. 그날 밤 그 노인은 오래 잠들지 못했다고 해요. 레토는 계속 걸었어요.</p><p>세 번째로 찾아간 곳은 강 하나가 통째로 흐르는 골짜기였어요. 물소리가 하도 좋아서 레토는 잠깐 걸음을 멈췄지요. 그런데 레토가 강가로 내려서자 물이 저 혼자 갈라지더니 반대편으로 비켜 흘렀어요. 강도 레토를 받아 주지 않은 거예요.</p><p>그때 어디선가 아주 작은 목소리가 들렸어요.</p><p>“받아 드리지 못해 미안합니다.”</p><p>누가 한 말인지는 알 수 없었어요. 강물이었을 수도 있고, 골짜기였을 수도 있지요. 레토는 그 목소리가 난 쪽으로 고개를 한 번 숙이고, 다시 걸음을 옮겼어요.</p><p>들판은 레토가 다가오면 풀을 눕혔어요. 산은 구름을 끌어다 얼굴을 가렸어요. 어떤 섬은 레토가 보이자 파도를 높이 세워 뭍을 감췄지요.</p><p>땅들은 레토가 미운 것이 아니었어요. 다만 헤라의 이름이 나오면 다들 그렇게 되었지요. 그래도 문 앞에서 돌아서는 사람의 마음이 덜 아픈 건 아니에요.</p><p>레토의 발이 부르텄어요. 베일 끝이 해졌어요. 그래도 레토는 앉지 않았어요. 한 번 앉으면 다시 못 일어날 것 같았거든요.</p><p>밤에는 나무 밑에 등을 대고 눈을 붙였어요. 아침이면 이슬을 손등으로 훔치고 다시 걸었지요. 어디로 가는지는 레토도 몰랐어요. 다만 가지 않은 쪽으로 갔어요.</p><p>레토는 사람들을 원망하지 않았어요. 문을 닫는 손이 떨리는 것을 여러 번 보았거든요. 무서워서 닫는 문과 미워서 닫는 문은 소리가 다르지요.</p><p>그러는 사이에 계절이 한 번 바뀌었어요. 레토는 아직 걷고 있었어요.</p><h2>물 위를 떠다니는 섬</h2><p>어느 날 저녁, 레토는 바닷가 벼랑 끝에 섰어요. 더 갈 데가 없었어요. 앞은 전부 물이었지요. 해가 바다로 내려앉고 있었어요. 물빛이 붉었어요. 그때 레토의 눈에 무언가가 들어왔어요.</p><p>바다 한가운데에 작은 것이 하나 떠 있었어요. 배는 아니었어요. 바위였어요. 바위섬 하나가 물 위를 천천히 흘러가고 있었지요.</p><p>그 섬은 뿌리가 없었어요. 바다 밑바닥에 발을 붙이지 못하고 파도를 따라 이리저리 떠다녔어요. 그래서 그 섬의 이름을 아는 사람이 거의 없었지요.</p><p>섬에는 아무것도 자라지 않았어요. 나무 한 그루, 풀 한 포기 없었어요. 갈매기도 그 섬에는 내려앉지 않았어요. 언제 어디로 흘러갈지 모르는 자리였으니까요.</p><p>레토는 바다로 걸어 들어갔어요. 그리고 그 섬 쪽으로 헤엄쳤어요. 물이 허리까지 차올랐어요. 그런데 이상하게도 파도가 레토를 밀어내지 않았어요. 오히려 등을 슬쩍슬쩍 떠미는 것 같았지요.</p><p>레토가 바위 위로 올라섰을 때, 섬이 한 번 흔들렸어요.</p><p>“여기는 나무도 풀도 아무것도 없어요.”</p><p>섬이 말했어요. 목소리가 아주 작았어요. 바위 밑에서 물이 찰랑이는 소리 같았지요.</p><p>“알아요.”</p><p>“왕비님의 말을 저도 들었어요. 저는 땅이 아니지만, 들리기는 들렸어요.”</p><p>“당신은 땅이 아니라고 했지요.” 레토가 말했어요. “왕비님은 해가 비치는 땅에서 아이를 낳지 못하게 했어요. 떠다니는 섬은 그 말에 걸리지 않아요.”</p><p>레토는 무릎을 굽히고 바위에 손을 얹었어요. 바위는 밤바다처럼 차가웠어요. 그리고 손바닥 밑에서 아주 잘게 떨고 있었지요. 겁먹은 짐승의 등을 만지는 것 같았어요.</p><p>“그럼 제가 여기서 아이를 낳게 해 줄래요?”</p><p>섬은 한참 대답하지 않았어요. 파도가 몇 번 왔다 갔어요. 그러는 사이에 해가 물속으로 다 내려갔어요. 물빛이 붉은색에서 검은색으로 바뀌었지요.</p><p>“무서워요.”</p><p>섬이 말했어요.</p><p>“저는 작고, 아무것도 기를 줄 몰라요. 여기서 태어난 아이가 나중에 저를 마음에 안 들어 하면 어쩌지요? 발로 한 번 차면 저는 부서지는데요.”</p><p>레토는 웃었어요. 아주 오랜만에 웃는 얼굴이었지요. 부르튼 발로 여기까지 걸어온 사람이 짓는 웃음치고는 참 환했어요. 섬은 그 웃음을 어떻게 받아야 할지 몰라 잠깐 조용해졌어요.</p><p>“여기서 태어날 아이는 빛을 데리고 올 거예요.”</p><p>레토가 말했어요.</p><p>“그러면 사람들이 배를 타고 이 섬으로 찾아올 거예요. 이름도 모르던 이 바위를, 사람들이 가장 먼저 떠올리는 이름으로 만들어 줄 거고요.”</p><p>섬이 다시 흔들렸어요. 이번에는 떨어서가 아니었어요. 파도가 섬 둘레를 한 바퀴 돌면서 하얗게 부서졌어요. 바위 사이에 고여 있던 물이 조금 넘쳤지요.</p><p>“그럼 여기서 아이를 낳으세요.”</p><p>그 섬의 이름은 델로스섬이었어요. 그날 밤 델로스섬은 처음으로 한자리에 오래 머물렀어요. 파도가 옆구리를 밀어도 좀처럼 밀려나지 않았지요.</p><h2>아흐레 낮과 아흐레 밤</h2><p>델로스섬 한가운데에는 잎이 부챗살처럼 넓게 퍼진 종려나무가 한 그루 서 있었어요. 그 섬에 있는 단 하나의 나무였지요. 뿌리를 어디에 내렸는지도 알 수 없는 나무였어요.</p><p>레토는 그 나무 아래에 앉아 줄기를 붙잡았어요. 그러고서 아흐레 낮과 아흐레 밤이 지나갔어요. 바다는 그동안 한 번도 잔잔해지지 않았어요.</p><p>뭍에서도 그 아흐레를 기억하는 사람이 많았어요. 밤마다 바다 저쪽에서 흐릿한 빛이 오르내렸거든요. 배를 가진 사람들은 그쪽으로 나가지 않았어요. 무슨 일이 벌어지고 있는지 다들 짐작하고 있었지요.</p><p>하늘에서 여신들이 내려왔어요. 아이 낳는 일을 도우러 온 이들이었지요. 그들은 레토의 손을 잡아 주고, 이마를 닦아 주고, 낮은 목소리로 무슨 말인가를 계속 들려주었어요.</p><p>아흐레째 밤이 가장 길었어요. 그런데 델로스섬은 그 밤에 한 번도 흔들리지 않았어요. 파도가 밀려와도 그 자리에 버티고 서 있었지요. 그렇게 작은 섬이 어디서 그런 힘을 냈는지는 아무도 몰라요.</p><p>그리고 열흘째 아침이 왔어요. 먼저 태어난 것은 딸이었어요. 딸은 태어나자마자 눈을 떴어요. 울지 않았어요. 대신 몸을 일으켜 어머니 곁에 섰지요. 그러고는 여신들이 하던 일을 그대로 이어받았어요. 어머니의 손을 잡고, 이마를 닦아 주었어요.</p><p>“어머니, 조금만 더 힘내세요.”</p><p>딸이 말했어요. 세상에 나와서 처음 한 말이었어요. 그리고 얼마 지나지 않아 아들이 태어났어요.</p><p>아들이 세상에 나온 순간, 델로스섬 전체가 금빛으로 물들었어요. 바위가, 파도가, 종려나무 잎사귀가 한꺼번에 빛났어요. 어찌나 밝았는지 멀리 뭍에서도 그 빛이 보였다고 해요.</p><p>그 빛을 본 뱃사람들이 노를 놓고 자리에서 일어섰어요. 멀리 날아가던 새들이 방향을 바꿔 그쪽으로 몰려갔어요. 그날 아침 바다는 아흐레 만에 처음으로 잔잔해졌다고 해요.</p><p>빛이 지나간 자리마다 초록이 올라왔어요. 바위 틈에서 풀이 돋고, 그 사이로 꽃이 피었어요. 아무것도 자라지 않던 섬이었는데요.</p><p>그리고 발밑에서 무거운 소리가 났어요. 쿵. 델로스섬이 바다 밑바닥까지 뿌리를 내린 거예요. 그날부터 델로스섬은 더 이상 떠다니지 않았어요. 지금도 그 자리에 있어요.</p><p>두 아이의 이름은 아르테미스와 아폴론이었어요. 먼저 나온 누이가 아르테미스, 뒤에 나온 동생이 아폴론이었지요.</p><p>쌍둥이는 놀랄 만큼 빨리 자랐어요. 사흘 만에 걷고, 아흐레 만에 뛰었어요. 한 달이 지나자 어머니와 키가 비슷해졌지요.</p><p>아르테미스는 섬 끝까지 달려갔다가 돌아오는 것을 좋아했어요. 맨발이 바위에 긁혀도 아랑곳하지 않았어요. 돌아올 때는 늘 무언가를 들고 왔지요. 조개껍데기든, 풀 한 줌이든요.</p><p>아폴론은 물가에 오래 앉아 있었어요. 해가 떠서 질 때까지 하늘빛이 어떻게 바뀌는지 하나도 놓치지 않고 보았지요.</p><p>두 아이는 하루에 한 번쯤 크게 다투었어요. 그러고는 반나절도 지나지 않아 나란히 앉아 있었지요. 누가 먼저 말을 걸었는지는 늘 알 수 없었어요.</p><p>레토는 그 곁에서 종려나무 그늘에 앉아 있곤 했어요. 이제는 누가 문을 닫아도 상관없었어요. 돌아갈 자리가 생겼으니까요.</p><p>얼마 뒤 제우스가 델로스섬으로 내려왔어요. 두 아이 앞에 서서는 무슨 말을 먼저 해야 할지 몰라 잠깐 가만히 있었어요.</p><p>“무엇을 갖고 싶으냐?”</p><p>아르테미스가 먼저 대답했어요.</p><p>“산과 숲이요. 그리고 은으로 만든 활 하나요.”</p><p>“그것뿐이냐?”</p><p>“같이 다닐 사람들도요. 잘 달리는 사람들로요.”</p><p>제우스는 웃었어요. 그러고는 아폴론을 보았어요. 아폴론은 조금 더 생각하다가 대답했어요.</p><p>“저는 참말을 맡고 싶어요.”</p><p>제우스가 눈썹을 들어 올렸어요. 아르테미스처럼 손에 잡히는 것을 말할 줄 알았는데, 뜻밖의 대답이었거든요.</p><p>“참말을 맡겠다니, 그게 무슨 뜻이냐?”</p><p>“사람들은 앞일을 몰라서 무서워하잖아요. 앞일을 물으면 참말로 알려 주는 곳이 한 군데쯤 있으면 좋겠어요.”</p><p>“거짓말은 한마디도 하지 않겠느냐?”</p><p>“한마디도 하지 않겠어요.”</p><p>제우스는 두 아이에게 활을 하나씩 주었어요. 아르테미스에게는 은으로 만든 활을, 아폴론에게는 금으로 만든 활을요. 시위를 당겼다 놓으면 아주 낮은 소리가 울렸어요.</p><p>레토는 조금 떨어진 곳에서 그 모습을 보고 있었어요. 종려나무에 기대선 채로요. 부르텄던 발은 아직 다 낫지 않았지요.</p><p>제우스가 돌아가고 난 뒤, 아르테미스가 은활을 들고 어머니에게 달려왔어요. 시위를 당겨 보라고요. 레토는 시키는 대로 시위를 당겼다가 놓았어요. 낮은 소리가 바다 위로 길게 퍼져 나갔어요.</p><h2>골짜기로 가는 걸음</h2><p>아폴론이 자기가 앉을 자리를 찾아 나선 것은 그 얼마 뒤였어요. 아폴론은 뭍으로 건너가 여러 곳을 걸어 보았어요. 바닷가에도 가 보고, 넓은 들판에도 가 보고, 높은 산꼭대기에도 올라가 보았지요. 그런데 어디에서도 여기다 싶은 느낌이 오지 않았어요.</p><p>그러다 어느 골짜기에 닿았어요. 두 산 사이에 낀 좁은 골짜기였어요. 위쪽 바위 틈에서 김이 새어 나왔어요. 그 김을 들이마시면 머릿속이 맑아지는 것 같았지요. 발밑에서는 물소리가 났어요.</p><p>아폴론은 그 자리에 서서 눈을 감았어요. 여기다 싶었어요. 그 골짜기는 세상의 한가운데쯤에 있었어요. 동쪽에서 걸어와도 서쪽에서 걸어와도 비슷하게 걸리는 자리였지요. 사람들이 무언가를 물으러 오기에 그만한 데가 없었어요.</p><p>그런데 이상했어요. 그 좋은 자리에 사람이 하나도 없었거든요. 아래쪽 마을로 내려가 물어보니, 사람들 얼굴빛이 한꺼번에 변했어요.</p><p>“그 골짜기 위로는 올라가지 마세요.”</p><p>“왜요?”</p><p>“거기에는 무서운 큰 짐승이 하나 삽니다.”</p><p>사람들 말로는 아주 오래전부터 그 골짜기에 무언가가 살고 있다고 했어요. 몸이 굵고 길어서, 지나간 자리에는 바위가 긁힌 자국이 남는다고요. 소를 몰고 그 근처를 지나던 사람이 소만 잃고 돌아온 적도 있다고 했어요.</p><p>“그 짐승 이름이 뭔데요?”</p><p>“이름 같은 걸 누가 붙입니까. 그냥 큰 뱀이지요.”</p><p>아폴론은 마을을 한 번 둘러보았어요. 집집마다 문이 꼭 닫혀 있었어요. 어머니가 닫힌 문 앞에서 여러 번 돌아섰다던 이야기가 그때 떠올랐어요. 닫힌 문은 이제 그만 보고 싶었지요.</p><p>아폴론은 고맙다고 하고 돌아섰어요. 그러고는 마을 사람들이 말리는 쪽으로 걸어 올라갔어요. 그 골짜기의 이름은 델포이였어요.</p><p>올라가는 길은 좁았어요. 오래전에는 사람이 다닌 길이었던 것 같았어요. 돌계단 같은 것이 군데군데 남아 있었거든요. 그런데 그 위로 풀이 무릎까지 자라 있었어요. 아무도 밟지 않은 지 오래된 길이었지요.</p><p>해가 기울고 있었어요. 골짜기 입구에는 안개 같은 김이 가득 차 있었어요. 그 안쪽에서 무언가 아주 크게 한 번 뒤척이는 소리가 났어요. 커다란 돌이 서로 부딪히는 소리 같기도 했지요.</p><p>아폴론은 어깨에서 금빛 활을 내렸어요. 시위를 한 번 당겼다가 놓았어요. 낮은 소리가 골짜기 안쪽으로 들어갔어요.</p><p>안에서 나던 소리가 뚝 그쳤어요. 아폴론은 발을 한 걸음 앞으로 내디뎠어요. 그러고는 김 속으로 걸어 들어갔어요.</p></article></noscript>
