  <noscript><article class="ns-text"><h1>콜키스의 공주</h1><h2>부딪히는 두 바위</h2><p>비둘기 한 마리가 사람 손 안에서 날개를 폈다 접었어요. 아탈란테가 두 손으로 그것을 감싸 쥐고 있었지요. 새는 배를 타고 오는 내내 갑판 밑 바구니 안에 있었어요. 이날 하루를 위해 실어 온 새였거든요.</p><p>앞쪽에서 소리가 났어요. 돌과 돌이 부딪는 소리였어요. 아주 큰 그릇 두 개를 맞부딪는 것 같았지요. 그 소리가 한 번 나고 나면 한참 조용했고, 그러다 또 났어요.</p><p>바닷길이 거기서 좁아졌어요. 좌우에 시커먼 바위가 하나씩 서 있었지요. 두 바위 사이는 배 한 척이 겨우 지날 만했어요. 그런데 그 사이가 늘 그만큼인 것은 아니었어요. 두 바위가 저희끼리 다가갔다 물러났다 했거든요.</p><p>노 젓는 사람들이 노를 물에서 들어 올렸어요. 아무도 시키지 않았는데 다 같이 그렇게 했지요. 배가 천천히 멎었어요.</p><p>뱃머리에 박힌 나무 조각이 말했어요.</p><p>“새를 먼저 보내라.”</p><p>그 조각은 배를 지을 때 뱃머리에 끼워 넣은 나무였어요. 항구를 떠난 날부터 가끔 그렇게 한마디씩 했지요. 이제는 아무도 놀라지 않았어요. 다만 그것이 말을 하면 하던 일을 멈추고 들었어요.</p><p>아탈란테가 뱃머리로 걸어 나갔어요. 그러고는 손을 폈지요. 비둘기가 손바닥에서 한 번 발을 굴렀다가 곧장 앞으로 날아갔어요. 새가 두 바위 사이로 들어가는 것이 보였어요. 아주 작게요.</p><p>두 바위가 닫혔어요. 소리가 뱃전을 때렸어요. 물이 한꺼번에 밀려와서 배가 뒤로 밀렸지요. 노 젓는 사람들이 어깨를 움츠렸어요.</p><p>바위가 다시 열렸을 때 비둘기는 저쪽 하늘에 있었어요. 꼬리 깃털이 몇 개 빠져 있었고요. 빠진 깃털이 물 위에 천천히 내려앉았어요.</p><p>“새가 꼬리 깃털만 잃고 빠져나갔네요.” 아탈란테가 말했어요.</p><p>“그러면 우리 배도 고물 끝만 잃고 지나가겠군요.” 이아손이 말했어요.</p><p>이아손은 그러고 나서 뒤를 돌아보았어요. 노 젓는 사람들이 다 이아손을 보고 있었지요. 이아손은 고물 쪽으로 걸어가 키를 잡은 사람 옆에 섰어요.</p><p>“바위가 열리면 멈추지 말고 한 번에 지나갑니다.”</p><p>이아손이 손을 들었어요. 노가 한꺼번에 물에 들어갔지요. 배가 앞으로 튀어 나갔어요. 노 젓는 사람 하나가 박자를 세었어요. 하나 둘, 하나 둘. 세는 소리가 점점 빨라졌어요. 나중에는 세는 소리와 노 소리가 붙어서 한 소리처럼 들렸지요.</p><p>좌우가 어두워졌어요. 바위가 하늘을 가렸거든요. 올려다보면 하늘이 실처럼 가늘었어요. 물이 벽에 부딪는 소리가 배 안에서 크게 울렸고요.</p><p>바위가 움직이기 시작했어요. 왼쪽 것이 먼저 왔어요. 노 젓는 사람들은 그것을 보지 않았어요. 볼 겨를이 없었으니까요. 등만 굽혔다 폈다 했지요.</p><p>뒤에서 물이 밀려왔어요. 바위가 닫히면서 밀어낸 물이었어요. 그 물이 배를 앞으로 떠밀었어요. 그러고는 소리가 났지요.</p><p>배는 지나갔어요. 고물 끝에 붙어 있던 나무 장식이 한 뼘쯤 깎여 나갔고요. 깎인 자리가 하얬어요. 돌아보니 두 바위가 도로 벌어져 있었어요. 벌어진 채로 가만히 있었지요. 그러고는 다시 움직이지 않았어요.</p><p>“이제 저 바위 사이는 누구나 지나갈 수 있는 길이네요.” 아탈란테가 말했어요.</p><p>이아손은 대답하지 않았어요. 깎여 나간 고물 자리를 손으로 만져 보고 있었거든요. 나무가 아직 따뜻했어요.</p><h2>강으로 들어간 배</h2><p>사흘 뒤에 물빛이 바뀌었어요. 파란 물에 누런 것이 섞이기 시작했지요. 큰 강이 바다로 들어오는 자리였거든요. 강물이 실어 온 흙이 바다까지 나와 있었어요.</p><p>강어귀는 넓었어요. 양쪽으로 갈대가 사람 키보다 높이 서 있었고요. 배가 그 사이로 들어갔어요. 노를 젓지 않아도 물이 배를 안으로 데리고 갔지요. 밀물 때였어요.</p><p>강 양쪽 벌판에는 사람들이 나와 있었어요. 밭에서 일하다가 허리를 펴고 배를 보는 사람들이었지요. 아무도 손을 흔들지 않았어요. 그렇다고 달아나지도 않았고요. 배가 들어오는 것을 그냥 보기만 했어요.</p><p>궁 쪽에서 풀 탄 냄새가 불어왔어요. 갈대밭이 끝나자 양쪽이 트였어요. 왼쪽 언덕 위에 궁이 있었어요. 지붕이 낮고 옆으로 아주 길었지요. 궁 앞에는 넓은 밭이 있었는데, 갈아 놓기만 하고 아무것도 심지 않은 밭이었어요.</p><p>오른쪽은 숲이었어요. 숲 한가운데에 참나무 한 그루가 다른 나무들보다 머리 하나만큼 더 높이 솟아 있었어요. 그 가지 사이에 무언가가 걸려 있었지요.</p><p>낮인데도 그것만 빛났어요. 해가 구름에 들어가도 그 빛은 그대로였고요. 사람들이 그것을 황금 양털이라고 불렀어요.</p><p>“황금 양털이 저기 있네.” 노를 젓던 사람이 말했어요.</p><p>“나무 밑을 보세요.” 아탈란테가 말했어요.</p><p>나무 밑동에 굵은 것이 여러 겹 감겨 있었어요. 뿌리인 줄 알았지요. 그런데 뿌리가 아니었어요. 그것이 아주 천천히 한 번 움직였거든요.</p><p>“저건 뿌리가 아니라 살아 있는 겁니다.” 아탈란테가 말했어요.</p><p>노 젓는 사람들이 노를 잡은 채로 그쪽을 보았어요. 그동안 배가 옆으로 조금 밀렸는데 아무도 그것을 몰랐고요.</p><p>배 안에서 말이 오갔어요. 밤에 몰래 들어가서 걷어 오자는 사람이 있었어요. 그러려면 저 나무 밑에 있는 것과 먼저 붙어야 한다고 다른 사람이 말했고요. 그 말에는 아무도 대꾸하지 않았어요.</p><p>“왕에게 양털을 달라고 먼저 물어보겠습니다.” 이아손이 말했어요.</p><p>“물어보면 줍니까?” 아탈란테가 말했어요.</p><p>“안 주겠지요.”</p><p>“그런데도 물어봅니까?”</p><p>“안 물어보고 가져가면 도둑이 됩니다.”</p><p>아탈란테는 더 묻지 않았어요. 대신 활을 무릎에 내려놓고 시위를 손가락으로 한 번 튕겨 보았지요. 소리가 짧게 났어요.</p><p>배는 갈대밭 안쪽에 대었어요. 밖에서는 돛 끝만 보이는 자리였지요. 이아손은 배에서 내리면서 아탈란테에게 배에 남아 달라고 했어요.</p><p>“왜 저는 남아야 해요?”</p><p>“제가 안 돌아오면 그냥 떠나시라고요.”</p><p>“당신을 두고 떠날 생각은 없습니다.”</p><p>“알고 있습니다.” 이아손이 말했어요.</p><p>그러고는 언덕 쪽으로 걸어 올라갔어요. 셋이 같이 갔어요. 무기는 배에 두고 갔고요.</p><h2>산 위에서 내려온 것</h2><p>올림포스산에서는 그 배가 강으로 들어가는 것이 보였어요. 아프로디테가 난간에 팔을 얹고 그것을 내려다보고 있었지요.</p><p>배는 아주 작았어요. 손톱만 했어요. 그 안에 사람이 몇인지는 세어지지 않았고요.</p><p>아프로디테는 마당 쪽으로 고개를 돌려 아들을 불렀어요. 에로스는 마당 한쪽에 앉아 있었어요. 반들반들한 뼈 조각을 손등에 얹었다가 튕겨서 받는 놀이를 하고 있었지요. 스무 번을 내리 받아 내는 중이었어요.</p><p>“화살을 한 번만 쏘아 주렴.” 아프로디테가 말했어요.</p><p>에로스는 손등만 보고 있었어요.</p><p>“누구를 쏘라고요?”</p><p>“저 아래 궁에 왕의 딸이 둘 있단다. 그 가운데 작은딸을 쏘아 주렴.”</p><p>“싫어요.”</p><p>“왜 싫으니?”</p><p>“오늘은 스물다섯까지 받을 거예요.”</p><p>아프로디테는 난간에서 팔을 내렸어요.</p><p>“공을 하나 줄게. 금으로 된 공이야. 던지면 지나간 자리에 빛이 남는단다.”</p><p>에로스가 손등을 기울였어요. 뼈 조각이 마당에 떨어져 굴렀지요. 스물한 번째였는데 받지 않았어요.</p><p>“그 금 공은 어디 있어요?”</p><p>“화살을 쏘고 다녀오면 줄게.”</p><p>에로스는 마당에 굴러간 뼈 조각을 주우러 가지 않았어요.</p><p>에로스는 화살통에서 화살을 하나 골랐어요. 여러 개를 꺼내 보고 나서 골랐지요. 끝이 장밋빛인 화살이었어요. 그러고는 산 아래로 내려갔어요. 날개 소리는 나지 않았어요. 원래 소리가 나지 않는 날개였고요.</p><p>산 위에서 아래까지는 한참이었어요. 에로스는 구름 한 겹을 지나고 바다를 지나고 갈대밭을 지났어요. 그러고는 궁 지붕에 내려앉았지요. 지붕에 난 틈으로 바닥의 빛이 보였거든요.</p><p>에로스는 그 틈에 눈을 대고 기다렸어요. 활을 든 채로 오래 기다리는 것은 어려운 일이 아니었어요. 여러 번 해 본 일이니까요.</p><p>묻지도 않고 남의 마음에 화살을 놓는 일은, 아무리 신이라 해도 너무했지요.</p><h2>세 가지</h2><p>궁 안은 어두웠어요. 창이 아주 높은 데에만 나 있어서 빛이 바닥 한가운데에만 떨어졌거든요. 왕은 그 빛 바깥에 앉아 있었어요. 얼굴은 잘 보이지 않고 무릎만 보였지요.</p><p>이아손은 빛 안에 서서 말했어요. 먼 데서 왔고, 저 숲의 나무에 걸린 것을 가지러 왔다고요. 값은 무엇이든 치르겠다고도 했어요.</p><p>왕은 한참 아무 말도 하지 않았어요. 그러고는 손가락 세 개를 폈지요.</p><p>“양털을 가져가려면 세 가지를 해내야 한다.”</p><p>“말씀하십시오.”</p><p>“내 밭에 소가 두 마리 있다. 발굽이 청동이고 숨이 불이다. 그 두 마리에 멍에를 씌워 밭 네 이랑을 갈아라.”</p><p>“둘째는 무엇입니까?”</p><p>“그 밭에 씨를 뿌린다. 씨는 내가 준다. 뿌린 데서 나는 것들을 해가 지기 전에 다 눕혀라.”</p><p>이아손은 고개를 끄덕였어요. 끄덕이면서 밭 네 이랑이 얼마나 긴지 가늠해 보고 있었지요.</p><p>“셋째는.” 왕이 말했어요. “저 나무 밑에 있는 것이 눈을 감으면, 걷어서 가져가라.”</p><p>“나무 밑의 그것은 언제 눈을 감습니까?”</p><p>“그것이 눈을 감는 것을 본 사람은 아직 없다.”</p><p>궁 안 어딘가에서 그릇 부딪는 소리가 났어요. 그 소리 말고는 아무 소리도 나지 않았지요.</p><p>“먼 데서 오는 사람이 해마다 있다.” 왕이 말했어요. “다들 저 나무 이야기를 하더구나.”</p><p>“그동안 몇이나 왔습니까?”</p><p>“세어 두지 않았다.”</p><p>왕이 빛 안으로 몸을 조금 내밀었어요. 수염이 짧고 반듯했어요. 웃지는 않았고요.</p><p>“하나라도 못 하면 어떻게 됩니까?”</p><p>“못 할 사람은 여기까지 오지도 않는다.”</p><p>이아손은 그 말에는 대꾸하지 않았어요. 대신 한 걸음 물러서서 고개를 숙였지요.</p><p>“해가 뜨면 시작하겠습니다.”</p><p>그때 문 옆 기둥 뒤에 사람이 하나 서 있었어요. 왕의 작은딸 메데이아였어요. 손에 물병을 들고 있었지요. 아버지 상 위에 놓으려고 가져온 것이었어요.</p><p>메데이아는 그 자리에서 움직이지 않았어요. 물병을 상까지 가져가지도 않았고요. 기둥 위쪽 어두운 데에서 아주 작은 것이 한 번 지나갔어요. 새인가 싶었는데 새는 아니었어요. 그것이 지나가고 나서 메데이아의 손에서 물병이 기울었지요.</p><p>물이 발등에 쏟아졌어요. 메데이아는 그것을 몰랐어요. 한참 뒤에야 발이 젖은 것을 알고 내려다보았고요.</p><p>이아손이 나갔어요. 메데이아는 그 등이 문을 지나 사라질 때까지 서 있었어요. 그러고는 쏟은 물을 발로 문질러 닦았지요.</p><p>복도에서 언니가 메데이아를 불렀어요. 상에 물병을 올려놓았느냐고요.</p><p>“올려놓았어요.”</p><p>그런데 물병은 아직 메데이아의 손에 들려 있었어요.</p><h2>밤새 열었다 닫은 것</h2><p>메데이아의 방에는 상자가 하나 있었어요. 나무 상자였고 뚜껑에 놋쇠 걸쇠가 달려 있었지요. 안에는 마른 풀과 뿌리와 작은 병들이 들어 있었어요.</p><p>저녁에 궁 사람 하나가 문을 두드렸어요. 부엌에서 손을 데었다고요.</p><p>“덴 손은 찬물에 먼저 담그세요.”</p><p>메데이아는 상자를 열어 잎을 하나 꺼내 주었어요. 그 사람이 가고 나서도 상자를 닫지 않았고요.</p><p>메데이아는 어릴 때부터 그런 것을 배웠어요. 어떤 뿌리가 피를 멎게 하는지, 어떤 잎을 태우면 벌레가 오지 않는지요. 궁 사람들은 어디가 아프면 왕에게 가지 않고 메데이아에게 왔어요.</p><p>그날 밤 메데이아는 그 상자를 열었어요. 병 하나를 꺼내 손바닥에 올려놓았지요. 그러고는 도로 넣고 걸쇠를 걸었어요.</p><p>조금 있다가 다시 열었어요. 다시 꺼냈다가 다시 넣었고요. 세 번째에는 걸쇠를 걸지 않았어요. 등잔 기름이 줄었어요. 심지가 짧아져서 불이 아래로 내려앉았지요. 메데이아는 심지를 올리지 않았어요.</p><p>문 밖에서 발소리가 멎었어요.</p><p>“메데이아, 아직 안 자니?”</p><p>“잡니다.”</p><p>언니였어요. 발소리가 다시 멀어졌지요. 메데이아는 그 소리가 안 들릴 때까지 기다렸다가 상자 쪽을 보았어요. 걸쇠는 열린 채였고요. 메데이아는 창가로 갔어요. 창에서 밭이 보였어요. 밤인데도 밭 한쪽이 조금 붉었지요. 소들이 그 아래에 있었거든요.</p><p>메데이아는 아버지가 손가락 세 개를 펴던 것을 다시 떠올렸어요. 아버지는 그 셋을 말하면서 웃지 않았어요. 이미 끝난 일을 말하는 얼굴이었지요.</p><p>그 밭에 들어간 사람은 지금까지 여럿이었어요. 걸어 나온 사람은 없었고요.</p><p>메데이아는 그 밭을 가까이에서 본 적이 있었어요. 아주 어릴 때였지요. 언니 손을 잡고 울타리 밖까지 갔었어요. 흙이 다른 데보다 검었어요. 발로 밟으면 물기가 배어 나왔고요. 그런데 그 밭에서는 풀도 자라지 않았어요.</p><p>메데이아는 상자 앞에 다시 앉았어요. 그러고는 뚜껑 위에 손바닥을 얹고 한참 있었어요. 손을 떼었을 때 뚜껑에 김이 하얗게 서렸다가 곧 사라졌지요.</p><p>새벽이 되기 전에 메데이아는 병 하나를 꺼내 소매에 넣었어요. 그러고는 옆문으로 나갔지요. 옆문은 소리가 나지 않는 문이었어요. 어릴 때부터 그 문으로 다녔거든요.</p><p>밖은 아직 캄캄했어요. 궁 담을 따라 걷는 동안 발밑에서 자갈 소리가 났어요. 메데이아는 자갈이 없는 데를 골라 디디며 걸었지요.</p><p>강가에 배가 매여 있었어요. 사람들은 배 안에서 자고 있었고요. 이아손은 자지 않고 뱃전에 앉아 있었어요. 발을 물에 담근 채로요.</p><p>메데이아가 먼저 말했어요.</p><p>“그 밭에 들어가면 죽습니다.”</p><p>“그럴 것 같았습니다.”</p><p>“그런데도 들어갈 겁니까?”</p><p>이아손은 바로 대답하지 않았어요. 대신 자기 손바닥을 한 번 내려다보았지요.</p><p>“저 배에 탄 사람들이 다 저를 믿고 탔습니다.”</p><p>“그건 대답이 아닙니다.”</p><p>“저한테는 대답이 그것뿐입니다.”</p><p>메데이아가 소매에서 병을 꺼냈어요. 손가락 두 마디쯤 되는 작은 병이었어요. 그것을 이아손 앞으로 내밀었지요. 내미는 손이 조금 떨렸어요. 메데이아는 다른 손으로 그 손목을 잡았고요.</p><p>이아손은 병을 받아 들었어요. 받고 나서 한참 그것을 보았지요.</p><p>“이 병을 저에게 주면 아버지가 아실 텐데요.”</p><p>“아실 겁니다.”</p><p>“그러면 공주님은 어떻게 됩니까?”</p><p>메데이아는 그 물음에는 대답하지 않았어요. 대신 이아손의 손을 두 손으로 감싸 병뚜껑이 잘 닫혔는지 눌러 보았지요. 그러고는 손을 놓고 한 걸음 물러섰어요.</p><p>“이걸 몸에 바르면 불도 당신을 태우지 못해요.”</p><p>강 건너 숲에서 새가 한 마리 울었어요. 아직 어두웠는데요.</p></article></noscript>
