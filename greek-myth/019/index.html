  <noscript><article class="ns-text"><h1>항아리를 연 날</h1><h2>볕이 잘 드는 자리</h2><p>판도라의 손끝에서 실이 고르게 이어져 나왔어요. 마당에는 실 감기는 소리 말고 아무 소리도 없었지요. 아테나가 알려 준 대로 손을 놀리기만 하면 실은 저절로 그렇게 되었어요. 에피메테우스는 그 옆에 앉아 무언가를 만들다가 자꾸 손을 멈추고 구경했어요. 판도라가 눈을 들면 얼른 도로 자기 손을 보았고요.</p><p>“어떻게 그렇게 빨라요?”</p><p>“아테나 여신께 배웠으니까요.”</p><p>“저는 배워도 안 되던데요.”</p><p>판도라가 웃었어요. 에피메테우스도 웃었어요. 마당에 널어 둔 실타래가 바람에 조금씩 흔들렸어요. 판도라가 그 집에 온 지 여러 날이 지난 아침이었어요.</p><p>마을 사람들도 판도라를 좋아했어요. 처음에는 어디서 온 사람이냐고 수군거렸지만, 며칠 지나자 아무도 그걸 묻지 않았어요. 판도라가 짠 천은 마을에서 제일 고왔거든요.</p><p>저녁이면 두 사람은 문 앞에 나와 앉았어요. 해가 언덕 뒤로 넘어가는 것을 보면서요. 그럴 때 판도라는 아무것도 묻지 않았어요. 신들에게 묻던 것들이 여기서는 별로 궁금하지 않았거든요.</p><p>에피메테우스는 저녁마다 그날 만든 것을 하나씩 보여 주었어요. 손잡이가 삐뚤어진 국자, 다리 하나가 짧은 걸상, 물이 새는 물동이 같은 것들이었지요.</p><p>“이 국자는 왜 이렇게 삐뚤어졌어요?”</p><p>“만들다 보면 그렇게 돼요.”</p><p>판도라는 그 물건들을 하나도 버리지 않았어요. 삐뚤어진 국자는 삐뚤어진 대로 잘 떠졌거든요. 그런데 하루에 한 번씩, 판도라는 꼭 방 한가운데를 돌아보았어요.</p><p>항아리는 늘 같은 자리에 있었어요. 볕이 잘 드는 자리였지요. 아침에는 뚜껑 위에 햇빛이 얹혔고, 저녁에는 그림자가 길게 누웠어요.</p><p>먼지가 앉으면 판도라가 천으로 닦아 주었어요. 닦을 때마다 손끝이 밀랍에 닿았어요. 매끈하고 서늘했어요. 판도라는 그때마다 손을 얼른 뗐어요.</p><p>어느 날 저녁, 상을 물리고 나서 판도라가 물었어요.</p><p>“저 항아리 안에 뭐가 들었을까요?”</p><p>에피메테우스는 숟가락을 든 채 잠깐 생각했어요.</p><p>“글쎄요. 곡식 씨앗 같은 거 아닐까요.”</p><p>“씨앗이면 왜 열지 말라고 하셨을까요?”</p><p>“글쎄요. 그런 건 생각해 본 적이 없어요.”</p><p>이름부터가 그랬어요. 에피메테우스는 나중에 생각하는 사람이라는 뜻이었거든요. 형은 반대였어요. 프로메테우스는 먼저 생각하는 사람이라는 뜻이었지요. 그 형은 지금 세상 끝 바위에 묶여 있었어요.</p><p>“형님이라면 아셨을 텐데요.”</p><p>판도라가 그렇게 말하자 에피메테우스가 숟가락을 내려놓았어요. 한동안 아무 말도 하지 않았지요.</p><p>“형이 그랬어요. 제우스가 무엇을 보내오든 받지 말라고요.”</p><p>“그럼 저도 받으면 안 되는 거였네요.”</p><p>“아니에요.” 에피메테우스가 얼른 고개를 저었어요. “그건 다른 이야기예요. 당신은 선물이 아니라 우리 집 식구예요.”</p><p>에피메테우스는 그러고 나서도 한참 앉아 있었어요. 형이 마지막으로 자기 어깨를 붙들었을 때의 손 힘이 문득 떠올랐거든요. 그런데 그 생각도 곧 흐려졌어요.</p><p>그날 밤 판도라는 잠이 잘 오지 않았어요. 어두운 방 한가운데에 항아리가 가만히 앉아 있는 게 느껴졌거든요.</p><p>판도라는 돌아누웠어요. 그래도 등 뒤에서 그것이 그대로 있는 게 느껴졌어요. 그다음 날부터 판도라는 자꾸 항아리 꿈을 꾸었어요.</p><p>꿈에서는 늘 뚜껑이 열려 있었어요. 그런데 안이 보이지 않았어요. 들여다보려고 고개를 숙이면 그때마다 잠이 깼지요.</p><p>어느 날 아침, 판도라는 에피메테우스에게 그 이야기를 했어요. 에피메테우스는 밥을 먹다 말고 항아리 쪽을 보았어요.</p><p>“항아리를 흔들어 볼까요?”</p><p>“열지 말라고 하셨어요.”</p><p>“여는 게 아니라 흔드는 건데요.”</p><p>에피메테우스는 그렇게 말하면서 벌써 일어나고 있었어요. 그러고는 항아리를 두 손으로 잡고 아주 살짝 기울여 보았어요.</p><p>아무 소리도 나지 않았어요.</p><p>“아무 소리도 안 나니, 비었나 봐요.”</p><p>“비었으면 왜 봉해 놓으셨을까요?”</p><p>에피메테우스는 대답 대신 항아리를 도로 내려놓았어요. 놓으면서 뚜껑을 한 번 톡 두드렸지요. 그때 판도라의 얼굴이 굳었어요.</p><p>“두드리지 마세요.”</p><p>에피메테우스가 놀라서 손을 뗐어요. 판도라가 그렇게 말한 것은 처음이었거든요. 두 사람은 서로를 잠깐 바라보다가 웃어 버렸어요. 웃고 나서는 그날 하루 아무도 그 이야기를 꺼내지 않았어요.</p><p>그런데 그날 저녁부터 판도라는 방 한가운데를 하루에 한 번이 아니라 열 번씩 돌아보게 되었어요.</p><h2>아무도 없는 오후</h2><p>며칠 뒤, 에피메테우스가 이웃 마을에 갔어요. 쟁기를 고쳐 주기로 한 날이었지요. 해가 지기 전에 돌아오겠다고 했어요.</p><p>집에는 판도라 혼자 남았어요. 오후는 길었어요. 실을 다 잣고, 마당을 쓸고, 저녁거리를 다듬었는데도 해가 그 자리에 그대로 있었어요.</p><p>판도라는 방으로 들어갔어요. 항아리는 그 자리에 있었어요. 판도라는 그 앞에 앉았어요. 처음에는 그냥 앉아만 있었어요. 무릎을 안고, 뚜껑을 보고, 벽을 보고, 다시 뚜껑을 보았지요.</p><p>그러다가 손을 뻗어 뚜껑을 만졌어요. 밀랍은 늘 그렇듯 서늘했어요. 귀를 대 보았어요. 아무 소리도 나지 않았어요. 정말 아무 소리도 나지 않는다는 것이 오히려 이상했어요. 텅 빈 항아리라면 웅웅거리는 소리라도 나야 하는데요.</p><p>판도라는 손을 뗐어요. 그리고 일어섰어요. 문 앞까지 갔다가 돌아왔어요. 한 번 더 갔다가 한 번 더 돌아왔어요.</p><p>창밖에서 새 한 마리가 울었어요. 그 소리가 그치자 집 안이 아까보다 더 조용해졌어요. 판도라는 다시 앉았어요. 앉아서 손등에 남은 실 자국을 들여다보았어요. 그러다 고개를 들면 뚜껑이 거기 있었지요.</p><p>밖에서 마을 아이들이 뛰어가는 소리가 났어요. 그 소리도 멀어졌어요. 판도라는 문득 이런 생각을 했어요. 신들은 왜 나에게 이걸 주었을까. 짜라고 실을 주고, 쓰라고 말을 주었으면서, 이건 왜 지니고만 있으라고 했을까.</p><p>“조금만 열어 볼까.”</p><p>판도라가 혼잣말을 했어요.</p><p>“조금만 열었다가 바로 닫으면 되잖아.”</p><p>손톱으로 밀랍을 긁었어요. 생각보다 쉽게 떨어졌어요. 부스러기가 무릎 위로 하얗게 쌓였지요. 한 바퀴를 다 긁고 나자 뚜껑이 살짝 들썩였어요.</p><p>판도라는 두 손으로 뚜껑을 잡았어요. 숨을 한 번 들이쉬었어요. 그리고 들어 올렸어요. 처음에는 아무 일도 일어나지 않았어요.</p><p>그다음 순간, 항아리 안에서 검은 것이 확 솟구쳐 올랐어요. 연기 같기도 하고 날벌레 떼 같기도 한 것이었어요. 그것은 천장에 부딪혔다가 사방으로 흩어졌어요.</p><p>판도라는 뒤로 넘어졌어요. 뚜껑이 손에서 떨어져 데굴데굴 굴러갔지요. 방 안이 순식간에 어두워졌어요. 무언가가 얼굴을 스치고 지나갔어요. 차가웠어요.</p><p>그것들은 창문으로, 문틈으로, 굴뚝으로 빠져나갔어요. 나가면서 문짝이 덜컹거렸어요. 검은 것들은 소리를 내지 않았어요. 방 안에서 들리는 것이라고는 문짝이 흔들리는 소리와 판도라의 숨소리뿐이었지요.</p><p>판도라는 두 팔로 머리를 감쌌어요. 그러고는 항아리를 향해 소리쳤어요.</p><p>“그만!”</p><p>그러나 그것들은 멈추지 않았어요. 마지막 한 무리가 굴뚝으로 빠져나가는 것을 판도라는 바닥에 엎드린 채로 보았어요.</p><p>그것이 무엇이었는지 판도라는 나중에야 알았어요. 병이었어요. 슬픔이었어요. 미움과 시기와 다툼이었어요. 그때까지 사람들이 이름조차 모르던 것들이었지요.</p><p>그것들은 들판을 지나 마을로 갔어요. 마을을 지나 다음 마을로 갔어요. 바다를 건너고 산을 넘었어요. 하루가 지나기 전에 그것들은 세상 어디에나 있게 되었어요.</p><p>그리고 한번 나간 것들은 다시 들어가지 않았어요. 세상에는 그런 것들이 있어요. 나오기는 쉽고 되돌리기는 안 되는 것들이요.</p><p>판도라는 겨우 정신을 차리고 기어가서 뚜껑을 집었어요. 그리고 항아리를 두 손으로 눌러 닫았어요. 너무 늦은 뒤였지만요.</p><p>닫고 나서 판도라는 그 자리에 오래 앉아 있었어요. 어깨가 떨렸어요. 무릎 위에 아직 밀랍 부스러기가 남아 있었지요.</p><p>한참 뒤에, 항아리 안에서 아주 작은 소리가 났어요. 톡, 톡. 판도라는 숨을 멈추었어요. 잘못 들었나 싶어 귀를 기울였지요.</p><p>판도라는 고개를 들었어요. 소리는 계속 났어요. 무언가가 안에서 뚜껑을 두드리고 있었어요. 아까 그 검은 것들과는 소리가 달랐어요. 훨씬 작고, 훨씬 조심스러웠지요.</p><p>판도라는 한참을 망설였어요. 또 열면 안 되는 걸 알고 있었어요. 그런데 그 소리는 무섭지가 않았어요. 판도라는 뚜껑을 아주 조금만 들어 올렸어요.</p><p>빛이 한 줄 새어 나왔어요. 바닥에 무언가 하나가 남아 있었어요. 아주 작았어요. 날개가 젖어 있어서 아직 날지 못하는 것 같았어요.</p><p>판도라가 손가락을 내밀자 그것이 손끝으로 올라왔어요. 따뜻했어요. 그것이 희망이었어요. 판도라는 그것을 손바닥에 올린 채 오래 들여다보았어요.</p><p>작고 볼품없었어요. 아까 빠져나간 것들에 비하면 아무것도 아닌 것 같았지요. 저런 것 하나가 남았다고 무엇이 달라지겠나 싶었어요.</p><p>그런데 손바닥이 자꾸 따뜻해졌어요. 판도라는 손을 오므렸어요. 이번에는 놓치지 않으려고요. 해가 질 무렵 에피메테우스가 돌아왔어요.</p><p>문을 열자마자 방 안이 이상하게 조용한 걸 알았어요. 판도라가 항아리 옆에 앉아 있었어요. 손바닥을 오므린 채로요.</p><p>“무슨 일이에요?”</p><p>판도라는 대답하지 못했어요. 대신 오므린 손을 조심스럽게 펴 보였어요. 에피메테우스는 한참 그것을 들여다보았어요. 그러고는 방 안을 둘러보았어요. 굴러간 뚜껑, 바닥에 흩어진 밀랍 부스러기, 활짝 열린 창문을요.</p><p>에피메테우스는 아무것도 묻지 않았어요. 화를 내지도 않았어요. 그냥 판도라 옆에 앉았어요.</p><p>“괜찮아요.”</p><p>에피메테우스가 말했어요. 사실 괜찮지 않았지만, 그 말고는 할 말이 없었지요. 밖에서는 아직 아무 일도 일어나지 않은 것처럼 보였어요. 마당의 실타래도 그대로였고, 널어 둔 천도 그대로였지요. 다만 바람이 조금 차가워져 있었어요.</p><p>두 사람은 어두워질 때까지 나란히 앉아 있었어요. 판도라가 손을 조금 벌리자 작은 빛이 손바닥 위에서 한 번 파닥였어요. 아직 날지는 못했어요.</p><p>“나쁜 것들이 다 나가 버렸는데, 이제 어떻게 하지요?”</p><p>“모르겠어요.”</p><p>“형님한테 가서 여쭤 볼까요?”</p><p>에피메테우스는 고개를 저었어요. 형에게 가는 길은 사흘이 걸렸고, 가서 무슨 말을 들을지도 알 것 같았거든요.</p><p>“이 작은 건 밖으로 안 나가려나 봐요.”</p><p>“그럼 여기 있으라고 하세요.”</p><p>“여기 두어도 될까요?”</p><p>“날개가 마르면 알아서 갈 거예요. 안 가면 같이 살면 되고요.”</p><p>판도라는 고개를 끄덕였어요. 그러고는 오랜만에 숨을 길게 내쉬었어요. 그 숨에 손바닥 위의 작은 빛이 한 번 흔들렸어요.</p><h2>바위 위에서 본 것</h2><p>그날부터 세상이 달라졌어요. 그때까지 앓던 것과는 다른 병이 돌았어요. 아침에 멀쩡하던 사람이 저녁에 열이 났어요. 이유 없이 서로를 미워하기도 했어요. 어제까지 나누어 먹던 것을 오늘은 감추었지요.</p><p>이웃끼리 담을 높였어요. 아이들이 우는 일이 잦아졌어요. 그전까지 사람들은 이런 것들이 있는 줄도 몰랐거든요.</p><p>그전에도 사람들이 늘 사이좋게 지낸 것은 아니었어요. 그렇지만 다투고 나면 저녁에는 도로 풀렸지요. 이제는 풀리지 않는 다툼이 생겼어요.</p><p>열지 말라고만 하고 무엇이 들었는지는 끝내 알려 주지 않았으니, 그 항아리는 처음부터 열리게 되어 있었는지도 몰라요.</p><p>그래도 사람들은 아침이면 밭에 나갔어요. 아픈 사람 곁을 지켰어요. 무너진 담을 다시 쌓았어요. 판도라의 손바닥에 남았던 그 작은 것은 검은 것들처럼 저 혼자 날아가 버리지 않았어요. 사람에게서 사람에게로 옮겨 갔지요.</p><p>세상 끝 바위 위에서 프로메테우스가 그것을 내려다보고 있었어요. 프로메테우스는 아주 멀리까지 볼 수 있었어요. 먼저 생각하는 사람이었으니까요. 검은 것들이 땅 위로 퍼져 나가는 것도, 그 뒤를 아주 작은 빛 하나가 따라가는 것도 다 보았어요.</p><p>프로메테우스는 눈을 감았어요. 그러고는 아무에게도 들리지 않게 중얼거렸어요.</p><p>“동생아.”</p><p>바위 위의 목소리는 아주 작았어요. 바람이 그 말을 가져가 버렸어요. 프로메테우스는 그다음에 무슨 일이 올지도 알고 있었어요. 알면서도 아무에게도 말할 수가 없었어요. 세상 끝 바위에서는 목소리가 어디에도 닿지 않았으니까요.</p><p>다만 아들의 얼굴을 한 번 떠올렸어요. 산기슭에 사는 데우칼리온이라는 아들이었어요. 같은 시각, 올림포스산에서는 제우스가 아래를 내려다보고 있었어요.</p><p>땅 위는 전과 달랐어요. 마을과 마을이 담을 높이 쌓았어요. 남의 밭에서 곡식을 걷어 가는 사람이 생겼어요. 저녁이면 여기저기서 다투는 소리가 올라왔지요.</p><p>제우스는 오래 보았어요. 얼굴에는 아무 표정도 없었어요.</p><p>“이 아래는 이제 봐 줄 수가 없구나.”</p><p>제우스가 낮게 말했어요. 옆에는 아무도 없었어요. 구름 사이로 아래를 보면 불빛이 보였어요. 프로메테우스가 가져다준 그 불이었지요. 그 불빛이 이제는 담 안쪽에서만 타고 있었어요.</p><p>항아리를 들려 보낸 것이 자기라는 것은 잊은 얼굴이었지요. 저 아래 어느 집에서는 두 사람이 나란히 앉아 있었어요. 한 사람은 손을 오므리고 있었고, 한 사람은 그 옆에서 아무 말도 하지 않았지요. 그것까지는 제우스도 보지 못했어요.</p><p>제우스는 한참을 더 서 있었어요. 그러고는 손을 천천히 들어 올렸어요. 서쪽 바다 위에 떠 있던 구름 한 덩이가 그 손짓을 따라 이쪽으로 밀려오기 시작했어요.</p><p>아주 조용하게요.</p></article></noscript>
