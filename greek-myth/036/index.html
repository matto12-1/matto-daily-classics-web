  <noscript><article class="ns-text"><h1>마지막 한 걸음</h1><h2>자갈 위의 발소리</h2><p>자갈 하나가 발밑에서 굴러떨어졌어요.</p><p>오르페우스는 그 소리를 끝까지 들었어요. 자갈이 아래로 굴러가다가 어딘가에 한 번 부딪히고, 또 한 번 튀고, 그러고는 아무 소리도 나지 않았지요. 얼마나 깊은 아래인지 알 수 없었어요. 오르페우스는 그쪽으로 고개를 돌리지 않았어요.</p><p>그 소리 말고는 들리는 것이 없었어요. 자기 발소리뿐이었어요. 하나였지요. 오르페우스는 걸음을 조금 늦춰 보았어요. 뒤에서 무슨 소리가 나는지 들어 보려고요. 아무 소리도 나지 않았어요.</p><p>이번에는 걸음을 빨리해 보았어요. 그래도 마찬가지였고요. 발밑의 자갈은 소리를 잘 냈어요. 하나만 밟아도 서너 개가 같이 굴렀지요. 그런데 그 소리도 다 오르페우스가 낸 것이었어요.</p><p>저 아래에서 돌문이 닫히는 소리를 들었던가. 오르페우스는 그것도 기억나지 않았어요. 문을 지날 때부터 귀가 뒤쪽으로만 열려 있었거든요.</p><p>오르막은 좁았어요. 양쪽이 다 바위였어요. 위에서 아주 희미한 빛이 내려오기는 했는데, 그 빛으로는 발밑밖에 보이지 않았지요.</p><p>오르페우스는 앞을 보고 걸으면서 말을 걸었어요.</p><p>“거기 있어요?”</p><p>대답이 없었어요. 오르페우스는 한참 더 걷다가 다시 말했어요.</p><p>“대답은 안 해도 됩니다.”</p><p>그 뒤로는 오르페우스가 혼자 말을 했어요. 언덕 위 바위 이야기를 했어요. 여우가 요즘도 오는지 모르겠다고 했지요. 화관이 시들 만하면 늘 새것이 놓여 있었다는 이야기도 했어요.</p><p>혼례 날 저녁에 횃불이 자꾸 꺼지던 이야기도 했어요. 그날 마당에 있던 사람들이 다들 눈이 붉었다고요. 그 말을 하다가 오르페우스는 잠깐 멈췄어요.</p><p>올라가면 무엇부터 할지도 이야기했어요. 물부터 한 사발 떠다 주겠다고요. 그러고는 바위에 앉아 아무 노래나 하나 하겠다고요. 아무 노래나요.</p><p>“이번에는 노래가 끝난 뒤에 혼자 남아 있지 않아도 돼요. 처음부터 내 옆에 앉아서 들으면 돼요.”</p><p>오르페우스가 그렇게 말했어요. 노랫소리가 아직 귀에 남아 있다던 그 대답이 생각나서요. 말을 하다 보면 자기 목소리가 바위에 부딪혀 돌아왔어요. 그게 그 길에서 유일하게 돌아오는 소리였어요.</p><p>한 번은 발밑이 푹 꺼져서 몸이 옆으로 기울었어요. 손으로 벽을 짚었지요. 그 바람에 어깨가 반쯤 돌아갔어요. 오르페우스는 눈을 꽉 감았어요. 감고 나서 다시 앞을 보고 떴어요.</p><p>오르페우스는 리라를 들었어요. 걸으면서 줄을 튕겨 보았지요. 저승에서는 그렇게 멀리까지 퍼지던 소리가 여기서는 자꾸 되돌아왔어요. 좁은 데라서 그랬을 거예요.</p><p>어깨가 자꾸 반쯤 돌아가려고 했어요. 그때마다 오르페우스는 앞을 보았어요. 눈을 아주 크게 뜨고요. 오르막은 길었어요. 내려올 때는 이렇게 길지 않았는데요.</p><h2>빛이 보이는 데까지</h2><p>한참을 오르다가 오르페우스는 걸음을 멈췄어요. 한 가지 생각이 자꾸 걸렸거든요. 정말 따라오고 있을까요. 문 앞에서 하데스가 한 말은 분명히 들었어요. 그런데 그 뒤로는 아무것도 없었어요. 소리도, 냄새도, 그림자도요.</p><p>오르페우스는 손을 뒤로 뻗어 보았어요. 허공만 잡혔어요. 뒤로 두 걸음 물러설 수도 없었어요. 그건 돌아보는 것이나 마찬가지일 테니까요.</p><p>바닥에 그림자가 지나 보려고 고개를 숙여 보기도 했어요. 그런데 그 길에는 빛이 거의 없어서 자기 그림자도 안 보였지요.</p><p>오르페우스는 리라를 다시 들었어요. 줄을 튕기면 소리가 뒤로도 갈 테니까요. 소리가 닿는 데까지는 누가 있는 셈이라고 생각하기로 했어요.</p><p>그러고는 다시 걸었어요. 위쪽이 밝아지기 시작했어요. 처음에는 실금만 했어요. 그다음에는 손바닥만 해졌고요.</p><p>“햇빛까지 조금만 더 가면 돼요.” 오르페우스가 위쪽을 보면서 말했어요. 자기한테 하는 말인지 뒤에 대고 하는 말인지 알 수 없었지요.</p><p>오르페우스의 걸음이 빨라졌어요. 자갈이 발밑에서 자꾸 미끄러졌어요. 한 번은 무릎을 짚기까지 했지요. 짚고 일어날 때도 앞만 보았어요.</p><p>빛이 문만 해졌어요. 바깥 냄새가 들어왔어요. 젖은 풀 냄새였지요. 오르페우스가 아침마다 맡던 냄새였어요.</p><p>오르페우스가 빛 속으로 걸어 나갔어요. 햇빛이 눈을 찔렀어요. 손등으로 눈을 가렸다가 천천히 내렸지요.</p><p>발밑에 풀이 있었어요. 위에는 하늘이 있었고요. 어디선가 새소리가 났어요. 며칠 만에 듣는 새소리였지요.</p><p>오르페우스는 그 자리에 섰어요. 어깨가 조금 떨렸어요. 다 온 거예요. 여기가 햇빛이니까요. 그리고 오르페우스는 뒤를 돌아보았어요.</p><p>에우리디케는 아직 어둠 속에 있었어요. 한 걸음이 모자랐어요. 두 사람의 눈이 마주쳤어요. 에우리디케는 들꽃 화관을 쓰고 있었어요. 혼례 날 저녁에 엮은 그 화관이었지요. 시들지 않은 채 그대로였어요.</p><p>에우리디케는 아무 말도 하지 않았어요. 다만 손을 조금 들어 올렸어요. 오르페우스가 그 손을 잡으려고 팔을 뻗었어요. 손끝이 닿았는지 닿지 않았는지는 아무도 몰라요.</p><p>에우리디케가 뒤로 물러났어요. 물러난 것이 아니라 어둠이 데려가는 것 같았어요. 붙잡을 소리도 나지 않았어요.</p><p>마지막에 에우리디케가 입을 움직였어요. 그날 아침 풀밭에서처럼요. 이번에도 오르페우스는 알아듣지 못했어요.</p><p>오르페우스는 그대로 서 있었어요. 한 손은 아직 뻗은 채였어요. 그 손을 내리는 데 한참이 걸렸지요. 그 자리에는 햇빛이 잘 들었어요. 풀 위에 이슬이 아직 조금 남아 있었고요. 그런 아침이었어요.</p><p>왜 돌아보았느냐고 나중에 누가 물은 적이 있어요. 오르페우스는 대답하지 않았어요. 그때 자기가 무슨 생각을 했는지, 생각이라는 걸 하기는 했는지 오르페우스도 몰랐거든요.</p><h2>이레 동안 강가에서</h2><p>오르페우스는 어둠 속으로 도로 뛰어 내려갔어요. 자갈이 사방으로 튀었어요. 그렇게 길던 오르막이 내려갈 때는 순식간이었지요.</p><p>잿빛 들판도 그대로였고, 향기 없는 하얀 꽃도 그대로였어요. 이번에는 그 꽃을 밟는지 안 밟는지 보지 않았어요.</p><p>강가에 사공이 서 있었어요. 오르페우스가 배 쪽으로 걸어갔어요. 사공이 삿대를 들어 뱃머리를 돌려놓았어요.</p><p>“한 번만 더 건너게 해 주십시오.”</p><p>사공은 고개를 저었어요. 오르페우스가 배에 발을 올리려고 했어요. 사공이 삿대를 뉘어 배와 강가 사이를 막았지요. 그 사공이 무엇을 그렇게 세게 한 것은 처음이었어요.</p><p>오르페우스는 리라를 무릎에 올려놓고 줄을 튕겼어요. 지난번과 같은 소리였어요. 낮은 소리 하나에 높은 소리 하나요.</p><p>이번에는 배가 움직이지 않았어요. 오르페우스는 그 강가에 이레를 앉아 있었어요. 하루도 줄에서 손을 떼지 않았지요. 사공은 그 이레 동안 한 번도 이쪽을 보지 않았어요. 그래도 배를 저쪽으로 밀어 두지도 않았어요. 삿대를 짚은 채 그 자리에 서 있었지요.</p><p>이레 동안 오르페우스는 아무것도 먹지 않았어요. 마실 물도 없었고요. 그 검은 강은 마실 수 있는 물이 아니었으니까요.</p><p>사실 그 나라에는 낮도 밤도 없어서 이레인지 아닌지도 몰라요. 다만 나중에 사람들이 그렇게 세었어요. 이레라고요.</p><p>강가에 앉아 있던 사람들이 조금씩 자리를 옮겨 왔어요. 오르페우스 둘레에 빙 둘러앉았지요. 아무도 말을 걸지는 않았어요. 뱃삯이 없어 오래 앉아 본 이들이라 무슨 말을 해야 하는지 알았거든요. 아무 말도 하지 않는 것이었어요.</p><p>그 가운데 하나가 오르페우스 앞에 무언가를 놓고 갔어요. 강가에서 주운 돌 하나였어요. 뱃삯이 될 리 없는 돌이었지요. 그래도 놓고 갔어요.</p><p>오르페우스는 그 돌을 주머니에 넣었어요. 이레째 되는 날 아침에 건너편 돌문이 열렸어요. 하데스가 문 밖으로 걸어 나와 강가에 섰어요. 그 나라의 왕이 누구를 만나러 강가까지 나온 것은 그때가 처음이었지요.</p><p>두 사람은 검은 강을 사이에 두고 마주 섰어요. 강이 넓어서 얼굴이 잘 보이지 않았어요.</p><p>“기회는 한 번뿐이었다.” 하데스가 말했어요.</p><p>오르페우스는 아무 말도 하지 못했어요.</p><p>“나는 그 한 번의 기회조차 주지 않기로 되어 있던 왕이다.”</p><p>하데스는 그 말만 하고 도로 문 안으로 들어갔어요. 돌문이 닫혔어요. 문 앞에 엎드려 있던 것이 고개를 한 번 들었다가 도로 내려놓았지요.</p><p>그 이레 동안 오르페우스는 노래를 부르지 않았어요. 줄만 튕겼지요. 부를 말이 남아 있지 않았거든요. 오르페우스는 그날 저녁에 강가에서 일어섰어요. 그러고는 올라가는 길로 접어들었어요. 이번에는 뒤에 아무도 없었어요. 그것만은 확실했지요.</p><h2>노래만 남은 사람</h2><p>오르페우스는 언덕으로 돌아왔어요. 그리고 그 바위에서 다시는 내려오지 않았어요. 사람들이 먹을 것을 놓고 갔어요. 어떤 날은 그대로 있었고, 어떤 날은 없어져 있었어요.</p><p>짐승들이 다시 모였어요. 여우가 앞발을 모으고 앉았고, 노루가 그 옆에 섰어요. 나무들이 소리 나는 쪽으로 기울었지요. 그건 예전과 똑같았어요.</p><p>밤에는 짐승들이 바위 둘레에 엎드려 잤어요. 여우는 늘 같은 자리였어요. 오르페우스는 그 뒤로 언덕을 한 번도 떠나지 않았어요. 겨울에는 마을 사람들이 바위 옆에 지붕을 얹어 주었지요. 여름이 오면 그 지붕을 도로 걷었고요.</p><p>첫해 겨울에는 아무도 노래를 청하지 않았어요. 그래도 오르페우스는 날마다 바위에 앉았어요. 눈이 오는 날에도요. 사람들이 멀리서 그것을 보고 지나갔지요.</p><p>이듬해 봄부터 사람들이 다시 올라오기 시작했어요. 노래를 청하면 오르페우스는 불러 주었어요. 그런데 노래가 전과 달랐어요.</p><p>무엇이 다른지는 아무도 말로 하지 못했어요. 다만 그 노래를 다 듣고 나면 한참 아무 말도 못 하게 되었지요. 그래서 어떤 사람은 두 번 다시 언덕에 올라오지 않았어요.</p><p>그래도 올라오는 사람이 더 많았어요. 아이를 업고 오던 사람은 계속 왔어요. 업혀 오던 아이가 걸어서 오게 되고, 걸어서 오던 아이가 자기 아이를 업고 올 때까지요.</p><p>오르페우스는 그 아이들 이름을 다 알았어요. 이름을 하나씩 부르고, 노래를 하나씩 붙여 주었지요. 한번은 어떤 아이가 물었어요.</p><p>“그 노래는 왜 끝이 안 나요?”</p><p>“그 노래도 끝이 있어요.” 오르페우스가 말했어요. “끝부분이 아직 안 온 거예요.”</p><p>아이는 무슨 소리인지 몰라서 고개를 갸웃했어요. 그래도 그 대답을 잊어버리지는 않았어요. 어른이 되고 나서 자기 아이한테 그 말을 그대로 옮겼거든요.</p><p>풀밭 이야기는 한 번도 하지 않았어요. 아무도 묻지 않았고요. 여러 해가 지났어요. 어느 여름 아침에 언덕에 올라간 사람이 바위가 비어 있는 것을 보았어요. 리라도 없었어요. 그해에 오르페우스는 세상을 떠났어요. 그날 언덕에서 무슨 일이 있었는지 본 사람은 아무도 없었지요.</p><p>사람들이 골짜기 쪽을 찾아보았어요. 강가도 가 보았고요. 아무 데도 없었어요. 그날 아래쪽 마을에서는 물 위로 무언가가 떠내려가는 것을 보았대요. 등딱지처럼 옴폭한 것이었지요. 줄이 일곱 개 걸려 있었고요.</p><p>빨래를 하던 사람들이 하던 일을 멈췄어요. 물살에 흔들릴 때마다 줄에서 소리가 났거든요. 아주 가는 소리였어요.</p><p>사람들은 그것을 건지려고 물에 들어가지 않았어요. 왜 그랬는지는 나중에도 설명하지 못했어요. 다들 그냥 서서 그것이 지나가는 것을 보았지요.</p><p>그런데 그날 강가에 있던 사람들은 하나같이 하던 일을 멈췄어요. 그것만은 다 같았어요.</p><h2>하늘에 걸린 리라</h2><p>그 리라가 바다까지 갔는지 어느 모래톱에 걸렸는지는 아무도 몰라요. 다만 그 강을 따라 아래로 걸어 내려간 사람이 있었어요. 금빛 곱슬머리에 잎으로 엮은 관을 쓴 사람이었지요.</p><p>아폴론은 서두르지 않았어요. 물이 흐르는 만큼만 걸었지요. 마을을 하나 지나고, 다리를 하나 지나고, 갈대밭을 지났어요.</p><p>아폴론은 강 하구까지 갔어요. 그리고 물에 들어가 그것을 건져 올렸어요. 줄 하나가 끊겨 있었어요. 산길에 앉아 그것을 깎던 저녁은 아주 오래전 일이었어요. 그때 아폴론은 줄을 일곱 개 걸었지요. 이제 여섯이었어요.</p><p>아폴론은 그것을 한참 들고 서 있었어요. 물이 무릎까지 차오르는데도 그대로 서 있었지요. 끊긴 줄 하나를 손가락으로 만져 보기도 했어요. 그 줄을 다시 걸지는 않았어요.</p><p>“여섯이면 됐다.” 아폴론이 아주 낮게 말했어요. 그 말을 들은 이는 아무도 없었어요.</p><p>그 뒤로 아폴론은 아무에게도 그 일을 말하지 않았어요. 신들은 이런 일을 서로 잘 이야기하지 않거든요. 그래서 올림포스산에서는 아무도 그 일을 몰랐어요.</p><p>아폴론은 하늘을 한 번 올려다보았어요. 여름밤이었어요. 별이 이미 여럿 떠 있었지요. 그러고는 하늘로 던져 올렸어요.</p><p>리라는 떨어지지 않았어요. 던진 것이 그대로 위로 올라갔어요. 아폴론은 그것이 다 올라갈 때까지 서서 보았어요. 물은 그때까지도 무릎에 차 있었지요.</p><p>그날 밤부터 여름 하늘 높은 데에 별이 몇 개 모여 앉게 되었어요. 넷은 네모지게 놓이고, 하나는 그 곁에서 아주 밝게요. 사람들은 그것을 리라라고 불러요.</p><p>그 별자리에는 사람 이름이 붙지 않았어요. 그냥 리라라고만 불렀지요. 그래도 그 언덕 마을 사람들은 그게 누구 것인지 알았어요.</p><p>여름밤이면 마당에 멍석을 깔고 누워 아이들에게 그 자리를 가르쳐 주었어요. 예전에 노래는 왜 끝이 안 나느냐고 물었던 아이가, 이제 제 아이 옆에 누워 손가락으로 하늘을 짚고 있었지요.</p><p>“저 별자리가 언덕 위에서 노래하던 사람의 리라야.”</p><p>“그 노래는 어떻게 됐는데요?”</p><p>“그 노래도 끝이 있대. 끝부분이 아직 안 온 거래.”</p><p>아이는 그 대답이 마음에 들지 않았어요. 그래서 한참 눈을 뜨고 있었지요.</p><p>아주 조용한 밤에 그 별을 오래 보고 있으면 소리가 들린다는 사람이 있었어요. 들었다는 사람보다 못 들었다는 사람이 훨씬 많았고요. 들었다는 사람들은 하나같이 같은 말을 했어요. 다 가기 전에 어디선가 그친다고요.</p><p>그 뒷부분을 그 밤에 마당에 누운 아이가 혼자 이어 보았어요. 아이는 그것을 아무한테도 말하지 않았지요.</p></article></noscript>
