        <div class="recap"><h3>지난 이야기</h3><ol><li>헤라클레스는 뿔이 금인 사슴을 일 년 만에 사로잡아 보여만 주고 놓아주었어요.</li><li>이어서 멧돼지를 눈밭으로 몰고, 청동 깃털 새 떼를 그릇 소리로 날려 보내고, 강 두 줄기를 돌려 외양간을 하루 만에 씻어 냈지요.</li><li>미케네의 왕은 셈을 적어 주지 않고, 항아리 뚜껑 틈으로 쪽지 한 장만 내밀었어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>바다 건너의 일들</h1><h2>젖은 쪽지 넉 줄</h2><p>“말이라는 건 알겠는데, 그다음이 안 보여요.”</p><p>조카가 쪽지에 코를 바짝 대고 고개를 기울였어요. 쪽지가 젖어서 둘째 줄이 번져 있었거든요. 넉 줄 가운데 그 줄만요.</p><p>헤라클레스는 그것을 받아 무릎에 펴 놓고 손바닥으로 눌렀어요. 뱃전으로 물이 자꾸 넘어왔지요.</p><p>“그 말들이 사람을 문다고 적혀 있었어.”</p><p>“말이 사람을 물어요?”</p><p>“그래, 말이.”</p><p>조카는 쪽지를 도로 넘겨주고 한참 아무 말도 하지 않았어요. 넷이었어요. 크레타섬에 있는 사나운 황소 하나, 사람을 무는 말 떼, 어느 여왕이 두르고 있는 띠 하나, 그리고 세상 서쪽 끝에 있다는 붉은 소 떼요. 넷 다 바다 건너에 있었지요.</p><p>헤라클레스는 그 넷을 손가락으로 짚어 가며 다시 읽었어요. 앞의 셋은 어디쯤인지 알 것 같았어요. 마지막 하나는 아니었지요. 세상 서쪽 끝이 어디냐고 물으면 뱃사람들도 서로 얼굴만 보았거든요.</p><p>배는 미케네에서 내준 것이 아니었어요. 헤라클레스가 항구에서 사흘 동안 짐을 날라 주고 얻어 탄 자리였어요. 이틀째부터는 뱃사람들이 짐에 손을 대지 않고 구경만 했지요. 뱃삯은 그것으로 다 치른 셈이었고요.</p><p>“왕이 배는 안 준대요?” 조카가 물었어요.</p><p>“왕은 배는 안 주고 쪽지만 줬어.”</p><p>조카는 자기 짐을 다시 꾸렸어요. 마른 빵과 여벌 신발과 횃불에 감을 헝겊이 들어 있었지요. 늪에 갈 때 챙기던 것을 그대로 챙겨 온 거예요. 뱃길에는 아무 소용이 없는 것들이었는데도요.</p><p>“이번 뱃길에는 횃불 쓸 일이 없을 것 같은데.”</p><p>“그래도 챙겨 두어야죠.”</p><p>돛이 바람을 받자 배가 앞으로 기울었어요. 조카는 뱃전을 붙잡고 뒤를 보았어요. 미케네 쪽 언덕이 점점 작아졌지요. 그 언덕이 안 보일 때까지 조카가 뒤를 보고 있는 동안, 헤라클레스는 쪽지를 접어 자루에 넣었어요.</p><h2>황소 등에 타고</h2><p>크레타섬에 닿았을 때는 보리를 벨 무렵이었어요. 그런데 벨 보리가 없었어요. 밭이 온통 갈아엎어져 있었거든요. 밭 가운데에 소치는 사람이 하나 서 있었어요. 헤라클레스를 보고도 놀라지 않았어요. 놀랄 힘이 남아 있지 않았거든요.</p><p>“그 황소는 지금 어디 있습니까?” 헤라클레스가 물었어요.</p><p>“밤에만 옵니다. 낮에는 저 위 바위밭에 있고요.”</p><p>“황소 때문에 다친 사람이 있습니까?”</p><p>“없소. 다들 잘 달아나니까.” 소치는 사람이 말했어요. “대신 겨울에 먹을 것이 없지요.”</p><p>그 소는 어른 소 세 마리를 합쳐 놓은 것만 했어요. 뿔이 어깨보다 넓었고요. 콧김이 어찌나 센지 콧김이 닿은 흙에서 김이 올라왔어요.</p><p>마을 사람들은 밤이 되면 지붕 위로 올라갔어요. 아이들까지요. 지붕에서 들으면 그 소가 어느 밭으로 가는지 알 수 있었거든요. 그래서 크레타섬 사람들은 밤마다 지붕에 앉아 있었어요. 앉아서 아침을 기다렸지요.</p><p>첫날 밤 헤라클레스는 밭 가운데에 서서 기다렸어요. 소가 왔어요. 그리고 헤라클레스를 그대로 들이받았지요. 헤라클레스는 밭 끝까지 밀려가 돌담에 부딪혔어요.</p><p>둘째 날 밤에도 그랬어요. 셋째 날 밤에는 뿔을 붙잡았는데, 붙잡은 채로 끌려갔어요. 발이 땅에 닿지 않았지요.</p><p>넷째 날 낮에 헤라클레스는 밭에 앉아 흙을 손으로 파 보았어요. 소가 갈아엎어 놓은 자리였어요. 흙이 아주 깊고 부드러웠지요. 헤라클레스는 그 자리에 서서 발뒤꿈치를 몇 번 눌러 보았어요. 발이 발목까지 들어갔어요.</p><p>그날 밤에는 뒤로 밀리지 않았어요. 발이 흙 속에 박혀 있었거든요. 헤라클레스는 뿔 두 개를 잡고 그대로 버텼어요.</p><p>소가 세 번 밀었어요. 세 번째에 소의 앞무릎이 꺾였지요. 헤라클레스는 뿔을 놓지 않은 채로 한참 그대로 있었어요. 소도 일어나지 않았고요. 둘 다 숨이 컸어요. 파헤쳐진 흙에서 냄새가 올라왔지요.</p><p>지붕 위에서 누가 소리를 질렀어요. 그러자 다른 지붕에서도 소리가 났어요. 그날 아침에는 그 섬에서 아무도 자지 않았어요.</p><p>소치는 사람은 나중에 그 이야기를 할 때마다 그 밭을 가리켰대요. 소가 제 발로 갈아 놓은 밭이었다고요. 돌아갈 배는 구할 수 있었어요. 그런데 소를 실어 줄 배는 없었지요. 뱃사람들이 고개를 저었어요. 저것이 배 안에서 한 번만 몸을 틀어도 배가 갈라진다고요.</p><p>“배에 못 실으면 소를 타고 헤엄쳐 가지요.”</p><p>조카가 그 말을 듣고 웃었어요. 웃다가 헤라클레스의 얼굴을 보고 웃음을 그쳤지요. 농담을 하는 얼굴이 아니었거든요.</p><p>헤라클레스는 황소를 물가로 몰고 갔어요. 그러고는 그 등에 올라탔어요. 소는 물에 들어가더니 헤엄을 쳤어요. 뭍짐승이 그렇게 오래 헤엄치는 것을 본 사람은 아무도 없었어요. 헤라클레스는 한 손으로 뿔을 잡고 다른 손으로는 자루를 머리 위에 들고 있었지요. 조카는 배를 타고 뒤를 따라왔고요.</p><p>미케네에서는 그 소를 헤라께 바치라고 했어요. 항아리 안에서 나온 말이었지요. 사람들이 황소를 신전 앞에 매어 놓고 목에 화환을 걸었어요.</p><p>아침에 보니 화환이 땅에 떨어져 있었어요. 밧줄은 끊어진 데가 없었고요. 밤새 신전 앞을 지킨 사람도 아무 소리를 못 들었다고 했어요. 다만 소가 없었어요.</p><p>“왕께서 사라진 황소는 찾지 말라십니다.” 왕의 말을 대신 전하는 사람이 그렇게 말했어요.</p><p>헤라클레스는 셈을 물어보지 않았어요. 물어봐야 대답이 없을 것을 알았거든요.</p><h2>밀물이 끊은 길</h2><p>북쪽 나라는 바람이 셌어요. 마을에 닿았는데 문이 다 안에서 걸려 있었어요. 문 하나가 손가락 두 개만큼 열렸어요. 그 틈으로 사람이 물었지요.</p><p>“사람 무는 그 말들 때문에 왔소?”</p><p>“그렇습니다.”</p><p>“그럼 해 있을 때 말하시오. 해 지면 아무도 대답 안 하니까.”</p><p>그 나라 왕은 말 네 마리를 길렀어요. 목에 쇠사슬을 두르고, 먹이를 담는 청동 구유에 매어 두었지요. 마을 사람들은 그 구유 쪽을 보지 않았어요. 그 말들이 어쩌다 그렇게 됐는지 다들 알았거든요. 왕이 그 말들에게 풀을 한 번도 준 적이 없다는 것을요.</p><p>밤이면 그 구유 쪽에서 쇠사슬 끌리는 소리가 났어요. 마을에서는 그 소리가 나면 아이들 귀를 막아 주었지요.</p><p>헤라클레스는 그날 낮에 바닷가를 걸었어요. 마을 앞으로 모래가 길게 뻗어 나가 작은 곶을 이루고 있었지요. 물이 빠지면 걸어 들어갈 수 있고, 물이 들면 그 길이 끊기는 자리였어요. 헤라클레스는 그 자리를 두 번 걸어 보고 물이 드는 때를 세었어요.</p><p>저녁에 아까 그 문틈으로 말하던 사람이 물 한 그릇을 문밖에 내놓았어요. 문은 여전히 열지 않았고요.</p><p>“그 말들을 오늘 밤에 끌어내실 거요?”</p><p>“그렇습니다.”</p><p>“그럼 우리는 안 나갑니다.”</p><p>“안 나오시는 게 좋습니다.”</p><p>문 안쪽에서 걸쇠 거는 소리가 두 번 났어요. 하나로는 모자란다고 생각한 모양이었지요. 그 집만 그런 것이 아니었어요. 마을을 따라 그 소리가 이어졌지요.</p><p>밤에 헤라클레스는 구유의 쇠사슬을 풀었어요. 말들이 한꺼번에 뛰쳐나왔지요. 헤라클레스는 앞을 막지 않았어요. 대신 뒤에서 소리를 질렀어요. 말들은 소리가 나는 쪽 반대로 달렸고, 그쪽이 바닷가였어요.</p><p>말들이 곶 끝까지 달려 나갔을 때 물이 들어오기 시작했어요. 돌아 나올 길이 물에 잠겼지요. 그 나라 왕이 횃불을 들고 쫓아왔어요. 물가에서 멈췄고요.</p><p>“그 말들은 내 말이다.”</p><p>“왕의 말인 줄 압니다.”</p><p>“물이 빠지면 내가 도로 데려간다.”</p><p>“물이 빠져도 왕께 돌려드리지는 않을 겁니다.”</p><p>헤라클레스는 물이 무릎까지 차오르는 자리를 걸어서 곶으로 건너갔어요. 그러고는 사흘을 거기 있었어요.</p><p>사흘 동안 헤라클레스가 한 일은 풀을 베어다 주는 것뿐이었어요. 처음에 말들은 풀에 입을 대지 않았어요. 둘째 날에 한 마리가 냄새를 맡았고요. 셋째 날 아침에는 네 마리가 다 고개를 숙이고 있었지요.</p><p>아무도 그 말들에게 풀을 준 적이 없었어요. 사흘째 저녁에 마을 쪽을 보니 문이 몇 개 열려 있었어요. 사람들이 문간에 나와 이쪽을 보고 있었지요. 헤라클레스가 손을 한 번 들자 그중 몇이 손을 들었어요.</p><p>배가 곶 뒤쪽으로 들어왔어요. 말들은 순순히 배에 올랐어요. 그 말들은 나중에 산으로 보내졌고, 거기서 무리를 이루어 살았다고 해요. 사람을 물었다는 이야기는 그 뒤로 없어요. 청동 구유는 그 자리에 그대로 두고 왔고요.</p><h2>여왕이 두른 띠</h2><p>아마존은 여자들이 말을 타는 나라였어요. 배가 물가에 닿으면 먼저 창부터 세우는 것이 그곳 법이었지요.</p><p>배가 닿았을 때 물가에 스무 명쯤이 나와 있었어요. 다들 말 위에 있었고요. 맨 앞에 선 사람이 여왕이었어요. 허리에 넓은 띠를 두르고 있었는데, 그 띠에는 청동판이 촘촘히 박혀 있었어요.</p><p>헤라클레스는 배에서 내려 두 손을 펴 보였어요. 아무것도 들지 않은 손이었지요.</p><p>“여왕님이 두르신 그 띠를 받으러 왔습니다.”</p><p>물가가 조용해졌어요. 여왕이 말에서 내렸어요.</p><p>“누가 그 띠를 가져오라고 시켰나?”</p><p>“미케네의 왕입니다. 그 왕의 딸이 갖고 싶어 한다고 들었습니다.”</p><p>여왕은 그 말을 한 번 되뇌었어요. 딸이 갖고 싶어 한다고요. 물가에 있던 사람들 가운데 몇이 웃었어요. 웃는 소리가 오래가지는 않았어요. 여왕이 손을 한 번 들었거든요.</p><p>“그런데 너는 왜 남의 심부름을 하느냐?”</p><p>헤라클레스는 대답했어요. 자랑도 변명도 없었고, 빼놓은 것도 없었어요. 여왕은 끝까지 듣고 나서 한참 서 있었어요. 그러고는 허리에서 띠를 풀었어요.</p><p>“이 띠를 가져가라.”</p><p>“띠 값을 치르겠습니다.”</p><p>“네 이야기를 다 들었으니 값은 그걸로 됐다.”</p><p>여왕이 그 띠를 헤라클레스의 손에 놓았어요. 그러니까 그 일은 거기서 끝난 거예요. 창 한 번 부딪히지 않고요.</p><p>그때 언덕 위에 여자 하나가 서 있었어요. 그 나라 옷을 입고 그 나라 말투로 말하는 사람이었지요. 아무도 그 얼굴을 몰랐는데, 아무도 그것을 이상하게 여기지 않았어요.</p><p>그 사람이 물가로 내려와 말들 사이를 걸으면서 한마디씩 흘렸어요.</p><p>“저 사람들이 여왕을 배에 태워 데려간다더라.”</p><p>여왕은 물가 저쪽에 있어서 그 말을 듣지 못했어요. 말 위에 있던 사람들이 서로를 보았어요. 그러고는 창끝을 배 쪽으로 겨누었지요.</p><p>그다음은 아주 빨리 일어났어요. 창이 부딪히는 소리가 물가를 한참 울렸어요. 모래가 파여서 그 자리로 물이 들어왔고요.</p><p>띠는 그때 이미 헤라클레스의 손에 있었어요. 싸움이 시작됐을 때도, 끝났을 때도요. 싸울 까닭이 하나도 없는 싸움이었어요.</p><p>싸움이 어떻게 멈췄는지는 아무도 제대로 말하지 못했어요. 누가 먼저 창을 내렸는지도요. 모래에는 발자국이 아주 많이 찍혀 있었는데, 그 발자국들이 다 서로 엉켜 있었지요. 밀물이 들어와 그것을 천천히 지웠고요.</p><p>싸움이 그치고 나서 여왕이 헤라클레스 앞으로 걸어왔어요. 헤라클레스가 띠를 도로 내밀었지요. 여왕은 그것을 받지 않았어요.</p><p>“그 띠는 가져가라. 싸움이 나기 전에 이미 너에게 준 것이다.”</p><p>배로 돌아가는데 모래 위에 사람이 하나 서 있었어요. 붉은 망토를 걸치고 청동 투구를 옆구리에 끼고 있었지요. 그 사람은 배 쪽을 보고 있지 않았어요. 싸움이 있던 자리를 보고 있었어요. 싸움이 있는 자리에는 늘 있는 신이었어요. 아레스였어요.</p><p>“그 띠는 내가 여왕에게 준 것이다.” 아레스가 말했어요.</p><p>헤라클레스는 자루를 고쳐 쥐었어요.</p><p>“가져가라. 네 덕에 오늘 여기서 싸움이 났으니 고맙구나.”</p><p>헤라클레스는 대답하지 않았어요. 아레스는 그 말만 하고 모래를 밟으며 걸어갔어요. 발자국이 아주 깊게 남았지요.</p><p>헤라클레스는 띠를 자루에 넣고 아가리를 두 번 묶었어요. 언덕 위를 보니 아까 그 사람이 아직 거기 있었어요. 이번에는 그 나라 옷이 아니었어요. 어깨에 공작 깃털이 하나 꽂혀 있었지요. 헤라클레스는 그 깃털을 알아보았어요. 헤라였어요.</p><p>헤라클레스가 그쪽을 보자 헤라는 돌아섰어요. 모래에 발자국이 없었어요.</p><h2>서쪽 끝의 붉은 소 떼</h2><p>서쪽으로 가는 길은 길었어요. 바다가 좁아지는 목이 하나 있었는데, 거기서는 양쪽 뭍이 서로 보였어요. 헤라클레스는 그 목 양쪽 바위 위에 돌을 하나씩 세워 두었어요.</p><p>“그건 왜 세우세요?” 조카가 물었어요.</p><p>“돌아올 때 어디까지 갔었는지 알려고.”</p><p>그 목을 지나자 물빛이 달라졌어요. 파도가 길어졌고요. 뱃사람들은 그 너머로는 가 본 적이 없다고 했어요.</p><p>물길이 사흘 더 이어졌어요. 낮에는 해가 뱃머리 앞에 있었고, 저녁이면 그 해가 물속으로 들어갔어요. 조카는 해가 물에 닿을 때 소리가 날 줄 알았대요. 아무 소리도 나지 않았지만요.</p><p>세상 서쪽 끝에 섬이 하나 있었어요. 해가 지는 쪽이라 저녁이 아주 길었지요. 그 섬에 붉은 소 떼가 있었어요. 저녁빛 때문에 붉어 보이는 것이 아니라 정말 털이 붉었어요. 새벽에도 붉었고 한낮에도 붉었거든요.</p><p>소 떼를 지키는 것은 몸이 셋인 거인이었어요. 팔이 여섯이라 앞뒤라는 것이 없었지요.</p><p>헤라클레스는 저녁까지 기다렸어요. 해가 물에 반쯤 들어갈 때였어요. 그때 그 자리에 서면 거인의 그림자가 셋으로 갈라졌거든요. 어느 것이 제 몸인지 거인도 한 번 내려다보았어요. 헤라클레스는 그 틈에 화살을 쏘았어요.</p><p>그 한 번이면 됐어요. 그러고 나서 섬에는 소를 지킬 사람이 없어졌지요. 붉은 소들은 헤라클레스가 몰아도 놀라지 않았어요. 여태 몰려 본 적이 없어서 몰리는 것이 무엇인지 몰랐던 거예요.</p><p>소를 배에 싣는 데 이레가 걸렸어요. 소가 백 마리가 넘었거든요. 배 세 척을 빌려야 했고, 뱃삯은 소 열 마리로 치렀지요.</p><p>돌아오는 길은 갈 때보다 두 배가 걸렸어요. 뭍으로 몰고 온 구간이 길었거든요. 산을 넘고 강을 건너고, 강을 건널 때마다 소를 세었어요.</p><p>한번은 한 마리가 모자랐어요.</p><p>“한 마리쯤은 모자라도 괜찮지 않아요?” 조카가 말했어요.</p><p>“한 마리가 모자라면 셈이 안 맞아.”</p><p>헤라클레스는 왔던 길을 사흘 도로 걸어가 그 한 마리를 찾아왔어요. 강가 갈대밭에 서 있었대요. 그러고 나서 다시 사흘을 걸어 소 떼를 따라잡았지요.</p><p>그 여러 달 동안 헤라클레스가 잠을 잔 자리는 늘 소 떼 바깥쪽이었어요. 밤에 무엇이 오면 먼저 닿는 자리였지요. 조카는 안쪽에서 잤고요.</p><p>“왜 늘 바깥쪽에서 주무세요?”</p><p>“소들 말이, 안쪽이 더 따뜻하대.”</p><p>조카는 그 말을 믿지 않았어요. 그래도 안쪽에서 잤지요. 마지막 뱃길에서 헤라클레스는 뱃전에 앉아 있었어요. 붉은 소들이 배 아래에서 발을 굴렀지요. 조카가 옆에 와서 자루를 턱으로 가리켰어요.</p><p>“그 띠는 누구한테 갈 거예요?”</p><p>“왕의 딸한테 갈 거야.”</p><p>조카는 더 묻지 않았어요. 헤라클레스는 자루를 무릎 위에 올려놓았어요. 띠가 그 안에 있었어요. 그러고는 뒤를 돌아 서쪽 바다 끝을 오래 보았어요. 해가 거기 반쯤 걸려 있었지요. 물빛이 그 아래에서 길게 붉었고요.</p><p>“이제 남은 건 세상 끝에 있는 것들뿐이구나.”</p><p>노 젓는 소리만 났어요.</p></article></noscript>
