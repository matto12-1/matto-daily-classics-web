  <noscript><article class="ns-text"><h1>자르면 늘어나는 머리</h1><h2>진창에 빠진 바퀴</h2><p>수레바퀴가 진창에 빠졌어요. 조카가 고삐를 당겼지만 말은 앞으로 나가지 못했지요. 바퀴가 헛돌 때마다 진흙이 뒤로 튀었어요.</p><p>헤라클레스가 수레 뒤로 돌아가 한 손을 걸쳤어요. 바퀴가 쑥 빠져나왔어요. 말이 놀라서 몇 걸음을 내달렸지요.</p><p>“살살 미세요!” 조카가 소리쳤어요.</p><p>길은 남쪽으로 났어요. 하루하고 반나절이면 닿는다고 했지요. 그런데 며칠 전에 비가 와서 길이 다 물러 있었어요. 수레가 진창에 빠진 것이 그날만 세 번째였고요.</p><p>조카는 열여섯 살이었어요. 헤라클레스가 미케네를 떠날 때 따라나선 아이였지요. 같이 가겠다는 사람이 하나도 없었는데 이 아이만 수레 옆에 서 있었어요.</p><p>헤라클레스한테는 같은 날 같은 요람에서 잔 쌍둥이 형제가 있었어요. 그 형제의 아들이 이 아이였지요. 따라오지 말라고 했더니 아이는 짐을 수레에 실었어요. 그러고는 고삐를 잡았지요. 그 뒤로 그 이야기는 다시 나오지 않았어요.</p><p>미케네 사람들은 헤라클레스가 지나가면 하던 일을 멈추고 보았어요. 그런데 아무도 가까이 오지는 않았지요. 사자 이야기를 다 들었지만, 그 사람이 왜 왕에게 매여 있는지도 다 들었거든요.</p><p>조카만 달랐어요. 조카는 아침마다 수레를 끌고 와서 문 앞에 세워 두었어요. 수레에는 몽둥이와 활과 화살통이 실려 있었어요. 그리고 사자 가죽이 개켜져 있었지요. 조카는 그 가죽 위에는 아무것도 올려놓지 않았어요.</p><p>“이번에 왕이 시킨 일은 뭐래요?” 조카가 물었어요.</p><p>“남쪽 늪에 뭐가 사는데, 그걸 없애래.”</p><p>“그게 다예요?”</p><p>“왕이 한 말은 그게 다야.”</p><p>조카는 그런 짧은 대답에 익숙해져 있었어요. 요즘 헤라클레스는 말수가 아주 적었거든요. 대신 조카가 두 사람 몫으로 떠들었지요. 어제 본 새 이야기, 말이 뒷발질한 이야기, 그런 것들을요.</p><p>왕이 말을 길게 하지 않은 것은 사실이었어요. 그날 왕은 항아리 옆에 서서 어디로 가라는 말만 하고는 방을 나갔거든요. 그 뒤로 왕은 헤라클레스와 눈을 마주치지 않았어요.</p><p>조카는 더 묻지 않았어요. 대신 수레 위에서 화살촉을 하나씩 꺼내 헝겊으로 닦았어요. 길이 울퉁불퉁해서 자꾸 손이 흔들렸지요.</p><h2>물이 검은 데</h2><p>늪이 가까워지자 길에서 사람이 없어졌어요. 밭도 없었고요. 대신 길가에 부러진 수레바퀴가 하나 버려져 있었어요. 오래된 것이었어요.</p><p>길가에 집도 한 채 있었어요. 지붕이 반쯤 내려앉았고, 마당에 항아리가 깨진 채로 굴러다녔지요. 사람이 나간 지 여러 해 된 집이었어요.</p><p>양치기가 하나 언덕에 서 있었어요. 양은 다 언덕 위쪽에 몰려 있었지요. 물가 쪽으로는 한 마리도 내려가지 않았어요.</p><p>“거기 물은 먹이지 마시오.” 양치기가 말했어요. “양이 코를 대기만 해도 주저앉소.”</p><p>“물속에 무엇이 있습니까?” 헤라클레스가 물었어요.</p><p>양치기는 손가락을 펴 보였어요. 다섯을 폈다가, 접었다가, 이번에는 아홉을 폈지요. 그러고는 그 손을 도로 내렸어요.</p><p>“머리가 몇 개인지는 셀 때마다 달라서 모르겠소.”</p><p>양치기는 그 말만 하고 언덕 위로 올라갔어요. 양들이 그 뒤를 줄지어 따라갔지요. 헤라클레스가 고맙다고 한 소리를 들었는지 어떤지는 알 수 없었어요.</p><p>언덕에서 내려다보니 늪이 한눈에 들어왔어요. 물이 넓게 퍼져 있었는데 어디가 물이고 어디가 땅인지 알 수 없었지요. 갈대가 그 위를 다 덮고 있었거든요.</p><p>바람이 불면 갈대가 한쪽으로 누웠다가 다시 섰어요. 그런데 한 군데만 달랐어요. 늪 한가운데 언저리에 누운 채로 그대로인 자리가 있었지요.</p><p>헤라클레스와 조카는 수레를 언덕에 세워 두고 걸어 내려갔어요. 내려갈수록 발밑이 물렀어요. 마른 땅인 줄 알고 디디면 발이 쑥 들어갔지요.</p><p>냄새가 났어요. 물이 오래 고인 데서 나는 냄새였는데, 거기에 다른 것이 섞여 있었어요. 조카가 팔로 코를 막았어요.</p><p>“왜 여태 아무도 저걸 없애지 않았을까요?” 조카가 물었어요.</p><p>“없애러 들어간 사람이 하나도 안 나와서 그래.”</p><p>조카는 그 말을 듣고 발밑을 내려다보았어요. 그러고는 그때부터 헤라클레스가 밟은 자리만 골라 디뎠어요.</p><p>늪 한가운데에 샘이 하나 있었어요. 물이 거기서 솟아 나왔지요. 그 둘레만 물빛이 검었어요. 그리고 그 검은 자리에는 갈대가 자라지 않았어요.</p><p>헤라클레스는 사자 가죽을 걸치고 몽둥이를 들었어요. 조카에게는 수레로 돌아가 있으라고 했지요. 조카는 그러겠다고 대답하고는 갈대 뒤에 앉았어요.</p><h2>머리가 아홉인 것</h2><p>헤라클레스는 마른 갈대를 한 아름 모아 샘 앞에 놓고 불을 붙였어요. 연기가 물 위로 낮게 깔렸지요. 연기가 검은 물 위를 지나가는데도 물은 조금도 움직이지 않았어요.</p><p>그러다 물이 부풀어 올랐어요. 처음에는 샘물이 솟는 소리인 줄 알았어요. 그런데 그 소리가 점점 낮아졌어요. 물이 끓는 것도 아니고 흐르는 것도 아닌 소리였지요.</p><p>목이 하나 올라왔어요. 그리고 그 옆에 또 하나요. 목마다 끝에 머리가 달려 있었어요. 세어 보니 아홉이었어요.</p><p>목은 저마다 따로 움직였어요. 하나가 이쪽을 보면 다른 하나는 저쪽을 보았지요. 머리마다 위쪽에 작은 가시 같은 것이 돋아 있었고요. 목 아래는 물속에 있어서 보이지 않았어요.</p><p>사람들은 그것을 히드라라고 불렀어요. 그 늪에 사는 것을 본 사람은 적었지만, 이름은 멀리까지 가 있었지요.</p><p>히드라가 숨을 뱉은 자리마다 갈대가 누웠어요. 누운 갈대는 다시 서지 않았어요. 헤라클레스는 사자 가죽 머리를 앞으로 당겨 썼어요. 그러고는 무릎까지 물에 들어갔지요.</p><p>첫 번째 머리가 내려왔어요. 헤라클레스는 몽둥이를 휘둘렀어요. 목 하나가 물에 떨어졌지요. 그런데 떨어진 자리에서 곧바로 무언가가 밀려 올라왔어요. 처음에는 주먹만 했어요. 그것이 부풀더니 목이 되었어요. 하나가 아니라 둘이요.</p><p>헤라클레스는 뒤로 한 걸음 물러섰어요. 이제 열이었어요. 다시 휘둘렀어요. 하나가 떨어지고 둘이 올라왔어요. 열하나가 되었지요.</p><p>헤라클레스는 여태 사나운 짐승과 마주친 적이 여러 번이었어요. 그런데 이런 것은 처음이었어요. 이기고 있는데 상대가 늘어났으니까요.</p><p>물이 허리까지 차올랐어요. 발이 진흙에 박혀서 한 걸음 물러서는 데도 힘이 들었지요. 헤라클레스는 몽둥이를 두 손으로 고쳐 잡았어요.</p><p>“아무도 가까이 오지 마!”</p><p>헤라클레스가 갈대밭 쪽에 대고 한 번 소리쳤어요. 그냥 그렇게 외치고 다시 앞을 보았지요.</p><p>헤라클레스는 그래도 계속했어요. 몸이 기억하는 대로 손이 움직였거든요. 한참 뒤에 손을 멈추고 위를 올려다보았어요. 이제는 머리를 셀 수 없었어요.</p><p>발밑에서 물이 한 번 크게 출렁였어요. 헤라클레스가 아래를 내려다보았지요. 물속에서 커다란 게 한 마리가 걸어 나오고 있었어요. 등딱지가 방패만 했어요.</p><p>게가 헤라클레스의 발등을 집었어요. 헤라클레스는 발을 들었다가 놓았어요. 게는 진흙 속으로 들어가 다시 나오지 않았어요.</p><p>그런데 헤라클레스는 그 게가 어디서 왔는지가 궁금했어요. 이런 늪에 게가 살 리는 없었으니까요. 헤라클레스는 고개를 들어 건너편을 보았어요.</p><p>늪 건너 바위 위에 헤라가 서 있었어요. 헤라는 아무 말도 하지 않았어요. 손도 들지 않았고요. 다만 그 자리에 서서 이쪽을 보고 있었지요. 물 위로 바람이 한 번 지나갔어요.</p><p>헤라클레스가 다시 눈을 들었을 때 바위 위에는 아무도 없었어요. 그 자리에 서 있던 이가 무엇을 하러 왔는지는 헤라클레스도 알았어요. 도우러 온 것이 아니라는 것만은 분명했으니까요. 요람에 뱀이 들어오던 날 이야기를 어머니에게 여러 번 들었거든요.</p><p>목 하나가 헤라클레스의 어깨를 스쳤어요. 사자 가죽이 그것을 막았어요. 가죽이 없었으면 어떻게 되었을지는 생각하지 않기로 했지요.</p><p>헤라클레스는 물에서 나왔어요. 갈대밭까지 물러나 무릎을 짚고 숨을 골랐어요. 늪 쪽에서는 목들이 물 위로 나와 이쪽을 보고 있었지요.</p><p>자르는 것으로는 안 된다는 것을 헤라클레스도 이제 알았어요. 자를수록 늘어나니까요. 그런데 자르지 않고는 가까이 갈 수도 없었지요.</p><h2>횃불 두 개</h2><p>그때 뒤쪽 갈대밭에서 소리가 났어요. 조카가 거기 앉아 있었어요. 아까부터요.</p><p>“수레로 돌아가 있으랬잖아.”</p><p>“수레에 갔다가 도로 왔어요.”</p><p>조카는 손에 무언가를 들고 있었어요. 아까 헤라클레스가 피워 놓고 온 불에서 옮겨 붙인 것이었지요. 마른 갈대를 헝겊으로 감아 묶은 횃불이었어요.</p><p>조카가 그것을 내밀었어요. 헤라클레스는 받지 않고 그것을 한참 보았어요.</p><p>헤라클레스는 아까 벤 자리를 떠올렸어요. 벤 자리에서 새것이 밀려 올라오기까지 숨 두 번쯤이 걸렸어요. 그동안 그 자리는 열려 있었지요.</p><p>“그 횃불, 두 개 더 만들 수 있어?” 헤라클레스가 물었어요.</p><p>“세 개도 더 만들 수 있어요.”</p><p>조카는 대답을 기다리지도 않고 벌써 갈대를 자르고 있었어요. 손이 아주 빨랐어요. 겁이 나면 손이 빨라지는 아이였지요.</p><p>조카는 갈대를 잘라 헝겊에 기름을 먹였어요. 배에서 쓰는 기름이 수레에 한 병 있었거든요. 횃불 네 개를 만드는 데 그리 오래 걸리지 않았어요.</p><p>두 사람은 나란히 물에 들어갔어요. 헤라클레스가 앞이고 조카가 반걸음 뒤였어요. 그사이 늘어났던 목들은 도로 가라앉아 있었어요. 물 위에 나온 것은 처음처럼 아홉이었지요.</p><p>“내가 목을 자르면 너는 그 자리에 횃불을 대.” 헤라클레스가 말했어요. “머리는 올려다보지 말고 몇 개째인지 세기만 해.”</p><p>“예.”</p><p>헤라클레스가 몽둥이를 놓고 칼을 뽑았어요. 목 하나가 떨어졌어요. 조카가 그 자리에 횃불을 댔어요. 지지직 소리가 났지요.</p><p>밀려 올라오던 것이 멈췄어요. 그러고는 도로 가라앉았어요. 조카는 세었어요. 하나, 둘, 셋. 목소리가 갈라졌지만 세는 것은 한 번도 틀리지 않았어요.</p><p>네 번째 목을 자를 때 조카가 진흙에 미끄러졌어요. 횃불이 물에 닿을 뻔했지요. 조카는 그것을 머리 위로 번쩍 들고 일어섰어요. 무릎이 물에 잠겼는데도 횃불은 젖지 않았어요.</p><p>그다음부터 두 사람은 아무 말도 하지 않았어요. 헤라클레스가 팔을 들면 조카가 한 걸음 붙었고, 헤라클레스가 팔을 내리면 조카가 손을 뻗었지요. 두 사람이 한 사람처럼 움직였어요.</p><p>그렇게 여덟까지 갔어요. 남은 목이 하나였어요. 그 목은 다른 것들과 달랐어요. 아무리 해도 잘리지 않았거든요. 칼날이 자꾸 미끄러졌어요.</p><p>여덟 번째 자리를 지지고 나서 헤라클레스는 잠깐 그대로 서 있었어요. 남은 목 하나가 아주 천천히 이쪽으로 내려오고 있었거든요. 그 머리는 다른 것들처럼 이를 드러내지 않았어요. 그냥 내려다보기만 했지요.</p><p>헤라클레스는 그 목을 자르는 대신 두 팔로 붙잡았어요. 그리고 물 밖으로 끌어냈지요. 조카가 옆에서 횃불을 들고 따라왔어요.</p><p>길가에 큰 바위가 하나 있었어요. 헤라클레스가 그 아래를 파고 목을 밀어 넣었어요. 그러고는 바위를 굴려 그 위를 덮었지요.</p><p>그 바위는 지금도 그 자리에 있대요. 지나가는 사람들이 그 위에 돌을 하나씩 올려놓고 가서, 이제는 돌무더기가 되었다지요.</p><p>늪이 조용해졌어요. 물이 다시 맑아지지는 않았어요. 그런데 갈대가 눕지는 않았지요. 바람이 지나가자 갈대밭 전체가 한쪽으로 누웠다가 다 같이 일어섰어요. 누운 채로 있는 자리는 이제 한 군데도 없었어요.</p><p>조카는 횃불을 물에 담가 껐어요. 그러고는 손바닥을 들여다보았어요. 손바닥이 벌겋게 익어 있었어요. 헤라클레스가 그 손을 잡아 물에 담가 주었지요.</p><p>“셋까지 셀 때 너무 무서웠어요.” 조카가 말했어요.</p><p>“그런데도 끝까지, 여덟까지 셌잖아.”</p><p>조카는 아무 말도 하지 않았어요. 대신 어깨를 한 번 으쓱했지요. 그러고는 한참 동안 입을 다물고 있었어요. 웃음이 자꾸 나오려고 해서요.</p><p>조카는 아까 건너편 바위 위에 누가 서 있는 것을 보았어요. 그 이야기는 하지 않았지요. 지금 할 이야기가 아니라는 것쯤은 알았거든요.</p><p>두 사람은 그날 밤 언덕에서 잤어요. 불을 크게 피워 놓고요. 조카는 눕자마자 잠들었어요. 헤라클레스는 그 옆에 앉아 늪 쪽을 오래 보았지요. 물 위로는 아무것도 올라오지 않았어요.</p><h2>셈에 넣지 않겠다</h2><p>미케네로 돌아가는 길은 갈 때보다 짧게 느껴졌어요. 조카가 수레 위에서 자꾸 그날 이야기를 했거든요. 같은 대목을 세 번씩 했어요. 헤라클레스는 세 번 다 처음 듣는 것처럼 들어 주었지요.</p><p>성문 앞에서 사람들이 늪 냄새 때문에 코를 막았어요. 그래도 아무도 자리를 뜨지는 않았어요.</p><p>조카는 성문 앞에 수레를 세우고는 들어가지 않으려고 했어요. 냄새 때문이라고 했지만 그것 때문만은 아니었지요. 헤라클레스가 같이 가자고 했어요. 그래서 둘이 함께 언덕을 올라갔어요.</p><p>큰 방에 들어갔더니 왕좌가 비어 있었어요. 청동 항아리 뚜껑이 손가락 두 개만큼 열려 있었지요.</p><p>“늪에 있던 히드라는 이제 못 나옵니다.” 헤라클레스가 말했어요.</p><p>항아리 안에서 한참 동안 아무 소리도 나지 않았어요. 그러다 뚜껑이 조금 더 열렸어요.</p><p>“너 혼자 갔느냐?”</p><p>헤라클레스는 대답하기 전에 문간 쪽을 한 번 보았어요. 조카가 거기 서 있었어요. 손바닥에 아직 헝겊을 감은 채로요.</p><p>“조카가 함께 갔습니다.”</p><p>뚜껑이 활짝 열렸어요. 왕이 항아리 가장자리를 두 손으로 잡고 얼굴만 내밀었지요. 금관이 한쪽으로 기울어 있었어요.</p><p>“그러면 너 혼자 한 것이 아니지 않으냐?” 왕이 말했어요.</p><p>“예, 조카가 도왔습니다.”</p><p>“그러면 이 일은 열두 가지에 셈하지 않겠다.”</p><p>왕은 그 말을 하고 나서 얼른 항아리 안으로 도로 들어갔어요. 방이 아주 조용해졌어요. 왕의 말을 전하는 사람도 고개를 들지 못했어요. 그 자리에 있던 사람들도 그건 아니라고 생각했지요. 다만 아무도 입 밖에 내지 못했어요.</p><p>조카가 앞으로 나서려고 했어요. 헤라클레스가 팔을 뻗어 막았지요. 조카는 팔에 막힌 채로 항아리 쪽을 노려보다가, 결국 입을 다물었어요.</p><p>헤라클레스는 아무 말도 하지 않았어요. 다만 돌아서서 문을 나설 때 문틀을 한 번 짚었어요. 손자국이 나무에 그대로 남았어요.</p></article></noscript>
