        <div class="recap"><h3>지난 이야기</h3><ol><li>섬의 왕이 잔칫날 페르세우스에게 보는 사람을 돌로 만든다는 괴물의 머리를 가져오라고 했어요.</li><li>아테나가 거울처럼 닦은 방패를, 헤르메스가 날개 달린 신발과 자루와 굽은 칼을 건네주었지요.</li><li>눈 하나를 나눠 쓰는 세 노파가 물이 끝나고 돌이 시작되는 곳을 알려 주었어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>방패에 비친 얼굴</h1><h2>물이 끝나고 돌이 시작되는 곳</h2><p>돌 하나가 팔을 들고 있었어요. 페르세우스는 그 앞에 내려섰어요. 사람 키만 한 돌이었어요. 팔을 들어 얼굴 앞을 가린 모양이었지요. 손가락 사이가 조금 벌어져 있었어요. 그 틈으로 앞을 보려던 자세 그대로였고요.</p><p>그 뒤로도 돌이 있었어요. 하나는 뒤로 돌아서서 달아나는 중이었어요. 한 발이 아직 땅에 닿지 않은 채였지요. 하나는 무릎을 꿇고 있었어요. 하나는 아주 작았어요. 페르세우스 허리에도 못 미쳤지요.</p><p>세 노파가 일러 준 그대로였어요. 저쪽으로 사흘을 가면 물이 끝나고 돌이 시작된다고요. 서 있는 돌이 많아지면 다 온 것이라고요.</p><p>사흘 동안 페르세우스는 검은 물 위를 날았어요. 아래로 배 한 척 지나가지 않았어요. 밤이면 바다에 솟은 바위에 내려앉아 눈을 붙였지요. 신발을 벗으면 바로 가라앉을 것 같아서 신은 채로 잤어요.</p><p>물이 끝나는 자리는 누가 금을 그어 놓은 것 같았어요. 여기까지는 파도가 오고, 여기부터는 오지 않았지요. 그리고 물이 끝나는 바로 그 자리에서부터 돌이 시작되었어요.</p><p>페르세우스는 돌을 세면서 걸었어요. 서른까지 세다가 그만두었어요. 돌 하나는 다른 것들과 조금 달랐어요. 젊은 남자였는데, 한 손에 넓적한 청동판을 들고 있었어요. 청동판 겉이 반들반들하게 닦여 있었지요. 얼굴이 비칠 만큼요.</p><p>페르세우스는 그 앞에 오래 서 있었어요. 그 사람도 같은 생각을 했던 거예요. 비친 것을 보면 된다고요. 그런데 그 사람은 지금 돌이 되어 여기 서 있었어요.</p><p>페르세우스는 자기 방패를 내려다보았어요. 방패 안에 자기 얼굴이 들어 있었지요. 그 얼굴을 한참 보다가 방패를 도로 등으로 돌렸어요.</p><p>“당신도 청동판에 비친 모습만 보면 된다고 생각했군요.”</p><p>페르세우스가 그 앞에서 소리를 내어 말했어요. 돌은 아무 대답도 하지 않았지요. 그 뒤로 페르세우스는 하루에 한두 마디씩 소리를 내어 말하게 됐어요. 사람 목소리가 하나도 없는 데였거든요.</p><p>바닥에는 쇠붙이가 여기저기 떨어져 있었어요. 녹이 슬어 손으로 집으면 부스러질 것 같았지요. 어떤 것은 칼이었고 어떤 것은 창끝이었어요. 창끝 하나는 돌이 된 사람의 손에서 반 뼘쯤 떨어진 자리에 놓여 있었어요. 놓친 자리에 그대로 떨어진 것이었지요.</p><p>어떤 돌에는 이끼가 두껍게 끼어 있었어요. 손톱으로 긁어야 얼굴이 나올 만큼요. 어떤 돌은 아직 반들반들했어요. 그 돌은 등에 자루를 메고 있었어요. 자루 끈이 어깨를 파고든 자국까지 그대로 남아 있었지요.</p><p>페르세우스는 그 앞에서 걸음을 멈췄어요. 자기 어깨에도 자루 끈이 걸려 있었거든요.</p><p>그 자리에는 새도 없었어요. 사흘을 날아오는 동안 갈매기가 따라왔는데, 돌이 시작되는 데서부터는 따라오지 않았어요. 바람은 부는데 소리가 나지 않았어요. 부딪힐 것이 다 돌이었으니까요.</p><p>해가 낮게 걸릴 무렵에 페르세우스는 방패를 앞으로 돌렸어요. 방패 안에서는 세상이 여전히 뒤집혀 있었어요. 오른쪽이 왼쪽이 되고 왼쪽이 오른쪽이 되었지요. 페르세우스는 등 뒤에 있는 돌을 방패 안에서 찾고, 고개를 돌리지 않은 채로 그쪽에 손을 뻗었어요.</p><p>열 번에 다섯 번은 맞았어요. 길에서 연습하던 때는 열 번에 두 번이었으니 나아진 셈이었지요. 그런데 돌은 움직이지 않는 것이었어요. 움직이는 것을 이 안에서 맞힐 수 있을지는 아직 알 수 없었어요.</p><p>뒤로 걷는 것도 연습했어요. 방패를 앞으로 들고 뒤로요. 열 걸음을 걸으면 두 번쯤 비틀거렸지요. 발뒤꿈치로 땅을 먼저 더듬으면 좀 나았어요.</p><p>저녁에 페르세우스는 자루에서 마른 생선을 꺼냈어요. 어머니가 싸 준 것이었지요. 이제 두 마리 남아 있었어요. 페르세우스는 한 마리를 반으로 잘라 반만 먹고 나머지는 도로 넣었어요.</p><p>“어머니, 싸 주신 생선이 두 마리 남았습니다.”</p><p>페르세우스가 자루에 대고 말했어요. 어머니한테 하는 말이었지요. 그러고는 자루 끈을 도로 묶었어요. 돌밭에서 페르세우스는 사흘을 기다렸어요. 낮에는 바위 뒤에 있었고, 밤에는 방패를 세워 두고 지켜봤지요. 첫날 밤에는 아무것도 나오지 않았어요.</p><h2>눈을 가린 것</h2><p>그 밤에는 달이 없었어요. 페르세우스는 큰 바위 뒤에 누워 있었어요. 신발은 벗어서 가슴 위에 얹어 두었고요. 언제든 신을 수 있게요.</p><p>무언가 마른 잎을 스치는 소리가 났어요. 잎이 있을 데가 아니었는데도요. 페르세우스는 방패를 천천히 세웠어요. 방패 안으로 돌밭이 들어왔어요.</p><p>누가 돌들 사이를 걸어오고 있었어요. 여자였어요. 검은 천으로 눈을 가리고 있었지요. 천 끝이 다 해져서 실이 늘어져 있었어요. 머리에서는 초록색 뱀들이 천천히 움직였어요. 걸을 때마다 그 뱀들이 어깨 위로 흘러내렸지요. 아까 그 소리가 이 소리였어요.</p><p>그 사람은 눈을 가린 채로도 잘 걸었어요. 어디에 무엇이 있는지 다 아는 사람 같았어요. 돌 사이가 좁은 데에서는 어깨를 먼저 돌렸고요.</p><p>그 사람이 돌 하나 앞에 멈춰 섰어요. 팔을 들어 얼굴을 가린 그 돌이었어요. 손을 뻗어 어깨 위에 쌓인 모래를 쓸어 내렸지요.</p><p>페르세우스는 방패 뒤에서 그것을 다 보았어요. 방패 안에서는 그 사람도 거꾸로였어요. 발이 위에 있고 머리가 아래에 있었지요.</p><p>“오늘은 바람이 셌다.”</p><p>대답은 없었어요. 그 사람은 다음 돌로 갔어요. 무릎을 꿇은 돌이었지요. 거기서도 어깨를 쓸었어요. 그러고는 한참을 그 앞에 서 있었어요.</p><p>바위 위쪽에서 다른 소리가 났어요. 페르세우스는 방패를 조금 돌렸어요. 높은 바위 위에 둘이 앉아 있었어요. 둘 다 등에 커다란 날개를 접고 있었어요. 앉은 자세가 꼭 사람 같지는 않았지요.</p><p>그 둘은 자세를 거의 바꾸지 않았어요. 한참 만에 하나가 날개를 조금 폈다가 도로 접었지요. 그게 다였어요.</p><p>“메두사.”</p><p>위에서 그 이름을 불렀어요. 아래에 있던 사람이 고개를 들었어요.</p><p>“곧 갈게.”</p><p>위에서 다시 소리가 났어요.</p><p>“또 돌들 곁에 가 있구나.”</p><p>“돌들 곁에 좀 있으면 어때서.”</p><p>메두사가 그렇게 대답하고는 다음 돌로 걸어갔어요. 위에서는 더 부르지 않았어요. 페르세우스가 자란 섬에서는 열여덟 해 동안 아무도 이 이름을 말하지 않았어요. 다들 그냥 그 괴물이라고만 했지요.</p><p>섬에서 그 말이 나오면 어른들은 하던 이야기를 돌렸어요. 아이들이 그 이야기를 꺼내면 손을 내저었고요.</p><p>뱀 한 마리가 메두사의 어깨에서 흘러내려 바닥으로 떨어졌어요. 그러고는 페르세우스가 누운 바위 쪽으로 스르르 왔어요. 바위 밑동을 한 바퀴 돌더니 도로 돌아갔지요. 페르세우스는 그동안 숨을 쉬지 않았어요.</p><h2>아테나가 다녀간 밤</h2><p>이튿날 밤에는 돌들 사이에 아테나가 서 있었어요. 언제부터 서 있었는지 알 수 없었어요. 방패를 준 그날처럼 어깨에 부엉이가 앉아 있었지요.</p><p>“메두사를 잘 보았느냐?” 아테나가 말했어요.</p><p>“세 자매가 다 저렇게 아래로 내려옵니까?”</p><p>“언니 둘은 바위 위에 있고, 메두사 하나만 아래로 내려온다. 네가 본 그대로다.”</p><p>아테나가 높은 바위 쪽을 가리켰어요. 언니 둘이 앉아 있던 자리였지요.</p><p>“저 둘은 늙지도 않고 죽지도 않는다. 네 칼이 닿아도 아무 일도 일어나지 않아. 그러니 저 둘이 깨면 그때는 달아나는 수밖에 없다.”</p><p>페르세우스는 방패를 무릎에 올려놓고 있었어요. “메두사는 왜 눈을 천으로 가리고 다닙니까?”</p><p>“눈을 가리고 있으면 아무도 돌이 되지 않으니까.”</p><p>페르세우스는 한참 말이 없었어요.</p><p>“스스로 눈을 가리고 사는데, 그냥 가만두면 되지 않습니까?”</p><p>“그 왕은 네가 없는 틈에 네 어머니를 억지로 아내로 삼으려 한다. 가만두면 네 어머니는 어떻게 되겠느냐.” 아테나가 말했어요.</p><p>“신께서 직접 하시면 하루면 끝날 일 아닙니까?”</p><p>“그렇겠지.”</p><p>“그런데 왜 저를 보내십니까?”</p><p>“그 약속은 네가 한 것이지, 신들이 한 것이 아니니까.” 아테나가 말했어요.</p><p>페르세우스는 대답하지 못했어요. 섬 언덕 위의 흰 집이 떠올랐거든요. 잔칫날 선물로 끌려와서는 아무도 풀어 가지 않던 말 열몇 마리도요.</p><p>“메두사의 머리를 가져오라고 시킨 건 왕입니다. 그러니 이건 왕의 일입니다.”</p><p>“그 왕에게 무엇이든 가져오겠다고 먼저 말한 것은 누구였느냐?”</p><p>페르세우스의 귀가 붉어졌어요. 잔칫날 그 마당에서 그 말을 하고 났을 때도 그랬지요.</p><p>“하나만 더 여쭙겠습니다. 세 노파가 그러던데요. 메두사는 원래 그런 얼굴이 아니었다고요. 정말입니까?”</p><p>아테나는 대답하지 않았어요. 신이라고 늘 대답을 해 주는 건 아니었어요. 대신 자는 시각을 알려 주었어요. 새벽이 오기 바로 전에 셋이 다 잠깐 잠든다고요. 그때가 아주 짧다고요. 그리고 잠들면 눈을 가린 천이 저절로 풀린다고 했어요.</p><p>“메두사의 머리를 벤 뒤에는 곧바로 자루에 넣어라. 넣고 나면 자루를 다시 열지 마라.” 아테나가 말했어요. “너도 사람이라, 그 얼굴을 보면 돌이 된다.”</p><p>“그 자리에서 무엇이 솟아오르더라도 붙잡으려 들지 마라. 네 것이 아니다.”</p><p>아테나가 사라진 뒤에 페르세우스는 방패를 다시 들었어요. 등 뒤의 돌을 찾아 손을 뻗었지요. 이번에는 열 번에 셋도 못 맞혔어요. 손이 자꾸 반대쪽으로 갔거든요.</p><p>그날 밤에는 바람도 없었어요. 페르세우스는 자루를 베고 누웠지만 잠이 오지 않았어요. 눈을 감으면 팔을 든 그 돌이 보였거든요. 손가락 사이가 조금 벌어진 그 손이요.</p><h2>돌들 사이에서 들은 것</h2><p>새벽까지는 아직 멀었어요. 페르세우스는 바위 뒤에 그대로 있었어요. 메두사가 또 나왔어요. 이번에는 손에 아주 작은 것을 들고 있었어요. 페르세우스는 방패를 이리저리 돌려 그것을 보았어요. 빗이었어요. 이가 성긴 나무 빗이었지요.</p><p>메두사는 돌 하나 앞에 앉았어요. 아주 작은 돌이었어요. 페르세우스 허리에도 못 미치던 그 돌이었지요.</p><p>“이 빗은 이제 머리에 안 들어간다.”</p><p>메두사가 빗을 머리 쪽으로 올렸다가 도로 내렸어요. 뱀들이 그 손을 피해 흩어졌지요.</p><p>“옛날에는 어머니가 이 빗으로 머리를 빗겨 줬다. 아침마다 한참씩.”</p><p>돌은 아무 말도 하지 않았어요.</p><p>“그때는 눈을 뜨고 다녀도 아무 일도 없었다. 사람들이 나를 보고 웃기도 했고.”</p><p>메두사는 빗을 무릎에 내려놓았어요. 그러고는 손바닥으로 그 작은 돌의 머리를 한 번 쓸었어요.</p><p>“왜 이렇게 됐는지는 나도 모른다. 어느 날 아침에 눈을 떴더니 이랬다.”</p><p>메두사가 갑자기 고개를 들었어요. 얼굴이 페르세우스가 있는 쪽으로 돌아왔지요. 눈은 천에 가려 있었는데도 페르세우스는 저도 모르게 방패를 내렸어요.</p><p>“거기 누구 있나?”</p><p>페르세우스는 숨을 멈췄어요. 손끝 하나 움직이지 않았지요. 그런데 바위 밑에서 작은 돌 하나가 저절로 굴러떨어졌어요.</p><p>메두사는 한참을 그쪽으로 얼굴을 두고 있었어요. 그러다 도로 고개를 돌렸어요.</p><p>“아무도 없구나.”</p><p>페르세우스는 방패를 조금 내렸어요. 방패 안이 비었어요. 소리는 계속 들렸지요.</p><p>“너도 나를 보러 왔다가 이렇게 됐지.” 메두사가 작은 돌에게 말했어요. “오지 말라고 말릴 방법이 없었다.”</p><p>한참 아무 소리도 나지 않았어요. 파도 소리도 나지 않는 데였어요. 그러다 메두사가 일어서는 기척이 났어요.</p><p>“이제 언니들한테 들어가자.”</p><p>메두사가 걸어 나가는 소리가 멀어졌어요. 아주 천천히요. 어디에도 서두를 데가 없는 걸음이었지요. 페르세우스는 자루를 만졌어요. 끈을 묶었다가 풀고 다시 묶었어요. 어머니가 마당에서 그렇게 하던 것과 똑같이요.</p><p>그날 밤 페르세우스는 잠을 자지 않았어요. 방패를 무릎에 올려놓고 앉아 있었지요. 방패 안에 뒤집힌 하늘이 들어 있었어요. 별이 아래쪽에 박혀 있는 하늘이요.</p><p>페르세우스는 그 안에서 자기 손을 찾아 보았어요. 오른손이 왼쪽에 있었어요. 어느 쪽이 진짜 자기 손인지 잠깐 헷갈렸지요.</p><h2>방패에 비친 얼굴</h2><p>새벽이 오기 바로 전이었어요. 바위 위에서 나던 소리가 그쳤어요. 아래에서도 그쳤고요. 돌밭 전체가 한꺼번에 조용해졌어요.</p><p>페르세우스는 신발을 신었어요. 끈을 두 번 조였지요. 그러고는 방패를 앞으로 돌리고 뒤로 걸었어요.</p><p>방패 안에서 돌밭이 다가왔어요. 뒤집힌 채로요. 페르세우스는 발뒤꿈치로 땅을 더듬으며 걸었어요. 발이 돌에 한 번 걸렸어요. 페르세우스는 멈췄다가 다시 걸었지요.</p><p>메두사는 그 작은 돌 옆에 누워 있었어요. 눈을 가린 천이 풀려 무릎 위에 떨어져 있었어요. 뱀들도 다 늘어져 있었지요. 빗은 손에 그대로 들려 있었고요.</p><p>페르세우스는 그 자리에 한참 서 있었어요. 방패 안에서 뱀 한 마리가 잠결에 몸을 뒤척였어요. 나머지는 다 늘어져 있었고요. 페르세우스는 자기 숨소리가 너무 크다고 생각했어요.</p><p>페르세우스는 굽은 칼을 뽑았어요. 방패를 든 팔이 떨렸어요. 페르세우스는 그 팔을 다른 손으로 한 번 눌렀어요. 그리고 팔을 놓았어요.</p><p>페르세우스는 방패에 비친 모습만 보면서 메두사의 머리를 베었어요.</p><p>그다음은 아주 빨랐어요. 그 자리에서 하얀 것이 솟아올랐어요. 말이었어요. 큰 날개가 등에 접혀 있다가 한 번에 펼쳐졌지요. 말은 몸을 한 번 털었어요. 물기라도 묻은 것처럼요. 그러고는 하늘로 올라갔어요.</p><p>말은 돌밭 위를 한 바퀴 돌았어요. 돌마다 그 그림자가 지나갔지요. 그러고는 페르세우스 쪽을 한 번 보았어요. 이윽고 북쪽으로 갔어요. 그 뒤로 오래도록 아무도 그 말을 붙잡지 못했어요. 사람들은 나중에 그 말을 페가수스라고 불렀지요.</p><p>페르세우스는 자루를 벌리고 눈을 감았어요. 감은 채로 손을 뻗었지요. 자루는 무거워지지 않았어요. 헤르메스가 말한 그대로였어요.</p><p>페르세우스는 자루 아가리를 두 손으로 오므려 묶었어요. 매듭을 두 번 지었지요. 그러고 나서야 눈을 떴어요.</p><p>돌밭은 아까와 똑같았어요. 팔을 든 돌도, 무릎을 꿇은 돌도, 청동판을 든 돌도 그대로 서 있었어요. 아무것도 달라지지 않았지요. 그런데 페르세우스는 그날 아침에 자기가 이겼다는 생각이 조금도 들지 않았어요.</p><p>빗은 그 자리에 그대로 두었어요. 바위 위에서 날개 치는 소리가 났어요. 하나가 아니라 둘이었어요.</p><p>“메두사.”</p><p>“메두사!”</p><p>두 번째 소리는 아주 컸어요. 페르세우스는 그 소리를 등으로 받았어요. 페르세우스는 자루를 두 손으로 움켜쥐고 땅을 찼어요. 발이 떨어졌어요. 뒤에서 바람이 몰려왔지요.</p><p>아래로 검은 물이 지나갔어요. 페르세우스는 자루를 가슴에 안고 날았어요. 자루는 여전히 가벼웠어요. 그 안에 무엇이 들었는지 손으로는 알 수가 없었지요.</p><p>날개 소리가 가까워졌다가 멀어지고, 다시 가까워졌어요. 한 번은 아주 가까웠어요. 페르세우스의 등 위로 바람이 훅 지나갔거든요. 페르세우스는 옆으로 몸을 기울여 물 가까이 내려갔어요.</p><p>해가 뜨는 쪽이 조금씩 밝아졌어요. 소리가 따라왔어요. 아주 오래 따라왔어요. 페르세우스는 그 밝은 쪽만 보고 날았어요.</p></article></noscript>
