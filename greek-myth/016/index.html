  <noscript><article class="ns-text"><h1>나뭇대 속에 숨긴 불씨</h1><h2>길고 긴 그해 겨울</h2><p>물통에 또 살얼음이 앉아 있었어요. 프로메테우스가 손등으로 그것을 눌렀어요. 얼음이 쩍 소리를 내며 갈라졌지요. 그 추위가 내려온 뒤로 겨울은 좀처럼 물러가지 않았어요. 낮이 자꾸 짧아졌어요. 해는 낮게 떴다가 금방 넘어갔지요.</p><p>프로메테우스는 그 겨울 내내 마을에 머물렀어요. 산으로 올라가지 않았어요. 사람들 사이에 섞여 앉아, 사람들이 하는 것을 하나하나 보았지요.</p><p>프로메테우스는 아는 것이 많은 사람이었어요. 그래서 할 수 있는 것은 다 해 보았어요. 담을 두 겹으로 쌓게 했어요. 바람이 들어오는 쪽에는 마른 갈대를 세워 막게 했지요. 땅을 파고 그 안에 마른 풀을 두툼하게 깔게 했어요. 밤에는 서로 붙어 자라고 했고요.</p><p>짐승 가죽을 여러 장 겹쳐 꿰매는 법도 알려 주었어요. 발에 마른 풀을 감고 그 위에 가죽을 대면 발가락이 덜 시리다는 것도요. 사람들은 하나하나 그대로 따라 했어요.</p><p>조금씩 나아지기는 했어요. 그런데 딱 조금씩이었어요. 저녁이 오면 사람들은 말을 하지 않게 되었어요. 입을 열면 그만큼 김이 빠져나가니까요. 어두워지면 아무것도 할 수 없었어요. 눈앞이 안 보이니 손도 놀릴 수 없었지요.</p><p>먹는 것도 그대로였어요. 뿌리는 딱딱했고, 열매는 얼어 있었어요. 사람들은 그것을 그냥 씹었어요. 아이들은 자주 배가 아팠고요. 아픈 아이를 안고 밤을 새우는 어른이 늘 한둘은 있었어요.</p><p>담 안쪽 구석에 아기를 안고 앉은 어머니가 있었어요. 그 어머니는 밤새 아기를 품 안에서 옮겨 가며 안았어요. 한쪽이 식으면 다른 쪽으로요. 프로메테우스는 그것을 여러 밤 보았어요.</p><p>그 겨울에 마을에서 웃는 사람을 본 기억이 프로메테우스에게는 없었어요. 어느 저녁, 프로메테우스 곁에 나이 많은 사람 하나가 앉았어요. 손등이 여기저기 갈라져 있었어요. 갈라진 자리마다 검붉게 앉은 자국이 있었지요.</p><p>“당신은 안 추운가 보오.”</p><p>그 사람이 물었어요. 프로메테우스는 대답하기 전에 잠깐 뜸을 들였어요.</p><p>“나는 춥지 않아요.”</p><p>“좋겠소.”</p><p>그 사람은 그 말만 하고 두 손을 겨드랑이에 넣었어요. 그러고는 한참 뒤에 이렇게 덧붙였어요.</p><p>“밤이 조금만 짧으면 좋겠는데.”</p><p>프로메테우스는 아무 말도 하지 못했어요. 밤을 짧게 해 줄 수는 없었으니까요. 프로메테우스는 그날 밤 잠을 자지 않았어요. 대신 마을 밖으로 나가 언덕에 앉았어요. 등 뒤로 담 안쪽이 조용했어요.</p><p>필요한 것이 무엇인지 프로메테우스는 알고 있었어요. 사실은 처음부터 알고 있었지요. 다만 그것을 어디에서 구하느냐가 문제였어요.</p><p>짐승들이 받은 것은 전부 몸에 붙은 것이었어요. 털도 발톱도 껍데기도, 다 자기 몸에서 자라난 것들이었지요. 그런데 사람에게는 그런 것을 붙여 줄 자리가 없었어요.</p><p>사람에게 있는 것은 손이었어요. 손은 무언가를 쥐게 되어 있었지요. 그러니 사람에게 줄 것은 몸에 붙는 것이 아니라, 손에 쥘 수 있는 것이어야 했어요. 그리고 한 사람이 쥐었다가 다른 사람에게 건넬 수 있는 것이어야 했고요. 그래야 하나로 여럿이 살 수 있으니까요.</p><p>세상에 그런 것이 하나 있었어요. 프로메테우스는 그것을 어디에서 보았는지도 정확히 알고 있었어요.</p><p>먼저 스스로 만들어 보려고도 했어요. 마른 나뭇가지 두 개를 맞대고 손바닥이 얼얼할 때까지 비볐지요. 밤새 비볐어요. 연기가 조금 나기는 했어요. 그런데 거기까지였어요.</p><p>돌 두 개를 세게 부딪쳐 보기도 했어요. 불똥이 튀었어요. 그 불똥은 마른 풀에 닿기도 전에 사라졌지요. 프로메테우스는 손등으로 이마를 문질렀어요.</p><p>불은 아직 사람의 것이 아니었어요. 신들의 화롯가와 님프들의 등불에만 있었지요. 티탄의 손으로 일으킨 불똥은 사람 손에 건네줄 만큼 오래 살아 있지 못했고요.</p><p>프로메테우스는 언덕에서 일어섰어요. 그리고 물가로 내려가 키가 큰 풀을 하나 베었어요.</p><p>그 풀은 줄기가 어른 팔뚝만큼 굵고 속이 텅 빈 나뭇대였어요. 안에는 마른 심이 솜처럼 차 있었지요. 그 심에는 이상한 성질이 있었어요. 불이 붙어도 확 타오르지 않고, 속으로만 아주 천천히 타 들어가거든요.</p><p>프로메테우스는 그 나뭇대를 손에 들고 무게를 재 보았어요. 한쪽 끝을 손톱으로 긁어 보고, 안쪽에 입김을 한 번 불어넣어 보았어요. 마른 심이 바스락 소리를 냈어요.</p><p>그러고는 산 쪽을 올려다보았어요. 산꼭대기에 희미한 빛이 걸려 있었어요.</p><h2>한밤중의 올림포스산</h2><p>그날 밤 올림포스산은 조용했어요. 잔치도 없었고 회의도 없었어요. 신들은 다 잠들어 있었어요. 기둥 사이로 바람만 지나다녔지요. 그런데 문 앞에 한 사람이 서 있었어요. 아테나였어요. 아테나는 원래 잠이 없는 쪽이었거든요.</p><p>프로메테우스가 올라오는 것을 아테나는 멀리서부터 보았어요. 그런데 아무도 부르지 않았어요. 소리를 지르지도 않았고요.</p><p>프로메테우스가 문 앞에 이르렀어요. 두 사람은 마주 섰어요. 한동안 아무도 먼저 입을 열지 않았지요.</p><p>“무엇을 가지러 왔지요?”</p><p>아테나가 물었어요.</p><p>“아무것도요.”</p><p>“그럼 손에 든 그것은 뭐지요?”</p><p>“물가에서 벤 풀이에요.”</p><p>아테나는 그 나뭇대를 한 번 보았어요. 그리고 프로메테우스의 얼굴을 보았어요. 아테나는 남의 말을 아주 오래 듣는 쪽이지요. 하지 않은 말까지도요.</p><p>“저 아래 사람들은 지금 어때요?”</p><p>“사람들이 몹시 춥습니다.”</p><p>“얼마나 추운데요?”</p><p>“울 힘도 없을 만큼요.”</p><p>아테나는 더 묻지 않았어요. 아테나는 아버지의 뜻을 아주 잘 아는 쪽이었어요. 무엇이 되고 무엇이 안 되는지, 이 산에서 아테나만큼 정확히 아는 이도 없었지요.</p><p>그런데 아테나는 몸을 돌려 산 아래쪽을 내려다보았어요. 오래오래 그러고 서 있었어요. 아래에는 볼 것이 아무것도 없었는데도요.</p><p>등을 돌려 보지 않으면, 프로메테우스가 지나가는 것을 못 본 것이 될까요? 그건 아테나도 대답할 수 없는 물음이었어요. 다만 아테나는 그 물음을 그날 밤 내내 안고 서 있었지요.</p><p>그 등 뒤로 프로메테우스가 지나갔어요. 대장간은 산 한쪽 끝에 있었어요. 문이 열려 있었고, 안쪽이 붉었어요. 밤인데도 아직 불이 살아 있었지요.</p><p>헤파이스토스는 여태 일하고 있었어요. 등을 돌린 채 모루 앞에 서서 쇠를 두드리고 있었어요. 쨍, 쨍. 그 소리에 맞춰 화덕 속 숯이 한 번씩 밝아졌지요.</p><p>화덕 가장자리에 숯 하나가 떨어져 있었어요. 다른 것들 틈에서 굴러 나와 혼자 붉게 익어 가는 작은 숯이었어요. 아무도 그것을 세어 두지 않았을 거예요.</p><p>프로메테우스는 문간에 서서 안을 들여다보았어요. 화덕 안쪽은 낮보다 밝았어요. 대장간이란 곳은 밤에도 낮인 데였거든요.</p><p>프로메테우스는 나뭇대를 들고 그 앞에 쭈그려 앉았어요. 그러고는 나뭇대 끝을 숯에 가만히 댔어요. 손이 조금 떨렸어요.</p><p>“불씨 하나만 가져가겠습니다.”</p><p>프로메테우스가 아주 작게 말했어요. 등을 돌린 사람에게 하는 말인지 자기한테 하는 말인지는 알 수 없었지요.</p><p>심에 불이 옮겨붙었어요. 소리도 없고 연기도 없었어요. 심은 아주 천천히, 안쪽으로만 붉어졌어요. 그때 망치 소리가 멈췄어요.</p><p>프로메테우스는 움직이지 않았어요. 헤파이스토스도 돌아보지 않았어요. 두 사람 다 그대로 있었어요. 화덕에서 숯이 한 번 사그락 소리를 냈어요.</p><p>프로메테우스는 자기 심장 뛰는 소리를 들었어요. 티탄에게도 심장이 있고, 그게 뛰는 소리가 이렇게 크다는 것을 그날 처음 알았지요.</p><p>그러고는 다시 망치 소리가 났어요. 쨍. 아까와 똑같은 소리였어요. 조금도 다르지 않았지요.</p><p>헤파이스토스는 끝내 돌아보지 않았어요. 산 아래로 밀려나 바닷가에서 자란 사람이라, 아무것도 못 가진 채 밤을 나는 마음을 알았던 걸까요. 그건 아무도 모르는 일이에요.</p><p>프로메테우스는 일어섰어요. 나뭇대를 옷 안쪽에 품고 대장간을 나왔어요. 문간을 넘으면서 프로메테우스는 잠깐 멈췄어요. 등 뒤에서 망치 소리가 계속 들렸어요. 프로메테우스는 뒤를 돌아보지 않았어요.</p><h2>품에 안고 내려간 길</h2><p>산길은 길었어요. 올라올 때보다 훨씬 길게 느껴졌지요. 프로메테우스는 걸음을 서두르지 않았어요. 빨리 걸으면 바람이 들어가고, 바람이 들어가면 심이 한꺼번에 타 버리거든요. 그러면 마을에 닿기도 전에 다 타고 재만 남을 테고요.</p><p>대신 자주 멈춰 섰어요. 멈춰서 나뭇대 끝을 들여다보았어요. 붉은 점 하나가 아주 작게 살아 있었어요. 그 점이 흐릿해지면 입을 대고 아주 약하게 숨을 불어넣었어요. 그러면 점이 다시 또렷해졌지요.</p><p>산허리에서 바람이 크게 한 번 불었어요. 나뭇대 안쪽에서 붉은 것이 확 밝아졌다가 훅 꺼질 듯 어두워졌어요. 프로메테우스는 몸을 돌려 등으로 바람을 막았어요.</p><p>그러고 한참을 그대로 서 있었어요. 바람이 다 지나갈 때까지요. 다시 들여다보았을 때 붉은 점은 아직 거기 있었어요. 아주 작았지만 있었어요.</p><p>“조금만 더 가면 돼.”</p><p>프로메테우스가 나뭇대에 대고 아주 작게 말했어요. 알아들을 리 없는 것한테요. 그런데 그 말을 하고 나니 걸음이 조금 가벼워졌어요.</p><p>밤이 깊어질수록 추위가 손끝을 파고들었어요. 그런데 옷 안쪽만 따뜻했어요. 나뭇대가 닿은 자리였지요. 그 따뜻한 것이 저 아래 사람들의 것이라고 생각하니 걸음이 자꾸 빨라지려고 했어요.</p><p>그때마다 프로메테우스는 걸음을 늦추었어요. 서두르면 잃으니까요. 산 아래로 내려올수록 바람이 잦아들었어요. 나뭇대 끝의 붉은 점은 점점 안쪽으로 물러나 있었어요. 심이 그만큼 타 들어갔다는 뜻이었지요. 시간이 넉넉하지 않았어요.</p><p>프로메테우스는 그 따뜻한 것을 품에 안고 밤새 내려갔어요. 하늘이 조금씩 옅어지고 있었어요.</p><h2>처음 켜진 불빛</h2><p>마을에 닿았을 때는 아직 어두웠어요. 사람들은 담 안에 모여 자고 있었어요. 프로메테우스는 마당 한가운데에 돌을 둥글게 놓았어요. 그 안에 마른 나뭇가지를 얹었지요. 굵은 것은 아래에, 가는 것은 위에요.</p><p>그리고 나뭇대를 기울여 붉은 심을 나뭇가지 위에 털어 놓았어요. 처음에는 아무 일도 없었어요. 프로메테우스는 몸을 낮추고 숨을 불었어요. 한 번, 두 번.</p><p>마른 가지 하나가 파삭 소리를 내더니 노랗게 일어섰어요. 불이었어요. 불은 금세 자랐어요. 얹어 둔 가지를 하나씩 받아 먹으면서요. 돌 안쪽이 붉어지고, 마당 흙 위로 그림자가 길게 뻗어 나갔어요.</p><p>담 안이 환해졌어요. 자고 있던 사람들이 하나둘 눈을 떴어요. 그리고 그 자리에서 굳었어요. 아직 잠이 덜 깬 얼굴로 그것을 보았지요.</p><p>아무도 소리를 내지 않았어요. 사람들은 천천히 일어나 그 둥근 돌 쪽으로 다가왔어요. 아이들이 어른들 사이로 고개를 내밀었어요.</p><p>얼굴이 하나씩 붉게 물들었어요. 손등이 따뜻해졌어요. 손등이 갈라져 있던 그 사람이 두 손을 앞으로 내밀고 오래 서 있었어요. 아무 말도 하지 않았어요.</p><p>“뜨거워요!”</p><p>한 아이가 손을 얼른 뺐어요. 사람들이 웃었어요. 그 겨울에 처음 나온 웃음소리였지요. 사람들은 그날 아침 아무도 일을 하러 가지 않았어요. 그냥 그 둘레에 앉아 있었어요. 손을 뻗었다가 오므리고, 다시 뻗었다가 오므리면서요.</p><p>프로메테우스가 사람들에게 몇 가지를 알려 주었어요. 불은 먹어야 산다고요. 마른 가지를 계속 넣어 주어야 한다고요. 젖은 것을 넣으면 연기만 나고 힘을 잃는다고요. 그리고 불은 담을 넘어가면 안 되니까 반드시 돌로 둘러 두라고요.</p><p>“꺼뜨리지 마세요. 한 번 꺼지면 다시 얻기가 아주 어려워요.”</p><p>프로메테우스가 말했어요. 사람들은 알아들었어요. 그날부터 사람들은 밤에 돌아가며 불 옆에 앉았어요. 잠든 사람 몫까지 누군가는 깨어 있었지요.</p><p>그날 저녁, 옆 마을 사람이 나뭇가지 하나에 불을 붙여 갔어요. 그 사람은 그것을 두 손으로 감싸고 들판을 가로질러 뛰었어요. 바람이 불면 몸을 돌려 막았지요. 프로메테우스가 산길에서 하던 것과 똑같이요. 배운 것도 아닌데 그렇게 되더래요.</p><p>그다음 날에는 그 옆 마을이었어요. 그다음 날에는 강 건너였고요. 강을 건널 때는 뗏목 한가운데에 흙을 깔고 그 위에 불을 얹었대요.</p><p>불은 그렇게 옮겨 갔어요. 사람에게서 사람에게로요. 이레쯤 지나자 이 골짜기에서 저 골짜기까지 불이 닿았어요. 열흘쯤 지나자 산 너머 마을에도 닿았고요.</p><p>그 밤에 땅 위는 처음으로 어둡지 않았어요. 밥이 익는 냄새가 났어요. 얼었던 뿌리가 부드러워졌어요. 딱딱하던 것이 물러지니 아이들도 먹을 수 있게 되었지요. 배가 아프다는 아이가 눈에 띄게 줄었어요.</p><p>사람들은 어두워진 뒤에도 손을 놀렸어요. 불빛 옆에서 가죽을 꿰매고, 돌을 갈고, 이야기를 했어요.</p><p>이야기라는 것이 그때 생겼어요. 낮에는 다들 바빠서 말할 틈이 없었거든요. 어두운데 잠은 안 오고 앞에 불이 있으니, 사람들은 자꾸 무슨 말인가를 하게 되었지요. 그때 처음 나온 이야기 가운데 몇은 아주 오래 살아남았어요.</p><p>아이들이 늦게까지 잠들지 않았어요. 불이 재미있었거든요. 불꽃이 흔들리는 것을 턱을 괴고 들여다보다가, 그대로 곯아떨어지는 아이도 있었어요.</p><p>그 무렵 올림포스산에서는 제우스가 늦게까지 깨어 있었어요. 제우스는 밤이면 산 끝에 나가 아래를 내려다보는 버릇이 있었어요. 왕좌에 처음 앉던 저녁부터 생긴 버릇이었지요.</p><p>아래는 늘 캄캄했어요. 강이 어디쯤인지, 들판이 어디쯤인지 짐작으로만 알 뿐이었어요. 밤의 땅은 그냥 커다랗고 검은 덩어리였고요.</p><p>그런데 그날은 달랐어요. 어둠 속에 점이 하나 있었어요. 아주 작고 노란 점이었어요. 제우스는 눈을 가늘게 떴어요.</p><p>그 옆에 또 하나가 있었어요. 조금 떨어진 곳에 또 하나, 강 건너에 또 하나가요. 저 멀리 바닷가 쪽에도 두엇이 보였어요.</p><p>점들은 깜빡이고 있었어요. 살아 있는 것처럼요. 바람이 지나갈 때마다 몸을 눕혔다가 다시 일어섰어요.</p><p>제우스는 그것이 무엇인지 곧바로 알았어요. 저 빛은 저 아래에서 저절로 생겨날 수 있는 것이 아니었으니까요. 세상에 저런 빛이 있는 자리는 딱 한 군데였고, 그 자리는 제우스의 등 뒤에 있었지요.</p><p>제우스는 그 자리에 오래 서 있었어요. 아무 말도 하지 않았어요. 다만 그 얼굴이 천천히 굳었어요.</p></article></noscript>
