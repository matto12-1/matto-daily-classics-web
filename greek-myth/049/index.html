  <noscript><article class="ns-text"><h1>저승의 개</h1><h2>삿대를 들여놓은 사공</h2><p>사공이 삿대를 배 안으로 들여놓았어요. 그러고는 뱃머리를 돌려 저쪽으로 밀어 갔어요. 강 한가운데까지 가서 멈추고, 거기서 이쪽을 보았지요.</p><p>스틱스강이었어요. 물빛이 없었어요. 검지도 않고 푸르지도 않고, 그냥 빛깔이라는 것이 없었지요. 물소리도 나지 않았고요.</p><p>헤라클레스는 물에 손을 넣어 보았어요. 차갑지도 미지근하지도 않았어요. 손을 빼니 손등이 젖어 있지도 않았지요.</p><p>강가에는 사람들이 줄을 서 있었어요. 줄은 강을 따라 길게 이어져서 끝이 보이지 않았지요. 다들 조용했어요. 헤라클레스만 줄에서 벗어나 물가에 서 있었지요. 헤라클레스가 선 자리에만 발자국이 남았거든요.</p><p>“저 한 사람만 건너편으로 태워 주십시오!” 헤라클레스가 소리쳤어요.</p><p>사공은 대답하지 않았어요. 줄에 선 사람들은 헤라클레스를 보지 않았어요. 여기까지 온 사람들은 옆을 잘 보지 않거든요.</p><p>헤라클레스는 그 자리에 그대로 있었어요. 하루가 지났어요. 이틀이 지났고요. 줄은 계속 줄어들었어요. 사공은 배가 빌 때마다 돌아와 사람들을 실어 갔지만, 헤라클레스 앞에서는 그때마다 삿대를 들여놓았지요.</p><p>사흘째 저녁에 사공이 배를 물가에 댔어요. 이번에는 삿대를 들여놓지 않았지요.</p><p>“발자국이 나는 산 사람은 안 태운다.”</p><p>“산 사람은 안 태우시는 줄 압니다.”</p><p>“그런데도 사흘을 서 있었구나.”</p><p>“태워 주실 때까지 나흘이고 더 서 있을 겁니다.”</p><p>사공은 삿대를 물에 꽂았어요. 그러고는 턱으로 배 안을 가리켰지요. 타라는 뜻이었어요.</p><p>헤라클레스가 배에 오르자 뱃전이 물에 닿을 만큼 내려앉았어요. 사공은 아무 말도 하지 않고 삿대를 밀었어요. 삿대가 물에 들어갈 때마다 배가 조금씩 더 내려앉는 것 같았지요. 건너가는 동안 사공은 딱 한마디를 했어요.</p><p>“돌아올 때도 살아서 그 무게 그대로면 태워 주마.”</p><h2>빈손으로 온 사람</h2><p>문 앞에 개가 엎드려 있었어요. 머리가 셋이었지요. 케르베로스였어요. 개는 헤라클레스를 보고도 일어나지 않았어요. 들어가는 사람은 막지 않았거든요. 가운데 머리가 코를 한 번 킁 하고 들이켰을 뿐이었어요. 헤라클레스는 그 옆을 지나갔어요.</p><p>문 안쪽은 넓었어요. 그리고 조용했어요. 아주 오래전에 이 나라를 처음 받은 이가 여기는 너무 조용하다고 했다는데, 그 뒤로도 조용하기는 마찬가지였지요. 발소리가 나면 그 소리가 어디까지 가는지 알 수 없을 만큼 넓었어요.</p><p>하데스는 안쪽에 앉아 있었어요. 검은 머리를 곧게 빗어 넘기고 잿빛 망토를 무릎까지 덮고 있었지요. 헤라클레스가 들어오는 것을 처음부터 보고 있었어요.</p><p>“산 사람이 제 발로 걸어 들어온 것이 이번이 세 번째다.”</p><p>헤라클레스는 한쪽 무릎을 꿇었어요. 사자 가죽 자락이 바닥에 끌렸지요.</p><p>“문 앞의 개를 미케네로 데려가야 합니다.”</p><p>하데스는 곧바로 대답하지 않았어요. 한참 헤라클레스를 내려다보다가 다른 것을 먼저 꺼냈지요.</p><p>“여기 노래를 들고 온 사람이 있었다. 오르페우스라고 했지. 너는 무엇을 들고 왔느냐?”</p><p>“아무것도 안 들고 왔습니다.”</p><p>“그러면 무엇으로 개를 데려가려느냐?”</p><p>“이 두 손으로 데려가겠습니다.”</p><p>그 말에 방 안이 잠깐 조용해졌어요. 하데스 뒤쪽 어둠 속에서 무엇인가 움직이는 기척이 났고요. 여기서는 그런 기척이 늘 있었지요.</p><p>하데스는 자리에서 일어났어요. 그러고는 문 쪽을 한 번 보았어요. 거기서 개가 엎드린 등이 보였지요.</p><p>“케르베로스를 데려가라. 조건이 셋이다. 쇠붙이를 대지 마라. 다치게 하지 마라. 그리고 도로 데려다 놓아라.”</p><p>“그러겠습니다.”</p><p>“세 번째 조건이 제일 어려울 거다.”</p><p>헤라클레스는 그 말뜻을 그때는 몰랐어요. 데려오는 것이 어렵지 도로 데려다 놓는 것이야 뭐가 어렵겠나 싶었거든요.</p><p>헤라클레스는 활과 화살통을 풀어 바닥에 놓았어요. 허리에 찬 것도 다 풀었고요. 몽둥이는 세상 끝에서 이미 부러졌지요. 남은 것은 사자 가죽 하나였어요. 하데스는 그것을 보고도 아무 말 하지 않았어요. 그건 쇠붙이가 아니었으니까요.</p><p>하데스가 문 쪽으로 걸어가다가 멈췄어요.</p><p>“여기 있는 이들 사이를 지나가게 된다. 네 집 사람들도 여기 있다. 그들을 볼 테냐?”</p><p>헤라클레스는 대답하지 않았어요.</p><p>“네가 찾으려 들면 찾을 수 있다.”</p><p>“찾을 수 있더라도 안 보겠습니다.”</p><p>헤라클레스는 그렇게 말하고 눈을 아래로 두었어요. 문까지 가는 동안 한 번도 위를 보지 않았지요. 하데스도 그 뒤로는 아무 말 하지 않았고요. 다만 헤라클레스가 문간을 나설 때까지 그 자리에 서 있었어요.</p><h2>문 앞의 세 머리</h2><p>나가는 쪽에서 보면 개는 아주 달랐어요. 들어올 때는 엎드려 있던 것이, 문 안쪽에서 보니 세 머리가 다 일어나 있었어요. 목덜미의 갈기가 검은 연기처럼 일렁였고요. 눈이 여섯 개였는데 여섯 개가 다 호박빛이었어요.</p><p>“이제 너를 붙잡으러 간다.”</p><p>헤라클레스가 그렇게 말했어요. 대답할 사람이 없는데도요. 소리를 한 번 내야 발이 떨어졌거든요. 처음에는 가운데 머리를 잡았어요. 두 팔로 목을 감았지요. 그런데 나머지 두 머리가 옆으로 돌아 들어왔어요. 헤라클레스는 손을 놓고 물러났어요.</p><p>두 번째에는 옆에서 들어갔어요. 왼쪽 머리를 눌렀는데, 이번에는 가운데와 오른쪽이 한꺼번에 왔어요. 세 번째에는 뒤로 돌아갔어요. 개가 몸을 통째로 돌렸어요. 머리가 셋이라 뒤라는 것이 없었지요.</p><p>헤라클레스는 벽에 등을 대고 앉았어요. 어깨가 오르내렸어요. 팔뚝에 이 자국이 줄지어 나 있었지요. 그 개는 무는 것보다 미는 것이 셌거든요.</p><p>“머리 셋을 한꺼번에는 못 잡는다.”</p><p>그렇게 말하고 나서 헤라클레스는 자기가 한 말을 다시 들여다보았어요. 셋을 한꺼번에 못 잡으면, 셋이 한꺼번에 모이게 하면 되는 거였어요.</p><p>헤라클레스는 사자 가죽을 벗어 머리부터 뒤집어썼어요. 앞발 두 개를 가슴 앞에서 묶고, 남은 자락으로 두 팔을 감았지요. 화살도 칼도 들어가지 않는 가죽이었어요. 그러고는 두 팔을 벌리고 걸어 들어갔어요.</p><p>세 머리가 한꺼번에 물었어요. 어깨와 팔과 등을요. 이가 가죽 위에서 미끄러졌어요. 개는 놓았다가 다시 물었어요. 다시 미끄러졌고요. 무는 동안 세 머리가 다 같은 자리에 있었어요. 헤라클레스한테 붙어 있었으니까요.</p><p>헤라클레스는 두 팔을 벌려 세 목이 하나로 모이는 자리를 안았어요. 그러고는 조였어요. 세게가 아니라, 놓지 않을 만큼만요.</p><p>그러고 나서 세었어요. 백까지 세었어요. 백까지 세는 동안 개는 몸을 여섯 번 틀었어요. 여섯 번째가 제일 약했지요.</p><p>백 다음에 헤라클레스는 다시 백까지 세었어요. 그 사이에 개가 몸을 뉘었어요. 헤라클레스는 팔을 풀었어요. 개는 일어나지 않았어요. 숨만 크게 쉬었지요. 세 머리가 다 같은 박자로 쉬었어요.</p><p>가운데 머리가 고개를 조금 들었어요. 그러고는 헤라클레스의 손등에 코를 대었어요. 처음 오는 사람에게 늘 하던 것이었어요.</p><p>헤라클레스는 그 손을 그대로 두었어요. 한참 뒤에 헤라클레스는 그 개의 목덜미를 손바닥으로 눌러 보았어요. 갈기가 연기처럼 손가락 사이로 새어 나갔지요. 그런데 손에 닿는 데는 따뜻했어요.</p><p>나가는 길은 들어온 길보다 길었어요. 개가 자꾸 멈췄거든요. 사공은 약속대로 태워 주었어요. 배가 물에 닿을 만큼 내려앉았지요. 사공은 머리가 셋인 것을 보고도 아무 말 하지 않았어요. 여기서는 놀랄 일이 별로 없었거든요.</p><p>마지막 오르막에서 개가 발을 붙이고 서서 움직이지 않았어요. 위쪽이 밝았거든요. 그 개는 밝은 데를 본 적이 없었어요.</p><p>헤라클레스는 사자 가죽을 벗어 개의 세 머리를 덮었어요. 그러고는 목덜미를 잡고 천천히 걸었어요. 가죽 밑에서 개가 떨었어요.</p><p>밖으로 나오자 개는 눈을 감고 있었어요. 한참 뒤에 가운데 머리가 먼저 눈을 떴어요. 그다음에 왼쪽, 그다음에 오른쪽이요. 세 머리가 다 눈을 뜨는 데 한나절이 걸렸지요.</p><p>미케네까지 가는 동안 지나는 마을이 다 비었어요. 사람들이 문을 걸고 지붕 위로 올라갔지요. 길가에 내놓은 물동이가 그대로 있었어요. 헤라클레스는 그것을 건드리지 않고 지나갔고요. 왕의 말을 대신 전하는 사람이 길에서 헤라클레스를 만났어요.</p><p>“그, 그건 개가 아닌데요.”</p><p>그 사람은 그 말만 하고 돌아서서 성 쪽으로 뛰어갔어요. 뒤도 안 돌아보았고요.</p><p>개는 그동안 아무것도 먹지 않았어요. 물도 안 마셨고요. 나흘째에 헤라클레스가 빵을 떼어 손바닥에 놓아 주자 가운데 머리가 그것을 받아먹었어요. 나머지 두 머리는 그것을 보고만 있었지요.</p><h2>항아리에서 나온 셈</h2><p>큰 방 문이 열렸어요. 헤라클레스는 개를 문간에 세워 두고 혼자 들어갔어요. 가죽끈으로 꼰 목줄을 손에 쥐고 있었지요. 왕좌는 비어 있었어요. 청동 항아리 뚜껑이 꼭 닫혀 있었고요.</p><p>방 안에 사람이 여럿 있었는데 다들 벽 쪽에 붙어 있었어요. 문간 쪽을 보는 사람은 하나도 없었지요.</p><p>“저승 문 앞의 개를 데려왔습니다.”</p><p>항아리 안에서는 아무 소리도 나지 않았어요. 그때 문간에서 개가 짖었어요. 세 머리가 한꺼번에 짖었어요. 큰 방 벽이 울렸고, 벽에 걸려 있던 낡은 짐승 가죽이 떨어졌지요.</p><p>항아리가 흔들렸어요. 안에서 소리가 났어요.</p><p>“그 개를 도로 데려가라. 도로 데려가!”</p><p>“그러겠습니다. 그 전에 제 일을 몇 개로 셈하셨는지 여쭙겠습니다.”</p><p>방 안이 조용해졌어요. 왕의 말을 대신 전하는 사람이 나무판을 들고 왔어요. 그 사람은 그날 아침에 그것을 다 적어 두었어요. 쪽지에 그렇게 적혀 있었으니까요.</p><p>“나무판에 적은 것을 읽어라.” 항아리 안에서 그렇게 말했어요.</p><p>그 사람이 읽었어요. 사자, 사슴, 멧돼지, 새 떼, 외양간, 황소, 말 떼, 띠, 붉은 소 떼, 황금 사과, 그리고 문 앞의 개요.</p><p>열하나였어요. 헤라클레스는 그 열하나를 속으로 따라 세어 보았어요. 빠진 것은 하나도 없었어요. 다만 하나가 더 있어야 했지요.</p><p>“늪에서 한 일은 왜 빠졌습니까?” 헤라클레스가 물었어요.</p><p>항아리 안에서 한참 소리가 없었어요. 뚜껑이 손가락 하나만큼 열렸다가 도로 닫혔지요.</p><p>“늪의 일도 적어라.”</p><p>그 사람이 나무판 맨 위에 한 줄을 더 적었어요. 늪의 것이요. 그러고는 세었어요.</p><p>“모두 열둘입니다.”</p><p>방 안에서 누가 숨을 크게 내쉬었어요. 그 소리가 다 들릴 만큼 조용했거든요. 헤라클레스는 나무판을 보지 않았어요. 항아리를 보고 있었어요. 왕은 그 안에 있었고, 나오지 않았어요. 여러 해 동안 한 번도 제대로 나온 적이 없었지요.</p><p>나무판이 헤라클레스 앞으로 넘어왔어요. 헤라클레스는 그것을 받지 않았어요. 손을 뻗다가 도로 내렸지요.</p><p>방 안 사람들이 하나둘 벽에서 떨어졌어요. 헤라클레스는 열둘이 적힌 나무판을 한참 보고 서 있었어요. 테베 집 마당에서 있었던 일은 안개가 한 일이었지요.</p><p>헤라클레스는 돌아서서 문간으로 걸어갔어요. 절도 인사도 하지 않았고요. 문간을 나서면서 손바닥을 옷에 문질렀어요. 여러 번 문질렀어요. 무엇이 묻어 있는 것도 아니었는데요.</p><p>개는 목줄을 잡는 손을 한 번 올려다보았어요. 그 손은 아까보다 조금 느리게 움직였지요.</p><h2>도로 데려다 놓는 일</h2><p>저승 문으로 가는 길에는 아무도 없었어요. 소문이 앞질러 갔거든요. 마을마다 문이 닫혀 있었지요. 사공은 이번에도 태워 주었어요. 배가 내려앉는 것을 보고 사공이 처음으로 웃었어요.</p><p>“아직 산 사람의 무게 그대로구나.”</p><p>문 앞에서 헤라클레스는 목줄을 풀었어요. 개는 바로 들어가지 않았어요. 한참 서 있다가 세 머리가 다 뒤를 돌아보았지요.</p><p>“이제 네 자리로 들어가.”</p><p>개는 문 안으로 들어가 늘 엎드리던 자리에 엎드렸어요. 그러고는 밖을 보았어요. 헤라클레스는 목줄을 손에 든 채로 서 있었어요. 그러고는 그것을 문 옆 바위 위에 올려놓았지요.</p><p>하데스가 문 안쪽에 서 있었어요. 헤라클레스가 온 것을 알고 나와 있었던 거예요.</p><p>“개를 도로 데려다 놓으라는 세 번째 조건을 지켰구나.”</p><p>“그러겠다고 약속했으니까요.”</p><p>“여기 오는 이들은 대개 약속을 하고 온다. 지키는 쪽은 드물지.” 하데스가 말했어요. “다음에 올 때는 줄을 서라.”</p><p>헤라클레스는 그 말에 웃지 않았어요. 하데스도 웃지 않았고요. 저승에서는 그런 말도 그냥 해 보는 말이 아니었거든요.</p><p>헤라클레스는 고개를 숙이고 오르막을 올라갔어요. 뒤에서 문이 닫히는 소리는 나지 않았어요. 그 문에는 닫는 문짝이 없었거든요.</p><p>그 뒤로도 헤라클레스는 오래 살았어요. 여기저기 불려 다녔고, 무거운 것을 옮겼고, 남의 싸움에 끼어들었지요. 힘든 일이 생기면 사람들은 그 이름을 먼저 떠올렸어요. 어떤 마을에서는 그 이름을 아이에게 붙이기도 했고요.</p><p>그런데 마당에 과녁을 다시 세운 적은 한 번도 없었어요. 활은 계속 썼어요. 다만 과녁에 대고 쏘지는 않았지요.</p><p>오랜 세월이 흐른 뒤에 헤라클레스는 신들 곁으로 올라갔어요. 올라가는 길은 여태 걸은 길 가운데 제일 짧았지요. 산길도 아니고 뱃길도 아니었어요. 어느 날 아침에 눈을 뜨니 발밑이 구름이었거든요.</p><p>올림포스산 문 앞에 신들이 나와 있었어요. 제우스가 앞으로 나와 헤라클레스의 어깨를 잡았어요. 아무 말도 하지 않았어요. 대신 그 손을 오래 얹고 있었지요. 열두 번 가운데 한 번도 아래로 내려온 적이 없는 손이었어요.</p><p>신들 뒤쪽에 헤라가 서 있었어요. 사자 가죽도 몽둥이도 없는 사람이 문 앞에 서 있는 것을 헤라는 오래 보았어요.</p><p>헤라클레스는 그쪽으로 걸어갔어요. 걸어가서 섰어요. 무슨 말을 하려고 간 것은 아니었어요. 그냥 거기 서 있는 것이 맞는 것 같았거든요. 신들이 다 그쪽을 보았어요. 아무도 사이에 끼어들지 않았고요.</p><p>헤라가 고개를 끄덕였어요. 아주 조금이었지만 끄덕인 것이 맞았어요. 처음이었어요.</p><p>“그 셈은 내가 세었다.”</p><p>헤라클레스는 무슨 뜻인지 물으려고 입을 열었어요. 헤라는 벌써 돌아선 뒤였고요. 어깨에 꽂힌 공작 깃털이 한 번 흔들렸어요.</p></article></noscript>
