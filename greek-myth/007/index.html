  <noscript><article class="ns-text"><h1>세상에서 가장 무서운 것</h1><h2>땅이 낳은 마지막 아이</h2><p>제우스는 왕좌 앞에서 걸음을 멈췄어요. 그러고는 그냥 지나갔어요. 그 앞을 지날 때마다 그랬어요. 아버지가 앉아 있던 자리가 자꾸 겹쳐 보였거든요. 형제들이 왜 앉지 않느냐고 물으면 제우스는 아직 이르다고만 대답했어요.</p><p>잔치가 끝나고 세상은 조금씩 제자리를 찾아가는 중이었어요. 갈라진 들판이 메워졌어요. 강물이 다시 제 길을 찾았고, 무너졌던 산비탈에 풀이 돋았어요. 짐승들이 숲에서 나와 물가로 내려왔지요. 올림포스산 위에는 하얀 기둥이 하나씩 세워졌어요. 신들이 저마다 자리를 잡기 시작한 거예요.</p><p>왕좌만 그대로 비어 있었어요. 아침이면 그 위에 밤새 앉은 이슬이 반짝였지요. 제우스는 밤이면 산꼭대기에 앉아 아래를 오래 내려다보았어요. 이제 평화가 왔다고, 다들 그렇게 생각했어요.</p><p>그런데 평화롭지 않은 곳이 한 군데 있었어요. 땅 아래였어요.</p><p>가이아는 그 무렵 아무하고도 말을 하지 않았어요. 골짜기에 앉아 발밑만 오래 내려다보았지요. 그 아래에는 자기 아들이 있었어요. 그 옆에는 자기가 낳은 티탄들이 있었고요. 아주 오래전에는 거기에 다른 아이들도 갇혀 있었어요.</p><p>가이아는 그 자리에 세 번째로 아이들이 갇히는 것을 보고 있었어요. 가이아가 무슨 생각을 하고 있는지는 아무도 몰랐어요.</p><p>어느 날 밤, 가이아가 자리에서 일어섰어요. 가이아는 세상에서 가장 깊은 곳으로 내려갔어요. 그곳은 불이 흐르는 자리였어요. 땅속 아주 밑바닥에는 붉게 녹은 것이 강처럼 흐르고 있었거든요. 가이아는 그 앞에 오래 서 있었어요.</p><p>불빛이 가이아의 얼굴을 붉게 비췄어요.</p><p>“나는 내 아이들이 땅속에 갇히는 일을 세 번 보았다.”</p><p>가이아가 혼잣말을 했어요. 목소리가 낮게 울렸어요.</p><p>“하늘이 아이들을 가두었고, 그 아이가 또 아이들을 가두었고, 이제 그 아이의 아이가 다시 가두는구나.”</p><p>가이아는 두 손을 불 속에 넣었어요. 그리고 무언가를 끌어올렸어요. 가이아는 아무에게도 알리지 않았어요. 하늘 위의 신들도, 땅 위의 짐승들도 몰랐지요.</p><p>그날 밤 세상에서 가장 무서운 것이 태어났어요. 이름은 티폰이었어요. 가이아가 낳은 마지막 아이였지요.</p><p>그날 밤 세상의 모든 짐승이 한꺼번에 울었어요.</p><p>티폰이 태어나던 순간 땅이 크게 한 번 들썩였어요. 그 진동이 세상 끝까지 갔어요. 서쪽 끝에서 하늘을 떠받치고 있던 아틀라스도 그 흔들림을 느꼈어요. 무슨 일이 일어났는지는 몰랐지만, 어깨 위 별들이 한꺼번에 떨렸거든요.</p><p>가이아는 자기가 만든 것을 올려다보았어요. 그러고는 뒤로 몇 걸음 물러섰어요. 어머니가 자기 아이 앞에서 물러선 것은 그때가 처음이었어요.</p><p>티폰이 어떻게 생겼는지 이야기해 볼게요. 한 번 들으면 좀처럼 잊히지 않는 모습이었거든요. 티폰은 산보다 컸어요. 머리가 구름에 닿았고, 두 팔을 벌리면 세상의 동쪽 끝과 서쪽 끝에 닿았어요.</p><p>머리에서는 검은 연기가 갈기처럼 흘러내렸어요. 그 연기는 가만히 있지 않고 늘 꿈틀거렸어요. 눈은 다 타지 않은 숯처럼 붉게 이글거렸고요. 다리 대신에는 커다란 뱀이 여러 마리 똬리를 틀고 있었어요. 걸을 때마다 그 뱀들이 서로 미끄러지며 쉭쉭 소리를 냈지요.</p><p>그 뱀들은 저마다 눈이 있어서 사방을 한꺼번에 볼 수 있었어요. 티폰이 지나간 자리에는 풀 한 포기 남지 않았지요.</p><p>티폰이 숨을 한 번 내쉬면 그 앞에 있던 숲이 통째로 눕고, 다시 들이쉬면 구름이 빨려 들어갔어요. 티폰이 처음 낸 소리는 울음도 아니고 웃음도 아니었어요. 온 세상의 폭풍이 한꺼번에 몰아치는 소리였어요.</p><p>바람이 갑자기 방향을 잃고 이리저리 휘몰아쳤어요. 그 소리는 하루 종일 그치지 않았어요. 그 소리를 듣고 짐승들이 굴 안쪽으로 파고들었어요. 새들은 날다가 방향을 잃고 땅으로 내려앉았어요. 바다에서는 배가 저절로 항구로 밀려들었어요.</p><p>티폰은 잠깐 서서 사방을 둘러보았어요. 그러고는 북쪽으로 몸을 돌렸어요. 거기에 올림포스산이 있었거든요.</p><p>티폰이 걸어오기 시작했어요. 그 걸음은 빠르지 않았어요. 그런데 한 걸음이 워낙 커서, 느린데도 금세 가까워졌어요. 뱀 다리가 지나간 자리마다 흙이 뒤집혔어요. 강물이 밀려나 물길이 바뀌었어요.</p><p>먼저 소리가 왔어요. 올림포스산에서는 아직 아무것도 보이지 않았는데 소리가 먼저 도착했어요. 기둥이 흔들렸어요. 상 위에 놓인 잔이 저절로 굴러떨어졌어요. 신들이 하나둘 밖으로 나왔어요.</p><p>“이게 무슨 소리지?”</p><p>아무도 대답하지 못했어요. 그런 소리를 들어 본 이가 없었거든요. 그다음에 하늘이 어두워졌어요. 낮인데 밤처럼 캄캄해졌어요. 해가 사라진 게 아니었어요. 티폰의 머리에서 흘러나온 연기가 하늘을 다 덮어 버린 거예요.</p><p>마지막으로 티폰이 보였어요. 산꼭대기에서 내려다보니 그것의 어깨가 구름 위로 솟아 있었어요. 연기 냄새가 코를 찔렀고 눈이 따가웠어요.</p><p>신들은 산꼭대기에 서서 그것을 보았어요. 아무도 말을 하지 않았어요. 열 해 동안 티탄들과 싸운 이들이었어요. 바위가 하늘을 덮는 것도 보았고, 번개가 세상을 하얗게 만드는 것도 보았지요. 그런데 지금 저 아래에서 올라오고 있는 것은, 그 어느 것과도 달랐어요.</p><p>신들은 서로를 돌아보았어요. 누구도 무기를 집으러 가지 않았어요. 누군가 뒷걸음질을 치자 다른 이도 따라 물러섰어요.</p><p>누군가 아주 작게 말했어요.</p><p>“저건 못 이겨.”</p><p>그 말이 신호였던 것처럼, 신들이 흩어지기 시작했어요. 어떤 이는 남쪽으로 달아났어요. 어떤 이는 바다로 뛰어들었어요. 어떤 이는 새가 되어 날아갔고, 어떤 이는 짐승이 되어 갈대밭으로 숨었어요. 아주 먼 남쪽 나라까지 도망친 이들도 있었지요.</p><p>무서운 것을 보고 무섭다고 느끼는 건 잘못이 아니지요. 다만 그날 올림포스산은 순식간에 텅 비었어요.</p><p>달아나는 발소리가 한동안 이어졌어요. 제우스는 아무도 붙잡지 않았어요. 기둥 사이로 바람만 지나다녔어요. 잔치 때 걸어 둔 천 조각이 아직 매달려 펄럭이고 있었어요.</p><p>그 빈 산꼭대기에 한 사람이 남아 있었어요. 제우스였어요. 제우스는 그 천이 펄럭이는 소리를 오래 들었어요.</p><p>등줄기가 서늘했어요. 손끝이 저렸고요. 아래에서 올라오는 저것이 무엇인지, 자기가 이길 수 있는지 아무것도 알 수 없었으니까요.</p><p>그런데 제우스는 한 가지를 생각했어요. 여기서 내가 물러나면 저것은 그대로 아래로 내려갈 거예요. 아래에는 들판이 있고, 강이 있고, 이제 막 다시 자라기 시작한 것들이 있었어요.</p><p>제우스는 숨을 길게 한 번 내쉬었어요. 손에 쥔 번개가 파랗게 깜빡였어요. 제우스는 왕좌 쪽을 한 번 돌아보았어요. 여전히 비어 있었지요.</p><h2>혼자 남은 신</h2><p>제우스는 산 아래로 걸어 내려갔어요. 산길에 굴러떨어진 돌들이 발밑에서 자꾸 미끄러졌어요. 제우스는 한 번도 뒤를 돌아보지 않았어요.</p><p>올라오는 것과 내려가는 것이 산허리에서 만났어요.</p><p>티폰이 걸음을 멈췄어요. 가까이서 보니 그것은 산보다도 더 컸어요. 고개를 한껏 젖혀야 겨우 얼굴이 보였지요. 붉은 눈이 한 번 깜빡이더니 제우스를 내려다보았어요. 산만 한 것이 사람만 한 것을 내려다보는 모습이었지요.</p><p>제우스는 고개를 들어 그 붉은 눈을 똑바로 마주 보았어요.</p><p>“다른 신들은 다 달아나고 너 하나만 남았느냐?”</p><p>티폰의 목소리는 말이라기보다 천둥에 가까웠어요. 한마디를 할 때마다 돌이 굴러떨어졌어요.</p><p>“그런 것 같네.”</p><p>“다들 달아났는데 너는 왜 남았지?”</p><p>제우스는 잠깐 생각했어요. 그리고 솔직하게 말했어요.</p><p>“나도 도망가고 싶어. 그런데 내 뒤에 있는 들판과 강은 다리가 없어서 달아날 수가 없거든.”</p><p>티폰은 그 대답이 뜻밖이었는지 잠깐 아무 말도 하지 않았어요. 그러고는 알아들었는지 못 알아들었는지, 다시 몸을 일으켰어요. 검은 연기가 하늘을 한 번 더 덮었어요.</p><p>제우스가 번개를 들어 올렸어요. 손바닥이 뜨거웠어요. 쥐는 건 쉽고 내려놓기는 어렵다던 그 말이 또 떠올랐어요. 오늘은 내려놓을 생각이 없었지요.</p><p>제우스가 팔을 뒤로 젖혔어요. 그리고 세상에서 가장 큰 싸움이 시작되었어요. 첫 번째 번개가 티폰의 어깨에 맞았어요.</p><p>하늘이 하얘졌어요. 그런데 눈앞이 돌아왔을 때 티폰은 그대로 서 있었어요. 어깨에서 검은 연기가 조금 더 짙게 피어올랐을 뿐이었어요.</p><p>두 번째, 세 번째. 제우스는 쉬지 않고 던졌어요. 산비탈이 갈라지고 바위가 튀었어요. 그래도 티폰은 넘어지지 않았어요.</p><p>티폰이 팔을 휘둘렀어요. 제우스는 옆으로 몸을 던져 피했어요. 조금 전까지 자기가 서 있던 자리에 커다란 구덩이가 생겼어요. 바람이 몰아쳐 숨을 쉴 수가 없었어요. 뱀 다리 하나가 미끄러져 오더니 제우스의 발목을 감았어요.</p><p>제우스는 번개로 그것을 쳐 냈어요. 겨우 빠져나왔지만 어깨를 바위에 크게 부딪혔지요. 제우스는 어깨를 문지르고 다시 일어섰어요. 티폰의 연기가 자꾸 눈앞을 가렸어요.</p><p>싸움은 하루를 넘겼어요. 그리고 이틀을 넘겼어요. 바다에서는 파도가 뭍으로 몇 번이나 올라왔어요.</p><p>온 세상이 그 소리를 들었어요. 바다 밑에서도, 땅 아래에서도요. 서쪽 끝에서 하늘을 떠받치고 있던 아틀라스는 두 팔에 힘을 더 주었어요. 하늘이 자꾸 흔들렸거든요.</p><p>그날 밤에도 싸움은 그치지 않았어요. 사흘째 되던 날, 제우스가 무릎을 꿇었어요. 제우스는 일어서지 못했어요.</p><p>손에 쥔 번개는 아직 파랗게 빛나고 있었어요. 그런데 팔이 올라가지 않았어요. 사흘 동안 한숨도 자지 않았고, 물 한 모금 마시지 못했거든요.</p><p>숨소리가 자기 귀에도 크게 들렸어요. 눈앞이 자꾸 흐려졌어요. 티폰의 그림자가 제우스를 완전히 덮었어요. 티폰이 천천히 다가왔어요. 서두르지 않았어요. 이제 서두를 필요가 없었으니까요.</p><p>뱀들이 쉭쉭거리는 소리가 점점 가까워졌어요. 그때 제우스의 손바닥에 무언가가 닿았어요. 흙이었어요. 무릎을 꿇으면서 짚은 그 자리, 축축하고 서늘한 흙이었지요. 제우스는 자기도 모르게 그 흙을 손가락으로 꽉 움켜쥐었어요.</p><p>제우스는 아주 오래전 크레타섬을 떠올렸어요. 맨발로 뛰어다니던 비탈, 발바닥에 닿던 흙, 어릴 때 자기를 받아 준 산이요. 그때부터 지금까지 자기를 받쳐 준 것이 늘 이것이었다는 생각이 들었어요.</p><p>제우스는 그 흙냄새를 맡았어요. 비가 오기 전 흙에서 나는 냄새였지요. 제우스는 이를 악물고 한쪽 무릎을 폈어요. 무릎이 후들거렸지만 버텼어요.</p><p>“아직 안 끝났어.”</p><p>티폰이 걸음을 멈췄어요. 제우스가 완전히 일어섰어요. 그러고는 아까와는 다르게 번개를 들었어요. 이번에는 한 발씩 앞으로 나가면서 던졌어요. 물러서지 않고 다가가면서요.</p><p>제우스는 티폰의 다리를 노렸어요. 번개가 하나씩 뱀의 똬리 사이로 파고들었어요. 그렇게 뱀 다리를 하나씩 쳐 냈어요. 하나가 무너지자 티폰의 몸이 한쪽으로 기울었어요. 티폰은 처음으로 중심을 잃었어요.</p><p>티폰이 처음으로 뒷걸음질을 쳤어요. 제우스는 멈추지 않았어요. 기울어진 쪽으로 계속 번개를 던졌어요. 티폰이 그 자리를 벗어나려고 몸을 틀었지만, 제우스가 앞을 막아섰어요.</p><p>제우스는 발이 무거웠지만 멈추면 다시는 못 일어날 것 같아서 계속 걸었어요. 바닷물이 두 편 사이에서 하얗게 끓어올랐어요.</p><p>티폰은 남쪽으로 밀려났어요. 밀리고 또 밀렸어요. 바다를 건너 어느 섬까지요. 그 섬에는 커다란 산이 하나 있었어요.</p><p>제우스의 손에서 번개가 마지막으로 크게 번쩍였어요. 제우스는 남은 힘을 모두 모아 그것을 던졌어요. 티폰이 산 밑으로 쓰러졌어요. 제우스는 그 산을 두 팔로 밀어 티폰 위로 덮었어요. 산이 무겁게 내려앉으면서 흙먼지가 하늘로 치솟았어요.</p><p>땅이 한 번 크게 들썩이고는 조용해졌어요. 제우스는 그 자리에 주저앉았어요. 사흘 만에 처음으로 하늘이 다시 보였어요. 연기가 걷히고 있었거든요. 파란 하늘이 조금씩 넓어졌어요.</p><p>멀리서 새 한 마리가 울었어요. 그 소리가 그렇게 반가울 수가 없었어요.</p><p>티폰은 그 산 아래에 지금도 있어요. 가끔 그 산꼭대기에서 뜨거운 김이 올라와요. 밤에는 붉은 것이 흘러내리기도 하고요. 옛사람들은 그것을 보고, 저 아래에서 티폰이 아직도 뒤척이는 거라고 이야기했어요. 그건 아주 오래된 이야기예요.</p><p>제우스가 올림포스산으로 돌아왔을 때, 달아났던 신들이 하나둘 돌아와 있었어요. 아무도 먼저 입을 열지 못했어요. 새가 되었던 이도, 물속에 숨었던 이도 눈을 마주치지 못했지요.</p><p>돌아온 이들은 저마다 어디에 숨어 있었는지 말하지 않았어요. 제우스도 아무 말 하지 않았어요. 나무라지도 않았어요. 그저 산꼭대기까지 천천히 걸어 올라갔어요. 돌아온 이들이 그 뒤를 조용히 따라 올라갔어요. 산 위로 바람이 한 번 지나갔어요.</p><p>왕좌가 거기 있었어요. 여전히 비어 있었지요. 제우스는 그 앞에 섰어요. 옷은 다 해졌고, 어깨에는 멍이 들어 있었어요. 손에 쥔 번개는 아직도 따뜻했어요.</p><p>제우스는 왕좌를 한참 보다가, 그 자리에 앉았어요. 앉고 나서 제우스는 두 손을 무릎에 올려놓고 아래를 내려다보았어요. 산이 보이고, 들판이 보이고, 그 너머에 바다가 보였어요. 이제 저 모든 것이 자기가 지켜야 할 것이었지요.</p><p>그날부터 제우스는 하늘과 세상의 왕이 되었어요. 돌아온 이들이 왕좌 뒤쪽에 나란히 섰어요. 제우스는 그 가운데 누구에게도 어디에 숨어 있었느냐고 묻지 않았어요. 그러고는 다시 아래를 내려다보았지요. 산 위로 바람이 한 번 더 지나갔어요.</p></article></noscript>
