  <noscript><article class="ns-text"><h1>요람 속의 뱀</h1><h2>하나뿐인 요람</h2><p>요람이 하나뿐이었어요. 요람은 그 집 남편이 만든 것이었어요. 아기가 하나 태어날 줄 알고 만들었으니 하나면 됐지요. 그런데 그날 밤에 둘이 태어났어요.</p><p>그 집 안주인은 두 아기를 머리를 맞대게 눕혔어요. 그래야 겨우 들어갔거든요. 발끼리 닿게 눕혔더니 밤중에 서로 걷어차서 둘 다 깼기 때문이에요.</p><p>두 아기는 같은 날 태어났어요. 그런데 똑같이 생기지는 않았어요. 하나는 조금 더 컸어요. 그 아기는 눈을 뜨면 손부터 뻗었어요. 뻗어서 잡으면 놓지 않았고요. 안주인의 머리카락을 잡으면 손가락을 하나씩 펴서 풀어내야 했지요.</p><p>다른 하나는 잘 잤어요. 울어도 오래 울지 않았고요. 큰 아기는 밤에도 손을 쥐고 잤어요. 손가락을 펴 보면 안에 아무것도 없었고요.</p><p>낮에는 안주인이 두 아기를 마당에 데리고 나왔어요. 큰 아기는 흙을 한 줌씩 쥐었다가 폈어요. 쥐면 손가락 사이로 다 빠져나가는데도 자꾸 쥐었지요. 작은 아기는 그걸 옆에서 보고 있었고요.</p><p>여기가 어디냐면 테베였어요. 마당 벽에 방패가 하나 걸려 있었는데, 그건 오래돼서 못 쓰는 것이었어요. 걸어 두면 비 오는 날 소리가 좋았거든요.</p><p>그해에 그 집 남편은 싸움터에 나가 있었어요. 봄에 나가서 아직 소식이 없었지요. 안주인은 저녁마다 문간에 등잔을 하나 내다 놓았어요.</p><p>이웃 사람들은 두 아기를 두고 이런저런 말을 했어요. 젖을 무는 힘이 다르다고요. 어떤 사람은 팔이 굵다고 했고, 어떤 사람은 요람 나무에 벌써 금이 두 군데 갔다고 했지요. 안주인은 그런 말을 들으면 웃기만 했어요.</p><p>“이 집 큰애가 요람을 부수겠네.”</p><p>이웃 사람이 그러고는 웃었어요. 안주인도 따라 웃었지요. 그런데 그 요람은 정말 그해 겨울에 한쪽 널이 떨어져 나갔어요.</p><p>그 집 안주인의 할아버지가 페르세우스였어요. 나무 상자에 실려 바다를 건넜던 그 사람이요. 그러니까 요람 속의 두 아기는 그 상자 안에서 나흘을 떠다닌 아기의 증손자였지요.</p><p>안주인은 그 이야기를 아기들에게 자주 했어요. 알아듣지도 못하는데요. 나무 상자 이야기와 네모난 하늘 이야기를요. 하다 보면 두 아기가 벌써 다 잠들어 있었지요.</p><p>“네 할아버지의 아버지는 상자를 타고 바다를 건넜단다.”</p><p>안주인은 그렇게 말해 놓고 혼자 웃었어요. 알아들을 리가 없었으니까요. 두 아기는 아버지가 달랐어요. 하나는 그 집 남편의 아들이었어요. 다른 하나는 그렇지 않았고요. 그 집 안주인이 제우스와 사랑에 빠져 아이가 태어났고, 헤라는 그것이 미웠어요.</p><p>헤라는 올림포스산 위에서 아래를 내려다볼 수 있었어요. 그 집 지붕도 볼 수 있었고, 마당 벽에 걸린 낡은 방패도 볼 수 있었지요.</p><p>올림포스산은 아주 멀었어요. 그런데 헤라가 보려고 하면 먼 것은 문제가 되지 않았어요. 헤라는 그 마당을 오래 내려다보았어요.</p><h2>스틱스강에 걸고 한 맹세</h2><p>두 아기가 태어나던 날 아침이었어요. 올림포스산에서 신들이 모인 자리에 제우스가 앉아 있었어요. 기분이 아주 좋아 보였지요.</p><p>“오늘 태어나는 페르세우스의 핏줄이 저 아래 땅의 왕이 될 것이다.”</p><p>신들이 웅성거렸어요. 신들 가운데 몇은 서로 마주 보았어요. 제우스가 저렇게 말할 때는 대개 무슨 일이 있는 거였거든요.</p><p>헤라가 자리에서 일어섰어요.</p><p>“오늘 태어나는 아이라고 하셨지요?”</p><p>“그래요, 오늘.”</p><p>“오늘 가장 먼저 태어나는 아이가 왕이 되는 거지요?”</p><p>“그래요, 가장 먼저 태어나는 아이지요.”</p><p>“그 말을 맹세하시겠어요?”</p><p>제우스는 잠깐 헤라를 보았어요. 그러고는 웃었지요.</p><p>“맹세하지요.”</p><p>“스틱스강에 걸고 맹세하셔야 해요.”</p><p>“스틱스강에 걸고 맹세하지요.”</p><p>자리가 조용해졌어요. 스틱스강에 걸고 한 맹세는 신도 물릴 수 없었거든요. 한 번 입 밖에 내면 그것으로 끝이었어요.</p><p>제우스도 그것을 알고 있었어요. 알면서도 한 거예요. 잔을 든 손도 그대로였고 웃음도 그대로였지요. 헤라가 자리를 떴어요. 아주 조용히 나갔지요. 나가다가 문간에서 한 번 멈췄어요. 그러고는 아래를 내려다보았지요. 테베 쪽이 아니라 미케네 쪽이었어요.</p><p>그날 낮에 미케네에서 아기가 하나 태어났어요. 달을 다 채우지 못하고 나온 아기였어요. 아주 작아서 사람들이 밤새 손을 문질러 주어야 했지요. 그 아기도 페르세우스의 핏줄이었어요.</p><p>헤라가 그 집에도 다녀갔어요. 무엇을 했는지는 아무도 보지 못했어요. 다만 그 아기는 나올 때가 한참 남았는데 그날 나왔지요.</p><p>테베에서 두 아기가 태어난 것은 그날 밤이었고요. 제우스는 잔을 내려놓았어요. 잔은 아직 가득 차 있었어요.</p><p>“맹세는 맹세지요. 오늘 가장 먼저 태어난 아이는 미케네의 아기예요.” 헤라가 말했어요.</p><p>제우스는 대답하지 않았어요. 자리에서 일어나 밖으로 나갔지요. 그날 저녁에는 아무도 제우스를 보지 못했어요.</p><h2>문지방을 넘어온 것</h2><p>그 집에서는 밤에 등잔을 아주 낮게 켜 두었어요. 밝으면 아기들이 잘 못 잤거든요. 여덟 달쯤 되었을 때였어요. 그날 밤에는 등잔이 꺼져 있었어요. 기름이 다 된 거예요.</p><p>안주인은 요람 옆 바닥에서 잤어요. 손을 뻗으면 요람에 닿는 자리였지요. 남편이 없는 동안은 늘 그렇게 잤어요.</p><p>안주인은 무슨 소리에 눈을 떴어요. 누가 마루를 손바닥으로 천천히 쓸고 지나가는 것 같은 소리였지요. 그 소리가 문지방 쪽에서 요람 쪽으로 옮겨 갔어요.</p><p>안주인은 일어나지 못했어요. 몸이 움직이지 않았거든요. 소리가 마루를 다 건너가는 동안 안주인은 숨만 쉬고 있었어요.</p><p>작은 아기가 울기 시작했어요. 아주 크게요. 안주인은 어둠 속을 더듬어 등잔을 찾았어요. 부싯돌을 세 번 치고서야 불이 붙었지요.</p><p>불이 붙은 뒤에 안주인은 요람을 보았어요. 큰 아기가 앉아 있었어요. 두 손에 하나씩 무언가를 쥐고 있었지요. 쥔 손은 아주 작았어요. 그런데 그 손 아래로 늘어진 것은 짧지 않았어요. 뱀 두 마리였어요.</p><p>안주인이 소리를 질렀어요. 옆집까지 들렸어요. 사람들이 문을 밀고 들어왔지요. 횃불이 여럿 들어와서 방 안이 갑자기 환해졌어요. 사람들이 요람 앞에서 멈췄어요. 아무도 손을 대지 못했지요.</p><p>아기가 두 손을 폈어요. 무언가가 마루에 떨어졌어요. 둘 다 움직이지 않았어요. 아기는 울지 않았어요. 손바닥을 폈다 오므렸다 해 보더니 웃었지요.</p><p>울고 있던 것은 옆에 누운 작은 아기였어요. 안주인이 그 아기를 먼저 안아 올렸어요. 마당에 나와 선 사람들이 수군거렸어요. 누구 짓인지 다들 짐작하면서도 그 이름을 소리 내어 말하지는 않았어요. 올림포스산 쪽을 한 번씩 올려다볼 뿐이었지요.</p><p>이튿날 아침에 앞일을 읽는다는 노인이 왔어요. 마당에는 사람들이 가득 찼어요. 어젯밤 일을 들은 사람들이 다 온 거예요. 안주인은 문고리를 잡았어요. 그러고는 사람들 머리 너머를 한 번 보고 손을 내렸지요.</p><p>노인은 마루에 떨어진 것을 한참 보았어요. 그러고는 요람 쪽으로 갔지요.</p><p>“이 집 큰아이가 큰일을 하겠습니다.”</p><p>“그 큰일이 좋은 일입니까?”</p><p>노인은 바로 대답하지 않았어요. 아기의 손을 펴서 손바닥을 들여다보고 있었거든요.</p><p>“좋은 일이라고는 하지 않았습니다. 큰일이라고 했습니다.”</p><p>노인은 마루에 떨어진 것을 헝겊에 싸서 들고 나갔어요. 마당 사람들이 길을 비켜 주었지요. 그날부터 그 집 앞을 지나는 사람들이 걸음을 늦추게 되었어요.</p><p>노인이 가고 나서 그 집에서는 아기 이름을 다시 짓기로 했어요. 헤라의 노여움을 조금이라도 눅여 보려고요. 그래서 헤라의 이름을 넣어서 지었어요.</p><p>헤라클레스. 헤라의 영광이라는 뜻이었어요. 이름을 그렇게 지어 주면 헤라도 마음을 풀 거라고 어른들은 생각했지요.</p><p>안주인은 그 이름을 부를 때마다 목소리가 조금 낮아졌어요. 아이는 그걸 몰랐지요. 자기 이름이 좋다고 생각했거든요.</p><p>그 이름을 들은 헤라가 어떤 얼굴을 했는지는 아무도 몰라요.</p><h2>부러진 리라</h2><p>헤라클레스는 빨리 자랐어요. 열 살에 벌써 어른들 키를 넘었지요. 마당의 낡은 방패를 한 손으로 들었다 놓았다 하면서 놀았어요.</p><p>열두 살쯤에는 마을에서 그 아이를 부르는 일이 잦아졌어요. 수레가 도랑에 빠지면 사람들이 그 집으로 왔지요. 헤라클레스는 가서 수레 뒤를 들어 올렸어요. 힘을 얼마나 써야 하는지는 아직 몰라서, 수레가 반대쪽으로 넘어간 적도 있었고요.</p><p>한번은 헤라클레스가 어머니에게 물었어요. 왜 자기만 이렇게 힘이 세냐고요. 안주인은 국을 젓다가 손을 멈췄어요. 그러고는 다시 저었지요.</p><p>“먹는 걸 잘 먹어서 그렇지.”</p><p>헤라클레스는 그 말을 열여섯 살까지 믿었어요. 그 집에서는 스승을 셋 두었어요. 활을 가르치는 사람, 씨름을 가르치는 사람, 리라를 가르치는 사람이었지요.</p><p>활은 잘했어요. 첫해에 벌써 스승이 더 가르칠 것이 없다고 했어요. 씨름도 잘했지요. 다만 상대를 놓아주는 것을 자꾸 잊었어요.</p><p>씨름 스승이 손바닥으로 바닥을 세 번 치면 놓으라는 뜻이었어요. 헤라클레스는 그 소리를 못 들을 때가 있었어요. 화가 나면 귀가 먼저 막힌다고 스승이 말했지요.</p><p>리라는 못했어요. 리라 스승은 나이가 아주 많았어요. 손가락을 하나하나 줄 위에 놓아 주면서 가르쳤지요. 그런데 헤라클레스의 손은 그 줄에 비해 너무 컸어요. 한 줄을 누르면 옆 줄이 같이 눌렸거든요.</p><p>“다시.”</p><p>헤라클레스가 다시 했어요. 또 틀렸어요.</p><p>“다시.”</p><p>여름 내내 그랬어요. 어느 날 스승이 회초리로 헤라클레스의 손등을 쳤어요. 세게 친 것도 아니었어요. 그런데 헤라클레스가 리라를 번쩍 들었어요.</p><p>그다음은 눈 깜짝할 사이였어요. 리라가 부러졌어요. 스승이 뒤로 넘어졌지요. 팔이 부러졌어요. 사람들이 스승을 업고 나갔어요. 스승은 아프다는 말을 한 번도 하지 않았어요. 다만 나가면서 헤라클레스 쪽을 한 번 보았지요.</p><p>방 안이 아주 조용했어요. 헤라클레스는 부러진 리라를 든 채로 서 있었어요. 자기가 무엇을 했는지 한참 뒤에야 알았지요.</p><p>그 뒤로 헤라클레스는 리라에 손을 대지 않았어요. 아주 나중까지도요. 그날 저녁에 헤라클레스는 산으로 보내졌어요. 소를 치는 데였어요. 안주인은 아들을 배웅하면서 아무 말도 하지 않았어요. 대신 아들의 두 손을 한참 들여다보았지요.</p><p>산에는 소가 오십 마리쯤 있었어요. 헤라클레스는 거기서 며칠씩 아무하고도 말을 하지 않고 지냈어요. 소는 밀어도 넘어지지 않았어요. 헤라클레스는 그게 마음에 들었지요.</p><h2>산속의 스승</h2><p>소를 치는 해가 세 번 지나갔어요. 어느 아침에 산길에 누가 서 있었어요. 허리 위는 사람이었어요. 허리 아래는 말이었고요. 수염이 하얗게 세어 있었어요. 등에 활을 메고 옆구리에는 풀 한 묶음을 매달고 있었지요.</p><p>“네가 산 아래 마을의 그 아이냐?”</p><p>“무슨 아이 말씀입니까?”</p><p>“리라를 부러뜨리고 스승의 팔을 다치게 했다는 아이 말이다.”</p><p>헤라클레스는 대답하지 않았어요. 소들이 그 사람 둘레로 모여들었어요. 겁을 내지 않는 것이 이상했지요.</p><p>“나를 따라 산 위로 오너라.”</p><p>그 사람이 케이론이었어요. 케이론이 어떤 사람인지는 산 아래 마을에서도 다들 알고 있었어요. 아픈 데를 고치는 손이 있다고요. 다만 아무나 받아 주지는 않는다고요. 헤라클레스는 소를 마을에 맡기고 산으로 올라갔어요.</p><p>케이론의 동굴에는 아이가 여럿 있었어요. 다들 어디선가 맡겨진 아이들이었지요. 아침에는 활을 쏘고, 낮에는 풀을 캐고, 저녁에는 그날 캔 풀의 이름을 하나씩 말해야 했어요.</p><p>동굴 안쪽은 생각보다 넓었어요. 벽에 활이 여러 개 걸려 있었고, 천장 가까이에 마른 풀 다발이 줄줄이 매달려 있었지요. 저녁에는 그 밑에서 다들 같이 밥을 먹었어요. 케이론은 서서 먹었고요.</p><p>헤라클레스는 그 아이들보다 머리 하나가 더 컸어요. 그래서 처음 며칠은 아무도 말을 걸지 않았지요.</p><p>케이론은 활을 가르칠 때 과녁을 멀리 두지 않았어요. 대신 시위를 당긴 채로 기다리게 했지요. 팔이 떨릴 때까지요. 떨리기 시작하면 놓으라고 하지 않고 더 기다리게 했어요.</p><p>“왜 화살을 안 쏘게 하십니까?”</p><p>“쏘고 싶을 때 쏘는 건 아무나 한다.” 케이론이 말했어요. “쏘고 싶은데 안 쏘는 게 어렵지.”</p><p>첫날 헤라클레스는 스물을 셀 동안 버텼어요. 이튿날에는 서른을 셌고요. 열흘째에는 팔이 떨리는데도 백까지 셌지요. 그날 케이론이 처음으로 고개를 끄덕였어요.</p><p>풀도 가르쳤어요. 어떤 풀은 다친 자리에 붙이고 어떤 풀은 달여서 열을 내린다고요. 헤라클레스는 그 이름을 잘 외우지 못했어요. 그런데 잎 모양은 한 번 보면 잊지 않았지요.</p><p>한번은 다른 아이가 벼랑에서 미끄러져 무릎이 까졌어요. 헤라클레스가 뛰어가 풀을 뜯어 왔지요. 이름은 여전히 몰랐어요. 그런데 잎은 맞았어요.</p><p>한번은 다른 아이 하나가 헤라클레스에게 무슨 말을 했어요. 헤라클레스는 하던 일을 멈추고 그 아이 쪽으로 돌아섰어요. 그러고는 한 손으로 그 아이를 들어 올렸지요. 발이 땅에서 떨어졌어요.</p><p>케이론은 소리를 지르지 않았어요. 말리지도 않았고요. 그냥 헤라클레스 옆에 와서 섰어요. 헤라클레스가 그 아이를 내려놓았어요. 그러고는 동굴 밖으로 나갔지요.</p><p>케이론이 뒤따라 나갔어요. 둘은 바위에 나란히 앉았어요. 아래로 마을 불빛이 몇 개 보였지요. 한참 아무 말도 하지 않았어요. 바람이 찼어요. 케이론이 등에서 활을 내려 무릎에 놓았지요.</p><p>“제 힘은 어디서 온 겁니까?”</p><p>“그건 나도 모른다.”</p><p>“그걸 모르시면 저한테 무엇을 가르치시는 겁니까?”</p><p>“오늘은 아무것도 안 가르쳤다.” 케이론이 말했어요. “네가 그 아이를 내려놓은 건 내가 가르친 게 아니다.”</p><p>헤라클레스는 자기 손을 내려다보았어요. 어릴 때 어머니가 들여다보던 그 손이었지요. 그 뒤로 헤라클레스는 화가 나면 동굴 밖으로 나가는 버릇이 생겼어요. 나가서 바위에 앉아 있다가 들어왔지요. 케이론은 그때마다 아무것도 묻지 않았어요.</p><p>헤라클레스는 그 산에서 활도 배우고 풀도 배웠어요. 그런데 나중에 가장 자주 떠올린 것은 시위를 당긴 채로 백을 세던 그 아침들이었지요.</p><p>몇 해가 더 지났어요. 어느 아침에 헤라클레스가 짐을 쌌어요. 활과 풀 몇 가지만 챙겼지요.</p><p>“어디로 가느냐?”</p><p>“테베의 집으로 갑니다. 그다음은 아직 모르겠습니다.”</p><p>케이론은 동굴 앞까지 나왔어요. 헤라클레스는 인사를 하고 산길을 내려갔어요. 어깨가 아주 넓어서 뒷모습만 봐도 누구인지 알 만했지요.</p><p>케이론은 그 뒷모습을 오래 보았어요. 그러고는 아주 작게 중얼거렸어요.</p><p>“네 힘보다 네 마음이 더 걱정이구나.”</p></article></noscript>
