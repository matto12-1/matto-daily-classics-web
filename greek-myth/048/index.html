  <noscript><article class="ns-text"><h1>세상 끝의 황금 사과</h1><h2>잿빛 돌과 사슬 소리</h2><p>사슬 소리가 먼저 들렸어요. 헤라클레스는 걸음을 멈추고 그쪽을 보았어요. 나무도 풀도 없는 데였어요. 잿빛 돌뿐이었지요. 바람은 한쪽으로만 불었고요.</p><p>소리는 아주 규칙적이었어요. 절그럭 하고 한 번 나고 오래 조용하고, 또 절그럭 하고 한 번 났어요. 무엇이 움직여서 나는 소리가 아니었어요. 무엇이 자세를 고쳐 세우느라 나는 소리였지요.</p><p>커다란 바위가 하나 서 있었어요. 사람 키의 몇 배는 되는 바위였어요. 그 앞에 사람이 하나 등을 대고 서 있었지요. 두 손목과 두 발목이 바위에 매여 있었고요.</p><p>헤라클레스는 그 앞으로 걸어갔어요. 그 사람이 고개를 들었어요. 눈을 뜨는 데 시간이 걸렸어요. 여기서는 서두를 일이 하나도 없었으니까요.</p><p>“사람이 오는 소리는 오랜만이군요.”</p><p>“저는 길을 지나가는 사람입니다.”</p><p>“여기는 지나가는 길이 아니에요. 여기가 세상의 끝이거든요.”</p><p>헤라클레스는 뒤를 돌아보았어요. 걸어온 자리에 발자국이 하나도 없었어요. 돌바닥이라 자국이 남지 않았거든요.</p><p>헤라클레스는 그 말에 대답하지 못했어요. 대신 사슬을 보았지요. 고리 하나가 사람 손목만 했어요. 그런데 이상하게 매끄러웠어요. 어디에도 거친 데가 없었지요.</p><p>“누구십니까?”</p><p>“프로메테우스라고 합니다.”</p><p>헤라클레스는 그 이름을 알고 있었어요. 사람들이 마당에 불을 피울 때마다 그 이름을 부르지는 않았지만, 불이 어디에서 왔는지는 다들 알았으니까요.</p><p>“사람에게 불을 준 일 때문에 여기 묶여 계신 겁니까?”</p><p>“네, 그 일 때문이에요.”</p><p>“여기 묶인 지 얼마나 되셨습니까?”</p><p>“몇 해인지는 세지 않았어요.” 프로메테우스가 말했어요. “대신 저 아래 연기를 세었지요. 해마다 조금씩 늘더군요.”</p><p>헤라클레스는 사자 가죽을 벗어 바닥에 놓고 사슬을 두 손으로 잡았어요. 처음에는 그냥 당겼어요. 사슬이 팽팽해졌다가 그대로였어요.</p><p>두 번째에는 발을 바위에 대고 당겼어요. 세 번째에는 고리 하나를 두 손으로 비틀었고요. 네 번째에는 몽둥이를 고리 사이에 끼우고 눌렀어요. 몽둥이가 부러졌어요.</p><p>다섯 번째, 여섯 번째. 헤라클레스는 세면서 했어요. 열 번째에서 세는 것을 그만두었지요. 손바닥이 벗겨졌어요. 헤라클레스는 그 손을 옷에 문지르고 다시 잡았어요.</p><p>“그건 헤파이스토스가 만든 거예요.” 프로메테우스가 말했어요. “그 손에서 나온 건 아무도 못 끊어요. 만든 사람도 못 끊고요.”</p><p>헤라클레스는 사슬에서 손을 뗐어요. 그러고는 바닥에 앉았어요. 한참 앉아 있었지요.</p><p>앉아 있는 동안 헤라클레스가 본 것은 사슬이 아니었어요. 사슬이 물려 있는 자리였어요. 고리 끝이 바위 속으로 들어가 있었는데, 그 둘레에 아주 가는 금이 하나 가 있었지요. 몇백 해 동안 물이 얼었다 녹았다 하면서 낸 금이었어요.</p><p>헤라클레스는 뾰족한 돌 하나를 주워 왔어요. 그 끝을 금에 대고 다른 돌로 두드렸어요. 하루 종일 두드렸어요. 금이 손가락 하나 들어갈 만큼 벌어졌지요.</p><p>프로메테우스는 그동안 입을 열지 않았어요. 다만 두드리는 소리를 세고 있었지요. 여기서 세어 볼 것이 오랜만에 하나 생긴 거예요.</p><p>다음 날에는 부러진 몽둥이를 그 틈에 박고 그 위에 올라섰어요. 바위가 갈라졌어요. 소리가 아주 컸어요. 갈라진 데가 위에서 아래로 곧게 내려갔지요. 그 소리가 바다 쪽으로 갔다가 한참 뒤에 되돌아왔어요.</p><p>사슬은 끝내 끊어지지 않았어요. 다만 사슬이 물고 있던 돌덩이가 바위에서 떨어져 나왔지요. 어른 주먹 두 개만 한 돌이었어요.</p><p>프로메테우스는 앞으로 한 걸음 나왔어요. 그러고는 멈췄어요. 무릎이 펴지지 않았거든요. 헤라클레스가 팔을 잡아 주었어요.</p><p>네 걸음을 걸었어요. 네 걸음째에 프로메테우스가 뒤를 돌아보았어요. 바위가 갈라진 채로 서 있었지요. 언덕 아래쪽으로도 한 번 고개를 돌렸고요. 거기 하늘을 진 형이 있었거든요. 형은 이쪽을 보지 못했어요. 목이 그만큼 돌아가지 않았으니까요.</p><p>그 뒤로 프로메테우스는 손목에 쇠고리 하나와 돌 한 조각을 달고 다니게 돼요. 끊어지지 않는 것이라 뺄 수가 없었거든요.</p><p>프로메테우스는 물가로 걸어가 두 손을 담갔어요. 손목에 달린 돌 조각이 물에 잠겼다가 떠올랐지요.</p><p>“심부름을 하나 부탁해도 될까요?”</p><p>“말씀하십시오.”</p><p>“아주 오래전에 제가 올림포스로 한마디를 올려 보낸 적이 있어요. 당신도 언젠가 그 왕좌를 걱정하게 될 거라고요.”</p><p>헤라클레스는 그 말을 들은 적이 없었어요. 그런데 누구에게 한 말인지는 알았지요. 제우스였어요.</p><p>“이번에는 그 걱정을 거두시라고 전해 주세요. 제가 아는 것 하나를 말씀드리겠다고요. 그 말이면 아실 겁니다.”</p><p>“무엇을 아신다는 겁니까?”</p><p>“그건 그분께 말씀드릴 거예요. 저를 여기에 이만큼 오래 세워 둔 것이 그것이거든요.” 프로메테우스가 말했어요.</p><p>헤라클레스는 알겠다고 하고 한 가지를 더 물었지요.</p><p>“저는 올림포스에 올라가 본 적이 없습니다. 어떻게 전해야 합니까?”</p><p>“올림포스 문 앞까지만 가세요. 거기 서서 아무 말이나 하면 다 올라갑니다. 저도 그렇게 했어요.”</p><p>프로메테우스가 물었어요. 무슨 일로 세상 끝까지 왔느냐고요. 헤라클레스는 자루에서 쪽지를 꺼내 보여 주었어요.</p><p>“황금 사과요.” 프로메테우스가 그 줄을 읽고 말했어요. “저 언덕 너머에 나무가 한 그루 있어요. 그 나무를 지키는 이들이 있고요. 그 사람들은 아버지 손에만 사과를 놓아 줍니다. 다른 손에는 안 놓아요.”</p><p>“나무를 지키는 이들의 아버지가 누구입니까?”</p><p>“제 형이에요. 저 아래서 하늘을 지고 있지요.”</p><p>헤라클레스는 언덕 쪽을 보았어요. 언덕 아래 잿빛 벌판에 무릎을 꿇은 사람이 하나 있었어요. 두 팔로 무언가를 떠받치고 있었지요. 낮인데도 그 위쪽만 밤처럼 어두웠어요.</p><p>헤라클레스는 그것을 한참 보았어요. 보고 나서 자기 두 손을 내려다보았지요. 손바닥이 아직 벗겨진 채였지요.</p><p>“저 사람이 다녀오는 동안 제가 대신 들고 있으면 되겠군요.”</p><p>프로메테우스는 그 말에 곧바로 대답하지 않았어요. 헤라클레스를 한참 보았지요.</p><p>“남의 것은 참 잘 푸시는군요.”</p><p>“무슨 말씀입니까?”</p><p>프로메테우스는 대답하지 않았어요. 대신 동쪽으로 걸어갔어요. 손목에서 돌 조각이 흔들리는 소리가 났어요. 그 소리가 안 들릴 때까지 헤라클레스는 그 자리에 서 있었지요.</p><h2>하늘을 진 사람</h2><p>가까이 가서 보니 그 사람은 아주 컸어요. 무릎을 꿇고 있는데도 헤라클레스가 올려다봐야 했지요. 어깨 위에는 밤하늘이 얹혀 있었어요. 별이 아주 천천히 돌고 있었고요.</p><p>아틀라스는 목을 조금만 돌릴 수 있었어요. 딱 그만큼만 돌아갔거든요.</p><p>“내 동생은 떠났나?”</p><p>“예, 사슬에서 풀려나 동쪽으로 갔습니다.”</p><p>아틀라스는 한참 아무 말이 없었어요. 그러다 아주 작게 웃었어요. 웃을 때 어깨가 흔들려서 하늘도 조금 흔들렸지요.</p><p>“네가 동생을 풀어 주었구나.”</p><p>“사슬은 못 끊었습니다. 바위를 깼습니다.”</p><p>“바위를 깼든 사슬을 끊었든, 풀어 준 건 같지.”</p><p>아틀라스는 헤라클레스의 어깨 쪽을 보았어요. 사자 가죽이 거기 걸려 있었지요.</p><p>“그 가죽은 어디서 났느냐?”</p><p>“네메아 골짜기의 사자한테서 얻었습니다.”</p><p>“그 가죽에는 화살이 안 들어가겠구나.”</p><p>“예, 화살이 안 들어갑니다.”</p><p>아틀라스는 그 말에 잠깐 웃었어요. 웃고 나서는 다시 앞을 보았고요. 여기서 웃으면 위에서 별이 흔들린다는 것을 아틀라스는 오래전에 배웠거든요.</p><p>헤라클레스는 황금 사과 이야기를 꺼냈어요. 아틀라스는 끝까지 듣고 나서 자기 어깨 위를 눈으로 가리켰어요. 나는 여기서 못 움직인다는 뜻이었지요.</p><p>“사과를 가져오시는 동안 제가 하늘을 들고 있겠습니다.”</p><p>아틀라스가 이번에는 크게 웃었어요. 그 바람에 별 몇 개가 자리를 옮겼다가 되돌아왔어요.</p><p>“하늘을 들어 본 적은 있느냐?”</p><p>“없습니다.”</p><p>“그럼 한 번 대 보아라. 어깨를 여기 붙이고.”</p><p>헤라클레스는 아틀라스 옆에 무릎을 꿇고 어깨를 댔어요. 아틀라스가 아주 조금만 힘을 뺐어요.</p><p>헤라클레스의 무릎이 돌바닥에 박혔어요. 숨이 한 번에 다 나가 버렸지요. 헤라클레스는 두 팔을 위로 세우고 그 자세로 멈췄어요. 눈앞이 하얘졌다가 천천히 돌아왔어요.</p><p>“이 무거운 걸 여태 지고 계셨습니까?”</p><p>“처음에만 무거웠다.”</p><p>헤라클레스는 사자 가죽을 끌어다 어깨 위에 접어 올렸어요. 그러고는 다시 어깨를 댔어요. 이번에는 아틀라스가 손을 뗐지요.</p><p>아틀라스가 일어섰어요. 일어서는 데 한참 걸렸어요. 다 일어서고 나서 아틀라스는 자기 두 손을 오래 들여다보았어요. 손에 아무것도 없는 것이 오랜만이었거든요. 하늘도 한 번 올려다보았어요. 아래에서 올려다보는 것도 오랜만이었지요.</p><p>“사과를 가지고 사흘이면 돌아오마.”</p><p>아틀라스는 언덕을 넘어갔어요. 걸음이 이상했어요. 오래 무릎을 꿇고 있던 사람의 걸음이었지요. 언덕 위에서 한 번 멈춰 서서 뒤를 보았고요. 그리고 넘어갔어요.</p><h2>사흘 뒤의 사과 셋</h2><p>사흘은 길었어요. 헤라클레스는 그 사흘 동안 두 가지를 알았어요. 하나는 하늘이 가만히 있지 않는다는 것이었어요. 별이 도니까 무게가 조금씩 옆으로 밀렸고, 그때마다 발을 다시 디뎌야 했지요. 다른 하나는 여기서는 앉을 수가 없다는 것이었어요.</p><p>첫날 밤에 헤라클레스는 무엇이든 세어 보려고 했어요. 늪에서 횃불을 세던 것처럼요. 그런데 여기서는 셀 것이 없었어요. 별은 자리를 바꿀 뿐 늘지도 줄지도 않았거든요.</p><p>둘째 날 밤에 어깨의 사자 가죽이 미끄러져 내렸어요. 헤라클레스는 그것을 도로 올리려고 한 손을 뺐다가 얼른 다시 넣었어요. 한 손으로는 안 되었거든요.</p><p>그날 밤에 헤라클레스는 소리를 한 번 냈어요. 말이 아니라 그냥 소리였어요. 그 소리는 잿빛 벌판을 지나 바다 쪽으로 갔고, 되돌아오지 않았지요.</p><p>셋째 날 저녁에 언덕 위에 사람이 나타났어요. 아틀라스였어요. 두 손에 황금 사과가 셋 있었지요. 아틀라스는 그것을 헤라클레스 발치에 내려놓았어요.</p><p>“내 딸들이 순순히 주더구나.”</p><p>“따님들에게 무어라 하셨습니까?”</p><p>“아버지가 왔다고 했지. 그 말이면 되더라.”</p><p>“고맙습니다. 이제 하늘을 도로 받으십시오.”</p><p>아틀라스는 받지 않았어요. 대신 두 팔을 늘어뜨리고 서 있었지요.</p><p>“내가 미케네까지 갖다주마.”</p><p>“예?”</p><p>“너는 여기서 하늘을 지고 있어라. 사과는 내가 갔다 오마. 오래 걸리지는 않을 거다.”</p><p>헤라클레스는 아무 말도 하지 않았어요. 어깨 위에서 별이 한 칸 돌아갔어요. 발을 다시 디뎠지요. 여기서 소리를 질렀다면 아무 소용이 없었을 거예요. 아틀라스는 이미 두 손이 자유로웠고, 헤라클레스는 두 손이 묶인 것이나 마찬가지였으니까요.</p><p>헤라클레스는 고개를 끄덕였어요.</p><p>“그러십시오. 그런데 어깨가 자꾸 벗겨져서요.”</p><p>“뭐?”</p><p>“이 가죽을 어깨에 제대로 접어 넣어야겠습니다. 잠깐만 받아 주십시오. 잠깐이면 됩니다.”</p><p>아틀라스는 잠깐 그대로 서 있었어요. 그러고는 하늘을 받았어요. 어깨를 대고 두 팔을 세웠지요. 오래 하던 자세라 몸이 먼저 그렇게 움직인 거예요.</p><p>헤라클레스는 어깨를 빼고 사자 가죽을 집어 들었어요. 어깨에 접어 넣지는 않았어요. 그냥 걸쳤지요.</p><p>그다음에 발치에 있던 사과 셋을 주워 자루에 넣었어요. 셋을 하나씩 따로 넣었지요. 아틀라스는 아무 말도 하지 않았어요. 헤라클레스도요. 두 사람 다 한참 그러고 있었어요.</p><p>“사흘 동안은 내 어깨에 하늘이 없었다.” 아틀라스가 말했어요. “그거면 됐다.”</p><p>헤라클레스는 고개를 숙였어요. 그러고는 언덕을 올라갔어요. 꼭대기에서 한 번 뒤를 돌아보았지요. 아틀라스는 벌써 앞을 보고 있었어요. 별이 그 어깨 위에서 아까처럼 천천히 돌고 있었고요.</p><h2>미케네로 드는 갈림길</h2><p>돌아오는 길은 여러 달이 걸렸어요. 사과 셋은 자루 맨 아래에 넣고 그 위에 마른 풀을 채웠어요. 사과는 시들지 않았어요. 여러 달이 지나도록 딴 그날 그대로였지요. 자루를 열 때마다 마른 풀에서 사과 냄새가 났어요.</p><p>미케네로 들어가는 갈림길에서 사람 하나가 기다리고 있었어요. 왕의 말을 대신 전하는 사람이었지요. 손에 쪽지를 들고 있었어요.</p><p>“이 갈림길에서 기다린 지 열이레 됐습니다.”</p><p>그 사람은 갈림길 돌 위에 앉아 있다가 일어섰어요. 일어서는데 무릎에서 소리가 났지요. 열이레 동안 거기 앉아 있었다는 말이 참말인 모양이었어요.</p><p>“황금 사과는 이 자루에 있습니다.”</p><p>“왕께서 사과는 받아 오지 말라 하셨습니다. 성 안에 들이지 말라고요.”</p><p>헤라클레스는 자루 아가리를 도로 묶었어요.</p><p>“그러면 이 사과는 어디에 둡니까?”</p><p>“모르겠습니다. 저는 거기까지는 못 들었습니다.”</p><p>“왕께서 시키실 일이 이제 하나 남았답니다.” 그 사람이 쪽지를 펴며 말했어요.</p><p>“마지막 일이 무엇입니까?”</p><p>“저승 문 앞에 개가 하나 있답니다. 머리가 셋인 개요. 그걸 산 채로 데려오라 하셨습니다.”</p><p>바람이 한 번 지나갔어요. 손에 든 자루가 아래로 조금 내려갔지요.</p><p>“쪽지에 한 줄이 더 있습니다.” 그 사람이 말했어요.</p><p>“읽으십시오.”</p><p>그 사람은 그 줄을 읽기 전에 헤라클레스의 얼굴을 한 번 보았어요. 그러고는 읽었지요.</p><p>“이번에는 네가 한 일을 셈해서 나무판에 적어 두겠다.”</p><p>헤라클레스는 그 쪽지를 받아 들었어요. 왕의 글씨였어요. 마지막 줄만 붓을 꾹 눌러 쓴 것처럼 굵었지요. 헤라클레스는 그것을 접어 자루에 넣었어요. 황금 사과 셋이 든 자루였어요.</p><p>그러고는 갈림길에서 미케네 쪽이 아닌 길로 들어섰어요. 그쪽 길은 아래로 내려가는 길이었지요.</p></article></noscript>
