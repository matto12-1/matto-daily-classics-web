  <noscript><article class="ns-text"><h1>밀랍으로 붙인 날개</h1><h2>문설주에 붙은 실</h2><p>문설주에 실 한 오라기가 붙어 있었어요. 미노스가 그것을 손톱으로 떼어 냈지요. 아주 가는 실이었어요. 손가락으로 비벼 보아도 끊어지지 않았고요.</p><p>청동 문은 열려 있었어요. 지키는 사람 넷은 그 앞에 그대로 서 있었지요. 미노스는 그 사람들에게 아무것도 묻지 않았어요.</p><p>그날 아침 부두에서는 배 한 척이 없어졌다는 말이 올라와 있었어요. 아테네에서 온 배였지요. 밧줄을 풀어 놓은 자리에 매듭 하나가 그대로 남아 있었다고 했어요.</p><p>미노스는 그 말을 듣고 부두로 가지 않았어요. 대신 궁 안뜰에서 그 계단을 끝까지 내려왔지요. 왕이 그 계단을 끝까지 내려오는 것은 사람을 세는 날에도 없던 일이었어요.</p><p>다시 계단을 올라가는 동안 미노스는 그 실을 손가락에 감고 있었어요. 감았다가 풀고, 또 감았지요. 뒤따르던 사람들은 몇 걸음 뒤에서 걸었어요.</p><p>궁 안뜰 끝에 방이 하나 있었어요. 벽에 도면이 잔뜩 붙어 있는 방이었지요. 그 방에서 늙은 사람이 나무를 깎고 있었어요. 궁 아래의 그 길을 지은 사람이었어요. 이름은 다이달로스라고 했지요.</p><p>다이달로스는 손재주가 아주 좋았어요. 물이 저절로 흐르게 하는 홈통도 그 사람이 놓았고, 안뜰의 무거운 문이 소리 없이 열리는 것도 그 사람이 손을 본 것이었어요. 궁 안에서 그 사람이 만지지 않은 것을 찾기가 더 어려웠지요.</p><p>미노스가 실을 상 위에 내려놓았어요.</p><p>“이게 무엇인지 아시오?”</p><p>“실입니다.”</p><p>“이 실을 어디에 쓰는 것이오?”</p><p>“여러 군데에 씁니다.”</p><p>미노스는 다이달로스를 한참 보았어요. 다이달로스는 깎던 나무를 내려놓았지요. 대팻밥이 무릎에서 바닥으로 떨어졌어요.</p><p>“궁 아래 그 길은 나오는 길을 못 찾게 지었다고 하지 않았소?”</p><p>“그렇게 지었습니다.”</p><p>“그런데 그 길에서 살아 나온 사람이 있소.”</p><p>“실을 준 것은 제가 아닙니다.”</p><p>“실을 그 길 어디에 묶어야 나올 수 있는지 아는 사람이 이 섬에 몇이나 되오?”</p><p>다이달로스는 대답하지 않았어요. 미노스는 상 위의 실을 도로 집어 들었어요. 그러고는 손바닥에 놓고 한참 내려다보았지요. 그날 새벽에 궁을 나간 사람이 하나 더 있었는데, 그 사람 이야기는 꺼내지 않았어요.</p><p>“당분간 바닷가 탑에 계시오.”</p><p>“탑에 얼마나 있어야 합니까?”</p><p>“그대가 그 길의 안쪽을 다 잊을 때까지.”</p><p>“제가 지은 것을 제가 잊을 수는 없습니다.”</p><p>“그러면 오래 계셔야겠소.”</p><p>그날 저녁에 다이달로스는 아들을 데리고 탑으로 갔어요. 아들 이름은 이카로스였어요. 열두 살이었지요. 이카로스가 도면을 한 뭉치 안고 갔는데, 문 앞에서 그것을 다 내려놓고 들어가야 했어요.</p><h2>탑에서 세는 것</h2><p>탑까지는 수레로 반나절이었어요. 가는 동안 다이달로스는 창밖을 보지 않았어요. 대신 무릎에 손을 얹고 손가락을 하나씩 움직였지요. 무언가를 세는 손짓이었어요.</p><p>탑은 벼랑 위에 서 있었어요. 아래는 곧장 바다였고요. 창이 셋 있었는데 셋 다 바다 쪽으로만 났지요. 뭍 쪽으로는 창이 하나도 없었어요.</p><p>문은 하루에 두 번 열렸어요. 아침에 한 번, 저녁에 한 번요. 밥이 들어올 때만요. 문 밖에서 나는 소리는 늘 같았어요. 발소리 둘, 빗장 소리 하나, 그릇 놓는 소리 하나요.</p><p>이카로스는 처음 며칠 동안 계단을 오르내렸어요. 위층에서 아래층까지 서른두 계단이었지요. 하루에 몇 번을 오르내렸는지 나중에는 세지 않게 되었어요.</p><p>이카로스는 아버지에게 여러 번 물었어요. 언제 나가느냐고요. 다이달로스는 그때마다 다르게 대답했어요. 곧이라고도 하고, 모른다고도 했지요.</p><p>탑에 든 지 열흘쯤 되었을 때 이카로스가 벽에 금을 하나 긋기 시작했어요. 하루에 하나씩요. 다이달로스는 그것을 보고 아무 말도 하지 않았어요. 나중에는 이카로스가 스스로 그만두었고요.</p><p>탑에는 낮에도 그늘이 졌어요. 벽이 두꺼워서요. 창턱에 앉으면 볕이 무릎에까지 왔지요. 이카로스는 그 볕이 옮겨 가는 것을 따라 자리를 옮겼어요.</p><p>다이달로스는 창가에 앉아 있었어요. 앉아서 무엇을 보느냐고 이카로스가 물었어요.</p><p>“새를 본다.”</p><p>“새는 왜 보세요?”</p><p>“날개를 젓는 새가 있고, 펴기만 하고 안 젓는 새가 있다. 그 차이를 알고 싶어서다.”</p><p>이카로스도 창가에 앉아 보았어요. 정말 그랬어요. 갈매기는 한참씩 날개를 펴고만 있었어요. 벼랑 앞에서 바람이 밑으로부터 올라오는 자리에서는 아예 젓지 않았고요.</p><p>다이달로스가 이카로스에게 물었어요. 저 새들이 바다를 건널 때 어디서 쉬느냐고요. 이카로스는 대답을 못 했어요. 그다음 날부터 이카로스도 새를 보게 되었지요.</p><p>한 달쯤 지나자 이카로스는 갈매기와 다른 새를 구별하게 되었어요. 날개 끝이 갈라진 새는 높이 돌기만 하고 좀처럼 내려오지 않았고요.</p><p>다이달로스는 그것을 벽에 그렸어요. 못으로 긁어서요. 날개를 편 모양, 접은 모양, 꺾은 모양이었지요. 벽이 하얗게 긁혀서 창가 쪽이 온통 새가 되었어요.</p><p>이카로스는 아버지가 벽에 그린 새를 손으로 따라 그렸어요. 손가락 끝이 하얘졌지요. 그러고는 자기 팔을 벽에 대고 그 새 옆에 팔 모양을 그렸어요. 팔이 새보다 짧았어요.</p><p>깃털은 창틀에 걸린 것부터 모았어요. 갈매기가 창틀에 앉았다 가면 하나씩 남았거든요. 그다음에는 이카로스가 계단 구석까지 뒤졌어요. 바람이 들어와 깃털을 그리로 몰아 놓았지요.</p><p>아침에 밥을 들여놓는 사람이 있었어요. 다이달로스가 그 사람에게 밀랍을 부탁했어요. 초를 만들려고 한다고요. 밤에 불이 없으면 아무것도 못 한다고 했지요.</p><p>밀랍은 사흘에 한 덩이씩 들어왔어요. 다이달로스는 그것으로 초를 만들었어요. 만들기는 만들었는데 켜지는 않았어요.</p><p>밥을 들여놓는 사람은 늘 같은 사람이었어요. 말은 하지 않았지요. 그런데 이카로스가 문 옆에 서 있으면 밥그릇을 조금 더 안쪽에 놓아 주었어요.</p><p>바다는 날마다 빛깔이 달랐어요. 이카로스는 그것도 세었어요. 파란 날, 잿빛 날, 아무 빛깔도 아닌 날요.</p><p>이카로스는 깃털을 크기대로 늘어놓았어요. 제일 긴 것부터 제일 짧은 것까지요. 늘어놓고 나면 세었지요. 백을 넘긴 것은 스무 날이 지나서였어요.</p><p>“이 깃털로 뭘 합니까?” 이카로스가 물었어요.</p><p>“이 탑에서 나가는 문은 둘이다.”</p><p>“문은 하나뿐인데요.”</p><p>“하나는 저 문이고, 하나는 창이다. 깃털로 날개를 만들면 창으로 나갈 수 있다.”</p><h2>밀랍과 실</h2><p>다이달로스는 나무로 뼈대를 만들었어요. 밥상 다리를 뽑아서요. 상은 그 뒤로 한쪽이 기울었지요. 뼈대에는 실을 감았어요. 실은 이카로스의 웃옷에서 뽑았어요. 옷 한 벌을 통째로 풀면 실이 아주 많이 나오거든요.</p><p>실은 두 벌이 필요했어요. 이카로스의 웃옷 다음에는 다이달로스의 겉옷을 풀었지요. 그 뒤로 두 사람은 밤에 서로 등을 대고 잤어요. 등이 따뜻해서요.</p><p>밀랍이 모자랐어요. 다이달로스는 만들어 둔 초를 도로 녹였어요. 초는 열두 자루였는데 한 자루도 켠 적이 없었지요.</p><p>긴 깃털은 실로 묶고, 짧은 깃털은 밀랍으로 붙였어요. 밀랍은 손바닥으로 비벼 물렁하게 만든 다음에 썼지요. 붙인 자리는 손톱으로 눌러 다듬었고요.</p><p>첫 번째 날개는 못 쓰게 되었어요. 창밖으로 내밀자 바람에 뒤집혀 깃털이 절반이나 빠졌거든요. 다이달로스는 그것을 뜯어 실을 도로 감았어요. 깃털도 다시 크기대로 늘어놓았고요.</p><p>이카로스는 그날 저녁에 아무것도 먹지 않았어요. 다이달로스가 밥그릇을 옆으로 밀어 주었지요. 이카로스는 그것을 도로 밀었고요.</p><p>“깃털은 다시 모으면 된다.”</p><p>“그 많은 깃털을 다 어디서 모아요?”</p><p>“창틀에서. 갈매기는 날마다 온다.”</p><p>이카로스는 이튿날 아침부터 창틀 앞에 앉아 있었어요. 갈매기가 앉기를 기다리면서요. 날개 한 짝을 만드는 데 열흘이 걸렸어요. 두 짝을 만들고, 또 두 짝을 만들었어요. 큰 것 두 짝과 작은 것 두 짝이었지요.</p><p>다 만든 날 저녁에 다이달로스가 창가에서 큰 날개를 펴 보았어요. 날개가 창밖으로 절반쯤 나갔지요. 바람이 들어와 날개를 위로 밀었어요. 다이달로스의 발이 바닥에서 조금 떴고요.</p><p>이카로스가 웃었어요. 웃고 나서 제 입을 손으로 막았어요. 문 밖에 사람이 있을지도 몰랐거든요.</p><p>“이건 새 날개가 아닙니다.” 이카로스가 말했어요.</p><p>“새 날개는 아니다. 새 날개처럼 생긴 것이다.”</p><p>“내일 아침에 떠나자.” 다이달로스가 말했어요.</p><p>“잘 들어라. 너무 높이 날지 마라. 너무 낮게도 날지 마라.”</p><p>“왜 그래야 해요?”</p><p>“낮게 날면 물보라가 깃에 앉는다. 깃이 젖으면 무거워지고, 무거워지면 더 낮아진다.”</p><p>“높이 날면요?”</p><p>“위로 갈수록 볕이 세다. 밀랍은 볕에 물러진다.”</p><p>다이달로스는 그 말을 그날 저녁에 세 번 했어요. 그리고 자리에 눕고 나서 한 번 더 했지요. 이카로스는 네 번 다 알겠다고 대답했어요.</p><p>밤에 이카로스는 잠을 자지 못했어요. 누운 채로 날개를 손으로 만져 보았지요. 밀랍 붙인 자리가 손끝에 오돌토돌했어요.</p><h2>너무 높이도, 너무 낮게도</h2><p>아침 바람은 바다에서 뭍 쪽으로 불었어요. 그러다 해가 조금 오르면 방향이 바뀌었지요. 다이달로스는 그것을 스무 날 넘게 창가에서 보아 두었어요.</p><p>두 사람은 어깨에 끈을 매고 팔에 날개를 묶었어요. 서로 묶어 주었지요. 매듭은 다이달로스가 다 확인했어요. 이카로스 쪽은 두 번씩 확인했고요.</p><p>뭍은 북쪽에 있었어요. 다이달로스는 섬을 따라가는 길을 골랐어요. 곧장 건너면 빠르지만 쉴 데가 없거든요. 섬을 밟아 가면 멀어도 내려앉을 자리가 있었어요.</p><p>날개는 생각보다 무거웠어요. 팔이 아니라 어깨로 드는 것이었지요. 다이달로스가 그렇게 일러 주었어요. 팔로 들면 반나절도 못 간다고요.</p><p>창턱은 좁았어요. 큰 날개를 편 채로는 두 사람이 같이 설 수 없었어요. 그래서 하나가 나가고 나서 하나가 올라섰지요.</p><p>창턱에 올라선 것은 다이달로스가 먼저였어요.</p><p>“내 뒤만 따라와라. 옆으로도 위로도 가지 마라.”</p><p>“네.”</p><p>다이달로스가 뛰어내렸어요. 한 번 아래로 떨어졌다가 날개가 바람을 잡았지요. 그러고는 벼랑 앞에서 크게 한 바퀴 돌았어요.</p><p>이카로스도 뛰어내렸어요. 떨어지는 동안 눈을 감았어요. 그러다 몸이 위로 들리는 것을 느끼고 눈을 떴지요.</p><p>아래에 바다가 있었어요. 아주 넓었어요. 탑 벽이 바로 옆으로 지나갔고요. 두 사람은 벼랑 앞에서 한 번 더 돌았어요. 탑이 발밑으로 지나갔지요. 창 셋이 다 비어 있었어요.</p><p>이카로스는 웃고 있었어요. 소리가 나지 않는 웃음이었지요. 팔을 조금만 기울여도 몸이 그쪽으로 갔거든요. 그게 아주 쉬웠어요.</p><p>처음에는 이카로스가 아버지 뒤를 잘 따라갔어요. 아버지가 도는 대로 돌고, 아버지가 내려가면 내려갔지요.</p><p>섬 셋을 지났어요. 아래로 고기잡이배가 지나갔어요. 배에 탄 사람이 위를 올려다보다가 노를 놓쳤고요. 뭍에서는 아무도 두 사람을 보지 못했어요. 다들 위를 올려다보지 않으니까요. 위를 본 것은 그 배에 탄 사람 하나뿐이었어요.</p><p>바람이 밑에서 올라오는 자리가 있었어요. 그런 데서는 날개를 젓지 않아도 몸이 저절로 올라갔지요. 이카로스는 그런 자리를 몇 번 지나갔어요. 지날 때마다 조금씩 더 올라갔고요.</p><p>다이달로스가 뒤를 돌아보았어요. 이카로스가 조금 위에 있었어요. 다이달로스가 손을 아래로 내려 보였지요. 이카로스는 내려왔어요.</p><p>그다음 자리에서 이카로스가 또 올라갔어요. 이번에는 더 올라갔어요. 다이달로스가 소리를 질렀는데 바람 때문에 들리지 않았고요.</p><p>올라가니 아래가 다 보였어요. 섬이 물 위에 놓인 돌처럼 보였지요. 배는 점이 되었고요. 위쪽 공기는 차가운데 볕은 따가웠어요. 이카로스는 더 올라갔어요.</p><h2>물 위에 뜬 것</h2><p>깃털 하나가 이카로스 옆으로 지나갔어요. 이카로스는 그것을 잡으려고 손을 뻗었어요. 잡히지 않았지요.</p><p>또 하나가 지나갔어요. 그다음에는 셋이 한꺼번에요. 밀랍이 물러져 있었어요. 손끝에 오돌토돌하던 자리가 미끈해져 있었지요. 이카로스는 날개를 저었어요. 저을수록 깃털이 더 빠졌고요.</p><p>“아버지.”</p><p>이카로스가 불렀어요. 소리가 아래로 떨어졌지요. 다이달로스는 그 소리를 들었어요. 몸을 돌렸을 때는 이카로스가 이미 저 아래에 있었고요.</p><p>이카로스는 바다에 떨어졌어요.</p><p>“이카로스.”</p><p>다이달로스가 불렀어요. 바람 소리밖에 나지 않았어요. 다이달로스는 그 자리 위를 여러 번 돌았어요. 내려갔다가 다시 올라오고, 또 내려갔지요. 날개가 물에 닿을 만큼 내려간 적도 있었어요.</p><p>물 위에 깃털이 떠 있었어요. 흩어지지 않고 한자리에 모여 있었지요. 밀랍이 붙어 있었으니까요. 다이달로스는 가까운 섬에 내려앉았어요. 날개를 벗지 않은 채로 물에 들어가 깃털을 건졌어요. 두 손으로요. 손에 담기는 대로 다 건졌어요.</p><p>건져 든 깃털은 젖어서 무거웠어요. 다이달로스는 그것을 들고 모래밭에 앉았어요. 앉아서 아무 말도 하지 못했어요.</p><p>섬에는 무화과나무가 몇 그루 있었어요. 다이달로스는 그 밑에 앉아 있었어요. 그늘이 옮겨 가도 자리를 옮기지 않았지요.</p><p>사람들은 그 바다를 나중에 이카로스의 바다라고 불렀어요. 그 옆의 섬도 그렇게 불렀고요. 밤이 되자 물이 차올라 모래밭이 좁아졌어요. 다이달로스는 깃털을 한 줌씩 옮겨 놓았어요. 물이 닿지 않는 데까지요.</p><p>다이달로스는 그 뒤로 크레타섬에 돌아가지 않았어요. 미노스가 그 일을 잊었는지 어떤지도 알지 못했고요.</p><p>젖은 깃털 가운데 몇 개는 아직 밀랍이 묻어 있었어요. 다이달로스는 그것만 따로 놓았어요. 깃털을 다 펴 놓고 나니 모래밭에 새 한 마리 모양이 생겼어요. 다이달로스는 그것을 한참 보다가 손으로 흐트러뜨렸어요.</p><p>해가 기울 때까지 다이달로스는 그 자리에 있었어요. 날개는 벗어서 옆에 놓아두었지요. 젖은 깃털은 모래 위에 하나씩 펴 놓았어요. 마르면 다시 쓸 수 있는 것처럼요.</p></article></noscript>
