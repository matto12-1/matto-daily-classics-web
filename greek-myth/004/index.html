  <noscript><article class="ns-text"><h1>다시 나온 다섯</h1><h2>약을 아는 님프</h2><p>갈대가 서로 부딪히며 서걱서걱 소리를 냈어요. 물에서는 찬 기운이 올라왔지요. 어떤 이가 무릎까지 오는 물속을 걸어 다니며 풀뿌리를 캐고 있었어요. 제우스는 그 물가에 서서 한참을 기다렸어요.</p><p>제우스가 거기까지 오는 데는 여러 해가 걸렸어요. 산을 내려온 뒤로 곧바로 궁으로 가지 않았거든요. 강가에 사는 이들에게 물어보고, 숲에 사는 이들에게도 물어보았어요. 무엇을 물었느냐고요? 늘 같은 질문이었어요. 삼킨 것을 도로 나오게 하는 방법을 아느냐고요.</p><p>대부분은 웃으며 고개를 저었어요. 그런 걸 왜 묻느냐고 되묻는 이도 있었지요. 어떤 마을에서는 사흘을 묵으며 노인들의 이야기를 끝까지 들어 보기도 했어요. 그렇게 겨울이 몇 번이나 지나갔어요. 그러다 이 오래된 물가에 닿은 거예요.</p><p>풀뿌리를 캐는 그 님프는 세상에서 가장 지혜롭다는 말을 듣는 이였어요. 제우스는 그 앞에 앉아 자기가 누구인지, 무엇을 하려는지 처음부터 끝까지 이야기했어요. 님프는 풀뿌리를 다듬으면서 아무 말 없이 들었어요.</p><p>이야기가 끝나자 님프가 물었어요.</p><p>“다섯을 꺼내면 그다음은 어떻게 할 셈이지?”</p><p>제우스는 잠깐 말문이 막혔어요. 거기까지는 생각해 본 적이 없었거든요.</p><p>“모르겠어요. 일단 꺼내고 나서 같이 생각하려고요.”</p><p>님프는 그 대답에 처음으로 고개를 들었어요. 그리고 제우스를 오래 바라보았어요. 님프는 자리에서 일어나 물속으로 걸어 들어갔어요. 그러고는 바닥에서 무언가를 캐서 올라왔어요. 뿌리가 하얗고 잔털이 잔뜩 난, 손가락만 한 풀이었어요.</p><p>님프는 그것을 돌 위에 놓고 다른 돌로 오래오래 짓찧었어요. 즙이 배어 나오자 조그만 병에 담았어요. 돌과 돌이 부딪히는 소리가 물가에 오래 울렸어요. 제우스는 그 옆에 쪼그리고 앉아 하루를 꼬박 기다렸어요. 병 하나를 다 채우는 데 하루가 꼬박 걸렸지요.</p><p>“이걸 마시면 뱃속에 있는 것이 죄다 올라온다.”</p><p>님프가 병을 내밀며 말했어요.</p><p>“아주 쓰다. 그러니 그냥 주면 절대 안 마셔. 마시게 하려면 다른 것에 섞어야 해.”</p><p>“무엇에 섞어요?”</p><p>“그건 네가 알아내야지. 네 아버지가 무엇을 즐겨 마시는지는 내가 모르니까.”</p><p>제우스는 병을 받아 들었어요. 생각보다 훨씬 가벼웠어요. 이렇게 작은 것으로 세상에서 가장 힘센 이를 어떻게 한다는 게 믿기지 않았지요. 제우스는 병을 옷 안쪽 깊숙한 곳에 넣고 끈으로 단단히 묶었어요.</p><p>돌아서는 제우스의 등 뒤로 님프가 한마디를 덧붙였어요.</p><p>“한 가지만 기억해라. 힘이 센 쪽이 이기는 게 아니라, 마지막까지 생각한 쪽이 이긴단다.”</p><p>님프는 그 말만 남기고 다시 물속으로 걸어 들어가더니 뒤도 돌아보지 않았어요. 제우스는 그 말을 잊지 않았어요. 아주 오랜 뒤까지도요.</p><h2>잔을 나르는 사람</h2><p>제우스는 그길로 어머니를 찾아갔어요. 두 사람은 궁에서 한참 떨어진 올리브나무 아래에서 만났어요. 레아는 아들의 얼굴을 보자마자 알았어요. 준비가 끝났구나, 하고요. 아들은 지난번보다 한 뼘은 더 커져 있었어요.</p><p>“아버지는 무엇을 즐겨 드세요?”</p><p>“꿀물을 즐겨 드신다. 아침마다 한 잔씩.”</p><p>제우스는 품에서 병을 꺼내 보였어요. 레아는 그것을 오래 들여다보았어요. 손끝이 조금 떨렸지만 목소리는 흔들리지 않았어요.</p><p>“꿀물 잔을 나르는 일은 아무나 못 한다. 왕의 곁에 서는 자리니까. 내가 너를 궁에 시종으로 들여보내 주마.”</p><p>며칠 뒤, 궁에 새 시종이 하나 들어왔어요. 키가 크고 어깨가 넓은 젊은이였어요. 얼굴에는 재를 발라 두었고, 머리는 눈썹까지 내려오게 덮었어요. 아무도 그 젊은이가 누구인지 몰랐어요. 궁 안 사람들은 새 시종이 말수가 적다고만 여겼지요. 젊은이는 밤이면 부엌 한쪽 구석에서 눈을 붙였어요.</p><p>크로노스도 몰랐어요. 왕은 시종의 얼굴을 굳이 보지 않았거든요. 왕좌에 앉은 이들은 종종 그래요. 곁에 있는 사람일수록 오히려 얼굴을 잘 안 보게 되지요.</p><p>제우스는 사흘 동안 아무 일도 하지 않았어요. 그저 아침마다 꿀물을 날랐어요. 왕이 잔을 어떻게 드는지, 몇 모금에 비우는지, 다 마신 뒤 어디를 보는지를 눈에 담아 두면서요.</p><p>나흘째 아침이었어요. 궁은 여느 때와 똑같아 보였어요. 그날 무슨 일이 벌어질지 아는 사람은 아무도 없었지요.</p><p>제우스는 부엌에서 꿀물을 탔어요. 꿀을 평소보다 두 배로 넣었어요. 그리고 아무도 보지 않을 때 병을 기울여 그 즙을 부었어요. 잔 속에서 두 가지가 섞이며 잠깐 뿌옇게 흐려졌다가 다시 맑아졌어요.</p><p>잔을 든 손이 무거웠어요. 제우스는 복도를 걸으면서 숨을 고르게 쉬려고 애썼어요. 잔이 흔들리지 않도록 두 손으로 받쳐 들었지요. 복도 끝에서 파수를 서던 이가 크게 하품을 했어요.</p><p>크로노스는 그날따라 일찍 일어나 창가에 서 있었어요. 아침 해가 산등성이 위로 막 올라오는 참이었지요. 창밖에서는 안개가 천천히 걷히고 있었어요.</p><p>“오늘은 꿀물이 좀 늦었구나.”</p><p>“꿀이 굳어서 젓는 데 시간이 걸렸습니다.”</p><p>제우스가 대답했어요. 목소리가 갈라지지 않게 조심했어요. 크로노스가 돌아섰어요. 그리고 처음으로 시종의 얼굴을 똑바로 보았어요. 그 짧은 순간이 제우스에게는 아주 길게 느껴졌어요. 심장이 목까지 올라온 것 같았어요.</p><p>“너, 어디서 왔지?”</p><p>“동쪽 섬에서 왔습니다.”</p><p>“동쪽 섬이라.”</p><p>크로노스는 그 말을 한 번 되뇌더니 잔을 받아 들었어요. 그러고는 창밖으로 시선을 돌렸어요. 무언가 걸리는 게 있었지만, 그게 무엇인지 끝내 짚어 내지 못한 얼굴이었지요.</p><p>크로노스가 잔을 입에 댔어요. 한 모금. 왕은 미간을 살짝 찌푸렸어요. 오늘따라 꿀맛이 진하다고 생각했을 뿐이었지요.</p><p>두 모금. 창밖에서 새 한 마리가 날아올랐어요. 궁 안이 어찌나 조용한지 왕이 삼키는 소리까지 들릴 것 같았어요. 제우스는 침을 한 번 삼켰어요.</p><p>세 모금째에 왕은 잔을 다 비웠어요. 그리고 늘 하던 대로 잔을 뒤로 내밀었어요. 제우스가 두 손으로 그것을 받았어요.</p><p>처음에는 아무 일도 일어나지 않았어요. 크로노스는 왕좌 쪽으로 걸어갔어요. 두 걸음쯤 갔을 때 발이 멈췄어요.</p><p>“이게 무슨…….”</p><p>왕이 가슴께를 손으로 눌렀어요. 얼굴이 하얗게 질렸어요. 몸속에서 무언가가 밀려 올라오는 것을 왕은 느꼈어요. 아주 오래전에 삼킨 것들이, 한꺼번에요.</p><p>손에서 잔이 미끄러져 바닥에 굴렀어요. 크로노스가 무릎을 꿇었어요. 세상에서 가장 힘센 이가 무릎을 꿇는 모습을 본 사람은 그때까지 아무도 없었어요.</p><p>제우스는 뒤로 물러서지 않았어요. 그 자리에 그대로 서서, 이마를 덮고 있던 머리카락을 손으로 쓸어 올렸어요. 재를 바른 얼굴 아래로 눈이 드러났어요.</p><p>크로노스가 고개를 들었어요. 그리고 그 눈을 보았어요. 어디선가 본 적 있는 눈이었어요. 아주 오래전, 거울처럼 잔잔한 물에 비쳤던 자기 눈이었지요.</p><h2>돌이 먼저 나왔어요</h2><p>쿵. 가장 먼저 바닥으로 굴러떨어진 것은 회색 돌덩이였어요. 오랜 세월 파도에 씻겨 모서리가 둥글게 닳은 돌이었지요. 돌은 대리석 바닥을 두어 번 튀더니 기둥에 부딪혀 멈췄어요. 그 소리가 어찌나 크던지 궁의 벽이 한 번 울렸어요.</p><p>다섯을 삼킬 때마다 아무렇지 않은 척했던 세월이 한꺼번에 무너지는 소리 같았어요. 크로노스는 그것을 보고 눈을 크게 떴어요.</p><p>“이건…….”</p><p>그때 문이 열렸어요. 레아가 들어왔어요. 레아는 굴러 온 돌 앞으로 걸어가 무릎을 굽히고 그것을 두 손으로 안아 들었어요. 아주 조심스럽게요. 아기를 안듯이요.</p><p>“그날 저녁 내가 강보에 싸서 당신에게 건넨 것이 이 돌입니다.”</p><p>레아가 말했어요. 목소리가 궁 안에 낮게 울렸어요.</p><p>“여섯 번째 아이 대신에요.”</p><p>크로노스는 그제야 알았어요. 그날 저녁 강보가 왜 그렇게 묵직했는지를요. 레아는 여러 해 동안 이 돌을 생각했어요. 그것이 지금 제 발 앞에 굴러 와 있었지요.</p><p>크로노스는 대답하지 못했어요. 그럴 겨를도 없었어요. 몸속에서 또 무언가가 올라오고 있었으니까요. 이번에는 돌이 아니었어요.</p><p>제우스는 잔을 내려놓고 한 걸음 앞으로 나섰어요. 여러 해 동안 상상만 하던 순간이 눈앞에 와 있었어요. 손바닥이 축축했어요. 크레타섬 동굴에서 어머니의 이야기를 처음 듣던 밤보다 더 떨렸지요.</p><p>가장 먼저 걸어 나온 것은 여자아이였어요.</p><p>제일 먼저 삼켜졌으니 가장 오래 갇혀 있던 아이였지요. 그런데도 아이는 놀라거나 울지 않았어요. 옷자락을 천천히 매만지고, 궁 안을 한 바퀴 둘러본 다음, 꺼진 화로 앞으로 걸어가 그 앞에 조용히 섰어요. 이름은 헤스티아였어요.</p><p>그다음에 나온 아이는 나오자마자 창문 쪽으로 달려갔어요. 밖에 펼쳐진 들판을 보고는 두 손으로 입을 가렸지요. 그렇게 넓은 초록을 처음 본 거예요. 이름은 데메테르였어요.</p><p>세 번째로 나온 아이는 턱을 들고 똑바로 걸어 나왔어요. 그러고는 왕좌를 한 번, 크로노스를 한 번 보았어요. 눈길이 오래 머물렀어요. 이름은 헤라였어요.</p><p>네 번째는 남자아이였어요. 이 아이는 소리도 없이 나와서 기둥 그늘에 가만히 섰어요. 밝은 데로 나오기 싫은 사람처럼요. 이름은 하데스였어요.</p><p>마지막으로 나온 아이는 나오자마자 크게 숨을 들이쉬었어요. 그러고는 어디선가 들려오는 파도 소리를 향해 고개를 홱 돌렸어요. 이름은 포세이돈이었어요.</p><p>다섯은 갇힌 자리에서 자라기는 했지만, 햇빛은 한 번도 본 적이 없는 얼굴이었어요. 제우스는 그 이름들을 하나씩 마음속으로 따라 불러 보았어요.</p><p>다섯이 모두 무사했어요. 아무도 다치지 않았어요. 신은 그렇게 쉽게 사라지지 않는다던 어머니의 말이 맞았지요.</p><h2>여섯이 된 날</h2><p>궁 안에는 아직 달큼한 꿀 냄새가 남아 있었어요. 다섯은 서로를 바라보았어요. 그리고 자기들 앞에 서 있는 낯선 젊은이를 보았어요.</p><p>제우스가 먼저 입을 열었어요.</p><p>“제 이름은 제우스예요. 여섯 번째 아이고요.”</p><p>다섯은 그 이름을 그날 처음 들어 보았어요. 헤라가 눈을 가늘게 떴어요.</p><p>“여섯 번째라니. 우리는 다섯인데.”</p><p>“어머니가 저만 크레타섬에 숨기셨어요. 대신 저 돌을 강보에 싸서 보내셨고요.”</p><p>다섯의 눈이 일제히 레아에게로 향했어요. 레아는 돌을 안은 채로 고개를 끄덕였어요. 그러자 데메테르가 먼저 달려와 어머니의 팔을 붙잡았어요. 헤스티아가 그 뒤를 따랐고요.</p><p>헤라는 팔짱을 풀지 않았어요. 포세이돈도 그 자리에 그대로 서 있었어요.</p><p>“그럼 너 혼자 밖에서 컸다는 거네. 햇빛도 보고, 바다도 보고.”</p><p>“네.”</p><p>“우리가 갇혀 있는 동안에 너 혼자서 말이지.”</p><p>포세이돈은 코웃음을 쳤지만 눈은 자꾸 다른 데를 보고 있었어요. 제우스는 변명하지 않았어요. 대신 그냥 고개를 끄덕였어요. 포세이돈은 뭐라고 더 말하려다가 그만두었어요. 하데스가 그늘에서 나와 형의 어깨에 손을 얹었거든요.</p><p>그때 헤스티아가 조용히 말했어요.</p><p>“지금 우리끼리 따질 때가 아닌 것 같은데.”</p><p>모두가 헤스티아를 보았어요. 헤스티아는 왕좌 쪽을 턱으로 가리키고 있었어요. 크로노스가 몸을 일으키고 있었어요.</p><p>왕은 벽을 짚고 천천히 일어섰어요. 얼굴에는 아직 핏기가 없었지만, 눈에는 아까와 다른 것이 들어 있었어요. 벽에 손자국이 하얗게 남았어요.</p><p>왕은 자기 앞에 선 여섯을 하나씩 훑어보았어요. 그러다 여섯 번째에서 눈이 멈췄지요. 여섯은 아무도 물러서지 않았어요.</p><p>“그러니까 네가 레아가 숨긴 여섯 번째 아이였구나.”</p><p>그 목소리에는 아직도 왕의 무게가 남아 있었어요.</p><p>“네.”</p><p>“동쪽 섬에서 왔다고 했지. 거기서 자랐으니 거짓말은 아니었군.”</p><p>크로노스는 짧게 웃었어요. 웃음이라기보다는 숨을 내뱉는 소리에 가까웠어요.</p><p>“내가 너희를 삼킨 건 세상을 지키려던 것이다.”</p><p>“세상이 아니라 아버지의 왕 자리를 지키려던 거겠지요.” 제우스가 말했어요.</p><p>궁 안이 아주 조용해졌어요. 기둥 사이로 아침 햇빛이 길게 들어와 여섯의 발밑에 닿았어요. 헤스티아가 문 쪽을 오래 바라보았어요.</p><p>크로노스는 대꾸하지 않았어요. 대신 문 쪽으로 걸음을 옮겼어요. 그러고는 문지방에서 한 번 멈춰 서서, 뒤도 돌아보지 않은 채 말했어요.</p><p>“오늘 일은 여기서 끝이 아니다. 나에게는 형과 누나가 열하나 있다. 그들이 누구 편에 설 것 같으냐?”</p><p>문이 닫혔어요. 발소리가 복도 끝으로 멀어졌어요. 아무도 뒤쫓지 않았어요. 밖에서 새 떼가 한꺼번에 날아올랐어요.</p><p>궁에 여섯만 남았어요. 레아가 안고 있던 돌을 내려놓았어요. 돌은 바닥에 닿으며 둔탁한 소리를 냈어요. 그러고는 여섯을 한 번씩 바라보았어요. 다섯은 갓 나온 참이라 아직 햇빛에 눈이 부신 얼굴이었고, 하나는 방금 세상에서 가장 큰 일을 해낸 얼굴이었어요.</p><p>“나란히 서 보렴.” 레아가 말했어요.</p><p>여섯은 왠지 그 말을 따르고 싶어졌어요. 그래서 한 줄로 섰어요. 헤스티아, 데메테르, 헤라, 하데스, 포세이돈, 그리고 제우스. 여섯의 키가 제각각이어서 줄이 울퉁불퉁했어요.</p><p>창으로 들어온 빛이 여섯의 어깨를 나란히 비췄어요. 레아는 그 모습을 오래 보았어요. 여섯을 한자리에서 보는 것은 처음이었으니까요. 아주 오래 기다린 아침이었지요. 그 아침의 빛을 여섯은 오래도록 기억하게 돼요.</p><p>그때 창밖에서 소리가 났어요. 처음에는 멀리서 우르릉거리는 천둥 같았어요. 그런데 천둥은 한 번 치고 마는데, 이 소리는 그치지 않고 점점 커졌어요. 땅이 미세하게 흔들렸어요. 잔에 남아 있던 물이 동그란 무늬를 그리며 떨렸어요.</p><p>제우스가 창가로 뛰어갔어요. 포세이돈도 창틀을 짚고 몸을 내밀었어요. 헤라는 낮은 목소리로 아버지가 말한 열하나를 세어 보고 있었어요.</p><p>산 저편에서 무언가가 이쪽으로 오고 있었어요. 산등성이만 한 그림자들이었어요. 그 손에는 저마다 무기가 들려 있었지요.</p></article></noscript>
