  <noscript><article class="ns-text"><h1>저승을 울린 노래</h1><h2>삿대를 짚은 사람</h2><p>사공이 삿대를 들어 뱃머리를 강 쪽으로 돌려놓았어요. 오르페우스가 한 걸음 다가섰어요. 사공은 고개를 저었어요. 말은 하지 않았어요. 그 사공은 원래 말을 하지 않거든요.</p><p>“강 건너 저승으로 건너가야 합니다.”</p><p>사공은 오르페우스의 손을 보았어요. 뱃삯이 있어야 할 자리였지요. 그 손에는 리라뿐이었어요. 사공이 다시 고개를 저었어요. 그러고는 배에 올라 삿대를 물에 담갔어요. 배가 강 쪽으로 미끄러졌지요.</p><p>강가에 앉아 있던 사람들이 그것을 보았어요. 그 사람들도 다 저렇게 고개를 젓는 것을 보고 거기 앉게 된 이들이었어요. 그래서 아무도 놀라지 않았어요.</p><p>오르페우스는 물가로 다가가 손을 담가 보았어요. 손끝이 닿자마자 도로 뺐지요. 걸어서 건널 수 있는 물이 아니었어요.</p><p>그러고는 앉아 있는 사람들을 둘러보았어요. 어떤 이는 아주 오래 그러고 있었던 것 같았어요. 무릎에 얹은 손이 돌처럼 굳어 있었거든요. 그 손을 보고 오르페우스는 시선을 돌렸어요.</p><p>오르페우스는 강가에 앉았어요. 젖은 돌 위였어요. 그러고는 리라를 무릎에 올려놓았지요. 첫 줄을 튕겼을 때 삿대가 물속에서 멈췄어요.</p><p>오르페우스는 노래를 하지 않았어요. 줄만 튕겼어요. 낮은 소리 하나를 놓고, 그 위에 높은 소리 하나를 얹었어요. 그것을 몇 번이고 되풀이했지요.</p><p>서두르지 않았어요. 서두르면 소리가 얕아진다는 것을 알았거든요. 같은 것을 되풀이하는데도 조금씩 달라졌어요. 한 번 돌 때마다 아주 조금씩요.</p><p>이 강에서는 원래 아무 소리도 나지 않아요. 물살이 있는데도 그래요. 그래서 그 소리가 강 위에 통째로 얹혔어요. 부딪힐 것이 하나도 없었으니까요.</p><p>검은 물에는 아무 무늬도 생기지 않았어요. 그런데 배가 조금씩 강가 쪽으로 돌아왔어요. 사공이 미는 것도 아닌데요.</p><p>강가에 앉아 있던 사람들이 하나둘 고개를 들었어요. 일어서는 이도 있었지요. 그런데 아무도 배 쪽으로 다가오지는 않았어요. 다들 그 자리에서 듣기만 했어요.</p><p>배가 오르페우스 앞에 닿았어요. 사공은 오르페우스를 보지 않았어요. 삿대만 짚고 서 있었지요. 오르페우스가 배에 올랐어요. 배가 한 번 기울었다가 다시 바로 섰어요.</p><p>건너는 동안 아무도 말을 하지 않았어요. 강 한가운데에서 오르페우스가 뒤를 돌아보았어요. 방금 떠나온 강가가 벌써 안개에 묻혀 있었지요.</p><p>내리면서 오르페우스가 고개를 숙였어요.</p><p>“고맙습니다.”</p><p>사공은 고개만 까딱했어요. 그러고는 배를 도로 저쪽으로 밀었어요. 그 사공이 노래를 듣고 뱃머리를 돌린 것은 그날이 처음이었어요.</p><h2>문 앞의 세 머리</h2><p>건너편에 돌문이 하나 서 있었어요. 담장도 울타리도 없이 문만 덩그러니 서 있었지요. 그런데 그 문을 지나지 않고는 아무도 안으로 들어갈 수 없었어요.</p><p>문 앞에 무언가가 엎드려 있었어요. 처음에는 검은 바위인 줄 알았지요. 그것이 천천히 일어섰어요. 머리가 셋 달린 커다란 개였어요. 앉은키가 어른 키만 했어요. 목덜미의 갈기가 털이 아니라 검은 연기 같았지요. 이 문을 지키는 케르베로스예요.</p><p>케르베로스는 들어오는 이에게는 늘 순했어요. 냄새를 맡아 보고 문 옆으로 비켜서 주었지요. 나가려는 이에게만 달랐고요.</p><p>그런데 그날은 들어오는 이한테도 달랐어요. 세 머리가 한꺼번에 일어섰어요. 여섯 개의 눈이 오르페우스를 보았어요. 갈기의 연기가 부풀어 올랐지요. 짖지는 않았어요. 그저 보기만 했어요.</p><p>죽은 이에게서는 나지 않는 냄새가 났거든요. 숨 냄새요. 오르페우스는 멈춰 섰어요. 한 걸음 물러섰다가, 다시 그 자리에 앉았어요. 문 앞 돌바닥에요. 앉으니 케르베로스의 가운데 머리가 오르페우스보다 훨씬 높았어요.</p><p>“미안해요.”</p><p>오르페우스가 말했어요. 케르베로스는 알아듣지 못했을 거예요. 그래도 오르페우스는 한마디 더 했어요.</p><p>“저는 산 사람이라 여기 있으면 안 되는 거 알아요.”</p><p>그리고 줄을 튕겼어요. 왼쪽 머리가 먼저 귀를 내렸어요. 조금 있다가 가운데 머리가 앞발 위에 턱을 얹었지요. 오른쪽 머리는 끝까지 오르페우스를 노려보았어요. 눈을 한 번도 깜박이지 않았고요.</p><p>오르페우스는 그 머리를 보면서 줄을 튕겼어요. 소리를 조금씩 낮추었어요. 나중에는 아주 낮게요. 오른쪽 머리가 슬그머니 내려갔어요.</p><p>세 머리가 다 눈을 반쯤 감았어요. 개가 잠들기 전에 짓는 얼굴이었지요. 갈기의 연기도 가라앉았고요. 오르페우스는 일어섰어요. 그리고 문으로 걸어가면서 가운데 머리를 한 번 쓸어 주었어요. 털이 따뜻했어요.</p><p>케르베로스는 눈을 뜨지 않았어요. 나가려는 이였다면 그러지 않았을 거예요. 오르페우스는 들어가는 쪽이었으니까요.</p><p>케르베로스는 사나운 개가 아니에요. 문을 지키는 개일 뿐이지요. 그런데 그날 그 문 앞에 선 것은 그 개가 여태 한 번도 만나 본 적이 없는 손님이었어요.</p><p>문 안쪽에서 서늘한 공기가 흘러나왔어요. 나쁜 냄새는 나지 않았어요. 비 오기 전에 돌에서 나는 냄새 같은 것이 났지요.</p><p>오르페우스는 문지방 앞에서 잠깐 섰어요. 골짜기를 잘못 들어선 산 사람이 강가까지 내려온 적은 있다고 해요. 심부름 하나를 받아 이 문지방을 넘었다가 그대로 돌아 나간 사람도 있었고요. 그런데 두고 온 사람을 데리러 넘은 산 사람은 여태 하나도 없었어요.</p><p>“들어갑니다.” 오르페우스가 아주 작게 말했어요. 누구한테 하는 말인지는 자기도 몰랐어요.</p><p>오르페우스는 넘었어요.</p><h2>노래가 지나간 들판</h2><p>문 안쪽은 조용했어요. 아주 넓은 들판이 펼쳐져 있었어요. 낮은 언덕이 몇 개 있고, 그 사이로 좁은 물길이 흘렀지요. 어디에도 담이 없었어요.</p><p>하늘은 없었어요. 대신 아주 높은 곳에 희끄무레한 빛이 넓게 깔려 있었지요. 아침도 저녁도 아닌 빛이었어요. 그래서 그 나라에는 그림자가 지지 않았어요.</p><p>사람들이 여기저기 앉아 있었어요. 물가에 발을 담근 사람, 언덕에 누운 사람, 낮은 목소리로 이야기를 나누는 사람들이요. 이 나라에서는 아무도 서두르지 않아요. 서두를 일이 없거든요.</p><p>오르페우스는 걸으면서 줄을 튕겼어요. 물가에 발을 담그고 있던 사람이 고개를 들었어요. 언덕에 누워 있던 사람이 팔꿈치를 짚고 일어났어요. 이야기를 나누던 이들이 말을 멈췄지요.</p><p>한 사람이 자기 옆자리를 손바닥으로 쓸어 주었어요. 앉으라는 뜻이었어요. 오르페우스는 고개를 숙여 보이고 그냥 지나갔지요.</p><p>좁은 물길 옆에 노인 하나가 앉아 있었어요. 무릎에 무언가를 올려놓고 있었지요. 반쯤 이어진 그물이었어요. 여기서는 그물을 다 이을 수도 없고 이어 봐야 쓸 데도 없는데, 그 노인은 그러고 있었어요.</p><p>노인이 고개를 들고 오르페우스를 보았어요. 그러고는 다시 그물을 내려다보았지요. 손이 조금 빨라졌어요.</p><p>“저승 사람이 아니구먼. 산 사람이야.” 노인이 그물에서 눈을 떼지 않고 말했어요.</p><p>오르페우스는 걸음을 멈추지 않았어요. 노인도 더 묻지 않았고요. 아무도 따라오지는 않았어요. 다만 다들 그쪽을 보고 있었어요. 이 나라에서 무언가를 오래 바라보는 일은 아주 드물거든요.</p><p>오르페우스는 걸으면서 얼굴을 하나씩 보았어요. 앉아 있는 이가 아주 많았어요. 언덕에도, 물가에도, 좁은 물길 옆에도요. 얼굴이 다들 비슷해 보였어요. 여기서는 조금씩 옅어지거든요.</p><p>들꽃 화관을 쓴 사람은 보이지 않았어요. 오르페우스는 걸음을 늦추지 않았어요. 하나하나 찾아다니다가는 여기서 늙어 버릴 테니까요.</p><p>들판 저쪽 낮은 언덕에 꽃이 피어 있었어요. 잿빛이 아닌 꽃이었어요. 붉은 것도 있고 노란 것도 있었지요. 오르페우스는 그 앞을 지나면서 걸음을 늦추었어요. 이 나라에 들어온 뒤로 처음 보는 색이었으니까요. 누가 심어 놓은 것 같았어요. 물을 준 자국도 있었고요.</p><p>언덕 너머에 검은 돌로 지은 궁이 서 있었어요. 크기는 컸지만 꾸민 데가 하나도 없었어요. 기둥에 무늬도 없고 문에 장식도 없었지요.</p><p>궁 앞 계단에 두 사람이 앉아 있었어요. 잿빛 망토를 두르고 무릎에 나무판을 올려놓은 사람과, 그 옆에 앉은 젊은 여자였어요.</p><p>하데스와 페르세포네였어요. 오르페우스는 계단 쪽으로 다가가면서 줄에서 손을 뗐어요. 여기서부터는 소리 없이 가야 할 것 같았거든요. 발소리만 돌바닥에서 났어요.</p><h2>계단 앞에서 부른 노래</h2><p>하데스가 고개를 들었어요. 나무판에 무언가를 적던 손은 그대로 두고요.</p><p>“산 사람이구나.” 하데스가 말했어요.</p><p>“네.”</p><p>“이 나라의 규칙을 아느냐?”</p><p>“압니다.”</p><p>“알면서 산 사람이 여기는 왜 왔지?”</p><p>“제 아내 에우리디케를 데리러 왔습니다.”</p><p>하데스는 그 말에 곧바로 대답하지 않았어요. 그 말을 이 나라에서 들은 적이 딱 한 번 있었거든요. 그때는 헤르메스가 위에서 내려와 그 말을 했지요.</p><p>“여기 온 죽은 이가 다시 나간 적은 없다.”</p><p>“압니다.”</p><p>“그런데도 왔구나.”</p><p>오르페우스는 더 대답하지 않았어요. 대신 리라를 들어 올렸어요. 그러고는 이번에는 노래를 했어요. 노래는 길지 않았어요. 이런 말이 들어 있었지요.</p><p>“저는 되돌려 달라고 온 것이 아닙니다.”</p><p>“그이를 잠시 빌리러 왔습니다.”</p><p>“그이는 언젠가 다시 여기로 옵니다. 저도 옵니다. 여기 것은 하나도 줄지 않습니다.”</p><p>“그이는 여기 것을 아직 하나도 먹지 않았습니다.”</p><p>“그이가 다시 올 그날까지만 빌려주십시오.”</p><p>노래는 거기서 끝났어요. 페르세포네가 자기 손을 내려다보았어요. 노래를 들은 이들 가운데 몇은 자기가 두고 온 것을 떠올렸어요. 이 문을 지나고 나면 그런 것이 잘 떠오르지 않는데, 그날은 떠올랐지요.</p><p>들판이 조용해졌어요. 원래 조용한 나라인데 그 조용함은 여느 때와 달랐어요. 아무 소리도 나지 않는 것과, 다들 소리를 내지 않는 것은 다르거든요.</p><p>앉아 있던 이들이 하나같이 이쪽을 보고 있었어요. 문 앞에서는 케르베로스가 세 머리를 다 들고 있었고요. 나무판에 무언가를 적던 하데스의 손이 멈춰 있었어요. 언제부터 멈춰 있었는지는 하데스 자신도 몰랐지요.</p><p>한참 동안 아무도 말을 하지 않았어요. 하데스는 들판을 한참 둘러보았어요. 여기 앉아 있는 이들은 다들 누군가가 기다리다 지친 이들이에요. 하데스는 그 수를 알고 있었어요. 나무판에 적혀 있는 것이 그 수였으니까요.</p><p>페르세포네가 계단에서 일어섰어요.</p><p>“저 두 사람을 위로 보내 주십시오.”</p><p>하데스는 대답하지 않았어요. 나무판만 내려다보고 있었지요.</p><p>“헤르메스가 저를 데리러 내려왔던 날, 저는 다 올라와서 한 번 뒤를 돌아본 적이 있습니다.” 페르세포네가 말했어요. “아무한테도 말하지 않았습니다.”</p><p>하데스가 고개를 들어 페르세포네를 보았어요. 그건 처음 듣는 이야기였거든요. 페르세포네는 하데스를 보지 않았어요. 자기가 물을 주던 언덕 쪽을 보고 있었어요. 붉은 꽃과 노란 꽃이 피어 있는 자리요.</p><p>“그 뒤로 저는 그 이야기를 한 번도 하지 않았습니다. 어머니한테도요.”</p><p>하데스는 나무판을 다시 내려다보았어요.</p><p>“여기 있는 이들 가운데 저 사람을 기다리는 이가 하나 있습니다. 누군가를 두고 와서 기다리는 마음이 어떤 것인지 저는 압니다.” 페르세포네가 말했어요.</p><p>“딱 한 번만 보내 주시면 됩니다.”</p><p>하데스는 오래 앉아 있었어요. 그동안 그 앞에서 아무도 움직이지 않았어요.</p><h2>뒤를 돌아보지 마라</h2><p>하데스가 무릎에서 나무판을 내려 계단에 놓았어요. 그 나무판이 하데스의 손에서 떠나 있는 것을 본 사람은 그때까지 아무도 없었지요.</p><p>“네 아내를 데려가거라.”</p><p>오르페우스가 계단 아래에서 무릎을 굽히려고 했어요. 하데스가 손을 들어 막았어요. 이 나라에서는 아무도 누구 앞에서도 무릎을 꿇지 않거든요.</p><p>“조건이 하나 있다.”</p><p>“말씀하십시오.”</p><p>“네가 앞서 걸어라. 저 아이는 네 뒤를 따라간다.”</p><p>“네.”</p><p>“문 밖으로 나가 햇빛을 볼 때까지 한 번도 뒤를 돌아보지 마라. 한 번이라도 돌아보면 그 아이는 여기로 돌아온다.”</p><p>오르페우스는 고개를 끄덕였어요. 그리고 하나만 물었어요.</p><p>“아내가 뒤따라오는 발소리가 들립니까?”</p><p>하데스는 잠깐 뜸을 들였어요.</p><p>“들리지 않는다.”</p><p>하데스가 문 쪽을 향해 고개를 한 번 끄덕였어요. 그것 말고는 아무 신호도 없었어요. 한참 뒤에 문 안쪽 어딘가에서 누가 걸어 나왔어요. 들꽃 화관을 쓴 사람이었어요. 화관은 시들지 않았어요. 여기서는 시드는 일도 없거든요.</p><p>걸음이 조금 느렸어요. 발목 때문이었지요. 그래도 걸어왔어요. 오르페우스가 몸을 돌리려고 했어요.</p><p>“아직 돌아보면 안 된다.”</p><p>오르페우스는 그 자리에서 굳었어요. 그러고는 앞만 보았어요. 눈앞에는 검은 돌 벽뿐이었어요. 무늬가 하나도 없어서 볼 것도 없는 벽이었지요.</p><p>페르세포네가 에우리디케에게 다가가 무언가를 낮게 일러 주었어요. 에우리디케가 고개를 끄덕였어요. 그러고 나서 페르세포네는 계단으로 돌아와 앉았어요. 하데스 옆자리였어요.</p><p>오르페우스가 걷기 시작했어요. 들판을 지났어요. 앉아 있던 이들이 하나씩 일어섰어요. 여기서 나가는 사람을 보는 것은 그들도 처음이었거든요. 아무도 소리를 내지 않았어요. 다만 다 일어서 있었지요.</p><p>물길 옆의 노인도 일어섰어요. 그물은 무릎에 그대로 얹어 둔 채로요. 앉아 있던 이들 눈에는 두 사람이 아니라 한 사람이 지나가는 것처럼 보였어요. 발소리가 하나였으니까요.</p><p>문을 지났어요. 케르베로스는 일어나지 않았어요. 세 머리 가운데 하나만 눈을 떴다가 도로 감았지요. 오르페우스는 가운데 머리를 한 번 더 쓸어 주려다가 그만두었어요. 몸을 숙이면 뒤가 보일 것 같았거든요.</p><p>강가로 내려갔어요. 사공이 배를 대 주었어요. 오르페우스가 올라탈 때 배가 한 번 기울었어요. 그러고 조금 있다가 또 한 번 기울었지요.</p><p>오르페우스는 배가 두 번째로 기우는 것을 느꼈어요. 뒤를 보지는 않았고요. 강을 건너고, 잿빛 들판을 지나고, 골짜기 오르막에 들어섰어요. 발밑이 자갈이었어요.</p><p>자갈 위에서 발소리가 났어요. 하나였어요. 오르페우스는 그 소리를 세면서 걸었어요. 하나, 둘, 셋. 세는 것 말고는 할 수 있는 일이 없었거든요.</p></article></noscript>
