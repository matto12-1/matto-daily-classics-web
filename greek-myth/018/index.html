        <div class="recap"><h3>지난 이야기</h3><ol><li>프로메테우스는 사람들에게 불을 가져다준 일로 세상 끝 바위에 묶였어요.</li><li>사과하면 풀어 주겠다는 말에도 프로메테우스는 고개를 젓고, 당신도 언젠가 그 자리를 걱정하게 될 거라는 말을 남겼지요.</li><li>제우스는 대장간으로 내려가 헤파이스토스에게 사람에게 줄 선물을 하나 만들라고 시켰어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>신들이 만든 선물</h1><h2>대장간에 내려온 손님</h2><p>화덕 속 숯이 한 번 붉게 밝아졌다가 다시 사그라들었어요. 제우스는 벌써 문간을 나서고 있었지요.</p><p>“선물을 무엇으로 만들까요?” 헤파이스토스가 그 등에 대고 물었어요.</p><p>제우스가 걸음을 멈추었어요.</p><p>“흙으로 만들어라.”</p><p>헤파이스토스는 잠깐 아무 말도 하지 못했어요. 쇠도 아니고 청동도 아니고 흙이라니요. 대장간에서 흙은 거푸집을 뜰 때나 쓰는 것이었어요. 그것도 다 쓰고 나면 부수어 버리는 것이었지요.</p><p>“흙으로 무엇을 만듭니까?”</p><p>“사람을 하나 만들어라.” 제우스가 말했어요. “지금까지 땅 위에 없던 사람으로.”</p><p>대장간은 늘 시끄러운 곳이었어요. 풀무가 울고 쇠가 울고 바닷바람이 문을 두드렸으니까요. 그런데 그 순간만은 아무 소리도 나지 않았어요.</p><p>헤파이스토스는 앞치마에 손을 닦으며 아버지의 얼굴을 살폈어요. 화덕 불빛이 두 사람 사이에서 흔들렸어요. 그 눈은 웃고 있지 않았어요.</p><p>“그 사람을 무엇에 쓰시려고요?”</p><p>“사람에게 줄 선물이라 하지 않았느냐.”</p><p>헤파이스토스는 그 말이 대답이 아니라는 것을 알았어요. 그래도 더 묻지 않았어요. 아버지가 저런 목소리로 말할 때는 물어도 소용이 없다는 것을 알고 있었으니까요.</p><p>제우스는 이번에는 정말로 문턱을 넘었어요. 그런데 한 발을 내디딘 채 멈춰 서서 이렇게 덧붙였지요.</p><p>“아주 곱게 만들어라. 보는 사람이 눈을 떼지 못하도록.”</p><p>문이 닫히고 나서도 헤파이스토스는 한참 그 자리에 서 있었어요. 화덕에서 숯이 폭 하고 내려앉는 소리가 났어요.</p><p>모루 위에 놓인 망치가 아직 따뜻했어요. 헤파이스토스는 그것을 집었다가 도로 내려놓았어요. 오늘 쓸 연장이 아니었으니까요.</p><p>그날 밤 헤파이스토스는 강가로 내려가 흙을 퍼 왔어요. 손가락 사이로 부드럽게 빠져나가는, 물기를 머금은 검은 흙이었어요.</p><p>대장간 한쪽에 흙을 쌓고 물을 부어 개었어요. 쇠를 다루던 손이라 처음에는 자꾸 힘이 들어갔어요. 흙은 쇠와 달라서 세게 누르면 그냥 뭉개져 버렸지요.</p><p>헤파이스토스는 힘을 뺐어요. 그러고는 아주 천천히 만들기 시작했어요. 발부터 만들었어요. 걸어 다닐 발이었으니까요. 발바닥을 평평하게 다듬고 발가락을 하나씩 붙였어요. 자기 다리가 성치 않아서인지, 발을 만드는 데 유난히 오래 걸렸어요.</p><p>그다음에 다리와 허리를 세우고, 어깨를 얹고, 두 팔을 붙였어요. 손가락은 하나하나 따로 빚었어요. 열 개를 다 만드는 데만 꼬박 하루가 걸렸지요.</p><p>마지막이 얼굴이었어요. 헤파이스토스는 얼굴 앞에서 오래 망설였어요. 어떤 얼굴이어야 하는지 아무도 알려 주지 않았거든요.</p><p>결국 자기가 본 것 가운데 가장 좋았던 것들을 떠올렸어요. 아침에 잔잔한 바다, 화덕에서 갓 꺼낸 쇠의 빛깔, 파도가 밀려 나간 뒤의 젖은 모래.</p><p>사흘째 되던 날 저녁, 흙으로 빚은 것이 다 되었어요. 다 자란 사람의 모습이었어요. 눈은 감겨 있었고, 몸에서는 젖은 흙 냄새가 났지요.</p><p>헤파이스토스는 그 앞에 앉아 오래 바라보았어요. 손이 조금 떨렸어요. 여기까지는 만들 수 있었지만, 그다음은 자기 일이 아니라는 생각이 들었거든요.</p><p>그래도 아버지가 시킨 일이었어요. 헤파이스토스는 화덕에서 숯 하나를 집어 가슴께에 가만히 대었어요. 그리고 숨을 한 번 불어넣었어요.</p><p>흙이 따뜻해졌어요. 빛깔이 돌았어요. 가슴이 한 번 올라갔다가 내려왔어요. 그러고는 눈이 떠졌어요. 헤파이스토스는 저도 모르게 한 걸음 물러섰어요. 여러 해 동안 온갖 것을 만들어 왔지만, 자기가 만든 것이 자기를 마주 본 적은 한 번도 없었으니까요.</p><p>“괜찮아요.”</p><p>그 사람이 먼저 말했어요. 아니, 말이라기보다는 숨을 고르는 소리에 가까웠지요. 그래도 헤파이스토스는 그 말을 알아들었어요.</p><p>밤새 화덕만 조용히 탔어요. 헤파이스토스는 그 옆에 앉아 아침을 기다렸어요. 이 사람을 어떻게 해야 하는지 아는 이가 자기 말고 또 있을 것 같았거든요.</p><h2>신들이 저마다 하나씩</h2><p>이튿날 아침, 신들이 대장간으로 내려왔어요. 제우스가 부른 것이었지요. 신들은 흙에서 나온 사람을 빙 둘러섰어요. 아무도 먼저 말을 꺼내지 않았어요. 그 사람은 무서워하지도 않고 부끄러워하지도 않는 얼굴로 신들을 하나하나 마주 보았어요.</p><p>아테나가 먼저 앞으로 나왔어요. 손에는 짜다 만 천 한 자락이 들려 있었지요.</p><p>“이 천으로 옷을 지어 줄게요.”</p><p>아테나는 그 천으로 옷을 지어 입히고 허리에 띠를 매어 주었어요. 그러고는 손을 잡아 손바닥을 펴 보았어요. 굳은살 하나 없는 새 손이었지요.</p><p>“베 짜는 법을 알려 줄게요. 실을 잣는 법도요. 한 번 배우면 평생 쓰는 손재주예요.”</p><p>아테나가 손가락을 몇 번 움직여 보였어요. 그 사람이 그대로 따라 했어요. 한 번 보고 그대로 따라 하는 것을 보고 아테나가 눈썹을 살짝 올렸어요.</p><p>다음은 아프로디테였어요. 아프로디테는 손에 들꽃을 한 줌 들고 왔어요. 걸어오면서 그것을 엮더니, 동그란 관을 만들어 머리에 씌워 주었지요.</p><p>그러고는 가까이 다가와 얼굴을 한참 들여다보다가 이마에 손을 얹었어요. 그러자 그 자리에 있던 신들이 모두 숨을 멈췄어요. 달라진 것은 아무것도 없는데, 아무도 눈을 뗄 수가 없었거든요.</p><p>마지막으로 헤르메스가 왔어요. 헤르메스는 팔짱을 끼고 한 바퀴 돌아보더니 씩 웃었어요.</p><p>“다들 좋은 걸 주셨네요. 그런데 말을 못 하면 아무 소용이 없지요.”</p><p>헤르메스가 손가락으로 입술을 톡 건드렸어요.</p><p>“안녕하세요.”</p><p>그 사람이 말했어요. 목소리가 맑았어요. 신들이 그만 웃음을 터뜨렸지요. 그날처럼 대장간이 시끄러웠던 적은 없었어요.</p><p>“이름이 있어야지요.” 헤르메스가 말했어요. “모두에게서 하나씩 받았으니, 판도라라고 부릅시다.”</p><p>모두에게서 선물을 받은 사람이라는 뜻이었어요. 판도라는 그 이름을 한 번 소리 내어 불러 보았어요. 자기 이름을 자기 입으로 부르는 건 이상한 일이었지요.</p><p>헤파이스토스는 조금 떨어진 자리에서 그것을 보고 있었어요. 신들이 하나씩 다녀갈 때마다 판도라의 얼굴이 조금씩 달라졌어요. 처음 눈을 떴을 때의 얼굴은 이제 남아 있지 않았어요.</p><p>신들이 다 돌아가고 나서, 판도라는 대장간 밖으로 나가 보았어요. 바닷가였어요. 파도가 밀려왔다가 밀려갔어요.</p><p>판도라는 그 자리에 서서 파도를 오래 보았어요. 밀려왔다가 밀려가고, 또 밀려왔다가 밀려갔어요. 왜 저러는지 알 수가 없었지요.</p><p>“저건 왜 저래요?”</p><p>뒤따라 나온 헤파이스토스에게 판도라가 물었어요.</p><p>“바다니까요.”</p><p>“그건 대답이 아니잖아요.”</p><p>헤파이스토스는 잠깐 웃었어요. 웃는 건 아주 오랜만이었어요. 그날 하루 판도라는 묻고 또 물었어요. 저 새는 왜 저기 앉아 있느냐고, 물은 왜 짜냐고, 불은 왜 손을 대면 아프냐고요. 헤파이스토스는 아는 것은 알려 주고 모르는 것은 모른다고 했어요.</p><p>저녁이 되자 판도라가 화덕 앞에 앉았어요. 불을 아주 가까이에서 들여다보았지요.</p><p>“불은 안 만져 볼게요.”</p><p>“왜요?”</p><p>“아까 아프다고 하셨잖아요.”</p><p>헤파이스토스는 고개를 끄덕였어요. 그러고는 문득 이런 생각을 했어요. 이 사람은 하지 말라고 하면 하지 않는 사람이구나, 하고요.</p><p>그런데 판도라는 곧 이렇게 덧붙였어요.</p><p>“그래도 왜 아픈지는 알고 싶어요.”</p><h2>열지 말라던 항아리</h2><p>신들이 다 돌아간 뒤에 제우스가 왔어요. 손에는 항아리가 하나 들려 있었어요. 크지 않은 항아리였어요. 두 팔로 안으면 딱 안길 만한 크기에, 겉에는 아무 무늬도 없었지요. 뚜껑은 벌이 만든 누런 밀랍으로 꼭 봉해져 있었어요.</p><p>제우스는 그것을 판도라에게 건넸어요.</p><p>“이건 네 것이다. 어디를 가든 지니고 다니거라.”</p><p>판도라는 두 팔로 항아리를 받아 안았어요. 생각보다 가벼웠어요. 안에서 아무 소리도 나지 않았지요.</p><p>“안에 무엇이 들었나요?”</p><p>“그건 몰라도 된다.”</p><p>“그럼 무엇에 쓰는 건가요?”</p><p>“쓰는 것이 아니다.” 제우스가 말했어요. “지니고만 있으면 된다. 절대 열지 마라.”</p><p>판도라는 고개를 들었어요.</p><p>“왜요?”</p><p>제우스는 대답하지 않았어요. 대신 판도라의 머리에 손을 한 번 얹었다가 거두었지요. 그러고는 뒤도 돌아보지 않고 산으로 올라갔어요.</p><p>묻지도 못하게 하고 열지도 말라고 하는 건, 아무리 신이라 해도 좀 짓궂었지요. 판도라는 항아리를 안은 채 한참 서 있었어요. 밀랍으로 봉한 자리가 손끝에 만져졌어요. 매끈하고 서늘했어요.</p><p>헤파이스토스가 다가와 그 항아리를 들여다보았어요. 그러고는 얼굴이 조금 굳었어요.</p><p>“이건 제가 만든 게 아닌데요.”</p><p>“누가 만든 건가요?”</p><p>헤파이스토스는 대답하지 못했어요. 그 항아리에는 손자국이 하나도 없었거든요. 무엇을 만들든 만든 이의 손자국이 어딘가에는 남는 법인데요.</p><p>“그럼 이 항아리는 어디서 왔을까요?”</p><p>“글쎄요. 저는 쇠와 흙밖에 모릅니다.”</p><p>판도라는 항아리를 다시 안았어요. 이번에는 아까보다 조금 무겁게 느껴졌어요. 그럴 리가 없는데도 그랬지요.</p><p>헤파이스토스는 그날 밤 대장간 문을 오래 닫지 못했어요. 바다 쪽에서 바람이 들어왔다 나갔다 했어요. 자기가 만든 것을 남의 손에 보내는 일이 처음이었거든요.</p><p>다음 날 헤르메스가 판도라를 데리러 왔어요. 땅으로 내려가는 길을 훤히 아는 신은 헤르메스뿐이었거든요.</p><p>두 사람은 구름 사이로 난 길을 따라 걸어 내려갔어요. 판도라는 항아리를 옆구리에 끼고 걸었어요. 날개 달린 신발이 판도라보다 반 걸음 앞서 갔지요.</p><p>“우리는 어디로 가나요?”</p><p>“좋은 집이야. 마음씨 좋은 사람이 살아.”</p><p>“그 사람이 저를 기다리고 있나요?”</p><p>헤르메스는 대답 대신 하늘을 한 번 올려다보았어요. 구름이 걷히자 아래가 보였어요. 들판이 있고 강이 있고, 지붕들이 옹기종기 모인 마을이 있었어요. 굴뚝마다 연기가 한 줄씩 올라오고 있었지요.</p><p>프로메테우스가 가져다준 불이 아직 꺼지지 않은 거예요. 판도라는 걸음을 멈추고 그것을 내려다보았어요. 저렇게 많은 사람이 사는 줄은 몰랐거든요. 어떤 굴뚝에서는 연기가 곧게 올라갔고, 어떤 굴뚝에서는 비뚤비뚤 올라갔어요.</p><p>“저 사람들도 저처럼 흙으로 만들어졌나요?”</p><p>“아니. 저 사람들은 세상이 생길 때부터 저기 있었어.”</p><p>“그럼 저는 왜 만들어졌어요?”</p><p>헤르메스는 이번에도 대답하지 않았어요. 다만 걸음을 조금 빨리했지요. 헤르메스는 원래 말이 많은 신이었어요. 아무하고나 금방 친해지고, 걸으면서 쉬지 않고 떠드는 신이었지요. 그런데 그날은 이상하게 말수가 적었어요.</p><p>헤르메스는 얼마 전에도 이 길을 내려왔거든요. 그때는 바위에 묶인 이의 말을 전하러 갔었지요. 오늘은 그 말대로라면 받아선 안 될 것을 들고 내려가는 중이었고요.</p><p>판도라는 그 뒷모습을 보며 걸었어요. 어제부터 오늘까지 신들은 모두 판도라에게 무언가를 주었는데, 왜 주는지는 아무도 말해 주지 않았어요.</p><p>산길이 끝나 갈 무렵 판도라가 또 물었어요.</p><p>“이 안에 든 게 나쁜 건가요?”</p><p>“나는 심부름꾼이야.” 헤르메스가 말했어요. “들고 가는 항아리 안에 뭐가 들었는지는 몰라.”</p><p>그러고는 조금 걷다가 혼잣말처럼 덧붙였어요.</p><p>“그래도 나라면 안 열겠어.”</p><p>산을 다 내려왔을 때 헤르메스가 걸음을 멈추었어요. 저만치 언덕 아래에 흰 벽에 붉은 지붕을 얹은 집 한 채가 보였어요.</p><p>“네가 갈 곳이 저 집이야.”</p><p>“같이 안 가세요?”</p><p>“나는 여기까지만 데려다줄게.” 헤르메스가 말했어요. 그러고는 한마디를 덧붙였어요. “그 항아리, 잘 지니고 있어.”</p><p>판도라가 뒤를 돌아보았을 때 헤르메스는 이미 없었어요. 풀밭에 발자국 두 개만 남아 있었지요. 판도라는 언덕을 내려가 그 집 앞에 섰어요. 문을 두드리자 에피메테우스가 나왔어요. 손에는 반쯤 만들다 만 무언가가 들려 있었지요.</p><p>에피메테우스는 판도라를 보고 눈이 동그래졌어요. 그러고는 활짝 웃었어요.</p><p>에피메테우스에게는 형이 하나 있었어요. 세상 끝 바위에 묶여 있는 형이었지요. 얼마 전에 헤르메스가 그 형의 말을 전해 주고 갔어요. 제우스가 주는 선물은 무엇이든 받지 말라고요. 아무리 좋아 보여도, 특히 좋아 보이면 더요.</p><p>에피메테우스는 그 말을 기억하고 있었어요. 분명히 기억하고 있었는데, 문 앞에 서 있는 사람을 보는 순간 그 말이 어디론가 사라져 버렸어요.</p><p>“들어오세요. 마침 저녁을 짓던 참이었어요.”</p><p>집 안은 따뜻했어요. 벽에는 만들다 만 물건들이 잔뜩 걸려 있었어요. 에피메테우스는 어디에 앉혀야 할지 몰라 의자를 세 번이나 옮겼지요.</p><p>두 사람은 늦게까지 이야기를 나누었어요. 에피메테우스는 자기가 만들다 만 물건들을 하나씩 꺼내 보여 주었고, 판도라는 그것을 하나하나 만져 보았어요.</p><p>“그 항아리는 뭐예요?”</p><p>에피메테우스가 문가에 세워 둔 항아리를 가리켰어요.</p><p>“뭐가 들었는지 모르겠어요. 제우스께서 그냥 지니고 있으라고 하셨어요.”</p><p>“열어 보면 되잖아요.”</p><p>“절대 열지 말라고 하셨어요.”</p><p>에피메테우스는 어깨를 으쓱했어요. 그러고는 방 한가운데, 볕이 잘 드는 자리를 손으로 가리켰어요.</p><p>“그럼 저기 두세요. 저기가 우리 집에서 제일 좋은 자리예요.”</p><p>판도라는 항아리를 그 자리에 내려놓았어요. 밀랍으로 봉한 뚜껑이 저녁 햇빛을 받아 노랗게 빛났어요. 밤이 깊어 등불을 껐어요. 창으로 달빛이 들어와 방바닥에 네모난 자리를 만들었어요. 그 네모 안에 항아리가 딱 들어앉아 있었지요.</p><p>에피메테우스는 금방 잠이 들었어요. 원래 걱정을 오래 붙들고 있지 못하는 사람이었으니까요. 판도라는 조금 더 깨어 있었어요. 신들이 하나씩 준 것들을 손끝으로 세어 보았지요. 옷과 띠, 손재주, 들꽃으로 엮은 관, 말하는 법. 그리고 하나 더.</p><p>그날 밤 그 집에서 가장 조용한 것은, 방 한가운데 놓인 그 항아리였어요.</p></article></noscript>
