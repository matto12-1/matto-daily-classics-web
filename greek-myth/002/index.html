  <noscript><article class="ns-text"><h1>아기를 삼키는 왕</h1><h2>왕이 된 뒤에도</h2><p>크로노스는 그날 밤에도 눈을 떴어요. 별이 가득한 하늘이 천장처럼 내려다보고 있었어요. 크로노스는 이불을 끌어올려 귀를 덮어 보았어요. 그래도 소용이 없었어요. 그 목소리는 바깥이 아니라 안쪽에서 들려왔으니까요.</p><p>너도 언젠가 네 아들의 손에 그 자리를 빼앗기게 될 것이다. 아버지 우라노스가 물러나면서 남긴 말이었지요. 왕이 된 뒤로 크로노스는 밤마다 그 말을 다시 들었어요.</p><p>겉으로 보기에 세상은 조용했어요. 들판에서는 풀이 잘 자랐고, 강물은 넘치지도 마르지도 않았어요. 티탄들은 저마다 맡은 자리에서 세상을 돌보았지요. 더 바랄 것이 없는 시절 같았어요.</p><p>날이 밝으면 크로노스는 아무렇지 않은 얼굴로 왕좌에 앉았어요. 누구도 그 눈 밑에 앉은 그늘을 입 밖에 내지 않았어요. 땅속에 갇힌 동생들 이야기를 꺼내는 이도 없었어요. 크로노스가 그 이야기를 몹시 싫어한다는 것을 다들 알고 있었거든요.</p><p>이따금 크로노스는 왕좌에 앉은 채로 고개를 들어 하늘을 오래 올려다보았어요. 아버지가 아직도 저 위 어딘가에서 내려다보고 있는 것만 같았거든요. 그럴 때면 곁에 서 있던 티탄들도 따라서 하늘을 보았어요.</p><p>세상에서 가장 힘센 이가 무언가를 무서워하기 시작하면, 그 무서움은 대개 다른 누군가에게로 흘러가요. 크로노스의 무서움도 곧 그렇게 되었어요.</p><h2>레아라는 이름의 티탄</h2><p>열두 티탄 가운데 레아라는 이가 있었어요. 크로노스와 함께 세상을 다스린 짝이었지요. 레아는 목소리가 큰 사람이 아니었어요. 대신 한번 마음을 정하면 좀처럼 바꾸지 않는 사람이었어요.</p><p>레아는 봄이면 들판을 걸어 다니며 갓 올라온 싹을 살폈어요. 겨울이면 짐승들이 굴을 잘 팠는지 들여다보았지요. 세상이 조금씩 자라는 것을 지켜보는 일을 레아는 좋아했어요. 크로노스가 왕좌에 앉아 있는 동안, 세상의 자잘한 살림은 거의 레아의 손에서 굴러갔어요.</p><p>밤중에 크로노스가 뒤척이면 레아는 조용히 등을 쓸어 주었어요. 무슨 꿈을 꾸느냐고 물어본 적도 있었지요. 크로노스는 아무 꿈도 꾸지 않는다고만 대답했어요. 레아는 그 대답이 거짓말이라는 것을 알았지만 더 캐묻지 않았어요.</p><p>그러던 어느 날, 레아가 첫아이를 낳았어요. 딸이었어요. 갓 태어난 아기는 레아의 두 손에 쏙 들어올 만큼 작았지만, 울음소리만은 온 골짜기에 쩌렁쩌렁 울렸어요. 레아는 아기를 부드러운 천, 그러니까 강보에 싸서 품에 안고 한참을 들여다보았어요. 세상에 막 도착한 것을 안아 보는 일이 이렇게 따뜻한 줄, 그때 처음 알았지요.</p><p>레아는 아기를 안고 크로노스에게 갔어요.</p><p>“보세요. 우리 아이예요.”</p><p>크로노스는 왕좌에서 천천히 일어났어요. 그러고는 강보 속을 오래 내려다보았어요. 그 눈이 조금도 웃지 않는다는 것을, 레아는 그때 알아채지 못했어요.</p><h2>왕의 두 손</h2><p>크로노스가 두 손을 내밀었어요.</p><p>“아기를 이리 다오.”</p><p>레아는 아기를 건넸어요. 아버지가 처음으로 자기 아이를 안아 보려나 보다, 하고 생각했지요. 크로노스는 아기를 두 손으로 받쳐 들고 한 걸음 뒤로 물러섰어요. 그리고 아주 조용한 목소리로 말했어요.</p><p>“아버지가 말했다. 나도 내 아들에게 자리를 빼앗긴다고. 그러니 내 아이는 하나도 자라서는 안 된다.”</p><p>“안 돼요!”</p><p>레아가 두 팔을 뻗었어요. 하지만 왕좌와 레아 사이는 겨우 몇 걸음인데도 그날따라 너무 멀었어요. 이제 막 세상에 온 아이였어요. 아직 이름도 지어 주지 못했는데 말이에요. 레아는 그 자리에 주저앉을 뻔한 것을 겨우 참았어요.</p><p>크로노스는 아기를 통째로 삼켜 버렸어요. 아무 일도 없었다는 얼굴로 다시 왕좌에 앉았어요. 아버지가 자기 아이에게 할 일은 아니었어요.</p><p>무서운 일이에요. 그런데 신에게 일어나는 일은 우리에게 일어나는 일과 조금 달라요. 신은 그렇게 쉽게 사라지지 않거든요. 그 아기는 아버지의 몸속 어두운 데서 눈을 뜬 채로 있었어요. 나올 길만 없었을 뿐이지요.</p><p>그날 레아는 빈 강보를 안고 골짜기 끝까지 걸어갔어요. 그러고는 바위에 앉아 밤이 새도록 아무 말도 하지 않았어요. 강보에서는 아직 아기 냄새가 났어요. 레아는 그 냄새가 옅어질까 봐 강보를 펴 보지도 못했어요. 골짜기에는 바람 소리 말고는 아무것도 없었어요. 해가 뜰 무렵에야 레아는 자리에서 일어났어요.</p><p>이듬해에 또 아기가 태어났어요. 이번에도 딸이었어요. 레아는 아기를 숨겨 보려고 했어요. 산속 깊은 곳에도 데려가 보고, 강 건너 숲에도 눕혀 보았지요. 그렇지만 왕의 눈을 피할 수 있는 곳은 세상 어디에도 없었어요. 크로노스는 조용히 걸어와 두 손을 내밀었어요. 그리고 똑같은 일이 되풀이되었어요.</p><p>그다음에도, 그다음에도 마찬가지였어요. 딸이 셋, 아들이 둘. 다섯 아이가 그렇게 차례로 아버지의 뱃속으로 들어갔어요. 아이들의 이름은 아직 말하지 않을게요. 그 이름들은 조금 뒤에 아주 크게 불리게 되거든요.</p><p>레아는 점점 말이 줄었어요. 들판에도 나가지 않았어요. 싹이 올라오는 것을 보면 자꾸 강보 생각이 나서 견딜 수가 없었거든요. 그해에는 밀이 여물지 않았고, 짐승들도 굴 밖으로 잘 나오지 않았어요. 세상의 살림을 돌보던 손이 멈추자 세상도 함께 멈춘 것처럼 보였지요.</p><p>크로노스는 그런 레아를 볼 때마다 한마디씩 했어요.</p><p>“어쩔 수 없는 일이다. 세상이 흔들리지 않으려면 왕이 흔들리지 않아야 해.”</p><p>“왕이 흔들리지 않으려고, 아이들이 다섯이나 사라졌어요.”</p><p>크로노스는 대답하지 않았어요. 레아도 더는 말하지 않았어요. 다만 그 말을 삼킬 때마다 마음속에서 무언가가 조금씩 단단해졌어요. 눈물로도 씻기지 않는 것이 있었지요.</p><h2>밤에 찾아간 곳</h2><p>여섯 번째 아이를 품게 되었을 때, 레아는 아무에게도 알리지 않았어요. 넉넉한 옷을 걸치고 평소처럼 걸어 다녔지요. 누가 안색이 좋아 보인다고 하면 그저 웃기만 했어요. 그리고 아무도 깨지 않은 어느 밤, 레아는 혼자 산을 넘어 세상에서 가장 오래된 골짜기로 내려갔어요.</p><p>거기에는 가이아가 있었어요. 세상의 맨 처음에 나타난 땅의 여신, 크로노스의 어머니였지요. 가이아는 레아의 발소리를 이미 알고 있었던 것처럼 천천히 고개를 들었어요.</p><p>“왜 왔는지 말하지 않아도 안다. 네가 딛고 다니는 땅이 곧 나라서, 네 발소리를 늘 듣고 있었단다.”</p><p>레아는 무릎을 꿇고 앉았어요. 그리고 그동안 한 번도 소리 내어 말하지 못했던 것을 말했어요. 이번 아이만은 지키고 싶다고요. 말을 끝내고 나서야 레아는 자기 목소리가 떨리고 있다는 것을 알았어요.</p><p>가이아는 한참 동안 밤하늘을 올려다보았어요. 저 높은 곳에는 우라노스가 있었어요. 가이아는 자기 손으로 만든 낫을 막내아들에게 쥐여 주던 날을 떠올렸어요. 그 손이 지금은 자기 아이들을 삼키고 있었지요.</p><p>“내가 낳은 아이가 제 아이들을 삼키고 있구나.”</p><p>가이아는 그렇게 중얼거리고는 레아 쪽으로 몸을 기울였어요.</p><p>“동쪽 바다에 크레타라는 섬이 있다. 그 섬 산꼭대기에 아무도 모르는 동굴이 하나 있어. 거기서 아기를 낳거라. 그 동굴이라면 아기 울음소리가 하늘까지 올라가지 않는다.”</p><p>레아는 그날 밤으로 길을 떠났어요. 크레타섬은 생각보다 멀었고, 산은 생각보다 높았어요. 발밑에서 자갈이 자꾸 굴러떨어졌지만 레아는 쉬지 않고 올라갔어요.</p><p>산꼭대기 동굴은 가이아가 말한 그대로였어요. 입구가 덩굴에 반쯤 가려져 있고, 안쪽은 넓고 마른 데다 바람도 들지 않았어요. 레아는 덩굴을 조심스레 젖히고 안으로 들어갔어요. 그리고 그 동굴에서 여섯 번째 아이를 낳았어요.</p><p>아들이었어요. 아기는 울지 않았어요. 대신 까만 눈을 동그랗게 뜨고 어머니를 똑바로 올려다보았어요. 동굴 밖에서는 밤새 나뭇잎이 서걱거렸어요. 레아는 아기를 품에 꼭 안고 그 소리를 오래 들었어요. 이 소리가 이 아이의 첫 자장가가 되겠구나 싶었지요.</p><p>“제우스.”</p><p>레아가 아기의 이름을 불렀어요. 세상에서 그 이름을 아는 사람은 그때까지 레아 하나뿐이었지요.</p><p>“너는 절대로 아버지 앞에 데려가지 않을 거야.”</p><p>날이 밝기 전에 레아는 그 섬에 사는 이들에게 아기를 맡겼어요. 그들은 아무것도 묻지 않고 아기를 받아 안았어요. 레아는 동굴 입구에서 한 번, 산 중턱에서 한 번, 그리고 배에 오르기 전에 한 번 더 뒤를 돌아보았어요. 세 번째로 돌아보았을 때는 이미 산꼭대기가 구름에 가려 보이지 않았어요.</p><h2>강보에 싼 것</h2><p>돌아오는 뱃길에서 레아는 아기 대신 무엇을 안고 갈지 생각했어요. 크로노스는 반드시 아이를 내놓으라고 할 테니까요. 빈손으로 돌아가면 그날로 크레타섬이 들통날 게 뻔했어요. 아이를 지키려면 거짓말을 하나 만들어야 했고, 그 거짓말은 아주 무거워야 했어요.</p><p>배가 뭍에 닿았을 때 레아는 바닷가를 천천히 걸었어요. 파도가 밀려왔다 물러날 때마다 자갈들이 자그락자그락 소리를 냈어요. 그러다 레아는 돌덩이 하나를 발견했어요. 갓난아기만 한 크기에, 오랜 세월 파도에 씻겨 모서리가 둥글게 닳은 회색 돌이었어요.</p><p>레아는 그 돌을 두 팔로 안아 들었어요. 묵직한 무게가 이상하게 익숙했어요. 아기를 안았을 때 팔에 걸리던 그 느낌과 꼭 닮아 있었거든요.</p><p>레아는 그 돌을 물가에서 깨끗이 씻었어요. 그리고 아기에게 덮어 주려고 챙겨 두었던 부드러운 강보를 꺼내 돌을 감쌌어요. 한 겹, 두 겹, 세 겹. 아기를 싸듯이 조심조심 감았어요. 마지막에는 목덜미가 있을 자리를 손바닥으로 살짝 받쳐 주기까지 했지요.</p><p>다 싸고 나니 정말 아기처럼 보였어요. 레아는 그것을 품에 안고 한참을 서 있었어요. 바다에서 불어온 바람이 강보 자락을 살짝 들췄어요.</p><p>그러고는 아주 낮은 목소리로 혼잣말을 했어요.</p><p>“미안하다. 오늘 하루만 네가 내 아이가 되어 다오.”</p><p>레아가 궁으로 들어섰을 때, 크로노스는 이미 왕좌에 앉아 기다리고 있었어요. 기둥 사이로 저녁 빛이 길게 들어와 바닥에 줄무늬를 그렸어요. 그 줄무늬 끝에 왕의 그림자가 놓여 있었지요.</p><p>“아이가 태어났다고 들었다.”</p><p>“네.”</p><p>“그 아이는 어디 있느냐?”</p><p>레아는 품에 안은 것을 한 번 고쳐 안았어요. 그리고 천천히 앞으로 걸어 나갔어요. 한 걸음, 두 걸음. 발소리가 어찌나 크게 울리는지, 심장 뛰는 소리까지 들킬까 봐 겁이 났어요. 강보가 조금이라도 흘러내리면 회색 돌이 그대로 드러날 텐데, 레아는 팔에 힘을 주지도 빼지도 못했어요. 왕좌까지 남은 거리가 자꾸 늘어나는 것만 같았어요. 레아는 숨을 아주 얕게 쉬었어요.</p><p>크로노스가 손을 내밀었어요. 레아는 강보를 건네지 않고 잠깐 멈춰 섰어요.</p><p>“한 번만 더 안아 보겠어요.”</p><p>“레아, 어서 아이를 이리 다오.”</p><p>“한 번만요.”</p><p>레아는 강보를 가슴에 대고 눈을 감았어요. 그건 연기가 아니었어요. 정말로 그 안에 있는 것이 자기 아이였다면 어땠을까 하는 생각이, 그 짧은 순간에 온몸을 훑고 지나갔거든요. 앞선 다섯 번의 저녁이 한꺼번에 되살아났어요.</p><p>크로노스는 재촉하지 않고 기다렸어요. 어쩌면 그 기다림이, 그날 크로노스가 레아에게 보인 마지막 다정함이었을지도 몰라요. 그날 저녁의 그 짧은 침묵을 레아는 오래도록 잊지 못했어요.</p><p>레아가 눈을 뜨고 강보를 건넸어요.</p><p>크로노스는 그것을 받아 들었어요. 묵직했어요. 여느 아기보다 조금 무거운 것 같기도 했지만, 크로노스는 그 생각을 오래 붙들지 않았어요. 저녁 빛이 흐려지고 있었고, 강보 안은 잘 보이지 않았거든요. 무엇보다 크로노스는 그 안을 들여다보고 싶지 않았어요. 자기 아이의 얼굴을 마주하는 일이 해마다 조금씩 더 어려워지고 있었으니까요.</p><p>크로노스는 강보째로 그것을 삼켜 버렸어요.</p><p>그러고는 눈을 감고 잠깐 가만히 있었어요. 여섯 번째였어요. 이제 예언은 이루어질 수 없다고, 크로노스는 생각했어요. 자기 자리를 빼앗을 아들은 세상에 하나도 남아 있지 않으니까요. 오랜만에 어깨에서 힘이 스르르 풀렸어요. 왕좌의 팔걸이를 쥐고 있던 손가락도 하나씩 펴졌어요.</p><p>“이제 됐다.” 크로노스가 말했어요. 그 목소리에는 처음으로 편안한 기색이 섞여 있었어요.</p><p>그날 밤 크로노스는 여러 해 만에 아주 깊이 잠들었어요. 창밖에서 별이 몇 번이나 자리를 옮기는 동안에도 한 번도 깨지 않았지요.</p><p>레아는 빈손으로 돌아섰어요. 궁 밖으로 나와 문을 닫고, 긴 계단을 다 내려온 뒤에야 두 손으로 얼굴을 감쌌어요. 어깨가 흔들렸지만 소리는 내지 않았어요. 그러고는 얼굴을 들어 동쪽 바다 쪽을 오래 바라보았어요. 그 바다 너머 어딘가에 자기 아이가 있었으니까요.</p><p>그 시각, 크레타섬에는 비가 그치고 있었어요. 산꼭대기 동굴 안에서 작은 불이 하나 타올랐어요. 누군가 마른 나뭇가지를 조심조심 얹었어요. 불빛이 동굴 벽을 노랗게 물들였다가 다시 어두워졌어요. 벽에는 사람 그림자가 길게 흔들렸지요.</p><p>동굴 한쪽에는 마른 풀을 두툼하게 깔아 만든 자리가 있었어요. 그 위에 아기가 누워 있었어요. 아기는 잠들었다가 깨어나 두 손을 허공으로 쑥 뻗었어요. 무언가 잡고 싶은데 잡히는 것이 없었나 봐요. 손가락이 몇 번 오므라들었다 펴졌어요.</p><p>그러다 아기가 울음을 터뜨렸어요.</p><p>울음소리는 동굴 안에서 몇 번 부딪히더니 덩굴을 헤치고 밖으로 새어 나갔어요. 밤공기를 타고 산비탈을 굴러 내려갔어요. 나무들이 잎을 흔들었어요. 그 소리는 작았지만, 밤이 워낙 조용해서 아주 멀리까지 갔어요. 산 아래 어디선가 짐승 한 마리가 걸음을 멈추고 귀를 세웠어요. 구름이 갈라지면서 달빛이 산꼭대기로 쏟아졌어요.</p><p>세상 저편에서는 왕이 깊이 잠들어 있었어요. 자기 자리를 빼앗을 아이는 이제 하나도 없다고 믿으면서요. 왕의 곁에는 아무도 없었고, 궁은 아주 조용했어요. 먼바다에서는 파도가 천천히 뒤척였어요.</p><p>그런데 이 섬에서는, 아무도 모르는 산꼭대기에서, 그 아이가 아주 힘차게 울고 있었어요.</p></article></noscript>
