  <noscript><article class="ns-text"><h1>목소리만 남은 에코</h1><h2>산에서 제일 말이 많은 님프</h2><p>물을 길으러 나온 님프들이 항아리를 발치에 내려놓고 둘러앉아 있었어요. 해가 기울도록 아무도 일어서지 않았지요. 가운데 앉은 님프가 눈을 크게 떴어요.</p><p>“그래서 그 사냥꾼이 어떻게 됐게?”</p><p>“어떻게 됐는데?” 님프들이 한꺼번에 되물었어요.</p><p>“그건 내일 이야기해 줄게.” 에코는 그렇게 말하고 벌떡 일어섰어요.</p><p>바람에 흩날리는 옅은 빛 머리에 회청색 옷을 걸친 님프였어요. 산에는 님프가 여럿 살았어요. 샘에서 사는 님프, 나무에서 사는 님프, 골짜기 그늘에서 사는 님프요. 그 가운데 에코가 제일 말이 많았지요.</p><p>에코는 늘 그런 식이었어요. 제일 궁금한 데서 뚝 끊고 일어서 버렸지요. 그러면 님프들이 소매를 붙잡고 늘어졌어요.</p><p>님프들은 그 뒷이야기가 궁금해서 다음 날 또 나왔어요. 그러면 에코는 어제 하던 이야기 대신 오늘 아침에 본 것부터 꺼냈지요. 끝까지 들은 이야기가 하나도 없었어요.</p><p>한번 이야기를 시작하면 에코는 좀처럼 멈추지 못했어요. 하나를 이야기하다 보면 그 안에서 다른 이야기가 나오고, 그것을 이야기하다 보면 또 다른 이야기가 나왔거든요.</p><p>산에서 무슨 일이 일어나든 에코가 제일 먼저 알았고, 제일 길게 옮겼어요. 님프들은 에코의 입이 산에서 가장 부지런한 것이라고 말했지요.</p><p>그런 에코에게 어느 날 큰일이 생겼어요. 그날 산비탈에 헤라가 내려왔어요. 올림포스의 안주인이 산까지 내려오는 일은 흔하지 않았지요. 헤라는 무언가를 찾고 있었어요. 눈이 자꾸 골짜기 안쪽을 향했어요.</p><p>에코가 그 앞으로 걸어 나갔어요.</p><p>“여기까지 어인 걸음이세요?” 에코가 반가운 얼굴로 물었어요.</p><p>헤라는 에코를 보지도 않고 말했어요. “이 골짜기에 제우스가 와 있다고 들었다. 님프들과 함께라고.”</p><p>그런데 에코가 이야기를 시작해 버렸어요.</p><p>“이 산에 오시려면 아랫길로 오셔야 해요. 윗길은 지난봄 비에 다 무너졌거든요. 그 비가 얼마나 왔느냐 하면요, 사흘 밤낮으로 왔는데 나흘째 아침에 보니 골짜기가 통째로 자리를 옮겨 앉아 있지 뭐예요.”</p><p>헤라가 골짜기 쪽으로 몸을 조금 틀었어요. 그런데 에코가 그 앞으로 반 발짝 옮겨 섰지요. 일부러 그런 것은 아니었어요. 이야기를 하다 보면 늘 그렇게 상대 앞으로 다가서곤 했으니까요.</p><p>“그 무너진 윗길에 지금은 딸기 덩굴이 얼마나 뻗었는지 아세요? 사람 키만큼 자랐어요. 지난여름에 아랫마을 아이 하나가 거기 들어갔다가 반나절을 못 나왔지 뭐예요.”</p><p>헤라가 한 걸음 옮기려 하자 에코가 옆으로 따라붙었어요.</p><p>“그때 아랫마을 사람들이요…….”</p><p>이야기는 끊이지 않았어요. 하나가 끝나면 다음 것이 이어졌고, 다음 것이 끝나면 또 다음 것이 이어졌어요. 헤라는 이야기를 들으며 서 있었어요. 처음에는 서너 마디만 듣고 가려 했지요.</p><p>해가 산등성이에 걸릴 무렵에야 헤라는 골짜기 안으로 들어갔어요. 안은 텅 비어 있었어요. 제우스도 님프들도 그사이에 벌써 흩어지고 없었지요.</p><p>헤라가 천천히 돌아섰어요. 에코는 아직 그 자리에 서 있었어요. 무슨 이야기를 하다 말았는지 입을 반쯤 벌린 채로요.</p><p>“네 이야기가 참 길구나.” 헤라가 나직하게 말했어요.</p><p>에코는 웃으려다가 그만두었어요. 헤라의 목소리가 아까와 달랐거든요.</p><p>“그 입을 이제부터 남에게 내어 주어라.” 헤라가 말했어요. “너는 먼저 말하지 못한다. 남이 한 말의 끝만 되돌려 주게 될 것이다.”</p><p>에코가 무어라 말하려고 입을 열었어요. 그런데 아무 소리도 나오지 않았어요. 헤라는 그 말만 하고 산을 올라갔어요. 뒤를 한 번도 돌아보지 않았지요.</p><p>그건 정말 너무했지요. 에코는 한참 그 자리에 서 있었어요. 그러다가 조심스럽게 입을 벌려 보았어요. 자기 이름을 부르려고요. 소리는 나오지 않았어요.</p><p>숨은 나왔어요. 입 모양도 만들어졌어요. 그런데 그 사이에 있어야 할 것이 없었지요. 에코는 손바닥으로 목을 눌러 보았어요. 그러고는 발밑의 돌을 하나 집어 골짜기로 던졌어요. 돌이 굴러가는 소리는 났어요. 그 소리는 나는데 자기 소리만 나지 않았어요.</p><p>그날 저녁 님프들이 물을 길으러 나왔어요. 늘 하던 대로 에코를 찾았지요.</p><p>“에코야, 어제 그 사냥꾼 이야기 마저 해 줘.” 한 님프가 항아리를 내려놓으며 말했어요.</p><p>“해 줘.” 에코의 입에서 나온 것은 그 짧은 말뿐이었어요.</p><p>님프들이 서로를 쳐다보았어요. 에코가 이렇게 짧게 말하는 것은 처음이었거든요.</p><p>“왜 그래? 어디 아파?” 다른 님프가 얼굴을 들여다보며 물었어요.</p><p>“아파.” 에코는 그 말만 되돌려 주었어요.</p><p>에코는 두 손으로 입을 막았어요. 그러고는 골짜기 안쪽으로 뛰어 들어갔어요.</p><h2>말이 되지 않는 입</h2><p>그때부터 에코는 사람들 앞에 잘 나오지 않았어요. 바위 뒤에 숨어 있다가, 지나가는 이들의 말끝만 조그맣게 되돌려 주었지요. 지나가던 사람들은 걸음을 멈추고 두리번거렸어요. 산이 대답을 한다고 생각했거든요.</p><p>에코는 하고 싶은 말이 많았어요. 어제 본 것, 오늘 들은 것, 저 아래 마을에서 일어난 일. 그 말들이 목까지 올라왔다가 도로 내려갔어요.</p><p>아는 님프가 지나가면 에코는 바위 뒤에서 손을 반쯤 들었어요. 그러고는 도로 내렸지요. 상대가 먼저 말을 걸어 주기를 기다리는 수밖에 없었으니까요.</p><p>한번은 산길을 잃은 아이가 울면서 지나갔어요. 에코는 바위 뒤에서 그 소리를 들었지요.</p><p>“어머니!” 아이가 목청껏 소리쳤어요.</p><p>“어머니!” 바위 뒤에서 그 끝이 되돌아왔어요.</p><p>에코가 되돌려 준 소리였어요. 아이는 자기 소리가 되돌아오는 쪽으로 걸었고, 그러다 아랫길로 내려섰어요.</p><p>에코는 그 뒷모습을 오래 보았어요. 잘 가라는 말도 해 주고 싶었지만, 아이가 아무 말도 하지 않고 갔기 때문에 되돌려 줄 것이 없었지요.</p><p>그렇게 몇 해가 지났어요. 님프들은 차차 에코를 잊었어요. 물을 길으러 나와도 이제는 항아리를 내려놓지 않고 곧장 돌아갔지요.</p><p>에코는 점점 옅어졌어요. 아침 안개 속에 서 있으면 어디까지가 안개고 어디부터가 에코인지 알아보기 어려울 지경이었어요.</p><h2>숲에서 마주친 사람</h2><p>그러던 어느 날, 산 아래 마을에서 젊은이 하나가 사슴을 쫓아 올라왔어요. 이름은 나르키소스였어요. 부드러운 밤빛 곱슬머리에, 보는 사람마다 걸음을 멈출 만큼 아름다운 젊은이였지요.</p><p>나르키소스가 태어났을 때, 앞일을 볼 줄 안다는 어느 노인이 그 어머니에게 한마디를 남겼어요. 이 아이는 오래 살 것이오. 다만 제 얼굴을 알아보지 않는다면 말이오.</p><p>어머니는 그 말을 오래 곱씹었지만 무슨 뜻인지 알아내지 못했어요. 나르키소스를 좋아한 이는 아주 많았어요. 마을 처녀들도, 산의 님프들도, 함께 사냥을 다니던 젊은이들도요. 그런데 나르키소스는 누구에게도 눈길 한 번 주지 않았어요.</p><p>다가오는 이가 있으면 나르키소스는 그저 이렇게 말했어요. 나는 너 같은 애한테 마음을 줄 생각이 없다고요. 그 말을 들은 이들은 고개를 숙이고 돌아갔어요.</p><p>에코는 바위 뒤에서 그 젊은이를 보았어요. 그러고는 그 뒤를 따라갔어요. 발소리를 죽이고, 나무에서 나무로요.</p><p>따라가면서 에코는 몇 번이나 부르고 싶었어요. 여기 좀 보라고요. 그런데 그 말을 먼저 꺼낼 수가 없었지요.</p><p>숲이 깊어지자 나르키소스는 일행을 놓쳤어요. 사방을 둘러보아도 아무도 보이지 않았어요.</p><p>“여기 누구 있니?” 나르키소스가 손을 입가에 모으고 소리쳤어요.</p><p>“있니?” 어디선가 그 끝만 조그맣게 되돌아왔어요.</p><p>나르키소스가 걸음을 멈추었어요. 사람 소리 같기도 하고 산이 낸 소리 같기도 했어요.</p><p>“이리 나와.” 나르키소스가 다시 소리쳤어요.</p><p>“나와.” 되돌아온 것은 그 두 마디뿐이었지요.</p><p>“왜 숨어 있어?” 나르키소스가 나무 쪽으로 다가서며 물었어요.</p><p>“숨어 있어.” 그 끝도 어김없이 되돌아왔어요.</p><p>나르키소스는 목소리가 나는 쪽으로 몇 걸음 다가갔어요. 나뭇잎 사이로 무언가가 움직였지요.</p><p>“우리 여기서 만나자.” 나르키소스가 말했어요.</p><p>“만나자.” 에코의 목소리가 아주 가까이에서 들렸어요.</p><p>에코는 그 말을 되돌려 주면서 나무 뒤에서 걸어 나왔어요. 두 팔을 벌리고요. 몇 해 만에 처음으로 누군가에게 다가가는 걸음이었어요.</p><p>나르키소스는 얼굴을 굳히고 뒷걸음질을 쳤어요. 손으로 앞을 막기까지 했지요.</p><p>“저리 가.” 나르키소스가 차갑게 소리쳤어요.</p><p>에코는 벌린 팔을 그대로 둔 채 멈춰 섰어요.</p><p>“나는 너 같은 애한테 마음을 줄 생각이 없어.”</p><p>“……줄 생각이 없어.” 에코는 그 끝을 되돌려 주었어요.</p><p>에코는 자기 입에서 나온 그 말을 자기 귀로 들었어요. 남의 말이면서 제 말이기도 한 말이었지요. 나르키소스는 뒤도 돌아보지 않고 숲을 빠져나갔어요.</p><p>에코는 그 자리에 오래 서 있었어요. 벌린 두 팔을 어떻게 내려놓아야 할지 몰라서, 한참 뒤에야 천천히 내렸지요.</p><p>그러고는 골짜기 안쪽으로 걸어 들어갔어요. 그 뒤로 에코는 바위 그늘에서만 지냈어요. 아침 안개가 걷힐 때 함께 옅어졌다가, 저녁 안개가 올라올 때 다시 조금 진해졌지요.</p><p>그러다 어느 날부터는 안개가 걷혀도 다시 진해지지 않았어요. 그날 이후로 에코를 눈으로 본 이는 아무도 없어요.</p><p>다만 목소리는 남았어요. 산에서 누가 큰 소리로 무엇을 부르면, 그 끝이 어디선가 조그맣게 되돌아오지요. 그게 에코예요.</p><p>그해 여름, 나르키소스에게 마음을 주었다가 돌아선 어느 젊은 사냥꾼이 아프로디테의 신전 앞에 앉았어요. 한참을 앉아 있다가 이렇게 빌었지요.</p><p>“저 사람도 누군가를 사랑하게 해 주세요. 그러고도 그 사랑을 얻지 못하게 해 주세요.”</p><p>젊은 사냥꾼은 그 말을 하고 나서 곧 후회했어요. 방금 한 말을 물러 달라고 하려고 다시 입을 열었지요. 그런데 어쩐지 그 말은 나오지 않았어요.</p><p>아프로디테는 그 소원을 들어주었어요. 소원치고는 참 무거운 소원이었어요. 신이라고 늘 옳은 건 아니었어요.</p><p>가을이 왔어요. 나르키소스는 그날도 사슴을 쫓아 숲으로 들어갔지요. 한낮이 되자 목이 말랐어요. 숲 한가운데 샘이 하나 있었어요. 나뭇잎 한 장 떠 있지 않은 샘이었어요. 짐승도 오지 않고 바람도 지나가지 않아서, 물이 거울처럼 잔잔했지요.</p><p>샘가에는 풀이 둥글게 자라 있었어요. 누가 앉았던 자국도, 짐승이 물을 마신 발자국도 없었어요. 물은 아주 맑아서 바닥의 흰 돌이 하나하나 보였지요.</p><p>나르키소스는 무릎을 꿇고 물에 얼굴을 가져갔어요. 그리고 그 안에서 누군가를 보았어요. 물속에서도 그 사람이 이쪽을 보고 있었어요. 밤빛 곱슬머리에, 보는 사람마다 걸음을 멈출 만한 얼굴이었어요.</p><p>나르키소스는 목이 말랐다는 것도, 물을 마시러 왔다는 것도 잊어버렸어요.</p><h2>샘물에 비친 얼굴</h2><p>“너는 누구니?” 나르키소스가 물속을 들여다보며 물었어요.</p><p>물속의 얼굴도 입을 움직였어요. 그런데 소리는 나지 않았지요. 나르키소스가 손을 뻗었어요. 손끝이 물에 닿자 얼굴이 흔들려 흩어졌어요. 나르키소스는 얼른 손을 뺐어요. 물결이 잦아들자 그 얼굴이 다시 돌아왔지요.</p><p>“가지 마.” 나르키소스가 낮게 말했어요.</p><p>“가지 마.” 산속 어딘가에서 그 끝이 되돌아왔어요.</p><p>나르키소스는 그것도 물속에서 온 대답인 줄 알았어요. 물속의 그 사람이 자기를 붙잡는다고 생각했지요. 그날 나르키소스는 숲에서 나오지 않았어요. 그다음 날도 나오지 않았어요.</p><p>샘가에 엎드린 채로 나르키소스는 그 얼굴에게 말을 걸었어요. 손을 뻗으면 달아나고, 기다리면 돌아오고, 다시 뻗으면 또 달아났지요.</p><p>“나는 여기 있는데.” 나르키소스가 말했어요.</p><p>“여기 있는데.” 그 끝이 조그맣게 되돌아왔어요.</p><p>물속의 그 사람도 손을 뻗었어요. 고개를 기울이면 똑같이 고개를 기울였고, 입을 움직이면 똑같이 입을 움직였지요. 나르키소스는 웃었어요. 이렇게 마음이 잘 맞는 상대는 처음이었거든요.</p><p>다만 아무리 기다려도 그 사람은 물 밖으로 나오지 않았어요.</p><p>“왜 나한테 오지 않니?” 나르키소스가 다시 물었어요.</p><p>“오지 않니?” 산속에서 그 말끝이 되돌아왔어요.</p><p>나르키소스는 그것이 누구의 목소리인지 끝내 알아채지 못했어요. 밤이 되면 물속이 어두워져 얼굴이 보이지 않았어요. 그러면 나르키소스는 무릎을 안고 앉아 아침을 기다렸지요. 해가 나무 사이로 들어와 물을 밝히면 얼굴이 다시 돌아왔어요.</p><p>돌아온 얼굴은 조금 더 여위어 있었어요. 나르키소스는 그것을 보고 걱정했어요. 저 사람이 어디가 아픈가 하고요.</p><p>마을 사람들이 몇 번 찾으러 올라왔어요. 어깨를 흔들어도 나르키소스는 고개를 들지 않았어요. 사람들은 물 한 잔을 옆에 놓고 내려갔지요.</p><p>날이 짧아졌어요. 샘가에는 낙엽이 쌓였어요. 물 위에도 잎이 몇 장 떠서 얼굴을 자꾸 가렸지요. 나르키소스는 손끝으로 그 잎을 하나씩 밀어냈어요.</p><p>나르키소스는 점점 여위어 갔어요. 볼이 홀쭉해지고, 팔이 가늘어지고, 뻗던 손도 이제는 잘 올라가지 않았어요. 그런데도 눈은 물에서 떼지 못했지요.</p><p>어느 저녁이었어요. 물빛이 어두워지기 전에 나르키소스가 아주 작은 소리로 말했어요.</p><p>“잘 있어.”</p><p>산속 어딘가에서 그 말끝이 되돌아왔어요. 아주 멀리서, 조그맣게요.</p><p>“잘 있어.”</p><p>그날 밤 숲은 몹시 조용했어요. 바람도 한 번 불지 않았지요. 아침에 마을 사람들이 올라와 보니 샘가에는 아무도 없었어요. 나르키소스가 엎드려 있던 자리에는 눌린 낙엽 자국만 남아 있었지요.</p><p>그리고 그 자국 한가운데에 꽃 한 송이가 피어 있었어요. 가운데가 노랗고 가장자리가 하얀, 고개를 물 쪽으로 조금 숙인 꽃이었어요.</p><p>누가 심은 것도 아니고, 어제까지는 없던 꽃이었어요. 사람들은 한참 그 꽃을 들여다보다가 아무도 꺾지 않고 내려갔지요.</p><p>사람들은 그 꽃을 나르키소스라고 불렀어요. 지금도 물가에 그 꽃이 피면, 늘 물 쪽으로 고개를 숙이고 있지요.</p><p>그해 겨울, 님프 하나가 물을 길으러 나왔다가 예전 일이 생각나 이름을 불러 보았어요.</p><p>“에코야.” 님프가 골짜기 쪽으로 소리쳤어요.</p><p>“에코야.” 그 끝이 조그맣게 되돌아왔어요.</p><p>님프는 항아리를 내려놓고 한참을 서 있었어요. 그러고는 아무 말도 하지 않고 돌아갔지요. 무슨 말이든 하면 그 끝이 되돌아올 텐데, 그게 대답이 아니라는 걸 알았으니까요.</p><p>산에서는 그 뒤로도 이따금 누군가 부르는 소리가 났어요. 그럴 때면 그 소리의 끝만 어디선가 조그맣게 되돌아왔어요. 대답은 언제나 그것뿐이었지요.</p></article></noscript>
