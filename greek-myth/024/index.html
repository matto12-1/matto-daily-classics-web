  <noscript><article class="ns-text"><h1>월계수가 된 다프네</h1><h2>델포이의 두 활</h2><p>그날 아침 골짜기로 올라오는 줄이 바위 아래까지 늘어섰어요. 맨 앞에 선 노인은 밤새 걸어 올라온 사람이었어요. 신발이 아직 젖어 있었지요. 아폴론은 그 신발을 한 번 내려다보고 나서 물음을 들었어요.</p><p>큰 뱀이 사라진 뒤로 델포이 골짜기는 환해졌어요. 사람들이 마음 놓고 물을 길으러 올라왔고, 바위 사이로 풀도 돋아났지요. 아폴론은 그 골짜기가 내려다보이는 바위에 앉아 그 물음들을 들었어요. 올라오는 사람들은 저마다 물음을 하나씩 품고 왔어요. 밭에 씨를 언제 뿌려야 하는지, 먼 길을 떠난 사람이 돌아올지, 앓는 아이가 나을지 같은 것들이었지요.</p><p>노인 다음에 올라온 사람이 물었어요.</p><p>“올해 밭에 씨를 언제 뿌리면 좋겠습니까?”</p><p>“비가 세 번 오고 난 뒤에 뿌려라.” 아폴론이 대답했어요.</p><p>아폴론은 그 물음에 언제나 짧게 답했어요. 사람들은 그 짧은 말을 품에 안고 산을 내려갔지요. 내려가는 등이 올라올 때보다 가벼워 보이면 아폴론은 그날 하루가 마음에 들었어요.</p><p>무릎에는 늘 금활이 놓여 있었어요. 지나가던 사람이 그 활을 보고 걸음을 멈추면, 아폴론은 못 본 척하면서도 어깨를 조금 폈지요.</p><p>“저 활 한 대로 골짜기의 그 큰 뱀을 물리쳤다지.”</p><p>“활이라면 저분을 당할 이가 없대.”</p><p>그런 말이 바람에 실려 오는 날이면 아폴론은 하루가 다 가도록 기분이 좋았어요. 세상에 활을 저만큼 다루는 이가 또 있을 리 없다고, 아폴론은 그렇게 생각했거든요.</p><p>어느 날 아침이었어요. 골짜기 바위 끝에 처음 보는 아이가 앉아 있었어요. 등에는 옅은 파란 날개가 돋아 있었고, 손에는 아주 작은 활이 들려 있었지요. 활은 아폴론의 팔뚝보다도 짧았어요.</p><p>세상이 처음 생기던 때부터 있던 그 사랑의 힘이, 이제는 작은 활을 든 어린 신의 모습으로 나타났어요. 아프로디테의 아들로요. 이 어린 신의 이름은 에로스였어요.</p><p>아폴론은 그 활을 보고 웃음을 참지 못했어요.</p><p>“그건 어디에 쓰는 물건이냐?” 아폴론이 물었어요.</p><p>에로스는 대답하지 않고 화살통만 고쳐 멨어요. 금빛 곱슬머리가 아침 바람에 흔들렸지요.</p><p>“활은 나 같은 이가 드는 것이란다. 너는 그 조그만 걸로 무얼 맞히겠니. 그건 장난감으로 두고, 너는 횃불이나 들고 다니려무나.”</p><p>에로스가 천천히 고개를 들었어요. 얼굴에는 아무 표정도 없었지요. 화살통을 멘 어깨가 아주 조금 올라갔다가 내려왔어요.</p><p>“당신 활은 짐승을 맞히지요.” 에로스가 조용히 말했어요. “제 활은 당신을 맞힙니다.”</p><p>아폴론은 또 웃었어요. 그 웃음소리가 골짜기 벽에 부딪혀 한참 울렸지요. 그런데 웃음이 잦아들고 다시 보니 바위 끝은 이미 비어 있었어요. 앉았던 자리에는 작은 깃털 하나가 떨어져 있었어요.</p><p>에로스는 바닷가로 곧장 날아갔어요. 아프로디테가 물가에 앉아 조개껍데기를 하나씩 뒤집어 보고 있었지요. 아들이 씩씩거리며 내려앉자 아프로디테가 고개를 들었어요.</p><p>“오늘은 누가 너를 이렇게 화나게 했니?” 아프로디테가 물었어요.</p><p>“아폴론이요. 아폴론이 제 활을 보고 비웃었어요.”</p><p>에로스는 모래를 발끝으로 툭툭 찼어요. 무슨 말부터 해야 할지 고르는 얼굴이었지요. 그러다가 화살통을 어머니 앞에 툭 내려놓았어요.</p><p>“제 활이 장난감이래요.”</p><p>아프로디테는 웃지 않았어요. 대신 화살통 안을 들여다보았지요. 통 안에는 화살이 두 가지 들어 있었어요.</p><p>하나는 끝이 금으로 된 화살이었어요. 이 화살에 맞으면 마음속에 사랑이 들어앉아요. 다른 하나는 끝이 납으로 된, 무겁고 무딘 화살이었어요. 이 화살에 맞으면 사랑이 밀려나고 그 자리에 달아나고 싶은 마음이 들어서지요.</p><p>아프로디테는 두 화살을 하나씩 들어 보았어요. 금 화살은 햇빛을 받아 가늘게 반짝였고, 납 화살은 아무 빛도 되돌려 주지 않았어요.</p><p>“쓰려거든 잘 생각하고 쓰렴.” 아프로디테가 말했어요. “한번 떠난 화살은 되돌릴 수가 없단다.”</p><p>“저는 한 대가 아니라 두 대를 쏠 거예요.”</p><p>“두 대를 쏘면 두 사람의 마음이 바뀌는 거란다.”</p><p>“한 사람은 자기가 맞은 줄 몰라도 되고요.”</p><p>“모르는 편이 나은 화살은 없단다.”</p><p>아프로디테가 그렇게 말했지만 에로스는 이미 듣고 있지 않았어요. 화살통을 도로 메고 날아올랐지요. 아프로디테는 아들이 사라진 하늘을 잠깐 올려다보았어요. 무어라 더 말하려다가 그만두고, 다시 조개껍데기를 뒤집었지요.</p><h2>서로 다른 화살 두 대</h2><p>에로스는 골짜기가 한눈에 내려다보이는 가장 높은 바위에 내려앉았어요. 아폴론은 아직 그 자리에 앉아 있었어요. 여전히 금활을 무릎에 얹은 채로요.</p><p>에로스는 서두르지 않았어요. 바위에 배를 깔고 엎드려 한참을 내려다보았지요. 어디를 맞혀야 하는지 재고 있는 것 같았어요.</p><p>그러고는 끝이 금으로 된 화살을 뽑았어요. 시위를 당기는 데 걸린 시간은 숨 한 번 쉴 만큼이었어요. 아폴론은 가슴께가 잠깐 뜨거웠지만 아무것도 보지 못했어요. 손등으로 가슴을 한 번 문지르고는 그만이었지요.</p><p>에로스는 다시 아래를 내려다보았어요. 골짜기 끝에 강이 흐르고 있었고, 그 강가에 님프 하나가 서 있었어요. 이름은 다프네였어요.</p><p>다프네는 그 강가에서 나고 자란 님프였어요. 아버지는 그 강이었지요. 초록빛이 도는 긴 머리를 아무렇게나 묶고, 하루 종일 숲을 돌아다녔어요.</p><p>사슴 발자국을 따라가는 것, 나뭇가지 사이로 화살을 날려 보는 것, 해 질 녘에 물가에 앉아 발을 담그는 것. 다프네가 좋아하는 것은 그게 다였어요.</p><p>아주 어릴 적에 다프네는 강물에게 이런 말을 한 적이 있어요. 나는 이 숲에서 늙을 거예요. 다른 데로는 안 갈 거예요. 강물은 그 말을 잊지 않고 있었지요.</p><p>다프네를 보러 오는 이들이 없었던 것은 아니에요. 이웃 골짜기의 젊은 신도 왔고, 산 아래 마을의 젊은이들도 왔지요. 다프네는 그때마다 활을 들고 숲으로 들어가 저녁까지 나오지 않았어요.</p><p>강물이 가끔 다프네에게 말을 걸었어요. 물소리가 말이 되어 들리는 것은 세상에서 다프네뿐이었지요.</p><p>“너도 이제 짝을 만나야 하지 않겠니?”</p><p>“또 그 이야기예요?”</p><p>“다들 짝을 만나 그렇게 산단다.”</p><p>“저는 지금이 좋아요.” 다프네가 말했어요. “아무것도 바꾸고 싶지 않은걸요.”</p><p>강물은 잠시 아무 소리도 내지 않았어요. 그러고는 더 묻지 않고 그냥 흘러갔어요. 다프네는 그 물에 발을 담그고 앉아 흘러가는 나뭇잎을 눈으로 좇았지요.</p><p>그러는 사이 위쪽 바위에서 두 번째 화살이 떠났어요. 끝이 납으로 된, 무겁고 무딘 화살이었지요. 다프네는 어깨 언저리가 잠깐 서늘했어요. 팔을 문지르며 하늘을 올려다보았지만 구름 한 점 없었어요.</p><p>에로스는 화살통을 닫았어요. 그러고는 뒤도 돌아보지 않고 날아갔어요. 자기가 쏜 두 대가 어디에 가서 닿았는지, 에로스는 이미 알고 있었으니까요.</p><p>그날 아폴론은 아침부터 이상했어요. 바위에 앉아 있는데 자꾸 몸이 뒤척여졌어요. 앉았다가 일어서고, 일어섰다가 다시 앉았지요.</p><p>사람들이 올라와 물었어요. 밭에 씨를 언제 뿌려야 하느냐고요. 아폴론은 그 말을 두 번 되물었어요. 처음 듣는 말처럼요.</p><p>오후에는 활을 들고 산등성이로 올라가 보았어요. 저 멀리 마른 나무 등걸에 대고 시위를 당겼지요. 화살은 등걸을 한참 비껴 날아가 풀숲에 떨어졌어요.</p><p>아폴론은 활을 내려다보았어요. 활에는 아무 이상도 없었어요. 다시 당겼어요. 이번에도 빗나갔어요. 손이 저 혼자 조금씩 흔들리고 있었거든요.</p><p>아침에 잠깐 뜨거웠던 가슴께가 다시 뜨거워졌어요. 아폴론은 거기에 손을 얹어 보았어요. 다친 데는 없었어요. 그런데 손을 떼면 또 뜨거워졌지요.</p><p>해가 기울 무렵, 아폴론은 골짜기 아래에서 물소리가 나는 쪽으로 자꾸 고개가 돌아가는 것을 알아챘어요. 아침부터 그러고 있었다는 것도요.</p><p>“내가 오늘 왜 이러지?”</p><p>아폴론은 혼잣말을 하고 자리에서 일어섰어요. 발치에 떨어져 있던 그 작은 깃털이 바람에 굴러갔지만, 아폴론은 그것을 보지 못했어요.</p><h2>강가로 달아나는 걸음</h2><p>아폴론은 골짜기를 내려왔어요. 왜 내려오는지 자기도 잘 몰랐어요. 그저 발이 강 쪽으로 향했지요. 물가에는 다프네가 서 있었어요. 아폴론은 그 자리에서 걸음을 멈추었어요. 심장이 한 번 크게 뛰었고, 그다음부터는 다른 것이 하나도 보이지 않았어요.</p><p>골짜기도, 사람들의 물음도, 무릎에 얹어 두었던 금활도요.</p><p>“잠깐만 거기 서 보아라.” 아폴론이 불렀어요.</p><p>다프네가 돌아보았어요. 그러고는 곧바로 달아났어요. 생각해서 달아난 게 아니었어요. 몸이 먼저 돌아섰지요.</p><p>아폴론이 뒤를 따라갔어요.</p><p>“무서워하지 마라. 나는 너를 해칠 사람이 아니다.” 아폴론이 달리면서 말했어요. “나는 델포이의 주인이고, 사람들이 앞일을 물으러 오는……”</p><p>말은 그렇게 하면서도 아폴론은 걸음을 조금도 늦추지 않았어요. 그러니 다프네에게는 그 말이 하나도 들리지 않았지요. 들린 것은 뒤에서 따라오는 발소리뿐이었어요.</p><p>아무리 신이라 해도, 싫다는 이를 뒤쫓는 건 너무했지요. 다프네는 숲을 가로질러 달렸어요. 나뭇가지가 팔을 긁었어요. 머리를 묶었던 끈이 풀려 어디론가 날아갔어요.</p><p>다프네가 아는 숲이었어요. 어느 바위를 돌아야 지름길인지, 어느 덤불이 사람 키만큼 빽빽한지 다 알았지요. 알던 길을 다 써 보았는데도 발소리는 줄어들지 않았어요.</p><p>달리면서 다프네는 몇 번이나 뒤를 흘깃거렸어요. 그때마다 사이가 조금씩 좁아져 있었어요. 신의 걸음과 님프의 걸음은 처음부터 같을 수가 없었으니까요.</p><p>“제발 따라오지 마세요.”</p><p>다프네가 그 말을 한 것인지, 속으로만 생각한 것인지는 다프네도 몰랐어요. 한 번은 뒤에서 손이 뻗어 오는 기척이 났어요. 풀린 머리카락 끝이 그 손에 스쳤지요. 다프네는 그때 처음으로 소리를 냈어요. 짧고 낮은 소리였어요.</p><p>숨이 턱까지 찼어요. 다리가 말을 듣지 않았어요. 다프네는 자기 심장 뛰는 소리 말고는 아무 소리도 듣지 못했어요.</p><p>뒤에서 따라오던 그림자가 어느새 발밑까지 와 있었어요. 그렇게 달려 닿은 곳이 강가였어요. 앞은 물이고 뒤는 발소리였지요.</p><h2>월계수가 된 자리</h2><p>다프네는 마지막으로 한 번 뒤를 돌아보았어요. 저녁 해가 아폴론의 어깨 너머에서 붉게 타고 있었어요. 그 빛 때문에 아폴론의 얼굴은 잘 보이지 않았지요.</p><p>다프네는 물을 향해 두 팔을 뻗었어요.</p><p>“아버지.” 다프네가 숨을 몰아쉬며 말했어요. “저를 좀 도와주세요. 이 모습을 바꿔 주세요.”</p><p>말이 끝나기도 전이었어요. 발이 무거워졌어요. 발가락이 흙을 파고 들어가 뿌리가 되었어요. 다리가 굳고, 허리가 굳고, 몸이 위로 곧게 자랐어요. 살갗 위로 얇은 나무껍질이 올라왔어요. 들어 올린 두 팔에서는 가지가 뻗어 나오고, 손끝마다 새 잎이 돋았지요.</p><p>마지막까지 남은 것은 머리카락이었어요. 초록빛이 돌던 그 머리카락이 그대로 잎이 되었어요. 강물은 아무 말도 하지 않았어요. 다만 물살이 한 번 크게 일렁이더니, 곧 그 자리에 도로 잔잔해졌지요.</p><p>아폴론이 강가에 닿았을 때, 거기에는 나무 한 그루가 서 있었어요. 조금 전까지 없던 나무였어요. 아폴론은 나무 앞에 오래 서 있었어요. 처음에는 무슨 일이 일어난 것인지 알아보지 못했어요. 그러다가 나무 아래에 떨어져 있는 머리끈을 보았지요.</p><p>아폴론은 나무에 손을 얹었어요. 나무껍질 아래에서 아직 무언가가 뛰고 있었어요. 아주 작게, 그러나 분명하게요.</p><p>다프네가 서 있던 자리에는 젖은 발자국이 아직 남아 있었어요. 발자국은 나무 밑동에서 끊겨 있었지요.</p><p>“내가 쫓아서 이렇게 되었구나.”</p><p>아폴론은 그 말만 했어요. 해가 강 건너로 넘어갈 때까지 그 자리에 서 있었지요. 활은 어느새 발치에 내려놓은 뒤였어요.</p><p>그러고는 나무에게 이런저런 말을 했어요. 자기가 누구인지, 무엇을 할 줄 아는지, 활을 얼마나 잘 다루는지 같은 것들이었지요. 아침에 골짜기에서 하던 자랑과 똑같은 말이었어요. 그런데 그 말을 하면 할수록 목소리가 작아졌어요.</p><p>마지막에는 자랑할 것이 하나도 남지 않았어요.</p><p>“미안하다.” 아폴론이 나무에게 말했어요.</p><p>나무는 잎을 조금 흔들었어요. 바람 때문이었는지 아닌지는 아무도 몰라요. 아폴론은 손을 뻗어 가지 하나를 조심스럽게 꺾었어요. 그러고는 그것을 둥글게 말아 자기 머리에 둘렀지요.</p><p>“이제 이 나무를 늘 곁에 두겠다.” 아폴론이 말했어요.</p><p>사람들은 그 나무를 월계수라고 불렀어요. 그날부터 아폴론의 머리에는 늘 월계수 잎이 있었어요. 겨루기에서 이기고 돌아온 사람에게 씌워 주는 것도 그 잎이 되었지요.</p><p>그러고는 강물 쪽으로 몸을 돌려 오래 고개를 숙였어요. 강물은 이번에도 아무 말이 없었지요. 강가의 나무는 오래오래 그 자리에 서 있었어요. 물이 불어나면 뿌리를 적시고, 물이 줄면 그늘을 강 쪽으로 길게 늘였어요. 잎은 겨울에도 지지 않았어요.</p><p>골짜기로 올라오는 사람들은 아폴론의 머리에 얹힌 잎을 보고 이따금 물었어요.</p><p>“머리에 쓰신 그건 무슨 잎입니까?”</p><p>“월계수 잎이다.”</p><p>“전에는 그런 잎을 안 쓰시더니, 왜 쓰십니까?”</p><p>아폴론은 그 말에는 대답하지 않았어요. 대신 강 쪽을 한 번 내려다보고는 다음 사람의 물음을 받았지요. 사람들은 강가를 지날 때 이따금 그 나무 앞에서 걸음을 멈추었어요. 왜 멈추는지는 스스로도 잘 몰랐지요.</p><p>에로스는 그 뒤로 한동안 아폴론 앞에 나타나지 않았어요. 나타날 까닭도 없었지요. 할 말은 화살 두 대로 이미 다 해 두었으니까요.</p><p>그리고 그날 뒤로 신들 사이에는 이런 말이 돌기 시작했어요. 저 작은 활이 어디를 향하는지는 아무도 미리 알 수 없다고요. 그 말을 처음 꺼낸 것이 누구였는지는 아무도 기억하지 못해요.</p></article></noscript>
