  <noscript><article class="ns-text"><h1>노래로 짐승을 세운 사람</h1><h2>밭을 갈다 멈춘 소</h2><p>밭을 갈던 소가 걸음을 멈췄어요. 농부가 고삐를 당겼어요. 소는 꿈쩍도 하지 않았어요. 쟁기 날이 흙에 반쯤 박힌 채로 그대로 서 있었지요. 소는 귀 한쪽을 언덕 쪽으로 세우고 있었어요.</p><p>농부가 소 엉덩이를 툭 쳐 보았어요. 그래도 소용없었어요. 소는 눈을 반쯤 감고 있었어요. 아파 보이지도 않았고요.</p><p>농부도 그제야 들었어요. 언덕 위에서 소리가 내려오고 있었어요. 크지 않은 소리였어요. 그런데 다른 소리들이 그 소리를 비켜 가는 것 같았지요. 바람도 자기 차례를 기다리는 것처럼 들렸어요.</p><p>농부는 쟁기를 그 자리에 두고 언덕을 올라갔어요. 올라가 보니 벌써 사람이 여럿 서 있었어요. 다들 아무 말도 하지 않고 한쪽만 보고 있었지요.</p><p>물동이를 인 사람도 있었어요. 물이 넘쳐 어깨를 적시고 있었는데 그것도 모르는 눈치였어요.</p><p>너럭바위 위에 젊은이가 하나 앉아 있었어요. 무릎에 리라를 올려놓고 줄을 튕기고 있었지요. 머리가 어깨까지 내려왔고, 귀 뒤에 이파리 하나를 꽂고 있었어요. 월계수 잎이었어요.</p><p>소리는 낮게 깔렸다가 천천히 위로 올라갔어요. 올라갔다가 또 내려왔지요. 무슨 이야기를 하는 것 같은데 말은 한마디도 없었어요.</p><p>그 둘레에 짐승들이 앉아 있었어요. 여우 한 마리가 앞발을 모으고 앉아 있었고, 그 옆에 노루 두 마리가 나란히 서 있었어요. 마주치면 한쪽이 달아나야 하는 사이였는데도요. 짐승들은 서로를 보지 않았어요. 다들 젊은이 쪽만 보고 있었지요.</p><p>아이 하나가 앞으로 나가 여우를 만져 보려다가 어른한테 붙들렸어요. 어른은 아무 말도 하지 않고 아이 어깨만 꼭 잡았어요.</p><p>나무들도 이상했어요. 언덕 위 나무들이 다 한쪽으로 기울어 있었어요. 바람이 부는 쪽이 아니라 소리가 나는 쪽으로요.</p><p>노래가 끝났어요. 젊은이가 줄에서 손을 뗐어요. 그런데 아무도 움직이지 않았어요. 소리가 아직 언덕에 남아 있는 것 같았거든요.</p><p>여우가 먼저 일어났어요. 그러고는 천천히 덤불 쪽으로 걸어갔지요. 노루들도 그제야 몸을 돌렸어요. 짐승들이 다 내려가고 나서야 사람들이 웅성거리기 시작했어요.</p><p>“그 노래는 어디서 배웠소?” 농부가 물었어요.</p><p>“산에서 염소를 치면서 배웠어요.” 젊은이가 말했어요.</p><p>“산에서 누구한테 배웠소?”</p><p>젊은이는 웃기만 했어요. 그러고는 리라를 옆구리에 끼고 언덕을 내려갔어요. 사람들이 저절로 길을 비켜 주었어요.</p><p>농부는 밭으로 돌아갔어요. 소는 아직 그 자리에 서 있었어요. 쟁기도 아까 그대로였고요. 농부가 고삐를 당기자 이번에는 소가 순순히 걸었어요.</p><p>그날 저녁 마을에서는 다들 그 이야기를 했어요. 소가 멈춘 이야기, 여우와 노루가 나란히 앉아 있던 이야기요. 물동이를 인 사람은 어깨가 다 젖은 채로 집에 들어갔다지요.</p><p>그다음 날에도 언덕에서 소리가 났어요. 그다음 날에도요. 사람들은 밭일을 하다가 그 소리가 나면 손을 멈추게 되었어요. 나중에는 아예 연장을 놓고 언덕으로 올라가게 되었고요.</p><p>이 사람의 이름이 오르페우스예요. 그날 언덕에 올라갔던 사람들은 그 이름을 한참 뒤에야 알게 되었지요.</p><h2>산길에서 받은 것</h2><p>염소 한 마리가 자꾸 아래로 내려가려고 했어요. 아이가 돌을 하나 주워 그 앞에 굴렸어요. 염소는 걸음을 돌렸다가 조금 있다가 또 내려갔지요. 북쪽 산골에 있는 아주 작은 마을이었어요. 집이 열 채도 안 됐고, 아이가 하는 일이라고는 아침마다 이 염소들을 산으로 올려 보내는 것뿐이었어요. 오르페우스가 아직 아이였을 때 일이에요.</p><p>염소들은 아침에 올라가서 저녁에 내려왔어요. 그동안 아이는 딱히 할 일이 없었어요. 그래서 산에서 갈대를 잘라 소리를 내 보곤 했지요.</p><p>갈대 끝을 다듬어 불면 삑, 하는 소리가 났어요. 소리라기보다는 바람 새는 소리에 가까웠지요. 그래도 아이는 그것을 하루 종일 불었어요. 염소들은 신경도 쓰지 않았고요.</p><p>어느 날 아이가 바위에 앉아 그것을 불고 있는데, 산길에 누가 서 있었어요. 언제부터 서 있었는지 알 수 없었어요. 금빛 곱슬머리에 잎으로 엮은 관을 쓴 사람이었지요.</p><p>그 사람은 한참을 그냥 서서 들었어요. 아이가 부는 것을 다 듣고 나서야 입을 열었어요.</p><p>“그 갈대 피리로는 좋은 소리가 안 날 텐데.” 그 사람이 말했어요.</p><p>아이는 갈대를 등 뒤로 감췄어요.</p><p>“왜요?”</p><p>“구멍이 셋뿐이라 낼 수 있는 소리가 적잖니.”</p><p>그 사람은 아이 옆에 앉았어요. 그러고는 손을 내밀었어요. 감춘 것을 달라는 뜻이었지요. 아이는 한참 만에 그것을 꺼내 주었어요.</p><p>그 사람은 갈대를 이리저리 돌려 보더니 도로 돌려주었어요. 그리고 그날 저녁 내내 산길에 앉아 무언가를 깎았어요. 아이는 옆에서 염소를 지키며 그것을 보았지요. 해가 넘어가고 나서도 그 손이 하는 일이 보였어요. 그 손 둘레만 환했거든요.</p><p>이튿날 아침, 아이가 눈을 떴을 때 머리맡에 리라가 하나 놓여 있었어요. 거북 등딱지처럼 옴폭한 몸통에 줄이 일곱 개 걸려 있었지요. 그 옆에 이파리 하나가 같이 놓여 있었고요.</p><p>“줄은 일곱이면 된다.” 그 사람이 말했어요. “여덟은 필요 없어.”</p><p>아이가 줄을 하나 튕겨 보았어요. 서툰 소리가 났어요. 아이는 얼굴이 빨개져서 얼른 손을 뗐지요.</p><p>“소리는 손으로 내는 게 아니다.”</p><p>“그럼 뭘로 냅니까?”</p><p>“네 마음이 아는 것으로.”</p><p>아이는 그 말을 알아듣지 못했어요. 몇 해가 지나도 못 알아들었지요. 그 사람은 아폴론이었어요. 아폴론은 그 뒤로 그 산길에 오지 않았어요.</p><p>알아들은 것은 아주 나중이에요. 어머니가 앓아누운 겨울에 아이는 그 곁에 앉아 줄을 튕겼어요. 무엇을 튕겨야 할지 몰라서 그냥 손이 가는 대로 했지요. 그런데 그날 밤 어머니가 오랜만에 잠이 들었어요. 숨소리가 고르게 났지요. 아이는 손을 멈추면 깰까 봐 밤새 줄에서 손을 떼지 않았어요.</p><p>아이는 그때 자기 손을 내려다보았어요. 어제와 똑같은 손이었어요. 달라진 것은 손이 아니었지요. 그 겨울이 지나고 아이는 산을 내려왔어요. 염소는 이웃집에 맡겼고요. 마을 사람들이 어디 가느냐고 물었어요.</p><p>“제 노래를 들어 줄 사람이 있는 데로요.”</p><h2>가장 나중에 가는 사람</h2><p>오르페우스가 앉는 바위 둘레에는 날마다 사람이 모였어요. 노래가 끝나면 다들 한참 있다가 흩어졌지요. 밭으로 돌아가는 사람, 물을 길으러 가는 사람, 아이를 업고 온 사람.</p><p>그런데 늘 가장 나중까지 남는 사람이 하나 있었어요. 그 사람은 바위에서 조금 떨어진 풀밭에 앉아 있었어요. 무릎에 들꽃을 모아 놓고 하나씩 엮고 있었지요. 다들 가고 나서도 한참을 그러고 있었어요.</p><p>“오늘 노래는 다 끝났어요.” 오르페우스가 말했어요.</p><p>“알아요.”</p><p>“그런데 왜 안 가세요?”</p><p>“노랫소리가 아직 귀에 남아 있거든요.”</p><p>오르페우스는 줄에 얹으려던 손을 도로 내렸어요. 무슨 말을 해야 할지 몰라서 한참 그러고 앉아 있었지요.</p><p>“귀 뒤에 그건 뭐예요?”</p><p>“이파리요.”</p><p>“그건 나도 알아요.”</p><p>오르페우스는 웃었어요. 그러고는 그 이파리를 뽑아 손바닥에 올려놓았어요. 가장자리가 조금 마른 월계수 잎이었어요.</p><p>“이걸 준 사람이 있어요. 그 사람 이야기는 다음에 해도 돼요?”</p><p>“그럼요.”</p><p>그 사람의 이름은 에우리디케였어요. 언덕 아래 세 번째 집에 살았고, 아침이면 물을 길으러 나오는 사람이었지요.</p><p>그다음 날에도 에우리디케는 가장 나중에 갔어요. 그다음 날에도요. 갈 때는 엮어 놓은 화관을 바위 위에 놓고 갔지요. 오르페우스는 그것을 귀 뒤 이파리 옆에 꽂고 다녔어요. 꽃이 시들 만하면 새것이 놓여 있었고요.</p><p>한번은 오르페우스가 물었어요. 왜 늘 그것을 엮느냐고요.</p><p>“손이 심심해서요.” 에우리디케가 말했어요. “당신이 손을 놀리는 동안 나도 뭘 좀 하고 싶어서요.”</p><p>마을 사람들은 두 사람을 두고 별말을 하지 않았어요. 할 말이 없어서가 아니었어요. 그 풀밭 쪽을 보면 다들 그냥 웃고 지나가게 되었거든요.</p><p>여름이 끝날 무렵에 두 사람은 부부가 되었어요. 혼례는 언덕 아래 마당에서 했어요. 마을 사람들이 들꽃을 한 아름씩 안고 왔어요. 아이들은 담 위에 올라가 앉았지요. 그날 오르페우스는 리라를 들지 않았어요. 자기 혼례에서는 남이 부르는 노래를 듣고 싶다면서요.</p><p>에우리디케는 그날 화관을 두 개 엮었어요. 하나는 자기가 쓰고, 하나는 오르페우스 머리에 씌워 주었지요. 오르페우스 것이 조금 커서 자꾸 눈을 덮었어요.</p><p>그런데 그날 저녁에 횃불이 자꾸 꺼졌어요.</p><p>“횃불이 타지 않고 연기만 나네.” 누가 말했어요.</p><p>“마른 나무로 바꿔 오지.”</p><p>마른 것으로 바꿔 와도 마찬가지였어요. 불이 붙기는 하는데 얼마 못 가서 연기가 올라왔어요. 사람들은 눈이 매워서 자꾸 손등으로 눈을 문질렀지요. 그날 마당에 있던 사람들은 다들 눈이 붉었어요.</p><p>“혼례 불이 저러면 안 좋다던데.” 누가 아주 낮게 말했어요.</p><p>아무도 그 일을 오래 이야기하지 않았어요. 이튿날 아침에는 다들 밭으로 나갔거든요.</p><h2>이슬이 마르기 전에</h2><p>혼례를 치르고 며칠 지나지 않은 아침이었어요. 에우리디케가 바구니를 들고 나갔어요. 바위에 놓아둔 화관이 다 시들었거든요.</p><p>“풀밭에 가서 꽃 좀 꺾어 올게요. 금방 올게요.”</p><p>오르페우스는 바위에 앉아 줄을 고르고 있었어요. 줄 하나가 자꾸 늘어져서 그것을 조이는 중이었지요. 고개도 들지 않고 대답했어요.</p><p>“이슬 마르기 전에 와요.”</p><p>에우리디케가 웃는 소리가 났어요. 오르페우스는 고개를 들지 않고 줄만 계속 조였지요. 그게 그날 아침에 두 사람이 나눈 말의 전부였어요.</p><p>풀밭은 언덕 뒤편에 있었어요. 이슬이 아직 마르지 않아서 발목이 금세 젖었지요. 에우리디케는 꽃을 고르면서 안쪽으로 조금씩 들어갔어요. 풀이 무릎까지 오는 데였어요.</p><p>풀 사이에서 무언가가 스치고 지나갔어요. 아주 짧았어요. 무엇이 지나갔는지 보이지도 않았지요. 에우리디케는 발목을 내려다보았어요. 자국이 두 개 나 있었어요. 뱀이 남긴 자국이었어요. 바늘로 살짝 찍은 것만 했지요.</p><p>처음에는 따끔하기만 했어요. 그래서 꽃을 마저 꺾었어요. 바구니가 반쯤 찼을 때 에우리디케는 언덕 쪽으로 걸음을 옮겼지요.</p><p>걷다가 한 번 멈춰 섰어요. 그러고는 다시 걸었어요. 얼마 못 가서 또 멈춰 섰지요. 바구니를 든 손이 자꾸 아래로 내려갔어요.</p><p>풀밭 한가운데에서 바구니를 놓쳤어요. 꽃이 쏟아졌어요. 언덕 위에서 그것을 본 사람이 소리를 질렀어요.</p><p>“오르페우스!”</p><p>사람들이 뛰어 내려왔어요. 오르페우스가 가장 먼저 닿았지요. 손에 아직 리라가 들려 있었어요. 언덕에서 여기까지 그것을 들고 뛰어 내려온 거예요.</p><p>에우리디케는 눈을 뜨고 있었어요. 입술이 조금씩 움직였어요. 오르페우스가 귀를 가까이 댔어요. 무슨 말이었는지 오르페우스는 끝내 알아듣지 못했어요.</p><p>나중에 오르페우스는 그 순간을 몇 번이고 되짚어 보았어요. 입 모양을 하나씩 떠올려 보고, 소리를 붙여 보기도 했지요. 그래도 알 수 없었어요.</p><p>에우리디케는 그 풀밭에서 세상을 떠났어요. 사람들은 멀찍이 서 있었어요. 아무도 오르페우스를 일으키지 않았어요. 오르페우스는 오래 움직이지 않았어요.</p><p>해가 높이 올라왔어요. 풀잎의 이슬이 다 말랐어요. 쏟아진 꽃도 시들기 시작했지요. 사람들이 오르페우스 대신 그 꽃을 주웠어요. 한 사람이 그것을 바구니에 도로 담았어요. 그러고는 바구니를 어디에 두어야 할지 몰라서 한참 들고 서 있었지요.</p><p>그날 저녁, 언덕 뒤 골짜기 쪽으로 두 사람이 내려갔어요. 앞선 사람은 들꽃 화관을 쓰고 있었어요. 뒤따르는 사람은 발목에 작은 날개가 달린 신발을 신고 있었어요. 죽은 이를 아래로 데려가는 헤르메스였지요.</p><p>발소리는 하나만 났어요.</p><h2>가는 길만 있는 데</h2><p>오르페우스는 사흘 동안 리라를 들지 않았어요. 마을 사람들이 문 앞에 먹을 것을 놓고 갔어요. 그대로 있었지요.</p><p>첫날에는 사람들이 번갈아 들여다보았어요. 둘째 날에는 문 앞까지만 왔고요. 셋째 날에는 아무도 오지 않았어요. 무슨 말을 해야 할지 아무도 몰랐거든요.</p><p>언덕에도 사람이 올라가지 않았어요. 올라가 봐야 소리가 나지 않았으니까요. 마을이 그렇게 조용했던 적은 없었어요.</p><p>집 안에서는 아무 소리도 나지 않았어요. 리라는 벽에 세워져 있었어요. 줄 하나가 그날 아침처럼 늘어진 채로요.</p><p>나흘째 아침에 오르페우스가 문을 열고 나왔어요. 손에 리라가 들려 있었어요. 그리고 언덕이 아니라 반대쪽으로 걸어갔어요.</p><p>“리라를 들고 어디 가나?” 농부가 물었어요.</p><p>“저승에 에우리디케를 데리러 갑니다.”</p><p>농부는 들고 있던 것을 떨어뜨렸어요. 그러고는 얼른 앞을 막아섰지요.</p><p>“거기는 가는 길만 있고 오는 길은 없다는 데야.”</p><p>“압니다.”</p><p>“산 사람이 저승에 어떻게 들어가?”</p><p>“어떻게 들어갈지는 저도 모릅니다.”</p><p>오르페우스는 그렇게 말하고 농부를 비켜 갔어요. 마을 사람 몇이 뒤를 따라오다가 골짜기 앞에서 걸음을 멈췄어요. 거기서부터는 아무도 더 갈 수 없었거든요.</p><p>누군가 뒤에서 이름을 불렀어요. 오르페우스는 돌아보지 않았어요. 골짜기 안쪽은 낮인데도 어두웠어요. 내려갈수록 소리가 하나씩 줄었어요. 새소리가 먼저 사라졌어요. 그다음에는 바람 소리가 사라졌지요. 나중에는 자기 발소리도 잘 들리지 않았어요.</p><p>오르페우스는 걸으면서 리라를 품에 안았어요. 바람 한 점 없는 데였는데도 그렇게 안고 걸었어요.</p><p>길이 넓어졌어요. 잿빛 들판이 끝없이 펼쳐져 있었어요. 향기가 나지 않는 하얀 꽃이 발밑에 가득 피어 있었지요. 오르페우스는 그 꽃을 밟지 않으려고 걸음을 골라 디뎠어요.</p><p>들판 끝에 강이 있었어요. 물빛이 검었어요. 물살이 있는데 소리가 나지 않았어요. 강가에 나룻배가 한 척 매여 있었어요. 배 옆에는 삿대를 짚은 늙은 사공이 서 있었지요.</p><p>그 강가에는 사람도 여럿 앉아 있었어요. 뱃삯이 없어 배를 못 탄 이들이었어요. 다들 무릎을 안고 강만 보고 있었지요. 오르페우스가 그 앞을 지나가는데도 아무도 고개를 들지 않았어요.</p><p>오르페우스가 강가에 섰어요. 손에 든 것은 리라 하나뿐이었어요. 사공이 고개를 들었어요. 그러고는 오르페우스를 오래 보았어요. 그 강가에서 숨 쉬는 소리가 나는 일은 아주 드물었거든요.</p></article></noscript>
