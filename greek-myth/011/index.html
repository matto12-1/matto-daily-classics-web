  <noscript><article class="ns-text"><h1>태어난 날 소를 훔친 아기</h1><p>델포이 골짜기는 온통 김이었어요. 땅 밑에서 올라온 하얀 김이 무릎께까지 차 있어서 발밑이 보이지 않았지요. 아폴론은 그 속으로 한 걸음씩 걸어 들어갔어요.</p><p>바위마다 굵은 것이 오래 스치고 지나간 자국이 남아 있었어요. 골짜기에는 풀 한 포기 없었어요. 물소리도 새소리도 나지 않았지요.</p><p>그때 어디선가 무언가가 크게 뒤척였어요. 김이 한쪽으로 확 밀렸어요. 아폴론은 걸음을 멈추고 그쪽을 보았어요.</p><p>“네가 이 골짜기를 막고 있어서 사람들이 물을 길으러 못 온다더구나.”</p><p>대답은 없었어요. 대신 김 속에서 아주 낮은 소리가 길게 울렸어요. 골짜기 전체가 그 소리에 조금 떨렸지요.</p><p>김이 확 걷혔어요. 아폴론의 키를 훌쩍 넘는 것이 몸을 일으켰어요. 바위에 남아 있던 그 굵은 자국이 무엇이었는지 그제야 알 수 있었지요.</p><p>아폴론은 뒤로 물러서지 않았어요. 대신 한 걸음 더 들어갔어요. 금활을 들고 시위를 당기는 데 걸린 시간은 숨 한 번 쉴 만큼이었어요. 화살이 김 속으로 사라졌어요.</p><p>그리고 조용해졌어요. 김이 천천히 걷혔어요. 아래 마을 사람들이 조심조심 산길을 올라와 보았지요. 바위에 긁힌 자국은 아직 그대로 있었어요. 그런데 그 위에 아폴론이 앉아 있었어요. 무릎에 팔을 얹은 채로요.</p><p>그날부터 사람들은 앞일이 궁금하면 그 골짜기로 올라갔어요. 아폴론은 델포이를 자기 자리로 삼았지요.</p><p>아폴론에게는 소 떼도 있었어요. 북쪽 어느 들판에서 기르는 흰 소들이었어요. 뿔이 곧고 등이 눈처럼 흰 소들이었지요. 아침마다 안개 속에서 그 소들이 걸어 나오는 모습을 보는 게 아폴론은 참 좋았어요.</p><p>그 소를 세어 본 사람은 아폴론뿐이었어요. 그런데 어느 날 아침, 그 수가 맞지 않았어요. 그 이야기를 하려면 하루 전, 아주 멀리 떨어진 어느 산속 동굴로 가야 해요.</p><p>높은 산 깊은 곳에 동굴이 하나 있었어요. 님프가 혼자 사는 동굴이었지요. 사람도 신도 좀처럼 찾아오지 않는 자리였어요.</p><p>그날 새벽, 그 동굴에서 아기가 태어났어요. 그 아기의 아버지는 제우스였어요. 님프는 아기를 씻겨 포대기에 싸고, 갈대를 엮어 만든 요람에 눕혔어요. 곁에 앉아 아기를 한참 들여다보았지요.</p><p>아기는 눈을 뜨고 동굴 천장을 보았어요. 그다음에는 벽을 보았어요. 그다음에는 문 쪽을 아주 오래 보았어요.</p><p>“얌전하기도 하지.”</p><p>님프가 아기의 이마에 손을 얹으며 말했어요. 말하고 나서 곧 잠이 들었지요. 밤새 힘을 다 쓴 참이었으니까요.</p><p>님프의 숨소리가 고르게 바뀌자, 요람 안에서 부스럭 소리가 났어요. 아기가 포대기를 밀어냈어요. 요람 가장자리를 붙잡고 몸을 일으켰어요. 한쪽 다리를 넘기고, 다른 쪽 다리를 넘겼지요. 바닥에 내려선 발이 잠깐 휘청했어요.</p><p>그리고 아기는 걸었어요. 세상에 나온 지 반나절 만에요.</p><h2>동굴 문턱의 거북</h2><p>동굴 문턱에 무언가가 놓여 있었어요. 아기는 그 앞에 쭈그리고 앉았어요. 거북 등딱지였어요. 속은 텅 비어 있었고, 오래 굴러다닌 듯 색이 바래 있었지요. 아기는 그것을 두 손으로 들어 올려 이리저리 뒤집어 보았어요.</p><p>등딱지 안쪽은 동그란 그릇처럼 옴폭했어요. 아기가 손가락으로 그 안을 톡 쳐 보았어요. 통, 하는 소리가 났어요. 소리가 등딱지 안에서 한 바퀴 돌고 나오는 것 같았지요.</p><p>아기의 눈이 커졌어요. 아기는 동굴 안팎을 돌아다니며 이것저것 주워 왔어요. 곧은 갈대 두 대, 마른 힘줄 몇 가닥, 짐승이 물어뜯어 놓고 간 가죽끈 하나요.</p><p>갈대를 등딱지 양쪽에 세워 기둥으로 삼았어요. 그 위에 짧은 막대를 가로질러 얹었지요. 그리고 힘줄을 하나씩 팽팽하게 걸었어요. 하나, 둘, 셋. 그렇게 일곱 줄을 걸었어요.</p><p>다 만들고 나서 아기는 그것을 눈높이까지 들어 올렸어요. 등딱지가 동굴 안으로 들어온 빛을 받아 반들반들 빛났어요. 사람들이 나중에 리라라고 부르게 될 물건이 그렇게 처음 생겼지요.</p><p>“너는 살아서 산을 오르내렸겠구나.”</p><p>아기가 등딱지에게 말했어요. 태어나서 처음으로 소리 내어 한 말이었지요.</p><p>“이제는 노래를 하렴.”</p><p>그러고는 그것을 무릎에 올려놓고 줄 하나를 튕겼어요. 소리가 동굴 벽에 부딪혔다가 돌아왔어요. 아기는 그 소리가 다 사라질 때까지 가만히 있었어요.</p><p>다시 튕겼어요. 이번에는 손가락 여러 개로요. 소리가 겹치면서 무언가가 되었어요. 아기는 그 소리에 맞춰 흥얼거리기 시작했어요.</p><p>한참 뒤에 아기는 손을 멈췄어요. 그리고 그것을 요람 안쪽에 조심스럽게 내려놓았어요. 포대기를 그 위에 덮어 두는 것도 잊지 않았지요.</p><p>그러고 나니 배가 고팠어요.</p><h2>뒤로 걷는 소 쉰 마리</h2><p>아기는 동굴 밖으로 나갔어요. 해가 산 너머로 내려가고 있었어요. 아기는 산을 하나 넘고, 또 하나 넘었어요. 발이 그렇게 작은데도 걸음은 굉장히 빨랐어요.</p><p>그러다 넓은 들판에 닿았어요. 달빛 아래에 하얀 것들이 잔뜩 서 있었어요. 소였어요. 뿔이 곧고 등이 흰 소들이었지요.</p><p>아기는 울타리에 턱을 걸치고 그 소들을 오래 보았어요. 그러다 천천히 쉰 마리를 세었어요. 여기서부터가 이상한 대목이에요.</p><p>아기는 소들을 몰고 그냥 나가지 않았어요. 소 한 마리 한 마리를 돌려세워, 뒤로 걷게 했어요. 앞으로 가면서 발자국은 뒤로 남게요.</p><p>소들이 처음에는 말을 듣지 않았어요. 아기는 서두르지 않았어요. 한 마리씩 옆구리를 톡톡 두드리며 방향을 잡아 주었지요.</p><p>“조금만 더 뒤로.”</p><p>아기가 소 귀에 대고 속삭였어요. 소들이 콧김을 뿜으며 한 걸음씩 뒷걸음질을 치기 시작했어요. 그러고 나서 아기는 자기 발도 걱정이 되었어요. 작은 발자국이 소 떼 옆에 나란히 찍히면 금방 들킬 테니까요.</p><p>아기는 나뭇가지와 넓은 잎을 엮어 자기 발에 묶었어요. 신발보다 훨씬 크고 넓적한 것이었지요. 그것을 신고 걸으면 발자국이 아니라 그냥 쓸린 자국만 남았어요.</p><p>그렇게 소 쉰 마리가 밤새 들판을 떠났어요. 아기는 소들을 강가의 어느 굴에 넣었어요. 굴 앞은 덤불로 가렸어요. 소들은 먼 길을 걸어 지쳤는지 금방 자리에 엎드렸지요.</p><p>새벽빛이 올라올 무렵, 아기는 동굴로 돌아왔어요. 발에 묶었던 것을 풀어 강물에 흘려보냈어요. 잎사귀들이 물살을 타고 저 멀리 떠내려갔어요.</p><p>그러고는 요람으로 기어 들어가 포대기를 목까지 끌어올렸어요. 눈을 감고, 숨소리를 아주 작게 냈지요. 님프는 아직 자고 있었어요.</p><h2>거꾸로 난 발자국</h2><p>아침에 아폴론이 들판에 갔어요. 소가 쉰 마리 없었어요. 아폴론은 울타리 안팎을 샅샅이 살폈어요. 발자국은 있었어요. 그런데 그 발자국은 전부 들판 쪽으로 걸어 들어오고 있었어요. 나간 자국이 하나도 없었지요.</p><p>아폴론은 그 자리에 한참 서 있었어요. 소가 쉰 마리나 걸어 들어오기만 하고 나가지는 않았다니, 말이 되지 않았거든요.</p><p>들판 가장자리에서 나이 많은 농부가 포도나무를 손질하고 있었어요. 아폴론이 다가가 물었어요.</p><p>“어젯밤에 제 소들이 없어졌습니다. 혹시 뭘 보셨습니까?”</p><p>농부는 손을 멈추고 아폴론을 올려다보았어요. 그러고는 아주 조심스럽게 입을 열었지요.</p><p>“이런 말씀을 드려도 될지 모르겠습니다만.”</p><p>“말씀하세요.”</p><p>“아기가 소를 몰고 갔습니다.”</p><p>“아기가요?”</p><p>“걸음마도 겨우 뗄 것 같은 아기였습니다. 그런데 소들이 뒤로 걷고 있었어요. 제 눈이 어떻게 된 줄 알았지요.”</p><p>아폴론은 고맙다고 하고 걸음을 옮겼어요. 이번에는 발자국을 보지 않았어요. 대신 냄새를 따라갔지요. 소 쉰 마리가 지나간 자리에서 나는 냄새는 거꾸로 걸을 수가 없으니까요.</p><p>냄새는 강가에서 끊겼어요. 아폴론이 덤불을 헤치자 굴 안쪽에서 소 우는 소리가 났어요. 아폴론은 소들을 그대로 두고 다시 냄새를 따라 산을 올랐어요. 잎사귀 냄새가 났어요. 이 산에는 없는 잎이었지요.</p><p>해가 높이 뜰 무렵, 아폴론은 어느 동굴 앞에 섰어요. 동굴 안은 어두웠어요. 안쪽에 갈대 요람이 하나 놓여 있었어요. 그 안에 아기가 포대기를 목까지 덮고 누워 있었지요. 새근새근 자는 것처럼요.</p><p>아폴론은 요람 앞에 섰어요. 포대기 끝이 조금 삐뚤어져 있었어요. 방금 누군가 급하게 끌어 덮은 것처럼요.</p><p>“내 소 어디 있어?”</p><p>아기가 눈을 반쯤 떴어요. 그리고 아주 졸린 목소리로 대답했어요.</p><p>“소가 뭐예요?”</p><p>“들판에서 없어진 내 소 쉰 마리 말이야. 등이 흰 소.”</p><p>“저는 어제 태어났는데요.”</p><p>아기가 포대기를 조금 더 끌어올렸어요. 하품도 아주 크게 한 번 했지요. 눈가에 눈물이 조금 맺힐 정도로요.</p><p>“저는 아직 젖밖에 못 먹어요. 걷지도 못하고요. 소가 어떻게 생긴 건지도 몰라요.”</p><p>아폴론은 아무 말도 하지 않고 아기를 내려다보았어요. 동굴 안이 아주 조용해졌어요. 밖에서 새 우는 소리만 두어 번 들렸지요.</p><p>“게다가 저는 지금 아주 졸려요.”</p><p>아폴론이 몸을 굽혔어요. 그리고 포대기 밖으로 삐죽 나온 아기 발에서 무언가를 손가락으로 떼어 냈어요. 마른 풀 한 가닥이었어요. 들판에서만 자라는 풀이었지요.</p><p>아기는 잠깐 아무 말도 하지 않았어요. 아폴론의 손가락에 붙은 그 풀을 눈으로 한 번 따라갔다가, 슬그머니 시선을 거두었지요. 동굴 밖에서 바람이 한 번 들어왔어요.</p><p>“아버지께 가자.”</p><p>아폴론이 아기를 포대기째 안아 들며 말했어요. 두 사람은 올림포스산으로 올라갔어요. 아기는 가는 내내 아폴론의 옷깃을 만지작거렸지요. 한 번도 울지 않았고, 어디로 가느냐고 묻지도 않았어요.</p><p>산꼭대기에는 마침 신들이 여럿 모여 있었어요. 아폴론이 아기를 안고 들어서자 다들 하던 이야기를 멈췄지요. 제우스 앞에 섰을 때, 아폴론이 먼저 말했어요.</p><p>“이 아이가 제 소를 쉰 마리 가져갔습니다.”</p><p>제우스가 몸을 앞으로 기울여 아기를 내려다보았어요. 포대기 밖으로 나온 발이 아주 작았어요.</p><p>“형은 네가 소를 가져갔다는데, 정말이냐?”</p><p>아기는 눈을 동그랗게 뜨고 제우스를 올려다보았어요. 올려다보면서 아주 또박또박 말했지요.</p><p>“아버지, 저는 거짓말을 못 해요.”</p><p>제우스가 눈을 조금 크게 떴어요. 태어난 지 하루밖에 안 된 아기가 그렇게 또박또박 말하는 것은 처음 보았거든요.</p><p>“그래?”</p><p>“어제 태어났거든요. 거짓말이라는 걸 아직 못 배웠어요.”</p><p>산꼭대기가 조용해졌어요. 신들이 서로를 쳐다보았어요. 제우스는 왕좌 팔걸이를 손가락으로 두어 번 두드렸어요.</p><p>그러고는 웃음을 터뜨렸어요. 제우스는 한참을 웃었어요. 웃음소리가 하얀 기둥 사이로 울렸어요. 화로 앞에 앉아 있던 이가 놀라 고개를 들었을 정도였지요. 아폴론만 웃지 않았어요.</p><p>“소를 돌려주어라.”</p><p>제우스가 겨우 말했어요.</p><p>“그리고 형 앞에서는 모르는 척하는 얼굴 하지 말고.”</p><p>아기가 대답했어요. 요람에 누워 있을 때보다 훨씬 또렷한 목소리였어요.</p><p>“네.”</p><p>제우스는 고개를 끄덕이고 다시 왕좌에 등을 기댔어요. 아폴론과 아기는 그 앞에서 물러나 기둥 사이로 걸어 나갔지요.</p><h2>강가에서 바꾼 것</h2><p>아기가 앞장서서 강가로 내려갔어요. 이번에는 아폴론이 뒤를 따라갔지요. 덤불을 헤치자 소들이 눈을 껌뻑이며 걸어 나왔어요. 아폴론이 한 마리씩 세었어요. 마흔여덟, 마흔아홉, 쉰. 한 마리도 다치지 않았고, 한 마리도 모자라지 않았어요.</p><p>아폴론이 소를 몰려고 몸을 돌렸을 때, 뒤에서 무슨 소리가 났어요. 아기가 강가 돌에 앉아 무릎 위에 무언가를 올려놓고 있었어요. 거북 등딱지였어요. 포대기 속에 숨겨서 여기까지 안고 온 거예요. 아기는 손가락으로 줄을 천천히 튕기고 있었지요.</p><p>소리가 물 위로 퍼졌어요. 낮은 소리가 먼저 가고, 높은 소리가 그 위에 얹혔어요. 강물 소리가 그 아래에 깔렸어요.</p><p>아폴론이 걸음을 멈췄어요. 아폴론은 태어나서 여러 가지 소리를 들어 보았어요. 파도 소리, 바람 소리, 시위가 우는 소리요. 그런데 이런 소리는 처음이었어요. 소리인데 무언가를 이야기하고 있었거든요.</p><p>아기는 노래도 불렀어요. 세상이 어떻게 생겨났는지, 누가 먼저 태어났는지에 대한 노래였어요. 아주 짧은 노래였지요.</p><p>아폴론은 소 떼도 잊고 그 자리에 서 있었어요. 노래가 끝나고 나서도 한참 동안 그대로였어요. 강물 소리만 남았어요.</p><p>“네가 튕기던 그거 나 줘.”</p><p>아폴론이 말했어요.</p><p>“싫은데요.”</p><p>“소 쉰 마리랑 바꾸자.”</p><p>아기가 고개를 들었어요. 눈이 반짝했어요.</p><p>“전부요?”</p><p>“전부.”</p><p>아기는 등딱지를 손바닥으로 한 번 쓸어 보았어요. 그리고 두 손으로 그것을 내밀었지요.</p><p>“이건 이렇게 잡는 거예요.”</p><p>아기가 아폴론의 손가락을 하나씩 줄 위에 올려 주었어요. 아폴론이 줄을 조심스럽게 튕겼어요. 서툰 소리가 났어요.</p><p>아폴론은 웃었어요. 그날 아침 소를 잃은 뒤로 처음이었어요. 그러고는 어깨에 걸치고 있던 가느다란 금빛 지팡이를 풀어 아기에게 내밀었어요.</p><p>“소는 네가 쳐라. 나는 이제 이것만 있으면 된다.”</p><p>아기는 그 지팡이를 두 손으로 받아 들었어요. 지팡이는 아기 키보다 길어서 한쪽 끝이 자꾸 바닥에 끌렸지요.</p><p>그날 저녁 제우스가 아기를 다시 불렀어요. 아기는 이번에는 걸어서 올라왔어요. 산 아래 강가에서 산꼭대기까지, 반나절 만에요. 제우스는 그 걸음을 처음부터 끝까지 보고 있었어요.</p><p>“너는 이름이 있느냐?”</p><p>“아직 없어요.”</p><p>“그럼 네 이름은 헤르메스다.”</p><p>제우스가 그렇게 이름을 지어 주었어요. 헤르메스는 그 이름을 입 속으로 한 번 굴려 보더니 마음에 든다는 얼굴을 했어요.</p><p>그러고는 제우스가 왕좌에서 내려와 헤르메스 앞에 앉았어요. 왕이 왕좌에서 내려오는 건 흔한 일이 아니었지요.</p><p>“오늘 네가 한 일 가운데 마음에 든 게 하나 있다.”</p><p>헤르메스는 무슨 말인지 몰라 고개를 갸웃했어요. 오늘 한 일이라면 소를 몰고 간 것밖에 없었으니까요.</p><p>“소를 몰고 간 거요?”</p><p>“아니, 소 일은 아니다.”</p><p>제우스가 고개를 저었어요. 대신 손가락으로 산 아래를 가리켰어요.</p><p>“들판에서 강가까지, 강가에서 산꼭대기까지, 산꼭대기에서 다시 강가까지. 너는 그 길을 하루 만에 다 다녔더구나. 지친 기색도 없이.”</p><p>헤르메스는 어깨를 으쓱했어요.</p><p>“재미있었어요.”</p><p>“신들은 저마다 자기 자리에 앉아 있다. 바다는 바다에, 저승은 저승에, 화로는 화로 앞에. 그래서 서로 무슨 일이 있는지 모른다.”</p><p>제우스가 말했어요.</p><p>“그 사이를 오갈 사람이 하나 필요하다.”</p><p>그러고는 제우스가 무언가를 내밀었어요. 작은 신발 한 켤레였어요. 발목 옆에 하얀 깃털이 한 쌍씩 붙어 있었지요.</p><p>“전할 말은 그대로 전해라. 보태지도 말고 빼지도 말고. 그리고 어디든 가장 먼저 도착해라.”</p><p>헤르메스가 신발을 신었어요. 끈을 매고 자리에서 일어섰어요. 첫걸음을 떼는 순간, 발이 바닥에서 한 뼘쯤 떠올랐어요. 헤르메스가 아래를 내려다보았어요. 깃털이 저 혼자 파르르 떨리고 있었지요.</p><p>헤르메스는 씩 웃었어요. 그러고는 기둥 사이로 달려 나갔어요. 산꼭대기의 신들이 고개를 돌렸을 때, 그 자리에는 아직 가라앉지 않은 먼지 한 줌만 남아 있었어요.</p></article></noscript>
