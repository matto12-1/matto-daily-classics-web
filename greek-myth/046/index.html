  <noscript><article class="ns-text"><h1>뿔이 금인 사슴, 그리고 외양간</h1><h2>일 년째 쫓는 발자국</h2><p>발자국이 또 서리 위에 찍혀 있었어요. 헤라클레스는 무릎을 꿇고 그것을 들여다보았지요. 가장자리가 아직 무너지지 않았어요. 지나간 지 얼마 안 되었다는 뜻이었어요.</p><p>발자국은 여느 사슴 것과 달랐어요. 발굽이 눌린 자리만 서리가 녹지 않고 그대로 하얗게 남아 있었거든요. 발굽이 청동이라 그랬지요.</p><p>헤라클레스는 일어서서 그 자국이 가리키는 쪽을 보았어요. 그쪽에도 눈 덮인 산이 있었어요. 그 뒤에도 있었고요.</p><p>그 발자국을 쫓기 시작한 것이 지난해 이맘때였어요. 왕이 시킨 것은 사슴 한 마리였어요. 뿔이 금인 사슴이요. 처음 그 말을 들었을 때 헤라클레스는 이번 일은 쉽겠다고 생각했어요. 사슴이니까요.</p><p>그런데 그 사슴은 아르테미스의 것이었어요. 산과 숲에서 은빛 활을 들고 다니는 그 여신 말이에요. 아르테미스가 아끼는 사슴 다섯 마리 가운데 딱 한 마리만 붙잡히지 않고 남았는데, 그게 이 사슴이었지요.</p><p>그러니 다치게 하면 안 되었어요. 화살도 쓸 수 없었고요. 산 채로, 흠 하나 없이 데려가야 했어요.</p><p>사슴은 하루도 같은 자리에 머물지 않았어요. 헤라클레스는 걸어서 그 뒤를 따라갔어요. 봄에는 들판을 건넜고, 여름에는 강을 세 번 건넜고, 가을에는 북쪽 숲으로 들어갔지요.</p><p>겨울에는 눈 위에 자국이 남아서 쫓기가 조금 나았어요. 그런데 사슴도 그것을 아는지 바위가 많은 데로만 다녔어요.</p><p>그 일 년 동안 헤라클레스는 사슴을 여러 번 보았어요. 늘 저만치 앞이었지요. 뿔이 아침 해에 한 번 반짝하고, 그다음에는 없었어요.</p><p>그 일 년 동안 헤라클레스는 신을 네 번 갈아 신었어요. 미케네에서 심부름꾼도 두 번 찾아왔고요.</p><p>“사슴은 아직 못 잡으셨습니까?”</p><p>“아직 못 잡았습니다.”</p><p>심부름꾼은 그 말만 듣고 돌아갔어요. 두 번 다 그랬지요. 두 번째로 왔을 때는 헤라클레스가 어느 산에 있는지 찾는 데만 엿새가 걸렸다고 했어요.</p><p>그러다 헤라클레스는 이상한 것을 알아챘어요. 사슴이 아무 데로나 달아나는 게 아니었어요. 어떤 강 여울을 자꾸 다시 지나갔거든요. 세어 보니 그 일 년 동안 다섯 번이었어요.</p><p>그래서 헤라클레스는 쫓는 것을 그만두었어요. 대신 그 여울가 덤불에 들어가 앉았지요. 그러고는 기다렸어요.</p><p>기다리는 동안 헤라클레스는 아무 소리도 내지 않았어요. 새들이 어깨에 앉았다가 갔어요. 열이레째 되는 날에는 여우 한 마리가 옆에 와서 자고 갔고요.</p><p>열이레를 기다렸어요. 그동안 눈이 두 번 왔어요. 열여드레째 새벽에 물소리가 났지요. 사슴이 여울 한가운데에 서 있었어요. 고개를 숙이고 물을 마시고 있었어요. 뿔이 물에 비쳐서 물속에도 금빛이 있었지요.</p><p>헤라클레스는 덤불에서 나가지 않았어요. 사슴이 물을 다 마실 때까지 기다렸어요. 그러고는 사슴이 뭍으로 올라와 앞다리를 드는 순간에 두 팔로 그 목을 감쌌지요.</p><p>사슴은 놀라기는 했지만 다치지는 않았어요. 헤라클레스가 그 목을 감쌀 때 힘을 아주 조금만 썼거든요. 일 년 동안 그 순간만 생각했으니까요.</p><p>헤라클레스가 사슴을 어깨에 올리고 여울을 건너는데 물소리가 뚝 그쳤어요. 앞을 보니 물가에 누가 서 있었어요. 머리를 뒤로 묶고 은빛 활을 든 사람이었지요.</p><p>“그 사슴을 내려놓아라.” 아르테미스가 말했어요.</p><p>헤라클레스는 사슴을 내려놓았어요. 사슴은 달아나지 않고 아르테미스 옆으로 걸어갔지요.</p><p>“이 사슴을 일 년 동안 쫓았습니다.” 헤라클레스가 말했어요.</p><p>“안다. 네가 쫓는 것을 나도 일 년 동안 지켜보았다.”</p><p>헤라클레스는 아무 말도 하지 못했어요. 그 일 년 동안 뒤에서 누가 보고 있다는 생각은 한 번도 해 보지 않았거든요.</p><p>“내 사슴을 왜 잡았느냐?”</p><p>“미케네의 왕이 시켰습니다.”</p><p>“그 왕이 시키면 남의 것도 가져가느냐?”</p><p>헤라클레스는 고개를 숙였어요. 그러고는 왜 그 왕에게 매여 있는지를 말했어요. 아주 짧게 말했어요. 길게 말할 수 있는 이야기가 아니었으니까요.</p><p>아르테미스는 한참 동안 사슴의 목을 쓸어 주었어요. 사슴은 눈을 반쯤 감고 있었지요.</p><p>“그 왕에게 사슴을 보여만 주고 놓아주어라.”</p><p>“그러겠습니다.”</p><p>“놓아주지 않으면 내가 찾으러 간다.”</p><p>헤라클레스는 그러겠다고 두 번 대답했어요. 아르테미스가 물가에서 물러섰어요. 사슴이 다시 헤라클레스 쪽으로 걸어왔지요. 이번에는 저 혼자 걸어왔어요.</p><h2>눈으로 몬 것</h2><p>미케네에 사슴을 데려갔을 때 왕은 그것을 오래 보았어요. 항아리 밖으로 나와서요. 금뿔이 정말 금인지 손가락으로 만져 보기까지 했지요.</p><p>“이 사슴은 이제 내 것이 되겠구나.”</p><p>“아닙니다. 놓아주기로 했습니다.”</p><p>왕이 뭐라고 하려는데 사슴이 고개를 한 번 들었어요. 뿔 끝이 왕의 금관보다 높았지요. 왕은 두 걸음 물러섰어요. 그러고는 그러라고 했어요.</p><p>헤라클레스는 성문 밖에서 사슴을 놓아주었어요. 사슴은 언덕을 내려가 들판으로 나갔어요. 한 번도 뒤를 돌아보지 않았고요.</p><p>그날 밤 헤라클레스는 성 밖 담 아래에서 잤어요. 성 안에 잘 데가 없어서가 아니었어요. 사자 가죽을 깔고 누우면 어디서든 잘 수 있었거든요. 다만 지붕 아래에서는 잠이 잘 오지 않았어요.</p><p>그날 왕은 사슴을 셈에 넣어 주었어요. 그런데 히드라는 여태 셈에 넣지 않고 있었지요. 헤라클레스는 그 이야기를 다시 꺼내지 않았어요.</p><p>그다음 일은 멧돼지였어요. 에리만토스라는 산에 사는 멧돼지였는데, 겨울마다 산 아래로 내려와 밭을 다 뒤집어 놓았지요. 어른 소만 했고 어금니가 팔뚝만 했어요.</p><p>이번에도 산 채로 데려오라고 했어요. 왕은 산 채로 데려오라는 말을 좋아했어요.</p><p>헤라클레스는 산에 올라가 멧돼지를 먼발치에서 보았어요. 그리고 곧바로 알았지요. 이 짐승은 앞에서 붙잡으려 들면 안 된다는 것을요. 힘이 문제가 아니라 발이 문제였거든요. 멧돼지는 덤불 사이를 배처럼 미끄러져 다녔어요.</p><p>헤라클레스는 산꼭대기 쪽을 올려다보았어요. 거기에는 눈이 사람 허리만큼 쌓여 있었어요. 그날부터 헤라클레스는 멧돼지를 위로 몰았어요. 아래로 내려가는 길목마다 서서 소리를 질렀지요. 사흘 동안 잠을 거의 자지 않았어요.</p><p>산 아래 마을 사람들은 처음에 헤라클레스를 도와주겠다고 했어요. 그런데 멧돼지가 한 번 지나가고 나서는 아무도 나오지 않았지요. 그 사흘 동안 산에는 둘뿐이었어요. 헤라클레스와 멧돼지요.</p><p>나흘째 되는 날 멧돼지가 눈밭으로 들어갔어요. 짧은 다리가 눈에 푹푹 빠졌어요. 그 큰 몸이 앞으로도 뒤로도 가지 못하고 그 자리에서 씩씩거렸지요.</p><p>헤라클레스는 눈 위를 걸어가 멧돼지를 어깨에 둘러멨어요. 그러고는 산을 내려왔어요. 멧돼지는 내려오는 내내 소리를 질렀어요.</p><p>미케네 큰 방 문이 열렸을 때 왕은 마침 왕좌에 앉아 있었어요. 어깨에 멧돼지를 멘 사람이 문간에 섰지요. 멧돼지가 그때 한 번 크게 울었어요.</p><p>그다음은 다들 짐작하는 대로였어요. 왕이 항아리로 뛰어들었거든요. 이번에는 뚜껑을 안에서 붙잡고 놓지 않았어요.</p><p>헤라클레스는 멧돼지를 안뜰에 내려놓고 기다렸어요. 한참 뒤에 항아리 안에서 목소리가 났지요.</p><p>“그 멧돼지를 가져가라. 어디로든 내다 버려라.”</p><p>헤라클레스는 멧돼지를 산 너머 아주 먼 데까지 몰고 가서 놓아주었어요. 돌아오는 데만 나흘이 걸렸지요.</p><h2>청동 깃털</h2><p>다음은 새였어요. 왕은 호숫가의 새 떼를 쫓아내라고 했지요. 그 새들은 깃털이 청동이었어요. 그냥 청동인 게 아니었어요. 놀라면 날개를 털었는데, 그때 깃털이 화살처럼 날아갔지요. 스팀팔로스라는 그 호숫가에는 이제 아무도 안 살았어요.</p><p>헤라클레스는 호숫가 바위에 사흘을 앉아 있었어요. 활을 들었다가 도로 내려놓기를 여러 번 했지요. 새가 너무 많았어요. 게다가 새들은 갈대밭 안쪽에 앉아 있어서 화살이 닿지 않았어요. 걸어 들어가면 늪처럼 발이 빠졌고요.</p><p>조카가 옆에서 물었어요. 왜 안 쏘느냐고요. 조카는 사슴 때도 멧돼지 때도 따라가지 못했어요. 이번에는 처음부터 와 있었지요.</p><p>“새들이 저 갈대밭 안에 앉아 있으면 화살로 못 맞혀.”</p><p>“그럼 어떻게 해요?”</p><p>“새들을 하늘로 날려야지.”</p><p>헤라클레스는 산을 하나 넘어 마을로 내려갔어요. 거기서 청동 그릇을 빌렸어요. 국을 끓이는 큰 그릇, 물을 담는 넓적한 그릇, 뚜껑까지요.</p><p>마을 사람들은 그것을 왜 빌려 가는지 묻지 않았어요. 다만 돌려주기는 하느냐고 물었지요. 헤라클레스는 돌려준다고 했어요.</p><p>새벽에 두 사람은 호숫가 바위에 올라갔어요. 그리고 그릇을 두드렸어요. 소리가 물 위로 퍼졌어요. 청동이 청동을 치는 소리였어요. 호수 건너편 산에 부딪혔다가 되돌아왔고요.</p><p>갈대밭이 한꺼번에 일어섰어요. 새들이 다 날아올랐거든요. 하늘이 잠깐 어두워졌어요. 새들은 사방으로 흩어졌어요. 몇 마리는 바위 쪽으로 날개를 털었어요. 청동 깃털이 돌에 부딪혀 쨍 소리를 냈지요. 헤라클레스는 사자 가죽을 펴서 조카를 덮었어요.</p><p>깃털 하나가 바위에 그대로 박혔어요. 조카가 나중에 그 자리를 살펴보았지요. 깃털이 돌 안쪽까지 들어가 있었어요. 조카는 그것을 뽑지 못하고 도로 물러났어요.</p><p>활은 그 뒤에 썼어요. 헤라클레스는 하늘에 대고 몇 번 쏘았어요. 남은 새들은 물 건너 산 너머로 날아갔지요. 그 뒤로 그 호숫가에 새 떼가 돌아왔다는 이야기는 없어요.</p><p>조카는 그 소리 때문에 사흘 동안 귀가 멍했어요. 헤라클레스가 하는 말을 자꾸 되물었지요.</p><p>돌아오는 길에 조카가 땅에 떨어진 깃털을 하나 주워 왔어요. 헤라클레스가 그것을 가져가지 못하게 했지요. 조카는 그것을 한참 손에 쥐고 있다가 호수에 던졌어요. 물에 닿는 소리가 돌이 떨어지는 소리 같았어요.</p><p>그릇은 다 돌려주었어요. 몇 개는 우그러져 있었지요. 헤라클레스가 그것을 무릎에 대고 손으로 펴서 돌려주었어요.</p><h2>물길을 돌린 하루</h2><p>왕은 이번에는 조금 다른 것을 생각해 냈어요. 헤라클레스가 돌아올 때마다 성 안 사람들이 담 위로 올라가 보았거든요. 아이들이 사자 가죽을 만져 보려고 뒤를 따라다녔고요. 그날 왕은 담 위쪽을 한참 올려다보다가 항아리 뚜껑을 안에서 닫았어요.</p><p>“이번에 할 일은 짐승을 잡는 일이 아니다.” 항아리 안에서 목소리가 났어요.</p><p>이웃 나라에 소가 아주 많은 왕이 있었어요. 삼천 마리를 길렀다지요. 그런데 그 외양간을 삼십 년 동안 한 번도 치우지 않았어요. 사람이 들어갈 수가 없게 되었거든요.</p><p>“그 외양간을 치워라. 너 혼자서, 하루 만에.”</p><p>왕의 말을 전하는 사람이 그 말을 옮기다가 한 번 멈췄어요. 사자를 이긴 사람에게 거름을 치우라는 말이었으니까요. 헤라클레스는 알겠다고 했어요. 그러고는 그 나라로 갔지요.</p><p>외양간은 골짜기 안에 있었어요. 냄새가 골짜기 밖까지 나왔어요. 그 나라 왕이 헤라클레스를 데리고 언덕에 올라가 아래를 보여 주었지요.</p><p>“이 외양간을 하루 만에 치운다고?”</p><p>“예.”</p><p>“하루 만에 하면 소 열 마리에 하나씩 주지.”</p><p>헤라클레스는 그 말에 대답하지 않았어요. 대신 언덕 위에 한참을 서 있었지요. 그런데 외양간을 보고 있는 게 아니었어요. 그 위쪽을 보고 있었어요.</p><p>골짜기 위쪽으로 강이 두 줄기 흐르고 있었어요. 하나는 북쪽에서, 하나는 서쪽에서요. 두 강은 골짜기를 지나치지 않고 옆으로 비껴 흘렀지요.</p><p>헤라클레스는 그날 하루를 삽질로 보냈어요. 그런데 외양간에서는 한 삽도 뜨지 않았어요. 강가에서만 팠지요.</p><p>소들은 미리 언덕 위에 올려 두었어요. 조카가 소를 세다가 이백에서 그만두었어요.</p><p>골짜기 사람들이 언덕에 올라와 그것을 보았어요. 처음에는 저 사람이 무엇을 하는지 아무도 몰랐지요. 해가 중천에 왔을 때 한 사람이 알아채고 소리를 질렀어요. 물길을 돌리는 거라고요.</p><p>그 소리를 듣고 몇 사람이 삽을 들고 내려왔어요. 헤라클레스는 오지 말라고 했어요. 혼자 하라고 한 일이었으니까요. 사람들은 언덕에 앉아서 보기만 했지요.</p><p>저녁이 되기 전에 헤라클레스는 두 강의 둑을 무너뜨렸어요. 북쪽 물줄기가 먼저 방향을 틀었어요. 그다음에 서쪽 물줄기가요. 두 물이 골짜기 입구에서 만났어요.</p><p>물이 외양간 안으로 들어갔어요. 앞쪽 담과 뒤쪽 담을 헤라클레스가 미리 헐어 두었거든요. 물은 들어왔다가 반대쪽으로 빠져나갔어요.</p><p>소들은 언덕 위에서 그것을 내려다보았어요. 몇 마리가 울었지요. 나머지는 그냥 풀을 뜯었고요. 해가 지기 전에 헤라클레스는 물길을 도로 돌려놓았어요. 외양간 바닥에서 돌이 나왔어요. 삼십 년 동안 아무도 본 적이 없는 돌이었지요.</p><p>조카는 언덕 위에서 그것을 다 보았어요. 나중에 그 이야기를 할 때마다 조카는 두 손으로 물줄기 두 개를 그려 보였대요.</p><p>그 나라 왕은 약속한 소를 주지 않았어요. 헤라클레스는 달라고 하지 않았어요. 그런 일에는 이제 익숙해졌거든요.</p><p>다만 골짜기 사람들이 빵과 치즈를 싸 주었어요. 언덕에 앉아 그것을 보고 있던 사람들이요. 헤라클레스는 그것을 받았어요.</p><p>돌아오는 길에 조카가 손가락을 꼽아 보았어요. 사슴과 멧돼지와 새와 외양간이요. 넷 다 힘으로 한 것이 하나도 없었어요. 기다린 것, 몰아넣은 것, 두드린 것, 물길을 돌린 것뿐이었지요.</p><p>조카가 그 이야기를 하자 헤라클레스는 웃었어요. 오랜만에 웃는 얼굴이었어요. 헤라클레스는 사흘 동안 강에서 몸을 씻었어요. 나흘째에 미케네로 돌아갔지요.</p><p>큰 방에 들어서자 사람들이 코를 막았어요. 그런데 아무 냄새도 나지 않자 슬그머니 손을 내렸어요. 왕좌는 비어 있었어요. 청동 항아리 뚜껑이 손가락 두 개만큼 열려 있었지요.</p><p>“외양간을 하루 만에 다 치웠습니다.” 헤라클레스가 말했어요.</p><p>항아리 안에서는 아무 소리도 나지 않았어요. 아주 한참 뒤에 뚜껑이 조금 더 열렸지요. 그 틈으로 쪽지 한 장이 나왔어요.</p><p>헤라클레스가 그것을 받아 펴 보았어요. 셈은 적혀 있지 않았어요. 대신 다음에 할 일 넷이 적혀 있었지요. 넷 다 바다 건너에 있는 것이었어요.</p></article></noscript>
