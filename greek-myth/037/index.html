  <noscript><article class="ns-text"><h1>돌고래가 된 뱃사람들</h1><h2>바위 위에서 자는 사람</h2><p>노 젓던 손들이 한꺼번에 멈췄어요.</p><p>뱃머리에 선 사람이 팔을 들어 보였거든요. 배는 소리 없이 미끄러져 바닷가 바위 아래로 들어갔어요. 노에서 떨어진 물방울이 뱃전을 타고 흘러내렸지요. 아침 해가 아직 낮아서 바위 그늘이 물 위까지 길게 뻗어 있었어요. 바다는 숨을 죽인 것처럼 잔잔했지요.</p><p>바위 위에 젊은이 하나가 누워 자고 있었어요. 검은 곱슬머리가 이마에 붙어 있었고, 자주색 천이 어깨에서 흘러내려 있었어요. 팔 밑에는 나무 지팡이가 하나 깔려 있었지요. 지팡이 끝에는 솔방울이 달려 있었고요.</p><p>이 배는 물건을 실어 나르는 배가 아니었어요. 섬과 섬 사이를 돌아다니며 남의 것을 빼앗아 사는 사람들의 배였지요. 노 젓는 자리 밑마다 빼앗은 물건이 쑤셔 박혀 있었어요. 항아리, 구리 그릇, 옷감 두루마리. 어느 것에도 원래 주인의 이름이 남아 있지 않았어요.</p><p>“바위 위에 저 아이를 봐라.” 우두머리가 낮게 말했어요.</p><p>뱃사람들이 목을 뺐어요. 우두머리는 벌써 셈을 하고 있었지요. 저런 옷을 입은 아이 하나면 이 배가 반년은 놀고먹을 수 있다는 셈이었어요.</p><p>우두머리가 손짓을 하자 뱃사람 넷이 소리 없이 바위로 올라갔어요. 발끝으로만 디디면서요. 젊은이는 깨지 않았어요. 넷이 팔과 다리를 하나씩 잡아 들어 올렸을 때에야 눈을 떴지요.</p><p>그런데 소리를 지르지 않았어요. 버둥거리지도 않았고요. 눈을 뜬 채 자기를 들고 가는 얼굴들을 하나씩 올려다볼 뿐이었어요.</p><p>넷 중 하나가 그 눈길을 견디지 못하고 고개를 돌렸어요. 그러고는 걸음을 서둘렀지요. 빨리 내려놓고 싶어서요.</p><p>갑판에 내려놓았을 때에도 젊은이는 그대로였어요. 무릎을 세우고 앉아 배 안을 천천히 둘러보았어요. 처음 타 보는 배가 신기하다는 듯이요.</p><p>우두머리가 그 앞에 쭈그려 앉았어요. 그리고 자주색 천 자락을 손가락 사이에 넣고 비벼 보았지요.</p><p>“너는 어느 집 아들이냐?” 우두머리가 물었어요.</p><p>젊은이는 대답하지 않았어요. 대신 뱃전 너머로 바다를 보았어요.</p><p>“말을 못 하는 모양이군.” 우두머리가 일어서며 말했어요. “상관없다. 이런 옷을 걸치고 다니는 아이는 찾으러 오는 집이 반드시 있다.”</p><p>뱃사람들이 웃었어요. 오늘은 운이 좋은 날이라고 누군가 말했지요. 그 웃음소리가 잦아들 때까지 젊은이는 바다만 보고 있었어요.</p><p>우두머리가 뱃사람 하나에게 뭍에서 사 온 밧줄이 남았는지 물었어요. 남았다고 하자 고개를 끄덕였지요. 그러고는 젊은이 쪽을 다시 한번 보았어요. 왕자든 뭐든, 묶어 두지 않으면 뛰어내리는 법이거든요.</p><p>키잡이는 뒤쪽에서 키를 잡은 채 서 있었어요. 이 배에서 나이가 가장 많은 사람이었지요. 바다에서 사십 년을 산 사람이라 남들이 못 보는 것을 보았어요. 물빛만 보고 바람이 언제 바뀔지 알았고, 구름 한 자락으로 그날 밤을 알았지요.</p><p>그 키잡이가 아까부터 지팡이를 보고 있었어요. 넷이 젊은이를 들어 올릴 때 지팡이도 함께 배로 넘어왔거든요. 그런데 아무도 손대지 않았는데 갑판 한가운데에 그대로 서 있었어요. 배가 흔들리는데도 넘어지지 않고요.</p><p>뱃사람 하나가 그것을 집으려고 손을 뻗었어요. 손가락이 지팡이에 닿기는 했어요. 그런데 들리지가 않았어요. 그 사람은 두 번 더 해 보고는 아무 말 없이 제자리로 돌아갔지요.</p><p>“아무도 안 잡았는데 저 지팡이가 혼자 서 있소.” 키잡이가 말했어요.</p><p>우두머리는 돌아보지 않았어요.</p><p>“저 젊은이를 놓아 주는 게 좋겠소.” 키잡이가 말을 이었어요. “저 사람은 우리가 데려갈 사람이 아니오.”</p><p>우두머리는 그 말에 대답하는 대신 닻줄 쪽으로 걸어갔어요. 그러고는 닻을 올리라고 짧게 일렀지요. 뱃사람들이 밧줄에 매달렸고, 젖은 닻이 뱃전을 긁으며 올라왔어요.</p><h2>저절로 풀리는 밧줄</h2><p>돛이 올라가고 배가 바다로 나왔어요. 바람이 좋아서 돛이 팽팽하게 부풀었지요. 뭍이 뒤로 물러나 가느다란 선이 되었어요.</p><p>우두머리가 밧줄을 가져오게 했어요. 뱃사람 둘이 젊은이의 손목과 발목을 묶었지요. 매듭을 두 번씩 지었어요. 배에서 쓰는 매듭이라 사람 손으로는 풀리지 않는 것이었어요.</p><p>묶고 나서 몸을 일으키는데 뒤에서 툭, 하는 소리가 났어요. 밧줄이 갑판에 떨어져 있었어요. 젊은이의 손목에도 발목에도 아무것도 없었고요. 젊은이는 아까 그 자리에 그대로 앉아 있었어요. 손목에 자국 하나 남지 않았지요.</p><p>뱃사람 둘이 서로를 쳐다보았어요. 그러고는 다시 묶었어요. 이번에는 손목이 하얗게 되도록 조였지요. 조이면서 한 사람이 자꾸 뒤를 돌아보았어요.</p><p>밧줄은 또 떨어졌어요. 이번에는 소리도 나지 않았어요. 뱀이 허물을 벗듯 스르르 흘러내렸지요. 세 번째는 우두머리가 직접 묶었어요. 매듭을 네 번 짓고, 남은 끝을 돛대에 붙들어 맸어요. 그러고는 두 걸음 물러서서 팔짱을 꼈지요.</p><p>팔짱을 끼자마자 매듭이 저절로 벌어졌어요. 밧줄이 돛대를 타고 스르륵 내려와 젊은이의 발치에 둥글게 감겼어요.</p><p>갑판이 조용해졌어요. 돛이 바람을 받는 소리만 났지요. 우두머리는 그 밧줄을 한참 내려다보다가 발로 툭 밀어 놓았어요.</p><p>젊은이는 그동안 한 번도 일어서지 않았어요. 밧줄이 세 번이나 풀렸는데도 달아나려 하지 않았지요. 그냥 그 자리에 앉아 사람들이 하는 것을 보고 있었어요.</p><p>키잡이는 사십 년 전 일을 떠올렸어요. 그때 이 배에는 늙은 키잡이가 하나 있었지요. 그 사람이 젊은 키잡이에게 이런 말을 한 적이 있어요. 바다에서 설명이 안 되는 것을 보거든 그날은 무조건 뱃머리를 돌리라고요. 그때는 그 말이 무슨 뜻인지 몰랐어요.</p><p>키잡이가 키를 놓고 앞으로 걸어 나왔어요.</p><p>“저 사람은 신이오.” 키잡이가 말했어요.</p><p>아무도 대답하지 않았어요.</p><p>“밧줄이 저절로 풀리는 사람을 나는 본 적이 없소. 사십 년을 바다에 있었는데 한 번도 없었소.” 키잡이가 말했어요. “어느 신인지는 나도 모르오. 그렇지만 사람은 아니오.”</p><p>우두머리가 키잡이 쪽으로 걸어왔어요. 두 사람은 한 팔 거리를 두고 마주 섰지요. 뱃사람들이 노를 쥔 채 그 둘을 번갈아 보았어요.</p><p>“사십 년을 바다에 있었으면 참견 말고 키나 잘 잡으시오.” 우두머리가 말했어요.</p><p>“저 젊은이를 내려 줍시다. 저기 섬이 보이잖소.”</p><p>“저긴 사람도 안 사는 섬이오. 거기 내려 주면 몸값은 누구한테 받소?”</p><p>“몸값은 잊으시오. 그냥 내려 주고 떠나자는 거요.”</p><p>우두머리가 웃었어요. 웃고 나서는 웃지 않는 얼굴이 되었지요. 뱃사람 하나가 노를 고쳐 쥐는 소리가 났어요.</p><p>“당신은 늙었소.” 우두머리가 말했어요. “늙으면 바다가 무서워지지. 나는 안 무섭소.”</p><p>“내가 무서워서 이러는 게 아니오.”</p><p>“그럼 왜 이러는 거요?”</p><p>“저 사람이 신이라는 걸 알아서 이러는 거요.”</p><p>우두머리는 그 말에 대꾸하지 않았어요. 대신 뱃사람들에게 노를 저으라고 했지요. 노가 물에 들어갔어요. 열두 자루가 한꺼번에요.</p><p>키잡이는 더 말하지 않았어요. 키로 돌아가 손바닥으로 자루를 한 번 쓸었어요. 사십 년 동안 잡아 온 자리였지요.</p><p>배는 섬을 왼쪽으로 흘려보내고 앞으로 나아갔어요. 젊은이는 그 섬이 뒤로 물러나는 것을 끝까지 보고 있었어요.</p><h2>돛대에서 자란 덩굴</h2><p>해가 높이 올라갔을 무렵이었어요. 배 안에 냄새가 돌기 시작했어요. 처음에는 다들 자기 옆 사람을 쳐다보았어요. 바다 한가운데에서 날 냄새가 아니었거든요. 잘 익은 포도 냄새였어요. 아주 진한 냄새였지요.</p><p>노를 젓던 사람 하나가 발밑을 내려다보았어요. 갑판 판자 틈으로 붉은 것이 배어 나오고 있었어요. 손가락을 대 보니 끈적하고 달았지요. 그 사람은 손가락을 옷에 문질러 닦았어요. 몇 번을 닦아도 냄새가 지워지지 않았고요.</p><p>그다음은 돛대였어요. 돛대 밑동에서 초록색 줄기가 하나 올라왔어요. 그 줄기가 돛대를 감고 위로 뻗었어요. 사람들이 보는 앞에서 뻗었지요.</p><p>잎이 넓게 벌어졌어요. 돛 위로 그늘이 졌어요. 그 그늘 아래로 시원한 바람이 지나갔고요. 노에도 덩굴이 감겼어요. 노를 젓던 사람들이 손을 뗐어요. 뗄 수밖에 없었어요. 덩굴이 손등 위로 기어 올라왔으니까요.</p><p>돛대 위쪽에서 열매가 매달리기 시작했어요. 검붉은 포도송이가 하나씩, 또 하나씩요. 그중 하나가 떨어져 갑판에서 터졌어요.</p><p>뱃사람들이 뒷걸음질을 쳤어요. 배는 이제 바다 위에 뜬 포도밭 같았지요. 이상한 것이 하나 더 있었어요. 돛이 저렇게 부풀어 있는데 배가 앞으로 나가지 않았어요. 물살이 뱃전을 지나가는 소리가 언제부터인지 뚝 끊겨 있었지요.</p><p>뱃사람 하나가 짐칸 뚜껑을 열어 보았어요. 그러고는 뚜껑을 놓쳤어요. 빼앗아 실어 둔 옷감 두루마리가 아래에서부터 붉게 젖어 올라오고 있었거든요. 항아리도 구리 그릇도 그 붉은 것에 잠겨 있었어요.</p><p>덩굴 한 가닥이 우두머리의 발목까지 왔어요. 우두머리가 그것을 밟아 끊었어요. 끊긴 자리에서 곧바로 새순이 두 개 올라왔지요.</p><p>우두머리가 자기 손을 내려다보았어요. 손바닥이 붉게 젖어 있었어요. 언제 묻었는지 우두머리도 몰랐지요.</p><p>“돛을 내려라!” 우두머리가 소리쳤어요.</p><p>아무도 움직이지 않았어요. 우두머리가 한 번 더 소리쳤어요. 목소리가 갈라져 나왔지요. 그래도 아무도 움직이지 않았어요.</p><p>그때 젊은이가 자리에서 일어섰어요. 일어서는데 갑판에 그림자가 크게 졌어요. 사람 하나가 만들 수 있는 그림자가 아니었어요. 그늘이 뱃머리에서 배 뒤쪽까지 한 번에 덮었지요.</p><p>돛 아래에 서 있는 것은 젊은이가 아니었어요. 갈기가 어깨를 덮은 아주 큰 짐승이었어요. 짐승이 고개를 들고 한 번 울었어요.</p><p>그 소리에 돛이 떨렸어요. 물잔에 담긴 물이 떨리듯이요. 짐승은 아무도 건드리지 않았어요. 그냥 서 있었어요. 그런데 그 자리에 서 있는 것만으로 배가 좁아졌지요.</p><p>뱃사람들이 뱃전으로 몰려갔어요. 그러고는 하나씩 바다로 뛰어들었어요. 누가 먼저랄 것도 없었지요.</p><p>우두머리는 마지막까지 남았어요. 뒷걸음질로 물러나다가 등이 뱃전에 닿았어요. 우두머리는 잠깐 그대로 서 있었어요. 그러고는 뒤로 넘어가듯 바다로 들어갔지요.</p><p>물에 닿는 순간 사람들의 등이 검고 매끈해졌어요. 팔이 짧아지고 몸이 활처럼 휘었어요. 물 위로 솟았다가 다시 들어가는 것들이 배 둘레에 가득했지요.</p><p>돌고래였어요. 남의 것을 빼앗아 살던 사람들이었는데, 그날은 자기들이 바다로 갔어요. 돌고래들은 배를 떠나지 않았어요. 뱃전 옆에 붙어서 나란히 헤엄쳤어요. 한 마리가 물 위로 솟을 때마다 물방울이 갑판까지 튀었지요.</p><h2>혼자 남은 키잡이</h2><p>키잡이는 키를 놓지 않았어요. 손이 떨렸어요. 그런데 놓지는 않았어요. 무서운 것을 봤다고 키를 놓으면 배가 옆으로 눕는다는 것을, 키잡이는 사십 년 동안 몸으로 배웠거든요. 그래서 떨리는 손으로 키를 잡은 채 그 자리에 서 있었어요.</p><p>갑판에는 이제 아무도 없었어요. 노 열두 자루가 덩굴에 감긴 채 그대로 걸려 있었지요. 조금 전까지 그 자리마다 사람이 앉아 있었는데 말이에요.</p><p>갑판 위의 그늘이 걷혔어요. 짐승은 없었어요. 돛 아래에는 젊은이가 서 있었지요. 아까 바위에서 자고 있던 그 사람이었어요.</p><p>머리에는 포도 덩굴이 감겨 있었어요. 어깨의 자주색 천은 그대로였고요. 갑판에 서 있던 나무 지팡이가 저절로 굴러와 그 손에 들어갔어요.</p><p>젊은이가 갑판을 가로질러 걸어왔어요. 키잡이는 물러서지 않았어요. 물러설 데도 없었지요. 뒤는 바다였으니까요.</p><p>젊은이가 키잡이 앞에 섰어요. 그리고 처음으로 입을 열었어요.</p><p>“디오니소스라고 합니다.” 디오니소스가 말했어요.</p><p>키잡이는 대답하지 못했어요. 조금 전에는 사람들 앞에서 신이라고 큰소리를 쳤는데, 정작 그 앞에 서니 목이 붙어 버렸지요.</p><p>“배를 돌리세요.” 디오니소스가 말했어요. “아까 그 섬으로요.”</p><p>키잡이가 키를 밀었어요. 뱃머리가 천천히 돌아갔어요. 돛에 감긴 덩굴이 바람을 받아 잎을 뒤집었지요. 배가 다시 앞으로 나가기 시작했어요.</p><p>돌고래들도 따라 돌았어요. 배가 도는 대로 함께 돌았어요.</p><p>“돌고래가 된 저 사람들은 어떻게 됩니까?” 키잡이가 겨우 물었어요.</p><p>디오니소스는 대답하지 않았어요. 뱃전에 손을 얹고 물 위를 한참 내려다볼 뿐이었지요.</p><p>“나도 저 사람들과 같은 배를 탔습니다.” 키잡이가 말했어요. “말리기만 하고 키를 돌리지는 않았고요.”</p><p>“압니다.”</p><p>“그런데 왜 나만 사람으로 남았습니까?”</p><p>“당신만 나를 알아보고 놓아 주자고 했으니까요.”</p><p>디오니소스는 그렇게만 말하고 더 설명하지 않았어요. 대신 갑판에 떨어진 포도송이를 하나 주워 키잡이에게 내밀었지요. 키잡이는 그것을 두 손으로 받았어요. 받고 나서도 한참 동안 먹지 못하고 들고만 있었어요.</p><p>섬이 조금씩 커졌어요. 나무 몇 그루와 흰 모래밭이 보였어요. 사람이 살지 않는 섬이라 연기가 오르는 데가 한 군데도 없었지요.</p><p>키잡이는 그제야 손에 든 포도송이에서 한 알을 떼어 입에 넣었어요. 단물이 목을 타고 내려갔어요. 그제야 목이 몹시 말랐다는 것을 알았지요.</p><p>돌고래 한 마리가 뱃전 가까이 붙어서 한참을 따라왔어요. 다른 것들보다 몸집이 컸어요. 키잡이는 그 등을 오래 내려다보았어요.</p><p>“저기 내려 드리면, 저는 어디로 갑니까?” 키잡이가 물었어요. “이 배는 내 배가 아닙니다. 돌아가면 저 사람들 몫까지 내가 물어내야 하고요.”</p><p>디오니소스가 몸을 돌렸어요. 그러고는 키잡이의 얼굴을 오래 보았어요. 눈가에 잔주름이 깊게 잡히고 손등이 여기저기 갈라진 얼굴이었지요.</p><p>디오니소스는 대답하기 전에 뱃전에서 손을 떼었어요. 그러고는 지팡이를 갑판에 한 번 짚었지요. 솔방울이 가볍게 흔들렸어요.</p><p>“너는 내 곁에 있어라.” 디오니소스가 말했어요.</p><p>키잡이는 키를 잡은 손에 힘을 주었어요. 배는 섬 쪽으로 나아갔어요. 돌고래들이 뱃전 옆에서 나란히 헤엄쳤지요. 그중 한 마리가 자꾸 고개를 들어 갑판 쪽을 올려다보았어요. 몸집이 큰 그 한 마리였어요.</p><p>“저 돌고래들도 자기들이 사람이었던 걸 압니까?”</p><p>디오니소스는 대답하지 않았어요. 대신 갑판에 떨어진 포도 한 알을 주워 물로 던졌어요. 큰 돌고래가 그것을 받아 물었지요. 그러고는 물속으로 들어갔어요. 한참 동안 올라오지 않았어요.</p></article></noscript>
