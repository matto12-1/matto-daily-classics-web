  <noscript><article class="ns-text"><h1>상자에 실려 온 아기</h1><h2>델포이에서 들은 말</h2><p>돌계단은 서른두 개였어요. 아르고스의 왕은 그것을 하나씩 세면서 올라갔어요. 세지 않으면 무릎이 먼저 멈출 것 같았거든요.</p><p>델포이 골짜기였어요. 아폴론의 말을 들으러 온 사람들이 저 아래 길에 줄지어 서 있었어요. 왕은 그 줄을 지나쳐 곧장 올라왔지요. 왕이니까요. 왕궁 창고에서 제일 좋은 청동 그릇을 하나 골라 왔고, 그것을 문 앞에 내려놓았어요.</p><p>안은 어두웠어요. 바닥 갈라진 틈에서 김이 올라와 천장께에서 흩어졌어요. 왕은 물어볼 말을 오는 내내 다듬어 두었어요. 딱 한 마디였지요.</p><p>“나에게 아들이 생기겠는가?”</p><p>왕에게는 딸이 하나 있었어요. 다나에라는 이름이었지요. 아들은 없었어요. 왕은 예순이 가까웠고, 왕좌 옆에 놓인 작은 의자는 여태 비어 있었어요.</p><p>김 속에서 목소리가 나왔어요. 늙지도 젊지도 않은 목소리였어요.</p><p>“너에게 아들은 없다.”</p><p>왕은 고개를 끄덕였어요. 그건 이미 알고 있던 일이었으니까요. 그런데 목소리가 한 마디를 더 붙였어요.</p><p>“다만 네 딸이 낳은 아들이 언젠가 네 자리에 앉을 것이다.”</p><p>왕은 그 자리에 그대로 서 있었어요. 김이 발목께에서 천천히 흩어졌어요. 왕은 다시 물으려고 입을 열었어요. 그런데 목소리는 더 나오지 않았어요.</p><p>돌계단을 내려올 때 왕은 세지 않았어요. 그런데도 서른두 개가 다 지나갔지요. 그런 말을 들은 이가 이 이야기에 처음은 아니었어요. 아주 먼 옛날 우라노스가 크로노스에게 똑같은 말을 남겼고, 그 말을 들은 쪽은 그날부터 아들을 무서워하기 시작했지요.</p><p>아르고스까지는 이레 길이었어요. 왕은 그 이레 동안 수레 안에서 거의 말을 하지 않았어요. 딱 한 번 마부에게 길을 돌아가자고 했어요. 지나가는 마을마다 아이들이 수레를 따라 뛰었거든요.</p><p>왕은 그 한 마디를 이레 내내 뒤집어 보았어요. 앞에서도 읽어 보고 뒤에서도 읽어 보았지요. 그런데 어느 쪽으로 읽어도 뜻은 하나였어요.</p><p>성에 닿은 것은 저녁이었어요. 안뜰에서 다나에가 물을 긷고 있었어요. 아버지를 보자 두레박을 내려놓고 달려왔지요. 왕은 딸이 다가오는 것을 보면서 한 걸음 물러섰어요.</p><p>“델포이에서 무슨 말을 들으셨어요?”</p><p>“아무 말도 듣지 못했다.” 왕이 대답했어요.</p><p>그날 밤 왕은 자기 방 창가에 오래 서 있었어요. 안뜰 건너편 방에 아직 불이 켜져 있었어요. 그 불이 꺼질 때까지 왕은 창가를 떠나지 않았지요.</p><h2>하늘만 네모나게 보이는 방</h2><p>성 안뜰 구석에 오래된 탑이 하나 있었어요. 창고로 쓰다 만 탑이었지요. 왕은 그 탑의 계단을 헐게 했어요. 그러고는 사다리 하나만 걸어 두게 했어요.</p><p>“헌 계단을 다시 놓아 드릴까요?” 계단을 헐던 석공이 물었어요.</p><p>“아니. 사다리 하나면 된다.”</p><p>꼭대기 방에는 창이 없었어요. 대신 천장 한가운데가 네모나게 뚫려 있었어요. 하늘이 딱 그만큼만 보였지요. 비가 오면 그 자리로 비가 들이쳤고요.</p><p>다나에는 그날 아침까지 아무것도 몰랐어요. 아버지가 부른다고 해서 옷을 갈아입고 나갔을 뿐이었지요. 안뜰에 나와 보니 사다리 아래에 왕이 서 있었어요. 사람들이 다나에의 짐을 벌써 위로 올려 보내고 있었고요.</p><p>“제 짐을 어디로 가져가는 겁니까?” 다나에가 물었어요.</p><p>왕은 대답하지 않았어요. 대신 손을 들어 탑 꼭대기를 가리켰어요.</p><p>“오늘부터 이 탑 꼭대기에서 지내라.” 왕이 말했어요.</p><p>“제가 무엇을 잘못했습니까?”</p><p>왕은 그 물음에도 대답하지 않았어요. 대신 다른 말을 했어요. 먹을 것은 하루 두 번 올려 보내겠다고요. 옷도 이불도 부족하지 않게 해 주겠다고요. 아쉬운 것이 있으면 적어서 내려보내라고요.</p><p>“아버지.”</p><p>다나에가 한 번 더 불렀어요. 왕은 이미 등을 돌린 뒤였지요. 다나에가 올라가자 사람들이 사다리를 치웠어요. 그날부터 탑 아래에는 사람 둘이 번갈아 서 있게 되었어요.</p><p>방은 다섯 걸음에 여섯 걸음이었어요. 다나에는 첫날에 그것을 재 보았어요. 재고 나서는 더 잴 것이 없었지요.</p><p>아침이면 네모난 하늘이 밝아지고 저녁이면 어두워졌어요. 다나에는 그것으로 날을 세었어요. 벽에 손톱으로 금을 하나씩 그었지요.</p><p>저잣거리가 탑에서 멀지 않았어요. 아침이면 사람 소리가 그대로 올라왔어요. 무엇을 파는지, 값을 얼마나 부르는지, 누가 깎아 달라고 조르는지까지 다 들렸지요. 가을 잔칫날에는 북소리도 올라왔어요. 다나에는 그런 날이면 벽에 등을 대고 앉아 그 소리를 끝까지 들었어요.</p><p>밥은 두레박에 담겨 올라왔어요. 밥을 올려 보내는 사람은 말을 하면 안 된다고 되어 있었어요. 그래도 그중 한 사람은 가끔 두레박 안에 다른 것을 넣어 주었어요. 마른 꽃 한 송이라든지, 실 한 타래라든지요. 그 사람은 손이 작았어요. 다나에는 두레박을 끌어올려 보기만 해도 오늘이 그 사람 차례인 줄 알았지요.</p><p>어느 아침에는 두레박이 다 올라온 뒤에도 줄이 팽팽했어요. 다나에가 구멍으로 아래를 내려다보았어요. 그 작은 손이 줄 끝을 붙잡고 있었지요.</p><p>“바깥은 봄이에요.”</p><p>아래에서 그 말이 아주 작게 올라왔어요. 그러고는 줄이 툭 풀렸어요. 다나에는 두레박 안을 들여다보았어요. 밥 위에 노란 꽃이 한 송이 놓여 있었어요.</p><p>다나에는 그 실로 천을 짰어요. 짤 것이 없어지면 도로 풀어서 다시 짰고요. 벽에 그은 금은 백 개를 넘겼어요. 이백 개도 넘겼지요.</p><p>한번은 아쉬운 것을 적어서 내려보내 보았어요. 종잇조각에 딱 한 줄을 적었지요. 사다리를 도로 걸어 달라고요. 내려가는 데 하루, 답이 올라오는 데 이틀이 걸렸어요. 답에도 한 줄만 적혀 있었어요.</p><p>“사다리는 안 된다. 아쉬운 물건을 적으라 하였다.”</p><p>다나에는 그 종잇조각을 접어서 천 밑에 넣어 두었어요. 그 뒤로는 아무것도 적지 않았고요.</p><p>어느 밤에는 탑 아래에 사람이 오래 서 있었어요. 지키는 사람들 발소리와는 달랐어요. 그 사람은 걷지 않고 그냥 서 있기만 했거든요. 다나에는 바닥에 귀를 대고 그 소리를 들었어요. 소리랄 것도 없는 소리를요. 한참 뒤에 그 사람은 그냥 걸어갔어요.</p><h2>네모난 하늘에서 내린 것</h2><p>그 밤에는 별이 하나도 보이지 않았어요. 다나에는 잠이 오지 않아 네모난 하늘 아래에 누워 있었어요. 그런데 그 네모가 조금씩 밝아졌어요. 처음에는 달빛인가 했지요. 달빛치고는 빛깔이 달랐어요. 노란빛이었거든요.</p><p>황금빛 비가 탑 안으로 쏟아져 내렸어요. 소리는 나지 않았어요. 바닥에 닿아도 젖지 않았고요. 빛 한가운데에 사람 하나가 서 있었어요. 다나에와 그 사람은 서로 사랑하게 되었지요. 방 안이 온통 환해졌다가 아주 천천히 어두워졌어요. 다나에는 그날 밤에 본 것을 나중에도 누구에게 제대로 설명하지 못했어요.</p><p>얼마 뒤 아기가 태어났어요. 사내아이였어요. 그 아기의 아버지가 누구인지 다나에는 알고 있었어요. 네모난 하늘에서 내려온 것이 무엇이었는지도요. 제우스였지요.</p><p>다나에는 아기에게 페르세우스라는 이름을 지어 주었어요. 짜 두었던 천은 풀어서 다시 짰어요. 이번에는 아주 작게요. 배냇저고리 하나와 포대기 하나가 나왔어요. 그러고도 실이 조금 남아서 발싸개도 한 켤레 만들었지요.</p><p>그리고 아기를 숨겼어요. 두레박이 올라오는 시각이면 아기를 품 안쪽 깊이 안고 등을 돌렸어요. 아기가 울려고 하면 얼른 젖을 물렸고요. 밤이 제일 어려웠어요. 탑 아래 서 있는 사람들에게 소리가 곧장 내려가니까요.</p><p>한번은 두레박이 올라오는 바로 그때에 아기가 울음을 터뜨렸어요. 다나에는 벽 쪽으로 돌아서서 노래를 부르기 시작했어요. 아주 큰 소리로요. 노래로 그 소리를 덮은 거예요.</p><p>“위에 왕녀님 말고 누가 또 있소?”</p><p>아래에서 누가 소리쳐 물었어요. 다나에는 노래를 멈추고 자기가 부른 거라고 대답했어요. 한참 아무 소리도 나지 않다가 발소리가 다시 걸어갔지요.</p><p>그날 밤 다나에는 잠을 자지 못했어요. 아기는 다나에의 손가락을 쥔 채로 잘 잤고요. 그렇게 넉 달을 숨겼어요.</p><p>아기가 소리 내어 웃기 시작한 것은 다섯 달째였어요. 웃음은 울음보다 막기가 훨씬 어려웠어요. 울음은 젖을 물리면 그쳤지만, 웃음은 아기가 좋아서 내는 소리라 막을 방법이 없었거든요.</p><p>어느 낮에 다나에가 아기를 안고 네모난 하늘 아래에 앉아 있었어요. 햇빛이 바닥에 네모나게 떨어져 있었지요. 아기가 그 빛에 손을 뻗다가 아주 크게 웃었어요.</p><p>탑 아래에서 발소리가 멈췄어요.</p><h2>밤중에 짠 나무 상자</h2><p>왕이 사다리를 타고 올라왔어요. 왕이 그 탑에 올라온 것은 그때가 처음이었어요. 다나에는 아기를 안고 벽 쪽에 서 있었어요. 왕은 방 한가운데에 서서 한참을 보았어요. 아무 말도 하지 않았고요.</p><p>아기가 왕 쪽으로 손을 뻗었어요. 왕은 그 손을 피하지 않았어요. 아기가 왕의 손가락을 쥐었지요. 왕은 손가락을 그대로 두었다가 아주 천천히 빼냈어요.</p><p>“이 아이는 이름이 있느냐?”</p><p>“페르세우스입니다.”</p><p>왕은 그 이름을 따라 말해 보지 않았어요. 사다리 쪽으로 걸어가 그대로 내려갔지요.</p><p>그날 저녁 성 안뜰에서 톱질 소리가 났어요. 목수가 나무 상자를 하나 짜고 있었어요. 사람이 둘 들어갈 만한 크기였어요. 이음매마다 송진을 먹이고 겉에는 가죽을 덧대었지요. 물이 새면 안 되니까요.</p><p>목수는 밤새 그것을 짰어요. 짜면서 한 번도 왜냐고 묻지 않았어요. 다 짜고 나서는 뚜껑 안쪽을 손바닥으로 여러 번 문질렀어요. 가시가 남으면 안 되니까요.</p><p>왕은 손자를 자기 손으로 어쩌지는 않았어요. 대신 바다에 맡겼지요. 그건 정말 비겁한 일이었어요. 밤중에 사다리가 다시 걸렸어요. 사람들이 올라와 다나에에게 내려오라고 했어요.</p><p>“이 밤중에 저를 어디로 데려갑니까?”</p><p>아무도 대답하지 않았어요. 다나에는 아기를 포대기에 싸서 가슴에 묶고 사다리를 내려왔어요. 한 손으로는 아기를 받치고 다른 손으로만 짚어야 했지요. 다나에는 소리를 지르지 않았어요. 아기가 깰까 봐서요.</p><p>수레가 안뜰에 서 있었어요. 수레는 자갈길을 지나 모래밭까지 갔어요. 다나에는 수레 바닥에 앉아 위를 보았어요. 네모나지 않은 하늘은 아주 오랜만이었어요. 별이 그렇게 많은 줄 다나에는 잊고 있었지요.</p><p>바닷가에서 왕이 기다리고 있었어요. 왕은 상자 안에 물동이 하나와 빵 자루 하나를 넣게 했어요. 그러고는 다나에를 보았어요.</p><p>“나는 내 손으로 너희를 해치지는 않았다.” 왕이 말했어요.</p><p>다나에는 아버지의 얼굴을 오래 보았어요. 무슨 말을 하려는 것처럼 입을 조금 벌렸다가 그냥 다물었지요. 그러고는 아기를 안고 상자 안으로 들어갔어요.</p><p>뚜껑이 닫혔어요. 못이 여덟 개 박혔어요. 다나에는 못이 박히는 소리를 여덟 번 다 들었어요.</p><p>사람들이 상자를 물 위로 밀었어요. 밀물이 상자를 받아 갔지요. 왕은 물가에 서서 그것이 보이지 않을 때까지 있었어요. 그러고는 성으로 돌아갔어요. 그 뒤로 왕은 델포이에 다시 가지 않았어요.</p><h2>상자가 떠 있던 나흘</h2><p>상자 안은 캄캄했어요. 못 자국 틈으로 가느다란 빛이 들어왔다가, 해가 지면 그것마저 없어졌지요.</p><p>파도가 상자를 들었다 놓았다 했어요. 들릴 때는 배 속이 붕 뜨고, 놓일 때는 바닥이 어깨를 쳤어요. 다나에는 한 손으로 아기를 안고 다른 손으로 벽을 짚었어요. 그 손을 하루 종일 떼지 못했어요.</p><p>물이 조금씩 들어왔어요. 아주 조금씩요. 다나에는 그 물을 옷자락으로 빨아들여 짜냈어요. 짜내고 또 짜냈지요.</p><p>둘째 날 밤에 바람이 크게 불었어요. 상자가 한 번 크게 기울었다가 옆으로 넘어갔어요. 물동이가 굴렀고 빵 자루가 얼굴 위로 떨어졌지요. 다나에는 아기를 배 위에 올리고 두 팔로 감쌌어요. 상자가 도로 바로 설 때까지요.</p><p>다나에는 아무 말도 하지 않았어요. 대신 아기 등을 손바닥으로 천천히 두드렸어요. 두드리는 손이 조금 떨렸어요.</p><p>아기는 잘 잤어요. 파도가 크게 칠 때마다 눈을 반쯤 떴다가 다시 감았어요. 어두운 데서 흔들리는 것이 아기에게는 오히려 편했나 봐요.</p><p>한 번은 깨어나서 소리를 내어 웃었어요. 무엇이 좋았는지는 모르겠어요. 다나에는 저도 모르게 손으로 아기 입을 가리려다가 그 손을 내렸어요. 이제는 들을 사람이 없었으니까요. 그래서 웃게 두었어요. 상자 안에서 그 소리가 이쪽 벽에 부딪고 저쪽 벽에 부딪었지요.</p><p>밤이 되자 다나에는 아기 얼굴에 귀를 대 보았어요. 숨소리가 났어요. 다나에는 아주 작은 소리로 말했어요.</p><p>“너는 잘도 자는구나. 바다도 너처럼 자 주면 좋을 텐데.”</p><p>그러고는 아기 이마에 얼굴을 대고 한참 있었어요. 상자 밖에서 물소리가 났어요. 그 소리는 밤새 그치지 않았어요.</p><p>셋째 날에는 물동이 바닥이 보였어요. 다나에는 아기 몫만 남기고 자기는 마시지 않았어요. 입안이 마르면 옷자락에 밴 바닷물을 혀끝에 대 보았다가 얼른 뱉었지요. 짠물은 마시면 더 목이 마르니까요.</p><p>사흘이 지났어요. 아니면 나흘이었을지도 몰라요. 상자 안에서는 낮과 밤이 잘 구분되지 않았거든요. 다나에는 벽에 금을 긋던 버릇대로 손가락을 하나씩 꼽아 보다가 두 번째에서 그만두었어요. 빵은 딱딱해졌고 물동이는 거의 다 비었지요.</p><p>넷째 날 새벽에 파도가 잦아들었어요. 흔들림이 작아지더니 상자 밑바닥에서 지익 하는 소리가 났어요. 무언가에 긁히는 소리였어요.</p><p>모래였어요. 상자가 밀려왔다가 빠지는 물을 따라 조금씩 앞으로 움직였어요. 그러다 아주 멈췄지요. 밖에서 새소리가 났어요. 다나에는 숨을 죽였어요.</p><p>발소리가 났어요. 사람 발소리였어요. 젖은 모래를 밟는 소리였지요. 그 소리가 상자 둘레를 한 바퀴 돌았어요.</p><p>무언가가 상자 위에 툭 걸쳐졌어요. 그물이었어요. 그물이 상자를 감고 당겨졌어요. 상자가 모래 위로 조금 끌려 올라갔지요.</p><p>그러고는 뚜껑을 두드리는 소리가 났어요. 똑, 똑. 다나에는 대답하지 않았어요. 아기를 더 꽉 안았을 뿐이었어요.</p><p>쇠붙이가 못을 물어뜯는 소리가 났어요. 하나, 둘, 셋. 여덟 번째 못이 빠지자 뚜껑이 들렸어요. 빛이 쏟아져 들어왔어요. 다나에는 눈을 감았어요. 눈을 감은 채로 아기 얼굴을 손으로 가렸지요.</p><p>누군가 상자 안을 들여다보고 있었어요. 소금기에 절어 검게 그은 얼굴이었어요. 어깨에는 아직 그물이 걸려 있었고요.</p><p>그 사람은 뒤로 한 걸음 물러났다가 다시 들여다보았어요. 한참 아무 말도 하지 않았어요. 그러다 아주 작게 말했어요.</p><p>“상자 안에 사람이 살아 있네.”</p></article></noscript>
