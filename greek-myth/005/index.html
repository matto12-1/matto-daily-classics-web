  <noscript><article class="ns-text"><h1>땅속에서 온 도움</h1><h2>열 해가 지나도</h2><p>열 해째 되던 어느 저녁이었어요. 제우스는 바위에 걸터앉아 건너편 산을 바라보고 있었어요. 저쪽에도 불이 켜져 있었어요. 이쪽과 똑같이 지친 이들이 저쪽에도 앉아 있다는 뜻이었지요.</p><p>그 싸움은 열 해가 지나도 끝나지 않았어요.</p><p>한쪽에는 티탄들이 있었어요. 세상이 생길 때부터 있던 이들이라 힘이 어마어마했지요. 다른 한쪽에는 여섯 남매가 있었어요. 젊고 빨랐지만 수가 적었어요. 창이 부딪히는 소리가 하루 종일 들판을 울렸어요. 저녁이 되면 양쪽 다 물러났고, 다음 날 아침이면 또 같은 자리에서 마주 섰어요.</p><p>열 해 동안 세상은 몹시 시달렸어요. 산 하나가 통째로 무너져 내려 골짜기를 메웠어요. 강물은 제 길을 잃고 엉뚱한 데로 흘렀어요. 들판에서는 아무것도 자라지 않았고, 짐승들은 더 깊은 숲으로 들어가 나오지 않았어요.</p><p>바다도 조용하지 않았어요. 파도가 하루에도 몇 번씩 뭍으로 올라왔다가 물러났어요. 밤이면 별들이 제자리를 잃고 이리저리 흔들리는 것처럼 보였지요.</p><p>제우스와 형제들은 높은 산 위에 자리를 잡았어요. 그 산의 이름이 올림포스산이었어요. 티탄들은 그 맞은편 산에 진을 쳤지요. 두 산 사이의 넓은 들판이 싸움터였어요.</p><p>이대로 열 해가 더 흘러도 똑같겠구나. 제우스는 그렇게 생각했어요. 형과 누나들도 같은 생각을 하고 있었지만, 아무도 그 말을 입 밖에 내지 않았어요.</p><p>포세이돈이 물통을 들고 와 옆에 털썩 앉았어요. 어깨에 흙먼지가 잔뜩 앉아 있었어요.</p><p>“오늘도 못 밀었어. 세 걸음 밀면 두 걸음 밀려나.”</p><p>“저도 봤어요.”</p><p>“저쪽 티탄들은 수가 우리보다 배가 넘어. 아무리 애를 써도 수가 모자라잖아.”</p><p>포세이돈이 발끝으로 돌멩이를 툭 찼어요. 돌멩이가 비탈을 한참 굴러 내려갔어요. 하데스가 조금 떨어진 데서 걸어왔어요. 하데스는 늘 말없이 있다가 꼭 필요한 말만 했어요.</p><p>“힘으로는 안 돼. 힘만 겨뤄서는 저쪽을 못 이겨.”</p><p>제우스가 고개를 들었어요. 어디선가 들어 본 말이었거든요. 아주 오래전, 크레타섬 동굴에서 자기 입으로 했던 말이기도 했지요.</p><p>세 형제는 열 해 동안 나란히 싸웠어요. 처음에는 서로 서먹했지만 이제는 눈짓만으로도 상대의 생각을 알았지요. 그런데 그날 저녁은 유난히 말이 없었어요.</p><p>세 형제는 한동안 아무 말 없이 앉아 있었어요. 산 아래에서 바람이 올라와 불꽃을 흔들었어요. 불꽃이 사그라들자 하데스가 마른 가지를 몇 개 얹었어요.</p><p>“우리 편이 더 있으면 되는데.”</p><p>포세이돈이 혼잣말처럼 중얼거렸어요.</p><p>“없잖아. 티탄들 말고 이 세상에 힘센 게 또 뭐가 있다고.”</p><p>제우스는 그 말에 대꾸하지 않았어요. 대신 무언가를 떠올리려는 사람처럼 눈썹을 모았어요. 아주 오래전에 들은 이야기 하나가 머릿속에서 뒤척이고 있었거든요.</p><p>그날 밤 제우스는 잠을 자지 않았어요.</p><p>크레타섬 동굴에서 어머니가 하룻밤에 들려준 이야기들을 하나씩 되짚어 보았어요. 하늘과 땅의 이야기, 열두 티탄의 이야기, 낫의 이야기. 그리고 그 이야기들 사이에 짧게 끼어 있던 대목 하나가 있었어요. 티탄들 말고도 아이들이 더 있었다는 대목이었지요.</p><p>이마 한가운데 커다란 눈이 하나뿐인 삼 형제가 있었어요. 그리고 팔이 백 개나 되는 거인 삼 형제도요. 그들은 흉하다는 말을 듣고 땅속 깊은 곳에 갇혔어요. 아주 오래전에, 하늘이 아직 땅에 닿아 있던 시절에요.</p><p>생각할수록 이상했어요. 그 대목은 늘 짧게 지나갔거든요. 마치 아무도 오래 이야기하고 싶어 하지 않는 대목처럼요.</p><p>제우스는 어둠 속에서 손가락을 하나씩 꼽아 보았어요. 삼 형제와 삼 형제, 모두 여섯이었어요. 여섯이면 저쪽 수에 맞설 수 있을지도 몰랐어요.</p><p>제우스는 자리에서 벌떡 일어났어요. 아직도 거기 있을까. 열 해가 아니라 그보다 훨씬 긴 세월 동안, 아무도 꺼내 주지 않은 채로요.</p><p>다음 날 아침 제우스는 형들에게 말했어요.</p><p>“저 어디 좀 다녀올게요.”</p><p>“어디를 간다는 거야?”</p><p>“땅 밑에 갇힌 거인들을 데리러 가요.”</p><p>포세이돈이 물통을 놓칠 뻔했어요. 하데스만 아무것도 묻지 않았어요. 다만 제우스를 한참 보다가 짧게 말했어요.</p><p>“조심해. 거기는 돌아오는 길이 더 어려운 곳이야.”</p><h2>땅 밑으로 내려가는 길</h2><p>제우스는 세상에서 가장 깊은 골짜기로 갔어요. 거기에는 바위가 갈라진 틈이 하나 있었어요. 어른 열 명이 나란히 들어가도 될 만큼 넓은 틈이었지요.</p><p>제우스는 그 안으로 들어갔어요.</p><p>처음에는 빛이 조금 들어왔어요. 얼마쯤 내려가자 그마저도 사라졌어요. 손을 눈앞에 대도 보이지 않았어요. 제우스는 벽을 짚으며 한 발씩 내려갔어요. 벽은 축축하고 차가웠어요. 어디선가 물방울이 떨어지는 소리가 규칙적으로 났어요. 똑, 똑, 똑.</p><p>제우스는 발밑을 더듬어 가며 아주 천천히 움직였어요. 한 번 미끄러지면 어디까지 굴러떨어질지 알 수 없었으니까요. 가끔 발밑에서 자갈이 굴러떨어졌는데, 바닥에 닿는 소리가 한참 뒤에야 올라왔어요.</p><p>하루를 내려갔어요. 이틀을 내려갔어요. 사흘째부터는 낮인지 밤인지도 알 수 없었어요.</p><p>아래로 갈수록 공기가 무거워졌어요. 숨을 들이쉬면 가슴이 눌리는 것 같았지요. 제우스는 몇 번이나 돌아갈까 생각했어요. 그럴 때마다 지친 형제들의 얼굴을 떠올리며 다시 발을 내디뎠어요.</p><p>그러다 아주 멀리서 소리가 들려왔어요. 쇠가 쇠에 부딪히는 소리였어요. 사슬이 끌리는 소리이기도 했지요. 그 소리를 따라 제우스는 마지막 비탈을 내려갔어요. 그리고 땅속 가장 깊은 곳, 타르타로스에 닿았어요.</p><p>거기에는 커다란 청동 문이 있었어요. 문은 반쯤 녹이 슬어 있었고, 아무도 지키고 있지 않았어요. 지킬 필요가 없었던 거예요. 여기까지 내려올 사람이 세상에 없었으니까요.</p><p>제우스는 두 손으로 문을 밀었어요. 문이 아주 낮게 우는 소리를 내며 열렸어요. 안쪽은 넓었어요. 그리고 어두웠어요. 천장이 어찌나 높은지 위쪽은 아예 보이지 않았어요. 벽을 따라 굵은 사슬이 늘어져 있었지요. 어둠 속에서 무언가가 천천히 움직였어요.</p><p>제우스는 한 걸음 더 안으로 들어갔어요. 발밑에서 흙먼지가 폴폴 일었어요.</p><p>먼저 눈이 보였어요. 커다랗고 둥근 눈이 셋. 이마 한가운데에 하나씩 박힌 눈이었어요. 그 눈들은 아주 희미하게 빛나고 있었어요. 오랫동안 빛을 보지 못한 눈이 스스로 조금씩 빛을 내게 된 거예요.</p><p>“너는 누구냐?”</p><p>가운데 있는 이가 물었어요. 목소리가 낮고 쉬어 있었어요. 말을 안 한 지 오래된 목소리였지요.</p><p>“제우스라고 해요. 크로노스의 아들이에요.”</p><p>사슬이 철컹 소리를 냈어요. 셋이 동시에 몸을 일으켰거든요. 제우스는 목소리가 떨리지 않게 조심하며 말했어요.</p><p>“여기서 꺼내 드리려고 왔어요.”</p><p>“크로노스의 아들이라고?”</p><p>그 이름을 말할 때 목소리에 무언가가 섞였어요. 화라고 하기에는 너무 오래된 것이었어요. 기다림이 너무 길어지면 화도 닳아 버리나 봐요.</p><p>제우스는 사슬 앞으로 걸어갔어요. 사슬은 굵기가 사람 팔뚝만 했어요. 벽에 박힌 고리에 단단히 물려 있었지요.</p><p>“아버지가 여러분을 꺼내 주겠다는 약속을 지키지 않았다고 들었어요.”</p><p>“크로노스는 우리 어머니께 때가 되면 꺼내 주겠다고 했다.”</p><p>키클롭스 하나가 말했어요.</p><p>“그 말을 들은 게 언제였는지 이제 기억도 안 난다.”</p><p>제우스는 아무 말도 하지 않았어요. 대신 사슬을 두 손으로 잡았어요. 그리고 힘을 주었어요. 한 번, 두 번. 세 번째에 고리가 벽에서 뽑혀 나왔어요. 돌가루가 우수수 떨어졌어요.</p><p>제우스의 손바닥이 벗겨져 쓰라렸지만 멈추지 않았어요. 제우스는 세 형제의 사슬을 차례로 끊었어요. 마지막 사슬이 바닥에 떨어졌을 때, 키클롭스 삼 형제는 한참 동안 그 자리에서 움직이지 못했어요. 너무 오래 묶여 있어서 풀렸다는 것이 실감 나지 않았던 거예요. 삼 형제는 서로의 얼굴을 번갈아 보았어요. 그러고는 아주 천천히 팔을 들어 올려 보았어요. 아무것도 걸리지 않는다는 것이 낯설었던 거지요.</p><p>그다음에 제우스는 더 안쪽으로 들어갔어요.</p><p>거기에는 백수거인이 있었어요. 팔이 백 개, 머리가 쉰 개인 삼 형제였지요. 백 개의 손이 벽을 따라 축 늘어져 있는 모습은 어쩐지 서글펐어요. 제우스는 그 사슬도 하나하나 끊었어요. 백 개의 손목에 채워진 것을 다 끊는 데 꼬박 하루가 걸렸어요. 어둠 속에서 백 개의 손이 아주 조심스럽게 움직였어요.</p><h2>다시 본 하늘</h2><p>올라오는 길은 내려갈 때보다 훨씬 느렸어요. 여섯 거인은 다리가 굳어 있었어요. 몇 걸음 걷고 쉬고, 또 몇 걸음 걷고 쉬었어요. 백수거인은 좁은 곳에서 팔이 자꾸 벽에 걸렸어요. 그럴 때마다 백 개의 손을 조심조심 접었지요. 제우스는 앞장서서 길을 알려 주었어요.</p><p>제우스는 그들이 다 따라 나올 때까지 몇 번이나 걸음을 멈추고 기다렸어요. 마침내 바위틈이 보였어요. 틈 사이로 가느다란 빛줄기가 들어오고 있었어요.</p><p>키클롭스 삼 형제가 그 자리에 멈춰 섰어요. 셋 다 커다란 눈을 감아 버렸어요. 빛이 너무 밝아서가 아니었어요. 너무 오래 기다린 것을 마주하면 사람은 눈을 감게 되기도 하거든요.</p><p>밖으로 나왔을 때는 마침 해가 뜨는 참이었어요. 들판의 풀이 바람에 한쪽으로 누웠어요. 여섯 거인의 그림자가 아침 햇빛 속에서 아주 길게 늘어졌지요.</p><p>여섯 거인은 들판 한가운데 서서 하늘을 올려다보았어요. 아무도 말을 하지 않았어요. 백수거인 하나가 백 개의 손을 천천히 펼쳤어요. 손바닥마다 아침 햇빛이 하나씩 내려앉았어요.</p><p>그때 키클롭스 가운데 가장 나이 많은 이가 제우스를 돌아보며 말했어요.</p><p>“우리는 대장장이다. 꺼내 준 은혜는 우리 손으로 무기를 만들어 갚겠다.”</p><p>다른 두 형제도 고개를 끄덕였어요. 백수거인은 아무 말도 하지 않았지만, 백 개의 손을 한꺼번에 쥐었다 폈어요.</p><h2>대장간의 사흘 밤</h2><p>키클롭스 삼 형제는 그날로 대장간을 차렸어요. 산 아래 바위굴에 화덕을 놓고, 큰 돌을 다듬어 모루를 만들었어요. 불을 피우자 굴 안이 금세 붉어졌어요. 삼 형제의 커다란 눈이 불빛을 받아 반짝였어요. 손이 어찌나 빠른지 망치가 보이지 않을 정도였지요.</p><p>굴 밖에서는 밤새 망치 소리가 들렸어요. 산 아래 사람들은 산이 앓는 소리를 낸다고 생각했지요. 포세이돈과 하데스도 굴 앞에 앉아 그 소리를 들었어요. 제우스는 사흘 동안 그 자리를 떠나지 않았어요.</p><p>첫날 밤에 그들은 쇠를 두드려 세 갈래로 갈라진 창을 만들었어요. 창끝이 셋이라 삼지창이라고 불렀어요. 그것으로 땅을 한 번 치면 바닥이 갈라지고, 물을 한 번 치면 파도가 산처럼 솟았어요.</p><p>둘째 날 밤에는 투구를 만들었어요. 겉보기에는 평범한 투구였어요. 그런데 그것을 머리에 쓰면 쓴 사람이 보이지 않았어요. 그림자도 발자국도 남지 않았지요.</p><p>셋째 날 밤에 만든 것이 가장 오래 걸렸어요. 그들은 하늘에서 번쩍이는 것을 조금 떼어 왔다고 했어요. 그것을 몇 번이나 두드리고 식히고 다시 두드렸어요. 망치가 닿을 때마다 굴 안이 하얗게 번쩍였어요. 셋째 날 새벽이 되어서야 그것이 완성되었어요.</p><p>완성된 것을 화덕에서 꺼낼 때는 삼 형제도 잠깐 뒤로 물러섰어요. 손에 쥘 수 있는 번개였어요. 키클롭스는 만든 것을 하나씩 나누어 주었어요.</p><p>삼지창은 포세이돈에게 갔어요. 포세이돈이 그것을 받아 들고 한 번 휘두르자, 저 멀리 바다에서 파도가 응답하듯 크게 일었어요. 포세이돈은 그날 처음으로 소리 내어 웃었어요.</p><p>보이지 않는 투구는 하데스에게 갔어요. 하데스는 그것을 조용히 받아 옆구리에 꼈어요. 그러고는 잠깐 써 보았어요. 하데스가 사라지자 포세이돈이 깜짝 놀라 주위를 두리번거렸지요.</p><p>“이 투구, 마음에 드는데.”</p><p>어디선가 하데스의 목소리만 들려왔어요. 그 광경을 본 백수거인이 껄껄 웃었어요. 웃음소리가 골짜기를 한 바퀴 돌았지요. 열 해 동안 웃을 일이라고는 없던 진영이었어요.</p><p>백수거인 삼 형제도 자기 몫을 정했어요. 그들에게는 무기가 필요 없었어요. 백 개의 손이 곧 무기였으니까요.</p><p>“우리는 바위를 던져서 싸우겠다.”</p><p>그들은 그렇게 말하고 들판으로 걸어 나가 바위를 주워 모으기 시작했어요. 한 사람이 한 번에 백 개씩 들 수 있었어요. 산기슭에 바위 무더기가 쌓이는 것을 보면서, 티탄들 쪽 진영이 처음으로 술렁였어요.</p><p>제우스는 형들이 새 무기를 손에 익히는 모습을 조금 떨어져서 지켜보았어요. 이제 여섯이 아니라 열둘이었어요.</p><p>키클롭스 삼 형제가 화덕 앞으로 돌아가 마지막 하나를 천으로 감쌌어요. 이제 그것 하나가 남았어요. 굴 앞에는 모두가 모여 있었어요. 포세이돈도, 하데스도, 백수거인 삼 형제도요.</p><p>가장 나이 많은 키클롭스가 제우스 앞으로 걸어왔어요. 그 손에는 천으로 감싼 것이 들려 있었어요. 천 사이로 파란빛이 새어 나왔다가 사라지곤 했어요. 가까이 가자 머리카락이 저절로 곤두섰어요.</p><p>“이 번개는 무거운 물건이다.”</p><p>키클롭스가 말했어요.</p><p>“쥐는 건 쉽다. 그런데 한번 쥐면 내려놓기가 어렵지. 그걸 알고 받아라.”</p><p>제우스는 잠깐 그 자리에 서 있었어요. 그러고는 두 손을 내밀었어요. 천이 벗겨졌어요. 제우스는 손끝이 저릿해지는 것을 느꼈어요.</p><p>제우스는 그 무게를 손으로 가늠해 보았어요. 생각보다 가볍고, 생각보다 뜨거웠어요. 제우스가 그것을 손에 쥔 순간이었어요.</p><p>하늘 전체가 하얗게 번쩍였어요.</p><p>산도, 들판도, 바다도, 저 멀리 티탄들이 진을 친 산까지도 한꺼번에 새하얘졌어요. 그림자가 모두 사라졌어요. 세상에 색이라는 것이 잠깐 없어졌어요. 그리고 곧이어 천둥이 왔어요. 땅이 통째로 한 번 들썩였어요. 번쩍임이 가시고 나서도 눈앞에는 하얀 자국이 한참 남아 있었어요.</p><p>건너편 산에서 크로노스가 벌떡 일어섰어요. 왕은 그 빛이 무엇인지 한눈에 알아보았어요. 아주 오래전, 자기가 땅속에 그대로 두고 온 손들이 만들어 낸 빛이었으니까요.</p></article></noscript>
