        <div class="recap"><h3>지난 이야기</h3><ol><li>테베의 어느 집 안주인이 제우스와 사랑에 빠져 아이가 태어났고, 헤라는 그것이 미웠어요.</li><li>그 아이는 요람에 들어온 뱀 두 마리를 두 손으로 눌러 버렸고, 사람들은 헤라의 노여움을 눅이려고 그 이름을 넣어 헤라클레스라고 불렀지요.</li><li>자란 헤라클레스는 케이론에게 활과 풀과 참는 법을 배우고 산을 내려왔어요.</li></ol></div>

  <noscript><article class="ns-text"><h1>열두 가지 일</h1><h2>마당에 세운 과녁</h2><p>과녁이 자꾸 넘어졌어요. 헤라클레스가 그것을 도로 세우고 발로 흙을 꾹꾹 눌러 다졌지요. 그러고는 몇 걸음 물러나 손바닥을 탁탁 털었어요.</p><p>“이번엔 과녁이 안 넘어질 거야.” 헤라클레스가 말했어요.</p><p>작은 활을 든 아이가 발끝으로 마당에 줄을 그었어요. 여기서 쏴도 되느냐고 물었지요. 헤라클레스는 그 줄보다 한 걸음 앞에 새로 금을 그어 주었어요.</p><p>“여기서 쏘렴.”</p><p>아이가 시위를 당겼어요. 팔이 부들부들 떨렸어요. 헤라클레스는 아이 뒤에 쭈그려 앉아 팔꿈치를 손가락 하나로 살짝 받쳐 주었어요. 산에서 케이론이 자기한테 해 주던 그대로요.</p><p>화살이 과녁을 스치고 담을 넘어갔어요. 담 너머에서 누가 소리를 질렀어요. 헤라클레스가 얼른 담 위로 고개를 내밀고 미안하다고 했지요.</p><p>이웃 사람이 화살을 주워 담 위로 넘겨주었어요. 그러고는 웃으면서 한마디 했어요.</p><p>“그 팔로 가르치면 아이가 뭘 배우겠나.”</p><p>헤라클레스는 대답 대신 화살을 받아 들었어요. 그 팔이 어떤 팔인지는 테베에서 모르는 사람이 없었지요. 산에서 내려온 지 여러 해가 되었는데, 그동안 무거운 것을 옮기는 일은 다 헤라클레스 몫이 되었거든요. 무너진 담도, 도랑에 빠진 소도요.</p><p>문간에는 더 작은 아이가 앉아 있었어요. 아직 활을 들 나이가 아니었지요. 그 아이는 형이 화살을 놓을 때마다 두 손을 마주쳤어요. 맞든 안 맞든 똑같이요.</p><p>부엌 쪽에서 아내가 아이들을 불렀어요. 저녁이 다 됐다고요. 아이는 활을 손에 든 채로 뛰어 들어갔어요.</p><p>“저 과녁은 내일 또 세워야겠네요.” 아내가 문간에 나와서 말했어요.</p><p>과녁이 삐뚜름하게 서 있었거든요. 헤라클레스는 웃기만 했어요. 내일 또 세우면 된다고요. 아내는 고개를 저으면서 안으로 들어갔지요.</p><p>헤라클레스는 마당에 남아 과녁을 한 번 더 손보았어요. 해가 담 위에 반쯤 걸려 있었지요. 아주 여느 저녁이었어요. 다음 날 저녁도 그다음 날 저녁도 이럴 줄 알았고요.</p><h2>밤에 낀 안개</h2><p>그 무렵 올림포스산 난간에는 헤라가 서 있었어요. 해가 넘어가면 땅 위에 불빛이 하나둘 켜졌지요. 헤라는 그 불빛들을 하나씩 훑다가 한 군데에서 눈을 멈췄어요.</p><p>헤라는 한참을 그러고 서 있었어요. 그러고는 손을 폈다가 아주 천천히 오므렸어요. 손바닥 안에서 잿빛 김 같은 것이 스르르 풀려 나왔지요. 연기처럼 가볍지도 않고 구름처럼 무겁지도 않은 것이었어요.</p><p>그것이 난간을 넘어 산허리를 따라 아래로 내려갔어요. 헤라는 그것이 다 내려갈 때까지 그 자리에 있었어요.</p><p>그날 밤 마을에 안개가 꼈어요. 여느 안개와는 달랐어요. 낮은 데부터 차오르지 않고 담을 곧장 넘어 마당으로 들어왔거든요. 그러고는 열려 있던 문 안으로 들어갔지요.</p><p>헤라클레스는 헤라가 보낸 나쁜 마음의 안개에 휩싸여 가족을 해치고 말았어요. 마당의 과녁은 그대로 서 있었어요. 밤새 아무도 그것을 건드리지 않았지요.</p><p>아침이 되어도 안개는 걷히지 않았어요. 해가 다 올라온 뒤에도 마당 낮은 데에 그것이 깔려 있었지요. 그 안개는 여러 날 동안 그 집 둘레에서 물러가지 않았어요.</p><p>아침에 담 밖으로 사람들이 모였어요. 그런데 아무도 안으로 들어가지 않았어요. 서로 얼굴만 보다가, 결국 아무도 안쪽을 향해 부르지 못했지요.</p><p>헤라클레스는 마당 한가운데에 앉아 있었어요. 두 손을 무릎 위에 올려놓고 그것을 내려다보고 있었어요. 해가 다 올라올 때까지 그러고 있었지요. 손등에 흙이 말라붙어 있었어요.</p><p>그건 헤라클레스가 한 일이 아니었어요. 그런데도 헤라클레스는 그 손을 오래 들여다보았어요. 손가락을 한 번 폈다가 오므려 보고, 다시 폈다가 오므려 보았지요.</p><p>산에서 케이론이 한 말이 그제야 생각났어요. 그 아이를 내려놓은 건 내가 가르친 게 아니라던 말이요. 그때는 그게 무슨 뜻인지 몰랐어요.</p><p>낮이 다 기울 무렵에 헤라클레스가 일어섰어요. 담 밖에 있던 사람들이 길을 비켜 주었어요. 헤라클레스는 아무에게도 말을 걸지 않고 마을을 나갔어요. 아무것도 들고 가지 않았어요. 활도 두고 갔지요.</p><p>마을 어귀에서 누가 뒤에서 이름을 불렀어요. 어제 담 너머로 화살을 넘겨주던 그 이웃이었지요. 헤라클레스는 걸음을 멈췄어요. 그런데 돌아보지는 않았어요.</p><p>“자네, 어디 가나?”</p><p>헤라클레스는 대답하지 않았어요. 그 사람도 더 묻지 못했고요. 둘은 한참을 그렇게 서 있다가, 한 사람은 마을 쪽으로 한 사람은 길 쪽으로 걸어갔어요.</p><h2>김이 올라오는 골짜기</h2><p>델포이 골짜기로 올라가는 길에는 그날도 사람들이 줄지어 서 있었어요. 밭에 씨를 언제 뿌려야 하는지, 먼 길을 떠난 사람이 돌아올지, 그런 것을 물으러 온 사람들이었지요.</p><p>헤라클레스는 그 줄 맨 뒤에 섰어요. 사흘을 걸어왔지만 앞으로 끼어들지는 않았어요. 앞사람이 뒤를 돌아보고 자리를 내주려 하자 고개를 저었지요.</p><p>그 사흘 동안 헤라클레스는 거의 먹지 않았어요. 길가 샘에서 물만 마셨지요. 지나온 마을마다 사람들이 저 사람이 누구인지 수군거렸지만, 아무도 앞을 막아서지는 못했어요.</p><p>해가 기울 무렵에 차례가 되었어요. 문 앞까지 돌계단이 서른두 개였어요. 헤라클레스는 그것을 세지 않고 올라갔어요.</p><p>안은 어두웠어요. 바닥 갈라진 틈에서 김이 올라와 천장께에서 흩어졌지요. 아폴론은 안쪽 바위에 앉아 있었어요. 무릎에 팔을 얹은 채로요.</p><p>헤라클레스는 문간에서 한참을 서 있다가 안으로 들어갔어요. 오는 내내 무슨 말을 할지 다듬어 보았는데, 막상 서고 보니 남아 있는 말이 하나도 없었지요.</p><p>“제가 한 일을 씻을 수 있습니까?” 헤라클레스가 물었어요.</p><p>아폴론은 곧바로 대답하지 않았어요. 김이 두 사람 사이에서 천천히 올라갔다가 흩어졌어요.</p><p>“씻는다고 없던 일이 되지는 않는다.”</p><p>“없던 일이 되지 않는다는 것은 압니다.”</p><p>“그런데도 씻는 일을 하겠느냐?”</p><p>“해야 합니다.”</p><p>아폴론은 자리에서 일어나 헤라클레스 앞으로 왔어요. 그러고는 그 얼굴을 오래 보았지요. 아폴론은 사람의 앞일을 아는 신이었어요. 그러니 이 사람에게 무엇이 남았는지도 알았을 거예요.</p><p>“동쪽에 미케네라는 나라가 있다.” 아폴론이 말했어요. “그 나라 왕을 찾아가거라. 그 왕이 시키는 일을 열두 번 해내면 된다.”</p><p>“왜 하필 그 왕입니까?”</p><p>아폴론은 대답하지 않았어요. 대신 문 쪽을 한 번 보았어요. 밖에는 아직 줄이 남아 있었거든요. 헤라클레스가 다시 물으려는데 아폴론이 먼저 입을 열었지요.</p><p>“네가 가장 견디기 어려운 사람으로 골랐다.”</p><p>헤라클레스는 그 말을 곧바로 알아듣지 못했어요. 미케네의 왕이 어떤 사람인지 그때는 몰랐으니까요. 알아듣기까지는 여러 해가 걸리게 돼요.</p><p>헤라클레스는 고개를 숙였어요. 그러고는 골짜기를 내려갔지요. 정신이 돌아온 뒤로 헤라클레스가 처음으로 정한 일이 그것이었어요. 그 잘못을 씻기 위해 열두 가지 일을 하기로 한 것이요.</p><h2>항아리가 놓인 방</h2><p>미케네 성문은 큰 돌 두 개를 세우고 그 위에 하나를 얹어 만든 것이었어요. 헤라클레스는 그 아래를 지나면서 고개를 숙이지 않아도 되었어요. 문이 그만큼 높았거든요.</p><p>안뜰을 지나 큰 방으로 들어갔어요. 방 한가운데에 왕좌가 있었어요. 그리고 왕좌에서 세 걸음쯤 떨어진 자리에 청동 항아리가 하나 놓여 있었지요. 어른이 들어가고도 남을 만큼 큰 항아리였어요. 겨울에 곡식을 넣어 두는 것이었고요.</p><p>왕은 작은 사람이었어요. 수염이 성글고, 금관이 자꾸 흘러내려서 말을 하다 말고 두 손으로 그것을 올려 쓰곤 했지요. 이름은 에우리스테우스였어요.</p><p>그 왕은 페르세우스의 손자였어요. 오래전에 나무 상자에 실려 바다를 건넜던 그 아기, 그 페르세우스 말이에요.</p><p>그리고 헤라클레스가 태어나던 날 미케네에서 달을 다 채우지 못하고 나온 아기가 바로 이 사람이었어요. 그날 아침 올림포스산에서 오간 맹세 하나 때문에 이 사람이 왕이 되었지요. 헤라클레스가 조금만 먼저 태어났다면, 저 왕좌에 앉아 있는 것은 헤라클레스였고요. 두 사람 다 그것을 알고 있었어요.</p><p>왕은 헤라클레스가 들어오는 것을 보고 자리에서 반쯤 일어섰다가 도로 앉았어요. 그러고는 옆에 선 사람에게 무어라 소곤거렸지요.</p><p>그 옆에 선 사람은 왕의 말을 대신 전하는 사람이었어요. 뒷날 왕은 여러 해 동안 이 사람을 통해서만 명령을 내리게 돼요. 다만 그날은 아직 왕이 직접 입을 열었지요.</p><p>“누가 너를 나한테 보냈다고 했지?” 왕이 물었어요.</p><p>“델포이의 아폴론입니다.”</p><p>“내가 시키는 일을 열두 번 하겠다고 했고?”</p><p>“예, 열두 가지 일입니다.”</p><p>왕은 팔걸이를 손가락으로 몇 번 두드렸어요. 방 안에 있던 사람들이 다 왕 쪽을 보았어요. 왕은 무엇을 시켜야 할지 정해 두지 않았던 거예요. 이런 사람이 문간에 서 있을 줄은 몰랐으니까요.</p><p>왕의 눈이 방 안을 한 바퀴 돌다가 벽에 걸린 짐승 가죽에 닿았어요. 아주 오래된 가죽이었어요. 색이 다 바래서 무슨 짐승이었는지도 알아보기 어려웠지요.</p><p>“네메아라는 골짜기가 있다.” 왕이 말했어요. “거기 사자가 한 마리 산다. 사람이 여럿 갔는데 아무도 돌아오지 않았어. 그 가죽을 가져오너라.”</p><p>헤라클레스는 알겠다고 했어요. 방 한가운데에 서서 그렇게만 대답했지요. 무엇을 해야 하는지 말해 주는 사람이 앞에 있는 것이 여러 날 만이었어요. 그것만으로 발끝에 힘이 조금 돌아왔어요.</p><p>헤라클레스가 돌아섰어요. 문간을 나서는데 등 뒤에서 왕이 한마디를 보탰지요.</p><p>“돌아오지 못해도 나를 원망하지 마라.”</p><h2>화살이 튕겨 나가는 짐승</h2><p>골짜기로 떠나기 전에 헤라클레스는 미케네에서 활을 하나 얻었어요. 테베에 두고 온 것은 가지러 가지 않았어요.</p><p>네메아 골짜기로 들어가는 길에는 마을이 셋 있었어요. 셋 다 비어 있었지요. 문이 열린 채였고, 마당에 널어 둔 것이 그대로 말라 있었어요.</p><p>세 번째 마을 끝에 노인이 한 사람 남아 있었어요. 다리가 성치 않아 따라가지 못한 사람이었지요. 노인은 헤라클레스를 보더니 지팡이로 골짜기 안쪽을 가리켰어요.</p><p>“저 안에 굴이 있소.” 노인이 말했어요. “들어가는 데가 두 군데요. 앞에서 몰면 뒤로 나오고, 뒤에서 몰면 앞으로 나오지.”</p><p>헤라클레스는 그 말을 속으로 두 번 되뇌었어요. 노인은 물 한 그릇을 내주고는 더 말하지 않았어요. 골짜기 안은 낮인데도 어두웠어요. 바위 그늘이 길게 누워 있었거든요. 새소리가 하나도 나지 않았어요.</p><p>사자는 넓적한 바위 위에 엎드려 있었어요. 소 두 마리를 합쳐 놓은 것만 했지요. 갈기가 어깨를 다 덮고 있었고, 그 갈기 속에서 눈만 이쪽을 보고 있었어요.</p><p>헤라클레스는 화살을 메겼어요. 산에서 배운 대로 숨을 반쯤 뱉고 손을 놓았지요. 화살은 곧게 날아가 사자의 어깨에 닿았어요. 그리고 튕겨 나갔어요.</p><p>헤라클레스는 두 번 더 쏘았어요. 두 번 다 똑같았어요. 돌에 맞은 것처럼 튀어서 옆으로 굴렀지요. 헤라클레스는 굴러 온 화살 하나를 주워 보았어요. 촉이 뭉개져 있었어요.</p><p>사자가 일어섰어요. 헤라클레스는 골짜기 옆에 서 있던 올리브나무 한 그루를 뿌리째 뽑았어요. 잔가지를 쳐 내고 굵은 쪽을 손에 쥐었지요. 그 몽둥이는 그날부터 헤라클레스 손에서 떠나지 않게 돼요.</p><p>그런데 몽둥이도 소용이 없었어요. 내리치면 소리는 크게 났어요. 사자는 몸을 한 번 털고 다시 자세를 낮췄지요.</p><p>사자가 뛰었어요. 헤라클레스는 옆으로 굴러 피했어요. 두 번째로 뛰었을 때는 피하지 못했고요. 등이 바위에 부딪혔어요. 숨이 한참 돌아오지 않았어요.</p><p>헤라클레스는 그제야 알았어요. 이 짐승한테는 밖에서 하는 것이 하나도 통하지 않는다는 것을요. 활도 몽둥이도 다 밖에서 하는 것이었지요.</p><p>그 사이에 사자가 굴 쪽으로 물러났어요. 헤라클레스는 바위에 기대앉은 채로 그것을 보았어요. 그러고는 노인이 한 말을 떠올렸지요. 들어가는 데가 두 군데라던 말이요.</p><p>헤라클레스는 골짜기를 빙 돌아 뒤쪽 입구로 갔어요. 그리고 바위를 날라다 그 구멍을 막았어요. 어른 키만 한 바위를 셋이나 굴려 왔지요. 다 막고 나서 손바닥을 털었어요.</p><p>바위를 옮기는 동안 굴 안에서는 아무 소리도 나지 않았어요. 사자가 그 소리를 듣고 있는지 어떤지는 알 수 없었지요.</p><p>“이제 굴로 들어간다.”</p><p>헤라클레스가 앞쪽 굴 입구에 서서 그렇게 말했어요. 대답할 사람이 없는데도요. 그날은 소리를 한 번 내야 발이 떨어졌거든요.</p><p>헤라클레스는 두 손을 한 번 쥐었다 폈어요. 통하는 것은 맨손으로 붙잡는 것뿐이었어요. 그다음에 굴로 들어갔어요. 몽둥이는 밖에 두고 갔어요. 안은 캄캄했어요.</p><p>굴 안에서 무슨 일이 있었는지는 아무도 보지 못했어요. 골짜기 밖까지 소리가 났다는 사람도 있고, 아무 소리도 안 났다고 하는 사람도 있어요.</p><p>한참 뒤에 헤라클레스가 굴에서 나왔어요. 어깨에 사자를 메고 있었지요. 헤라클레스는 그것을 바닥에 내려놓고 그 옆에 오래 앉아 있었어요.</p><p>가죽을 벗기는 데 사흘이 걸렸어요. 어떤 칼도 들어가지 않았거든요. 돌에 갈아 날을 새로 세워 봐도 마찬가지였어요.</p><p>사흘째 저녁에 헤라클레스는 사자의 앞발을 들여다보았어요. 발톱이 안쪽으로 굽어 있었지요. 헤라클레스는 그 발톱 하나로 가죽을 그어 보았어요. 가죽이 갈라졌어요.</p><p>헤라클레스는 그 가죽을 걸쳤어요. 머리 쪽을 뒤집어쓰고, 앞발 두 개를 가슴 앞에서 묶었지요. 무거웠어요. 그런데 화살도 칼도 들어가지 않는 것을 몸에 두르고 있으니 걸음이 이상하게 가벼웠어요.</p><p>골짜기를 나오는데 세 번째 마을에 사람이 몇 늘어 있었어요. 소식이 벌써 앞질러 간 모양이었지요. 지팡이를 짚은 노인이 마당에 나와 있었어요.</p><p>“들어가는 데를 하나 막았소?” 노인이 물었어요.</p><p>“예, 뒤쪽 입구를 막았습니다.”</p><p>노인은 고개를 두어 번 끄덕이고는 도로 앉았어요. 헤라클레스는 물그릇을 돌려주고 길을 떠났어요. 마을 사람들이 문을 하나씩 열고 있었지요.</p><p>미케네로 돌아가는 길에 사람들이 담 위로 올라가 그것을 보았어요. 아이들이 뒤를 따라오다가 어른들 손에 붙들렸지요. 그런데 아무도 소리를 지르지는 않았어요.</p><p>성문 앞에서 문지기가 창을 떨어뜨렸어요. 헤라클레스는 그것을 주워 문지기 손에 다시 쥐여 주었어요. 큰 방 문이 열렸어요. 사자 머리를 뒤집어쓴 사람이 들어섰어요. 갈기가 어깨를 다 덮고 있었고, 그 그늘 속에서 눈만 이쪽을 보고 있었지요.</p><p>왕이 벌떡 일어섰어요. 그러고는 왕좌 옆으로 세 걸음을 갔어요. 청동 항아리 뚜껑이 열렸다가 닫혔어요. 방 안에 있던 사람들이 아무도 움직이지 않았어요. 헤라클레스는 가죽을 벗어 바닥에 내려놓았어요. 그러고는 항아리 앞에 서서 기다렸지요.</p><p>항아리 안에서 소리가 났어요.</p><p>“열둘 가운데 하나다.”</p></article></noscript>
