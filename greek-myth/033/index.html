  <noscript><article class="ns-text"><h1>저승에서 가져온 상자</h1><h2>바닥에 쏟아진 씨앗</h2><p>아프로디테가 자루를 기울이자 씨앗이 바닥으로 쏟아졌어요. 밀도 있고 보리도 있고 콩도 있고 기장도 있었어요. 참깨까지 섞여 있었지요. 쏟아지는 소리가 한참 동안 났어요.</p><p>자루가 다 비었을 때 씨앗 더미는 프시케의 무릎까지 왔어요. 프시케는 그 앞에 서서 아무 말도 하지 않았어요.</p><p>“이 씨앗을 종류대로 갈라 놓아라.” 아프로디테가 말했어요. “내일 해가 뜨기 전까지 다 끝내야 한다.”</p><p>문이 닫혔어요. 밖에서 빗장 지르는 소리가 났지요. 프시케가 그 문 안으로 들어온 것은 사흘 전이었어요. 이틀 밤을 계단에서 자고, 사흘째 되는 날 아침에야 문이 열렸거든요. 안에서는 아무도 왜 왔느냐고 묻지 않았어요.</p><p>프시케는 그 자리에 앉았어요. 손으로 한 줌을 떠서 무릎 위에 놓아 보았어요. 밀 한 알을 골라내는 데 숨 한 번이 들었어요. 그 한 줌을 다 고르고 나니 손가락이 뻐근했지요. 프시케는 무릎 위의 씨앗을 도로 더미에 부었어요. 창밖은 벌써 어두웠어요.</p><p>밤이 깊어지자 신전 어딘가에서 사람들이 웃는 소리가 났어요. 프시케는 그 소리를 들으면서 무릎에 얼굴을 묻었어요. 울지는 않았어요. 울면 씨앗이 안 보일 것 같았거든요.</p><p>한참 뒤에 바닥에서 무언가 움직였어요. 프시케는 처음에 씨앗 더미가 무너지는 줄 알았어요. 그게 아니었어요. 개미였어요. 한 마리가 아니었어요. 문틈으로도 들어오고, 벽 아래 갈라진 자리에서도 올라왔어요. 마룻바닥이 까맣게 보일 만큼 많았지요.</p><p>개미들은 씨앗 더미로 곧장 갔어요. 그러고는 한 알씩 물어서 옮기기 시작했어요. 밀은 밀끼리, 보리는 보리끼리, 콩은 콩끼리요. 누가 시킨 것처럼 줄이 딱딱 맞았어요.</p><p>프시케는 무릎을 안고 앉아서 그것을 보았어요. 도와주려고 손을 대었다가, 개미 한 마리가 밀알을 놓치는 것을 보고 손을 뗐지요. 대신 문틈으로 들어오는 바람을 옷자락으로 막았어요. 바람이 한 번 들어올 때마다 줄이 흐트러졌거든요.</p><p>그런데 참깨 앞에서는 개미들이 자꾸 돌아 나갔어요. 너무 작아서 물면 미끄러졌거든요. 참깨는 밀알 사이사이에 그대로 남았어요.</p><p>프시케는 그 앞에 엎드렸어요. 그러고는 손톱 끝으로 참깨를 하나씩 밀어내기 시작했어요. 마룻널 틈에 낀 것은 손톱을 넣어 파냈지요. 손톱이 하나 깨졌어요. 프시케는 그 손으로 계속했어요.</p><p>개미들은 밤새 멈추지 않았어요. 프시케도 멈추지 않았고요. 새벽에 개미들이 왔던 길로 도로 나갈 때, 프시케 앞에는 참깨 무더기가 하나 따로 놓여 있었어요.</p><p>해가 뜨고 아프로디테가 들어왔어요. 다섯 무더기가 나란히 놓여 있었어요. 아프로디테는 그 앞에 한참 서 있었지요.</p><p>“이걸 네 손으로 다 한 게 아니지?”</p><p>“개미들이 도와주었습니다. 참깨 한 무더기는 제가 골랐습니다.”</p><p>아프로디테는 프시케의 손을 한 번 보았어요. 그러고는 돌아섰어요. 문지방을 넘으면서 딱 한마디를 더 했지요.</p><p>“내일은 강으로 간다. 거기서 할 일이 있다.”</p><h2>강 건너의 양 떼</h2><p>강은 신전에서 반나절 거리에 있었어요. 물이 넓고 얕았어요. 건너편 풀밭에 양 떼가 있었지요. 털이 햇빛을 받아 노랗게 빛났어요. 금으로 만든 것처럼요. 프시케는 눈을 가늘게 뜨고 그쪽을 오래 보았어요.</p><p>“저 양들의 금빛 털을 한 줌 가져오너라.” 아프로디테가 말했어요.</p><p>아프로디테는 그 말만 하고 돌아갔어요. 프시케는 강가로 내려갔지요. 물은 정말 얕아 보였어요. 발을 담그려는데 발밑에서 갈대가 흔들렸어요. 바람은 불지 않았는데도요.</p><p>“지금은 강을 건너지 마세요.”</p><p>프시케는 뒤로 물러섰어요. 갈대가 다시 말했어요.</p><p>“저 양들은 볕이 뜨거울 때는 사나워요. 아무도 못 건드립니다. 해가 기울 때까지 기다리세요. 그러면 물을 마시러 강으로 내려옵니다.”</p><p>“양들이 물을 마시러 내려오면 그때 건너가면 됩니까?”</p><p>“네. 그때 양들이 없는 아래쪽으로 건너가세요. 가시덤불마다 털이 걸려 있을 겁니다. 그것만 걷으면 돼요.”</p><p>강가에는 아무도 없었어요. 그런데 프시케는 누가 보고 있다는 느낌을 지울 수 없었어요. 언덕 위 소나무 그늘에 옷자락 같은 것이 잠깐 비쳤다가 사라졌거든요.</p><p>프시케는 그늘에 앉아서 기다렸어요. 볕이 기울 때까지 강물만 보았지요. 물 위로 잠자리가 몇 번 지나갔어요. 기다리는 동안 프시케는 갈대에게 왜 알려 주었느냐고 물었어요. 갈대는 대답하지 않았지요. 물이 밀 때마다 저 혼자 흔들릴 뿐이었어요.</p><p>해가 낮아지자 양들이 하나둘 강으로 내려왔어요. 물 마시는 소리가 건너편까지 들렸어요. 프시케는 그 사이에 아래쪽으로 내려가 물을 건넜어요. 가시덤불은 강가를 따라 길게 뻗어 있었지요. 털은 생각보다 많이 걸려 있었어요. 프시케는 그것을 하나하나 걷어서 옷자락에 모았어요. 가시에 팔이 긁혔지만 멈추지 않았어요.</p><p>저녁에 프시케가 금빛 털 한 뭉치를 안고 돌아왔어요. 아프로디테는 그것을 받아 들고 손으로 한 번 문질러 보았지요.</p><p>“이번에는 누가 방법을 알려 주었느냐?”</p><p>“강가의 갈대가 알려 주었습니다.”</p><p>아프로디테는 웃지 않았어요. 대신 마당 구석에 놓인 작은 나무 상자를 한 번 보았어요. 프시케도 그 상자를 보았지요. 그때는 그게 무엇인지 몰랐어요.</p><h2>허물어진 탑이 알려 준 길</h2><p>사흘 뒤에 아프로디테가 프시케를 불렀어요. 손에 그 나무 상자가 들려 있었어요. 뚜껑에는 아무 무늬도 없었어요.</p><p>“저승에 다녀오너라.” 아프로디테가 말했어요. “가서 페르세포네에게 이 상자를 내밀고, 조금만 나눠 달라고 해라. 받아서 그대로 들고 오면 된다.”</p><p>“무엇을 나눠 달라고 합니까?”</p><p>“그건 네가 알 것 없다.”</p><p>프시케는 상자를 받아 들었어요. 가벼웠어요. 안에 아무것도 안 들어 있는 것 같았지요. 저승으로 내려가는 길을 프시케는 몰랐어요. 산 사람이 그 길을 아는 경우는 없으니까요. 물어볼 데를 찾아 언덕을 오르다가 프시케는 허물어진 탑 하나를 보았어요. 돌이 반쯤 무너져 내린 아주 오래된 탑이었지요.</p><p>프시케가 그 아래 앉아 쉬는데 탑에서 소리가 났어요.</p><p>“저승에 가려거든 그리로는 못 간다.”</p><p>프시케는 벌떡 일어섰어요.</p><p>“그럼 어디로 가야 합니까?”</p><p>“남쪽으로 가면 바위에 갈라진 틈이 있다. 거기로 내려가거라.”</p><p>“떠나기 전에 빵을 두 조각 구워라.” 탑이 말을 이었어요.</p><p>“빵은 왜 두 조각입니까?”</p><p>“하나는 갈 때 문 앞의 개에게 주고, 하나는 올 때 준다. 동전도 두 닢이다. 강을 건널 때 사공에게 갈 때 한 닢, 올 때 한 닢을 준다.”</p><p>프시케는 손가락을 두 번 꼽아 보았어요. 돌아오는 길까지 세어 준 셈이었지요. 프시케는 자루 끈을 한 번 고쳐 맸어요.</p><p>“저 아래에서는 아무것도 얻어먹지 마라. 물 한 모금도 안 된다. 누가 무엇을 부탁해도 걸음을 멈추지 말고.”</p><p>“지킬 것이 그게 다입니까?”</p><p>“하나 더 있다. 페르세포네에게 받은 상자는 절대 열지 마라.”</p><p>프시케는 고개를 끄덕였어요. 어디선가 들어 본 말 같았지만 어디서 들었는지는 떠오르지 않았지요. 바위 틈은 정말 남쪽에 있었어요. 안으로 들어가니 길이 아래로 아래로 이어졌어요. 걸을수록 공기가 차가워졌어요. 프시케는 한 손으로 벽을 짚고, 한 손으로 상자를 안고 걸었지요.</p><p>길에서 프시케는 여러 사람을 지나쳤어요. 다들 같은 쪽으로 걸어가고 있었지요. 아무도 뒤를 돌아보지 않았어요. 그 가운데 위에서 내려온 사람은 프시케뿐이라, 걸음 소리도 프시케 것만 달랐어요.</p><p>가는 길에 어떤 노인이 나뭇짐을 지고 가다가 한 단을 떨어뜨렸어요.</p><p>“얘야, 떨어진 나뭇단 좀 집어 주렴.”</p><p>프시케는 걸음을 늦추었어요. 손이 저절로 나뭇단 쪽으로 내려갔지요. 그러다가 탑이 한 말을 떠올리고 그대로 걸었어요. 그 미안한 마음은 한참 뒤까지 남았어요.</p><p>강이 나왔어요. 스틱스강이었어요. 물이 아주 검고 아무 소리도 나지 않았어요. 나룻배 하나가 기슭에 대어 있었고, 늙은 사공이 삿대를 짚고 서 있었지요.</p><p>사공은 프시케를 위아래로 훑어보았어요. 산 사람이 온 것이 반갑지 않은 얼굴이었어요. 프시케는 아무 말 없이 동전 한 닢을 내밀었어요. 사공은 그것을 받아 넣고 배를 대어 주었지요. 배가 강 한가운데를 지날 때 물속에서 누가 프시케의 이름을 불렀어요. 아주 낮은 목소리였어요. 프시케는 앞만 보았어요. 사공도 손을 멈추지 않았고요.</p><p>건너편 문 앞에는 개가 있었어요. 머리가 셋이었지요. 케르베로스였어요. 세 머리가 한꺼번에 프시케 쪽으로 돌아왔어요.</p><p>프시케는 빵 한 조각을 꺼내 앞으로 던졌어요. 가운데 머리가 그것을 받아 물었어요. 나머지 두 머리가 그 빵을 두고 다투는 사이에 프시케는 문 안으로 들어갔지요. 등 뒤에서 개 짖는 소리가 한 번 크게 났어요. 프시케는 걸음을 빨리했지만 뒤는 돌아보지 않았어요.</p><h2>페르세포네의 방</h2><p>안은 조용했어요. 넓고, 어둡고, 아주 조용했어요. 발소리가 나면 그 소리가 벽을 타고 한참 굴러갔지요. 페르세포네는 낮은 의자에 앉아 있었어요. 무릎 위에 마른 꽃이 한 다발 놓여 있었어요. 위에서 가져온 꽃이었지요. 프시케가 들어오자 페르세포네가 고개를 들었어요.</p><p>“산 사람이구나.”</p><p>“심부름을 왔습니다. 이 상자에 조금만 나눠 주십시오.”</p><p>프시케가 상자를 내밀었어요. 페르세포네는 그것을 받아 들고 뚜껑에 손을 얹었어요. 그러고는 프시케를 한참 보았지요.</p><p>“이 상자를 보니 아프로디테가 보냈구나.”</p><p>“예.”</p><p>“앉아서 좀 쉬어라. 먹을 것을 내오마.”</p><p>“괜찮습니다. 아무것도 먹지 않겠습니다.”</p><p>페르세포네는 더 권하지 않았어요. 산 사람이 아래에서 무엇을 먹으면 어떻게 되는지 누구보다 잘 아는 이였으니까요.</p><p>“발이 왜 그렇게 상했느냐?”</p><p>“여기까지 먼 길을 걸어왔습니다.”</p><p>“여기까지 제 발로 걸어온 사람은 오랜만이구나.”</p><p>“위에는 지금 무슨 철이냐?”</p><p>“찬 바람이 붑니다.”</p><p>페르세포네는 고개를 끄덕였어요. 그러고는 무릎 위의 마른 꽃을 한 번 매만졌지요.</p><p>페르세포네가 상자를 들고 안쪽 방으로 들어갔어요. 프시케는 그동안 방 안을 둘러보았어요. 벽에 마른 꽃이 여러 다발 걸려 있었어요. 색이 다 바랬는데도 아무것도 버리지 않은 것 같았지요.</p><p>페르세포네가 나올 때 상자는 아까와 똑같아 보였어요. 무게도 그대로였고요.</p><p>“상자를 가져가거라. 뚜껑은 열지 말고.”</p><p>프시케는 상자를 받아 안았어요. 돌아서는데 페르세포네가 한마디를 더 했어요.</p><p>“위에 올라가거든, 볕이 좋은 날에 들판에 한번 가 보아라. 나 대신에.”</p><p>프시케는 무슨 들판인지 묻지 못했어요. 페르세포네가 벌써 등을 돌렸거든요. 돌아오는 길은 갈 때보다 짧게 느껴졌어요. 개에게 남은 빵 한 조각을 주었고, 사공에게 남은 동전 한 닢을 주었지요. 배 위에서는 이번에도 누가 이름을 불렀지만 프시케는 앞만 보았어요.</p><p>바위 틈으로 나왔을 때는 한낮이었어요. 볕이 너무 밝아서 프시케는 눈을 감았다가 천천히 떴어요. 풀 냄새가 났어요. 새소리도 났고요. 프시케는 풀밭에 앉아 상자를 무릎에 올려놓았어요.</p><p>열지 말라고 했어요. 탑도 그렇게 말했고 페르세포네도 그렇게 말했지요. 프시케는 그것을 다 기억하고 있었어요. 프시케는 자기 손을 내려다보았어요. 손톱이 깨져 있었고 팔에는 가시에 긁힌 자국이 줄줄이 나 있었어요. 며칠째 물에 비친 제 얼굴도 보지 못했지요.</p><p>상자 안에 든 것이 무엇인지 프시케는 짐작하고 있었어요. 아프로디테가 저승에서까지 얻어 오라고 할 만한 것이라면 하나뿐이었으니까요. 아름다움이요. 조금만 덜어 쓰면, 아주 조금만 덜어 쓰면 그이를 다시 만났을 때 이 얼굴이 아니어도 될 것 같았어요.</p><p>프시케는 뚜껑을 열었어요. 아무것도 없었어요. 향도 없고 빛도 없었어요. 그런데 눈꺼풀이 갑자기 무거워졌어요. 프시케는 상자를 놓쳤어요. 풀밭에 옆으로 쓰러졌고, 뚜껑이 그 옆에 굴렀지요.</p><p>상자에 들어 있던 것은 잠이었어요. 저승의 잠이요.</p><h2>날개가 지나간 자리</h2><p>그 무렵 에로스의 방에서는 창문이 열려 있었어요. 어깨의 자국은 이제 거의 옅어졌지요. 에로스는 며칠 전부터 창가에 앉아 있었어요. 그날은 앉아 있지 않았어요. 날개가 방을 한 번 스쳤고, 문틀에 걸어 둔 화살통이 흔들렸어요. 아프로디테가 그 소리를 듣고 올라왔을 때 방은 비어 있었지요.</p><p>에로스는 풀밭 위를 낮게 날았어요. 프시케를 찾는 데는 오래 걸리지 않았어요. 상자 뚜껑이 볕을 받아 반짝였거든요. 에로스는 옆에 무릎을 꿇고 앉았어요. 프시케의 눈과 이마 위에 얇게 깔려 있던 잠을 손으로 걷었어요. 걷은 잠을 상자에 도로 넣고 뚜껑을 닫았지요.</p><p>그러고는 화살 하나를 꺼내 뾰족하지 않은 쪽으로 프시케의 어깨를 톡 건드렸어요. 프시케가 눈을 떴어요.</p><p>“열지 말라는 걸 또 열었네요.” 에로스가 말했어요.</p><p>“열었어요.”</p><p>“상자에 든 저승의 잠 때문에 하마터면 영영 못 깰 뻔했어요.”</p><p>프시케는 일어나 앉으면서 에로스의 얼굴을 보았어요. 이번에는 등잔이 필요 없었지요.</p><p>“여기는 어떻게 오셨어요?” 프시케가 물었어요.</p><p>“방 창이 열려 있기에 날아왔습니다.”</p><p>“데인 어깨는 좀 어때요?”</p><p>“다 나았습니다. 자국만 남았어요.”</p><p>프시케는 그 자국을 보았어요. 손을 대어 보지는 않았어요. 에로스는 그 길로 올림포스산에 올라갔어요. 상자도 들고 갔고 프시케도 데리고 갔어요. 신들 앞에서 에로스는 길게 말하지 않았지요.</p><p>“이 사람과 살겠습니다.”</p><p>신들이 웅성거렸어요. 아프로디테는 기둥 옆에 서 있었어요. 아무 말도 하지 않았지요. 제우스가 아프로디테 쪽을 보았어요.</p><p>“네 아들이 화살을 하나도 안 썼다더구나.”</p><p>“저도 들었습니다.”</p><p>“화살 없이도 두 사람이 서로를 사랑하게 됐구나.”</p><p>아프로디테는 한참 뒤에 짧게 대답했어요.</p><p>“그렇게 됐습니다.”</p><p>제우스는 잔을 하나 가져오게 했어요. 신들이 마시는 잔이었어요. 그것을 마신 사람은 늙지도 않고, 저승으로 내려가지도 않지요.</p><p>제우스가 그 잔을 프시케에게 내밀었어요.</p><p>“받아라.”</p><p>프시케는 두 손으로 잔을 받았어요. 손톱이 깨진 손이었어요. 잔을 든 채로 잠깐 아프로디테 쪽을 보았지요. 아프로디테는 눈을 마주치지 않았어요. 다만 조금 뒤에 마당으로 내려와, 사람들이 춤추는 자리 끝에 섰어요.</p><p>그날 밤 에로스는 활을 벽에 기대어 놓고 그대로 두었어요. 화살통도 걸어 둔 채였고요. 그런 밤은 처음이었어요. 활은 이튿날 저녁까지 그 자리에 그대로 있었지요.</p><p>프시케는 그 밤에 잠을 잘 못 잤어요. 새벽에 마당으로 나가 하늘을 보았지요. 옆에 누가 나와 서는 기척이 났어요. 이번에는 얼굴을 확인하지 않아도 알 수 있었어요.</p><p>마당 한쪽에는 프시케의 자루가 놓여 있었어요. 그 안에는 기름이 다 없어진 등잔이 그대로 들어 있었어요. 프시케는 그 옆에 쪼그리고 앉았어요. 자루 밖으로 신발 한 켤레가 나와 있었지요. 저승에서 올라올 때 신었던 신발이었어요. 흙이 아직 마르지 않았고요.</p><p>“볕이 좋은 날에 들판에 한번 가 보아라.”</p><p>프시케는 아래에서 들은 그 말을 속으로 한 번 더 되뇌어 보았어요. 나 대신에, 하던 그 뒷말까지요. 어느 들판인지는 끝내 묻지 못했지요.</p></article></noscript>
