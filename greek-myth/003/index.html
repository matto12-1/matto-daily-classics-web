  <noscript><article class="ns-text"><h1>크레타섬의 아이</h1><h2>산에서 자란 아이</h2><p>맨발 하나가 동굴 밖으로 튀어나왔어요. 강보에 싸여 있던 아기가 이제 혼자 뛰어다니는 아이가 되어 있었지요. 뾰족한 돌을 밟았는데도 아이는 걸음을 멈추지 않았어요. 발바닥이 어찌나 단단한지 아프지도 않았거든요.</p><p>크레타섬의 아침이었어요. 바다에서 올라온 안개가 산허리에 걸렸다가 해가 뜨면 슬며시 물러났어요. 새들이 먼저 깨어 골짜기를 한 바퀴 돌았고, 그다음에 염소들이 방울을 흔들며 바위 사이로 흩어졌지요. 낮이 되면 바람이 올리브나무 잎을 뒤집어 은빛으로 만들었어요.</p><p>그 산꼭대기 동굴이 아이의 집이었어요.</p><p>아이는 염소보다 빠르게 비탈을 뛰어올랐어요. 나뭇가지 하나를 들면 그것으로 하루 종일 놀았어요. 웃음소리가 크고, 목소리는 더 컸어요. 화를 낼 때는 골짜기 저쪽까지 소리가 울려서, 산 아래 새들이 한꺼번에 날아오르기도 했지요.</p><p>아이의 이름은 제우스였어요. 세상에서 그 이름을 아는 사람은 아직 몇 되지 않았어요. 님프들끼리도 그 이름을 소리 내어 부르는 일은 드물었어요. 꼭 필요할 때만, 아주 작은 목소리로 불렀지요.</p><p>제우스는 자기가 왜 이 산에서만 사는지 몰랐어요. 산 아래로 내려가면 안 된다는 말만 어릴 때부터 수없이 들었지요. 왜냐고 물으면 어른들은 늘 다른 이야기를 꺼냈어요. 그러면 제우스는 더 묻지 않고 다시 밖으로 뛰어나갔어요. 뛰어놀 일이 많은 아이에게는, 대답 없는 질문 하나쯤 미뤄 두는 일이 그리 어렵지 않았거든요.</p><p>제우스를 키운 것은 이 산의 님프들이었어요. 님프들은 바위틈과 샘가에 사는 이들인데, 사람보다 오래 살고 나무나 물과 이야기를 나눌 줄 알았어요. 그들은 제우스에게 헤엄치는 법을 가르쳤고, 어느 열매를 먹어도 되는지, 어느 버섯을 건드리면 안 되는지도 알려 주었어요.</p><p>갓난아기였을 때 제우스는 염소젖을 먹고 자랐어요. 산에서 가장 순한 암염소가 날마다 동굴 앞으로 걸어왔고, 님프들이 그 젖을 짜서 먹였지요. 조금 더 자란 뒤에는 벌집에서 떠낸 꿀을 손가락에 찍어 주었어요. 제우스가 처음 배운 맛은 그래서 젖과 꿀이었어요. 어른이 된 뒤에도 제우스는 벌이 붕붕거리는 소리를 들으면 이상하게 마음이 놓였다고 해요.</p><p>동굴 앞마당에는 늘 젊은이들이 몇 명 있었어요. 그들은 하루에 몇 번씩 방패를 두드리며 빙글빙글 돌았어요. 창으로 방패를 치면 쨍강쨍강 소리가 골짜기를 가득 채웠지요. 어떤 날은 아침에, 어떤 날은 한밤중에도 그 소리가 났어요.</p><p>제우스는 그 소리를 자장가처럼 듣고 자랐어요. 어릴 때는 그게 그냥 신나는 놀이인 줄 알았어요. 그래서 걸음마를 뗀 뒤로는 자기도 나뭇가지로 바위를 두드리며 따라 돌았지요.</p><p>하지만 놀이가 아니었어요. 아기가 울면 그 울음소리가 바다를 건너갈까 봐, 그들은 일부러 더 크게 방패를 두드렸던 거예요. 여러 해 동안 하루도 빠짐없이요. 제우스가 그 사실을 알게 된 것은 훨씬 뒤의 일이었어요.</p><p>제우스가 열 살쯤 되었을 때부터 질문이 늘기 시작했어요.</p><p>왜 이 산에는 아이가 나 하나뿐일까. 왜 어른들은 밤중에도 방패를 두드릴까. 왜 배가 지나갈 때마다 님프들은 나를 동굴 안으로 들여보낼까. 질문은 하나씩 늘어나서, 나중에는 주머니에 든 돌멩이처럼 걸을 때마다 달그락거렸어요.</p><p>“나한테는 왜 아버지가 없어요?”</p><p>어느 날 저녁, 제우스가 불 앞에 앉아 물었어요. 님프 하나가 나뭇가지를 부러뜨려 불에 넣었어요. 불꽃이 잠깐 크게 일었다가 가라앉았지요.</p><p>“없는 게 아니라 멀리 있는 거란다.”</p><p>“얼마나 멀리요?”</p><p>“아주 멀리.”</p><p>제우스는 그 대답이 마음에 들지 않았어요. 산 아래도 멀고, 바다 건너도 멀고, 별도 멀어요. 멀다는 말은 아무것도 알려 주지 않는 말이었어요.</p><p>그날 밤 제우스는 오래 잠들지 못했어요. 동굴 천장에 불빛이 어른거렸어요. 자기를 키워 준 님프들은 다들 다정했지만, 어떤 질문 앞에서는 하나같이 눈을 피했어요. 어른들이 눈을 피할 때 아이들은 대개 그것을 알아채요. 제우스도 그랬어요. 그럴 때마다 제우스는 대답 대신 새 질문을 하나 더 얻어 돌아왔어요.</p><p>그때부터 제우스는 산꼭대기 바위에 자주 올라갔어요. 거기 앉으면 바다 끝까지 보였거든요. 저 물 너머에 무엇이 있는지 제우스는 알고 싶었어요.</p><h2>바위 위에서</h2><p>어느 봄날 아침, 제우스는 그 바위에 앉아 한참을 내려다보았어요.</p><p>바다는 잘게 부서진 은처럼 반짝였어요. 저 멀리 물 위에 조그만 점 하나가 떠 있었는데, 그게 배라는 것을 제우스는 알고 있었어요. 배에는 사람이 타요. 사람들은 어딘가에서 와서 어딘가로 가요. 그러니까 세상에는 이 산 말고도 갈 데가 아주 많다는 뜻이었지요.</p><p>제우스는 그 점이 사라질 때까지 눈을 떼지 않았어요. 배가 수평선 너머로 넘어가자 가슴 한쪽이 이상하게 허전해졌어요.</p><p>머리 위로 독수리 한 마리가 원을 그리며 돌았어요. 제우스는 팔을 뻗어 그 그림자를 손바닥에 받아 보았어요.</p><p>“너는 아무 데나 갈 수 있어서 좋겠다.”</p><p>독수리는 대답 대신 날개를 한 번 크게 폈어요. 그러고는 바다 쪽으로 미끄러지듯 날아갔어요. 제우스는 그 모습을 눈으로 끝까지 좇았어요. 독수리가 점이 되고, 점이 사라질 때까지요.</p><p>그날 제우스는 처음으로 산 아래까지 걸어 내려가 보았어요. 바위가 끝나고 흙이 시작되는 곳까지요. 발밑에서 마른 풀이 바스락거렸어요. 바닷가에 닿기 전에 다시 돌아섰지만, 돌아서는 발걸음이 예전 같지 않았어요. 산이 조금 작아진 것 같았거든요.</p><p>동굴로 돌아온 제우스는 님프들 앞에 서서 말했어요.</p><p>“제가 왜 이 산에서만 살아야 하는지, 이제 진짜 이야기를 해 주세요.”</p><p>님프들은 서로를 바라보았어요. 아무도 먼저 입을 열지 못했어요. 샘물 떨어지는 소리만 또박또박 들렸어요. 가장 나이 많은 님프가 한참 만에 말했어요.</p><p>“그 이야기는 우리가 할 수 있는 게 아니야. 그건 네 어머니가 해야 한단다.”</p><p>“어머니요?”</p><p>제우스는 그 말을 처음 들었어요. 정확히 말하면, 자기에게 어머니가 있다는 것을 그날 처음 확실히 알았어요. 어머니라는 낱말은 알고 있었어요. 새끼 염소에게도 어미가 있으니까요. 다만 그 낱말이 자기에게도 붙는다는 생각은 한 번도 해 본 적이 없었지요.</p><p>“그럼 어머니는 어디 계세요?”</p><p>“해마다 한 번씩 이 섬에 오셨단다. 네가 잠든 밤에만.”</p><p>제우스는 그 자리에 우뚝 섰어요. 잠든 밤에만이라는 말이 이상하게 오래 남았어요. 그러니까 누군가 여러 해 동안 이 동굴 앞까지 왔다가, 자기 얼굴만 들여다보고 조용히 돌아갔다는 이야기였으니까요. 자다가 얼핏 느꼈던 서늘한 손길이 떠올랐어요. 꿈인 줄만 알았던 그 손길이요.</p><p>제우스는 그날부터 밤에 잠을 자지 않으려고 애썼어요. 눈꺼풀이 무거워지면 찬물로 얼굴을 씻었어요. 첫날 밤에는 아무 일도 없었어요. 둘째 날 밤에도요.</p><p>사흘째 되던 밤, 동굴 밖에서 발소리가 났어요. 덩굴이 부스럭거리며 젖혀졌어요. 제우스는 벌떡 일어났어요.</p><h2>산을 오르는 사람</h2><p>달빛을 등지고 한 사람이 서 있었어요. 옷자락이 길고, 어깨에 밤바람이 묻어 있었어요. 손에는 아무것도 들고 있지 않았어요.</p><p>동굴 밖에서는 밤벌레가 울고 있었어요. 그 소리마저 어쩐지 조심스러웠지요.</p><p>두 사람은 한동안 아무 말도 하지 않았어요. 레아였어요. 레아는 제우스를 보고, 제우스는 레아를 보았어요. 레아의 눈이 제우스의 얼굴 위를 천천히 지나갔어요. 이마에서 코로, 코에서 턱으로요. 여러 해 동안 잠든 얼굴만 보았으니, 눈을 뜬 얼굴은 그날이 처음이었지요.</p><p>“많이 컸구나.”</p><p>레아가 말했어요. 목소리가 조금 갈라졌어요. 제우스는 무슨 말을 해야 할지 몰랐어요. 물어보고 싶은 것이 백 가지쯤 있었는데, 막상 입에서 나온 것은 하나뿐이었어요.</p><p>“왜 밤에만 오셨어요?”</p><p>레아는 대답 대신 동굴 안으로 들어와 불 앞에 앉았어요. 불이 사그라들고 있어서 님프 하나가 마른 가지를 몇 개 얹어 주고는 조용히 밖으로 나갔어요. 레아는 제우스에게 옆자리를 가리켰어요.</p><p>제우스가 앉자 레아는 아들의 손을 잡았어요. 손이 크고 단단했어요. 손바닥에는 굳은살이 박여 있었고, 손톱 밑에는 흙이 끼어 있었어요. 레아가 마지막으로 잡아 본 손은 강보 밖으로 삐져나온 작은 주먹이었는데 말이지요.</p><p>“오늘은 다 이야기해 주마. 놀라지 말고 끝까지 들으렴.”</p><p>레아는 밤새 이야기했어요. 제우스가 처음 듣는 이름이 하나씩 늘어났어요. 카오스, 우라노스, 티탄. 제우스는 그 이름들을 손가락으로 바닥에 써 보았어요. 마지막에 쓴 이름이 크로노스였어요. 자기 아버지의 이름이었지요.</p><p>불이 두 번이나 사그라들었다가 다시 살아났어요. 제우스는 한 번도 끼어들지 않았어요.</p><p>날이 희끄무레해질 무렵, 레아가 손을 펴 보였어요. 손가락이 다섯이었어요. 태어나자마자 아버지에게 삼켜진 아이가 그만큼이라는 뜻이었지요. 레아는 그 대목을 말할 때 목소리를 낮추지도, 돌려 말하지도 않았어요. 아들이 알아야 할 일이라고 생각했거든요.</p><p>“그 아이들이 다 네 형과 누나들이란다.”</p><p>제우스는 형과 누나라는 말을 속으로 몇 번 되뇌어 보았어요. 한 번도 써 본 적 없는 낱말이었어요. 제우스의 손등에 힘줄이 툭 솟았어요.</p><p>“그럼 형과 누나들은 지금 어디 있어요?”</p><p>“아직 아버지 안에 있어. 죽은 게 아니야. 신은 그렇게 쉽게 사라지지 않는단다. 다섯 다 살아 있어. 다만 나올 길이 없을 뿐이지.”</p><p>레아는 잠깐 말을 멈추었다가 덧붙였어요.</p><p>“이 동굴을 알려 주신 분은 네 할머니 가이아셨어. 세상의 맨 처음에 나타난 땅의 여신이지. 그분이 아니었으면 너도 지금 여기 없었을 거야.”</p><p>동굴 안이 아주 조용해졌어요. 밖에서 염소 방울 소리가 한 번 딸랑, 하고 났다가 멎었어요.</p><p>제우스는 자리에서 일어나 동굴 입구로 걸어갔어요. 그리고 어두운 바다를 오래 내다보았어요. 어깨가 조금 흔들리는 것 같기도 했지만, 뒤돌아섰을 때 제우스의 얼굴은 울고 있지 않았어요.</p><p>“어머니.”</p><p>“그래.”</p><p>“그러니까 저는 혼자 살아남은 거네요.”</p><p>레아는 대답하지 못했어요. 그 말이 맞으니까요.</p><p>“형과 누나 다섯을 다 꺼내면 저는 혼자가 아니게 되는 거고요.”</p><p>레아가 고개를 들었어요. 아들이 화를 낼 줄 알았어요. 아버지를 미워하겠다고 소리칠 줄 알았어요. 여러 해 동안 이 밤을 상상하면서, 레아는 아들이 던질 원망을 다 받아 줄 각오를 하고 있었거든요.</p><p>그런데 제우스는 화를 내는 대신 셈을 하고 있었어요. 다섯을 꺼내면 여섯이 된다고요.</p><p>“형과 누나들을 꺼내러 산을 내려가려고?”</p><p>“네.”</p><p>“크로노스는 세상에서 가장 힘이 센 사람이란다. 지금 네 힘으로는 어림도 없어.”</p><p>“그러니까 힘으로는 안 되겠네요.”</p><p>제우스가 말했어요. 그러고는 불을 한참 들여다보았어요. 제우스는 무언가를 골똘히 생각할 때면 눈이 깊어졌어요. 왕좌에서 하늘을 올려다보던 크로노스가 꼭 그런 눈이었지요. 레아는 잠깐 마음이 서늘해졌어요. 밖에서 바람이 방향을 바꾸었는지, 불꽃이 한쪽으로 길게 누웠어요.</p><p>그날 밤 두 사람은 오래 이야기했어요.</p><p>레아는 아들에게 세상의 이야기를 들려주었어요. 티탄들이 어느 산에 사는지, 어느 골짜기가 위험한지, 왕이 언제 잠들고 언제 깨는지를요. 궁으로 올라가는 길이 몇 갈래인지, 어느 문에 파수가 서 있는지도 알려 주었어요. 제우스는 하나도 놓치지 않으려고 몇 번씩 되물었어요.</p><p>“어머니는 왜 저를 살리셨어요? 들키면 어머니가 위험하잖아요.”</p><p>레아는 잠깐 웃었어요. 웃는 얼굴을 보인 것은 그날 처음이었어요.</p><p>“아이를 다섯 번 빼앗기고 나니, 여섯 번째 아이만은 도저히 내줄 수가 없더구나.”</p><p>동굴 어귀가 희끄무레해지기 시작했어요. 새벽이 가까워지자 레아가 일어섰어요. 날이 밝기 전에 섬을 떠나야 했거든요. 동굴 어귀에서 레아가 돌아섰어요.</p><p>“하나만 약속해 다오. 준비되기 전에는 아버지 앞에 서지 않겠다고.”</p><p>제우스는 잠깐 생각하다가 고개를 끄덕였어요.</p><p>“준비되면 서겠다는 약속으로 들으셔도 돼요.”</p><p>레아는 뭐라고 대꾸하려다가 그만두었어요. 대신 아들의 이마에 손을 얹었다가 뗐어요. 그러고는 왔을 때처럼 조용히 산을 내려갔어요. 덩굴이 제자리로 돌아오며 사락 소리를 냈어요. 동굴 안에는 다 타 버린 불의 잿내만 남았지요.</p><p>해가 뜨자 제우스는 짐을 꾸렸어요. 꾸릴 짐이랄 것도 없었어요. 가죽끈 하나, 마른 빵 조금, 그리고 어릴 때부터 들고 다니던 나뭇가지 하나가 전부였지요.</p><p>님프들이 동굴 앞에 나와 섰어요. 아무도 말리지 않았어요. 언젠가 이런 아침이 온다는 것을 그들은 오래전부터 알고 있었거든요. 가장 나이 많은 님프가 제우스의 어깨를 두 번 두드렸어요. 다른 님프는 꿀을 담은 작은 병을 손에 쥐여 주었어요.</p><p>방패를 두드리던 젊은이들도 그날은 창을 내려놓고 서 있었어요. 골짜기가 그렇게 조용한 아침은 처음이었어요. 그 조용함 속에서 제우스는 자기가 얼마나 오래 이 소리에 감싸여 있었는지를 처음으로 느꼈어요.</p><p>제우스는 비탈을 내려가기 시작했어요. 한참을 내려가다가 문득 걸음을 멈추고 뒤를 돌아보았어요. 자기가 자란 산이 아침 햇빛 속에 우뚝 서 있었어요. 동굴 입구는 이미 보이지 않았어요. 제우스는 손을 한 번 들었다가 내리고, 다시 앞을 보고 걸었어요.</p><p>걸으면서 제우스는 생각했어요. 힘으로는 안 되겠구나. 아버지의 손은 하늘만큼 큰데, 나는 아직 그 손보다 작구나. 그러면 어떻게 해야 다섯을 꺼낼 수 있을까.</p><p>뱃속에 있는 것을 도로 나오게 하려면 어떻게 해야 하지. 삼킨 것을 도로 뱉게 하려면 무엇이 필요할까. 바다가 점점 가까워졌어요. 제우스는 그 질문 하나를 손에 꼭 쥔 채로 산을 다 내려왔어요.</p></article></noscript>
